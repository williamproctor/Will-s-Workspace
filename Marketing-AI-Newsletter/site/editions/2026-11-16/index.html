    initEditionApp(document.getElementById("editionApp"), {
      slug: "2026-11-16",
      editionTitle: "Week of November 16, 2026",
      editionMd: "# Monday Signal \u2014 Week of November 16, 2026\n\n> **Google began its November 2026 core update on Tuesday, November 10, made Gemini 4 Hydrogen AI Mode's default model on Thursday (per Robby Stein), and disclosed a logging error that under-reported Search Console's AI impressions for November 9\u201311; by Search Engine Journal's count, the first full week after the rollout includes Thanksgiving, Black Friday and Cyber Monday.** Ads appeared in AI Mode's follow-up answers, at the top of Bing's AI Mode and while ChatGPT draws images; Salesforce projected $75.8 billion in AI-driven Cyber Week spending, and 73% of the shoppers it surveyed aren't comfortable giving agents their payment information; The Trade Desk beat its own revenue guide by 13%; Yahoo Scout became the first licensee of a publishers' collective as Google lost a second round to SerpApi; and Google Ads said AI impersonation of public figures is banned even when disclosed. On the feed, Kevin Indig called OpenAI's new Business Hub \"a sort of Search Console for ChatGPT\" and NoGood, after counting 1 Hub click against 1,020 GA4 sessions, called it \"a business profile and not a search console\"; Glenn Gabe warned \"it might be hard to gauge visibility drops/surges accurately\"; and George Prodanov told ChatGPT advertisers, \"Your cap becomes an average\".\n\n---\n\n## The Conversation\n\n### OpenAI's Business Hub shows ChatGPT mentions and clicks, and NoGood counted 1 Hub click against 1,020 GA4 sessions\n\nOpenAI launched Businesses in ChatGPT in beta on Tuesday, November 10; a screenshot of its \"Claim your business in ChatGPT\" page had surfaced on Friday, November 6. A verified business sees Insights for the past 28 days, including \"the number of mentions and website clicks a business receives,\" and the help page says, \"For an online business, a mention counts when ChatGPT references the business's website. The brand name alone doesn't count...\" Kevin Indig called the Hub \"a sort of Search Console for ChatGPT,\" and SEL's Barry Schwartz wrote, \"It is amazing OpenAI is giving us click data, a metric Google and Microsoft refuse to offer in its AI reporting tools.\"\n\nComparing the Hub with GA4, NoGood's Mostafa ElBermawy found 65 mentions and 1 click against 1,020 ChatGPT sessions (windows offset by a day) and called the product \"a business profile and not a search console\" (he discloses that his company, Goodie AI, supplied NoGood's crawler data). Previsible counted 1,834 mentions and 12 clicks against 32 GA4 sessions, and SEJ reported 353,356 mentions and 2,663 clicks for itself, warning that \"A recorded click isn't a confirmed visit\". Under Indig's post, Tim Lane wrote that \"the more famous you are, the more Business Hub might undercount you,\" and Profound, which sells AI-visibility tracking, says brand names appear without a site reference \"nearly 50% of the time\" in its data.\n\n**Comment window:** open now; the first full 28-day window since launch closes in early December. Log the ratio of Hub clicks to GA4 sessions each month as the instrument's calibration, and if you're a big brand, check whether ChatGPT cites your own pages.\n\n**Source:** [OpenAI](https://openai.com/index/introducing-businesses-chatgpt/) \u00b7 [OpenAI Help](https://help.openai.com/en/articles/20001635-setting-up-your-business-on-chatgpt) \u00b7 [Gehani's post](https://www.linkedin.com/posts/tarungehani_big-if-true-openai-is-testing-a-claim-activity-7525543166381314048-R8tN) \u00b7 [Indig's post](https://www.linkedin.com/posts/kevinindig_this-is-one-of-the-most-impactful-developments-activity-7526000727446646784-E3qH) \u00b7 [Search Engine Land](https://searchengineland.com/chatgpt-business-hub-is-now-live-501350) \u00b7 [NoGood](https://nogood.io/blog/chatgpt-business-hub-vs-ga4/) \u00b7 [Previsible](https://previsible.com/ai-search/chatgpt-business-hub/) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/seo-pulse-core-update-chatgpt-business-hub-ai-modes-new-model/597135/) \u00b7 [Profound](https://www.tryprofound.com/blog/chatgpt-business-hub-profound) \u00b7 November 6\u201314, 2026\n\n### SEOs read the core update through split rank trackers, an under-logged AI report and a mid-rollout model change\n\nOn Wednesday, November 11, a day into the rollout, Glenn Gabe posted on X, \"With Google poisoning the SERPs for AI scrapers and now SEO tools, it might be hard to gauge visibility drops/surges accurately.\" He \"ran the numbers for ~1000 sites across a few verticals so far,\" posted Ahrefs and Semrush charts of the same sites (\"Notice any differences there between ahrefs and semrush? lol.\") and called Search Console data \"the source of truth (for now)\" (text as AEO Sherpa quotes it). The day before, Lily Ray had posted on LinkedIn, \"For the past couple weeks, I've received more inquiries than any time I can remember from companies recently receiving manual actions,\" and wondered whether that was connected to the update. Google hasn't linked the two, or the update and Hydrogen.\n\nAfter Hydrogen arrived on Thursday, Marie Haynes wrote that \"there's less need for searchers to click through to websites if Search can now produce charts and images,\" a prediction, since no Hydrogen click data has been published. Lawrence Hitches advised, \"My read: optimise more for the query fan-out.\" Under Google's LinkedIn announcement, Aristide D. wrote for advertisers that in AI Mode \"those longer questions go to broad match, AI Max, Shopping and PMax... So if my CTR shifts after Nov 12, this is the first thing I'll check before touching the ads.\"\n\n**Comment window:** open through the rollout (about November 24) and the December comparisons. The ranking system and the answer model changed in the same week the AI report under-logged, so read Search Console clicks against your own analytics before trusting any one tracker.\n\n**Source:** [Gabe on X](https://x.com/glenngabe/status/2120517778813641075) \u00b7 [AEO Sherpa](https://aeosherpa.com/news/ahrefs-and-semrush-split-on-core-update-day-one) \u00b7 [Ray's post](https://www.linkedin.com/posts/lily-ray-44755615_google-search-status-dashboard-activity-7525993341948203008-YYa1) \u00b7 [Haynes on X](https://x.com/Marie_Haynes/status/2120946277584437744) \u00b7 [seoweekly.news](https://seoweekly.news/stories/gemini-4-hydrogen-ai-mode-search-model) \u00b7 [Hitches's post](https://www.linkedin.com/posts/lawrence-hitches_google-just-updated-their-search-to-a-new-activity-7526786193498357760-r7qx) \u00b7 [Google's LinkedIn post](https://www.linkedin.com/posts/google_meet-gemini-4-hydrogen-bringing-cutting-edge-activity-7526707713305772033-BOJV) \u00b7 November 10\u201313, 2026\n\n### ChatGPT Ads' target bidding went live November 9, and one advertiser said OpenAI \"silently rejected\" 3,930 pixel events\n\nSince Monday, November 9, new ChatGPT conversion campaigns bid to a Target CPA and new click campaigns to a Target CPC, while existing campaigns keep Max Bid and Max CPC until January 1, 2027 (we covered the announcement last week). George Prodanov's LinkedIn summary that morning was \"Your cap becomes an average\", and OpenAI's help page says \"Individual clicks may cost more or less than your target.\"\n\nOn Tuesday, Ian McGavin wrote, \"When we launched ChatGPT Ads on our own account, OpenAI silently rejected 3,930 of our pixel events.\" That's one account's experience, and OpenAI hasn't commented, but its help page says target bidding uses \"available conversion signals\" and warns, \"Setup alone does not establish that usable conversion signals are being received.\" Thursday's weekly email to advertisers (via SER) renamed Maximize Results \"intelligent bidding,\" repeated that \"Actual costs may be higher or lower than your target,\" and added regional targeting and multi-condition product filters for product campaigns. In the API, OpenAI recommends the new target fields from November 18, after which legacy fields used to create a campaign \"will select Target CPA or Target CPC\".\n\n**Comment window:** open until January 1, 2027, when the caps retire for every campaign. Before moving a capped campaign to Target CPA, reconcile the pixel's accepted events against your own orders for the same days, since the system bids toward the conversions it receives.\n\n**Source:** [OpenAI Help](https://help.openai.com/en/articles/20001634-bidding-strategies-and-how-pricing-works-in-chatgpt-ads) \u00b7 [Prodanov's post](https://www.linkedin.com/posts/georgeprodanov_chatgptads-openai-ppc-activity-7525507375391215616--cDK) \u00b7 [McGavin's post](https://www.linkedin.com/posts/ian-mcgavin_chatgpt-ads-got-target-cpa-today-you-tell-activity-7526005412345716736-5PCy) \u00b7 [OpenAI's email, via Search Engine Roundtable](https://www.seroundtable.com/openai-chatgpt-ads-updates-42524.html) \u00b7 November 9\u201312, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and stages where the week's arguments actually happened.\n\n- **Tarun Gehani** (LinkedIn, November 9, the day before launch): \"My take: a mention count on its own is a vanity metric. Paired with prompt tracking, it becomes a check on the tools.\" [The post](https://www.linkedin.com/posts/tarungehani_big-if-true-openai-is-testing-a-claim-activity-7525543166381314048-R8tN)\n- **Mostafa ElBermawy, NoGood** (NoGood's blog, November 12): \"ChatGPT's Business Hub says it sent us 1 click. Google Analytics counted 1,020 sessions.\" [The post](https://nogood.io/blog/chatgpt-business-hub-vs-ga4/)\n- **Jordan Koene, Previsible** (Previsible's blog, November 13): \"Sessions and clicks are different measures, so the discrepancy doesn't establish that either system is wrong.\" [The post](https://previsible.com/ai-search/chatgpt-business-hub/)\n- **Lily Ray, Algorythmic and Amsive** (X, November 12): \"Wonder if Hydrogen will be less prone to manipulation and spam in AI answers than with the prior models used in AI Overviews.\" [The post](https://x.com/lilyraynyc/status/2120968959759691830)\n- **Gabriela Bob** (LinkedIn, commenting on George Prodanov's November 9 post): \"Just how quickly the platform is starting to resemble Google Ads. Hopefully they don't copy all the bad bits too!\" [The post](https://www.linkedin.com/posts/georgeprodanov_chatgptads-openai-ppc-activity-7525507375391215616--cDK)\n- **Jeff Green, CEO, The Trade Desk** (Q3 earnings call, November 9): \"Unlike the walled gardens of Amazon and Google and other user-generated content platforms, we are not grading our own homework.\" [Call transcript](https://www.investing.com/news/transcripts/earnings-call-transcript-the-trade-desk-beats-q3-2026-estimates-as-stock-jumps-93CH-5013686)\n- **Caila Schwartz, head of agentic commerce shopper insights, Salesforce** (Salesforce, November 12): \"My advice before Cyber Week is simple: Be the brand that AI can find and humans can trust\" [Salesforce](https://www.salesforce.com/news/stories/ai-first-holiday/)\n- **Sharon Cantor Ceurvorst, VP analyst, Gartner** (Gartner release, November 9): \"Marketing leaders can no longer take a passive approach to brand representation in AI-generated experiences.\" [Gartner](https://www.gartner.com/en/newsroom/press-releases/2026-11-09-gartner-survey-finds-42-percent-of-cmos-are-monitoring-brand-misinformation-in-ai-generated-content)\n\n---\n\n## This Week in Marketing AI\n\n### Google started a core update, put Gemini 4 Hydrogen in AI Mode and under-logged AI impressions for November 9\u201311\n\nGoogle's Search Status Dashboard logged \"the November 2026 core update, which applies globally and to all languages\" on Tuesday, November 10, adding, \"The rollout may take up to 2 weeks to complete.\" It's the third core update of 2026 (SEJ). On Thursday, Google brought Gemini 4 Hydrogen to Search, calling it \"the biggest model upgrade to Search yet.\" Robby Stein, Google's VP of product for Search, posted, \"It's now the new default model in AI Mode & being used for your hardest questions in AI Overviews\"; the default and AI Overviews claims are his, not the Search post's, and Google hasn't defined the hardest questions. The post promises \"a broader range of helpful links than before\" and \"more images, structured responses, comparison tables, and custom tools built for you,\" and SEJ noted that \"Neither the post nor Stein's thread provide counts for links or sites.\"\n\nThe same Thursday, Search Console Help added, \"A logging error caused a decrease in impressions on the Generative AI performance report in Search for data from November 9 - November 11, 2026. This issue affects data logging only.\" That's the Generative AI report, not the main Performance report, and Google hasn't said whether it will restore the data.\n\nGoogle advises waiting at least a full week after a core update has rolled out before comparing, and SEJ, going by Google's two-week estimate, calculated that \"the first full week after rollout would include U.S. Thanksgiving Day, Black Friday and Cyber Monday.\"\n\n*Editor's note, added at publication on November 16: When we checked, the Search Status Dashboard still showed only the November 10 entry for the core update, with no completion posted. [Google Search Status Dashboard](https://status.search.google.com/incidents/WLxcJyC6jMWMfryxsKMc)*\n\n**Source:** [Google Search Status Dashboard](https://status.search.google.com/incidents/WLxcJyC6jMWMfryxsKMc) \u00b7 [Google's Search post](https://blog.google/products-and-platforms/products/search/gemini-4-hydrogen-search-upgrade/) \u00b7 [Stein on X](https://x.com/rmstein/status/2120941443359576166) \u00b7 [SEJ on Hydrogen](https://www.searchenginejournal.com/google-gemini-4-hydrogen-default-ai-mode/597096/) \u00b7 [Search Console Help](https://support.google.com/webmasters/answer/6211453?hl=en) \u00b7 [Search Engine Land](https://searchengineland.com/google-search-console-performance-report-data-bug-nov-9-11-501899) \u00b7 [SEJ's SEO Pulse](https://www.searchenginejournal.com/seo-pulse-core-update-chatgpt-business-hub-ai-modes-new-model/597135/) \u00b7 November 10\u201314, 2026\n\n### Ads appeared in AI Mode's follow-up answers, at the top of Bing's AI Mode and while ChatGPT draws images\n\nOn Monday, November 9, Search Engine Roundtable reported Google's multiturn ads live in AI Mode; Barry Schwartz had seen them testing on Friday, November 6. Google's description, as SER quotes it, says \"Multiturn ads show up on responses to follow-up user queries as users engage in back-and-forth conversations with AI Mode,\" and \"Ads will be clearly labeled as 'Sponsored.'\" In SER's test they appeared on the third and fourth follow-ups. Google announced them with the AI Mode ad expansion we led with on November 2 and hasn't said they're fully rolled out. The same day SER showed a mobile test, spotted by Brodie Clark, with AI-generated summaries \"above the grouping of the sponsored results, summarizing all the ads from all the advertisers.\"\n\nAlso on Monday, SER reported that \"Microsoft is showing ads at the top of the Bing AI Mode (formerly Copilot Search) results,\" both search and shopping ads, and Schwartz wrote that \"the 'sponsored' labels on the Bing results are so muted, at first I didn't notice they were ads.\" Microsoft hasn't announced it.\n\nOn Tuesday, Juozas Kaziuk\u0117nas posted that ChatGPT had shown him an ad while generating an image, introduced with \"Here's an ad while we create your image.\" OpenAI announced the format on October 5. The same day, OpenAI's Businesses in ChatGPT launch said, \"Businesses can also sponsor their Business Agent and use it as the destination for ChatGPT Ads to reach more potential customers,\" with sponsored placements \"clearly labeled and separate from ChatGPT responses.\" Business Agents are a beta for eligible US ecommerce and online service businesses.\n\n**Source:** [SER on multiturn ads](https://www.seroundtable.com/google-ai-mode-multiturn-ads-42478.html) \u00b7 [SER on AI ad summaries](https://www.seroundtable.com/google-ads-ai-generated-summaries-42482.html) \u00b7 [SER on Bing](https://www.seroundtable.com/bing-ads-top-ai-mode-results-42479.html) \u00b7 [Kaziuk\u0117nas on X](https://x.com/juokaz/status/2120075933956600082) \u00b7 [OpenAI, October 5](https://openai.com/index/new-chatgpt-ads-format-and-measurement/) \u00b7 [OpenAI, November 10](https://openai.com/index/introducing-businesses-chatgpt/) \u00b7 November 6\u201310, 2026\n\n### Salesforce projects $75.8 billion in AI-driven Cyber Week spending and finds shoppers wary of agent checkout\n\nSalesforce's holiday outlook on Thursday, November 12, says \"AI is projected to drive $75.8 billion in Cyber Week spending, up 13% from 2025,\" and \"AI-driven recommendations are expected to influence more than 1 in 5 holiday orders.\" The release doesn't say which markets the figure covers or define \"AI-driven.\" By Salesforce's own measurement, traffic to ecommerce sites from AI tools is up 104% year over year, and shoppers arriving through AI referrals are \"more than two times as likely to convert as typical ecommerce shoppers.\"\n\nIts survey of more than 2,500 shoppers in the US, UK, Canada and Australia, with no fieldwork dates given, found that 31% have tried a personal agent, with Meta Muse the most adopted (12% of respondents). Of personal-agent users, 19% have used one at checkout, and 73% of shoppers \"aren't comfortable giving a personal AI agent their payment information.\" Among agent users, 27% say an agent \"bought something that was too expensive\" and 22% had one blocked. Caila Schwartz, who leads agentic commerce shopper insights, advised, \"Shoppers are starting with AI this season, so make sure your product data is accurate, your prices and inventory are current, and your own agent is ready to answer the hard questions.\" Salesforce sells commerce software, and its line that brands deploying AI shopping agents \"see seven times faster sales growth\" gives no base.\n\n**Source:** [Salesforce](https://www.salesforce.com/news/stories/ai-first-holiday/) \u00b7 November 12, 2026\n\n### The Trade Desk's revenue beat its own guide by 13%, and PubMatic, Zeta and Liftoff grew in the third quarter\n\nThe Trade Desk reported third-quarter revenue of $736 million on Monday, November 9, down 0.5% from a year earlier and 13% above its guide of \"at least\" $650 million, by our arithmetic. Its 10-Q says the quarter included \"$15 million of incremental revenue earned from a strategic partner that we do not expect to recur.\" Net income fell to $38 million from $116 million, and it guided fourth-quarter revenue to at least $755 million. CEO Jeff Green said in the release that \"we are still operating below the level of growth we expect from ourselves,\" and on the call, per Investing.com's transcript, that \"there once was a monopoly that controlled all of search, and the LLMs have created competition.\"\n\nPubMatic's revenue rose 17% to $79.6 million the same day, with CTV at about 21% of revenue and more than 120 \"agentic campaigns\" (its own category, up from 80-plus), including all five holding companies. Zeta's revenue rose 46% to $493 million, or 30% excluding Marigold and political candidate revenue, and it raised its full-year guide to $1,855 million at the midpoint. On Thursday, Liftoff reported revenue up 32% to $237.5 million and net income of $86.7 million; CEO Jeremy Bondy said the results \"came in well above the high end of our previously published guidance.\"\n\n**Source:** [The Trade Desk's release](https://investors.thetradedesk.com/news-and-events/news/news-details/2026/The-Trade-Desk-Reports-Third-Quarter-2026-Financial-Results/default.aspx) \u00b7 [The Trade Desk's 10-Q](https://www.sec.gov/Archives/edgar/data/1671933/000167193326000116/ttd-20260930.htm) \u00b7 [Call transcript (Investing.com)](https://www.investing.com/news/transcripts/earnings-call-transcript-the-trade-desk-beats-q3-2026-estimates-as-stock-jumps-93CH-5013686) \u00b7 [PubMatic's release](https://www.sec.gov/Archives/edgar/data/1422930/000142293026000036/q326pressrelease.htm) \u00b7 [Zeta's release](https://www.investors.zetaglobal.com/news/news-details/2026/Zeta-Global-Reports-21st-Consecutive-Beat-and-Raise-Quarter-Generates-Positive-GAAP-Net-Income-in-3Q26--YTD-and-Achieves-the-Rule-of-71/default.aspx) \u00b7 [Liftoff's release](https://www.sec.gov/Archives/edgar/data/1850351/000162828026073379/fy26q3earningsrelease.htm) \u00b7 November 9\u201312, 2026\n\n### Yahoo Scout became the first licensee of a publishers' collective, and Google lost a second round against SerpApi\n\nYahoo took Scout out of beta on Tuesday, November 10, after \"more than 3 billion answers\" by its own count, to \"underpin all of Yahoo Search\" in the US, UK, Europe and Switzerland, adding Pivot Search and a Scout app. On Thursday, the nonprofit Internet Licensing Collective (formerly the RSL Collective), which says it represents \"more than 3000 media brands, content owners and publishing platforms,\" signed Yahoo Scout as its first commercial customer. Digiday reports that the fee wasn't disclosed and that Yahoo declined an interview. The ILC's FAQ calls the license non-exclusive and projects expenses at or below 10%.\n\nOn Monday, Chief Judge Yvonne Gonzalez Rogers of the Northern District of California granted SerpApi's motion to dismiss Google's amended complaint, with leave to amend; it's the second dismissal. SerpApi's blog and Law360 reported the ruling, and the copy of the order we found sits on a third-party host, not the court's docket. Dismissal with leave to amend isn't a ruling that scraping Google is lawful, and SerpApi's account is the winning party's. Glenn Gabe posted, \"Serpapi wins again, but Google can still poison the SERPs...\" (as AEO Sherpa quotes it).\n\n**Source:** [Yahoo](https://www.yahooinc.com/press/after-delivering-more-than-3-billion-answers-yahoo-scout-exits-beta-to-underpin-all-of-yahoo-search) \u00b7 [The ILC's release (GlobeNewswire)](https://www.globenewswire.com/news-release/2026/11/12/3401676/0/en/the-internet-licensing-collective-ilc-launches-with-yahoo-scout-as-first-commercial-partner.html) \u00b7 [ILC FAQ](https://internetcollective.org/faq) \u00b7 [Digiday](https://digiday.com/media/yahoo-becomes-first-licensee-of-spotify-like-collective-ai-content-licensing-model/) \u00b7 [The order (PDF, third-party host)](https://filings.escalegal.com/google-serpapi-dismissal-order-2026-11-09.pdf) \u00b7 [SerpApi](https://www.serpapi.com/blog/court-dismisses-googles-amended-complaint-against-serpapi/) \u00b7 [Law360](https://www.law360.com/articles/2548600/google-falls-short-in-renewed-serpapi-scraping-suit) \u00b7 [Gabe on X](https://x.com/glenngabe/status/2120500332430008554) \u00b7 November 9\u201312, 2026\n\n### Google Ads says disclosed AI impersonation is still banned and shows advertisers their invalid-traffic credits\n\nA Google Ads policy update posted Wednesday, November 11, says Google \"updated its Unacceptable Business Practices policy on Public-figure impersonation to clarify that ads that impersonate public figures using AI are not allowed, even if they disclose that they were generated or edited using AI.\" Google says the clarification \"does not change the enforcement of the policy.\"\n\nOn Thursday, Keerat Sharma, Google's VP and GM for Ads Privacy and Safety, introduced the Invalid Traffic Overview Card, rolling out gradually with two metrics, \"Estimated savings\" and \"Credited cost.\" Estimated savings covers invalid clicks Google filtered out before billing, so it isn't money refunded. Sharma also wrote, \"So far in 2026, we've reduced advertiser exposure to invalid leads by an average of 30% through continuous system upgrades,\" a Google figure with no stated baseline.\n\nAnthropic's Usage Policy, covered at its October 8 announcement in our October 12 edition, took effect Thursday, November 12, barring use of Claude to \"Manipulate the sources from which search engines or AI systems draw answers by seeding them with content that misrepresents its origin, authorship, or independence.\"\n\n**Source:** [Google Ads policy update](https://support.google.com/adspolicy/answer/18891933?hl=en) \u00b7 [Google](https://blog.google/products/ads-commerce/invalid-traffic-overview-google-ads/) \u00b7 [Google Ads Help](https://support.google.com/google-ads/answer/11182074?hl=en) \u00b7 [Anthropic's Usage Policy (PDF)](https://www-cdn.anthropic.com/files/4zrzovbb/website/6ae2f5bb8675bcd9fac006125817ba1393b396e4.pdf) \u00b7 November 11\u201312, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via Search Engine Roundtable's daily recaps for [November 9](https://www.seroundtable.com/recap-11-09-2026-42485.html), [10](https://www.seroundtable.com/recap-11-10-2026-42494.html), [11](https://www.seroundtable.com/recap-11-11-2026-42509.html), [12](https://www.seroundtable.com/recap-11-12-2026-42521.html) and [13](https://www.seroundtable.com/recap-11-13-2026-42531.html) and its [weekly video recap](https://www.seroundtable.com/video-11-13-2026-42523.html), Lift Conversions' [The Lift Brief](https://liftconversions.com/the-lift-brief-this-week-in-ai-search-and-marketing-november-6-to-13-2026/), and [seoweekly.news's November 13 issue](https://seoweekly.news/issues/2026-11-13).*\n\n- **Google tested a results page without the AI Mode tab.** Glenn Gabe posted Friday that there was \"NO AI Mode tab in the SERP,\" and Chris Long replied, \"Because AI Mode is no longer a separate experience anymore.\" SER couldn't reproduce it, and Google hasn't commented. [Gabe on X](https://x.com/glenngabe/status/2121322842805375399) \u00b7 [Long on X](https://x.com/chris_nectiv/status/2121347952606420995) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-dropping-ai-mode-again-42534.html)\n- **AI Overviews tested source icons at the bottom and fully expanded definitions.** SERP Alert posted that Google \"is now testing out the placement of the number of sites referenced within AI overviews at the bottom of the response,\" and Gabe saw \"definitions are now showing AIOs fully expanded by default.\" SER also reported Joy Hawkins's sighting of AI Overviews' local pack without action buttons, photos and reviews. [SERP Alert on X](https://x.com/SERPalerts/status/2120677430465880254) \u00b7 [Gabe on X](https://x.com/glenngabe/status/2120599408714584424) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-ai-overview-local-pack-action-buttons-42483.html)\n- **Gemini 4 Carbon reached AI Mode for Google AI Ultra subscribers** on Tuesday. Its API stays at \"the same introductory price as Gemini 4 Argon ($2 per million input tokens and $10 per million output tokens)\" until November 30, then \"$4 per 1M input tokens and $20 per 1M output tokens.\" [Google](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/)\n- **Google documented how to find Search traffic in your own logs.** A Search Central page published Thursday says the Referer header carries \"only the scheme and host of the referring page\" and \"doesn't include the search query that the user entered,\" and it doesn't separate AI Mode or AI Overview clicks. SEJ adds that a google.com referrer shows Google sent someone \"without showing whether they came from Search, Discover or Images.\" [Google Search Central](https://developers.google.com/search/docs/monitor-debug/identify-google-search-traffic) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/google-search-traffic-analytics-logs/597382/)\n- **TikTok's Symphony takes up to 50 references and makes 30-second videos** (from 9 and 15), per Social Media Today, which adds that \"Starting November 9, advertisers outside North America can purchase BytePlus tokens to access Dreamina Seedance AI models through Symphony.\" TikTok's Andy Yang posted Monday, \"All the power of Symphony is now available in one, consolidated API.\" [Social Media Today](https://www.socialmediatoday.com/news/tiktok-updates-its-ai-video-ad-tools/874209/) \u00b7 [Yang on LinkedIn](https://www.linkedin.com/posts/jiandongyang_tiktoksymphony-symphonyapi-generativeai-activity-7525641693170319361-nkJ9)\n- **Gartner says 42% of CMOs have taken steps to monitor and correct AI misinformation about their brands.** Its survey of 408 senior marketing leaders ran July through August, and 61% said they've adapted content strategies \"to improve machine readability and visibility in AI-driven experiences\"; it reports actions, not how often AI answers are wrong. [Gartner](https://www.gartner.com/en/newsroom/press-releases/2026-11-09-gartner-survey-finds-42-percent-of-cmos-are-monitoring-brand-misinformation-in-ai-generated-content)\n- **System1's early Christmas leaderboard** has Morrisons and Sainsbury's on top at 5.9 Stars, eight brands at the 5.9 maximum and Tesco at 5.7, per System1's post on LBB. Campaign reported Wednesday that Dior had released a behind-the-scenes video with Sylvain Chomet and sketches from its \"all hand-drawn\" film, which drew more questions. [LBB](https://lbbonline.com/news/morrisons-and-sainsbury-s-tops-early-system1-christmas-ad-leaderboard-as-eight-brands-score-maximum-5-9-stars) \u00b7 [Campaign](https://www.campaignlive.com/article/diors-holiday-film-sparks-debate-alleged-ai-use-hand-drawn-claims/1974984)\n\n---\n\n## Common Threads\n\n### Platforms shipped their own meters, and each counts in its own unit\n\nOpenAI's Hub counts a mention only when ChatGPT \"references the business's website,\" SEJ cautions that \"A recorded click isn't a confirmed visit,\" and Search Console's Generative AI report under-logged impressions for November 9\u201311. Google Ads' new card reports \"Estimated savings\" and \"Credited cost,\" and Salesforce doesn't define the \"AI-driven\" in its $75.8 billion, so the figure to track is the ratio between each platform's count and your own.\n\n### Ads moved into follow-up answers and the wait for an image\n\nGoogle's multiturn ads show \"on responses to follow-up user queries,\" Bing's AI Mode ads carry labels Schwartz found \"so muted,\" and ChatGPT fills the wait while an image renders. Businesses can now sponsor their ChatGPT agent as an ad destination, and Aristide D. expects Hydrogen's longer questions to go \"to broad match, AI Max, Shopping and PMax.\"\n\n### The fight over AI answers' sources ran through a license, a lawsuit and a usage policy\n\nYahoo licensed publishers' content through the ILC, Google lost a second round against SerpApi while Gabe noted it \"can still poison the SERPs,\" and Anthropic's ban on seeding \"the sources from which search engines or AI systems draw answers\" took effect. Google says Hydrogen's fan-out reaches \"a broader range of helpful links than before,\" and under Google's LinkedIn post Voktix wrote that \"the source layer stays the real variable.\"\n\n### This month's comparisons all cross a moving date\n\nThe core update may run to about November 24, Hydrogen changed AI Mode on November 12, and the Generative AI report has a gap for November 9\u201311. OpenAI recommends its new target fields in the API from November 18 and retires the caps January 1, Carbon's introductory API price ends November 30, and Black Friday and Cyber Monday fall on November 27 and 30.\n\n---\n\n## Angles for the Week\n\n### Calibrate ChatGPT's Business Hub against GA4 every 28 days\n\nThe Hub reports mentions and website clicks for a rolling 28 days, and a mention counts only when ChatGPT \"references the business's website.\" The how-to pulls Hub clicks and ChatGPT-referred GA4 sessions for the same 28 days, logs the ratio monthly as calibration (NoGood's 1 to 1,020 and Previsible's 12 to 32 mark the spread so far), and has big brands check whether ChatGPT cites their own pages. Window: now; log it on the same day each month.\n\n### Read the core update against last year's holiday week\n\nAnnotate November 9\u201311 (the logging gap), November 10 (the update), November 12 (Hydrogen) and the rollout's end, read Search Console clicks instead of the Generative AI report's impressions, and check them against the Referer values Google documented on November 12. Retailers compare with the same holiday week of 2025, since the first full week after the rollout includes Thanksgiving, Black Friday and Cyber Monday. Window: through the rollout (about November 24) and the December comparisons.\n\n### Check what AI tools say about your prices and stock before Black Friday\n\nSalesforce, which sells commerce software, projects $75.8 billion in AI-driven Cyber Week spending, and 27% of agent users in its survey say an agent \"bought something that was too expensive.\" The checklist runs your top products through ChatGPT, AI Mode and your own agent and compares the prices and stock they quote with your feed; Caila Schwartz's advice is to make sure \"your prices and inventory are current.\" Window: before Black Friday (November 27).\n\n### Ask AI-visibility vendors in writing how they place content\n\nSince November 12, Anthropic's Usage Policy bars using Claude to seed AI answers with content \"that misrepresents its origin, authorship, or independence\" or to market that \"as a product or service,\" and Google Ads bans AI impersonation of public figures even when disclosed. The post lists questions for any agency or tool promising AI visibility (does it publish third-party sites, reviews or posts that don't say who's behind them, and with what tools), notes that the policy targets deception, and says it isn't legal advice. Window: in force now.\n\n### Ask your category's follow-up questions in AI Mode, Bing and ChatGPT, and log who advertises\n\nGoogle's multiturn ads appear \"on responses to follow-up user queries\" (SER saw them on the third and fourth), Bing shows ads at the top of its AI Mode, and ChatGPT shows them while images render. The audit runs your top three buying journeys to the fourth question on each, screenshots who appears and how each ad is labeled, and decides whether you need coverage there; these are sightings, and neither Google nor Microsoft has published coverage numbers. Window: now through Cyber Monday (November 30).\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [OpenAI \u2014 Introducing Businesses in ChatGPT](https://openai.com/index/introducing-businesses-chatgpt/) \u2014 November 10, 2026 \u2014 Insights, sponsored Business Agents\n2. [OpenAI Help \u2014 Setting up your business on ChatGPT](https://help.openai.com/en/articles/20001635-setting-up-your-business-on-chatgpt) \u2014 read November 16, 2026 \u2014 the mention rule\n3. [Tarun Gehani \u2014 LinkedIn post](https://www.linkedin.com/posts/tarungehani_big-if-true-openai-is-testing-a-claim-activity-7525543166381314048-R8tN) \u2014 November 9, 2026 \u2014 the leaked screenshot; Voices\n4. [Kevin Indig \u2014 LinkedIn post](https://www.linkedin.com/posts/kevinindig_this-is-one-of-the-most-impactful-developments-activity-7526000727446646784-E3qH) \u2014 November 10, 2026 \u2014 \"a sort of Search Console\"; Lane's comment\n5. [Mostafa ElBermawy \u2014 NoGood on Business Hub and GA4](https://nogood.io/blog/chatgpt-business-hub-vs-ga4/) \u2014 November 12, 2026 \u2014 the counts, the disclosure; Voices\n6. [Jordan Koene \u2014 Previsible on Business Hub](https://previsible.com/ai-search/chatgpt-business-hub/) \u2014 November 13, 2026 \u2014 the counts; Voices\n7. [Profound \u2014 ChatGPT Business Hub](https://www.tryprofound.com/blog/chatgpt-business-hub-profound) \u2014 November 11, 2026 \u2014 \"nearly 50%\"\n8. [Glenn Gabe \u2014 X post on the core update](https://x.com/glenngabe/status/2120517778813641075) \u2014 November 11, 2026 \u2014 the tracker split\n9. [Lily Ray \u2014 LinkedIn post](https://www.linkedin.com/posts/lily-ray-44755615_goo [Search Engine Roundtable \u2014 Google tests dropping AI Mode](https://www.seroundtable.com/google-dropping-ai-mode-again-42534.html) \u2014 November 13, 2026 \u2014 the test, replication\n62. [Search Engine Roundtable \u2014 AI Overview local pack](https://www.seroundtable.com/google-ai-overview-local-pack-action-buttons-42483.html) \u2014 November 10, 2026 \u2014 Hawkins's sighting\n63. [Search Engine Journal \u2014 Google Search traffic in analytics](https://www.searchenginejournal.com/google-search-traffic-analytics-logs/597382/) \u2014 November 12, 2026 \u2014 the referrer's limits\n64. [Social Media Today \u2014 TikTok's AI video ad tools](https://www.socialmediatoday.com/news/tiktok-updates-its-ai-video-ad-tools/874209/) \u2014 November 9, 2026 \u2014 Symphony, Seedance\n65. [Campaign \u2014 Dior's holiday film](https://www.campaignlive.com/article/diors-holiday-film-sparks-debate-alleged-ai-use-hand-drawn-claims/1974984) \u2014 November 11, 2026 \u2014 Dior's behind-the-scenes video\n\n**Roundups consulted**\n\n66. [Search Engine Roundtable \u2014 daily recap, November 9](https://www.seroundtable.com/recap-11-09-2026-42485.html) \u2014 November 9, 2026 \u2014 discovery index\n67. [Search Engine Roundtable \u2014 daily recap, November 10](https://www.seroundtable.com/recap-11-10-2026-42494.html) \u2014 November 10, 2026 \u2014 discovery index\n68. [Search Engine Roundtable \u2014 daily recap, November 11](https://www.seroundtable.com/recap-11-11-2026-42509.html) \u2014 November 11, 2026 \u2014 discovery index\n69. [Search Engine Roundtable \u2014 daily recap, November 12](https://www.seroundtable.com/recap-11-12-2026-42521.html) \u2014 November 12, 2026 \u2014 discovery index\n70. [Search Engine Roundtable \u2014 daily recap, November 13](https://www.seroundtable.com/recap-11-13-2026-42531.html) \u2014 November 13, 2026 \u2014 discovery index\n71. [Search Engine Roundtable \u2014 weekly video recap](https://www.seroundtable.com/video-11-13-2026-42523.html) \u2014 November 13, 2026 \u2014 discovery index\n72. [Lift Conversions \u2014 The Lift Brief, November 6\u201313](https://liftconversions.com/the-lift-brief-this-week-in-ai-search-and-marketing-november-6-to-13-2026/) \u2014 November 13, 2026 \u2014 discovery index\n73. [seoweekly.news \u2014 November 13 issue](https://seoweekly.news/issues/2026-11-13) \u2014 November 13, 2026 \u2014 discovery index\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# Monday Signal \u2014 Week of November 16, 2026\n\n> **Google began its November core update on Nov 10, made Gemini 4 Hydrogen AI Mode's default model on Nov 12 (per Robby Stein), and under-logged Search Console's AI impressions for Nov 9\u201311; by SEJ's count, the first full week after the rollout includes Thanksgiving, Black Friday and Cyber Monday.** Ads reached AI Mode's follow-ups, Bing's AI Mode and ChatGPT image generation, and Salesforce projected $75.8 billion in AI-driven Cyber Week spending. On the feed, NoGood counted 1 Business Hub click against 1,020 GA4 sessions, and George Prodanov told ChatGPT advertisers, \"Your cap becomes an average\".\n\n---\n\n## The Conversation\n\n### NoGood's ChatGPT Business Hub showed 1 click while GA4 counted 1,020 sessions\n\nOpenAI's Business Hub (beta, Nov 10) shows verified businesses 28 days of mentions and website clicks, and a mention counts only \"when ChatGPT references the business's website.\" NoGood's Mostafa ElBermawy counted 1 click against 1,020 sessions and called it \"a business profile and not a search console\"; Previsible counted 12 clicks against 32 sessions. [OpenAI Help](https://help.openai.com/en/articles/20001635-setting-up-your-business-on-chatgpt) \u00b7 [NoGood](https://nogood.io/blog/chatgpt-business-hub-vs-ga4/) \u00b7 [Previsible](https://previsible.com/ai-search/chatgpt-business-hub/)\n\n### Split rank trackers and an under-logged AI report made the core update hard to read\n\nOn Nov 11 Glenn Gabe posted that \"it might be hard to gauge visibility drops/surges accurately,\" shared Ahrefs and Semrush charts that disagreed about the same sites, and called Search Console data \"the source of truth (for now)\" (as AEO Sherpa quotes him). Lily Ray reported more manual-action inquiries \"than any time I can remember\"; Google hasn't linked them to the update. [Gabe on X](https://x.com/glenngabe/status/2120517778813641075) \u00b7 [AEO Sherpa](https://aeosherpa.com/news/ahrefs-and-semrush-split-on-core-update-day-one) \u00b7 [Ray's post](https://www.linkedin.com/posts/lily-ray-44755615_google-search-status-dashboard-activity-7525993341948203008-YYa1)\n\n### ChatGPT Ads' target bidding went live Nov 9, and one advertiser said OpenAI \"silently rejected\" 3,930 pixel events\n\nNew conversion and click campaigns now bid to Target CPA and Target CPC, and the caps retire Jan 1, 2027; Prodanov's summary was \"Your cap becomes an average\". Ian McGavin wrote that \"OpenAI silently rejected 3,930 of our pixel events,\" one account's experience that OpenAI hasn't addressed, and its help page warns, \"Setup alone does not establish that usable conversion signals are being received.\" Reconcile accepted events against your orders first. [OpenAI Help](https://help.openai.com/en/articles/20001634-bidding-strategies-and-how-pricing-works-in-chatgpt-ads) \u00b7 [Prodanov's post](https://www.linkedin.com/posts/georgeprodanov_chatgptads-openai-ppc-activity-7525507375391215616--cDK) \u00b7 [McGavin's post](https://www.linkedin.com/posts/ian-mcgavin_chatgpt-ads-got-target-cpa-today-you-tell-activity-7526005412345716736-5PCy)\n\n---\n\n## Voices\n\n- **Jordan Koene, Previsible (Previsible's blog, Nov 13):** \"Sessions and clicks are different measures, so the discrepancy doesn't establish that either system is wrong.\" [The post](https://previsible.com/ai-search/chatgpt-business-hub/)\n- **Lily Ray, Algorythmic and Amsive (X, Nov 12):** \"Wonder if Hydrogen will be less prone to manipulation and spam in AI answers than with the prior models used in AI Overviews.\" [The post](https://x.com/lilyraynyc/status/2120968959759691830)\n- **Jeff Green, The Trade Desk (Q3 call, Nov 9):** \"Unlike the walled gardens of Amazon and Google and other user-generated content platforms, we are not grading our own homework.\" [Transcript](https://www.investing.com/news/transcripts/earnings-call-transcript-the-trade-desk-beats-q3-2026-estimates-as-stock-jumps-93CH-5013686)\n- **Caila Schwartz, Salesforce (Salesforce, Nov 12):** \"My advice before Cyber Week is simple: Be the brand that AI can find and humans can trust\" [Salesforce](https://www.salesforce.com/news/stories/ai-first-holiday/)\n\n---\n\n## This Week in Marketing AI\n\n### Google started a core update, put Hydrogen in AI Mode and under-logged AI impressions\n\nThe core update began Nov 10 and \"may take up to 2 weeks to complete.\" On Nov 12 Hydrogen reached Search, \"now the new default model in AI Mode\" per Stein, and Search Console Help disclosed a logging error that under-counted Generative AI report impressions for Nov 9\u201311. *Editor's note (Nov 16): When we checked, the Search Status Dashboard still showed no completion for the update.* [Google Search Status Dashboard](https://status.search.google.com/incidents/WLxcJyC6jMWMfryxsKMc) \u00b7 [Search Console Help](https://support.google.com/webmasters/answer/6211453?hl=en)\n\n### Ads appeared in AI Mode follow-ups, atop Bing's AI Mode and while ChatGPT draws images\n\nSER reported Google's multiturn ads live in AI Mode on Nov 9, showing \"on responses to follow-up user queries,\" and ads at the top of Bing's AI Mode with labels Barry Schwartz called \"so muted\"; Microsoft hasn't announced it. ChatGPT showed Juozas Kaziuk\u0117nas an ad while drawing an image, and businesses can now sponsor their ChatGPT agent. [SER on multiturn ads](https://www.seroundtable.com/google-ai-mode-multiturn-ads-42478.html) \u00b7 [SER on Bing](https://www.seroundtable.com/bing-ads-top-ai-mode-results-42479.html) \u00b7 [OpenAI](https://openai.com/index/introducing-businesses-chatgpt/)\n\n### Salesforce projects $75.8 billion in AI-driven Cyber Week spending\n\nSalesforce, which sells commerce software, says \"AI is projected to drive $75.8 billion in Cyber Week spending,\" without naming the markets or defining \"AI-driven,\" and 73% of shoppers it surveyed \"aren't comfortable giving a personal AI agent their payment information.\" [Salesforce](https://www.salesforce.com/news/stories/ai-first-holiday/)\n\n### The Trade Desk beat its own guide by 13%, and PubMatic, Zeta and Liftoff grew\n\nThe Trade Desk's $736 million in revenue (Nov 9) fell 0.5% from a year earlier but topped its \"at least\" $650 million guide by 13% by our arithmetic, including $15 million from a partner it doesn't expect to recur. PubMatic grew 17%, Zeta 46% (30% excluding Marigold and political candidate revenue) and Liftoff 32%. [The Trade Desk's release](https://investors.thetradedesk.com/news-and-events/news/news-details/2026/The-Trade-Desk-Reports-Third-Quarter-2026-Financial-Results/default.aspx) \u00b7 [The Trade Desk's 10-Q](https://www.sec.gov/Archives/edgar/data/1671933/000167193326000116/ttd-20260930.htm)\n\n### Yahoo Scout became a publishers' collective's first licensee, and Google lost again to SerpApi\n\nThe nonprofit Internet Licensing Collective signed Yahoo Scout as its first commercial customer on Nov 12; Digiday reports the fee wasn't disclosed. On Nov 9 a federal judge dismissed Google's amended complaint against SerpApi with leave to amend, the second dismissal; we found the order on a third-party host, and dismissal isn't a ruling that scraping is lawful. [The ILC's release (GlobeNewswire)](https://www.globenewswire.com/news-release/2026/11/12/3401676/0/en/the-internet-licensing-collective-ilc-launches-with-yahoo-scout-as-first-commercial-partner.html) \u00b7 [Digiday](https://digiday.com/media/yahoo-becomes-first-licensee-of-spotify-like-collective-ai-content-licensing-model/) \u00b7 [The order (PDF, third-party host)](https://filings.escalegal.com/google-serpapi-dismissal-order-2026-11-09.pdf)\n\n### Google Ads says disclosed AI impersonation is still banned and shows invalid-traffic credits\n\nGoogle's Nov 11 policy update says ads that \"impersonate public figures using AI are not allowed, even if they disclose that they were generated or edited using AI,\" and a new card shows \"Estimated savings\" and \"Credited cost\" from invalid traffic. Anthropic's ban on using Claude to seed AI answers' sources with misleading content took effect Nov 12 (our Oct 12 edition). [Google Ads policy update](https://support.google.com/adspolicy/answer/18891933?hl=en) \u00b7 [Google](https://blog.google/products/ads-commerce/invalid-traffic-overview-google-ads/) \u00b7 [Anthropic's Usage Policy (PDF)](https://www-cdn.anthropic.com/files/4zrzovbb/website/6ae2f5bb8675bcd9fac006125817ba1393b396e4.pdf)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's daily recaps](https://www.seroundtable.com/recap-11-13-2026-42531.html) and [The Lift Brief](https://liftconversions.com/the-lift-brief-this-week-in-ai-search-and-marketing-november-6-to-13-2026/).*\n\n- **Google tested a results page without the AI Mode tab**, which SER couldn't reproduce. [Gabe on X](https://x.com/glenngabe/status/2121322842805375399)\n- **AI Overviews tested source icons at the bottom and fully expanded definitions** (SERP Alert, Gabe). [SERP Alert on X](https://x.com/SERPalerts/status/2120677430465880254)\n- **Google documented how to spot Search traffic in your logs**, though the Referer \"doesn't include the search query that the user entered.\" [Google Search Central](https://developers.google.com/search/docs/monitor-debug/identify-google-search-traffic)\n- **Gartner found 42% of CMOs monitoring brand misinformation in AI-generated content** (408 leaders surveyed). [Gartner](https://www.gartner.com/en/newsroom/press-releases/2026-11-09-gartner-survey-finds-42-percent-of-cmos-are-monitoring-brand-misinformation-in-ai-generated-content)\n\n---\n\n## Common Threads\n\n### Each platform's meter counts in its own unit\nOpenAI counts a mention only when ChatGPT cites your site, and Google's AI report has a Nov 9\u201311 gap.\n\n### Ads moved into follow-up answers and the wait for an image\nGoogle placed ads in AI Mode follow-ups, Bing atop its AI Mode and ChatGPT while images render, and businesses can sponsor their ChatGPT agent.\n\n### A license, a lawsuit and a usage policy addressed AI answers' sources\nYahoo licensed publishers' content, Google lost again to SerpApi, and Anthropic's ban on seeding AI answers' sources took effect.\n\n### This month's comparisons all cross a moving date\nThe core update may run to about Nov 24, Hydrogen arrived Nov 12, and Black Friday and Cyber Monday fall on Nov 27 and 30.\n\n---\n\n## Angles for the Week\n\n- **Calibrate ChatGPT's Business Hub against GA4 every 28 days.** Log Hub clicks against ChatGPT-referred sessions; NoGood's 1 to 1,020 and Previsible's 12 to 32 show the spread. Window: monthly.\n- **Read the core update against last year's holiday week.** Annotate the logging gap, the update and Hydrogen, and compare clicks with the same week of 2025. Window: through December.\n- **Check what AI tools say about your prices and stock before Black Friday.** Compare the prices ChatGPT, AI Mode and your own agent quote with your feed. Window: before Nov 27.\n- **Ask AI-visibility vendors in writing how they place content.** Anthropic's policy targets content that misrepresents \"its origin, authorship, or independence\"; ask what they publish and under whose name. Window: now.\n- **Ask your category's follow-up questions in AI Mode, Bing and ChatGPT, and log who advertises.** Run three buying journeys to the fourth question and screenshot the ads. Window: through Nov 30.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
