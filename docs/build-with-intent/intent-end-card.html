<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build with Intent.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    mix-blend-mode: overlay;
    animation: grainDrift 0.8s steps(4) infinite;
  }

  @keyframes grainDrift {
    0% { background-position: 0 0; }
    100% { background-position: 128px 128px; }
  }

  .end-card {
    text-align: center;
    position: relative;
    z-index: 1;
    user-select: none;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    height: 160px;
    background: radial-gradient(ellipse, rgba(255, 235, 210, 0.06) 0%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  .glow.visible {
    animation: breathe 3.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }

  .tagline {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    line-height: 1;
    font-size: clamp(28px, 5vw, 64px);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: rgba(255, 248, 240, 0.95);
  }

  .word-build {
    opacity: 0;
    margin-right: 0.3em;
  }

  .word-build.visible {
    animation: fadeIn 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .word-swap {
    position: relative;
    display: inline-block;
  }

  .word-swap .phase-text {
    opacity: 0;
    white-space: nowrap;
  }

  .word-swap .phase-text.visible {
    opacity: 1;
  }

  .word-swap .phase-text.fade-out {
    animation: fadeOutUp 0.5s cubic-bezier(0.4, 0, 1, 1) forwards;
  }

  .word-swap .phase-text.fade-in {
    animation: fadeInDown 0.6s cubic-bezier(0, 0, 0.25, 1) forwards;
  }

  .period {
    opacity: 0;
  }

  .period.visible {
    animation: fadeIn 0.4s ease forwards;
  }

  .intent-accent {
    color: #3ecf8e;
  }

  .url {
    font-size: clamp(11px, 1.6vw, 18px);
    font-weight: 300;
    color: rgba(255, 255, 255, 0.28);
    letter-spacing: 0.14em;
    margin-top: clamp(20px, 3vw, 48px);
    opacity: 0;
  }

  .url.visible {
    animation: urlFade 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeOutUp {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-12px); }
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes urlFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="end-card">
  <div class="glow" id="glow"></div>
  <div class="tagline">
    <span class="word-build" id="wordBuild">Build</span>
    <span class="word-swap" id="wordSwap">
      <span class="phase-text" id="phaseOne">Together</span>
      <span class="phase-text" id="phaseTwo" style="position:absolute;left:0;top:0;">with <span class="intent-accent">Intent</span></span>
    </span>
    <span class="period" id="period">.</span>
  </div>
  <div class="url" id="url">intent.augmentcode.com</div>
</div>

<script>
(function () {
  var wordBuild = document.getElementById('wordBuild');
  var phaseOne  = document.getElementById('phaseOne');
  var phaseTwo  = document.getElementById('phaseTwo');
  var period    = document.getElementById('period');
  var glow      = document.getElementById('glow');
  var url       = document.getElementById('url');

  // 0.8s — "Build" fades in
  setTimeout(function () {
    wordBuild.classList.add('visible');
  }, 800);

  // 1.4s — "Together" fades in, period appears
  setTimeout(function () {
    phaseOne.classList.add('visible');
    phaseOne.style.animation = 'fadeIn 0.6s cubic-bezier(0.25,0.1,0.25,1) forwards';
    period.classList.add('visible');
  }, 1400);

  // 3.2s — "Together" fades out upward
  setTimeout(function () {
    phaseOne.classList.add('fade-out');
    period.style.opacity = '0';
  }, 3200);

  // 3.7s — "with Intent" fades in from below, period returns, glow starts
  setTimeout(function () {
    phaseOne.style.display = 'none';
    phaseTwo.style.position = 'relative';
    phaseTwo.classList.add('fade-in');
    period.style.opacity = '0';
    period.style.animation = 'fadeIn 0.4s ease 0.3s forwards';
    setTimeout(function () {
      glow.classList.add('visible');
    }, 400);
  }, 3700);

  // 5.5s — URL fades in
  setTimeout(function () {
    url.classList.add('visible');
  }, 5500);
})();
</script>
</body>
</html>
