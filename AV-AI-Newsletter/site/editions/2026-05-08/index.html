    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of May 8, 2026\n\n> **Cannes 2026 opens Tuesday with the AI question split clean down the middle**: the March\u00e9 du Film embraces it (AGC boards \"Critterz,\" the first $30M mainstream commercial AI-assisted animated feature; the AI for Talent Summit doubles in length), while the festival proper bans AI from Palme d'Or competition outright. **OpenAI ships GPT-5.5 Instant** as the new default for every ChatGPT user, with a 52.5% reduction in hallucinated claims on high-stakes prompts. **xAI's Grok 4.3** launches with strong agentic benchmarks at roughly half the price of GPT-5.5 \u2014 and a notable lead on legal and corporate-finance evaluations. **Topaz Labs follows last week's Next-Gen rebuild with Hyperion 2** (a new SDR-to-HDR upscaler) and a UXP panel that lets editors send timeline media directly to Topaz cloud processing without leaving Premiere. The **AI-actor likeness economy** moves from concept to capital, with Twinnin opening a $3M seed round backed by Google and NVIDIA while UK union Equity refuses to endorse the platform. And **YouTube's deepfake-detection tool quietly rolled out to the entire entertainment industry** \u2014 built with CAA, UTA, WME, and Untitled, free to any actor, musician, or athlete who can pass an ID-plus-selfie verification.\n\n---\n\n## This Week in AI\n\n### Cannes 2026: AGC Boards \"Critterz\" While the Festival Bans AI From Competition\n\nCannes opens Tuesday, May 12 with the AI question split exactly between the festival and its market. Three concrete data points landed this week.\n\n**AGC Studios boarded \"Critterz\" for worldwide sales** on May 5, ahead of the March\u00e9 du Film. The animated family feature is the first mainstream commercial film to use generative AI throughout its production pipeline, with the package going to buyers at the March\u00e9 next week. The numbers:\n\n- **Budget: ~$30M**, against an estimated $80\u2013100M for a traditional animated feature of comparable scope.\n- **Production timeline: ~9 months**, against the ~3-year cycle typical for animated features.\n- **Direction**: Nik Kleverov, co-founder of AI production studio Native Foreign.\n- **Producer**: Chad Nelson, OpenAI creative strategist, alongside Vertigo Films' Allan Niblo and James Richardson.\n- **Screenplay**: James Lamont and Jon Foster (*Paddington in Peru*) plus Tom Butterworth (*Birthday Girl*).\n- **Voice cast: entirely human.** AI is used in the production pipeline (image-generation models, GPT-5 for structure work) rather than for performance.\n\nThe film is a feature-length adaptation of a 2023 viral short of the same name, which was one of the first commercial projects to use OpenAI's creative tooling. The story follows an anxious woodland creature who teams up with a band of outcasts to find her lost brother.\n\n**Cannes itself banned AI from Palme d'Or competition.** The festival's stated position: \"AI imitates very well, but it will never feel deep emotions.\" Films using generative AI in their core creative output are not eligible for the main competition \u2014 though tooling for restoration, color, sound, and post is permitted under the existing rules.\n\n**The March\u00e9 du Film expanded its AI for Talent Summit** to two mornings (May 15\u201316), up from a single day in 2025. The summit is invitation-only, targeting C-level executives, investors, senior technology professionals, and decision-makers from major studios, tech companies, and startups. The three themes this year: integrating AI into production workflows, ethical and responsible use of AI, and education and access. Last year's summit drew roughly 200 attendees; this year's expanded format suggests demand outpaced supply.\n\n**Why the split is the story.** Cannes is positioning itself as both gatekeeper and growth platform \u2014 protecting the artistic legitimacy of the Palme d'Or competition while letting the market embrace whatever the buyers will pay for. The two positions are coexisting, deliberately, at the same address. For AV teams watching how the industry sorts the boundary between \"AI as production infrastructure\" (allowed) and \"AI as creative authorship\" (rejected), Cannes 2026 is the first major festival to draw the line publicly.\n\nThe next data point is the buyer reception. AGC plans to track \"Critterz\" sales velocity against comparable traditional animated packages of the past two years. If the buyer math works, the $30M \u00f7 9-month production model becomes the precedent that the next 20 AI-assisted features will be measured against.\n\n**Source:** [Deadline \u2014 AGC boards \"Critterz\"](https://deadline.com/2026/05/open-ai-produced-animated-family-film-critterz-cannes-1236879586/) \u00b7 [Variety \u2014 Critterz at Cannes Market](https://variety.com/2026/film/news/critterz-agc-1236736009/) \u00b7 [March\u00e9 du Film \u2014 AI for Talent Summit](https://www.marchedufilm.com/news/ai-for-talent-summit/) \u00b7 [The Guardian \u2014 Cannes' AI position](https://www.theguardian.com/technology/2026/apr/26/cannes-ai-film-festival-raises-eyebrows-questions-future) \u00b7 May 5, 2026\n\n### OpenAI Ships GPT-5.5 Instant \u2014 A Significant Quality Jump in the ChatGPT Default\n\nOpenAI released **GPT-5.5 Instant** on May 5, replacing GPT-5.3 Instant as the default model for every ChatGPT user \u2014 including the free tier. This is not a minor refresh. It's the model the majority of ChatGPT's user base will hit by default, and the quality deltas are substantial.\n\nThe headline numbers:\n\n- **52.5% reduction in hallucinated claims** on high-stakes prompts in medicine, law, and finance.\n- **37.3% reduction in inaccurate claims** on user-flagged factual errors.\n- **AIME 2025: 81.2** (vs. 65.4 for GPT-5.3 Instant), a major math-reasoning step.\n- **1M token context window**, 128K max output tokens.\n- **Better web-search use, better image analysis, better personalization** based on prior conversation context.\n\n**API pricing (gpt-5.5):** $5.00 per million input tokens, $30.00 per million output tokens, $0.50 cached input. Prompts above 272K input tokens are charged at 2\u00d7 input and 1.5\u00d7 output for the full session. GPT-5.3 Instant remains available to paid API users for three months.\n\n**For AV teams**, the practical implication is the floor moved. Anyone using ChatGPT for shot-list scaffolding, rough script polish, transcription cleanup, metadata pass review, or release-note drafting is now getting the upgraded model whether they paid for it or not. The medicine/law/finance hallucination reduction is the headline benchmark, but the underlying model improvements carry through to creative-prompt accuracy too \u2014 especially when answering technical questions about codecs, color spaces, audio formats, and platform specs where prior versions were prone to confident-sounding errors.\n\n**Source:** [OpenAI \u2014 Introducing GPT-5.5 Instant](https://openai.com/index/gpt-5-5-instant/) \u00b7 [TechCrunch coverage](https://techcrunch.com/2026/05/05/openai-releases-gpt-5-5-instant-a-new-default-model-for-chatgpt/) \u00b7 [GPT-5.5 Instant System Card](https://openai.com/index/gpt-5-5-instant-system-card/) \u00b7 May 5, 2026\n\n### Grok 4.3 Lands With Strong Agentic Benchmarks at Roughly Half the Price of GPT-5.5\n\nxAI publicly announced **Grok 4.3** on May 5\u20136, after a consumer beta on April 17 and quiet API availability since April 30. The release is interesting less for absolute capability \u2014 Grok 4.3 sits behind GPT-5.5, Claude Opus 4.7, and Gemini 3.1 Pro on the broad intelligence index \u2014 and more for what the model is positioned to do well, plus the pricing.\n\nThe benchmark profile:\n\n- **Artificial Analysis Intelligence Index: 53** \u2014 above Claude Sonnet 4.6, behind GPT-5.5 (60), Claude Opus 4.7 (57), and Gemini 3.1 Pro (57).\n- **#1 on Vals Case Law (v2): 79.3%** \u2014 the model now leads the legal benchmark.\n- **#1 on Vals Corporate Finance (v2): 68.5%**.\n- **Tied #1 on \u03c4\u00b2-Bench Telecom: 98%** \u2014 the agentic customer-support evaluation.\n- **+321 Elo points on GDPval-AA** real-world agentic tasks (1,179 \u2192 1,500).\n- **81% on IFBench** instruction-following.\n- 1M-token context, video input, function calling, structured outputs, web search, code execution, MCP connections.\n\n**API pricing**: $1.25 per million input tokens, $2.50 per million output. That's roughly 37.5% lower input and 58.3% lower output costs versus Grok 4.20, and approximately one-quarter to one-half the comparable GPT-5.5 / Claude Opus 4.7 token cost depending on direction. Cached input is roughly $0.31 per million.\n\n**The positioning is the story.** Grok 4.3 is being marketed not as the smartest model on the market but as the one to use when you need agentic tool calling at scale and have to manage cost. The Vals Case Law and Corporate Finance leads suggest a deliberate domain bet \u2014 fewer benchmarks, deeper performance on the ones that map to high-volume enterprise use cases. For AV teams whose AI use is dominated by background batch tasks (metadata generation, transcription cleanup, rough draft work) rather than frontier creative work, the price-per-token math gets attention.\n\n**Source:** [Artificial Analysis \u2014 Grok 4.3 launch](https://artificialanalysis.ai/articles/xai-launches-grok-4-3-with-improved-agentic-performance-and-lower-pricing) \u00b7 [xAI Grok 4.3 model details](https://docsbot.ai/models/grok-4-3) \u00b7 [DataStudios benchmark deep-dive](https://www.datastudios.org/post/grok-4-3-characteristics-pricing-benchmarks-context-window-api-access-and-what-changed-from-gr) \u00b7 May 5\u20136, 2026\n\n### Topaz Ships Hyperion 2 + a Native Adobe Premiere Panel\n\nTopaz Labs' Next-Gen release on April 28 was last week's headline. The follow-up shipped May 7 with two pieces that matter more for working AV teams than the original launch did: **Hyperion 2**, a new SDR-to-HDR video upscaler, and **Topaz Labs for Premiere**, a UXP panel that drops Topaz cloud processing into the Premiere editing interface.\n\n**Hyperion 2** uses inverse tone mapping (ITM) to convert standard dynamic range footage to HDR, generating additional color depth and expanding the dynamic range from SDR's 6\u201310 stops to HDR's 12\u201317.6 stops. The model converts BT.1886/Rec. 709 SDR sources to BT.2100/PQ HDR output, intelligently processing each region of the frame to increase color depth, contrast, and peak brightness. The pitch is that archival SDR libraries \u2014 broadcast tape, older streaming masters, dailies from pre-HDR camera systems \u2014 get a one-pass route to HDR delivery without manual frame-by-frame grading.\n\n**Topaz Labs for Premiere** is the more immediate workflow change. The new UXP panel, available at `topazlabs.com/premiere-panel`, lets editors send media directly from a Premiere project timeline to Topaz's cloud processing for upscaling, denoising, and enhancement \u2014 and pulls the result back into the same project bin without an export-import roundtrip. The pricing model uses the same Topaz subscription tiers; cloud-processing minutes count against the standard credit pool.\n\nCEO Eric Yang framed the Next-Gen + Hyperion 2 + Premiere panel sequence as \"our largest fundamental improvement in model quality in years\" \u2014 Topaz's first model architecture overhaul since 2018. That's the long-term context. The short-term context is that the Premiere integration moves Topaz from \"the tool you switch to when you need a rescue pass\" into \"a tab inside your existing edit session.\"\n\n**Source:** [Topaz Labs \u2014 May 2026 Expansion Update](https://lifestyle.kbew98country.com/story/212737/topaz-labs-announces-new-video-enhancement-model-features-and-model-access-as-part-of-larger-company-wide-expansion/) \u00b7 [Topaz Labs \u2014 SDR-to-HDR documentation](https://docs.topazlabs.com/topaz-video/filters/sdr-to-hdr) \u00b7 [Topaz Labs \u2014 Next-Gen release recap](https://www.topazlabs.com/news/the-next-gen-release---april-2026) \u00b7 May 7, 2026\n\n### The Likeness Economy Moves: Twinnin Raises $3M, YouTube Detection Goes Live for Hollywood\n\nTwo stories landed this week that, taken together, define the shape of the AI-actor likeness economy in 2026: one selling licensed digital actor likenesses to studios and brands, the other helping studios and talent take down unlicensed deepfakes. They're being run by different companies for different audiences, but they're answering the same question \u2014 *who owns an actor's face when it can be re-rendered at scale, and what does that ownership cost?*\n\n**Twinnin opened a $3M seed round** at a $25M post-money valuation. The platform lets actors post a digital likeness, which studios and brands can then license for use in films, TV, and advertising. Pricing: **$14.99/year for actors** to maintain a twin, **$499\u2013$1,200/month for studios/brands** by tier. Backers include Google and NVIDIA. The platform reports **2,000 signed actors with weekly subscriber doubling** since the April launch, and $3M already pledged from an unnamed lead investor and angels including JP Morgan C-suite executives. A Series A is anticipated in 12\u201314 months if KPIs hold.\n\nThe opposition is loud. **UK actors' union Equity does not endorse the platform**, citing concerns about consent enforcement and pre-launch incidents \u2014 including reports that one agency promoted Twinnin to parents of minors before the public launch. SAG-AFTRA's position remains under review.\n\n**YouTube expanded its AI-powered likeness detection tool** to the entire entertainment industry in late April, with continued rollouts this week. Built in partnership with **CAA, UTA, WME, and Untitled Management**, the tool works similarly to Content ID \u2014 it scans YouTube for AI-generated deepfakes of enrolled participants' faces and lets them request takedowns. Enrollment is open to celebrities, actors, musicians, creators, and athletes whether or not they have a YouTube channel; verification requires an ID and a selfie video. The tool is free.\n\nThe earlier rollout sequence is worth noting: creators in Fall 2025, politicians and journalists in March 2026, entertainment industry figures in April 2026, with continued expansion this month. Removal requests are evaluated against YouTube's privacy policy \u2014 protected uses (parody, satire, news) may not be removed.\n\n**Why these two stories travel together.** Twinnin is the supply-side: the marketplace where actors can opt their faces into a system that monetizes synthetic use. YouTube's detection is the enforcement layer for what they did *not* opt into. Both are the legible end of the same question, and the gap between them \u2014 the unanswered middle \u2014 is where the next round of policy, contract language, and platform design is going to land. Equity's refusal to endorse Twinnin is the early warning that the supply side is running ahead of the union framework.\n\n**Source:** [Deadline \u2014 Twinnin opens funding round](https://deadline.com/2026/05/ai-plaform-twinnin-funding-round-3-million-signs-up-twins-1236882734/) \u00b7 [YouTube \u2014 likeness detection rollout](https://blog.youtube/news-and-events/youtube-likeness-detection-ai-protection/) \u00b7 [Hollywood Reporter \u2014 YouTube tool open to celebrities](https://www.hollywoodreporter.com/business/digital/youtube-ai-deepfake-detection-tool-1236569593/) \u00b7 [Tubefilter \u2014 YouTube + Hollywood](https://www.tubefilter.com/2026/04/21/youtube-ai-deepfake-likeness-detection-tool-hollywood-studios/) \u00b7 April 21\u2013May 7, 2026\n\n### ElevenLabs Ships Expressive Mode + Eleven v3 Conversational\n\nElevenLabs released **Expressive Mode for ElevenAgents** the week of May 4, anchored on a new TTS model called **Eleven v3 Conversational**. The release sits squarely on the agentic-AI thread that's been running through every edition this spring \u2014 voice agents are getting good enough that the limiting factor is no longer the speech synthesis quality but the *conversational presence* of the agent.\n\nWhat's new:\n\n- **Eleven v3 Conversational** \u2014 an emotionally intelligent TTS that maintains conversational context and produces speech reflecting intent, emotion, and emphasis. It listens to what the agent is saying and adjusts mid-utterance, rather than reading each line in isolation.\n- **New turn-taking system** \u2014 uses real-time signals to determine when the agent should speak, pause, or wait, reducing the awkward overlap-or-step-on-each-other failure mode that has been the calling card of voice agents to date.\n- **70+ language support** with native expressive control across all of them.\n\nThe May 4 and May 7 SDK updates rolled in adjacent infrastructure: conversation tags for organizing agent sessions, enhanced conversation list filters, expanded LLM model options (Claude Opus 4.7, GPT-5.4, GPT-5.5, Qwen3 added as agent backends), and increased MCP response timeouts.\n\n**For AV teams**, the immediate use cases are the obvious ones \u2014 voice cloning for ADR pickup work, multilingual dubbing, voiceover drafts for in-progress edits \u2014 but the more interesting downstream is the agent integration. An ElevenAgent with Expressive Mode plus an Eleven v3 Conversational backend running on Claude Opus 4.7 with MCP tool access is the cleanest \"talk to your post-production assistant\" prototype currently shippable. Whether anyone in AV builds it that way this quarter is a separate question; the building blocks are now all in one place.\n\n**Source:** [ElevenLabs \u2014 Introducing Expressive Mode](https://elevenlabs.io/blog/introducing-expressive-mode) \u00b7 [ElevenLabs Changelog \u2014 May 4, 2026](https://elevenlabs.io/docs/changelog/2026/5/4) \u00b7 May 4\u20137, 2026\n\n### Revopoint POP 4 Brings Native Gaussian Splatting to a Consumer 3D Scanner\n\nRevopoint launched a **Kickstarter for the POP 4** the first week of May \u2014 a handheld 3D scanner with native Gaussian Splatting export built in. The pairing matters because it closes the loop on last week's lead story (the Insta360 + Splatica Project Eternal pipeline). One device captures a 360 video walk-through and converts it to a navigable splat in the cloud; the other captures a fixed-volume object or space at sub-millimeter precision and exports the splat directly from the device.\n\nPOP 4 specs worth flagging:\n\n- **0.03mm single-frame accuracy** \u2014 the highest accuracy class for any consumer 3D scanner currently shipping.\n- **Multi-mode capture**: full-field HD scanning, blue laser scanning, and infrared structured-light, with up to **105 fps in multi-line laser mode**.\n- **Direct `.PLY` and `.SPLAT` export** \u2014 drops directly into Unreal, Unity, Blender, and game-engine viewers.\n- **Color RGB capture** integrated into the splat output, rather than as a separate texture pass.\n\n**The category context is the story.** Within a single week (Insta360 + Splatica) and the next (Revopoint POP 4), consumer hardware has moved from \"Gaussian splatting is a research demo\" to \"you can buy two different devices that produce splats out of the box.\" Add to that the Khronos `KHR_gaussian_splatting` glTF extension reaching release-candidate status in February (full ratification expected this quarter) and NVIDIA's vkSplatting demo at GTC in March, and the standardization layer is shipping at the same moment as the consumer-capture layer.\n\nFor AVS teams running virtual production, previs, or location-scouting workflows, the implication is concrete: scene capture is no longer a specialty rig question. It's a procurement question.\n\n**Source:** [3DVF \u2014 Revopoint POP 4 launch](https://3dvf.com/en/redaction/revopoint-launches-a-kickstarter-campaign-for-their-pop-4-3d-scanner-heres-what-it-can-do-for-you/) \u00b7 [The Future 3D \u2014 State of Gaussian Splatting 2026](https://www.thefuture3d.com/blog/state-of-gaussian-splatting-2026/) \u00b7 [Splat Labs \u2014 NVIDIA vkSplatting context](https://www.splatlabs.ai/blog/nvidia-vulkan-gaussian-splatting-2026) \u00b7 May 5\u20137, 2026\n\n---\n\n## Voices This Week\n\n### Eric Yang on Topaz's Architectural Reset\n\nTopaz Labs CEO **Eric Yang**, in the May 7 expansion announcement: \"This is our largest fundamental improvement in model quality in years.\" Yang's framing matters because Topaz had been running essentially the same diffusion architecture since 2018 with iterative model improvements layered on top. Hyperion 2 plus the Next-Gen release the week prior is an architecture overhaul disguised as a product release, and Yang is signaling that the prior generation of upscalers and enhancers \u2014 including the ones AV teams have integrated into their post pipelines for years \u2014 are now legacy.\n\n### Chad Nelson on AI as Production Infrastructure\n\n**Chad Nelson**, OpenAI creative strategist and producer on \"Critterz,\" has been making one argument consistently across press for the film: AI is being used in the production pipeline, not in the creative authorship. The screenplay is human. The voice cast is human. The director is human. The pitch to buyers at Cannes is essentially that the cost-and-time math improves dramatically when the production tooling gets better, *not* because the creative decisions get automated. Whether that distinction holds up under buyer scrutiny is the question every studio is watching this week.\n\n### Equity on Twinnin\n\nUK actors' union **Equity** issued a statement on the Twinnin funding round declining to endorse the platform, while acknowledging the company's engagement with the union on ethical practices. The careful phrasing \u2014 *engagement* but not *endorsement* \u2014 is the working definition of where the union framework sits right now: not yet adversarial, not yet partnered, watching closely. The follow-up question is what SAG-AFTRA's analogous position will look like; it's currently under internal review and is expected to be communicated to members later this month.\n\n---\n\n## Common Threads\n\n### The Cannes Split Is a Template\n\nCannes 2026 is the first major festival to draw a clean public line between AI as production infrastructure (allowed in the market, allowed in non-competition films) and AI as creative authorship (banned from competition). The clarity is unusual \u2014 most festivals to date have left their position vague. Whether other festivals \u2014 Venice, Toronto, Sundance \u2014 adopt or reject the same boundary in their fall and winter announcements is now the next industry-watching question. The argument the festival is making is also the argument every individual AV professional is being asked to make on their own work: where does the production tool stop and the authorship begin?\n\n### Foundation Models Are Competing on Pricing-and-Speciality, Not Headline Capability\n\nGPT-5.5 Instant ships as a quality upgrade to the default that everyone hits. Grok 4.3 ships as cheaper and agentic-first with a deliberate domain bet on legal and corporate finance. DeepSeek V4 ships as 86% cheaper than GPT-5.5 with comparable benchmarks. HappyHorse 1.0 ships as the #1 video model open-source. The pattern across the spring releases: nobody is winning the headline-capability race outright, and increasingly nobody is trying to. The competition has bifurcated \u2014 frontier capability for the highest-margin work, and aggressive specialty pricing for the long tail of background tasks. The practical consequence for AV teams is that the right model for any given workflow is increasingly *not* the model at the top of the leaderboard.\n\n### Capture Is Migrating to Consumer Hardware Faster Than Anyone Predicted\n\nTwo consecutive weeks of consumer Gaussian-splatting capture launches \u2014 Insta360 + Splatica last week, Revopoint POP 4 this week \u2014 confirm the volumetric-capture migration that NAB 2026 hinted at six weeks ago. The standardization layer (`KHR_gaussian_splatting` glTF extension, NVIDIA's vkSplatting tooling) is shipping at the same time as the consumer-capture layer. The combined effect is that scene capture is becoming a commodity input format, the way 4K video capture became one between roughly 2014 and 2018. The downstream implication for production workflows is that the next two years of NLE updates, virtual-production stage software, and game-engine integrations will be focused on splat *consumption* and *editing*, not capture.\n\n### The Likeness Economy Is Being Built in Public\n\nTwinnin's $3M seed and YouTube's likeness-detection tool are the supply side and the enforcement side of the same problem launching three weeks apart. Both are operating ahead of the union framework. Equity's non-endorsement and SAG-AFTRA's pending position make the gap explicit. The question for AV teams isn't whether your organization will need a position on this \u2014 it's how quickly the position will need to be written down once a contract requires one.\n\n---\n\n## Novel Ideas Worth Watching\n\n### \"Critterz\" as a Cost-Math Precedent\n\nIf \"Critterz\" sells well at the March\u00e9 next week, the $30M-and-9-months production model becomes the precedent every AI-assisted feature for the next 24 months gets benchmarked against. The interesting follow-on is whether mid-budget animated features (the $40\u201380M range that has been squeezed by streaming consolidation) is the actual unlock \u2014 not low-budget indie animation, where the cost math was already manageable, and not tentpole animation, where the creative-control question is more fraught.\n\n### Specialty-Pricing Foundation Models Reaching the AV Stack\n\nGrok 4.3's deliberate cost positioning is interesting less because of the price itself and more because it's the first frontier-tier model explicitly engineered to be a *background-task* model rather than a flagship. The thesis \u2014 \"specialty-pricing for the long tail of agentic batch work\" \u2014 is the same thesis that ElevenLabs and Topaz have been operating on quietly for two years. The next watch-item is whether Anthropic and OpenAI ship analogous discount-tier offerings (a Claude Haiku 4.7 or a GPT-5.5 Mini priced for batch work) in the next two quarters.\n\n### Voice Agents With Backend Choice\n\nThe Eleven v3 Conversational + ElevenAgents + Claude Opus 4.7 / GPT-5.5 backend stack is the first cleanly-shippable \"talk-to-your-assistant\" prototype that doesn't require committing to a single provider's full stack. Voice from one vendor, intelligence from another, tool access via MCP from a third. This composability has been the agentic-AI promise for two years; the May 4 SDK update is the first time it's actually shipped without manual integration work.\n\n### Splat-Native Editing as an Open Workflow Question\n\nNow that consumer scanners and 360 cameras both produce Gaussian splats out of the box, the missing layer is the editing one. Photoshop's role in the still-image pipeline took roughly five years to crystallize. The splat-native equivalent doesn't exist yet \u2014 and the company that ships it (whether Adobe, Blackmagic, Niantic, an existing 3D tool like Blender, or a new entrant) is the one that defines volumetric-media production for the rest of the decade.\n\n---\n\n## Tip of the Week\n\n### Build a Personal Context File This Weekend\n\nThe single highest-leverage move any AV professional can make right now to adopt AI tools \u2014 independent of which tools they use \u2014 is to write a one-page personal context file once, and reuse it everywhere.\n\n**The problem it solves.** Every time you start a new ChatGPT session, open a new Claude project, or fire up a new agent, you re-explain who you are, what your team does, what your current projects are, who your stakeholders are, and how you communicate. That re-explanation is the friction. It's also the reason most people's AI output reads generic \u2014 they're starting from zero on every prompt, so the model is starting from the global average on every response.\n\n**What goes in the file.** Five short sections, one page total:\n\n1. **Identity** \u2014 your name, role, team, communication style, and 3\u20135 hard rules the AI should never break (e.g., *\"never write in marketing voice,\" \"always cite sources for technical claims,\" \"default to concise; expand only on request\"*).\n2. **Context** \u2014 AVS team structure, current major projects, key stakeholders, recurring deliverables. Update when something changes; don't try to keep it complete.\n3. **Tools you use** \u2014 Premiere, Resolve, Pro Tools, Frame.io, whichever color/sound stack \u2014 so AI knows which platform-specific advice is relevant when you ask a workflow question.\n4. **Voice samples** \u2014 two or three short examples (a paragraph each) of how you write or speak. The model uses these to match your style without you having to describe it.\n5. **What you typically ask AI to help with** \u2014 drafting, summarizing, troubleshooting, ideation. This biases the model toward your usual mode without you having to prompt it explicitly each time.\n\n**Where to drop it.**\n\n- **ChatGPT**: Settings \u2192 Personalization \u2192 Custom Instructions. Two text fields, paste the file split across them.\n- **Claude**: Create a Project, paste the file as the project's \"Custom Instructions.\" Every chat in that project inherits it.\n- **Cursor / Codex / agentic coding tools**: name it `AGENTS.md` and put it at your repo root.\n- **Anywhere else**: keep the markdown file in your notes app and paste the relevant section into the system prompt or first message.\n\n**Why it compounds.** Every interaction you have with AI for the next year benefits from the file. You write it once. The cost is one weekend; the value is a lower-friction, higher-quality output across every tool you currently use and every tool you adopt next.\n\nThis is the user-side first move on the \"Agent OS\" framework we covered last week. The seven-layer architecture starts here. Do this part now; the rest of the layers (skills, memory, connections, automations) only matter if the foundation is in place.\n\n---\n\n## Sources\n\n1. [Deadline \u2014 AGC boards \"Critterz\"](https://deadline.com/2026/05/open-ai-produced-animated-family-film-critterz-cannes-1236879586/) \u2014 May 5, 2026 \u2014 \"Critterz\" announcement and worldwide sales boarding\n2. [Variety \u2014 Critterz at Cannes Market](https://variety.com/2026/film/news/critterz-agc-1236736009/) \u2014 May 2026 \u2014 Production details and budget context\n3. [The Verge \u2014 OpenAI Hollywood with Critterz](https://theverge.com/news/773584/openai-animated-feature-film-critterz) \u2014 May 2026 \u2014 Critterz at Cannes coverage\n4. [March\u00e9 du Film \u2014 AI for Talent Summit](https://www.marchedufilm.com/news/ai-for-talent-summit/) \u2014 April 2026 \u2014 Summit dates and program\n5. [The Guardian \u2014 Cannes' AI position](https://www.theguardian.com/technology/2026/apr/26/cannes-ai-film-festival-raises-eyebrows-questions-future) \u2014 April 26, 2026 \u2014 Festival's Palme d'Or position\n6. [Variety \u2014 Cannes March\u00e9 du Film 2026 program](https://variety.com/2026/film/global/cannes-marche-du-film-immersive-creator-ai-2026-program-1236704795/) \u2014 April 2026 \u2014 March\u00e9 AI program details\n7. [OpenAI \u2014 Introducing GPT-5.5 Instant](https://openai.com/index/gpt-5-5-instant/) \u2014 May 5, 2026 \u2014 Release announcement\n8. [TechCrunch \u2014 GPT-5.5 Instant launch](https://techcrunch.com/2026/05/05/openai-releases-gpt-5-5-instant-a-new-default-model-for-chatgpt/) \u2014 May 5, 2026 \u2014 Default model upgrade context\n9. [OpenAI \u2014 GPT-5.5 Instant System Card](https://openai.com/index/gpt-5-5-instant-system-card/) \u2014 May 5, 2026 \u2014 Hallucination metrics and benchmarks\n10. [Artificial Analysis \u2014 Grok 4.3 launch](https://artificialanalysis.ai/articles/xai-launches-grok-4-3-with-improved-agentic-performance-and-lower-pricing) \u2014 May 5\u20136, 2026 \u2014 Benchmark analysis and pricing comparison\n11. [DocsBot \u2014 Grok 4.3 model details](https://docsbot.ai/models/grok-4-3) \u2014 May 2026 \u2014 API specs and capabilities\n12. [DataStudios \u2014 Grok 4.3 deep-dive](https://www.datastudios.org/post/grok-4-3-characteristics-pricing-benchmarks-context-window-api-access-and-what-changed-from-gr) \u2014 May 2026 \u2014 Pricing comparison vs. Grok 4.20\n13. [Topaz Labs \u2014 May 2026 Expansion Update](https://lifestyle.kbew98country.com/story/212737/topaz-labs-announces-new-video-enhancement-model-features-and-model-access-as-part-of-larger-company-wide-expansion/) \u2014 May 7, 2026 \u2014 Hyperion 2 and Premiere panel announcement\n14. [Topaz Labs \u2014 SDR-to-HDR documentation](https://docs.topazlabs.com/topaz-video/filters/sdr-to-hdr) \u2014 May 2026 \u2014 Hyperion 2 ITM technology\n15. [Topaz Labs \u2014 Next-Gen release recap](https://www.topazlabs.com/news/the-next-gen-release---april-2026) \u2014 April 28, 2026 \u2014 Architecture context for Hyperion 2\n16. [Deadline \u2014 Twinnin opens funding round](https://deadline.com/2026/05/ai-plaform-twinnin-funding-round-3-million-signs-up-twins-1236882734/) \u2014 May 2026 \u2014 $3M seed round details and Equity position\n17. [Deadline \u2014 AI Actors Platform Twinnin Divides Opinion](https://deadline.com/2026/04/artificial-intelligence-twinnin-app-divides-film-tv-opinion-1236783395/) \u2014 April 2026 \u2014 Industry reception and controversy\n18. [YouTube Blog \u2014 Likeness detection rollout](https://blog.youtube/news-and-events/youtube-likeness-detection-ai-protection/) \u2014 April 2026 \u2014 Entertainment industry expansion\n19. [Hollywood Reporter \u2014 YouTube tool open to celebrities](https://www.hollywoodreporter.com/business/digital/youtube-ai-deepfake-detection-tool-1236569593/) \u2014 April 2026 \u2014 Talent agency partner     const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of May 8, 2026\n\n> Quick Summary: **Cannes 2026 opens Tuesday with the AI question split clean down the middle** \u2014 AGC boards \"Critterz,\" the first $30M mainstream commercial AI-assisted animated feature, while the festival itself bans AI from Palme d'Or competition. **OpenAI ships GPT-5.5 Instant** as the new default for every ChatGPT user, with a 52.5% reduction in hallucinated claims. **xAI's Grok 4.3** lands with strong agentic benchmarks at roughly half the price of GPT-5.5, plus #1 leads on legal and corporate-finance evaluations. **Topaz Labs follows last week's Next-Gen rebuild with Hyperion 2** (a new SDR-to-HDR upscaler) and a UXP panel that drops Topaz cloud processing into the Premiere editing interface. The **AI-actor likeness economy** moves from concept to capital \u2014 Twinnin opens a $3M seed round backed by Google and NVIDIA while UK union Equity refuses to endorse the platform, and **YouTube's deepfake-detection tool quietly rolls out to the entire entertainment industry**, free to any actor or athlete who can pass an ID-plus-selfie verification.\n\n---\n\n## The Big Stories This Week\n\n### Cannes 2026: AGC Boards \"Critterz\" While the Festival Bans AI From Competition\n\nCannes opens Tuesday, May 12 with the AI question split between the festival and its market. **AGC Studios boarded \"Critterz\" for worldwide sales** on May 5 \u2014 the first mainstream commercial film to use generative AI throughout its production pipeline. **Budget: ~$30M** (vs. ~$80\u2013100M for a comparable traditional animated feature). **Production timeline: ~9 months** (vs. ~3 years). Direction by **Nik Kleverov** (Native Foreign), produced by **Chad Nelson** (OpenAI creative strategist), with screenplay by **James Lamont and Jon Foster** (*Paddington in Peru*). The voice cast is **entirely human**; AI is used in the production pipeline rather than for performance.\n\n**Cannes itself banned AI from Palme d'Or competition** \u2014 the festival's stated position: \"AI imitates very well, but it will never feel deep emotions.\" The **March\u00e9 du Film expanded its AI for Talent Summit** to two mornings (May 15\u201316), up from a single day in 2025.\n\n**Why the split is the story.** Cannes is positioning itself as both gatekeeper and growth platform \u2014 protecting the artistic legitimacy of the Palme d'Or while letting the market embrace whatever buyers will pay for. Cannes 2026 is the first major festival to draw the \"AI as production infrastructure\" vs. \"AI as creative authorship\" line publicly. The next data point is buyer reception. If \"Critterz\" sells well at the March\u00e9, the $30M \u00f7 9-month production model becomes the precedent every AI-assisted feature for the next 24 months gets benchmarked against.\n\n### OpenAI Ships GPT-5.5 Instant \u2014 The Default Quality Bar Moves\n\nOpenAI released **GPT-5.5 Instant** on May 5, replacing GPT-5.3 Instant as the default model for every ChatGPT user \u2014 including the free tier. This is not a minor refresh.\n\nThe headline numbers:\n\n- **52.5% reduction in hallucinated claims** on high-stakes prompts in medicine, law, and finance\n- **37.3% reduction in inaccurate claims** on user-flagged factual errors\n- **AIME 2025: 81.2** (vs. 65.4 for GPT-5.3 Instant)\n- **1M token context window**, 128K max output tokens\n- Better web-search use, better image analysis, better personalization\n\n**API pricing**: $5.00 per million input tokens, $30.00 per million output, $0.50 cached input. Prompts above 272K input tokens are charged at 2\u00d7 input and 1.5\u00d7 output. GPT-5.3 Instant remains available to paid API users for three months.\n\n**For AV teams**, the floor moved. Anyone using ChatGPT for shot-list scaffolding, rough script polish, transcription cleanup, metadata pass review, or release-note drafting is now getting the upgraded model whether they paid for it or not. The hallucination reduction matters most where AV intersects technical claims \u2014 codecs, color spaces, audio formats, platform specs.\n\n### Grok 4.3: Agentic Benchmarks at Roughly Half the Price of GPT-5.5\n\nxAI publicly announced **Grok 4.3** on May 5\u20136 after a quiet API rollout April 30. Grok 4.3 sits behind GPT-5.5, Claude Opus 4.7, and Gemini 3.1 Pro on broad capability \u2014 but its positioning is the story.\n\nThe benchmark profile:\n\n- **#1 on Vals Case Law (v2): 79.3%** \u2014 the model now leads the legal benchmark\n- **#1 on Vals Corporate Finance (v2): 68.5%**\n- **Tied #1 on \u03c4\u00b2-Bench Telecom: 98%** \u2014 agentic customer-support evaluation\n- **+321 Elo points** on GDPval-AA real-world agentic tasks (1,179 \u2192 1,500)\n\n**API pricing**: $1.25 per million input tokens, $2.50 per million output \u2014 roughly 37.5% lower input and 58.3% lower output costs vs. Grok 4.20, and approximately one-quarter to one-half the comparable GPT-5.5 / Claude Opus 4.7 token cost. Cached input ~$0.31 per million.\n\n**The positioning is the story.** Grok 4.3 is being marketed not as the smartest model but as the one to use when you need agentic tool calling at scale and have to manage cost. For AV teams whose AI use is dominated by background batch tasks (metadata generation, transcription cleanup, rough draft work) rather than frontier creative work, the price-per-token math gets attention.\n\n### Topaz Ships Hyperion 2 + a Native Adobe Premiere Panel\n\nTopaz Labs followed last week's Next-Gen rebuild with two pieces that matter more for working AV teams than the original launch did. **Hyperion 2** is a new SDR-to-HDR upscaler that uses inverse tone mapping to convert standard dynamic range footage to HDR, expanding the dynamic range from 6\u201310 stops to 12\u201317.6 stops, BT.1886/Rec. 709 SDR sources to BT.2100/PQ HDR output. The pitch: archival SDR libraries get a one-pass route to HDR delivery.\n\n**Topaz Labs for Premiere** is the bigger workflow change. The new UXP panel (`topazlabs.com/premiere-panel`) lets editors send media directly from a Premiere project timeline to Topaz cloud processing and pull the result back into the same project bin without an export-import roundtrip. Same Topaz subscription tiers; cloud-processing minutes count against the standard credit pool.\n\nCEO Eric Yang framed Next-Gen + Hyperion 2 + Premiere panel as Topaz's first model architecture overhaul since 2018. The short-term context is that the Premiere integration moves Topaz from \"the tool you switch to when you need a rescue pass\" into \"a tab inside your existing edit session.\"\n\n### The Likeness Economy Moves: Twinnin Raises $3M, YouTube Detection Goes Live for Hollywood\n\nTwo stories that, taken together, define the AI-actor likeness economy in 2026 \u2014 one selling licensed digital likenesses to studios, the other helping take down unlicensed deepfakes.\n\n**Twinnin opened a $3M seed round** at a $25M post-money valuation. The platform lets actors post a digital likeness that studios and brands can license. **Pricing**: $14.99/year for actors; $499\u2013$1,200/month for studios/brands. Backers include **Google and NVIDIA**. The platform reports **2,000 signed actors with weekly subscriber doubling**. **UK actors' union Equity does not endorse the platform**, citing consent enforcement concerns. SAG-AFTRA's position is under review.\n\n**YouTube expanded its AI-powered likeness detection tool** to the entire entertainment industry, built in partnership with **CAA, UTA, WME, and Untitled Management**. Works similarly to Content ID \u2014 scans YouTube for AI-generated deepfakes of enrolled participants and lets them request takedowns. Free; verification requires an ID and selfie video. Rollout sequence: creators (Fall 2025) \u2192 politicians and journalists (March 2026) \u2192 entertainment industry (April\u2013May 2026).\n\n**Why these stories travel together.** Twinnin is supply-side: a marketplace where actors can opt their faces into a system that monetizes synthetic use. YouTube's detection is the enforcement layer for what they did *not* opt into. Both are operating ahead of the union framework. Equity's non-endorsement and SAG-AFTRA's pending position make the gap explicit.\n\n### ElevenLabs Ships Expressive Mode + Eleven v3 Conversational\n\nElevenLabs released **Expressive Mode for ElevenAgents** the week of May 4, anchored on a new TTS model \u2014 **Eleven v3 Conversational** \u2014 that maintains conversational context and produces speech reflecting intent, emotion, and emphasis. New turn-taking system reduces the awkward overlap-or-step-on-each-other failure mode of voice agents. 70+ language support with native expressive control across all of them.\n\nAdjacent SDK updates: conversation tags, enhanced filters, expanded LLM model options (Claude Opus 4.7, GPT-5.4, GPT-5.5, Qwen3 added as agent backends), and increased MCP response timeouts.\n\n**For AV teams**, the obvious uses are voice cloning for ADR pickup, multilingual dubbing, and voiceover drafts. The more interesting downstream is the agent integration: Eleven v3 Conversational + ElevenAgents + Claude Opus 4.7 with MCP tool access is the cleanest \"talk to your post-production assistant\" prototype currently shippable.\n\n### Revopoint POP 4 Brings Native Gaussian Splatting to a Consumer 3D Scanner\n\nRevopoint launched a **Kickstarter for the POP 4** the first week of May \u2014 a handheld 3D scanner with **native Gaussian Splatting export built in**. The pairing matters because it closes the loop on last week's lead story (Insta360 + Splatica's Project Eternal). One device captures a 360 walk-through. The other captures a fixed-volume object or space at sub-millimeter precision and exports the splat directly from the device.\n\nPOP 4 specs worth flagging:\n\n- **0.03mm single-frame accuracy** \u2014 highest accuracy class for any consumer 3D scanner currently shipping\n- **Multi-mode capture** with up to **105 fps in multi-line laser mode**\n- **Direct `.PLY` and `.SPLAT` export** \u2014 drops directly into Unreal, Unity, Blender\n- Color RGB capture integrated into the splat output\n\n**The category context is the story.** Within a single week (Insta360) and the next (Revopoint), consumer hardware has moved from \"Gaussian splatting is a research demo\" to \"you can buy two different devices that produce splats out of the box.\" For AVS teams running virtual production, previs, or location-scouting workflows, the implication is concrete: scene capture is no longer a specialty rig question. It's a procurement question.\n\n---\n\n## Tip of the Week\n\n### Build a Personal Context File This Weekend\n\nThe single highest-leverage move any AV professional can make right now to adopt AI tools is to **write a one-page personal context file once, and reuse it everywhere**.\n\n**Why it works.** Every time you start a new ChatGPT session, open a new Claude project, or fire up a new agent, you re-explain who you are, what your team does, what your current projects are. That re-explanation is the friction. It's also the reason most people's AI output reads generic \u2014 they're starting from zero on every prompt.\n\n**Five short sections, one page total**:\n\n1. **Identity** \u2014 name, role, team, communication style, 3\u20135 hard rules the AI should never break\n2. **Context** \u2014 AVS team structure, current major projects, key stakeholders, recurring deliverables\n3. **Tools you use** \u2014 Premiere, Resolve, Pro Tools, Frame.io, color/sound stack\n4. **Voice samples** \u2014 two or three short examples of how you write or speak\n5. **What you typically ask AI to help with** \u2014 drafting, summarizing, troubleshooting, ideation\n\n**Where to drop it**: ChatGPT Custom Instructions, Claude Project Custom Instructions, `AGENTS.md` for agentic coding tools, or just a markdown file you paste from. Write once, benefit for a year. This is the user-side first move on the \"Agent OS\" framework we covered last week \u2014 the foundation layer the rest of the agent infrastructure builds on.\n\n---\n\n## Why This Week Matters\n\nA few patterns worth noting:\n\n- **The Cannes split is a template.** Cannes 2026 is the first major festival to draw a clean public line between AI as production infrastructure (allowed) and AI as creative authorship (banned from competition). Whether other festivals \u2014 Venice, Toronto, Sundance \u2014 adopt or reject the same boundary in their fall and winter announcements is now the next industry-watching question. The argument the festival is making is also the argument every individual AV professional is being asked to make on their own work.\n\n- **Foundation models are competing on pricing-and-specialty, not headline capability.** GPT-5.5 Instant ships as a quality upgrade to the default. Grok 4.3 ships as cheaper and agentic-first with a deliberate domain bet. DeepSeek V4 ships as 86% cheaper than GPT-5.5. HappyHorse 1.0 ships as the #1 video model open-source. Nobody is winning the headline-capability race outright, and increasingly nobody is trying to. The right model for any given workflow is increasingly *not* the model at the top of the leaderboard.\n\n- **Capture is migrating to consumer hardware faster than anyone predicted.** Two consecutive weeks of consumer Gaussian-splatting capture launches confirm the volumetric-capture migration. The standardization layer (`KHR_gaussian_splatting` glTF extension, NVIDIA's vkSplatting) is shipping at the same time as the consumer-capture layer. Scene capture is becoming a commodity input format the way 4K video capture became one between 2014 and 2018.\n\n- **The likeness economy is being built in public \u2014 ahead of the union framework.** Twinnin's $3M seed (supply side) and YouTube's likeness-detection rollout (enforcement side) are answering the same question three weeks apart. Both are operating ahead of the union framework. Equity's non-endorsement and SAG-AFTRA's pending position are the early warning that the contract language hasn't caught up to the platform design yet.\n\n- **NLE integration is the next AI moat.** Topaz shipping a Premiere UXP panel three weeks after a complete model architecture overhaul is the short version of where this is going. Adobe's Firefly Video Editor integrates Kling, Veo, Sora, and Topaz Astra. ElevenAgents integrates Claude, GPT-5.5, and Qwen3 as backends. The unit of competition is no longer the model \u2014 it's the surface where the model meets the editor's existing timeline.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
