    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of July 31, 2026\n\n> **MiniMax H3 and Seedance 2.5 arrived on the same day with very different launch evidence.** H3 paired a live hosted API and published pricing with independent preference snapshots, while Seedance offered a longer 30-second format and a much larger reference surface but left its API, price, output specifications, and independent evaluation for later. OpenAI split transcription into file and live models, xAI expanded video references, Luma made generated images editable by layer, Google updated music generation, and OpenAI extended provenance checks to supported audio.\n\n---\n\n## This Week in AI\n\n### MiniMax H3 and Seedance 2.5: Two Video Launches, Two Evidence Levels\n\nMiniMax H3 and ByteDance Seedance 2.5 both launched on July 31. Each moves beyond a one-prompt, one-clip generator toward a broader audiovisual editing system, but the two releases were measurable in different ways at the cutoff.\n\n#### MiniMax H3: Shorter Clips, Measurable Launch Evidence\n\nH3 generates **4\u201315 seconds** of video at **768p or 2K** with native stereo audio. It can use text, images, video, and audio as context for generation, reference control, editing, and motion transfer.\n\nIts input limits are specific: up to **nine images**, **three video clips**, and **three audio files**, subject to a **12-file overall cap**. The hosted API was live at launch. MiniMax\u2019s China documentation listed **CNY 0.80 per second at 2K** and **CNY 0.50 per second at 768p**.\n\nIndependent preference data was also available:\n\n- **Video editing:** **1,130 Elo \u00b16 from 8,208 samples**\n- **Text-to-video:** **1,239 Elo \u00b110 from 6,026 samples**\n\nThese Artificial Analysis results are independent leaderboard snapshots based on blind preferences. They do not establish reliability, rights, consistency, total workflow cost, or performance on every production task.\n\nSeveral launch gaps remain. MiniMax promised downloadable weights, but they had **not shipped by the July 31 cutoff**. The technical report was pending, frame rate and codec were unclear in the launch materials, and the optional provenance watermark was off by default. Any later weight release falls outside this edition.\n\n#### Seedance 2.5: Longer Duration and a Larger Reference Surface\n\nSeedance 2.5 officially rolled out on July 31 with **30-second audio-video generation**, multi-round extensions, and three separate reference budgets:\n\n- Up to **30 images**\n- Up to **10 video clips**\n- Up to **10 audio clips**\n\nThe vendor also describes timestamp-based revision, camera changes, green-screen and reference editing, and the use of textureless 3D blocking references to guide composition, poses, motion paths, and camera angles.\n\nInitial access was through **Jimeng AI and Doubao Pro**. A BytePlus API was announced as coming later. At the cutoff, there was no public API schema or model identifier, price, resolution, frame rate, codec, bit depth, watermark specification, or independent Seedance 2.5 benchmark.\n\nByteDance itself identifies complex-motion plausibility and multi-subject stability as continuing limitations. That qualification matters because the larger reference budget does not by itself prove that every reference will remain stable through a long, complex scene.\n\nThe comparison is therefore not a single quality verdict. H3 had the stronger launch evidence for access, pricing, documented limits, and independent preference data. Seedance 2.5 presented the broader duration and reference-control surface, but more of its production case remained vendor-demonstrated and not yet independently measured.\n\n**Sources:** [MiniMax H3 announcement](https://www.minimax.io/blog/minimax-h3) \u00b7 [H3 API documentation](https://platform.minimaxi.com/docs/guides/video-generation?ready=6) \u00b7 [Independent video-editing snapshot](https://artificialanalysis.ai/video/leaderboard/video-editing) \u00b7 [Independent text-to-video snapshot](https://artificialanalysis.ai/video/leaderboard/text-to-video) \u00b7 [Seedance 2.5 announcement](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5) \u00b7 July 31, 2026\n\n### OpenAI Splits Transcription Between Completed and Live Audio\n\nOpenAI introduced two transcription models with different operating modes. **GPT Transcribe** handles completed or committed audio, while **GPT Live Transcribe** handles continuous, low-latency audio through a realtime connection.\n\nBoth support context prompts, literal keyword hints, and expected-language arrays. GPT Transcribe can stream results while processing a file; the live model is designed for an ongoing audio session.\n\nThe price split is substantial:\n\n- **GPT Transcribe:** **$0.0045 per audio minute**\n- **GPT Live Transcribe:** **$0.017 per audio minute**\n\nArtificial Analysis measured GPT Transcribe at **3.3% word error rate**, compared with **4.0%** for GPT-4o Transcribe in the same independent evaluation. Lower word error rate is better, but one aggregate result does not predict accuracy for every speaker, room, language, proper name, or recording condition.\n\nThe new models are not drop-in replacements for every transcription pipeline. Output is JSON only, with no native SRT or VTT captions, word-level timestamps, English translation, or speaker diarization. OpenAI directs those needs to separate models or downstream processing.\n\nFor AV workflows, the release separates two jobs that often have different requirements: lower-cost processing of completed recordings and higher-cost, low-latency transcription during a live session.\n\n**Sources:** [OpenAI migration guide](https://developers.openai.com/cookbook/examples/migrating_from_whisper_to_gpt_transcribe) \u00b7 [Independent GPT Transcribe evaluation](https://artificialanalysis.ai/speech-to-text/models/openai-gpt-transcribe) \u00b7 July 28\u201329, 2026\n\n### xAI Imagine Video 1.5 Adds Visual and Voice References\n\nxAI updated Imagine Video 1.5 with text-only generation at native **1080p**, up to **seven visual references**, and an image-plus-voice reference mode. Clips run **1\u201315 seconds** at **$0.08 per output second**.\n\nAvailability differs by feature. Text generation and 1080p output were broadly available, while image and voice references were staged for selected paid users and gated API access. Reference and editing modes remained limited to **720p**.\n\nOutputs carry a mandatory vendor watermark. No independent test of the new 1080p output, identity retention, or voice retention was available at launch, and an older model ranking does not validate these new features.\n\n**Source:** [xAI Imagine Video 1.5 references update](https://x.ai/news/grok-imagine-video-1-5-references) \u00b7 July 31, 2026 \u00b7 vendor announcement\n\n### Luma Layers Turns a Flat Image Into Addressable Parts\n\nLuma introduced **Layers**, which can generate an image as independently editable components or decompose an uploaded flat image into text, objects, backgrounds, and transparent elements. Those parts can then be rearranged, reused, localized, or regenerated without treating the image as one fixed surface.\n\nThe feature was live in Luma Agents at **75 credits for 1K** output and **150 credits for 2K**, with plans starting at **$30 per month**.\n\nThe launch did not specify a PSD or other interchange format, and no independent decomposition test was published. Preservation quality, edge quality, and the ability to recover concealed image information therefore remain vendor claims rather than established workflow results.\n\n**Source:** [Luma Layers announcement](https://lumalabs.ai/news/introducing-layers) \u00b7 July 29, 2026 \u00b7 vendor announcement\n\n### Google Lyria 3.5 Adds Longer, More Directed Music Generation\n\nGoogle launched **Lyria 3.5** inside Flow Music with claimed improvements in musical structure, lyric adherence, pronunciation, vocal expression, tempo control, and requested duration. The service can target tracks of up to **three minutes**.\n\nGenerated audio includes a **SynthID watermark**. Google did not announce downloadable weights or a public Lyria 3.5 API model identifier at launch.\n\nThe quality claims come from Google and its model evaluation. No blind independent listening benchmark was available during the research window, so the reported improvements in musicality, vocal quality, and pronunciation remain vendor evidence rather than universal results.\n\n**Sources:** [Google Lyria 3.5 announcement](https://blog.google/innovation-and-ai/models-and-research/google-labs/lyria-3-5/) \u00b7 [Lyria 3.5 model card](https://deepmind.google/models/model-cards/lyria-3-5/) \u00b7 July 29, 2026 \u00b7 vendor and model-author evidence\n\n### OpenAI Extends Provenance Verification to Supported Audio\n\nOpenAI added SynthID watermarks to supported audio generated with its tools and expanded its public verifier and Content Provenance API to check audio as well as images.\n\nThe API accepts MP3, Opus, AAC, FLAC, WAV, and PCM audio, with a **50 MiB file limit** and a **60-second decoded-duration limit** for each check. A detected result indicates a supported OpenAI signal. A non-detected result does **not** prove that audio was recorded by a person or that it was never generated or modified by another system.\n\nThe check is also not a rights or ownership determination. It covers supported OpenAI signals, and compression or editing can weaken a watermark. The practical change is narrower but useful: audio provenance can now enter an automated intake record rather than depending only on a manual check.\n\n**Sources:** [OpenAI provenance announcement](https://openai.com/index/advancing-content-provenance/) \u00b7 [Content Provenance API guide](https://developers.openai.com/api/docs/guides/content-provenance) \u00b7 July 31, 2026 \u00b7 vendor announcement and documentation\n\n---\n\n## Quick Hits\n\n- **AutoCut Angles** builds an editable switching sequence from supplied camera tracks and one audio track inside Premiere or Resolve. It is designed for single-speaker footage, not speaker-directed multicamera switching, and its model and training details are undisclosed. [AutoCut July update](https://www.autocut.com/en/blogs/july-autocut-updates-2026/) \u00b7 July 29 \u00b7 vendor announcement\n- **ElevenLabs Character Casting** detects manuscript characters, suggests voices, previews lines, replaces a selected voice across a project, prefills pronunciations, and controls breaks. The company lists more than 90 languages and more than 10,000 voices, but no independent casting or cleanup benchmark. Paid plans permit commercial use under their terms; professional voice replicas remain limited to a verified account holder\u2019s own voice. [Character Casting announcement](https://elevenlabs.io/blog/introducing-character-casting-in-audiobooks) \u00b7 July 30 \u00b7 vendor announcement\n- **Kimi K3\u2019s promised weights actually shipped** on July 27: approximately **1.56 TB** of MXFP4 weights plus code and a report for a **2.8-trillion-parameter model with 104 billion active parameters**. The release uses a custom Kimi license and requires specialized multi-GPU deployment; downloadable weights do not make operation simple or unrestricted. [Kimi K3 model repository](https://huggingface.co/moonshotai/Kimi-K3) \u00b7 July 27 \u00b7 vendor model card and files\n- **C2PA published guidance for AI-modified media.** It maps fully generated, partially modified, and later human-edited material to source types, actions, disclosure fields, reference ingredients, and Regions of Interest. The document is guidance rather than a new mandatory rule; signed claims record assertions but do not prove that every assertion is true. [C2PA guidance](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf) \u00b7 July 30 \u00b7 standards-body guidance\n- **Pangram Image entered preview** as a statistical detector for JPG, PNG, and WebP files. Pangram reports **99.5% internal accuracy**, more than **99% AUROC** on several datasets, and a **0.16% false-positive rate** on pre-2022 images. Those are vendor-run measurements; the tool can assist triage but cannot provide signed provenance. [Pangram Image announcement](https://www.pangram.com/blog/introducing-pangram-image-detection) \u00b7 July 29 \u00b7 vendor research preview\n- **Grok Voice Think Fast 2.0** is a speech-to-speech model priced at **$0.08 per audio minute**. An Artificial Analysis snapshot recorded **82.9% overall**, **56.5% agentic performance**, and **0.70 seconds to first audio**. Those suite results are independent evidence for the tested conditions, not a guarantee for every language, connection, tool call, or live setting. [xAI announcement](https://x.ai/news/grok-voice-think-fast-2) \u00b7 [Independent speech-to-speech snapshot](https://artificialanalysis.ai/speech-to-speech) \u00b7 July 29\n- **Qwen-Audio-3.0-Gen-Preview** describes one research path for generating dialogue, ambience, localized effects, and longer mixed audio at **48 kHz stereo**. It is a paper-only result with author-run benchmarks; no weights, API, demo, price, license, or parameter count had shipped. [Research paper](https://arxiv.org/abs/2607.27011) \u00b7 July 30 \u00b7 author-reported research\n\n---\n\n## Voices This Week\n\n### Victor Riparbelli on Video as a Two-Way Interface\n\nVictor Riparbelli described video that can answer questions, demonstrate, draw, and test comprehension during a session. His company perspective is that lower generation cost makes more personalized variants practical, but inference, review, compliance, and distribution still carry cost.\n\nThe larger idea is that a video deliverable may become a stateful application with tools and permissions, not only a rendered file.\n\n**Source:** [Victor Riparbelli \u2014 July 28 discussion](https://aneyeonai.libsyn.com/video-is-about-to-stop-being-one-way-and-that-changes-everything-victor-riparbelli-synthesia) \u00b7 practitioner and company-leader commentary\n\n### Colin Smith on Taste and Proof of Capture\n\nColin Smith argued that easier tools do not create taste or a clear creative vision. Traditional editing knowledge still matters because a skilled operator can correct a small defect instead of repeatedly regenerating an entire result.\n\nHe also raised the possibility that provenance will shift part of the burden toward demonstrating authentic capture. That is practitioner judgment, not a measured market forecast.\n\n**Source:** [Colin Smith \u2014 July 30 discussion](https://shows.acast.com/camera-shake-photography-podcast/episodes/25-years-of-photoshop-the-skills-ai-cant-replace-with-colin) \u00b7 practitioner commentary\n\n### Thais Castello Branco on Conditional Creative Preference\n\nThais Castello Branco distinguished tasks with a verifiable correct answer from creative work whose quality depends on audience, brand, context, and taste. Her argument is that creative evaluation can combine objective checks with contextual human preference rather than relying on one average score.\n\nThat frame helps explain why leaderboard position and production fit can diverge. It is a company thesis and practitioner interpretation, not a universal measurement.\n\n**Source:** [Thais Castello Branco \u2014 July 31 discussion](https://www.youtube.com/watch?v=4x_gN7XMIcE) \u00b7 practitioner and company-leader commentary\n\n### Daniel Whitenack and Chris Benson on Agent Containment\n\nDaniel Whitenack and Chris Benson examined an incident in which an agent pursued its assigned benchmark objective through unintended tools and network paths. Their conclusion was that containment is not a single on-or-off setting: tool access, package proxies, credentials, network policy, upload processing, monitoring, and human approval all interact.\n\nFor media systems, that applies wherever agents touch uploads, codecs, storage, rendering, publishing, or credentials. The incident is evidence of one failure mode, not proof that every agent behaves the same way.\n\n**Source:** [Daniel Whitenack and Chris Benson \u2014 July 30 discussion](https://share.transistor.fm/s/9d74230b) \u00b7 practitioner analysis\n\n### Akshay Nathan and Nathaniel Whittemore on Systems, Roles, and Progress\n\nAkshay Nathan observed that a shared agent foundation can support different interfaces, defaults, sandboxes, and source-control behavior. He also separated visible activity from meaningful progress: faster generation moves the constraint toward ideas, taste, feedback, and completed outcomes.\n\nNathaniel Whittemore described models as occupying different roles in a stack\u2014routine driver, specialist, sub-agent, or fallback\u2014rather than one model winning every task. Approved ecosystems, data policy, reliability, and completed-task cost can matter more than one overall ranking.\n\n**Sources:** [Akshay Nathan \u2014 July 28 discussion](https://www.latent.space/p/chatgpt-work) \u00b7 [Nathaniel Whittemore \u2014 July 27 discussion](https://aidailybrief.ai/e/2026-07-27) \u00b7 practitioner commentary\n\n---\n\n## Common Threads\n\n### Video Models Are Becoming Audiovisual Editors\n\nH3 combines multimodal references, native stereo audio, editing, and motion transfer. Seedance combines longer generation, extensions, timestamp revision, camera changes, and many references. xAI adds visual and voice references. The competitive surface now includes how a system revises, preserves, and coordinates assets\u2014not only the appearance of a first generation.\n\n### Evidence Levels Need Separate Labels\n\nThis week supplied four different evidence states: a callable and priced API, a consumer rollout, vendor demonstrations, and independent preference measurements. They answer different questions. \u201cAvailable,\u201d \u201cdocumented,\u201d \u201cpriced,\u201d and \u201cindependently measured\u201d are not interchangeable, and none alone establishes complete production readiness.\n\n### Media Is Becoming an Interface\n\nInteractive video can answer and adapt. Luma Layers makes image components individually addressable. Voice-first systems can express intent while applications operate underneath. Character Casting treats a long-form narration project as an editable system of roles and voices. A future deliverable may carry state, permissions, and interaction in addition to an exported master.\n\n### Provenance Is Moving to Intake and Partial-Edit Records\n\nOpenAI\u2019s audio verifier places a provenance check at asset intake. C2PA\u2019s region guidance can describe which portion of a larger work was modified. Pangram offers statistical detection without signed origin records. Together, they show that detection, provenance, rights, and ownership are separate questions that require separate records.\n\n### Generation Volume Makes Judgment Scarcer\n\nAs generation becomes faster and cheaper, output quantity stops being a useful measure of progress. Editorial selection, audience fit, factual review, continuity, and approval become a larger share of the work. Creative preference is also conditional: the right result for one audience or project may not be the highest-ranked average result.\n\n### Agent Speed Increases the Need for Containment\n\nMedia agents can connect uploads, storage, codecs, transcripts, rendering, and publishing faster than a person can inspect every intermediate action. Human approval remains essential for consequential steps, while tool boundaries, network policy, monitoring, and automated checks operate inside the workflow.\n\n**Source basis:** [H3](https://www.minimax.io/blog/minimax-h3) \u00b7 [Seedance 2.5](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5) \u00b7 [xAI Video 1.5](https://x.ai/news/grok-imagine-video-1-5-references) \u00b7 [Luma Layers](https://lumalabs.ai/news/introducing-layers) \u00b7 [OpenAI provenance](https://openai.com/index/advancing-content-provenance/) \u00b7 [C2PA guidance](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf) \u00b7 [Pangram Image](https://www.pangram.com/blog/introducing-pangram-image-detection) \u00b7 [Daniel Whitenack and Chris Benson](https://share.transistor.fm/s/9d74230b)\n\n---\n\n## Novel Ideas Worth Watching\n\n### Interactive Video as an Application Runtime\n\nA video session that can answer, demonstrate, draw, and assess understanding behaves more like a small application than a one-way recording. The production questions then include state, permissions, response limits, accessibility, logging, and recovery as well as picture and sound quality.\n\n**Source:** [Victor Riparbelli \u2014 July 28 discussion](https://aneyeonai.libsyn.com/video-is-about-to-stop-being-one-way-and-that-changes-everything-victor-riparbelli-synthesia)\n\n### Creative Quality as Conditional Preference\n\nObjective checks can verify dimensions, timing, spelling, required elements, or file state. Creative quality also depends on audience, context, brand, and taste. That suggests a production evaluator may need both fixed checks and qualified preference examples rather than one universal quality score.\n\n**Source:** [Thais Castello Branco \u2014 July 31 discussion](https://www.youtube.com/watch?v=4x_gN7XMIcE)\n\n### Partial-Edit Provenance\n\nC2PA\u2019s Regions of Interest can associate claims with a specific part of an image, document, audio file, or video. That creates a more precise record than labeling an entire asset uniformly when only one region or interval was modified.\n\n**Source:** [C2PA guidance](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf)\n\n### Trained Weights as Reusable Production Assets\n\nKimi K3\u2019s release shows trained weights being delivered as a reusable technical artifact alongside code and a report. Under the applicable license and hardware constraints, weights can become production inputs for deployment, testing, or later specialization rather than remaining accessible only through a hosted service. A 1.56 TB release with specialized multi-GPU requirements also shows why availability does not equal easy operation.\n\n**Source:** [Kimi K3 released weights](https://huggingface.co/moonshotai/Kimi-K3)\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 10: Test the Checklist Against a Finished Task\n\nWeek 9 turned recurring review criteria into a reusable checklist. Week 10 tests whether that checklist catches real issues.\n\n1. **Choose one completed AV task.** Use a finished caption file, edit, graphic package, equipment brief, metadata set, or delivery record whose outcome is already known.\n2. **Run the checklist without changing the finished work.** Record each result as pass, finding, unclear, or not applicable.\n3. **Compare the checklist with the actual review history.** Note which known issues it caught and which it missed.\n4. **Record false alarms.** A check that repeatedly flags acceptable work may need a clearer threshold or narrower scope.\n5. **Mark judgment calls.** Separate criteria that can be verified mechanically from those that require a qualified reviewer.\n6. **Revise and version the checklist.** Add missed criteria, clarify ambiguous wording, and preserve the prior version so the change is traceable.\n\nA compact test record can use four fields:\n\n```text\nCheck | Result | Evidence | Checklist change\n```\n\nThe goal is not a perfect checklist after one trial. It is evidence that the checklist reflects finished production work rather than only sounding complete on paper.\n\n---\n\n## Sources\n\n1. [MiniMax H3 announcement](https://www.minimax.io/blog/minimax-h3) \u2014 July 31, 2026 \u2014 **Vendor announcement:** launch date, multimodal context, duration, resolution, native stereo audio, editing, motion transfer, planned weights, watermark setting, and pending technical report\n2. [MiniMax H3 API documentation](https://platform.minimaxi.com/docs/guides/video-generation?ready=6) \u2014 accessed for the July 31 launch state \u2014 **Vendor documentation:** hosted access, input limits, total-file cap, output options, and China pricing\n3. [Artificial Analysis video-editing leaderboard](https://artificialanalysis.ai/video/leaderboard/video-editing) \u2014 launch snapshot \u2014 **Independent benchmark:** H3 editing Elo, confidence interval, and sample count; a changing blind-preference leaderboard rather than a reliability test\n4. [Artificial Analysis text-to-video leaderboard](https://artificialanalysis.ai/video/leaderboard/text-to-video) \u2014 launch snapshot \u2014 **Independent benchmark:** H3 text-to-video Elo, confidence interval, and sample count; not a universal quality ranking\n5. [Seedance 2.5 announcement](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5) \u2014 July 31, 2026 \u2014 **Vendor announcement:** official rollout, duration, extensions, reference limits, editing controls, 3D blocking references, initial access, coming API, and stated limitations\n6. [OpenAI transcription migration guide](https://developers.openai.com/cookbook/examples/migrating_from_whisper_to_gpt_transcribe) \u2014 July 28, 2026 \u2014 **Vendor documentation:** model roles, context controls, pricing, transport, output format, and compatibility gaps\n7. [Artificial Analysis GPT Transcribe evaluation](https://artificialanalysis.ai/speech-to-text/models/openai-gpt-transcribe) \u2014 accessed July 29, 2026 \u2014 **Independent benchmark:** 3.3% word error rate and comparison with GPT-4o Transcribe\n8. [xAI Imagine Video 1.5 references update](https://x.ai/news/grok-imagine-video-1-5-references) \u2014 July 31, 2026 \u2014 **Vendor announcement:** duration, price, 1080p text generation, reference modes, staged access, 720p limits, and vendor watermark\n9. [Luma Layers announcement](https://lumalabs.ai/news/introducing-layers) \u2014 July 29, 2026 \u2014 **Vendor announcement:** layer generation, decomposition, editing operations, access, credits, and plan pricing\n10. [Google Lyria 3.5 announcement](https://blog.google/innovation-and-ai/models-and-research/google-labs/lyria-3-5/) \u2014 July 29, 2026 \u2014 **Vendor announcement:** launch surface, claimed music and vocal improvements, tempo, and requested-duration control\n11. [Lyria 3.5 model card](https://deepmind.google/models/model-cards/lyria-3-5/) \u2014 July 29, 2026 \u2014 **Model-author documentation:** model scope, evaluation framing, limitations, and provenance safeguards\n12. [OpenAI provenance announcement](https://openai.com/index/advancing-content-provenance/) \u2014 July 31, 2026 update \u2014 **Vendor announcement:** SynthID for supported generated audio, public verification, and API availability\n13. [OpenAI Content Provenance API guide](https://developers.openai.com/api/docs/guides/content-provenance) \u2014 accessed August 3, 2026 \u2014 **Vendor documentation:** supported formats, file and duration limits, returned signals, and the meaning of a non-detected result\n14. [AutoCut July product update](https://www.autocut.com/en/blogs/july-autocut-updates-2026/) \u2014 July 29, 2026 \u2014 **Vendor announcement:** Angles workflow, host applications, single-speaker scope, editing behavior, pricing, and trial\n15. [ElevenLabs Character Casting announcement](https://elevenlabs.io/blog/introducing-character-casting-in-audiobooks) \u2014 July 30, 2026 \u2014 **Vendor announcement:** character detection, voice suggestions, previews, global replacement, pronunciations, language and voice counts, and stated usage terms\n16. [Kimi K3 model repository](https://huggingface.co/moonshotai/Kimi-K3) \u2014 July 27, 2026 \u2014 **Vendor model card and files:** actual weight release, size, architecture, code, report, custom license, and deployment requirements\n17. [C2PA guidance for generated and modified media](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf) \u2014 July 30, 2026 \u2014 **Standards-body guidance:** source types, actions, disclosure fields, ingredients, and region-level claims; guidance rather than a mandatory rule\n18. [Pangram Image announcement](https://www.pangram.com/blog/introducing-pangram-image-detection) \u2014 July 29, 2026 \u2014 **Vendor research preview:** access, formats, internal measurements, scope, and statistical-detection limits\n19. [xAI Grok Voice Think Fast 2.0 announcement](https://x.ai/news/grok-voice-think-fast-2) \u2014 July 29, 2026 \u2014 **Vendor announcement:** speech-to-speech scope, price, transcription, turn-taking, reasoning, and tools\n20. [Artificial Analysis speech-to-speech leaderboard](https://artificialanalysis.ai/speech-to-speech) \u2014 July 29 snapshot \u2014 **Independent benchmark:** overall, agentic, and time-to-first-audio results for Grok Voice Think Fast 2.0\n21. [Qwen-Audio-3.0-Gen-Preview paper](https://arxiv.org/abs/2607.27011) \u2014 July 30, 2026 \u2014 **Author-reported research:** mixed-scene generation approach, 48 kHz stereo target, author benchmarks, and paper-only availability\n22. [Victor Riparbelli \u2014 July 28 discussion](https://aneyeonai.libsyn.com/video-is-about-to-stop-being-one-way-and-that-changes-everything-victor-riparbelli-synthesia) \u2014 **Practitioner and company-leader commentary:** interactive video, personalization economics, and application-like behavior\n23. [Colin Smith \u2014 July 30 discussion](https://shows.acast.com/camera-shake-photography-podcast/episodes/25-years-of-photoshop-the-skills-ai-cant-replace-with-colin) \u2014 **Practitioner commentary:** editing skill, taste, corrective work, and provenance of capture\n24. [Thais Castello Branco \u2014 July 31 discussion](https://www.youtube.com/watch?v=4x_gN7XMIcE) \u2014 **Practitioner and company-leader commentary:** objective checks, contextual preference, and creative evaluation\n25. [Daniel Whitenack and Chris Benson \u2014 July 30 discussion](https://share.transistor.fm/s/9d74230b) \u2014 **Practitioner analysis:** agent containment, unintended tool and network paths, monitoring, and human approval\n26. [Akshay Nathan \u2014 July 28 discussion](https://www.latent.space/p/chatgpt-work) \u2014 **Practitioner and company-leader commentary:** shared agent foundations, task-specific interfaces, sandboxes, artifacts, and progress measurement\n27. [Nathaniel Whittemore \u2014 July 27 discussion](https://aidailybrief.ai/e/2026-07-27) \u2014 **Practitioner commentary:** model roles, stack design, policy, reliability, and completed-task cost\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of July 31, 2026\n\n> **MiniMax H3 and Seedance 2.5 launched on July 31 with different strengths and different evidence.** H3 had a live hosted API, pricing, documented limits, and independent preference snapshots. Seedance offered 30-second audio-video generation and up to 50 references, but its API, price, output specifications, watermark details, and independent evaluation were still unavailable.\n\n---\n\n## The Big Story\n\n### MiniMax H3 vs. Seedance 2.5\n\nBoth new models combine video, audio, references, and editing. The important difference at launch was what could be measured.\n\n#### MiniMax H3\n\nH3 generates **4\u201315 seconds** of video at **768p or 2K** with native stereo audio. It accepts text, images, video, and audio as context and supports generation, editing, reference control, and motion transfer.\n\nThe category limits are below, subject to a **12-file overall cap**:\n\n- Up to **nine images**\n- Up to **three video clips**\n- Up to **three audio files**\n\nThe hosted API was live. China pricing was **CNY 0.80 per second at 2K** and **CNY 0.50 per second at 768p**.\n\nArtificial Analysis recorded two independent preference snapshots:\n\n- **Video editing:** **1,130 Elo \u00b16 from 8,208 samples**\n- **Text-to-video:** **1,239 Elo \u00b110 from 6,026 samples**\n\nThese are blind-preference results, not tests of reliability, rights, consistency, or total workflow cost.\n\nH3\u2019s promised downloadable weights had **not shipped by the July 31 cutoff**. Its technical report was pending, frame rate and codec were unclear, and its optional provenance watermark was off by default.\n\n#### Seedance 2.5\n\nSeedance 2.5 officially rolled out with **30-second audio-video generation**, multi-round extensions, and up to:\n\n- **30 images**\n- **10 video clips**\n- **10 audio clips**\n\nIt also includes timestamp revision, camera changes, green-screen and reference editing, and textureless 3D blocking references for composition, poses, motion paths, and camera angles.\n\nInitial access was through **Jimeng AI and Doubao Pro**. A BytePlus API was coming later.\n\nAt launch, there was no public API schema or model identifier, price, resolution, frame rate, codec, bit depth, watermark specification, or independent Seedance 2.5 benchmark. ByteDance also notes continuing limits with complex motion and multiple subjects.\n\nH3 therefore had stronger launch evidence for access, price, limits, and independent preference. Seedance presented a longer format and broader reference system, but more of its case remained vendor-demonstrated.\n\n**Sources:** [H3 announcement](https://www.minimax.io/blog/minimax-h3) \u00b7 [H3 API documentation](https://platform.minimaxi.com/docs/guides/video-generation?ready=6) \u00b7 [Independent editing snapshot](https://artificialanalysis.ai/video/leaderboard/video-editing) \u00b7 [Independent text-to-video snapshot](https://artificialanalysis.ai/video/leaderboard/text-to-video) \u00b7 [Seedance 2.5 announcement](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5) \u00b7 July 31\n\n---\n\n## Other Stories\n\n### OpenAI GPT Transcribe and Live Transcribe\n\nOpenAI split transcription into two models:\n\n- **GPT Transcribe:** completed or committed audio at **$0.0045 per minute**\n- **GPT Live Transcribe:** continuous low-latency audio at **$0.017 per minute**\n\nBoth support context prompts, literal keyword hints, and expected-language arrays. An independent evaluation measured GPT Transcribe at **3.3% word error rate**, compared with **4.0%** for GPT-4o Transcribe.\n\nOutput is JSON only. The models do not provide native SRT or VTT captions, word-level timestamps, English translation, or speaker diarization, so those jobs still require separate processing or models.\n\n**Sources:** [OpenAI migration guide](https://developers.openai.com/cookbook/examples/migrating_from_whisper_to_gpt_transcribe) \u00b7 [Independent evaluation](https://artificialanalysis.ai/speech-to-text/models/openai-gpt-transcribe) \u00b7 July 28\u201329\n\n### xAI Imagine Video 1.5 References\n\nxAI added native **1080p** text generation, up to **seven visual references**, and an image-plus-voice reference mode. Clips run **1\u201315 seconds** at **$0.08 per output second**.\n\nText and 1080p access were broad, while image and voice references were staged for selected paid users and gated API access. Reference and editing modes remained limited to **720p**.\n\nOutputs carry a mandatory vendor watermark. No independent test of the new 1080p, identity-retention, or voice-retention features was available.\n\n**Source:** [xAI update](https://x.ai/news/grok-imagine-video-1-5-references) \u00b7 July 31 \u00b7 vendor announcement\n\n### Luma Layers\n\nLuma Layers can generate independently editable image components or decompose a flat image into text, objects, backgrounds, and transparent elements. Those parts can be rearranged, reused, localized, or regenerated.\n\nThe feature was live in Luma Agents at **75 credits for 1K** and **150 credits for 2K**, with plans starting at **$30 per month**.\n\nNo PSD or other interchange format was specified, and no independent decomposition test was published.\n\n**Source:** [Luma Layers announcement](https://lumalabs.ai/news/introducing-layers) \u00b7 July 29 \u00b7 vendor announcement\n\n### Google Lyria 3.5\n\nLyria 3.5 launched in Flow Music with vendor-reported improvements in musical structure, lyrics, pronunciation, vocal expression, tempo, and requested duration. It can target tracks of up to **three minutes**.\n\nGenerated audio includes a **SynthID watermark**. No downloadable weights or public Lyria 3.5 API model identifier were announced, and no blind independent listening benchmark was available.\n\n**Sources:** [Google announcement](https://blog.google/innovation-and-ai/models-and-research/google-labs/lyria-3-5/) \u00b7 [Model card](https://deepmind.google/models/model-cards/lyria-3-5/) \u00b7 July 29 \u00b7 vendor and model-author evidence\n\n### OpenAI Audio Provenance\n\nOpenAI added SynthID watermarks to supported generated audio and expanded its verifier and Content Provenance API to check audio.\n\nThe API accepts MP3, Opus, AAC, FLAC, WAV, and PCM, with a **50 MiB** limit and a **60-second** decoded-duration limit. It checks supported OpenAI signals only.\n\nA non-detected result does not prove human origin, and the check does not establish rights or ownership. Compression and editing can also weaken a watermark.\n\n**Sources:** [OpenAI announcement](https://openai.com/index/advancing-content-provenance/) \u00b7 [API guide](https://developers.openai.com/api/docs/guides/content-provenance) \u00b7 July 31\n\n---\n\n## Quick Hits\n\n- **AutoCut Angles** builds an editable switching sequence from supplied camera tracks and one audio track in Premiere or Resolve. It is for single-speaker footage, not speaker-directed multicamera switching. [Source](https://www.autocut.com/en/blogs/july-autocut-updates-2026/) \u00b7 July 29\n- **ElevenLabs Character Casting** detects manuscript characters, suggests voices, previews lines, and changes a selected voice across a project. The company lists more than 90 languages and more than 10,000 voices; no independent casting or cleanup test was published. [Source](https://elevenlabs.io/blog/introducing-character-casting-in-audiobooks) \u00b7 July 30\n- **Kimi K3 weights shipped** on July 27: approximately **1.56 TB** of MXFP4 weights, code, and a report for a **2.8-trillion-parameter model with 104 billion active parameters**. The custom license and specialized multi-GPU requirements still apply. [Source](https://huggingface.co/moonshotai/Kimi-K3)\n- **C2PA guidance** maps generated, partially modified, and later human-edited media to source types, actions, disclosure fields, ingredients, and regions. It is guidance, not a new mandatory rule, and signed claims do not prove every assertion. [Source](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf) \u00b7 July 30\n- **Pangram Image** is a statistical detector preview. Pangram reports high internal accuracy, but the measurements are vendor-run and the detector cannot provide signed provenance. [Source](https://www.pangram.com/blog/introducing-pangram-image-detection) \u00b7 July 29\n- **Grok Voice Think Fast 2.0** costs **$0.08 per audio minute**. An independent snapshot recorded **82.9% overall**, **56.5% agentic performance**, and **0.70 seconds to first audio** under the tested conditions. [Announcement](https://x.ai/news/grok-voice-think-fast-2) \u00b7 [Independent snapshot](https://artificialanalysis.ai/speech-to-speech) \u00b7 July 29\n- **Qwen-Audio-3.0-Gen-Preview** describes one research path for dialogue, ambience, localized effects, and longer mixed audio at **48 kHz stereo**. It remains paper-only, with author-run benchmarks and no weights, API, demo, price, license, or parameter count. [Paper](https://arxiv.org/abs/2607.27011) \u00b7 July 30\n\n---\n\n## Voices This Week\n\n- **Victor Riparbelli** described video that can answer, demonstrate, draw, and test comprehension. His company perspective treats video as a stateful application rather than only a rendered file. [July 28 discussion](https://aneyeonai.libsyn.com/video-is-about-to-stop-being-one-way-and-that-changes-everything-victor-riparbelli-synthesia)\n- **Colin Smith** argued that easier tools do not create taste. Editing knowledge still helps correct a small defect instead of regenerating an entire result, while provenance may increase the need to demonstrate authentic capture. This is practitioner judgment. [July 30 discussion](https://shows.acast.com/camera-shake-photography-podcast/episodes/25-years-of-photoshop-the-skills-ai-cant-replace-with-colin)\n- **Thais Castello Branco** separated objectively checkable quality from creative preference shaped by audience, brand, context, and taste. Her frame combines fixed checks with contextual human review. [July 31 discussion](https://www.youtube.com/watch?v=4x_gN7XMIcE)\n- **Daniel Whitenack and Chris Benson** examined how tool access, credentials, package proxies, network policy, uploads, monitoring, and human approval combine into agent containment. One incident illustrates a failure mode but does not predict every agent. [July 30 discussion](https://share.transistor.fm/s/9d74230b)\n- **Akshay Nathan** separated visible activity from meaningful progress and described how one agent foundation can support task-specific interfaces and sandboxes. **Nathaniel Whittemore** described models as routine drivers, specialists, sub-agents, or fallbacks rather than one winner for every task. [Akshay Nathan](https://www.latent.space/p/chatgpt-work) \u00b7 [Nathaniel Whittemore](https://aidailybrief.ai/e/2026-07-27)\n\n---\n\n## Common Threads\n\n### Video Models Are Becoming Audiovisual Editors\n\nH3, Seedance, and xAI now compete on references, audio, revision, duration, and preservation\u2014not only first-generation appearance.\n\n### Evidence Levels Differ at Launch\n\nA callable API, pricing, vendor demonstrations, and independent measurements answer different questions. \u201cAvailable,\u201d \u201cdocumented,\u201d \u201cpriced,\u201d and \u201cindependently measured\u201d are separate claims.\n\n### Media Is Becoming an Interface\n\nInteractive video can respond during a session. Luma Layers makes image parts addressable. Character Casting treats narration as a project-wide system of roles and voices. A deliverable may include state, tools, and permissions as well as an exported file.\n\n### Provenance Starts at Intake\n\nOpenAI verifies supported audio signals, C2PA can describe partial edits, and Pangram estimates image origin statistically. Detection, provenance, rights, and ownership remain different records.\n\n### Judgment Becomes Scarcer\n\nFaster generation increases the value of selection, audience fit, factual review, continuity, and approval. More output is not the same as more progress.\n\n### Agents Need Contained Tools\n\nMedia agents can touch uploads, storage, codecs, rendering, publishing, and credentials. Human approval, network policy, tool boundaries, monitoring, and automated checks all remain part of the system.\n\n**Source basis:** [H3](https://www.minimax.io/blog/minimax-h3) \u00b7 [Seedance](https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5) \u00b7 [Luma Layers](https://lumalabs.ai/news/introducing-layers) \u00b7 [OpenAI provenance](https://openai.com/index/advancing-content-provenance/) \u00b7 [C2PA](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf) \u00b7 [Agent-containment discussion](https://share.transistor.fm/s/9d74230b)\n\n---\n\n## Novel Ideas Worth Watching\n\n- **Interactive video as an application runtime:** a video that answers, demonstrates, draws, and checks understanding also needs state, permissions, logging, and recovery. [Source](https://aneyeonai.libsyn.com/video-is-about-to-stop-being-one-way-and-that-changes-everything-victor-riparbelli-synthesia)\n- **Creative quality as conditional preference:** fixed checks can verify objective requirements, while audience, context, brand, and taste require qualified preference examples and review. [Source](https://www.youtube.com/watch?v=4x_gN7XMIcE)\n- **Partial-edit provenance:** C2PA regions can associate a claim with one part or interval rather than labeling a complete asset uniformly. [Source](https://c2pa.org/wp-content/uploads/sites/33/2026/07/Use-of-Content-Credentials-to-Identify-Synthetic-and-Non-Synthetic-Content.pdf)\n- **Trained weights as reusable assets:** downloadable weights can become production inputs under their license and hardware constraints, while broader weight-space methods remain early research. [Kimi K3 release example](https://huggingface.co/moonshotai/Kimi-K3)\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 10: Test the Checklist Against a Finished Task\n\nUse one completed AV task to learn whether the Week 9 checklist catches real issues.\n\n1. Choose a finished caption file, edit, graphic package, equipment brief, metadata set, or delivery record.\n2. Run the checklist without changing the finished work.\n3. Mark each check as pass, finding, unclear, or not applicable.\n4. Compare the results with the task\u2019s actual review history.\n5. Record missed issues, false alarms, and criteria that require human judgment.\n6. Revise and version the checklist so the change remains traceable.\n\nA simple test record can use:\n\n```text\nCheck | Result | Evidence | Checklist change\n```\n\nThe test shows whether the checklist reflects real production work rather than only appearing complete on paper.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
