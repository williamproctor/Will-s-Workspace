  <script>
    const EDITION_MD = "# The AV AI Dispatch \u2014 Week of March 27, 2026\n\n> Anthropic's most powerful model leaks by accident, Adobe opens Firefly Custom Models to everyone, Idomoo ships a video AI that generates layers instead of pixels, and Jensen Huang tells Lex Fridman he thinks we've already achieved AGI \u2014 sort of.\n\n---\n\n## This Week in AI\n\n### Anthropic's \"Mythos\" Model Leaks \u2014 And It's a New Tier of AI\n\nThe biggest story of the week wasn't supposed to be a story at all. A configuration error in Anthropic's content management system left nearly 3,000 unpublished assets \u2014 including draft blog posts \u2014 in a publicly accessible data store. Security researchers discovered the cache, Fortune reviewed the documents, and Anthropic was forced to confirm the existence of **Claude Mythos** (internally called \"Capybara\"): a new model that sits *above* Opus in their hierarchy, introducing an entirely new tier.\n\nAnthropic described Mythos as *\"a step change\"* in capabilities and *\"the most capable we've built to date.\"* Compared to Claude Opus 4.6, it achieves dramatically higher scores on coding, academic reasoning, and \u2014 critically \u2014 cybersecurity benchmarks. The company says Mythos is *\"far ahead of every other AI model in cyber capabilities,\"* which is exactly why they're holding it back. Anthropic believes a broad release could enable large-scale cyberattacks that outpace current defenses, so they're rolling it out selectively to cybersecurity organizations and early-access customers first.\n\nFor AV teams, the immediate impact is indirect but worth watching: a model this capable at code and reasoning will eventually power the next generation of creative AI tools. More immediately, the leak itself is a cautionary tale \u2014 even the company most associated with AI safety left 3,000 internal documents publicly accessible due to a CMS misconfiguration. If it can happen to Anthropic, it can happen to anyone.\n\n**Source:** [Fortune](https://fortune.com/2026/03/26/anthropic-says-testing-mythos-powerful-new-ai-model-after-data-leak-reveals-its-existence-step-change-in-capabilities/) \u00b7 March 26, 2026\n\n### Adobe Firefly Custom Models Enter Public Beta\n\nThis is the most directly useful launch of the week for any AV team. Adobe opened [Firefly Custom Models](https://blog.adobe.com/en/publish/2026/03/19/adobe-firefly-expands-video-image-creation-with-new-ai-capabilities-custom-models) to all paid individual subscribers, letting you train a personal AI model on 10\u201330 of your own images. Upload reference images, spend 500 generative credits, and you get a model that generates new content locked to your visual style \u2014 consistent stroke weight, color palettes, character appearance, and photographic look.\n\nWhy this matters for us: brand consistency is one of the hardest problems in AI-generated content. Until now, every image generation session started from scratch. Custom Models mean you can build a visual identity once and reuse it across campaigns, thumbnails, and assets. It's still image-only (no video yet), but the trajectory is clear. Adobe also announced that Firefly now integrates over 30 third-party models from Google, OpenAI, Runway, and Kling \u2014 making it the first major creative suite to become a multi-model hub.\n\n**Source:** [Adobe Blog](https://blog.adobe.com/en/publish/2026/03/19/adobe-firefly-expands-video-image-creation-with-new-ai-capabilities-custom-models) \u00b7 March 19, 2026\n\n### Idomoo Strata: AI Video That Generates Layers, Not Pixels\n\nMost AI video tools generate flat, single-file output \u2014 you get a finished video you can't meaningfully edit. [Idomoo](https://idomoo.com) just changed the game with Strata, the first AI foundation model that generates **editable layers**: separate tracks for text, animation, footage, and actors, similar to an After Effects comp. Instead of generating pixels, Strata generates structure \u2014 typography, motion paths, and synchronized audio composed into a production-ready blueprint.\n\nFor AV teams, this is a significant shift. Strata's output is fully editable and personalizable at the layer level, and it enforces brand guidelines by extracting \"Brand DNA\" from your approved content. The initial use case is personalized video at scale \u2014 think training videos or internal communications where the template stays consistent but names, data, and messaging change per viewer. It's patent-pending and in early access with enterprise customers.\n\n**Source:** [The Next Web](https://thenextweb.com/news/idomoo-strata-ai-foundation-model-layered-video) \u00b7 March 2026\n\n### Jensen Huang Says \"We've Achieved AGI\" \u2014 Then Immediately Walks It Back\n\nIn a wide-ranging conversation with Lex Fridman, NVIDIA CEO Jensen Huang made headlines by declaring *\"I think we've achieved AGI.\"* But his definition is worth unpacking: Fridman framed AGI as an AI that could start and run a billion-dollar company, and Huang agreed \u2014 with a critical qualifier: *\"You said a billion, and you didn't say forever.\"*\n\nHuang's argument is that AI agents could create viral, short-lived billion-dollar ventures (think apps that spike and collapse), and this is *\"happening right now\"* in China. But he explicitly walked back broader claims: *\"The odds of 100,000 of those agents building NVIDIA is zero percent.\"* Complex enterprises require sustained reasoning, planning, and judgment that current AI lacks. The headline generated enormous attention; the nuance matters more.\n\n**Source:** [Lex Fridman \u2014 Jensen Huang interview](https://lexfridman.com/jensen-huang) \u00b7 ~March 25, 2026\n\n### The \"Karpathy Loop\" Goes Mainstream\n\nAndrej Karpathy's [autoresearch](https://github.com/karpathy/autoresearch) project \u2014 which we covered at launch two weeks ago \u2014 hit an inflection point this week when major company leaders started running it internally. Shopify CEO Tobias L\u00fctke let the system run overnight on Shopify's internal codebase and woke up to a **53% performance improvement** in parse-and-render time with 61% fewer memory allocations. The technique is being called \"The Karpathy Loop\": an AI agent that forms hypotheses, edits code, benchmarks, retains improvements, and repeats \u2014 hundreds of times, autonomously.\n\nKarpathy called this *\"the final boss battle\"* for LLM research and predicted all frontier labs would adopt the approach. The implications for AV teams: expect the AI tools you use daily to start improving themselves this way. Faster inference, better quality, fewer artifacts \u2014 driven not by human engineers but by autonomous optimization loops.\n\n**Source:** [Fortune](http://fortune.com/2026/03/17/andrej-karpathy-loop-autonomous-ai-agents-future/) \u00b7 March 17, 2026\n\n### Mistral Forge: Build Your Own AI from Scratch\n\nAt GTC, Mistral announced [Forge](https://mistral.ai/news/forge), a platform that lets enterprises train custom AI models on their own proprietary data \u2014 not fine-tuning, not RAG, but training from scratch. Early partners include ASML, the European Space Agency, and Ericsson. CEO Arthur Mensch said the company is on track to surpass $1 billion ARR in 2026.\n\nFor AV teams at large organizations, Forge represents a new category: models trained exclusively on your internal knowledge, deployed on your own infrastructure, with full ownership. Imagine a model that understands your production workflows, naming conventions, and editorial standards because it was trained on nothing else. That's what Forge enables. It's enterprise-only and early, but the direction is significant.\n\n**Source:** [TechCrunch](https://techcrunch.com/2026/03/17/mistral-forge-nvidia-gtc-build-your-own-ai-enterprise/) \u00b7 March 17, 2026\n\n---\n\n## Voices This Week\n\n### Jensen Huang on What AGI Actually Means\n\nNVIDIA's CEO stirred debate with his claim that AGI has been achieved \u2014 but the substance was more measured than the headline: *\"The odds of 100,000 of those agents building NVIDIA is zero percent.\"* Huang's real point is that current AI excels at narrow, time-bounded tasks but still can't sustain the long-horizon reasoning required for complex enterprises. The distinction between \"momentarily valuable\" and \"durably intelligent\" is one every AV team should internalize when evaluating AI tools.\n\n### Vishal Misra on Why LLMs Can't Reason\n\nColumbia professor Vishal Misra presented research showing that LLMs operate through Bayesian updating \u2014 they refine predictions with mathematical precision as they process information. But they fail at the one thing human reasoning requires: distinguishing **correlation from causation**. Misra proposed \"The Einstein AGI Test\": train an LLM exclusively on pre-1911 physics and see if it independently derives relativity. His assessment: *\"Deep learning performs association but cannot perform causal intervention or counterfactual reasoning.\"* For teams using AI to make editorial or creative decisions, this is a critical limitation to understand.\n\n### Paul Kedrosky on the AI Bubble\n\nVenture capitalist Paul Kedrosky made a blunt assessment: *\"Yes, AI is a bubble. There is no question.\"* He pointed out that American tech companies will spend $300\u2013400 billion on AI this year while being *\"not remotely close to earning that amount back.\"* The key context: roughly half of last quarter's GDP growth came from AI infrastructure spending. Whether this is a productive bubble (like the railroad boom that left useful infrastructure) or a destructive one remains the open question. For AV teams, the practical implication is that AI tools may get cheaper and more available in the short term as companies fight for market share \u2014 but some vendors won't survive the correction.\n\n### Tobias L\u00fctke on Autonomous Code Optimization\n\nShopify's CEO ran Karpathy's autoresearch on Shopify's Liquid template engine \u2014 code he originally wrote over 20 years ago \u2014 and the AI agent delivered a 53% performance gain with 61% fewer memory allocations across roughly 120 automated experiment loops. The demonstration proved that autonomous AI agents can meaningfully optimize real production systems, not just toy benchmarks.\n\n---\n\n## Common Threads\n\n### The \"Train Your Own\" Era Is Here\n\nAdobe Firefly Custom Models, Mistral Forge, and NVIDIA's expanded Nemotron family all point to the same shift: the era of one-size-fits-all AI is ending. Organizations are moving from using generic models to training models on their own data, their own style guides, their own production standards. Adobe lets you train on your visual identity. Mistral lets you train on your internal knowledge. NVIDIA provides the hardware stack to run it all.\n\n**What this means for us:** Start thinking about what \"our AI\" looks like \u2014 not which vendor's AI we use, but what an AI trained exclusively on our production standards, our editorial voice, and our asset library could do. The tooling to build that is arriving faster than most teams realize.\n\n### Regulation Is Accelerating Faster Than the Technology\n\nA GOP senator unveiled sweeping AI legislation that would explicitly classify training on copyrighted works as not fair use and restrict unauthorized deepfakes. South Dakota made deepfake creation a felony. Louisiana advanced similar legislation for minors. Sony reported removing 135,000 deepfake songs from streaming platforms. The UK announced plans for mandatory AI content labeling.\n\n**What this means for us:** Content provenance documentation isn't optional anymore. Every AI-assisted production needs a clear audit trail: which tools, which models, which prompts, which reference materials. The regulatory environment is moving from \"guidelines\" to \"felonies\" faster than most creative teams have adapted.\n\n### AI Agents Are Getting Their Own Infrastructure\n\nClaude Code crossed $2.5 billion in annualized revenue \u2014 up from $100 million at the end of 2025 \u2014 becoming Anthropic's fastest-growing product. The MCP protocol hit 97 million monthly SDK downloads. GitHub added secret scanning to AI coding agents. Developers demonstrated the first bidirectional Claude-to-Codex bridge via MCP, enabling agent-to-agent collaboration. NVIDIA shipped Nemotron VoiceChat, a 12B-parameter model that combines speech recognition, language modeling, and voice synthesis into a single architecture \u2014 eliminating the cascaded stacks that have limited real-time AI voice applications.\n\n**What this means for us:** AI agents are no longer experimental add-ons. They're becoming the primary interface for technical work, with their own infrastructure, their own revenue lines, and their own security concerns. If your team hasn't evaluated agentic workflows yet, you're already behind the curve.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Layered AI Video Changes the Editing Equation\n\nIdomoo Strata's approach \u2014 generating editable layers instead of flat video \u2014 solves the biggest complaint about AI video tools: you can't edit the output. If this architecture becomes standard, AI video generation transforms from \"take it or leave it\" to \"generate a starting point and refine.\" That's the difference between a novelty and a production tool.\n\n### The Self-Improving Tool Belt\n\nThe Karpathy Loop isn't just an academic exercise \u2014 it's a preview of how every AI tool will improve. Imagine your NLE's AI features running hundreds of optimization experiments overnight, discovering processing shortcuts that human engineers wouldn't think of. The tools you use on Monday could be measurably better by Friday, without any human intervention.\n\n### Nemotron VoiceChat: One Model Does It All\n\nNVIDIA's Nemotron 3 VoiceChat combines ASR, LLM reasoning, and TTS into a single 12B-parameter model with full-duplex capability \u2014 the AI can speak and listen simultaneously. The significance for AV teams: real-time AI voice interaction that doesn't require stitching together three separate services. This is the architecture that will eventually power AI assistants that can discuss a rough cut while you're editing it.\n\n---\n\n## Tool of the Week\n\n### Adobe Firefly Custom Models\n\n**What it does:** Train a personal AI image model on 10\u201330 of your own images. The model learns your specific visual style \u2014 illustration strokes, character appearance, photographic look \u2014 and generates new content consistent with your brand identity.\n\n**Who it's for:** AV teams, designers, and content creators who need AI-generated assets that match an existing visual identity. Particularly useful for teams producing recurring content (thumbnails, series graphics, branded assets) where consistency matters.\n\n**Pricing:** Included with paid Adobe subscriptions. Training costs 500 generative credits (included in your plan). Generation uses standard credits.\n\n**Worth trying?** Yes. This is the first major creative tool to solve the brand consistency problem in AI image generation. The 10\u201330 image requirement is reasonable, the training is fast, and the output quality matches Firefly's existing standard \u2014 which is already production-viable for many use cases. The real power is reusability: train once, generate consistently across projects. The limitation is that it's image-only for now \u2014 no video model training yet.\n\n**Link:** [firefly.adobe.com](https://firefly.adobe.com)\n\n---\n\n## Sources\n\n1. [Adobe Blog](https://blog.adobe.com/en/publish/2026/03/19/adobe-firefly-expands-video-image-creation-with-new-ai-capabilities-custom-models) \u2014 March 19, 2026 \u2014 Firefly Custom Models public beta\n2. [The Next Web](https://thenextweb.com/news/idomoo-strata-ai-foundation-model-layered-video) \u2014 March 2026 \u2014 Idomoo Strata layered video model\n3. [Lex Fridman \u2014 Jensen Huang interview](https://lexfridman.com/jensen-huang) \u2014 ~March 25, 2026 \u2014 Jensen Huang on AGI and NVIDIA\n4. [Fortune](http://fortune.com/2026/03/17/andrej-karpathy-loop-autonomous-ai-agents-future/) \u2014 March 17, 2026 \u2014 The Karpathy Loop: 700 experiments in 2 days\n5. [TechCrunch](https://techcrunch.com/2026/03/17/mistral-forge-nvidia-gtc-build-your-own-ai-enterprise/) \u2014 March 17, 2026 \u2014 Mistral Forge enterprise AI platform\n6. [NVIDIA Newsroom](https://nvidianews.nvidia.com/news/nvidia-expands-open-model-families-to-power-the-next-wave-of-agentic-physical-and-healthcare-ai) \u2014 March 2026 \u2014 Nemotron 3 family expansion\n7. [NVIDIA NIM](https://build.nvidia.com/nvidia/nemotron-voicechat/modelcard) \u2014 March 16, 2026 \u2014 Nemotron VoiceChat model card\n8. [Yahoo News / Sen. Blackburn](https://www.yahoo.com/news/articles/gop-senator-unveils-draft-sweeping-215938515.html) \u2014 March 18, 2026 \u2014 TRUMP AMERICA AI Act draft\n9. [South Dakota Searchlight](https://southdakotasearchlight.com/2026/03/17/creating-sharing-of-deepfakes-will-be-a-felony-under-south-dakota-bill-now-signed-into-law/) \u2014 March 17, 2026 \u2014 Deepfake felony law\n10. [BBC News](https://www.bbc.com/news/articles/cy57593gxe0o) \u2014 March 2026 \u2014 Sony removes 135,000 deepfake songs\n11. [WinBuzzer](https://winbuzzer.com/2026/03/24/anthropic-claude-code-subagent-mcp-advanced-patterns-xcxwbn/) \u2014 March 24, 2026 \u2014 Claude Code $2.5B ARR, subagent patterns\n12. [GitHub Blog](https://github.blog/changelog/2026-03-17-secret-scanning-in-ai-coding-agents-via-the-github-mcp-server) \u2014 March 17, 2026 \u2014 Secret scanning in AI coding agents\n13. [Fortune \u2014 Anthropic Mythos leak](https://fortune.com/2026/03/26/anthropic-says-testing-mythos-powerful-new-ai-model-after-data-leak-reveals-its-existence-step-change-in-capabilities/) \u2014 March 26, 2026 \u2014 Claude Mythos \"step change\" model revealed via data leak\n14. [Fortune \u2014 Anthropic data security](https://fortune.com/2026/03/26/anthropic-leaked-unreleased-model-exclusive-event-security-issues-cybersecurity-unsecured-data-store/) \u2014 March 26, 2026 \u2014 3,000 unpublished assets in unsecured data store\n\n---\n\n*The AV AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
