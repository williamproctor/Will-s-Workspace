    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of June 12, 2026\n\n> **AI video moved another step toward the finishing pipeline this week.** Luma released **Ray 3.2** with frame-level control, multi-keyframe direction, HDR generation, EXR export, and full API access \u2014 a clear signal that video models are being shaped for real post-production handoff, not just preview clips. **PixVerse launched Canvas** as a node-based AI video workspace, with Seedance 2.0 available inside the canvas for native-audio video, 4-15 second clips, and up to nine reference images. **Anthropic's Claude Fable 5** drew strong early reaction as a real jump for difficult, long-horizon coding and agent work, but also as a slower, more expensive model with stricter safeguards than everyday Claude models. **ElevenLabs added Avatars** to ElevenCreative, pairing its voice models with lip-sync video in one workflow. And WWDC brought an AV-relevant Apple update: **Music Understanding**, an on-device framework for analyzing key, rhythm, structure, pace, instrument activity, and loudness.\n\n---\n\n## This Week in AI\n\n### Luma Ray 3.2: AI Video Moves Into the Finishing Pipeline\n\nLuma released **Ray 3.2** this week, and the notable part is not that it generates video. The notable part is the shape of the controls around it. Ray 3.2 is being positioned as a production-grade video model for teams that need frame-level direction, color-managed outputs, and API access inside existing workflows.\n\nThe headline features:\n\n- **Frame-level control** with multiple keyframes inside a clip.\n- **Video-to-video transformation** that preserves source duration and motion while changing the look or environment.\n- **Native HDR generation** for expanded dynamic range.\n- **16-bit EXR export** in ACES2065-1 for color grading, compositing, and VFX handoff.\n- **API access** to the full control surface for custom pipelines and internal tools.\n\nLuma's public product page describes the system as \"Direct any frame. Finish every cut.\" That phrase captures the real shift. Ray 3.2 is less about one spectacular prompt and more about giving production teams enough anchors to control a shot: source video, keyframes, adherence settings, HDR, EXR, and quality/speed options.\n\nThe EXR point matters. A typical AI video demo ends as a compressed clip. Ray 3.2's EXR export points toward a different workflow: generate or transform the shot, then hand it to Resolve, Nuke, Flame, Baselight, or another finishing environment with a frame sequence that can survive color and compositing work. That does not make the output automatically production-ready. It does make the handoff more serious.\n\nThere is still the usual caution. Ray 3.2 is strongest when it has source footage or strong visual anchors. Its own documentation still frames HDR and EXR as options for cases that need expanded dynamic range or professional finishing. But compared with the prompt-box era of AI video, this is a much more production-shaped release.\n\nFor AV teams, the pattern is the story: video models are increasingly judged by whether they support revision, color, keyframes, source preservation, and export paths \u2014 not just whether the first generation looks impressive.\n\n**Source:** [Luma \u2014 Introducing Ray 3.2](https://lumalabs.ai/news/introducing-ray-3-2) \u00b7 [Luma \u2014 Ray 3.2 prompting, outputs, and controls](https://lumalabs.ai/learning-center/articles/ray-3-2-prompting-outputs-and-controls) \u00b7 [Luma \u2014 Ray 3.2 introduction and core concepts](https://lumalabs.ai/learning-center/articles/ray-3-2-introduction-and-core-concepts) \u00b7 June 2026\n\n### PixVerse Canvas + Seedance 2.0: The AI Video Workspace Pattern Keeps Spreading\n\nPixVerse launched **PixVerse Canvas** on June 12 as a visual workspace for AI video production. The structure is familiar from the broader direction of the market: assets, references, scripts, storyboards, audio, and generated clips are no longer treated as separate one-off prompts. They become nodes on a canvas.\n\nIn PixVerse Canvas, each node can be a text note, reference image, generated image, video clip, audio track, or structured shot list. Nodes can feed each other. A script can feed a storyboard. A character reference can feed a video shot. The same shot can be run across multiple models for comparison. The point is repeatability: a project becomes a connected workflow instead of a folder full of disconnected generations.\n\nPixVerse is also using the launch to surface **Seedance 2.0** from ByteDance inside the workspace. Seedance 2.0 supports:\n\n- Text-to-video and image-to-video.\n- First-frame / last-frame transitions.\n- Up to **nine reference images**.\n- **Native audio** generation.\n- 4-15 second clips.\n- Standard mode up to 1080p; Fast mode up to 720p.\n\nSeedance 2.0 has already been one of the stronger names in short-form video generation this quarter. The Canvas launch makes the platform story more interesting: Seedance is not just a model in isolation; it becomes one option inside a multi-model workflow where teams can compare outputs, organize references, and keep project structure visible.\n\nThat is the same pattern as last week\u2019s VidMuse and PAI stories and this week\u2019s Luma story from another angle. AI video tools are becoming workbenches. The differentiator is no longer only model quality. It is whether the platform helps hold the production context together between generations.\n\n**Source:** [PixVerse \u2014 Canvas launch](https://pixverse.ai/en/blog/pixverse-canvas-ai-video-workflow) \u00b7 [PixVerse \u2014 Seedance 2.0 now available](https://pixverse.ai/en/blog/seedance-2-0-now-available-on-pixverse) \u00b7 [PixVerse \u2014 Seedance 2.0 review](https://pixverse.ai/en/blog/seedance-2-0-review-prompts-and-use-cases) \u00b7 June 2026\n\n### Claude Fable 5: The Reaction Is Strongest Around Long-Horizon Agent Work\n\nAnthropic released **Claude Fable 5** on June 9 as its most capable generally available model, built on the same capability tier as the restricted Claude Mythos 5 model but wrapped with additional safety classifiers for public use.\n\nThe raw specs are substantial:\n\n- **1 million token context window** by default.\n- Up to **128,000 output tokens** per request.\n- API model ID: `claude-fable-5`.\n- Pricing: **$10 per million input tokens** and **$50 per million output tokens**.\n- General availability through the Claude API, Claude Platform on AWS, Amazon Bedrock, Vertex AI, and Microsoft Foundry.\n\nThe reaction has been unusually consistent: Fable 5 appears to be a real step forward for hard coding, agentic workflows, and long-running tasks, especially when compared with other publicly available models. Anthropic published strong software-engineering benchmarks, including an **80.3% score on SWE-Bench Pro**, ahead of Claude Opus 4.8's 69.2% and reported scores for GPT-5.5 and Gemini 3.1 Pro. Early developer commentary has generally treated it as a high-ceiling model for hard problems, not a default model for every prompt.\n\nThat distinction matters. Several early reactions point to the same tradeoff: Fable 5 is slower and more expensive than Anthropic's everyday models, and its stricter safeguards can change how some requests are handled. Anthropic's documentation says Fable 5 includes classifiers that may decline or reroute certain high-risk requests to Claude Opus 4.8. Simon Willison described his first hours with the model as \"slow, expensive\" and capable enough that the challenge was finding tasks it could not handle, while also noting the new guardrail behavior.\n\nFor AV work, Fable 5's relevance is mostly indirect but real. The model is not an audio/video generator. Its value is in the software and workflow layer around AV: internal tools, publishing scripts, metadata pipelines, SharePoint automation, review systems, caption tooling, and agents that need to reason across large project context.\n\nThe broader pattern: frontier models are splitting by workload. Fast models handle everyday drafting and high-volume work. The expensive models are increasingly framed for long-horizon agent sessions where quality compounds across many tool calls and mistakes are more costly.\n\n**Source:** [Anthropic \u2014 Claude Fable 5 and Claude Mythos 5](https://www.anthropic.com/news/claude-fable-5-mythos-5) \u00b7 [Claude API docs \u2014 Introducing Claude Fable 5](https://platform.claude.com/docs/en/about-claude/models/introducing-claude-fable-5-and-claude-mythos-5) \u00b7 [Simon Willison \u2014 Initial impressions of Claude Fable 5](https://simonwillison.net/2026/Jun/9/claude-fable-5/) \u00b7 [Futurum \u2014 Fable 5 is most consequential where software is built](https://futurumgroup.com/insights/claude-fable-5-is-most-consequential-where-software-is-built/) \u00b7 June 9-12, 2026\n\n### ElevenLabs Avatars: Voice and Lip-Sync Move Into One Flow\n\nElevenLabs introduced **Avatars** in ElevenCreative on June 11, turning talking-head video generation into a simpler workflow inside the same environment as its speech models.\n\nThe old workflow for many AI talking-head videos was fragmented: generate or record a voice, move that audio into a lip-sync tool, choose a visual identity, render, review sync, and repeat. ElevenLabs is trying to collapse that into one surface. In Avatars, a user selects an avatar, writes a script, picks a voice, and generates speech plus lip-synced video together.\n\nThe feature set includes:\n\n- Persistent avatar identities built from images or prompts.\n- Pairing any avatar with any ElevenLabs voice, including cloned voices.\n- Text-to-speech built directly into the avatar workflow.\n- Automatic selection among supported lip-sync models.\n- A new Avatar node in ElevenLabs Flows for automated pipelines.\n\nThe relevant production point is synchronization. Because ElevenLabs owns the voice layer, speech generation and lip-sync happen in the same system rather than through a file handoff between separate tools. That does not automatically solve every issue with synthetic presenters. It does remove one common source of friction: voice and video being generated in different places and then stitched together.\n\nFor AV teams, this belongs in the same category as Synthesia, HeyGen, and other avatar tools: useful for structured, informational, repeatable content when expectations and disclosure are clear. It is not a replacement for high-trust human presentation. It is another example of audio, identity, and video moving into integrated production flows.\n\n**Source:** [ElevenLabs \u2014 Introducing Avatars in ElevenCreative](https://elevenlabs.io/blog/introducing-avatars) \u00b7 [ElevenLabs Avatars overview](https://elevenlabs.io/avatars) \u00b7 [ElevenLabs Avatars documentation](https://elevenlabs.io/docs/overview/capabilities/image-video/avatars.md) \u00b7 June 11-12, 2026\n\n### Apple Music Understanding + Google Magenta RealTime 2: Audio Intelligence Gets More Local\n\nWWDC 2026 was not primarily an AV production event, but Apple did introduce one developer framework that is directly relevant: **Music Understanding**.\n\nMusic Understanding is an on-device framework for analyzing audio across six dimensions:\n\n- Key\n- Rhythm\n- Structure\n- Pace\n- Instrument activity\n- Loudness\n\nApple's developer session framed it as a way for apps to sync visuals to music, organize music catalogs by tempo or key, pre-compute analysis data, and build audio-reactive experiences. The important detail is that it runs on device and offline. Audio analysis stays local, and apps do not need to build their own signal-processing or model-inference stack to understand basic musical structure.\n\nThat makes it relevant to editing tools, event tools, cataloging tools, and internal utilities. Beat detection, loudness shifts, section changes, and tempo-aware visuals are not new ideas. The difference is that Apple is exposing a system framework that handles the analysis consistently across Apple platforms.\n\nGoogle's Magenta team also released **Magenta RealTime 2**, an open-weights, local live music model for Apple Silicon. It is not a text-to-song generator in the usual sense. It is a live, controllable music synthesis model that can respond to MIDI, text, and audio inputs with low latency. The release includes a C++ inference engine, Python library, standalone applications, and a DAW plugin path through Audio Unit.\n\nTogether, the Apple and Google updates point in the same direction: more audio intelligence is moving closer to the device and closer to the creative tool. Not every workflow needs cloud generation. Some workflows need local analysis, local synthesis, fast response, and tight integration with the software where audio work already happens.\n\n**Source:** [Apple Developer \u2014 Meet the Music Understanding framework](https://developer.apple.com/videos/play/wwdc2026/253/) \u00b7 [Apple \u2014 Apple Intelligence and WWDC26 announcements](https://www.apple.com/newsroom/2026/06/apple-unveils-next-generation-of-apple-intelligence-siri-ai-and-more/) \u00b7 [Google Magenta \u2014 Magenta RealTime 2](https://magenta.withgoogle.com/magenta-realtime-2) \u00b7 [OfficeChai \u2014 Google releases Magenta RealTime 2](https://officechai.com/ai/google-releases-magenta-realtime-2-for-on-device-live-music-synthesis/) \u00b7 June 2026\n\n### Quick Hits\n\n- **Gemini 3.5 Pro is still in the \"watch\" category** \u2014 Google committed to a June general-availability window, but as of this issue the model appears limited to enterprise preview rather than broad Gemini API / AI Studio availability. The expected headline specs remain a 2-million-token context window and Deep Think reasoning mode, but official pricing and public model details should be treated as pending until Google posts them.\n- **OpenAI Academy added workplace AI courses** \u2014 OpenAI announced AI Foundations, Applied AI Foundations, and Agents and Workflows on June 12. This is not an AV tool release, but it shows the major labs continuing to package AI adoption as structured workplace training rather than only product access.\n- **Claude Code added usage visibility** \u2014 the June 12 Claude Code release added usage attribution in the account and usage dialog, including cache misses, long context, subagents, skills, plugins, and MCP breakdowns over 24-hour and 7-day windows. That is a small but useful sign of where agent tooling is heading: teams need to see what the agent actually consumed.\n\n---\n\n## Voices This Week\n\n### Zeev Farbman on Open Audio-Video Models\n\nLightricks co-founder and CEO Zeev Farbman framed the new **LTX-2** release around openness and control:\n\n> \"LTX-2 is the first truly open audio-video model, released with open weights and training code, and designed to run locally on consumer GPUs.\"\n\nHe added:\n\n> \"It delivers the kind of quality and performance teams usually associate with closed systems, without giving up control, transparency, or the ability to customize.\"\n\nThe notable part is not only the model claim. It is the production philosophy underneath it. Closed API models are convenient, but open-weight audio-video models create a different path: local runs, internal customization, inspectable pipelines, and more control over where sensitive footage goes.\n\n### Simon Willison on Fable 5's Early Feel\n\nDeveloper Simon Willison spent the first hours after release testing Claude Fable 5 and described it as \"slow, expensive\" while also saying it was capable enough that the challenge was finding tasks it could not handle.\n\nThat captures the early reaction well. Fable 5 is not being received as a cheaper everyday model. It is being received as a high-ceiling model for hard work \u2014 the kind of model that makes sense when the task is long, complicated, and worth the additional cost.\n\n---\n\n## Common Threads\n\n### Video Models Are Being Judged by Handoff, Not Just Output\n\nRay 3.2's EXR export, PixVerse Canvas's workflow nodes, Seedance 2.0's references and audio, ElevenLabs Avatars' unified voice/lip-sync flow, and LTX-2's open-weight positioning all point to a more practical standard. A good demo clip is no longer enough. The useful question is whether the output can move through the next step of production: revision, sync, color, compositing, localization, automation, or local control.\n\n### Local and Open Are Back in the Conversation\n\nThe week had several local or open-weight signals: Apple's on-device Music Understanding, Google Magenta RealTime 2 running locally on Apple Silicon, and LTX-2's open audio-video framing. The pattern matters for AV because media files can be sensitive, large, and expensive to move. Cloud tools will keep improving, but local analysis and local generation are becoming credible again for specific workflows.\n\n### The Expensive Model Is Becoming a Specialist\n\nClaude Fable 5 shows another split in the model market. The most capable models are increasingly framed for difficult long-running work, not every request. The everyday model handles drafts, summaries, quick transformations, and high-volume use. The expensive model is reserved for tasks where failure compounds across many steps.\n\n---\n\n## Novel Ideas Worth Watching\n\n### EXR as an AI Video Credibility Signal\n\nEXR export is not a flashy user-facing feature, but it is a serious production signal. A compressed MP4 may be enough for review. EXR frames are for finishing, grading, and compositing. As more video models add professional output formats, the line between \"AI preview\" and \"AI-assisted production asset\" will get more meaningful.\n\n### Avatar Nodes in Automated Pipelines\n\nElevenLabs adding an Avatar node to Flows is a small detail with larger implications. It means avatar-led videos can become one step in a batch process: brief in, script generated, voice selected, avatar video produced, language variants created. That kind of automation is powerful for structured informational content, but it also increases the importance of review, disclosure, and identity controls.\n\n### Music Analysis as Editing Metadata\n\nApple's Music Understanding framework suggests a simple but useful idea: audio analysis can become timeline metadata. Key, rhythm, structure, pace, instrument activity, and loudness can inform cuts, motion graphics, visual pacing, caption timing, and catalog search. The creative decision still belongs to the editor, but the machine can make the structure easier to see.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 3: Show, Don't Tell\n\nLast week, the Back to Basics series covered **specificity over flattery**: give the model the task, audience, constraints, input, and output format instead of only telling it to be an expert.\n\nThis week is the next step: **show, don't tell**.\n\nA model often learns more from two examples of the output you want than from a long abstract explanation of the output you want. This is especially true for formats that are hard to describe but easy to recognize: review notes, script rewrites, caption style, project summaries, email tone, or naming conventions.\n\nInstead of writing:\n\n```text\nSummarize these review notes in a clear and organized way.\n```\n\nUse:\n\n```text\nYour task is to organize these production review notes.\n\nUse this format:\n\n00:14 \u2014 Audio: Narration is slightly low under the music bed.\n01:02 \u2014 Graphics: Lower-third timing feels early; hold two more seconds.\n02:18 \u2014 Edit: Cutaway works, but transition could be cleaner.\n\nRules:\n- Group notes by timecode.\n- Keep each note to one sentence.\n- Preserve the department label before the colon.\n- Do not rewrite technical terms.\n\nNow organize these notes:\n[paste notes]\n```\n\nThe examples do more than the explanation. They show the model the rhythm, length, labels, punctuation, and level of detail. The model no longer has to guess what \"clear and organized\" means.\n\nFor AV work, examples are especially useful because the output often has a house style:\n\n- Timecoded review notes\n- Shot lists\n- Caption corrections\n- Script punch-up notes\n- Production status summaries\n- Equipment checklists\n- SharePoint-ready blurbs\n\nThe weekend exercise: pick one recurring output you ask AI to produce. Give the model **two examples** of good output before the new task. Keep the examples short. Then compare the result with your usual prompt.\n\nNext week, Back to Basics Week 4: **Tell It What Not to Change** \u2014 why preservation rules matter as much as revision instructions.\n\n---\n\n## Sources\n\n1. [Luma \u2014 Introducing Ray 3.2](https://lumalabs.ai/news/introducing-ray-3-2) \u2014 June 2026 \u2014 Ray 3.2 release, frame-level control, HDR, EXR, API\n2. [Luma \u2014 Ray 3.2 prompting, outputs, and controls](https://lumalabs.ai/learning-center/articles/ray-3-2-prompting-outputs-and-controls) \u2014 June 2026 \u2014 HDR and EXR output details\n3. [Luma \u2014 Ray 3.2 introduction and core concepts](https://lumalabs.ai/learning-center/articles/ray-3-2-introduction-and-core-concepts) \u2014 June 2026 \u2014 video-to-video and keyframe workflow details\n4. [PixVerse \u2014 Canvas launch](https://pixverse.ai/en/blog/pixverse-canvas-ai-video-workflow) \u2014 June 12, 2026 \u2014 node-based AI video workspace\n5. [PixVerse \u2014 Seedance 2.0 now available](https://pixverse.ai/en/blog/seedance-2-0-now-available-on-pixverse) \u2014 June 2026 \u2014 Seedance 2.0 modes, references, native audio, resolution\n6. [PixVerse \u2014 Seedance 2.0 review](https://pixverse.ai/en/blog/seedance-2-0-review-prompts-and-use-cases) \u2014 June 2026 \u2014 broader Seedance 2.0 capability context\n7. [Anthropic \u2014 Claude Fable 5 and Claude Mythos 5](https://www.anthropic.com/news/claude-fable-5-mythos-5) \u2014 June 9, 2026 \u2014 Fable 5 announcement, pricing, access\n8. [Claude API docs \u2014 Introducing Claude Fable 5](https://platform.claude.com/docs/en/about-claude/models/introducing-claude-fable-5-and-claude-mythos-5) \u2014 June 2026 \u2014 model ID, specs, safeguards, API details\n9. [Simon Willison \u2014 Initial impressions of Claude Fable 5](https://simonwillison.net/2026/Jun/9/claude-fable-5/) \u2014 June 9, 2026 \u2014 early developer reaction\n10. [Futurum \u2014 Fable 5 is most consequential where software is built](https://futurumgroup.com/insights/claude-fable-5-is-most-consequential-where-software-is-built/) \u2014 June 2026 \u2014 enterprise and coding reaction\n11. [ElevenLabs \u2014 Introducing Avatars in ElevenCreative](https://elevenlabs.io/blog/introducing-avatars) \u2014 June 11, 2026 \u2014 Avatars launch\n12. [ElevenLabs Avatars overview](https://elevenlabs.io/avatars) \u2014 June 2026 \u2014 Avatar workflow and voice pairing details\n13. [ElevenLabs Avatars documentation](https://elevenlabs.io/docs/overview/capabilities/image-video/avatars.md) \u2014 June 2026 \u2014 persistent identities, voice compatibility, Flows support\n14. [Apple Developer \u2014 Meet the Music Understanding framework](https://developer.apple.com/videos/play/wwdc2026/253/) \u2014 WWDC26 \u2014 on-device music analysis\n15. [Apple \u2014 Apple Intelligence and WWDC26 announcements](https://www.apple.com/newsroom/2026/06/apple-unveils-next-generation-of-apple-intelligence-siri-ai-and-more/) \u2014 June 2026 \u2014 WWDC software and AI context\n16. [Google Magenta \u2014 Magenta RealTime 2](https://magenta.withgoogle.com/magenta-realtime-2) \u2014 June 2026 \u2014 open local live music model\n17. [OfficeChai \u2014 Google releases Magenta RealTime 2](https://officechai.com/ai/google-releases-magenta-realtime-2-for-on-device-live-music-synthesis/) \u2014 June 2026 \u2014 Apple Silicon and DAW/plugin context\n18. [GamesBeat \u2014 Lightricks open-sources LTX-2](https://gamesbeat.com/lightricks-open-sources-ltx-2-ai-audio-and-video-generation-model/) \u2014 June 2026 \u2014 LTX-2 release and Zeev Farbman quotes\n19. [OpenAI \u2014 New OpenAI Academy courses](https://openai.com/index/academy-courses-applying-ai-at-work/) \u2014 June 12, 2026 \u2014 workplace AI training courses\n20. [Claude Code release v2.1.174](https://github.com/anthropics/claude-code/releases/tag/v2.1.174) \u2014 June 12, 2026 \u2014 usage attribution update\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of June 12, 2026\n\n> Quick Summary: **AI video tools are becoming more production-shaped.** Luma released **Ray 3.2** with frame-level control, HDR, EXR export, and API access \u2014 a sign that AI video is moving toward finishing workflows, not just demo clips. **PixVerse launched Canvas**, a node-based AI video workspace where assets, storyboards, references, and model outputs can stay connected. **Claude Fable 5** drew strong early reaction as a major jump for hard coding and long-running agent work, though it is slower, more expensive, and more tightly guarded than everyday Claude models. **ElevenLabs Avatars** combines voice generation and lip-sync video in one workflow. And **Apple Music Understanding** plus **Google Magenta RealTime 2** show more audio intelligence moving local and closer to production tools.\n\n---\n\n## The Big Stories This Week\n\n### Luma Ray 3.2: AI Video Moves Into the Finishing Pipeline\n\nLuma released **Ray 3.2**, a video model update focused on control and professional handoff.\n\nKey features:\n\n- Frame-level control with multiple keyframes\n- Video-to-video transformation\n- Native HDR generation\n- 16-bit EXR export for color grading, compositing, and VFX\n- API access for custom pipelines\n\nThe EXR export is the most production-relevant detail. Most AI video demos end as compressed review clips. EXR frames are meant for finishing tools like Resolve, Nuke, Flame, or Baselight. That does not make the output automatically final, but it makes the handoff more serious.\n\nThe bigger pattern: AI video models are increasingly being judged by revision, export, color, and pipeline fit \u2014 not just by how impressive the first generation looks.\n\n### PixVerse Canvas + Seedance 2.0\n\nPixVerse launched **PixVerse Canvas** on June 12 as a visual workspace for AI video production.\n\nInstead of working prompt by prompt, Canvas lets users organize:\n\n- Text notes\n- Reference images\n- Generated images\n- Video clips\n- Audio tracks\n- Structured shot lists\n\nThose items become nodes on a canvas and can feed each other. A script can feed a storyboard. A character reference can feed a shot. The same shot can be run across multiple models for comparison.\n\nPixVerse is also surfacing **Seedance 2.0** inside the workspace. Seedance 2.0 supports text-to-video, image-to-video, first/last-frame transitions, up to nine reference images, native audio, and 4-15 second clips.\n\nThe pattern matches recent stories from VidMuse, PAI, Runway, and Luma: AI video tools are turning into workbenches, not just generation boxes.\n\n### Claude Fable 5 Reaction\n\nAnthropic released **Claude Fable 5** on June 9 as its most capable generally available model.\n\nSpecs:\n\n- 1 million token context window\n- Up to 128,000 output tokens\n- API model ID: `claude-fable-5`\n- $10 per million input tokens\n- $50 per million output tokens\n- Available through Claude API, AWS, Bedrock, Vertex AI, and Microsoft Foundry\n\nThe reaction has been strong, especially around difficult coding and long-horizon agent work. Anthropic published an **80.3% score on SWE-Bench Pro**, ahead of Claude Opus 4.8's 69.2%.\n\nThe caution: Fable 5 is slower and more expensive than everyday models. It also has stricter safeguards and can reroute some high-risk requests to Claude Opus 4.8.\n\nFor AVS, the relevance is mostly in the workflow layer: internal tools, publishing scripts, metadata pipelines, SharePoint automation, caption tools, and agents that need to reason across large project context.\n\n### ElevenLabs Avatars\n\nElevenLabs introduced **Avatars** in ElevenCreative on June 11.\n\nThe new workflow combines:\n\n- A persistent avatar identity\n- An ElevenLabs voice\n- Text-to-speech\n- Lip-sync video generation\n\nPreviously, talking-head AI video often required multiple tools: one for voice, one for image/avatar, one for lip-sync, and one for editing. ElevenLabs is trying to combine the voice and lip-sync layers inside one interface.\n\nAvatars also works with **Flows**, ElevenLabs' automation canvas, through a new Avatar node. That means avatar-led videos can become part of automated batch workflows.\n\nThe practical read: useful for structured, informational, repeatable content when disclosure and review are clear. Not a replacement for high-trust human presentation.\n\n### Apple Music Understanding + Google Magenta RealTime 2\n\nWWDC 2026 included one especially AV-relevant Apple framework: **Music Understanding**.\n\nIt analyzes audio on device across six dimensions:\n\n- Key\n- Rhythm\n- Structure\n- Pace\n- Instrument activity\n- Loudness\n\nApple framed it for apps that need to sync visuals to music, organize catalogs, or build audio-reactive experiences. The important part is that it runs locally and offline.\n\nGoogle also released **Magenta RealTime 2**, an open-weights live music model for Apple Silicon. It can respond to MIDI, text, and audio inputs with low latency, and includes a path into DAWs through an Audio Unit plugin.\n\nTogether, the Apple and Google updates show more audio intelligence moving closer to the device and closer to the tools where audio work already happens.\n\n### Quick Hits\n\n- **Gemini 3.5 Pro is still pending** \u2014 Google committed to a June rollout, but broad API / AI Studio availability still appears to be pending.\n- **OpenAI Academy added workplace AI courses** \u2014 new courses cover AI Foundations, Applied AI Foundations, and Agents and Workflows.\n- **Claude Code added usage visibility** \u2014 the June 12 release added usage attribution for cache misses, long context, subagents, skills, plugins, and MCP usage.\n\n---\n\n## Voices This Week\n\n### Zeev Farbman on Open Audio-Video Models\n\nLightricks co-founder and CEO Zeev Farbman said:\n\n> \"LTX-2 is the first truly open audio-video model, released with open weights and training code, and designed to run locally on consumer GPUs.\"\n\nHe also said:\n\n> \"It delivers the kind of quality and performance teams usually associate with closed systems, without giving up control, transparency, or the ability to customize.\"\n\nThe important idea: open-weight audio-video models create a different path from closed APIs. They can support local runs, customization, and more control over where media files go.\n\n### Simon Willison on Claude Fable 5\n\nDeveloper Simon Willison described Fable 5 as \"slow, expensive\" while also saying it was capable enough that the challenge was finding tasks it could not handle.\n\nThat matches the broader reaction: Fable 5 is not being treated as a cheap everyday model. It is being treated as a high-ceiling model for hard, long-running work.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 3: Show, Don't Tell\n\nLast week was **specificity over flattery**. This week is the next step: **show, don't tell**.\n\nModels often learn more from two examples of the output you want than from a long explanation of the output you want.\n\nInstead of:\n\n```text\nSummarize these review notes in a clear and organized way.\n```\n\nUse:\n\n```text\nYour task is to organize these production review notes.\n\nUse this format:\n\n00:14 \u2014 Audio: Narration is slightly low under the music bed.\n01:02 \u2014 Graphics: Lower-third timing feels early; hold two more seconds.\n02:18 \u2014 Edit: Cutaway works, but transition could be cleaner.\n\nRules:\n- Group notes by timecode.\n- Keep each note to one sentence.\n- Preserve the department label before the colon.\n- Do not rewrite technical terms.\n\nNow organize these notes:\n[paste notes]\n```\n\nThe examples show the model the length, rhythm, labels, punctuation, and level of detail.\n\nThis is useful for:\n\n- Timecoded review notes\n- Shot lists\n- Caption corrections\n- Script notes\n- Production summaries\n- Equipment checklists\n- SharePoint-ready blurbs\n\nThe weekend exercise: pick one recurring AI task and give the model two examples of good output before the new task. Then compare the result with your usual prompt.\n\nNext week: **Tell It What Not to Change**.\n\n---\n\n## Why This Week Matters\n\n- **AI video is becoming more production-shaped.** Ray 3.2, PixVerse Canvas, Seedance 2.0, ElevenLabs Avatars, and LTX-2 all point toward revision, handoff, sync, local control, and workflow structure.\n\n- **Local audio intelligence is gaining ground.** Apple's Music Understanding and Google's Magenta RealTime 2 both bring audio analysis or generation closer to the device.\n\n- **Frontier models are splitting by workload.** Fable 5 looks strongest for hard, long-running agent work, while faster models still make more sense for everyday drafting and high-volume tasks.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
