      slug: "2026-08-17",
      editionTitle: "Week of August 17, 2026",
      editionMd: "# The Monday Signal \u2014 Week of August 17, 2026\n\n> **Google's bidding change starts rolling out today, the AI Max conversion lands September 1, and the language setting disappears the same month: three control changes in four weeks, which makes September performance movement unreadable by design.** Into that window: Lunio measured AI Max campaigns carrying 72% more invalid traffic, Wall Street cut The Trade Desk 22% and AppLovin 20% in the same fortnight, Perplexity banned Time's agent-targeted ads before any standard existed, and the New York Times put the first public price on content: about $4,000 a unit.\n\n---\n\n## The Conversation\n\n### Perplexity banned Time's agent ads and called them deceptive\n\nTwo weeks after Time started inserting brand-written, FAQ-formatted ad content into the markdown versions of its pages (the versions AI agents read), Perplexity confirmed on August 11 that it blocked those units from influencing its index. CCO Jesse Dwyer told Digiday the company protects users from deceptive practices \"sponsored or not,\" and warned that publishers running markdown ads risk a trust-score downgrade in Perplexity's index. Time had labeled the units as sponsored; the objection is to the practice, not the disclosure, because the label doesn't survive retrieval. Robert Webster of TAU put the mechanism plainly: \"a promotional claim can end up cited as a neutral fact.\"\n\nThe incentive readings are the useful part. Steven Liss noted the ban gives publishers one more reason to block Perplexity's crawlers entirely; Shiv Gupta expects other model operators to follow, partly to keep control of how their own platforms get monetized. An answer engine that blocks publisher-inserted ads is also protecting inventory it hasn't sold yet. Webster's larger frame: the internet is splitting into a human track and an agent track, and platforms are ruling on the new inventory before standards exist, which is how most ad formats have historically been settled.\n\n**Comment window:** open now. The lazy take is \"AI ads don't work.\" The better one is the cloaking precedent: agent-legible marketing is coming either way, and the line between \"structured content agents can read\" and \"deceptive insertion\" just started being drawn by the platforms, unilaterally.\n\n**Source:** [Digiday's original report](https://digiday.com/media/perplexity-blocks-times-ads-served-to-ai-agents-calling-them-deceptive/) \u00b7 [Digiday on Time's agent ads](https://digiday.com/media/time-has-started-serving-ads-to-ai-agents/) \u00b7 August 11, 2026\n\n### The New York Times told everyone what content costs: ~$4,000 a unit\n\nOn Bloomberg's Odd Lots (August 10), NYT CEO Meredith Kopit Levien disclosed that the company spent close to $2 billion last year producing about half a million works of journalism. Production costs almost never go public; that's a per-unit reference point of roughly $4,000 that every publisher and every AI lab across the table can now argue about. Her licensing framework separates three things negotiations usually blur: continuity (the deal can't cannibalize the business underneath), permission with control attached (governance of downstream use), and only then price.\n\nThe supply argument got its sharpest number the same week: Stack Overflow logged 1,442 questions in July, down 99% from its 2014 peak: the corpus that trained the models is being consumed by the products built on it. The counterweight: a bipartisan amicus brief says three firms hold 88% of AI model API revenue, so scarce supply still faces concentrated buyers. The Times sues OpenAI, Microsoft, and Perplexity while licensing to Amazon; both tracks are the same negotiation.\n\n**Comment window:** durable. For a marketing audience the transferable idea is content as a priced, licensable asset class, plus \"permission with control\" as the framework brands should steal for their own content programs.\n\n**Source:** [Episode transcript](https://podscripts.co/podcasts/odd-lots/nyt-ceo-meredith-kopit-levien-on-running-a-media-brand-in-the-age-of-ai) \u00b7 [PPC Land coverage](https://ppc.land/new-york-times-has-sued-three-ai-companies-ceo-kopit-levien-says/) \u00b7 August 10, 2026\n\n### \"A 40-hour audit in 60 minutes\" met \"49% of companies cut agent rollouts\"\n\nAhrefs launched Letaido on August 12: an agent-powered marketing workspace built on its 170-trillion-page index and AI-visibility data from 439 million monthly prompts. The launch quote traveling around LinkedIn claims keyword research and content audits that took a 40-hour week now take 60 minutes, and that the gap between teams that embrace agents and those that don't \"is going to widen, fast.\" No pricing, no availability date, and no independently verified performance data shipped with it.\n\nHold that against the week's other number: KPMG found 49% of organizations cut AI agent rollouts when costs outran value, with established ROI at 7% across 2,145 leaders surveyed. Agencies can't even agree how to charge for the machine work: Dept refuses to itemize tokens, Monks folds them into subscriptions, PMG caps staff at $50 a day.\n\n**Comment window:** open and recurring. The grounded take isn't pro- or anti-agent; it's that time-compression claims and enterprise cut rates are both real, and the difference between them is verification and governance, which is where the actual work is.\n\n**Source:** [PPC Land on Letaido](https://ppc.land/ahrefss-letaido-claims-a-40-hour-audit-now-takes-60-minutes/) \u00b7 [PPC Land weekly synthesis](https://ppc.land/ad-tech-repriced-everything-this-week-except-the-thing-doing-the-counting/) \u00b7 August 8\u201312, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, calls, and shows where the week's arguments actually happened.\n\n- **Ginny Marvin, ads product liaison, Google** (Marketing O'Clock interview with Greg Finn, August 12, on the bidding change rolling out today): \"There still is going to be adjustment periods\u2026 It just should be more stable than it's been in the past, more predictable than in the past.\" Her reading guidance: \"we usually recommend at least a convergence cycle or two.\" [The interview](https://www.youtube.com/watch?v=iofOki6Zy8U) \u00b7 [Finn's post](https://www.linkedin.com/posts/gregfinn_interview-with-ginny-marvin-deep-dive-on-activity-7493391938033954816-cYf4)\n- **Meredith Kopit Levien, CEO, The New York Times Company** (Bloomberg's Odd Lots, August 10): \"The companies that are making the LLMs are spending, in many cases, hundreds of millions or even billions of dollars on things like talent and power and compute\u2026 And one of the things that goes into making models is high quality information. And, you know, we'd like to see them pay a fair wage for that as well.\" On the craft itself: journalism is \"first and foremost a human endeavor\u2026 by humans for humans.\" [Episode transcript](https://podscripts.co/podcasts/odd-lots/nyt-ceo-meredith-kopit-levien-on-running-a-media-brand-in-the-age-of-ai)\n- **Jesse Dwyer, chief communications officer, Perplexity** (statement to Digiday, August 11, on blocking Time's agent ads): the company works \"continuously\" to protect users from deceptive practices, \"sponsored or not\" \u2014 and publishers deploying \"deceptive advertising like markdown ads\" risk a reputational downgrade in its index. [Digiday](https://digiday.com/media/perplexity-blocks-times-ads-served-to-ai-agents-calling-them-deceptive/)\n- **Robert Webster, founder, TAU** (on why the sponsored label doesn't survive retrieval): \"a promotional claim can end up cited as a neutral fact.\"\n- **Jeff Green, CEO, The Trade Desk** (Q2 call, August 6): growth sat \"below our expectations and below the standard we hold ourselves to.\" The market took 22% off the stock anyway. [AdExchanger](https://www.adexchanger.com/programmatic/the-trade-desks-revenue-growth-stalls-as-big-brands-tighten-their-belts/)\n- **Glenn Gabe, G-Squared Interactive** (X, on ChatGPT hiding its Sources button): \"I've noticed ChatGPT not providing a visible link to view sources. You have to click the overflow menu and then click view sources. That can definitely decrease visibility and clicks for citations that show up in the right-side panel.\" [Via Search Engine Roundtable](https://www.seroundtable.com/openai-chatgpt-sources-less-visible-41864.html)\n- **Sam Simmonds** (customer quote in Ahrefs' Letaido launch, August 12 \u2014 vendor-published): \"Our team has seen keyword research and bottom-of-funnel content audits, work that used to take a full 40-hour week, now take just 60 minutes.\" Hold it next to KPMG's 49% agent-rollback figure. [Via PPC Land](https://ppc.land/ahrefss-letaido-claims-a-40-hour-audit-now-takes-60-minutes/)\n\n---\n\n## This Week in Marketing AI\n\n### Google changed three things at once. September is unreadable by design.\n\nThe bidding target change starts rolling out today. Per Google ads liaison Ginny Marvin's interview last week, it reaches campaigns meeting three conditions at once (carrying a Target CPA or ROAS, limited by budget, and delivering better than target), and the correction runs one way: over-performers drift toward their stated target, under-performers get nothing. The confirmation with the longest tail is that ad-group-level targets sit inside the change, which makes the audit surface much larger for lead-gen accounts and older builds. Google says it won't change targets or budgets on your behalf; Measured's caution belongs in that audit: a $5 actual CPA is delivery under current auction conditions, not automatically your new target.\n\nThen September 1: campaigns using Automatically Created Assets or campaign-level broad match convert to AI Max, and the exits closed last week (Google stopped accepting new campaign-level broad match configurations on August 13; legacy creation ended August 3). The ACA cohort inherits automated query expansion unless it's switched off at ad-group level. And on August 14, Marvin announced the campaign-level language setting disappears in September \u2014 from Search and, in a scope change from the 2025 documentation, from Performance Max too, with new prioritization logic that reassigns which language's ad wins in bilingual setups.\n\nEach change is defensible alone. Together they remove three variables in four weeks, so September performance movement will have at least three plausible in-platform causes and no control condition. Marvin's own guidance (wait one to two conversion cycles) pushes the first credible reading to roughly the moment Q4 budgets get committed.\n\n**Source:** [Marvin's Marketing O'Clock interview](https://www.youtube.com/watch?v=iofOki6Zy8U) \u00b7 [Cypress North's interview recap](https://cypressnorth.com/paid-search-marketing/7-things-we-learned-from-ginny-marvin-ahead-of-googles-august-bidding-update/) \u00b7 [Search Engine Land's migration timeline](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006) \u00b7 [PPC Land on the broad match cutoff](https://ppc.land/google-blocks-new-broad-match-settings-before-september-1-ai-max-migration/) \u00b7 August 10\u201317, 2026\n\n### Lunio: AI Max campaigns carry 72% more invalid traffic, and the lines are diverging\n\nInvalid-traffic vendor Lunio published a retail study on August 12 covering 414 million clicks across 88 retail accounts from October 2025 through June: Google search campaigns with AI Max enabled were exposed to 72% more invalid traffic than search campaigns without it. The detail that makes this hard to wave away is internal to the same accounts: AI Max campaign IVT rose 114% over the period (2.46% to 5.28%) while standard search campaigns in the same accounts fell 17% (3.72% to 3.07%). Two lines diverging is a different class of finding from one line rising \u2014 Lunio's own framing is that AI Max went \"from the cleanest traffic in the channel to the dirtiest\" in nine months, ending at 55% of retail Search clicks but 68% of invalid ones. Google Shopping hit 7.51% in Q2 (roughly one in thirteen clicks), and Lunio's worked example puts the cost at about $500,000 in wasted spend for a retailer spending $10 million a year at $3.70 CPC.\n\nContext that belongs next to it: Google's own AI Max uplift claim has moved three times (14% at beta, 7% at general availability with retail excluded, 27% for exact-and-phrase-heavy adopters), independent tests found roughly 35% lower ROAS last November, and the reporting still can't split expanded from literal traffic inside a keyword row, and reports nothing on validity. Nineteen days before the mandatory migration, the measurement argument is doing the work the product documentation doesn't.\n\n**Source:** [Lunio's report](https://www.lunio.ai/blog/invalid-traffic-retail-report) \u00b7 [PPC Land's analysis](https://ppc.land/retailers-on-ai-max-face-72-more-invalid-traffic-lunio-finds/) \u00b7 August 12, 2026\n\n### Wall Street repriced ad tech: -22% for growing 3%, -20% for growing 53%\n\nThe Trade Desk reported $715.1 million in Q2 revenue on August 6, up 3%, guided Q3 to a year-on-year contraction, and lost roughly 22% of its market value; CEO Jeff Green told analysts the growth was \"below our expectations and below the standard we hold ourselves to,\" adding that \"we didn't execute as well as we could have\" and that pressured advertisers are \"buying cheap media rather than the best media.\" AppLovin grew 53% to $1.92 billion and still fell 19.7%, because the quarter carried no new model gains for investors to extrapolate. Criteo, Taboola, and Teads all fell 24\u201328%; PubMatic, Magnite, and Zeta rose. The distribution doesn't sort by growth rate; the market is pricing durable position, not last quarter's number.\n\nThe number underneath the pattern comes from Madison & Wall: Amazon, Google, and Meta took roughly 56% of US advertising last year, heading for about 58% this year, while the open internet is projected to shrink 1.4% inside a growing market. Meanwhile the measurement layer is leaving public view entirely: IAS went private, LiveRamp's Publicis buyout votes today, Innovid's gone, Nielsen is absorbing DoubleVerify, and Comscore disclosed an 85% collapse in adjusted EBITDA alongside a restructuring and a 20% CEO pay cut. One Comscore bet lands directly in the AEO lane: it's pitching measurement built on observed panelist prompts rather than the synthetic prompts most AI-visibility tools run on. The category is consolidating before it's standardized.\n\n**Source:** [Digiday's by-the-numbers analysis](https://digiday.com/marketing/by-the-numbers-wall-streets-tough-assessment-of-ad-tech/) \u00b7 [AdExchanger on The Trade Desk](https://www.adexchanger.com/programmatic/the-trade-desks-revenue-growth-stalls-as-big-brands-tighten-their-belts/) \u00b7 [The Trade Desk's results](https://www.thetradedesk.com/press-room/the-trade-desk-reports-second-quarter-2026-financial-results) \u00b7 [Comscore's announcement](https://www.comscore.com/Insights/Press-Releases/2026/8/Comscore-Announces-ROI-Strategy-to-Transform-the-Business) \u00b7 August 6\u201314, 2026\n\n### The AEO measurement stack shipped counts without connections\n\nGoogle Search Console's generative AI performance report reached nearly every account around August 11 \u2014 Search Engine Roundtable's Barry Schwartz found it across all his profiles, though Google's John Mueller confirmed it's \"not yet every domain.\" It reports impressions in AI features by page, country, device, and date, and carries no click data and no query data. You can count machine reads of your content, but you can't see what people asked or whether anyone arrived. The same week, Glenn Gabe spotted OpenAI testing a demotion of ChatGPT's Sources button into the three-dot menu (attribution demoted, not removed), and Microsoft shipped a Clarity card ranking which AI operators scrape most and refer least, with a sample showing a 6,000-to-1 crawl-to-referral ratio.\n\nThe buy side has the mirror problem: Digiday reported CMOs can't link AI visibility to sales despite spending on tools that rate brand presence in model answers. Publisher and advertiser now sit in symmetrical positions: one knows roughly how often machines read its work, the other how often machines mention its brand, and neither number connects to a payment. The tooling race to supply the missing connection is on: Clarity's ratio card, last week's branded/non-branded citation split, Jellyfish adjusting ad spend by share-of-model, Comscore's observed-prompt pitch.\n\n**Source:** [Search Engine Roundtable on the GSC report](https://www.seroundtable.com/google-search-console-ai-report-live-41850.html) \u00b7 [Search Engine Roundtable on ChatGPT sources](https://www.seroundtable.com/openai-chatgpt-sources-less-visible-41864.html) \u00b7 [Microsoft Clarity's announcement](https://clarity.microsoft.com/blog/scrape-to-referral-insights/) \u00b7 [Anicca weekly](https://anicca.co.uk/blog/2026-08-17-ai-in-marketing-management/) \u00b7 August 10\u201315, 2026\n\n### Congress moved on stealth crawlers as one publisher priced the problem: 25% of hosting costs\n\nThree House members introduced the Stealth Bot Prohibition Act (H.R. 9915) on July 23 \u2014 authored by the News/Media Alliance, with a New York version already passed \u2014 and AdExchanger's August 10 report put it on the industry's radar: AI crawlers would have to disclose identity and purpose to site hosts, with the FTC and state attorneys general enforcing at $53,000 per violation. The commercial math arrived with it: Axel Springer's Amelia Binder said 25% of Politico's hosting costs now go to bot management, and the Tampa Bay Times described bot loads degrading service for human readers. Disclosure sounds procedural; it's actually the precondition for any pricing mechanism, because an anonymous crawler can't be charged, rate-limited by contract, or offered a premium tier.\n\nThe substrate data published the same week explains the urgency: a Stanford study found 5% of IP addresses send 55% of all web requests, and 44% of client IPs carry two or more user agents. The signals frequency caps and household matching are built on are thinning at the same time the machine traffic they'd need to police is growing.\n\n**Source:** [AdExchanger's report](https://www.adexchanger.com/ai/a-new-bill-targets-bad-bots-that-scrape-websites-without-permission/) \u00b7 [News/Media Alliance announcement](https://www.newsmediaalliance.org/stealth-bot-prohibition-act-introduction/) \u00b7 August 10\u201311, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/ad-tech-repriced-everything-this-week-except-the-thing-doing-the-counting/).*\n\n- **ChatGPT Ads kept maturing on schedule:** oCPC arrived for product feed campaigns, measurement partnerships added Triple Whale and Hightouch, and AdRoll opened a ChatGPT ads pilot for select SMB and B2B customers (August 11). **Today's the deadline: Automatic Advanced Matching becomes the default on existing web pixels unless you opted out.** [ALM Corp roundup](https://almcorp.com/news/chatgpt-ads-conversion-bidding-carousel-ads-august-2026/)\n- **Google Ads homepages went agentic** (August 10): AI Overviews summarizing changes atop Google Analytics, insight cards and a prompt box on the Ads homepage, dashboards generated from text prompts, and Ask Advisor benchmarking against anonymized peers. More account decisions will start from an AI summary; spot-check the cards against raw pulls before trusting them. [PPC Land](https://ppc.land/google-ads-gains-ai-dashboards-built-from-text-prompts/)\n- **GA4 dropped the fixed three-day engaged-view window** (August 14): click-through windows now accept 1\u201390 days, and the release note doesn't say whether the change is retroactive, three days before a bidding change that reads conversion signals. Annotate everything.\n- **Two opposite bets on agent write-access shipped the same week:** Fluency blocks AI from touching live spend across $3 billion in budgets (deterministic execution only), while Kochava's StationOne offers chat-run ad ops with write scope undisclosed. Ask every agent vendor the same question: can it change bids, and who approved that?\n- **The AI-visibility tool shelf grew:** AI Visibility launched a free tracker for how often ChatGPT and Gemini recommend brands, and Jellyfish's Share of Model now adjusts ad spend based on AI mention frequency. Someone on the team should own this budget line before it owns itself. [Anicca weekly](https://anicca.co.uk/blog/2026-08-17-ai-in-marketing-management/)\n- **Spotify will drop AI persona artists from editorial recommendations mid-September**, keeping badged profiles streaming but out of placement. Platforms keep drawing the human/synthetic line one surface at a time. (August 13)\n- **Google lowered the Search Profiles threshold to 35,000 subscribers** (from 100,000) across YouTube, Instagram, and X. More creators become directly rankable entities in search; the entity-over-website shift keeps compounding. [Search Engine Roundtable](https://www.seroundtable.com/recap-08-13-2026-41868.html) \u00b7 August 13\n- **France's Constitutional Council struck down the under-15 social ban**, with the explicit point that enforcing an age threshold means everyone proves their age. Age checks are becoming an identity layer question, and whoever holds the check holds the signal. EU-wide answer due in September. (August 14)\n\n---\n\n## Common Threads\n\n### Machine attention has no agreed unit, rate, or referee\n\nThe NYT priced its output; crawlers won't identify themselves; GSC counts AI impressions it can't connect to queries or clicks; agencies can't agree how to bill tokens. Every dispute this week reduces to the same condition: the industry built its measurement for human attention and is now transacting in machine attention without an agreed way to count it.\n\n### September is unreadable by design\n\nBidding targets recalibrate from today, AI Max conversion lands September 1, the language setting disappears the same month. Any September performance movement has at least three in-platform explanations. The teams that pre-frame this with clients now will look prescient in October; the ones that don't will spend Q4 arguing about attribution.\n\n### The verification argument is doing the product documentation's job\n\nLunio's diverging lines, smec's 29% expansion share, Google's three different uplift claims. Independent measurement is now the only place the AI Max debate is being conducted with numbers, because the platform's reporting can't split the populations in question.\n\n### Value keeps moving to whoever controls the count\n\nThree companies take 58% of US advertising; the measurement layer exits public disclosure; Perplexity unilaterally rules on a new ad format; Comscore bets its recovery on owning observed prompts. Whoever supplies the agreed number for machine attention inherits the pricing power that used to sit with the ratings currency.\n\n---\n\n## Angles for the Week\n\n*Raw material for posts and POVs, ordered by how long each window stays open.*\n\n### \"September performance reviews are unreadable by design. Say so before they happen.\"\n\nThree Google changes in four weeks, no control condition, and the first credible reading lands at Q4 budget time. The valuable post is the pre-mortem: what to audit this week (ad-group-level targets, ACA and campaign-level broad match, bilingual campaign structures), and the exact language to set client expectations. Everyone else will write the October post-mortem.\n\nWindow: hard peg today; audit value through September 1.\n\n### \"AI Max clicks are 72% more likely to be invalid. Ask your agency what happens September 1.\"\n\nThe diverging-lines finding (AI Max invalid rates rising while standard search falls, in the same accounts) is the receipt; Shopping's one-in-thirteen invalid clicks is the headline for retail audiences. The constructive version ends with the three questions to ask your PPC team before the mandatory migration.\n\nWindow: nineteen days to September 1; strongest now.\n\n### \"The machine audience just got its first ad ban.\"\n\nTime built ads for agents; Perplexity banned them as deceptive; no standard governed either move. The precedent take: agent-legible content is inevitable, platform-approved formats for it don't exist yet, and the cloaking framework from 2005 SEO is about to be relitigated for AI. Position now, before the standards bodies do.\n\nWindow: this week for the news; the framework take is durable.\n\n### \"The New York Times priced content at $4,000 a unit. Price yours.\"\n\nThe first public production-cost anchor in the AI licensing wars, plus a three-part framework (continuity, permission with control, price) that transfers directly to brand content programs deciding what to gate, feed, or license to AI systems. Pair with the Stack Overflow collapse for the supply-side argument.\n\nWindow: durable thought-leadership territory.\n\n### \"Your AEO dashboard counts things it can't connect.\"\n\nGSC's new generative report has no queries and no clicks; CMOs can't tie visibility tools to sales; Clarity's ratio card and branded/non-branded splits are the early connective tissue. The practical post: what to instrument today (citation splits, crawl-to-referral ratios, presence audits) and what to stop pretending the tools can tell you.\n\nWindow: durable; compounds with last week's measurement items.\n\n---\n\n## Sources\n\n**Primary documents and episodes**\n\n1. [Lunio \u2014 AI Max and invalid traffic: findings from 414 million retail ad clicks](https://www.lunio.ai/blog/invalid-traffic-retail-report) \u2014 August 12, 2026 \u2014 the study itself: method, diverging rates, Shopping detail, worked example\n2. [The Trade Desk \u2014 Q2 2026 financial results](https://www.thetradedesk.com/press-room/the-trade-desk-reports-second-quarter-2026-financial-results) \u2014 August 6, 2026 \u2014 primary financials and Q3 guidance\n3. [Comscore \u2014 ROI Strategy announcement](https://www.comscore.com/Insights/Press-Releases/2026/8/Comscore-Announces-ROI-Strategy-to-Transform-the-Business) \u2014 August 11, 2026 \u2014 restructuring, savings range, McLaughlin remarks\n4. [Microsoft Clarity \u2014 scrape-to-referral insights](https://clarity.microsoft.com/blog/scrape-to-referral-insights/) \u2014 August 13, 2026 \u2014 the crawl-to-referral card, in Microsoft's own words\n5. [News/Media Alliance \u2014 Stealth Bot Prohibition Act introduction](https://www.newsmediaalliance.org/stealth-bot-prohibition-act-introduction/) \u2014 July 23, 2026 \u2014 H.R. 9915 sponsors and Coffey statement\n6. [Marketing O'Clock \u2014 Ginny Marvin interview on the August 17 bidding change](https://www.youtube.com/watch?v=iofOki6Zy8U) \u2014 August 12, 2026 \u2014 primary episode, quoted verbatim in Voices\n7. [Greg Finn \u2014 LinkedIn post announcing the Marvin interview](https://www.linkedin.com/posts/gregfinn_interview-with-ginny-marvin-deep-dive-on-activity-7493391938033954816-cYf4) \u2014 August 12, 2026 \u2014 interview scope and context\n8. [Odd Lots \u2014 NYT CEO Meredith Kopit Levien episode transcript](https://podscripts.co/podcasts/odd-lots/nyt-ceo-meredith-kopit-levien-on-running-a-media-brand-in-the-age-of-ai) \u2014 August 10, 2026 \u2014 primary episode, quoted verbatim in Voices\n\n**Original reporting**\n\n9. [Digiday \u2014 Perplexity blocks Time's ads served to AI agents](https://digiday.com/media/perplexity-blocks-times-ads-served-to-ai-agents-calling-them-deceptive/) \u2014 August 11, 2026 \u2014 the Dwyer statement and block details; Digiday broke this story\n10. [Digiday \u2014 Time has started serving ads to AI agents](https://digiday.com/media/time-has-started-serving-ads-to-ai-agents/) \u2014 July 30, 2026 \u2014 the original agent-ads reporting the block responds to\n11. [Digiday \u2014 Wall Street's tough assessment of ad tech, by the numbers](https://digiday.com/marketing/by-the-numbers-wall-streets-tough-assessment-of-ad-tech/) \u2014 August 13, 2026 \u2014 the repricing analysis, Madison & Wall data, Green quotes\n12. [AdExchanger \u2014 The Trade Desk's revenue growth stalls](https://www.adexchanger.com/programmatic/the-trade-desks-revenue-growth-stalls-as-big-brands-tighten-their-belts/) \u2014 August 2026 \u2014 earnings-call detail and market reaction\n13. [AdExchanger \u2014 A new bill targets 'bad bots' that scrape websites without permission](https://www.adexchanger.com/ai/a-new-bill-targets-bad-bots-that-scrape-websites-without-permission/) \u2014 August 10, 2026 \u2014 Stealth Bot Act mechanics, Politico hosting-cost figure\n14. [Search Engine Roundtable \u2014 GSC generative AI performance report expands](https://www.seroundtable.com/google-search-console-ai-report-live-41850.html) \u2014 August 11, 2026 \u2014 rollout status, Mueller's correction\n15. [Search Engine Roundtable \u2014 OpenAI makes ChatGPT sources less visible](https://www.seroundtable.com/openai-chatgpt-sources-less-visible-41864.html) \u2014 August 13, 2026 \u2014 the Glenn Gabe find, quoted in Voices\n16. [Search Engine Roundtable \u2014 August 13 recap](https://www.seroundtable.com/recap-08-13-2026-41868.html) \u2014 August 13, 2026 \u2014 Search Profiles threshold drop\n17. [Search Engine Land \u2014 Google sets AI Max migration timeline](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006) \u2014 July 2026 \u2014 the September auto-migration dates behind the control squeeze\n18. [PPC Land \u2014 Google blocks new broad match settings before September 1](https://ppc.land/google-blocks-new-broad-match-settings-before-september-1-ai-max-migration/) \u2014 August 13, 2026 \u2014 exit-closure reporting\n19. [PPC Land \u2014 Google Ads gains AI dashboards built from text prompts](https://ppc.land/google-ads-gains-ai-dashboards-built-from-text-prompts/) \u2014 August 10, 2026 \u2014 agentic homepage changes, Ask Advisor benchmarking\n20. [PPC Land \u2014 Ahrefs's Letaido claims a 40-hour audit now takes 60 minutes](https://ppc.land/ahrefss-letaido-claims-a-40-hour-audit-now-takes-60-minutes/) \u2014 August 12, 2026 \u2014 launch details, unverified claims flagged\n21. [PPC Land \u2014 New York Times has sued three AI companies, CEO says](https://ppc.land/new-york-times-has-sued-three-ai-companies-ceo-kopit-levien-says/) \u2014 August 2026 \u2014 interview detail: $2B cost base, licensing framework\n\n**Roundups consulted**\n\n22. [Cypress North \u2014 7 things we learned from Ginny Marvin](https://cypressnorth.com/paid-search-marketing/7-things-we-learned-from-ginny-marvin-ahead-of-googles-august-bidding-update/) \u2014 August 2026 \u2014 interview recap\n23. [ALM Corp \u2014 ChatGPT Ads August 2026 updates](https://almcorp.com/news/chatgpt-ads-conversion-bidding-carousel-ads-august-2026/) \u2014 August 2026 \u2014 oCPC for feeds, measurement partners, AAM default date\n24. [Anicca \u2014 This Week in AI in Marketing & Management (August 17)](https://anicca.co.uk/blog/2026-08-17-ai-in-marketing-management/) \u2014 August 17, 2026 \u2014 AI Visibility tool, Jellyfish Share of Model\n25. [PPC Land \u2014 weekly synthesis, August 10\u201315](https://ppc.land/ad-tech-repriced-everything-this-week-except-the-thing-doing-the-counting/) \u2014 August 15, 2026 \u2014 used to surface the week's smaller platform notes (language-targeting announcement, KPMG survey, Fluency/Kochava, Spotify, France)\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# The Monday Signal \u2014 Week of August 17, 2026\n\n> **Google changed three controls in four weeks (bidding targets recalibrate from today, AI Max becomes mandatory September 1, the language setting disappears the same month), so September performance is unreadable by design.** Also: AI Max campaigns carry 72% more invalid traffic, Wall Street cut The Trade Desk 22% and AppLovin 20%, Perplexity banned Time's agent ads, and the NYT priced content at ~$4,000 a unit.\n\n---\n\n## The Conversation\n\n### Perplexity banned Time's agent ads\n\nTwo weeks after Time started inserting sponsored FAQ content into the markdown pages agents read, Perplexity blocked the units and called the practice deceptive (August 11), even though Time labeled them as sponsored. The label doesn't survive retrieval; \"a promotional claim can end up cited as a neutral fact\" (Robert Webster). Platforms are ruling on agent-track advertising before any standard exists. Comment window: the cloaking-precedent take is unclaimed. [Digiday](https://digiday.com/media/perplexity-blocks-times-ads-served-to-ai-agents-calling-them-deceptive/)\n\n### The NYT priced content: ~$4,000 a unit\n\nCEO Meredith Kopit Levien on Odd Lots (August 10): close to $2B spent last year producing ~500K works. Her licensing framework separates continuity, permission-with-control, and price. Supply argument: Stack Overflow questions are down 99% from peak. Counterweight: three firms hold 88% of AI model API revenue. Transferable idea: content as a priced, licensable asset class. [Odd Lots episode](https://podscripts.co/podcasts/odd-lots/nyt-ceo-meredith-kopit-levien-on-running-a-media-brand-in-the-age-of-ai)\n\n### \"40-hour audits in 60 minutes\" vs \"49% cut their agent rollouts\"\n\nAhrefs launched Letaido (August 12) with a time-compression claim and no independently verified data; KPMG found 49% of organizations cut agent rollouts when costs outran value, with established ROI at 7%. Both are real; the gap is verification and governance. [Letaido](https://ppc.land/ahrefss-letaido-claims-a-40-hour-audit-now-takes-60-minutes/) \u00b7 [PPC Land weekly](https://ppc.land/ad-tech-repriced-everything-this-week-except-the-thing-doing-the-counting/)\n\n---\n\n## Voices\n\n- **Ginny Marvin (Marketing O'Clock, August 12, on today's bidding change):** \"It just should be more stable than it's been in the past\u2026 we usually recommend at least a convergence cycle or two.\" [Interview](https://www.youtube.com/watch?v=iofOki6Zy8U)\n- **Meredith Kopit Levien (Odd Lots, August 10):** LLM makers spend billions on \"talent and power and compute\u2026 one of the things that goes into making models is high quality information. And, you know, we'd like to see them pay a fair wage for that as well.\" [Transcript](https://podscripts.co/podcasts/odd-lots/nyt-ceo-meredith-kopit-levien-on-running-a-media-brand-in-the-age-of-ai)\n- **Robert Webster, TAU (on agent ads):** \"a promotional claim can end up cited as a neutral fact.\"\n- **Jeff Green, The Trade Desk:** growth sat \"below our expectations and below the standard we hold ourselves to.\"\n\n---\n\n## This Week in Marketing AI\n\n### Google's three-change September\n\nToday: bidding targets recalibrate for budget-limited campaigns beating their Target CPA/ROAS (one-way correction; ad-group targets in scope). September 1: ACA and campaign-level broad match campaigns convert to AI Max; exits closed August 13. September: the campaign language setting disappears from Search and now Performance Max too. Three variables removed in four weeks; the first credible performance reading lands at Q4 budget time. Pre-frame it with clients now. [Marketing O'Clock](https://www.youtube.com/watch?v=iofOki6Zy8U) \u00b7 [Search Engine Land](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006)\n\n### AI Max carries 72% more invalid traffic (Lunio, 414M clicks)\n\nIn the same accounts, AI Max campaigns rose from 2.46% to 5.28% invalid while standard search fell from 3.72% to 3.07%: diverging lines, not one rising line. AI Max took 68% of detected invalid clicks; Google Shopping hit 7.51% (one in thirteen). A $10M retailer wastes ~$500K at the 5% average. Google's own uplift claim has moved three times (14% \u2192 7% \u2192 27%); reporting still can't split expanded from literal traffic. [Lunio study](https://www.lunio.ai/blog/invalid-traffic-retail-report) \u00b7 August 12\n\n### Wall Street repriced ad tech\n\nThe Trade Desk fell ~22% after growing 3%; AppLovin fell 19.7% after growing 53%. Madison & Wall: Amazon+Google+Meta head for ~58% of US advertising; the open internet shrinks 1.4%. The measurement layer is going private (IAS, LiveRamp, Innovid, DoubleVerify\u2192Nielsen), and Comscore (EBITDA down 85%) is betting partly on AEO data from observed panelist prompts. Consolidation before standardization. [Digiday](https://digiday.com/marketing/by-the-numbers-wall-streets-tough-assessment-of-ad-tech/) \u00b7 [AdExchanger](https://www.adexchanger.com/programmatic/the-trade-desks-revenue-growth-stalls-as-big-brands-tighten-their-belts/)\n\n### AEO measurement: counts without connections\n\nGSC's generative AI report reached nearly every account (Google says not quite all): impressions by page/country/device, no clicks, no queries. OpenAI is testing tucking ChatGPT's Sources button into a submenu. Clarity shipped a crawl-to-referral ratio card (sample: 6,000:1). CMOs told Digiday they can't link AI visibility to sales. The race to supply the missing connection is the story. [Search Engine Roundtable](https://www.seroundtable.com/google-search-console-ai-report-live-41850.html) \u00b7 [Microsoft Clarity](https://clarity.microsoft.com/blog/scrape-to-referral-insights/)\n\n### Stealth crawlers meet a $53,000 fine\n\nThe Stealth Bot Prohibition Act would force AI crawlers to disclose identity and purpose ($53K per violation; NY version passed). Politico now spends 25% of hosting costs on bot management. Disclosure is the precondition for charging machines anything. [AdExchanger](https://www.adexchanger.com/ai/a-new-bill-targets-bad-bots-that-scrape-websites-without-permission/)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/ad-tech-repriced-everything-this-week-except-the-thing-doing-the-counting/).*\n\n- **ChatGPT Ads:** oCPC for product feeds, Triple Whale/Hightouch measurement, AdRoll pilot. **Automatic Advanced Matching becomes the pixel default today** unless opted out. [ALM Corp](https://almcorp.com/news/chatgpt-ads-conversion-bidding-carousel-ads-august-2026/)\n- **Google Ads/Analytics homepages went agentic:** AI Overviews, insight cards, prompt-built dashboards, peer benchmarking. Spot-check the cards before trusting them. [PPC Land](https://ppc.land/google-ads-gains-ai-dashboards-built-from-text-prompts/) \u00b7 August 10\n- **GA4 changed conversion windows** (1\u201390 days, retroactivity unstated) three days before the bidding change. Annotate everything. (August 14)\n- **Agent write-access split:** Fluency blocks AI from live spend ($3B budgets); Kochava ships chat-run ad ops with write scope undisclosed. Ask vendors: can it change bids?\n- **AI-visibility shelf grew:** AI Visibility's free brand-recommendation tracker; Jellyfish adjusts spend by share-of-model. [Anicca](https://anicca.co.uk/blog/2026-08-17-ai-in-marketing-management/)\n- **Spotify drops AI persona artists** from editorial recommendations mid-September. (August 13)\n- **Search Profiles threshold cut to 35,000 subscribers:** more creators become rankable entities. [Search Engine Roundtable](https://www.seroundtable.com/recap-08-13-2026-41868.html) \u00b7 August 13\n\n---\n\n## Common Threads\n\n### Machine attention has no agreed unit, rate, or referee\nPriced content, anonymous crawlers, impression counts with no queries, unbillable tokens: every dispute reduces to who controls the count.\n\n### September is unreadable by design\nThree platform changes, no control condition. Pre-frame with clients now or argue attribution in Q4.\n\n### Independent measurement is doing the documentation's job\nLunio's diverging lines, smec's 29%, three different Google uplift claims. The numbers live outside the platform.\n\n### Value moves to whoever controls the count\n58% to three companies; measurement going private; Perplexity ruling on formats unilaterally; Comscore betting on observed prompts.\n\n---\n\n## Angles for the Week\n\n1. **\"September reviews are unreadable by design. Say so now.\"** The pre-mortem post: what to audit this week, and the client-expectation language. Window: today through September 1.\n2. **\"AI Max clicks are 72% more likely to be invalid.\"** Diverging lines are the receipt; end with three questions for your PPC team. Window: 19 days.\n3. **\"The machine audience got its first ad ban.\"** Perplexity vs Time; the 2005 cloaking framework returns for AI. Durable framework take.\n4. **\"The NYT priced content at $4,000 a unit. Price yours.\"** Content as licensable asset class; permission-with-control for brand programs. Durable.\n5. **\"Your AEO dashboard counts things it can't connect.\"** GSC's gaps plus the tools that do connect (citation splits, ratio cards). Durable, compounds weekly.\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
