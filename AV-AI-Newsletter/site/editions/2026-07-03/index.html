  <script>
    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of July 3, 2026\n\n> **AI video moved deeper into editable production workflows this week.** Google brought **Veo 3.1** into Flow with richer audio, stronger prompt adherence, and audio support across Ingredients to Video, Frames to Video, and Extend. **Anthropic released Claude Sonnet 5** as its most agentic Sonnet model yet, with pricing that makes long-running coding and workflow agents less expensive than larger frontier models. **Runway expanded its Bertelsmann partnership**, a sign that generative video tools are becoming operational infrastructure inside large media organizations. And the broader video model market kept splitting along a few practical lines: native audio, reference capacity, editable outputs, and enterprise deployment.\n\n---\n\n## This Week in AI\n\n### Google Brings Veo 3.1 Into Flow With Audio Across More Workflows\n\nGoogle updated Flow with **Veo 3.1**, adding richer audio, stronger prompt adherence, more realistic texture rendering, and broader audio support across existing video workflows.\n\nThe practical change is that audio is no longer limited to a narrow subset of generation modes. Google says Flow now brings audio to:\n\n- **Ingredients to Video**\n- **Frames to Video**\n- **Extend**\n\nThat matters because these are the modes that move beyond a simple text prompt. Ingredients to Video works from reference materials. Frames to Video gives the model a starting or ending frame. Extend continues an existing clip. Adding audio to those modes makes the generated output more like a production object: image references, timing, movement, and sound can travel together.\n\nGoogle also introduced more precise editing controls inside Flow. The new **Insert** capability adds an element to an existing scene while preserving the surrounding clip, and Google says object removal is coming. The pattern is familiar now: generated video is becoming less of a one-shot output and more of an editable sequence.\n\nVeo 3.1 is also available beyond the consumer Flow interface. Google says the model and new capabilities are available through the **Gemini API** and **Vertex AI**, with Flow, Google Vids, the Gemini app, and API surfaces all part of the rollout. For AV teams, the important point is not only higher fidelity. It is that the same model family is showing up in both a creative interface and developer/enterprise workflows.\n\nThe caveat is still worth keeping in view. Google describes some of the audio features as experimental and actively improving. That is the state of the category: promising enough to matter, but still requiring review, editing, and separate quality control.\n\n**Source:** [Google \u2014 Bringing new Veo 3.1 updates into Flow](https://blog.google/innovation-and-ai/products/veo-updates-flow/) \u00b7 [Google \u2014 Enhanced Veo 3.1 capabilities in the Gemini API](https://blog.google/innovation-and-ai/technology/developers-tools/veo-3-1-gemini-api/) \u00b7 July 2026\n\n### Claude Sonnet 5 Makes Agentic Work Cheaper and More Available\n\nAnthropic released **Claude Sonnet 5** on June 30, positioning it as the most agentic Sonnet model so far.\n\nThe headline is not that Sonnet 5 replaces the largest models. It is that it brings more of that capability into the lower-cost Sonnet tier. Anthropic says Sonnet 5 can make plans, use browsers and terminals, and run autonomously at a level that recently required larger and more expensive models.\n\nThe availability story is also important:\n\n- Sonnet 5 is available across Claude plans.\n- It is available in Claude Code.\n- Developers can call it through the Claude API with the model ID `claude-sonnet-5`.\n- Introductory API pricing is **$2 per million input tokens** and **$10 per million output tokens** through August 31, 2026.\n- Standard pricing after that is **$3 input / $15 output per million tokens**.\n\nOn Anthropic's reported benchmarks, Sonnet 5 reaches **63.2% on SWE-bench Pro** and **80.4% on Terminal-Bench 2.1**. Those are software and command-line evaluations, not AV benchmarks, but they map to a kind of work that increasingly surrounds AV production: file organization, scripts, metadata cleanup, web publishing, SharePoint packaging, QA checklists, batch processing, and small internal tools.\n\nThe model story this week is therefore practical rather than dramatic. GPT-5.6 Sol remains the more aggressive frontier signal, but it is still in limited preview. Sonnet 5 is generally available. That makes it more relevant for actual workflow experimentation in the near term.\n\n**Source:** [Anthropic \u2014 Introducing Claude Sonnet 5](https://www.anthropic.com/news/claude-sonnet-5) \u00b7 [Anthropic \u2014 Claude Sonnet 5](https://www.anthropic.com/claude/sonnet?prog_id=5) \u00b7 June 30, 2026\n\n### Runway Expands Enterprise Media Deployment With Bertelsmann\n\nRunway announced a creative partnership with **Bertelsmann** on July 1. Under the agreement, Runway's AI models will be integrated across Bertelsmann businesses including RTL Group, BMG, and Bertelsmann Marketing Services.\n\nThis is not a model release, but it is still a useful signal. The AI video market is moving in two directions at once:\n\n- Consumer-facing tools keep competing on output quality, speed, audio, and control.\n- Enterprise media companies are building operational agreements around the tools they intend to use at scale.\n\nRunway says the Bertelsmann relationship began in 2024 through the Bertelsmann AI Hub and is now expanding into broader workflow development. The announcement points to use across creative workflows rather than a single narrow use case.\n\nFor AV production, the interesting part is the shape of deployment. Large media organizations are not only testing prompt-to-video clips. They are looking at where generative tools sit across ideation, visual development, music marketing materials, review cycles, and repeatable production workflows. That is a different kind of adoption than an individual user trying a model in a browser.\n\nIt also connects to a broader pattern from the last few weeks. Adobe is putting creative agents into established apps. Google is putting Veo into Flow and API workflows. Runway is deepening media partnerships. The category is becoming less about which single model makes the prettiest clip and more about which systems fit into the production chain.\n\n**Source:** [Runway \u2014 Runway Announces Creative Partnership with Bertelsmann](https://runwayml.com/news/runway-announces-creative-partnership-with-bertelsmann) \u00b7 July 1, 2026\n\n### Adobe's Topaz Deal Puts Enhancement Back in the Center of AI Video\n\nLate last week, Adobe announced a definitive agreement to acquire **Topaz Labs**, the company behind widely used AI image and video enhancement tools.\n\nThis story is slightly outside the clean July 3 window, but it is relevant because it fills in a different side of AI production. Generative video gets most of the attention, but finishing often depends on enhancement: sharpening, denoising, restoring, upscaling, stabilizing, and improving material that already exists.\n\nAdobe says Topaz technology will be integrated into Firefly, Firefly Services, and Creative Cloud apps, while Topaz products will continue as standalone offerings. Adobe also highlighted Topaz's **Neurostream** technology, which is designed to run large video and image models locally on consumer hardware.\n\nThat local-processing angle is worth watching. If more enhancement can happen on-device instead of only in the cloud, the user experience changes: faster previews, lower latency, and more practical use on large files. It also fits the hybrid reality of AV work, where teams may combine camera footage, screen captures, generated elements, archival material, and rendered graphics in the same final piece.\n\n**Source:** [Adobe \u2014 Adobe to Acquire Topaz Labs](https://news.adobe.com/news/2026/06/adobe-to-acquire-topaz-labs) \u00b7 [TechCrunch \u2014 Adobe acquires Topaz Labs](https://techcrunch.com/2026/06/25/adobe-acquires-image-and-video-enhancement-tool-maker-topaz-labs/) \u00b7 June 25, 2026\n\n### Quick Hits\n\n- **Seedance 2.5 moved into early access through Topview coverage** \u2014 Reports this week framed ByteDance's upcoming model as a bigger workflow release rather than just a quality bump: up to 30-second single-pass clips, up to 50 multimodal references, region-level editing, and native audio-video generation. Since we covered the preview last week, the update is mostly about access and workflow positioning.\n- **LTX 2.3 remains one of the clearer open audio-video model directions** \u2014 LTX's current model page and release notes emphasize synchronized audio-video generation, cleaner audio from an upgraded vocoder, native portrait output, and audio-to-video workflows. The technical caveat is that older LTX 2.0 LoRAs need retraining because the latent space changed.\n- **Artificial Analysis continues to show how fragmented AI video rankings are** \u2014 Its text-to-video leaderboard places Dreamina Seedance 2.0 at the top among models with audio output, while other rankings weigh Veo, Kling, HappyHorse, and Runway differently. The useful takeaway is not a single winner; it is that benchmark rankings depend heavily on the task, audio setting, access path, and judging method.\n\n---\n\n## Voices This Week\n\n### Google on Flow's Direction\n\nGoogle described the Flow update as a move toward more granular control and broader audio support:\n\n> \"For the first time, we're also bringing audio to existing capabilities like Ingredients to Video, Frames to Video and Extend.\"\n\nThat sentence captures the practical shift. Audio is becoming part of the controlled generation workflow, not only a final layer added after the image is made.\n\n### Anthropic on Sonnet 5\n\nAnthropic framed Sonnet 5 around agentic work rather than ordinary chat:\n\n> \"Claude Sonnet 5 is built to be the most agentic Sonnet model yet.\"\n\nThat wording matters because the model market is increasingly separating general conversation from models that can plan, use tools, and complete multi-step work.\n\n---\n\n## Common Threads\n\n### AI Video Is Becoming Editable by Default\n\nVeo 3.1 in Flow, Runway's enterprise partnerships, Seedance 2.5's region-level editing, and LTX's retake/extend-style workflows all point in the same direction. The next stage of AI video is not only better generation. It is better control after the first generation.\n\n### Audio Is Moving Into the Video Model Itself\n\nLast week, the pattern showed up in video-to-music and Seedance's audio-video architecture. This week, Google expanded audio support across Flow's reference and extension modes, while LTX continues to emphasize synchronized audio-video generation. The separation between \"make the clip\" and \"add sound later\" is starting to narrow.\n\n### Enterprise Adoption Is About Workflow Fit\n\nRunway with Bertelsmann, Adobe with Topaz, and Google through Vertex AI all show the same enterprise pattern. The tools need to fit into existing review, production, enhancement, and deployment paths. Output quality matters, but workflow reliability increasingly matters just as much.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Audio-Aware Reference Workflows\n\nReference-driven generation used to mean images, frames, and style boards. Now audio is becoming another reference layer. A voice track, music cue, or timing bed can shape motion and structure, not only sit underneath the final video.\n\n### Local Enhancement as Production Infrastructure\n\nTopaz's Neurostream technology points to a possible split between cloud generation and local finishing. If enhancement models can run well on local hardware, teams may use cloud systems for heavier generation while using local tools for sharpening, denoising, restoration, or upscaling.\n\n### Model Choice by Production Task\n\nThe video market is no longer cleanly ranked from best to worst. One model may lead on audio, another on reference inputs, another on editing control, another on cost, and another on enterprise deployment. The more practical question is becoming: which model is strongest for this specific production task?\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 6: Use Checklists as Guardrails\n\nLast week, the Back to Basics series covered **Ask for a Delta**: after an AI revision, ask the model to list exactly what changed.\n\nThis week builds on that with a simple habit: **use checklists as guardrails**.\n\nA checklist is useful because it gives the model a concrete review standard. Instead of saying \"make this better,\" the checklist defines what \"better\" means for the task.\n\nUse this pattern:\n\n```text\nBefore you revise, use this checklist:\n\n- Preserve all names, dates, and timecodes.\n- Keep technical terms unchanged unless they are clearly wrong.\n- Remove repeated ideas.\n- Make the wording clearer and shorter.\n- Do not add new claims.\n- Flag anything uncertain instead of guessing.\n\nAfter the revision, show:\n- Revised version\n- Checklist results\n- Items that need human review\n```\n\nFor AV work, checklists are useful with edit notes, equipment summaries, captions, SharePoint copy, scripts, documentation, asset lists, and post-production QA. They help the model separate the writing task from the review task.\n\nThe small habit: before asking AI to revise or summarize something, give it a short checklist of what must stay true.\n\nNext week, Back to Basics Week 7: **Give It Examples Before You Ask for Output** \u2014 why two examples can do more than a long explanation.\n\n---\n\n## Sources\n\n1. [Google \u2014 Bringing new Veo 3.1 updates into Flow](https://blog.google/innovation-and-ai/products/veo-updates-flow/) \u2014 July 2026 \u2014 Veo 3.1 in Flow, audio across existing features, editing controls\n2. [Google \u2014 Enhanced Veo 3.1 capabilities in the Gemini API](https://blog.google/innovation-and-ai/technology/developers-tools/veo-3-1-gemini-api/) \u2014 July 2026 \u2014 Ingredients to Video, vertical format, 1080p/4K, Gemini API and Vertex AI\n3. [Anthropic \u2014 Introducing Claude Sonnet 5](https://www.anthropic.com/news/claude-sonnet-5) \u2014 June 30, 2026 \u2014 Sonnet 5 release, availability, pricing, model positioning\n4. [Anthropic \u2014 Claude Sonnet 5](https://www.anthropic.com/claude/sonnet?prog_id=5) \u2014 June 30, 2026 \u2014 Sonnet 5 benchmark and product details\n5. [Runway \u2014 Runway Announces Creative Partnership with Bertelsmann](https://runwayml.com/news/runway-announces-creative-partnership-with-bertelsmann) \u2014 July 1, 2026 \u2014 Runway models integrated across Bertelsmann businesses\n6. [Adobe \u2014 Adobe to Acquire Topaz Labs](https://news.adobe.com/news/2026/06/adobe-to-acquire-topaz-labs) \u2014 June 25, 2026 \u2014 definitive acquisition agreement and Topaz integration plans\n7. [TechCrunch \u2014 Adobe acquires Topaz Labs](https://techcrunch.com/2026/06/25/adobe-acquires-image-and-video-enhancement-tool-maker-topaz-labs/) \u2014 June 25, 2026 \u2014 context on Topaz products and Adobe integration\n8. [Programming Insider \u2014 Seedance 2.5 Arrives on Topview](https://programminginsider.com/seedance-2-5-arrives-on-topview-with-bigger-ai-video-workflows/) \u2014 July 2026 \u2014 early-access positioning and workflow details\n9. [LTX \u2014 LTX-2.3 video engine](https://ltx.io/model/ltx-2-3) \u2014 2026 \u2014 model capabilities, audio-to-video, cleaner audio, native portrait output\n10. [LTX \u2014 Model News & Release Notes](https://ltx.io/release-notes) \u2014 2026 \u2014 LTX 2.3 release notes and API variants\n11. [Artificial Analysis \u2014 Text to Video Leaderboard](https://artificialanalysis.ai/video/leaderboard/text-to-video) \u2014 July 2026 \u2014 text-to-video leaderboard with audio\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of July 3, 2026\n\n> **This week, AI video became more editable and more audio-aware.** Google brought **Veo 3.1** into Flow with audio support across Ingredients to Video, Frames to Video, and Extend. Anthropic released **Claude Sonnet 5**, a lower-cost model focused on agentic coding, tool use, and multi-step work. Runway expanded its partnership with Bertelsmann, showing AI video moving deeper into large media workflows. Adobe's Topaz deal also reminded the industry that enhancement, restoration, and upscaling are becoming central to AI production.\n\n---\n\n## The Big Story\n\n### Google Brings Veo 3.1 Into Flow\n\nGoogle updated Flow with **Veo 3.1**, adding richer audio, better prompt adherence, more realistic textures, and more precise editing controls.\n\nThe most important change is audio support across more Flow modes:\n\n- Ingredients to Video\n- Frames to Video\n- Extend\n\nThese are the modes that use more than a text prompt. Ingredients to Video works from reference materials. Frames to Video uses a starting or ending image. Extend continues an existing clip.\n\nAdding audio to those modes makes the output more production-like. The model is not only creating a silent clip; it can carry visual references, timing, motion, and sound together.\n\nGoogle also added more editing control with **Insert**, a feature that adds an element to an existing scene while preserving the surrounding clip. Object removal is planned next.\n\nVeo 3.1 is available through Flow, the Gemini API, Vertex AI, the Gemini app, and Google Vids. Some audio features are still experimental, so review and editing remain part of the process.\n\n**Source:** [Google](https://blog.google/innovation-and-ai/products/veo-updates-flow/) \u00b7 [Google Gemini API](https://blog.google/innovation-and-ai/technology/developers-tools/veo-3-1-gemini-api/) \u00b7 July 2026\n\n---\n\n## Other Stories\n\n### Claude Sonnet 5 Is About Agentic Work\n\nAnthropic released **Claude Sonnet 5** on June 30.\n\nAnthropic describes it as the most agentic Sonnet model yet. The model is built for planning, tool use, coding, terminal workflows, and longer multi-step tasks.\n\nKey details:\n\n- Available across Claude plans\n- Available in Claude Code\n- Available through the Claude API as `claude-sonnet-5`\n- Introductory API price: **$2 input / $10 output per 1M tokens** through August 31\n- Standard price after that: **$3 input / $15 output per 1M tokens**\n\nAnthropic reports **63.2% on SWE-bench Pro** and **80.4% on Terminal-Bench 2.1**.\n\nFor AV teams, the relevance is mostly around workflow support: scripts, file organization, metadata cleanup, QA passes, SharePoint packaging, publishing workflows, and small internal tools.\n\n**Source:** [Anthropic](https://www.anthropic.com/news/claude-sonnet-5) \u00b7 June 30, 2026\n\n### Runway Expands Its Bertelsmann Partnership\n\nRunway announced a creative partnership with **Bertelsmann** on July 1.\n\nThe agreement brings Runway models into Bertelsmann businesses including RTL Group, BMG, and Bertelsmann Marketing Services. Runway says the relationship began through the Bertelsmann AI Hub in 2024 and is now expanding into broader creative workflow development.\n\nThe important pattern: AI video tools are moving from individual browser experiments into operational media workflows.\n\n**Source:** [Runway](https://runwayml.com/news/runway-announces-creative-partnership-with-bertelsmann) \u00b7 July 1, 2026\n\n### Adobe's Topaz Deal Highlights AI Enhancement\n\nLate last week, Adobe announced a definitive agreement to acquire **Topaz Labs**.\n\nTopaz is known for AI image and video enhancement: sharpening, denoising, restoring, upscaling, and improving existing footage or images.\n\nAdobe says Topaz technology will come into Firefly, Firefly Services, and Creative Cloud apps, while Topaz products will continue as standalone offerings. Adobe also highlighted Topaz's **Neurostream** technology for running large image and video models locally on consumer hardware.\n\nThe useful reminder: AI production is not only generation. Finishing, restoration, and enhancement are becoming part of the same tool stack.\n\n**Source:** [Adobe](https://news.adobe.com/news/2026/06/adobe-to-acquire-topaz-labs) \u00b7 [TechCrunch](https://techcrunch.com/2026/06/25/adobe-acquires-image-and-video-enhancement-tool-maker-topaz-labs/) \u00b7 June 25, 2026\n\n---\n\n## Quick Hits\n\n- **Seedance 2.5 moved into early-access coverage.** Since we covered the preview last week, the main update is workflow positioning: longer clips, more references, region-level editing, and native audio-video generation.\n- **LTX 2.3 keeps pushing open audio-video generation.** LTX emphasizes synchronized audio-video output, cleaner audio, native portrait output, and audio-to-video workflows. Older LTX 2.0 LoRAs need retraining because the latent space changed.\n- **Video leaderboards remain task-dependent.** Artificial Analysis shows Seedance 2.0 leading among text-to-video models with audio output, but different rankings weigh Veo, Kling, HappyHorse, and Runway differently.\n\n---\n\n## Common Threads\n\n### Video Is Becoming Editable After Generation\n\nVeo 3.1 in Flow, Seedance 2.5's region-level editing, Runway's workflow partnerships, and LTX's retake/extend-style tooling all point toward the same direction: generation is becoming only the first step.\n\n### Audio Is Becoming Part of the Video Model\n\nGoogle is adding audio across more Flow modes. LTX continues to emphasize synchronized audio-video generation. Seedance is also framed around native audio-video output. The old pattern of silent clips first and sound later is starting to change.\n\n### Enterprise AI Is About Workflow Fit\n\nRunway with Bertelsmann, Adobe with Topaz, and Google through Vertex AI all show the same pattern. The tool has to fit into production, review, enhancement, and deployment workflows.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 6: Use Checklists as Guardrails\n\nWhen asking AI to revise, summarize, or review something, give it a checklist first.\n\nExample:\n\n```text\nBefore you revise, use this checklist:\n\n- Preserve all names, dates, and timecodes.\n- Keep technical terms unchanged unless they are clearly wrong.\n- Remove repeated ideas.\n- Make the wording clearer and shorter.\n- Do not add new claims.\n- Flag anything uncertain instead of guessing.\n\nAfter the revision, show:\n- Revised version\n- Checklist results\n- Items that need human review\n```\n\nFor AV work, this helps with edit notes, equipment summaries, captions, SharePoint copy, scripts, documentation, asset lists, and QA passes.\n\nThe small habit: before asking AI to improve something, tell it how you will judge the result.\n\nNext week: **Give It Examples Before You Ask for Output**.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
