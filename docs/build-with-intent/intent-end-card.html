<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build with Intent.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Film grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    mix-blend-mode: overlay;
  }

  .end-card {
    text-align: center;
    position: relative;
    z-index: 1;
    user-select: none;
  }

  /* Warm glow behind the lockup */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 420px;
    height: 160px;
    background: radial-gradient(ellipse, rgba(255, 235, 210, 0.06) 0%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  .glow.visible {
    animation: breathe 3.5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }

  .tagline {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0;
    line-height: 1;
  }

  .build-with {
    font-size: clamp(28px, 5vw, 64px);
    font-weight: 600;
    color: rgba(255, 255, 255, 0.92);
    letter-spacing: 0.04em;
    text-transform: lowercase;
    opacity: 0;
    margin-right: 0.3em;
  }

  .build-with.visible {
    animation: fadeIn 1s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .intent-word {
    display: inline-flex;
    font-size: clamp(28px, 5vw, 64px);
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .intent-word .letter {
    display: inline-block;
    color: rgba(255, 248, 240, 0.95);
    opacity: 0;
    min-width: 0.05em;
    text-align: center;
  }

  .intent-word .letter.cycling {
    opacity: 1;
    color: rgba(255, 255, 255, 0.4);
  }

  .intent-word .letter.settled {
    opacity: 1;
    color: rgba(255, 248, 240, 0.95);
  }

  .intent-word .period {
    color: rgba(255, 248, 240, 0.95);
    opacity: 0;
  }

  .intent-word .period.visible {
    animation: fadeIn 0.3s ease forwards;
  }

  .url {
    font-size: clamp(11px, 1.6vw, 18px);
    font-weight: 300;
    color: rgba(255, 255, 255, 0.28);
    letter-spacing: 0.14em;
    margin-top: clamp(20px, 3vw, 48px);
    opacity: 0;
  }

  .url.visible {
    animation: urlFade 1.2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes urlFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Animate grain position for liveliness */
  @keyframes grainDrift {
    0% { background-position: 0 0; }
    100% { background-position: 128px 128px; }
  }

  body::after {
    animation: grainDrift 0.8s steps(4) infinite;
  }
</style>
</head>
<body>

<div class="end-card">
  <div class="glow" id="glow"></div>
  <div class="tagline">
    <span class="build-with" id="buildWith">build with</span>
    <span class="intent-word" id="intentWord"></span>
  </div>
  <div class="url" id="url">intent.augmentcode.com</div>
</div>

<script>
(function () {
  const INTENT = 'Intent';
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  const CYCLE_INTERVAL = 60;
  const CYCLES_PER_LETTER = 5;
  const STAGGER_DELAY = 120;

  const container = document.getElementById('intentWord');
  const buildWith = document.getElementById('buildWith');
  const glow = document.getElementById('glow');
  const url = document.getElementById('url');

  const letterEls = [];
  for (let i = 0; i < INTENT.length; i++) {
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = '\u00A0';
    span.dataset.target = INTENT[i];
    span.dataset.index = i;
    container.appendChild(span);
    letterEls.push(span);
  }

  const period = document.createElement('span');
  period.className = 'letter period';
  period.textContent = '.';
  container.appendChild(period);

  function randomChar() {
    return CHARS[Math.floor(Math.random() * CHARS.length)];
  }

  function animateLetters() {
    let settledCount = 0;

    letterEls.forEach((el, i) => {
      const startDelay = i * STAGGER_DELAY;
      const totalCycles = CYCLES_PER_LETTER + Math.floor(Math.random() * 3);
      let cycleCount = 0;
      let started = false;
      let settled = false;
      let lastCycleTime = 0;

      function tick(timestamp) {
        if (!started) {
          started = true;
          lastCycleTime = timestamp;
          el.classList.add('cycling');
        }

        if (settled) return;

        if (timestamp - lastCycleTime >= CYCLE_INTERVAL) {
          lastCycleTime = timestamp;
          cycleCount++;

          if (cycleCount >= totalCycles) {
            el.textContent = el.dataset.target;
            el.classList.remove('cycling');
            el.classList.add('settled');
            settled = true;
            settledCount++;
            if (settledCount === letterEls.length) {
              period.classList.add('visible');
              setTimeout(() => glow.classList.add('visible'), 200);
            }
            return;
          }

          el.textContent = randomChar();
        }

        requestAnimationFrame(tick);
      }

      setTimeout(() => requestAnimationFrame(tick), startDelay);
    });
  }

  // Phase 1: "Build with" fades in at 0.8s
  setTimeout(() => {
    buildWith.classList.add('visible');
  }, 800);

  // Phase 2: Letter cycling starts at 1.5s
  setTimeout(() => {
    animateLetters();
  }, 1500);

  // Phase 4: URL fades in at 4.5s
  setTimeout(() => {
    url.classList.add('visible');
  }, 4500);
})();
</script>
</body>
</html>
