    initEditionApp(document.getElementById("editionApp"), {
      slug: "2026-11-09",
      editionTitle: "Week of November 9, 2026",
      editionMd: "# Monday Signal \u2014 Week of November 9, 2026\n\n> **The midterms carried a record $11.87 billion in political ads by AdImpact's final count, as The Current reported Wednesday, November 4, with connected TV ahead of cable for the first time in a midterm and Wesleyan Media Project counting more than $187 million behind AI-made ads.** OpenAI pledged to \"pay the full cost of the electricity we use\" as AI stocks sold off over the data-center build-out; Meta paused its new business terms, and a S\u00e3o Paulo court barred it from using Brazilian journalism without authorization; AI Mode added home-services booking and a fourth ad was sighted under one answer; Shopify, HubSpot and Snap talked AI discovery on their calls; AppLovin's quarter topped five ad tech rivals combined; and the Times and three Tribune papers sued Brave. On the feed, John Lewis's Christmas ad drew scorn on X and 5.6 stars from System1, whose Andrew Tindall said marketers are not the customer; a working paper argued \"ChatGPT's ads don't pay\" as OpenAI swapped bid caps for targets; and more than 6 million of Facebook's AI-written answer pages turned up in Google's index.\n\n---\n\n## The Conversation\n\n### John Lewis's Christmas ad drew scorn on X and 5.6 stars from System1, and Dior had to explain its \"all hand-drawn\" film\n\nJohn Lewis premiered \"Gloria and Pickles,\" its 20th Christmas ad, on Tuesday, November 3. The same day Sarah Vine called its children \"Spoilt, entitled, rude and overindulged,\" and Piers Morgan called it \"possibly the worst advert I've ever seen for anything\" (on X, as quoted by the Mirror; we didn't locate the posts). Carma's social listening put sentiment at 77% negative (DecisionMarketing). System1, which tests UK TV ads on a nationally representative sample, gave it 5.6 stars, John Lewis's best since 2019 (LBB), and on Wednesday System1's Andrew Tindall posted that \"10% reacted negatively but only 6% felt real contempt. But 69% loved it.\"\n\nDior launched \"Christian Dior's Night in Color,\" a six-minute film by Sylvain Chomet, on Wednesday with Jonathan Anderson's statement that it \"is all hand-drawn using techniques that go back to the 1940s\" (WWD). By Thursday, posts on X were accusing it of AI, and on Saturday producer Aton Soumache told Variety, \"We used an automated interpolation system for a very small part of the process, but the film itself is traditional 2D animation.\" Neither filmmaker named the software (Cartoon Brew), and we found no statement from Dior. Very had disclosed a \"hybrid CGI and AI-assisted production process\" in its November 2 release; its ad scored 5.9 stars on System1 (per MSQ) and drew no backlash we could find.\n\n**Comment window:** open through the rest of the Christmas launch season. Very disclosed AI assistance on day one; Dior's launch materials were \"explicit in describing the film as hand-drawn\" (Cartoon Brew), and the interpolation answer came three days later. Put a line in the press kit saying what was drawn, shot, generated or automated, and read a representative panel before the replies.\n\n**Source:** [John Lewis Partnership](https://www.johnlewispartnership.co.uk/media-centre/latest-news/2026/23969) \u00b7 [Tindall's post](https://www.linkedin.com/posts/andrew-tindall_advertising-marketing-activity-7523767013614194688-emRP) \u00b7 [Mirror](https://www.mirror.co.uk/tv/tv-news/john-lewis-christmas-advert-2026-37840071) \u00b7 [DecisionMarketing](https://www.decisionmarketing.co.uk/reviews/john-lewis-gloria-and-pickles-bigmouth-strikes-again) \u00b7 [LBB](https://lbbonline.com/news/system1-john-lewis-christmas-advert-scores-5-6-stars-its-highest-rating-since-excitable-edgar-in-2019) \u00b7 [WWD](https://wwd.com/fashion-news/designer-luxury/dior-holiday-campaign-animated-short-film-sylvain-chomet-1239398306/) \u00b7 [Variety](https://variety.com/2026/film/global/sylvain-chomet-denies-ai-accusations-dior-robert-pattinson-1236941945/) \u00b7 [Cartoon Brew](https://www.cartoonbrew.com/artificial-intelligence/sylvain-chomet-dior-ad-automated-interpolation-269167.html) \u00b7 [The Very Group](https://www.theverygroup.com/media/news/2026/new-flamingo-family-leads-verys-christmas-creative/) \u00b7 [MSQ's post](https://www.linkedin.com/posts/msq-partners_msqintelligence-activity-7523317649305432064-LRF6) \u00b7 November 2\u20137, 2026\n\n### A working paper says \"ChatGPT's ads don't pay,\" and OpenAI swaps bid caps for targets on November 9\n\nOn Monday, November 2, Christian Schulze of Frankfurt School opened a LinkedIn post with \"ChatGPT's ads don't pay, and fixing them could cost ChatGPT its users.\" His working paper with Maximilian Kaiser (October, under review) uses Grips Intelligence data on 1,898 online shops, with the ad-free EU as the control; Kaiser advises Grips, as the paper discloses. In US traffic, \"a paid ChatGPT visit generates $0.89 in revenue per session against $2.45 for a paid Google Search visit, a 64% shortfall.\" To return as much per dollar as a search click, a ChatGPT click would have to cost $0.26; \"the largest publicly known account\" paid $1.72, and OpenAI recommends starting bids of $3 to $5. Of 87 US advertisers buying both channels, 73 recorded no paid ChatGPT sale, and one advertiser accounts for 66% of paid ChatGPT purchases. Organic ChatGPT referrals fell an estimated 6 to 8% with ads on, a result that isn't statistically settled (p = .103).\n\nThat night OpenAI's Adam Fry told a press dinner that ChatGPT's \"volume of search-like queries is now roughly one-fifth the volume of queries of Google\" (Big Technology), counting every prompt that triggers a web search, and, per The Verge, that \"most people do not seem to mind ads in the product.\" Ahrefs' tracker puts ChatGPT at 0.36% of referral traffic (via SEJ). By Friday, OpenAI had emailed advertisers (via SER) that new campaigns get Target CPA and Target CPC from November 9 in place of Max Bid and Max CPC, which retire January 1, 2027. Its help page says, \"While Max CPC caps individual bids, Target CPC lets our system bid above or below your target in individual auctions\". We found no OpenAI reply to the paper.\n\n**Comment window:** open now, with existing caps retiring January 1. Set the target from your own revenue per paid ChatGPT session against your search revenue per click (the paper's parity method), keep one Max CPC campaign as the comparison, and judge it on incrementality; as Olivia Kory commented on Schulze's post, \"Last-click revenue isn't incremental revenue...\"\n\n*Editor's note, added at publication on November 9: OpenAI published a VistaPrint case study reporting \"5.9x return on ad spend\" and \"~90% lower cost per attributed order\" for one US conversion-optimized campaign (July 8\u2013August 4), based on VistaPrint-reported, platform-attributed sales. [OpenAI](https://openai.com/ads/customers/vistaprint/)*\n\n**Source:** [Schulze's post](https://www.linkedin.com/posts/prof-schulze_chatgpt-aiadvertising-ecommerce-activity-7522957998072221696-F4_e) \u00b7 [The working paper (PDF)](https://ecommerceresearch.org/chatgpt-ads/Kaiser-Schulze-2026-Can-Advertising-Fund-Free-AI.pdf) \u00b7 [Big Technology](https://www.bigtechnology.com/p/openai-chatgpt-search-is-about-20) \u00b7 [The Verge](https://www.theverge.com/ai-artificial-intelligence/1025482/openai-says-chatgpt-is-catching-up-to-google-in-search) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/googles-search-volume-is-about-5x-chatgpts-openai-says/595817/) \u00b7 [OpenAI's email, via Search Engine Roundtable](https://www.seroundtable.com/openai-updates-chatgpt-ads-bidding-options-42470.html) \u00b7 [OpenAI Help](https://help.openai.com/en/articles/20001634-bidding-strategies-and-how-pricing-works-in-chatgpt-ads) \u00b7 November 2\u20136, 2026\n\n### Google has indexed more than 6 million of Facebook's AI-written \"Answers\" pages\n\nOn Wednesday, November 4, Saul Westbrook of Peripheral Creative wrote that \"Meta had quietly indexed millions of AI-generated Facebook pages under the url facebook.com/fb-answers/, and they were appearing frequently on Google,\" which he first noticed in June. By his Semrush estimates, the directory drew 40,590,906 visits in October, up from 12,167,857 in August. He also found that \"LLMs are blocked from crawling these pages,\" and bediscoverable reads Facebook's robots.txt as admitting Googlebot and Bingbot and blocking GPTBot, ClaudeBot and PerplexityBot.\n\nOn Thursday, Glenn Gabe posted on X that \"there are 6M+ urls indexed there\" and that the directory ranks \"across surfaces (10-blue links, AIOs, and AI Mode),\" calling it \"another example of massive 'Scaled content abuse'\" (embedded by SER; we didn't locate the posts). His figure counts indexed pages, and the traffic figures are Semrush estimates, not Meta's data. Scaled content abuse is one of Google's spam policies, but Google hasn't said whether these pages break it, and neither company has commented.\n\n**Comment window:** open until Google or Meta responds. Search facebook.com/fb-answers/ for your brand and log what the pages say, since they can surface in AI Overviews and AI Mode.\n\n**Source:** [Peripheral Creative](https://www.peripheralcreative.com/news/facebook-answers-ai-generated-pages) \u00b7 [Gabe's posts, via Search Engine Roundtable](https://www.seroundtable.com/facebook-answers-google-42467.html) \u00b7 [bediscoverable](https://bediscoverable.ai/resources/facebook-answers-ai-pages) \u00b7 November 4\u20135, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and stages where the week's arguments actually happened.\n\n- **Andrew Tindall, System1** (LinkedIn, November 4): \"The John Lewis Christmas ad and its 'backlash' brilliantly demonstrate how marketers still haven't learned the number 1 rule of marketing: you are not the customer\" [The post](https://www.linkedin.com/posts/andrew-tindall_advertising-marketing-activity-7523767013614194688-emRP)\n- **Christian Schulze, Frankfurt School of Finance & Management** (LinkedIn, November 2): \"More advertisers and more ads cannot realistically close the gap: each click has to become worth far more.\" [The post](https://www.linkedin.com/posts/prof-schulze_chatgpt-aiadvertising-ecommerce-activity-7522957998072221696-F4_e)\n- **Adam Fry, ChatGPT consumer product lead, OpenAI** (OpenAI press dinner, New York, November 2, as quoted by The Verge): \"Ads have maybe shown us that we could be doing this more, actually\" [The Verge](https://www.theverge.com/ai-artificial-intelligence/1025482/openai-says-chatgpt-is-catching-up-to-google-in-search)\n- **Erika Franklin Fowler, co-director, Wesleyan Media Project** (*On Point*, \"How AI deepfakes are upending political advertising,\" November 6): \"There's no federal regulation of AI in advertising, so what we have instead is a patchwork of state laws that apply to mostly state candidates across the country.\" [The episode](https://www.wbur.org/onpoint/2026/11/06/deepfakes-political-advertising-midterms)\n- **Maya Hutchinson, founder and CEO, BattlegroundAI** (same episode): \"I think labeling everything as AI then doesn't tell you anything about the content or the context of the advertising itself.\" [The episode](https://www.wbur.org/onpoint/2026/11/06/deepfakes-political-advertising-midterms)\n- **Robby Stein, VP of product, Google Search** (X, November 4): \"Today, we're making it even easier to research & book home services with direct links in AI Mode through partners like @angi_home @thumbtack @housecall & @GetJobber (and @ServiceTitan coming soon). It's available now in the U.S.\" [The post](https://x.com/rmstein/status/2118027605018632408)\n- **Saul Westbrook, Peripheral Creative** (Peripheral Creative's site, November 4): \"There seems to have been no editorial oversight for this content.\" [The post](https://www.peripheralcreative.com/news/facebook-answers-ai-generated-pages)\n- **Evan Spiegel, CEO, Snap** (Q3 earnings call, November 4): \"Certainly, 4% ad growth is below our ambitions.\" [Call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/snap-inc-snap-q3-2026-earnings-call-transcript/)\n- **Harley Finkelstein, President, Shopify** (Q3 earnings call, November 3): \"Q3 was the first time we saw shoppers experimenting with delegated purchasing through personal agents, who can also act on behalf of their users with their permission.\" [Call transcript](https://stockanalysis.com/stocks/shop/transcripts/725032-q3-2026/)\n- **Yamini Rangan, CEO, HubSpot** (Q3 earnings call, November 4): \"Inbound demand remains under pressure, and we are diversifying to new sources of demand through intent-based marketing, LLM connectors and AEO.\" [Call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/hubspot-hubs-q3-2026-earnings-call-transcript/)\n\n---\n\n## This Week in Marketing AI\n\n### Midterm political ads set a record $11.87 billion, and most AI-made ads ran without a disclaimer\n\nAdImpact's final tally, as The Current reported on Wednesday, November 4, was $11.87 billion, above 2024's $11.2 billion presidential-year total, with connected TV at about 22% ($2.6 billion); we didn't find AdImpact's own release. Adweek reported CTV ahead of cable for the first time in a midterm. On Magnite's call that evening, CEO Michael Barrett put political contribution ex-TAC at \"over $40 million for 2026 versus the $15 million previously projected,\" which \"is more than double the last presidential election and nearly 4x the last midterm cycle,\" and the release puts it \"mostly in CTV.\"\n\nWesleyan Media Project's October 29 count, as USA Today reported it, found 289 AI-generated political ads with more than $187 million behind them, and only 27% carried disclaimers through mid-October. CNBC counts about 30 states with laws on AI in political ads and no federal law. YouTube's rule, as CNBC quotes it, requires disclosure \"when an election ad contains synthetic or digitally altered people or events,\" and CNBC's examples include AI videos posted organically on YouTube and X, outside the ad rules, one \"with a three-second disclosure flashing in the middle.\"\n\nCNBC also counted 41 data-center ballot measures in 10 states. After the election, AI and semiconductor stocks \"sold off sharply\" on Thursday, November 5, as investors \"reassessed the data center build-out\" (CNBC); in a Wednesday note, Barclays' Dominique Toublan wrote that \"AI pushback is bipartisan but local, making the buildout pricier rather than stalling it\". On Thursday, OpenAI's \"National Community Compact\" said, \"We'll pay the full cost of the electricity we use and the infrastructure needed to serve us,\" and Reuters reported, citing potential investors, that the AI backlash could threaten the timing of Anthropic's IPO.\n\n**Source:** [The Current](https://www.thecurrent.com/media/political-ad-spending-record-2026-ctv) \u00b7 [Adweek](https://www.adweek.com/convergent-tv/ctv-overtakes-cable-in-political-ad-spend-for-the-first-time-in-a-midterm/) \u00b7 [Magnite's call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/magnite-mgni-q3-2026-earnings-call-transcript/) \u00b7 [Magnite's release](https://investor.magnite.com/news-releases/news-release-details/magnite-reports-third-quarter-2026-results) \u00b7 [USA Today](https://www.usatoday.com/story/news/politics/elections/2026/10/30/slopaganda-ai-campaign-ads-skyrocket-2026/92368828007/) \u00b7 [CNBC on AI ads](https://www.cnbc.com/2026/11/03/ai-generated-slopaganda-in-political-ads-puts-platforms-on-alert.html) \u00b7 [CNBC on ballot measures](https://www.cnbc.com/2026/11/04/data-center-ballot-measures-2026-midterm.html) \u00b7 [CNBC on the selloff](https://www.cnbc.com/2026/11/06/ai-data-center-midterms-selloff.html) \u00b7 [OpenAI](https://openai.com/index/setting-new-standard-responsible-ai-infrastructure) \u00b7 [Reuters, via StreetInsider](https://www.streetinsider.com/Reuters/Exclusive-AI+backlash+could+threaten+Anthropic+IPO+timing%2C+potential+investors+say/27302044.html) \u00b7 October 29\u2013November 6, 2026\n\n### Meta paused its new business terms, and a S\u00e3o Paulo court barred it from using Brazilian journalism without authorization\n\nWe've followed the terms since our October 19 lead. On Thursday, November 5, a Meta Business Help Center notice, as quoted by Nieman Lab, said the updates to its Commercial Terms, Product Catalog Terms, Self-Serve Ad Terms and Ad Creative Generative AI Terms \"are now paused and will not take effect on November 20, 2026,\" that Meta \"will provide a further update when we have more to share,\" and that \"In the meantime, our existing terms remain in effect.\" A spokesperson said Meta is \"pausing the changes as we continue to engage with stakeholders and take our time to get this right.\" The notice names no stakeholders and no new date, and Meta took down its preview of the new terms (Nieman Lab). The November 20 deadline in our October 26 angle no longer applies.\n\nOn Tuesday, November 3, Judge Guilherme Madeira Dezem of S\u00e3o Paulo's 44th Civil Court granted the Brazilian media associations ANJ, ABERT and ANER an injunction barring Meta from using journalistic content without authorization, with a fine of R$1 million a day capped at R$100 million. The order is preliminary and was issued without hearing Meta. In AFP's translation, the judge wrote, \"Imposing on media outlets the free and universal surrender of their copyrighted works as a toll for remaining connected to the channels ... constitutes a manifest abuse of rights\". Norway's interim order (October 28) and the CMA's investigation (October 30) still stand.\n\n**Source:** [Nieman Lab](https://www.niemanlab.org/2026/11/meta-pulls-down-controversial-terms-of-service/) \u00b7 [ANJ, ABERT and ANER (PDF)](https://aner.org.br/wp-content/uploads/2026/11/ANJ-ABERT-e-ANER-liminar-versao-final.pdf) \u00b7 [Straits Times (AFP)](https://www.straitstimes.com/world/court-orders-meta-to-halt-training-on-brazilian-media-content) \u00b7 November 3\u20135, 2026\n\n### AI Mode added home-services booking, and Performance Max may hand brand queries back to Search\n\nGoogle's Robby Stein announced on Wednesday, November 4, that AI Mode now has direct links for researching and booking home services through Angi, Thumbtack, Housecall Pro and Jobber, with ServiceTitan coming soon, in the US only. Jobber's help page says its customers pay no lead fees and must be on paid US subscriptions, and Housecall Pro's Roland Ligtenberg wrote, \"One request, one Pro, no lead fee, no bidding war.\" Those are the partners' terms for their customers; Google's terms with the partners weren't disclosed. The links are organic partner integrations, not ads; homepros reports that contractors needn't be partners to appear, and Google hasn't said how providers are chosen or ranked.\n\nSearch Engine Roundtable reported Wednesday that an \"AI SEO\" query showed four sponsored results under an AI Mode answer, first seen in a screenshot Sachin Patel shared on November 2. Adriaan Dekker wrote on LinkedIn (quoted by SER), \"This looks like a test.\" Google hasn't commented, so treat it as one sighting of a possible test.\n\nGoogle's help page on how Performance Max interacts with other campaigns now says, as SER reproduces it, that \"Performance Max campaigns may also filter out navigational or brand-specific search queries to prioritize serving them through dedicated Search campaigns.\" It tells advertisers to give brand Search campaigns \"sufficient budget and high-quality, eligible ads\" and to consider \"adding Search Themes to the Performance Max campaign.\" PPC News Feed (credited to Hana Kobzov\u00e1) spotted the paragraph Monday and SER reported it Tuesday. It wasn't in the archived page, carries no date, and doesn't define a brand query or say what happens in accounts without a brand Search campaign.\n\n**Source:** [Stein on X](https://x.com/rmstein/status/2118027605018632408) \u00b7 [Jobber Help](https://help.getjobber.com/en/articles/jobber-and-google-ai-mode-integration/) \u00b7 [Housecall Pro](https://www.housecallpro.com/resources/housecall-pro-google-ai-mode-integration/) \u00b7 [homepros](https://homepros.news/google-adds-home-services-booking-to-ai-mode/) \u00b7 [SER on the fourth ad](https://www.seroundtable.com/google-ai-mode-four-ads-42443.html) \u00b7 [SER on the Performance Max text](https://www.seroundtable.com/google-ads-pmax-brand-queries-42438.html) \u00b7 November 2\u20136, 2026\n\n### Shopify said AI-attributed orders grew 3.3x, HubSpot said AI is changing how customers find it, and Snap's ad revenue grew 4%\n\nOn Shopify's call on Tuesday, November 3, President Harley Finkelstein said, \"AI traffic is up 2.6x year-over-year. Orders are growing even faster at 3.3x,\" while noting \"the volume is still small here.\" The attribution is Shopify's, and its \"converting 64% more often\" compares AI shoppers with organic search. Through Claude Duet, Instinct and Grok Bot, he said, \"Shoppers can now use Shop Pay as their chosen wallet for any merchant, no extra setup required.\" Revenue grew 32%.\n\nOn Wednesday, HubSpot CEO Yamini Rangan said in prepared remarks, \"AI is changing how customers discover HubSpot and how they make purchasing decisions.\" Revenue rose 17% to $947.6 million, net revenue retention slipped about a point to 101%, and CFO Kate Bueker said, \"We now expect net new ARR to decline year-over-year in fiscal 2026.\" HubSpot sells AEO tools itself.\n\nSnap's revenue rose 14% to $1.72 billion that evening, and CFO Doug Hott's prepared remarks say, \"Advertising Revenue grew 4% and Other Revenue grew 84%, led by Snapchat+, Memories Storage, and Lens+.\" On the call, CEO Evan Spiegel said, \"But the upper funnel brand advertising did decline year-over-year, and that weighed on the overall results.\" From Q1 2027, global MAU becomes Snap's \"primary audience metric.\"\n\n**Source:** [Shopify call transcript (Stock Analysis)](https://stockanalysis.com/stocks/shop/transcripts/725032-q3-2026/) \u00b7 [HubSpot's release](https://hubspot.gcs-web.com/news-releases/news-release-details/hubspot-reports-q3-2026-results) \u00b7 [HubSpot call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/hubspot-hubs-q3-2026-earnings-call-transcript/) \u00b7 [Snap's prepared remarks](https://www.sec.gov/Archives/edgar/data/1564408/000156440826000063/snapincq32026preparedrem.htm) \u00b7 [Snap call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/snap-inc-snap-q3-2026-earnings-call-transcript/) \u00b7 November 3\u20134, 2026\n\n### AppLovin's $2.18 billion quarter topped five ad tech rivals combined\n\nOn Wednesday, November 4, AppLovin reported record revenue of $2.18 billion (up 55%) and net income of $1.44 billion (up 72%, per CFO Matt Stumpf on the call), and it guided Q4 revenue to $2.365\u20132.395 billion. On Friday, Digiday's Ronan Shields tallied that AppLovin's quarter exceeded the combined revenue of Unity, Taboola, Teads, Criteo and Magnite, about $1.94 billion. Unity grew 32% to $622 million in its first profitable quarter since its IPO, Taboola's revenue fell 6.9%, and Teads fell 26% to $235.1 million, citing \"continued weakness in open-internet advertising,\" with no guidance.\n\nCriteo's revenue fell 11% to $416 million, with retail media down 23% on \"a $20 million headwind from previously communicated scope changes with two specific Retail Media clients.\" Its release says Criteo became \"OpenAI's first advertising technology partner in March 2026\" and is \"working to bring sponsored products into AI-powered conversational search with THG Ingenuity.\" Magnite's contribution ex-TAC rose 20% to $200.6 million (revenue rose 14%), with CTV up 39% and now 53% of the total. Asked about pressure on open-web referral and search traffic, Barrett said, \"The numbers would be much stronger if it were more of a search generated traffic world as opposed to answer engines.\" The Trade Desk reports Monday, November 9, after the close.\n\n**Source:** [AppLovin's release](https://www.businesswire.com/news/home/20261104553587/en/AppLovin-Announces-Third-Quarter-2026-Financial-Results) \u00b7 [AppLovin call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/applovin-app-q3-2026-earnings-call-transcript/) \u00b7 [Digiday](https://digiday.com/media/by-the-numbers-ad-techs-widening-divide-as-applovin-surges-and-rivals-struggle-in-q3/) \u00b7 [Criteo's release (EX-99.1)](https://www.sec.gov/Archives/edgar/data/1576427/000162828026069790/exhibit991-8xkq32026.htm) \u00b7 [Magnite's release](https://investor.magnite.com/news-releases/news-release-details/magnite-reports-third-quarter-2026-results) \u00b7 [Magnite call transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/magnite-mgni-q3-2026-earnings-call-transcript/) \u00b7 November 4\u20136, 2026\n\n### The New York Times and three Tribune papers sued Brave over its ad replacement and AI search API\n\nOn Monday, November 2, The New York Times (No. 26-cv-9549) and the Chicago Tribune, New York Daily News and Orlando Sentinel (No. 26-cv-9554) filed separate complaints against Brave in the Southern District of New York, both through Rothwell Figg. The Tribune papers' complaint says, \"The Brave Browser also includes built-in ad-blocking features that remove paid advertisements from the Publishers' websites and show users Brave's own ads instead,\" and alleges that \"Brave is the supplier, dealer, and distributor of stolen copyrighted content for its own users and many of the most prominent GenAI companies, including Anthropic, Perplexity, Mistral, xAI, and Cohere.\" It says Brave \"reported 10 active ad campaigns underway in New York State\" as of October 30. Ars Technica reports that the Times wants Brave to shut down its paywall blocker and end its deals with AI firms. These are allegations, and we didn't find a response from Brave.\n\n**Source:** [Tribune papers' complaint (PDF, via TheWrap)](https://www.thewrap.com/wp-content/uploads/2026/11/Pleading-26-cv-9554-Dkt.-1-Complaint.pdf) \u00b7 [The Times' complaint (PDF)](https://nytco-assets.nytimes.com/2026/11/new-york-times-brave-complaint-11-2-26.pdf) \u00b7 [Ars Technica](https://arstechnica.com/tech-policy/2026/11/nyt-demands-brave-shut-down-its-paywall-blocker-and-end-deals-with-ai-firms/) \u00b7 November 2\u20133, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via Search Engine Roundtable's daily recaps for [November 2](https://www.seroundtable.com/recap-11-02-2026-42434.html), [3](https://www.seroundtable.com/recap-11-03-2026-42442.html), [4](https://www.seroundtable.com/recap-11-04-2026-42452.html), [5](https://www.seroundtable.com/recap-11-05-2026-42466.html) and [6](https://www.seroundtable.com/recap-11-06-2026-42474.html) and its [weekly video recap](https://www.seroundtable.com/video-11-06-2026-42469.html), Lift Conversions' [The Lift Brief](https://liftconversions.com/the-lift-brief-this-week-in-ai-search-and-marketing-october-30-to-november-6-2026/), and [getlooploop's weekly](https://www.getlooploop.com/news/one-robots-txt-rule-against-ai-training-and-brand-ai-overviews-move-aside).*\n\n- **Google's visible AI labels on ads now cover California, South Korea and Vietnam.** Google Ads Help lists six places, with the EU, India and New York, where in targeted campaigns \"ads with assets that you designate as AI created or edited will also include visible overlays,\" and says labels Google applies itself \"cannot be overwritten.\" The page gives no effective date and says the setting \"doesn't guarantee your compliance with specific regulations\"; SER reported the change Thursday. [Google Ads Help](https://support.google.com/google-ads/answer/17140115?hl=en) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-ads-expands-ai-content-label-disclosure-42461.html)\n- **Search Console's click spike** (October 31\u2013November 3). Glenn Gabe posted, \"Sure seems like AI agents or bots that are researching products or services,\" and on Wednesday Joy Hawkins posted, \"Today it's back to normal\" (both on X, via SER). Google hasn't named a cause. [Search Engine Roundtable](https://www.seroundtable.com/google-performance-reports-spike-clicks-42448.html)\n- **Google Ads \"strategists\" with AI-generated faces.** Joe Youngblood posted on X (via SER, Monday) that \"Google is using AI-generated people for Google Ads contacts,\" citing one rep whose photo Google's own checker flagged as AI. It's one advertiser's example, and Google didn't comment. [Search Engine Roundtable](https://www.seroundtable.com/google-ads-strategist-ai-fake-names-photos-42426.html)\n- **Microsoft Clarity counts agent traffic.** Clarity added agentic analytics on Wednesday and says \"weekly sessions from AI agents nearly doubled in three weeks to almost 2 million\" in its own sample (5.23 million agentic sessions across 230,511 projects, August 13\u2013September 9). [Microsoft Clarity](https://clarity.microsoft.com/blog/clarity-connects-agents-llms-people/)\n- **Amazon's shopping agent takes texts, with ads in the replies.** From Friday, \"a subset of customers can text Amazon's personal AI shopping agent\" (invite-only, US), and Digiday reports Sponsored Products ads in its replies, free to advertisers for now, while purchases the agent completes stay ad-free. On Wednesday, Attain said its purchase-based audiences, including off-Amazon purchases, now plug directly into Amazon DVA+. [About Amazon](https://www.aboutamazon.com/news/retail/alexa-for-shopping-text-to-shop) \u00b7 [Digiday](https://digiday.com/media-buying/amazons-shopping-agent-now-takes-orders-by-text-with-sponsored-product-ads-in-the-replies/) \u00b7 [Attain](https://www.attainoutcomes.com/news/attain-enhances-the-power-of-purchase-data-across-amazon-ads-dva-with-direct-audience-integration)\n- **Reddit tests ads in search results.** \"This is an initial test with a select group of eligible advertisers,\" Reddit said Tuesday, and TechCrunch tied it to Reddit's falling Google traffic (our November 2 conversation lead). The API progress update is due November 10, and RSS ends November 13. [Reddit](https://redditinc.com/news/we-are-testing-ad-placements-in-reddit-search-pages) \u00b7 [TechCrunch](https://techcrunch.com/2026/11/03/reddit-tests-ads-in-search-results-as-traffic-declines-and-growth-concerns-mount/)\n- **Amazon joins YouTube Shopping in the UK.** Amazon said Tuesday it is joining YouTube Shopping's UK affiliate program, per Retail Technology Innovation Hub. [Retail Technology Innovation Hub](https://www.retailtechinnovationhub.com/home/2026/11/3/uk-creators-assemble-amazon-says-it-is-coming-to-youtubes-shopping-affiliate-programme)\n- **Fox closed its $22 billion Roku deal** on Friday, \"well ahead of the expected 2027 date,\" per Variety. [Variety](https://variety.com/2026/tv/news/fox-closes-roku-acquisition-1236941275/)\n\n---\n\n## Common Threads\n\n### The week's arguments turned on which unit gets counted\n\nCarma counted social posts (77% negative) and System1 a representative panel (6% \"felt real contempt\"); Fry counted prompts that trigger a web search, and Ahrefs counts referral traffic. Clarity counts agent sessions, Semrush estimates visits, and Shopify's 3.3x counts orders it attributes to AI from a \"still small\" base, so label the unit before setting two figures side by side.\n\n### Google will label AI-made ad assets itself, and brands and campaigns split on disclosure\n\nGoogle says the AI labels it applies itself in six places \"cannot be overwritten,\" while only 27% of AI-made political ads carried disclaimers through mid-October. Very disclosed AI-assisted production up front and drew no backlash we found, while Dior's \"all hand-drawn\" needed a producer's explanation three days later.\n\n### Intermediaries moved closer to the purchase\n\nAI Mode books home services through four partners, Amazon's text agent carries Sponsored Products in its replies, and Shopify saw its first shoppers delegating purchases to personal agents. Reddit is testing ads in its own search, Criteo is \"working to bring sponsored products into AI-powered conversational search,\" and the Tribune papers allege that Brave shows \"Brave's own ads\" in place of publishers'.\n\n### AI's power costs and its ad revenue were in the news the same week\n\nVoters weighed 41 data-center measures, AI stocks sold off on Thursday, and OpenAI pledged to \"pay the full cost of the electricity we use.\" On revenue, Schulze's post says OpenAI's projections assume \"about $40 in ad revenue per free user by 2030\" against \"about $1\" today, and Barrett said answer engines are weighing on Magnite's numbers.\n\n---\n\n## Angles for the Week\n\n### Set ChatGPT's Target CPC from your own revenue per session\n\nFrom November 9, new ChatGPT campaigns bid to a target that OpenAI's system can go \"above or below\" in individual auctions, and Max CPC retires January 1, 2027. The how-to applies Kaiser and Schulze's parity method to your own revenue per session, sets the result beside OpenAI's $3\u20135 starting guidance, and keeps one capped campaign as the comparison. Window: November 9 to January 1, 2027.\n\n### Put the production method in the launch materials\n\nVery's release disclosed AI-assisted production on day one; Dior said \"all hand-drawn,\" and three days later its producer was explaining \"an automated interpolation system\" to Variety. The post argues for one line in every press kit saying what was drawn, shot, generated or automated, with Pennsylvania's AI-ad disclosure law starting December 21. Window: the rest of the Christmas launch season.\n\n### Find out where Google will label your ads as AI\n\nVisible overlays now apply to designated assets in campaigns targeting the EU, India, New York, California, South Korea and Vietnam, and assets from Google's \"fully-automated features\" may be labeled \"on your behalf.\" The explainer inventories which campaigns use auto-generated assets in those places and weighs labeling your own AI-edited assets first, with a note that it isn't legal advice. Window: now, since the page gives no effective date.\n\n### Fund brand Search before Performance Max hands brand queries back\n\nGoogle's help text says Performance Max \"may also filter out navigational or brand-specific search queries\" and tells advertisers to give brand Search campaigns \"sufficient budget and high-quality, eligible ads.\" The post compares brand impressions in each campaign before and after early November, since the text has no start date and doesn't define a brand query. Window: before Black Friday (November 27).\n\n### Read what Facebook's AI pages say about your brand\n\nGabe counts more than 6 million indexed fb-answers pages, ranking in AI Overviews and AI Mode too. The audit runs a site: search for your brand and top product questions, logs what the pages claim, and checks that your own pages answer the same questions. Window: until Google or Meta responds.\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [John Lewis Partnership \u2014 \"Gloria and Pickles\"](https://www.johnlewispartnership.co.uk/media-centre/latest-news/2026/23969) \u2014 November 3, 2026 \u2014 the premiere\n2. [Andrew Tindall \u2014 LinkedIn post](https://www.linkedin.com/posts/andrew-tindall_advertising-marketing-activity-7523767013614194688-emRP) \u2014 November 4, 2026 \u2014 System1's figures; Voices\n3. [The Very Group \u2014 Very's Christmas creative](https://www.theverygroup.com/media/news/2026/new-flamingo-family-leads-verys-christmas-creative/) \u2014 November 2, 2026 \u2014 the production disclosure\n4. [MSQ \u2014 LinkedIn post](https://www.linkedin.com/posts/msq-partners_msqintelligence-activity-75233176493054 mber 3, 2026 \u2014 the help text\n57. [Digiday \u2014 ad tech's widening divide](https://digiday.com/media/by-the-numbers-ad-techs-widening-divide-as-applovin-surges-and-rivals-struggle-in-q3/) \u2014 November 6, 2026 \u2014 the comparison\n58. [Ars Technica \u2014 NYT v. Brave](https://arstechnica.com/tech-policy/2026/11/nyt-demands-brave-shut-down-its-paywall-blocker-and-end-deals-with-ai-firms/) \u2014 November 3, 2026 \u2014 the Times' demands\n59. [Search Engine Roundtable \u2014 AI content labels expand](https://www.seroundtable.com/google-ads-expands-ai-content-label-disclosure-42461.html) \u2014 November 5, 2026 \u2014 the change\n60. [Search Engine Roundtable \u2014 Search Console click spikes](https://www.seroundtable.com/google-performance-reports-spike-clicks-42448.html) \u2014 November 4, 2026 \u2014 Gabe, Hawkins\n61. [Search Engine Roundtable \u2014 strategists with AI faces](https://www.seroundtable.com/google-ads-strategist-ai-fake-names-photos-42426.html) \u2014 November 2, 2026 \u2014 Youngblood\n62. [Digiday \u2014 Amazon's agent takes orders by text](https://digiday.com/media-buying/amazons-shopping-agent-now-takes-orders-by-text-with-sponsored-product-ads-in-the-replies/) \u2014 November 6, 2026 \u2014 ads in the replies\n63. [TechCrunch \u2014 Reddit tests ads in search](https://techcrunch.com/2026/11/03/reddit-tests-ads-in-search-results-as-traffic-declines-and-growth-concerns-mount/) \u2014 November 3, 2026 \u2014 the traffic link\n64. [Retail Technology Innovation Hub \u2014 Amazon and YouTube Shopping](https://www.retailtechinnovationhub.com/home/2026/11/3/uk-creators-assemble-amazon-says-it-is-coming-to-youtubes-shopping-affiliate-programme) \u2014 November 3, 2026 \u2014 the UK program\n65. [Variety \u2014 Fox closes Roku](https://variety.com/2026/tv/news/fox-closes-roku-acquisition-1236941275/) \u2014 November 6, 2026 \u2014 the close\n\n**Roundups consulted**\n\n66. [Search Engine Roundtable \u2014 daily recap, November 2](https://www.seroundtable.com/recap-11-02-2026-42434.html) \u2014 November 2, 2026 \u2014 discovery index\n67. [Search Engine Roundtable \u2014 daily recap, November 3](https://www.seroundtable.com/recap-11-03-2026-42442.html) \u2014 November 3, 2026 \u2014 discovery index\n68. [Search Engine Roundtable \u2014 daily recap, November 4](https://www.seroundtable.com/recap-11-04-2026-42452.html) \u2014 November 4, 2026 \u2014 discovery index\n69. [Search Engine Roundtable \u2014 daily recap, November 5](https://www.seroundtable.com/recap-11-05-2026-42466.html) \u2014 November 5, 2026 \u2014 discovery index\n70. [Search Engine Roundtable \u2014 daily recap, November 6](https://www.seroundtable.com/recap-11-06-2026-42474.html) \u2014 November 6, 2026 \u2014 discovery index\n71. [Search Engine Roundtable \u2014 weekly video recap](https://www.seroundtable.com/video-11-06-2026-42469.html) \u2014 November 6, 2026 \u2014 discovery index\n72. [Lift Conversions \u2014 The Lift Brief, October 30\u2013November 6](https://liftconversions.com/the-lift-brief-this-week-in-ai-search-and-marketing-october-30-to-november-6-2026/) \u2014 November 6, 2026 \u2014 discovery index\n73. [getlooploop \u2014 weekly news](https://www.getlooploop.com/news/one-robots-txt-rule-against-ai-training-and-brand-ai-overviews-move-aside) \u2014 November 2026 \u2014 discovery index\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# Monday Signal \u2014 Week of November 9, 2026\n\n> **The midterms carried a record $11.87 billion in political ads by AdImpact's final count, as The Current reported Nov 4, and Wesleyan Media Project counted more than $187 million behind AI-made ads.** OpenAI pledged to pay its own power costs, Meta paused its new terms, AI Mode added home-services booking, and the Times and three Tribune papers sued Brave. On the feed, John Lewis's Christmas ad drew scorn on X and 5.6 stars from System1, a working paper argued \"ChatGPT's ads don't pay,\" and Facebook's AI-written answer pages turned up in Google's index.\n\n---\n\n## The Conversation\n\n### John Lewis's Christmas ad drew scorn on X and 5.6 stars from System1, and Dior explained its \"all hand-drawn\" film\n\nCarma put social sentiment on \"Gloria and Pickles\" (Nov 3) at 77% negative; System1's representative panel gave it 5.6 stars, and Andrew Tindall posted that \"only 6% felt real contempt. But 69% loved it.\" Dior billed its Nov 4 film as \"all hand-drawn,\" and on Nov 7 the film's producer told Variety they \"used an automated interpolation system for a very small part of the process\". Very disclosed \"AI-assisted\" production on day one. Say in the press kit what was drawn, shot, generated or automated. [Tindall's post](https://www.linkedin.com/posts/andrew-tindall_advertising-marketing-activity-7523767013614194688-emRP) \u00b7 [Variety](https://variety.com/2026/film/global/sylvain-chomet-denies-ai-accusations-dior-robert-pattinson-1236941945/) \u00b7 [The Very Group](https://www.theverygroup.com/media/news/2026/new-flamingo-family-leads-verys-christmas-creative/)\n\n### A working paper says \"ChatGPT's ads don't pay,\" and OpenAI swaps bid caps for targets Nov 9\n\nChristian Schulze and Maximilian Kaiser's paper (Grips Intelligence data; Kaiser advises Grips) finds a paid ChatGPT visit earns $0.89 per session against $2.45 for paid Google Search, so a ChatGPT click would have to cost $0.26 to match; the largest known account paid $1.72. From Nov 9, new campaigns get Target CPC, which lets OpenAI's system \"bid above or below your target in individual auctions,\" and Max CPC retires Jan 1, 2027. Set the target from your own revenue per session. *Editor's note (Nov 9): OpenAI's VistaPrint case study reports \"5.9x return on ad spend\" for one US campaign, based on VistaPrint-reported, platform-attributed sales.* [The paper (PDF)](https://ecommerceresearch.org/chatgpt-ads/Kaiser-Schulze-2026-Can-Advertising-Fund-Free-AI.pdf) \u00b7 [OpenAI Help](https://help.openai.com/en/articles/20001634-bidding-strategies-and-how-pricing-works-in-chatgpt-ads) \u00b7 [OpenAI's case study](https://openai.com/ads/customers/vistaprint/)\n\n### More than 6 million of Facebook's AI-written \"Answers\" pages are in Google's index\n\nSaul Westbrook (Nov 4) estimated 40.6 million October visits to facebook.com/fb-answers/ from Semrush data and found that \"LLMs are blocked from crawling these pages\"; Glenn Gabe counted \"6M+ urls indexed there\" (on X, via SER). Google and Meta haven't commented. Search the directory for your brand and log what the pages say. [Peripheral Creative](https://www.peripheralcreative.com/news/facebook-answers-ai-generated-pages) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/facebook-answers-google-42467.html)\n\n---\n\n## Voices\n\n- **Andrew Tindall, System1 (LinkedIn, Nov 4):** \"The John Lewis Christmas ad and its 'backlash' brilliantly demonstrate how marketers still haven't learned the number 1 rule of marketing: you are not the customer\" [The post](https://www.linkedin.com/posts/andrew-tindall_advertising-marketing-activity-7523767013614194688-emRP)\n- **Erika Franklin Fowler, Wesleyan Media Project (On Point, Nov 6):** \"There's no federal regulation of AI in advertising, so what we have instead is a patchwork of state laws that apply to mostly state candidates across the country.\" [The episode](https://www.wbur.org/onpoint/2026/11/06/deepfakes-political-advertising-midterms)\n- **Saul Westbrook, Peripheral Creative (blog post, Nov 4):** \"There seems to have been no editorial oversight for this content.\" [The post](https://www.peripheralcreative.com/news/facebook-answers-ai-generated-pages)\n- **Yamini Rangan, HubSpot (Q3 call, Nov 4):** \"Inbound demand remains under pressure, and we are diversifying to new sources of demand through intent-based marketing, LLM connectors and AEO.\" [Transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/hubspot-hubs-q3-2026-earnings-call-transcript/)\n\n---\n\n## This Week in Marketing AI\n\n### Midterm political ads set a record $11.87 billion, and most AI-made ads ran without a disclaimer\n\nWesleyan Media Project counted 289 AI-generated political ads, and only 27% carried disclaimers through mid-October (via USA Today). Voters weighed 41 data-center ballot measures, AI stocks \"sold off sharply\" on Nov 5 (CNBC), and OpenAI pledged to \"pay the full cost of the electricity we use.\" [The Current](https://www.thecurrent.com/media/political-ad-spending-record-2026-ctv) \u00b7 [USA Today](https://www.usatoday.com/story/news/politics/elections/2026/10/30/slopaganda-ai-campaign-ads-skyrocket-2026/92368828007/) \u00b7 [OpenAI](https://openai.com/index/setting-new-standard-responsible-ai-infrastructure)\n\n### Meta paused its new terms, and a S\u00e3o Paulo court barred it from using Brazilian journalism without authorization\n\nMeta said Nov 5 that its updated terms \"are now paused,\" with no new date. On Nov 3 a S\u00e3o Paulo judge barred Meta from using journalistic content without authorization in a preliminary order issued without hearing Meta. [Nieman Lab](https://www.niemanlab.org/2026/11/meta-pulls-down-controversial-terms-of-service/) \u00b7 [ANJ, ABERT and ANER (PDF)](https://aner.org.br/wp-content/uploads/2026/11/ANJ-ABERT-e-ANER-liminar-versao-final.pdf)\n\n### AI Mode added home-services booking, a fourth ad was sighted, and Performance Max may hand brand queries back\n\nSince Nov 4, AI Mode links to booking through Angi, Thumbtack, Housecall Pro and Jobber in the US, as partner integrations, not ads. SER reported four sponsored results under one AI Mode answer, which Google hasn't confirmed, and Google's help text now says Performance Max \"may also filter out navigational or brand-specific search queries.\" [Stein on X](https://x.com/rmstein/status/2118027605018632408) \u00b7 [SER on the fourth ad](https://www.seroundtable.com/google-ai-mode-four-ads-42443.html) \u00b7 [SER on Performance Max](https://www.seroundtable.com/google-ads-pmax-brand-queries-42438.html)\n\n### Shopify's AI-attributed orders grew 3.3x, HubSpot said AI is changing discovery, and Snap's ad revenue grew 4%\n\nHarley Finkelstein said, \"AI traffic is up 2.6x year-over-year. Orders are growing even faster at 3.3x,\" while noting \"the volume is still small here.\" Snap reported \"Advertising Revenue grew 4%\" as upper-funnel brand advertising declined. [Shopify transcript](https://stockanalysis.com/stocks/shop/transcripts/725032-q3-2026/) \u00b7 [HubSpot transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/hubspot-hubs-q3-2026-earnings-call-transcript/) \u00b7 [Snap's prepared remarks](https://www.sec.gov/Archives/edgar/data/1564408/000156440826000063/snapincq32026preparedrem.htm)\n\n### AppLovin's $2.18 billion quarter topped five ad tech rivals combined\n\nAppLovin's Q3 revenue rose 55% (reported Nov 4), while Teads fell 26%, Criteo fell 11%, and Magnite's CTV rose 39%; Magnite's Michael Barrett said, \"The numbers would be much stronger if it were more of a search generated traffic world as opposed to answer engines.\" [AppLovin](https://www.businesswire.com/news/home/20261104553587/en/AppLovin-Announces-Third-Quarter-2026-Financial-Results) \u00b7 [Digiday](https://digiday.com/media/by-the-numbers-ad-techs-widening-divide-as-applovin-surges-and-rivals-struggle-in-q3/) \u00b7 [Magnite transcript](https://www.fool.com/earnings/call-transcripts/2026/11/05/magnite-mgni-q3-2026-earnings-call-transcript/)\n\n### The New York Times and three Tribune papers sued Brave, alleging it swaps publishers' ads and supplies AI companies\n\nThe Nov 2 complaints in New York federal court allege that Brave's browser removes publishers' ads to show users \"Brave's own ads instead\" and that Brave supplies \"many of the most prominent GenAI companies.\" We found no response from Brave. [Tribune papers' complaint (PDF)](https://www.thewrap.com/wp-content/uploads/2026/11/Pleading-26-cv-9554-Dkt.-1-Complaint.pdf) \u00b7 [The Times' complaint (PDF)](https://nytco-assets.nytimes.com/2026/11/new-york-times-brave-complaint-11-2-26.pdf) \u00b7 [Ars Technica](https://arstechnica.com/tech-policy/2026/11/nyt-demands-brave-shut-down-its-paywall-blocker-and-end-deals-with-ai-firms/)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's daily recaps](https://www.seroundtable.com/recap-11-06-2026-42474.html) and [The Lift Brief](https://liftconversions.com/the-lift-brief-this-week-in-ai-search-and-marketing-october-30-to-november-6-2026/).*\n\n- **Google's visible AI labels on ads now cover six places**, and labels Google applies itself \"cannot be overwritten.\" [Google Ads Help](https://support.google.com/google-ads/answer/17140115?hl=en)\n- **Microsoft Clarity says \"weekly sessions from AI agents nearly doubled in three weeks\"** in its own sample. [Microsoft Clarity](https://clarity.microsoft.com/blog/clarity-connects-agents-llms-people/)\n- **Amazon's shopping agent takes texts** (invite-only, US), with Sponsored Products ads in its replies, per Digiday. [Digiday](https://digiday.com/media-buying/amazons-shopping-agent-now-takes-orders-by-text-with-sponsored-product-ads-in-the-replies/)\n- **Reddit is testing ads in search results** with \"a select group of eligible advertisers.\" [Reddit](https://redditinc.com/news/we-are-testing-ad-placements-in-reddit-search-pages)\n- **Fox closed its $22 billion Roku deal** on Nov 6. [Variety](https://variety.com/2026/tv/news/fox-closes-roku-acquisition-1236941275/)\n\n---\n\n## Common Threads\n\n### The week's arguments turned on which unit gets counted\nCarma counted posts, System1 a panel, Fry search-like prompts and Shopify orders it attributes to AI; label the unit before comparing.\n\n### Google will label AI-made ad assets itself, and brands split on disclosure\nGoogle's own AI labels \"cannot be overwritten,\" and Very disclosed AI-assisted production up front while Dior explained its film later.\n\n### Intermediaries moved closer to the purchase\nAI Mode books home services, Amazon's agent carries ads in its replies, and the Tribune papers allege Brave swaps in \"Brave's own ads.\"\n\n### AI's power bill and its ad revenue shared the week\nOpenAI pledged to pay for its electricity as AI stocks sold off, and Kaiser and Schulze price a ChatGPT click well below a search click.\n\n---\n\n## Angles for the Week\n\n- **Set ChatGPT's Target CPC from your own revenue per session.** Keep one Max CPC campaign as the comparison. Window: Nov 9 to Jan 1, 2027.\n- **Put the production method in the launch materials.** Very disclosed on day one; Dior explained three days later. Window: the rest of the Christmas launch season.\n- **Find out where Google will label your ads as AI.** Overlays apply in six places, and the page gives no effective date. Window: now.\n- **Fund brand Search before Performance Max hands brand queries back.** The help text has no start date and doesn't define a brand query. Window: before Black Friday (Nov 27).\n- **Read what Facebook's AI pages say about your brand.** Search fb-answers for your brand and top product questions. Window: until Google or Meta responds.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
