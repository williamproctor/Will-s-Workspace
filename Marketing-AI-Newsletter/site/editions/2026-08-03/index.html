      slug: "2026-08-03",
      editionTitle: "Week of August 3, 2026",
      editionMd: "# The Monday Signal \u2014 Week of August 3, 2026\n\n> **Four earnings reports landed in 48 hours, and one pattern ran through all of them: every dollar of ad growth traveled through an automated buying product.** Meta grew ads 27% while its free cash flow fell 91%; Amazon's ads accelerated to 26% with sold-out sports inventory; Microsoft's search ads decelerated while its agent registry added 40 million entries in two months. Meanwhile the week's research showed AI slop grading as premium inventory, bots holding 57.5% of web traffic, and the EU's AI-labeling law switching on Sunday, right on schedule.\n\n---\n\n## The Conversation\n\n### Zuckerberg says the AI bets are paying off; the market sold the stock anyway\n\nMeta's July 29 call gave both sides their ammunition. Zuckerberg: \"On a dollar basis, our ads business is reporting faster year-over-year revenue growth than any other company's reported ad business \u2014 so these AI investments are paying off.\" He's right about the growth; ads did $59.4 billion, up 27%. The other column: EPS missed by about 14%, operating margin fell to 31% after eight quarters in the 40s, capex hit $31.1 billion, and free cash flow collapsed to $784 million from $8.55 billion a year earlier. Shares dropped roughly 8\u201310% after hours, and MediaPost framed the investor question as \"diversification or distraction.\"\n\nThe detail connecting this to our last edition: Adweek reported Meta ran its optimism-themed brand campaign (the Bowie one) precisely because it entered earnings week needing to justify the 2026 AI spend. The ad was investor relations wearing a brand-campaign costume.\n\n**Comment window:** open all week; every AI-spending debate will quote this quarter. The lazy take picks a column. The better one explains why both are the same strategy: ad pricing power (+12% per ad) is what funds the capex.\n\n**Source:** [PPC Land weekly synthesis](https://ppc.land/bots-overtake-humans/) \u00b7 [Marketing Dive](https://www.marketingdive.com/news/meta-touts-industry-leading-ad-revenue-growth-but-ai-unease-rises/826583/) \u00b7 [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx) \u00b7 July 29, 2026\n\n### Musk says X stopped demoting links a year ago\n\nIt started, fittingly, with Mark Zuckerberg posting a link to his own AI essay on X. X product chief Nikita Bier replied that he didn't need to put links in replies anymore; Paul Graham asked the direct question, and Elon Musk answered on July 28\u201329: X hasn't penalized posts with links \"for over a year.\" Marketers built an entire posting style around the assumed penalty: links in the first reply, screenshots instead of URLs, \"link in bio\" theater. If the claim holds, that workaround era ran a year longer than it needed to. (The full thread, verbatim, is in Voices below.)\n\nIt's a platform owner's statement, not a measurement \u2014 and X's own open-sourced ranking code complicates it. A January analysis of that code found link posts running roughly 94% below comparable linkless posts with no hard-coded penalty anywhere; the Phoenix ranking model learned the suppression from engagement data. Nothing needs to be \"turned off\" for links to keep underperforming.\n\n**Comment window:** open now, and cheap to make substantive: run links-in-post against your old pattern for two weeks and publish the numbers. First marketers with actual data own this conversation.\n\n**Source:** [Thread coverage](https://searchengineoptimization.blog/article/x-says-it-stopped-penalizing-links-a-year-ago-proof-is-thin) \u00b7 [PPC Land's Phoenix algorithm analysis](https://ppc.land/x-exposes-algorithm-secrets/) \u00b7 [PPC Land weekly](https://ppc.land/bots-overtake-humans/) \u00b7 July 28\u201329, 2026\n\n### 77 companies sign a letter against Anthropic\n\nNvidia, Google, Meta, and OpenAI were among 77 signatories on a July 28 letter accusing Anthropic of lobbying for an open-weights ban. Anthropic counters that its proposals cover chip exports and pre-release testing, not open weights. Two weeks ago the labs fought through ad campaigns; now it's coalition letters.\n\nFor a marketing team the relevance is positioning, not policy: the AI vendors your clients build on are publicly sorting themselves into camps (open vs. closed, safety vs. access), and \"which lab's worldview does your stack encode\" is turning into a real client question.\n\n**Comment window:** a few days on the letter itself; durable as a \"vendor politics are now brand politics\" observation.\n\n**Source:** [PPC Land weekly (July 28 item)](https://ppc.land/bots-overtake-humans/) \u00b7 July 28, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, calls, and shows where the week's arguments actually happened.\n\n- **The link-demotion thread, in full** (X, July 28\u201329): Mark Zuckerberg posted a link to his own AI essay. X product chief Nikita Bier replied: \"Hello Mark, you do not need to put the links in replies anymore.\" Paul Graham asked the direct question \u2014 \"You no longer penalize tweets with links in them?\" \u2014 and Elon Musk answered: \"We haven't for over a year.\" Developer Wes Bos said what everyone was thinking: \"Anymore?! So you were nerfing links.\" [Coverage with the thread](https://searchengineoptimization.blog/article/x-says-it-stopped-penalizing-links-a-year-ago-proof-is-thin)\n- **Jyll Saskin Gales, Google Ads coach** (LinkedIn, July 29): \"Are any other Google Ads advertisers seeing ChatGPT in their auction insights? This is a first for me\u2026 whether intentionally or not \u2014 OpenAI is placing Google Search Ads on category terms like '[type of] software.' Kind of a great strategy on Chat's part, actually. And a reminder that your auction insights are a goldmine of competitive intel beyond just PPC strategy.\" [The post](https://www.linkedin.com/posts/jyllsaskingales_are-any-other-google-ads-advertisers-seeing-activity-7488205440485384192-xjZp)\n- **Mark Zuckerberg, CEO, Meta** (Q2 earnings call, July 29): \"On a dollar basis, our ads business is reporting faster year-over-year revenue growth than any other company's reported ad business \u2014 so these AI investments are paying off.\" And on where agents go next: \"Effectively we will get paid when we deliver results for those businesses.\" [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx)\n- **Susan Li, CFO, Meta** (same call, on the Generative Recommender): \"a paradigm shift in how our ads system works.\"\n- **Steve Huffman, CEO, Reddit** (Q2 call, July 30): \"AI Overviews has yet to make a similar level of positive impact,\" and Reddit's direct app audience is \"worth multiples more than the search referral traffic.\" The stock fell 12.5% on exactly that tension.\n- **Heard on the pods:** Marketing O'Clock's July 27 episode asked the week's uncomfortable measurement question \u2014 Google's AI Search is sending \"billions of clicks,\" but is that metric accurately highlighting its success? [Episode](https://marketingoclock.com/episodes/billions-of-ai-search-clicks-and-billions-of-distractions/)\n\n---\n\n## This Week in Marketing AI\n\n### Earnings sweep: the auction is now a conversation between models\n\nFour reports in 48 hours. Meta (July 29): ads $59.36 billion, up 27%, on impressions up 14% and price per ad up 12%. US/Canada prices rose 20% on just 9% more impressions, so mature markets are monetizing through price. Advantage+ passed a $75 billion annual run-rate (company-stated; it's not a reported line item), and CFO Susan Li called the new Generative Recommender \"a paradigm shift in how our ads system works\": LLMs reason about ad content and user preferences together, with the GEM ranking model credited for 8.3% more clicks and 15.7% more conversions on Facebook. All Meta-measured.\n\nAmazon (July 30): ads $19.8 billion, up 26%, the fastest rate it has disclosed. Its most interesting number is conversational: shoppers who click a sponsored prompt in Alexa+ convert 48% more often and spend 21% more (seller-reported), and 350 million customers used the shopping assistant over the trailing year. Microsoft (July 29): search ads grew just 10% and got guided to mid-single digits, while Agent 365 registered about 40 million agents in two months; Microsoft told the market which business it's in. Reddit (July 30): ads up 64% to $762 million, and the stock still fell 12.5% because US daily uniques grew 6% against a 100 million target. CEO Steve Huffman said \"AI Overviews has yet to make a similar level of positive impact\" and valued direct users at \"multiples more\" than search-referred ones.\n\nThe shared pattern: Advantage+, Ads Agent, AI Max, Reddit Max. Every growth dollar moved through an automated buyer.\n\n**Source:** [PPC Land weekly synthesis](https://ppc.land/bots-overtake-humans/) \u00b7 [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx) \u00b7 [Earnings analysis](https://www.digitalapplied.com/blog/meta-q2-2026-earnings-ad-strength-capex-selloff) \u00b7 July 29\u201330, 2026\n\n### AI slop grades as premium inventory, and buyers pay extra for it\n\nThe Trustworthy Accountability Group, the ANA, and Fiducia published the first rigorous sizing of AI-generated junk in programmatic on July 28, and the finding inverts the verification stack. Slop accounts for 1.3\u20132.4% of open-web programmatic spend, and it beats clean supply on the signals buyers actually use: invalid-traffic rate of 0.05% (vs 0.32%), viewability of 77.2% (vs 74.9%). It graded as premium more than 70% of the time and cleared at a higher price: a TrueCPM of $7.08 against $6.15 for clean inventory.\n\nThe mechanism is mundane. Template sites render fast, serve measurable slots, and avoid bot traffic because their revenue depends on passing verification. They perform well against tests designed to catch fraud; nobody built a test for \"did a human write this.\" The structural marker: 30% of slop domains are templated, versus 1.2% of clean supply. The 88% overlap with made-for-advertising inventory means existing MFA suppression catches most of it; the remaining 12% escapes every current framework. And the strongest commercial finding cuts the other way: known publishers showed effectively zero slop, which is the best sales argument human-produced media has had in a while.\n\n**Source:** [The TAG/ANA/Fiducia announcement](https://www.prnewswire.com/news-releases/tagana-fiducia-analysis-quantifies-level-of-ai-slop-in-digital-advertising-supply-chain-for-first-time-302836519.html) \u00b7 [eMarketer's analysis](https://www.emarketer.com/content/ai-slop-exposes-blind-spot-programmatic-advertising-ad-quality-metrics) \u00b7 July 28, 2026\n\n### Bots are 57.5% of the web, and 2.6% of AI crawls serve an actual person\n\nIAB Australia published crawler guidance on July 28 built on a stat that reorganizes publisher thinking: automated requests reached 57.5% of web traffic by June (Cloudflare data), with most crawler activity now coming from AI systems rather than search engines. The composition matters more than the headline. Roughly 52% of AI crawler requests feed model training; only about 2.6% are real-time fetches triggered by a human asking a question. Almost none of it sends anyone back.\n\nThe guidance sorts every crawler into five categories with four verdicts (allow, conditional, license, block). Training crawlers get block-or-license; live agents get conditional access. It also flags that robots.txt is unreliable for user-triggered fetchers: Google's and OpenAI's generally ignore it, Anthropic's honors it. Two dates give this teeth: Cloudflare default-blocks training and agent crawlers on ad-bearing pages for new domains from September 15, and its July policy shift moved the model from charging AI firms per crawl to paying publishers per answer. Meanwhile Time went furthest. Digiday reported July 30 that it now serves ads to AI agents \u2014 FAQ-formatted sponsored blocks from Mobian inside the markdown pages it redirects approved bots to, with Ally Bank and the Project Management Institute as first buyers. Time's COO Mark Howard told Digiday the publisher sees more bot traffic than human traffic most days, and an open question hangs over the whole experiment: can a bot be influenced by an ad?\n\n**Source:** [Digiday \u2014 Time has started serving ads to AI agents](https://digiday.com/media/time-has-started-serving-ads-to-ai-agents/) \u00b7 [PPC Land weekly synthesis](https://ppc.land/bots-overtake-humans/) \u00b7 July 28\u201330, 2026\n\n### Article 50 went live Sunday, and Meta signed the code it refused last year\n\nThe EU AI Act's transparency obligations became applicable August 2: disclosure when people interact with AI systems, machine-readable marking of synthetic content, penalties up to 3% of global turnover. Meta signed the EU code of practice on AI content marking on July 28, a reversal of its 2025 refusal delivered by policy VP Markus Reinisch five days before penalties attach. Signing changes Meta's evidentiary position more than its engineering; the labeling plumbing was already going into the buying tools (Google's AI labels are now operational across Ads, Merchant Center, and Ads Editor, with the DV360 attestation field live since July 25).\n\nThe unresolved question survived the deadline: which party in the chain (platform, agency, advertiser) carries the visible labeling duty on any given ad. Brazil added the enforcement rationale the same week: a ban on paid deepfake ads in the 72 hours before elections, after its data authority documented a fraud ring that moved roughly R$20 million on deepfakes of Gisele B\u00fcndchen. An unlabeled synthetic spot now carries liability in Brussels, New York, and Bras\u00edlia under three different definitions.\n\n**Source:** [PPC Land weekly synthesis](https://ppc.land/bots-overtake-humans/) \u00b7 July 28\u2013August 2, 2026\n\n### The click-to-agent ad arrives, and ChatGPT shows up in Google's auction insights\n\nTwo sightings this week sketch where paid AI surfaces go next. Search Engine Roundtable spotted a new ChatGPT Ads campaign type called Agent on July 31: clicking the ad starts a conversation with the advertiser's Business Agent instead of opening a website. Meta disclosed on its earnings call that over 1 million businesses already use its Business Agent weekly (the Brazilian rental chain Movida reported 44% more daily WhatsApp bookings with 85% of conversations resolved by the agent; a company case). An ad whose destination is another AI now exists at two companies at once, and it rethinks the click itself; the landing page becomes optional.\n\nThe second sighting is smaller and sharper. Google Ads coach Jyll Saskin Gales posted on July 29 that ChatGPT had been sitting in a client's auction insights since May \u2014 exact-match keywords, niche financial software, with OpenAI apparently bidding on broad category terms rather than the niche itself. When she narrowed the account to brand and competitor terms, ChatGPT disappeared from the report. That's the first practitioner receipt that ChatGPT ads and Google ads compete in overlapping auctions for the same buyer. Check your own auction insights; you may already be bidding against a chatbot.\n\n**Source:** [Paid Media Collective Issue 224](https://www.linkedin.com/pulse/paid-media-news-week-31-yoann-ferrand-zujec) \u00b7 [Jyll Saskin Gales' post](https://www.linkedin.com/posts/jyllsaskingales_are-any-other-google-ads-advertisers-seeing-activity-7488205440485384192-xjZp) \u00b7 [PPC Land weekly](https://ppc.land/bots-overtake-humans/) \u00b7 July 28\u201331, 2026\n\n### OpenAI cut GPT-5.6 prices up to 80%, repricing agent work again\n\nOpenAI dropped GPT-5.6 Luna API token prices 80% and Terra's 20% on July 29; intelligence that was frontier-class a year ago now costs about six cents on the dollar per task and runs roughly nine times faster. A Fast mode for GPT-5.6 Sol offers 2.5x standard speed at twice the price. Two weeks ago the same move came from Google (Gemini Flash cuts, July 21). Agent workloads run in loops and are priced per token, so every automation your team shelved on cost grounds in the spring deserves a re-run of the math. This is also the quiet engine behind the week's agent-infrastructure news: the MCP protocol rewrite, TikTok's Agentic Hub, Amazon's Ads Agent expansion. Cheap loops make agents viable; viable agents need plumbing.\n\n**Source:** [Paid Media Collective Issue 224](https://www.linkedin.com/pulse/paid-media-news-week-31-yoann-ferrand-zujec) \u00b7 July 29, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/bots-overtake-humans/).*\n\n- **Google set the AI Max migration calendar.** August 3: no new campaign-level Broad Match or legacy Automatically Created Assets. September 1\u201330: those campaigns auto-migrate to AI Max. Dynamic Search Ads follow in February 2027. The AI envelope stops being optional on a published schedule. [Search Engine Land](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006) \u00b7 week of July 27\n- **AI Overviews now appear on close to half of Google queries:** 43% by Similarweb's count, 48% by Semrush's (the vendors still disagree; no standard measurement exists). And Productrise found AI Mode surfaces Shopping listings on 23% of shopping queries versus 88% in standard search, a 95% cut in listing exposure. Fewer slots, pricier citations. (July 29\u201330)\n- **Amazon logged 984 million AI title rewrites since June** and now gives brand owners a 14-day review window before rewritten titles go live (mobile parity August 10). The volume tells you how deep generative systems already sit in commerce metadata; the review window tells you some rewrites hurt. (July 30)\n- **The agent plumbing got a rewrite.** The Model Context Protocol shipped its largest spec revision since 2024 (sessions removed; any server can answer any call), and IAB Tech Lab's AAMP v2.3 added pricing provenance so buying agents can't fabricate bid prices. TikTok shipped Agentic Hub, an MCP door into Ads Manager. The standards bodies are building guardrails for a failure mode that already exists. (July 28\u201330)\n- **PMax control concessions continued:** a limited alpha lets some advertisers switch off search partners and the Display Network, and household income exclusions surfaced July 27. Buy-side reaction (Crossmedia's Sam Clarke: \"fairly significant\") matches the pattern: control features unlock spend. (week of July 27)\n- **Google banned undisclosed incentivized reviews** (July 28, manual actions for violators) and opened Search Console platform properties to everyone: you can now track how Instagram, TikTok, X, and YouTube profiles perform in Google Search with no website. For a growing class of queries, the entity that ranks isn't a website. (July 28\u201330)\n- **Meta's Graph API v26 blocked 47 commerce endpoints with no replacement** (poll ads, Explore Feed, and Messenger Stories placements also gone). Teams maintaining catalog middleware inherit migration work with no destination. It's the API-level confirmation that Meta's commerce attention moved to agent-mediated flows. (July 30)\n- **Shopping agents failed their first consumer-protection test:** the Vanderbilt Policy Accelerator (founded by Lina Khan) found Amazon's and Walmart's assistants dodging country-of-origin questions. Awkward next to Amazon's 48% conversion claim for the same surface. (July 30)\n\n---\n\n## Common Threads\n\n### Every ad dollar routes through an automated buyer now\n\nAdvantage+ at $75 billion run-rate, Amazon's Ads Agent in 11 new countries, AI Max absorbing Google's legacy formats on a published calendar, Reddit Max growing 150% sequentially. The auction has become a negotiation between models, and the human's job is moving to inputs (feeds, creative, constraints) and verification.\n\n### The quality stack graded fabrication as premium\n\nSlop inventory beat clean supply on invalid traffic, viewability, and price. Metrics designed as fraud checks became adversarial signals; \"high viewability on a templated long-tail domain\" is now a warning, not a comfort. Meanwhile known publishers showed effectively zero slop; verified human context quietly became the scarce asset.\n\n### The web's majority isn't human, and the toll booths are going up\n\n57.5% automated traffic; 2.6% of AI crawls serving a person; Cloudflare flipping to pay-per-answer with default blocking from September 15; Time selling ads to agents. Publishers spent two years asking whether to block crawlers. This week the question became what to charge them.\n\n### Disclosure arrived on schedule\n\nArticle 50 live, Meta's holdout ended, Google's label tooling operational, Brazil's 72-hour deepfake ban. The compliance layer we tracked in edition one is no longer pending; it's the operating environment.\n\n---\n\n## Angles for the Week\n\n*Raw material for posts and POVs, ordered by how long each window stays open.*\n\n### \"Meta grew ads 27% and its free cash flow fell 91%. Same strategy, both true.\"\n\nThe AI-spending debate will run on this quarter for weeks, and most takes will pick one column. The grounded position: price per ad up 12% (20% in the US) is what pays for $31 billion of quarterly capex, and Advantage+ at a $75 billion run-rate is the product that pricing power runs through. Meta's earnings math only works if the AI ad stack keeps outperforming; that's the bet, stated in numbers.\n\nWindow: open while the earnings cycle runs.\n\n### \"Your verification stack thinks AI slop is premium inventory.\"\n\nTrueCPM of $7.08 for fabricated supply against $6.15 for clean; premium grades 70% of the time; 0.05% invalid traffic because slop sites need to pass your checks to get paid. The actionable version: MFA suppression already catches 88% of it, so ask your verification vendor specifically about the other 12%, and note that known publishers showed effectively zero. Media buyers and publisher-side sellers can both post this one.\n\nWindow: a week or two, while the study circulates.\n\n### \"2.6% of AI crawls serve a human. Plan your content for the other 97%.\"\n\nThe machine audience stopped being a metaphor: bots are 57.5% of traffic, half of AI crawling feeds training, and Time now sells ads to agents. The interesting question for content teams isn't block-or-allow anymore; it's which crawler categories you license, what your llms.txt actually gets you (97% of them received zero AI requests), and whether your pages are legible to the agents that do fetch live.\n\nWindow: durable; September 15 (Cloudflare default blocking) gives it a news peg for weeks.\n\n### \"The click is becoming a conversation.\"\n\nOpenAI is testing ads that open a Business Agent chat instead of a website; a million businesses run Meta's agent weekly; Alexa+ prompt-clickers convert 48% more (Amazon's own number). If the destination is an agent, the landing page, the form, and the funnel all get renegotiated. Early POV territory for anyone advising on conversion paths.\n\nWindow: fresh this week; the format is days old.\n\n### \"X stopped punishing links a year ago. Test it before you take Musk's word.\"\n\nThe claim came from the owner in a public exchange, which makes it a claim worth testing rather than adopting. Two weeks of links-in-post vs. your current pattern, publish the reach and click numbers, and you own the practical version of a conversation everyone else is having rhetorically.\n\nWindow: this week for the take; the test results are content in two more.\n\n---\n\n## Sources\n\n1. [TAG/ANA/Fiducia \u2014 AI slop analysis announcement](https://www.prnewswire.com/news-releases/tagana-fiducia-analysis-quantifies-level-of-ai-slop-in-digital-advertising-supply-chain-for-first-time-302836519.html) \u2014 July 28, 2026 \u2014 the study itself: spend share, quality-metric inversions, TrueCPM premium\n2. [eMarketer \u2014 AI slop exposes a blind spot in ad quality metrics](https://www.emarketer.com/content/ai-slop-exposes-blind-spot-programmatic-advertising-ad-quality-metrics) \u2014 July 29, 2026 \u2014 the measurement-blind-spot analysis\n3. [Digiday \u2014 Time has started serving ads to AI agents](https://digiday.com/media/time-has-started-serving-ads-to-ai-agents/) \u2014 July 30, 2026 \u2014 original reporting: Mobian format, first buyers, Howard's bot-traffic detail\n4. [PPC Land \u2014 weekly synthesis, July 27\u2013August 2 (\"Bots overtake humans\")](https://ppc.land/bots-overtake-humans/) \u2014 August 2026 \u2014 earnings sweep, IAB Australia crawler guidance, Article 50/Meta code signing, MCP/AAMP infrastructure, platform plumbing, Anthropic letter\n5. [Meta \u2014 Q2 2026 results](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx) \u2014 July 29, 2026 \u2014 primary financials: ad revenue, impressions, pricing, segment detail\n6. [Marketing Dive \u2014 Meta touts industry-leading ad revenue growth, but AI unease rises](https://www.marketingdive.com/news/meta-touts-industry-leading-ad-revenue-growth-but-ai-unease-rises/826583/) \u2014 July 2026 \u2014 Zuckerberg and Li quotes, Advantage+ run-rate, Q3 guidance and EU headwinds\n7. [Digital Applied \u2014 Meta Q2 2026 earnings analysis](https://www.digitalapplied.com/blog/meta-q2-2026-earnings-ad-strength-capex-selloff) \u2014 July 2026 \u2014 capex/FCF detail, GEM performance figures, after-hours reaction\n8. [Meta Q2 2026 earnings call transcript](https://www.roic.ai/quote/META:PE/transcripts/2026-year/2-quarter) \u2014 July 29, 2026 \u2014 verbatim executive remarks\n9. [Search Engine Land \u2014 Google sets AI Max migration timeline](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006) \u2014 July 2026 \u2014 August 3 cutoff, September auto-migration, DSA dates\n10. [Search Engine Land \u2014 Google to auto-upgrade automatically created assets to AI Max](https://searchengineland.com/google-to-auto-upgrade-some-search-campaigns-to-ai-max-484428) \u2014 July 2026 \u2014 migration mechanics and settings mapping\n11. [Paid Media Collective \u2014 Issue 224, July 27\u2013August 2](https://www.linkedin.com/pulse/paid-media-news-week-31-yoann-ferrand-zujec) \u2014 August 2026 \u2014 GPT-5.6 price cuts, ChatGPT Agent campaign type, ChatGPT in Google auction insights, AI label rollout, LSA-in-AI-Mode\n12. [Jyll Saskin Gales \u2014 LinkedIn post finding ChatGPT in Google Ads auction insights](https://www.linkedin.com/posts/jyllsaskingales_are-any-other-google-ads-advertisers-seeing-activity-7488205440485384192-xjZp) \u2014 July 29, 2026 \u2014 primary post, quoted verbatim in Voices\n13. [Coverage of the Musk\u2013Graham\u2013Bier link-demotion thread](https://searchengineoptimization.blog/article/x-says-it-stopped-penalizing-links-a-year-ago-proof-is-thin) \u2014 July 2026 \u2014 verbatim thread text and the 94% view-gap context\n14. [PPC Land \u2014 X exposes algorithm secrets](https://ppc.land/x-exposes-algorithm-secrets/) \u2014 January 2026 \u2014 the Phoenix ranking model analysis behind the learned link suppression\n15. [Marketing O'Clock \u2014 \"Billions of AI Search Clicks (and Billions of Distractions?)\" (Ep. 443)](https://marketingoclock.com/episodes/billions-of-ai-search-clicks-and-billions-of-distractions/) \u2014 July 27, 2026 \u2014 podcast framing of the clicks-metric debate, cited in Voices\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*       simplifiedMd: "# The Monday Signal \u2014 Week of August 3, 2026\n\n> **Earnings week, and one pattern across four reports: every dollar of ad growth traveled through an automated buying product.** Meta grew ads 27% while free cash flow fell 91%. New research showed AI slop grading as premium inventory, bots at 57.5% of web traffic, and the EU's AI-labeling law went live Sunday.\n\n---\n\n## The Conversation\n\n### Zuckerberg's \"paying off\" vs. the sell-off\n\n\"On a dollar basis, our ads business is reporting faster year-over-year revenue growth than any other company's reported ad business,\" Zuckerberg said July 29. Also true: EPS missed by ~14%, margin fell to 31%, capex hit $31.1B, free cash flow collapsed to $784M, and the stock dropped ~8\u201310% after hours. Adweek reported the optimism ad campaign existed because of this exact week. Comment window: open; the strong take explains why both columns are one strategy (ad pricing power funds the capex). [Marketing Dive](https://www.marketingdive.com/news/meta-touts-industry-leading-ad-revenue-growth-but-ai-unease-rises/826583/) \u00b7 [Meta's results](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx)\n\n### Musk: X stopped demoting links a year ago\n\nSaid publicly to Paul Graham on July 30. The links-in-first-reply era may have been theater for the past year. It's an owner's claim, not a measurement. Test it and publish your numbers. [Thread coverage](https://searchengineoptimization.blog/article/x-says-it-stopped-penalizing-links-a-year-ago-proof-is-thin)\n\n### 77 companies vs. Anthropic\n\nNvidia, Google, Meta, and OpenAI signed a July 28 letter accusing Anthropic of seeking an open-weights ban; Anthropic says its proposals target chip exports and pre-release testing. Vendor politics is becoming brand politics: which lab's worldview does your stack encode? [PPC Land weekly](https://ppc.land/bots-overtake-humans/)\n\n---\n\n## Voices\n\n- **The link thread (X, July 28\u201329):** Bier to Zuckerberg: \"you do not need to put the links in replies anymore.\" Graham: \"You no longer penalize tweets with links?\" Musk: \"We haven't for over a year.\" Wes Bos: \"Anymore?! So you were nerfing links.\" [Coverage](https://searchengineoptimization.blog/article/x-says-it-stopped-penalizing-links-a-year-ago-proof-is-thin)\n- **Jyll Saskin Gales (LinkedIn, July 29):** \"your auction insights are a goldmine of competitive intel\" \u2014 after finding ChatGPT bidding on category terms in a client's account. [Post](https://www.linkedin.com/posts/jyllsaskingales_are-any-other-google-ads-advertisers-seeing-activity-7488205440485384192-xjZp)\n- **Steve Huffman (Reddit Q2 call, July 30):** \"AI Overviews has yet to make a similar level of positive impact\"; direct users are \"worth multiples more.\"\n- **On the pods:** Marketing O'Clock's July 27 episode questioned whether Google's \"billions of clicks\" metric measures success at all. [Episode](https://marketingoclock.com/episodes/billions-of-ai-search-clicks-and-billions-of-distractions/)\n\n---\n\n## This Week in Marketing AI\n\n### Earnings: the auction is a conversation between models\n\nMeta ads $59.4B (+27%; prices +12%, US +20%); Advantage+ passed a $75B run-rate; the new Generative Recommender drove +8.3% clicks and +15.7% conversions on Facebook (all Meta-measured). Amazon ads $19.8B (+26%); Alexa+ prompt-clickers convert 48% more (seller-reported). Microsoft search ads +10% and decelerating while its agent registry added ~40M agents in two months. Reddit ads +64%, stock -12.5% on weak user growth; Huffman: AI Overviews \"has yet to make a similar level of positive impact.\" [Meta's results](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx) \u00b7 [PPC Land weekly](https://ppc.land/bots-overtake-humans/) \u00b7 July 29\u201330\n\n### AI slop grades premium\n\nTAG/ANA/Fiducia: slop is 1.3\u20132.4% of open-web programmatic spend and beats clean supply on the metrics buyers use: 0.05% IVT, 77.2% viewability, premium grades 70% of the time, and a higher price ($7.08 vs $6.15 TrueCPM). MFA suppression catches 88% of it. Known publishers showed effectively zero. [TAG/ANA announcement](https://www.prnewswire.com/news-releases/tagana-fiducia-analysis-quantifies-level-of-ai-slop-in-digital-advertising-supply-chain-for-first-time-302836519.html) \u00b7 July 28\n\n### Bots hold 57.5% of the web; 2.6% of AI crawls serve a person\n\nIAB Australia's crawler guidance (Cloudflare data): most crawling is AI now, half of it feeds training. Cloudflare default-blocks training/agent crawlers on ad pages for new domains from September 15 and moved to paying publishers per answer. Time now serves ads to AI agents via TollBit. llms.txt reality check: 97% of files got zero AI requests. [Digiday on Time](https://digiday.com/media/time-has-started-serving-ads-to-ai-agents/) \u00b7 [PPC Land weekly](https://ppc.land/bots-overtake-humans/) \u00b7 July 28\u201330\n\n### Article 50 is live; Meta signed the code it refused in 2025\n\nEU AI Act transparency obligations became applicable August 2 (fines up to 3% of global turnover). Meta signed the marking code July 28. Google's AI labels are operational across Ads, Merchant Center, and Editor. Brazil banned paid deepfake ads in the 72 hours before elections after a R$20M Gisele B\u00fcndchen deepfake fraud. Still unresolved: who carries the visible label duty per ad. [PPC Land weekly](https://ppc.land/bots-overtake-humans/) \u00b7 July 28\u2013August 2\n\n### Click-to-agent ads, and ChatGPT inside Google's auction insights\n\nOpenAI is testing a ChatGPT Ads campaign type where the click opens a Business Agent conversation instead of a website (spotted July 31); Meta says 1M+ businesses run its Business Agent weekly. And a practitioner found ChatGPT listed in Google Ads auction insights since May, first receipts that the two platforms bid in overlapping auctions. [Paid Media Collective 224](https://www.linkedin.com/pulse/paid-media-news-week-31-yoann-ferrand-zujec)\n\n### GPT-5.6 prices fell up to 80%\n\nLuna -80%, Terra -20% (July 29); frontier-class-last-year intelligence now ~6 cents on the dollar at ~9x speed. Re-run the math on every automation you shelved in spring. [Paid Media Collective 224](https://www.linkedin.com/pulse/paid-media-news-week-31-yoann-ferrand-zujec)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/bots-overtake-humans/).*\n\n- **AI Max migration calendar:** new Broad Match/ACA creation ends Aug 3; auto-migration Sept 1\u201330; DSAs Feb 2027. [SEL](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006)\n- **AI Overviews on ~half of queries** (Similarweb 43% / Semrush 48%); AI Mode shows Shopping listings on 23% of shopping queries vs 88% in standard search.\n- **Amazon: 984M AI title rewrites since June;** brand owners get a 14-day review window.\n- **Agent plumbing:** MCP spec rewrite (stateless), AAMP v2.3 stops agents fabricating bid prices, TikTok shipped Agentic Hub.\n- **PMax:** limited alpha for search-partner/GDN opt-out; household income exclusions.\n- **Google:** banned undisclosed incentivized reviews; Search Console now tracks social profiles in search results.\n- **Meta Graph API v26** blocked 47 commerce endpoints, no replacement.\n- **Shopping agents flunked a consumer test:** Amazon's and Walmart's assistants dodge country-of-origin questions (Vanderbilt).\n\n---\n\n## Common Threads\n\n### Every ad dollar routes through an automated buyer\nAdvantage+, Ads Agent, AI Max, Reddit Max. The human job moves to inputs and verification.\n\n### The quality stack graded fabrication premium\nSlop beat clean supply on IVT, viewability, and price. Fraud checks became adversarial signals; verified human context became the scarce asset.\n\n### The toll booths are going up\nMajority-machine traffic, Cloudflare pay-per-answer, Time's agent ads. The question moved from \"block crawlers?\" to \"what do we charge them?\"\n\n### Disclosure arrived on schedule\nArticle 50 live, Meta's holdout over, label tooling operational, Brazil's 72-hour rule. Compliance is now the operating environment.\n\n---\n\n## Angles for the Week\n\n1. **\"Meta grew ads 27% and free cash flow fell 91%. Same strategy, both true.\"** Pricing power (+12%/ad) funds the capex; Advantage+ is the product it runs through. Window: all earnings cycle.\n2. **\"Your verification stack thinks AI slop is premium inventory.\"** $7.08 vs $6.15; ask your vendor about the 12% MFA suppression misses; known publishers showed ~zero. Window: a week or two.\n3. **\"2.6% of AI crawls serve a human.\"** License-or-block matrices, pay-per-answer, agent-readable pages: content strategy for a machine-majority web. Peg: Cloudflare's Sept 15 default block.\n4. **\"The click is becoming a conversation.\"** Click-to-agent ads + 1M weekly Business Agents + Alexa+ conversion claims. Fresh POV territory on conversion paths.\n5. **\"Test Musk's link claim before adopting it.\"** Two weeks of links-in-post, publish the numbers, own the practical version of the conversation.\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
