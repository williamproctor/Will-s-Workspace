    initEditionApp(document.getElementById("editionApp"), {
      slug: "2026-10-19",
      editionTitle: "Week of October 19, 2026",
      editionMd: "# Monday Signal \u2014 Week of October 19, 2026\n\n> **Meta's new Commercial Terms, effective October 30, let it crawl websites associated with any business that uses its products; after publishers objected, Meta cut \"train\" from the US-English text on Friday and kept the crawl grant.** Google's Universal Cart went live in US Search and the Gemini app, Google's ad tests in AI Mode reached prescription-drug brands and people who connect their apps to Personal Intelligence, and Google Ads added channel priorities and caps, with the automated Display Network budget logic in Search campaigns ending in February 2027. On the feed, ChatGPT's week-long \"traffic drop\" turned out to be a missing tracking tag, the National Trust paused all its TikTok ads after AI-generated ones ran under its name, and a collage of nine identical go-back-to-Canva posts drew 2,026 reactions.\n\n---\n\n## The Conversation\n\n### ChatGPT's traffic drop was a missing tag, and the tags were back by Friday\n\nOn Tuesday evening, October 13, Pacific time, Cedric Huesler, who works on Adobe's brand-visibility products, posted Adobe telemetry on LinkedIn under the line \"ChatGPT didn't stop sending visitors. It stopped telling you it sent them\". Since Thursday, October 8, the day GPT-6 reached Free and Go users, inline links in ChatGPT answers had stopped carrying `utm_source=chatgpt.com`, and because they open with `noopener,noreferrer`, they passed no referrer either, so GA4 and Adobe Analytics filed the visits under Direct. He counted \"ChatGPT: \u221231k visits a day. Direct: +26k a day on the same pages.\" from \"4 days of data, sampled\". On Wednesday, Graphite CEO Ethan Smith posted a fall of about 45% in ChatGPT-attributed GA4 sessions, 22\u201357% per site, and noted, \"Sources panel and shopping links still carry the UTM. Inline links don't.\"\n\nHuesler's follow-up on Thursday said OpenAI had confirmed \"a known bug\" to him on Wednesday morning, that the fix began rolling out at about 2am PT Thursday, and that by 9am tagged ChatGPT clicks were \"back to roughly 95\u2013100% of the same hour a week ago\". Barry Schwartz updated Search Engine Roundtable's story the same day (\"UTMs are returning to the ChatGPT links - I guess it was a bug\"). Profound, which samples ChatGPT answers, dates the recovery later: 5\u201312% of answers carried a tagged link for about 27 hours from 19:00 UTC Wednesday, and about 99% did again from 06:30 UTC Friday. It adds that the fix \"does not automatically recover source information that was missing from earlier visits.\" OpenAI has made no public statement, and its release notes don't mention the bug. Adobe, Graphite and Profound all sell AI-visibility products or services, so these are vendor figures.\n\n**Comment window:** open through October reporting, since the dip sits inside every Q4 deck. Mark October 8\u201316 in the dashboards, report AI referrals as a floor, and check the tagged share before calling a trend in either direction.\n\n**Source:** [Huesler's first post](https://www.linkedin.com/posts/cedrichuesler_chatgpt-didnt-stop-sending-visitors-it-activity-7515970265852588033-KwRS) \u00b7 [Huesler's follow-up](https://www.linkedin.com/posts/cedrichuesler_relieved-it-was-a-bug-chatgpt-is-tagging-activity-7516558431894376448-7aEs) \u00b7 [Smith's post](https://www.linkedin.com/posts/ethanls_chatgpt-attributed-organic-sessions-in-ga4-activity-7516240304723787778-l9pV) \u00b7 [Profound's timeline](https://www.tryprofound.com/blog/chatgpt-missing-utm-tags) \u00b7 [Search Engine Roundtable, with Schwartz's update](https://www.seroundtable.com/utm-parameters-missing-chatgpt-42299.html) \u00b7 [ChatGPT release notes](https://help.openai.com/en/articles/6825453-chatgpt-release-notes) \u00b7 October 8\u201316, 2026\n\n### The National Trust paused all its TikTok ads after AI-generated ones ran under its name\n\nAn AI-generated National Trust membership ad ran on TikTok over the weekend of October 10\u201311, and on Monday, October 12, Alex Pollard of Pollard Media posted it to LinkedIn: \"I knew it was AI before I even saw the badge in the corner. The brushed text, awful accent lines, tacky look.\" Charlotte Anstee, a digital marketing executive at Ocean, asked, per Arts Professional, \"How does the National Trust go from climate change activism outside the Labour Party conference to running AI ads on TikTok a week later?\" The Trust answered in LinkedIn replies that Civil Society quoted on Tuesday: \"This was an automated feature from TikTok Ads which produced AI generated adverts in error,\" and \"We've now paused all our TikTok ads while we investigate how this happened.\" A spokesperson told Arts Professional the content \"was not part of the National Trust's approved creative,\" and Pollard added an edit calling it \"a perfect example of the TikTok ads feature catching out brands at the moment with automated ads they weren't expecting.\"\n\nOn Tuesday, Harri Brown, co-founder of Antler Social, posted a how-to that ends at a setting labeled \"Auto-add newly generated assets during delivery,\" with the instruction \"Make sure this is OFF to prevent AI generated versions of your content.\" Elania L. wrote that many of TikTok's AI features are \"turned on by default until you go looking for them.\" TikTok's Smart+ help page calls them \"optional\" and says advertisers can \"turn off Smart+ generated creatives in TikTok Ads Manager at any time\"; its API reference notes that \"Automatically added creatives are not included in the response.\" Civil Society, Third Sector and Arts Professional all say they asked TikTok for comment, and none carries a reply. Neither TikTok nor the Trust has named the exact feature.\n\n**Comment window:** open this week, while the Trust works \"directly with TikTok to understand how this occurred,\" as its spokesperson told Arts Professional. Check auto-generated creative settings on TikTok (and Advantage+ creative on Meta) before Q4 flights, and write \"no generated assets without sign-off\" into agency briefs.\n\n**Source:** [Civil Society](https://www.civilsociety.co.uk/news/national-trust-pauses-tiktok-ads-after-ai-content-error.html) \u00b7 [Arts Professional](https://www.artsprofessional.co.uk/news/national-trust-halts-tiktok-adverts-following-ai-error) \u00b7 [Third Sector](https://www.thirdsector.co.uk/national-trust-halts-tiktok-ads-false-ai-content-discovered/communications/article/1972498) \u00b7 [Pollard's post](https://www.linkedin.com/posts/ajepollard_come-on-national-trust-really-this-popped-activity-7515352817633636352-uR5f) \u00b7 [Brown's post](https://www.linkedin.com/posts/harri-brown-4a1425108_turn-off-ai-ads-on-tiktok-bc-activity-7515694429039476736-j_SE) \u00b7 [Elania L.'s post](https://www.linkedin.com/posts/elanial_turn-off-ai-ads-on-tiktok-bc-activity-7516090702204674048-tCQQ) \u00b7 [TikTok's Smart+ help page](https://ads.tiktok.com/resources/help/article/about-smart-plus-campaign) \u00b7 [TikTok's API reference](https://business-api.tiktok.com/portal/docs/get-upgraded-smart-ads/v1.3) \u00b7 October 11\u201314, 2026\n\n### Nine LinkedIn creators posted the same \"go back to Canva\" complaint, all tagging Canva\n\nOn Tuesday, October 13, Navin Watumull posted a collage of nine near-identical LinkedIn posts telling people to stop making flyers with ChatGPT and go back to Canva, every one of them tagging Canva, under the caption \"Nothing brings LinkedIn creators together like having the exact same original thought\". It had 2,026 reactions and 624 comments when indexed. The earliest version found dates from August 8 and says ChatGPT flyers \"just look cheap and lazy\"; Antea Camilleri's October 4 version drew 439 reactions, and Kendall Sarkar posted another copy on the evening of October 13.\n\nCommenters split over whether it was a campaign or a copycat trend. \"100% an ad campaign,\" Anthony Muhye wrote. \"Hardly anyone tags companies when they write a post (because of potential reach penalties), and the fact that they *all* tagged Canva is a red flag.\" Yashna Jhamb read it the other way: \"One person's post went viral, so the rest copied and followed. Very common on LinkedIn now.\" Walter Akolo's reply drew 44 reactions: \"Calling AI content lazy while copying the complaint word for word is quite a choice.\" BuzzInContent, which identifies Watumull as a marketing manager at Adobe, a Canva competitor, said it \"could not independently verify whether this is a seeded campaign by Canva.\" Canva hasn't responded, and nobody has shown a payment.\n\n**Comment window:** closing; the collage peaked October 13\u201315. If any money changed hands, each of the nine posts would need a paid-partnership label, and brands that brief creators should put that requirement in writing.\n\n**Source:** [Watumull's post](https://www.linkedin.com/posts/navinwatumull_nothing-brings-linkedin-creators-together-activity-7515789051933921280-jewi) \u00b7 [The August 8 version](https://www.linkedin.com/feed/update/urn:li:activity:7491669598610780160) \u00b7 [Camilleri's version](https://www.linkedin.com/posts/camilleriantea_my-eyes-hurt-whenever-i-see-flyers-and-ads-activity-7512477803980840960-0GIE) \u00b7 [Sarkar's version](https://www.linkedin.com/posts/kendall-sarkar-6bb104128_graphicdesign-canva-aidesign-activity-7515903122809171968--a1q) \u00b7 [BuzzInContent](https://www.buzzincontent.com/influencer-marketing/organic-opinion-or-paid-promotion-nine-creators-spark-debate-with-similar-canva-vs-chatgpt-posts-12678979) \u00b7 August 8\u2013October 15, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and stages where the week's arguments actually happened.\n\n- **Cedric Huesler, brand visibility products, Adobe** (LinkedIn, October 15): \"Keep counting the UTM, not the referrer. The referrer is still missing on most ChatGPT clicks, so the UTM is what you can rely on.\" [The post](https://www.linkedin.com/posts/cedrichuesler_relieved-it-was-a-bug-chatgpt-is-tagging-activity-7516558431894376448-7aEs)\n- **Ethan Smith, CEO, Graphite** (LinkedIn, October 14): \"I would use this opportunity to push for an attribution survey if you don't have one (ask 'how did you hear about us' post-signup).\" [The post](https://www.linkedin.com/posts/ethanls_chatgpt-attributed-organic-sessions-in-ga4-activity-7516240304723787778-l9pV)\n- **Alex Pollard, managing director, Pollard Media** (LinkedIn, October 12): \"People don't like this stuff. AI creatives are not well received, and audiences are increasingly going out of their way to call it out and turn against it. It doesn't build trust, it chips away at it.\" [The post](https://www.linkedin.com/posts/ajepollard_come-on-national-trust-really-this-popped-activity-7515352817633636352-uR5f)\n- **Charlotte Anstee, digital marketing executive, Ocean** (LinkedIn, quoted October 13): \"People are getting more and more savvy as to what AI looks like, and if you are a values-led brand like this, it's never worth cutting corners.\" [Via Civil Society](https://www.civilsociety.co.uk/news/national-trust-pauses-tiktok-ads-after-ai-content-error.html)\n- **Theo Bamber, CEO, News Media Association** (statement, October 16): \"This shameless landgrab attempt from Meta to scrape anything and everything from news publishers and business websites to train their AI products is the worst kind of arrogant tech platform bullying\" [Via Nieman Lab](https://www.niemanlab.org/2026/10/legal-experts-warn-metas-new-terms-still-grant-broad-scraping-permissions-despite-language-changes/)\n- **Andy Stone, vice president of communications, Meta** (X, October 16): \"This update is designed to make sure we're able to pull accurate information about products for sale on third-party websites when making on-platform ad and content recommendations, not about scraping news sites.\" [Via The Verge](https://www.theverge.com/tech/1012846/meta-business-terms-scrape-news-publishers)\n- **James Grimmelmann, professor of digital and information law, Cornell Law School** (Nieman Lab, October 17), on the rewrite: \"While it adds more language about the permitted uses, [the] 'develop\u2026advertising and business products' [language] is still broad enough to drive a truck through.\" [Nieman Lab](https://www.niemanlab.org/2026/10/legal-experts-warn-metas-new-terms-still-grant-broad-scraping-permissions-despite-language-changes/)\n- **Danielle Coffey, president and CEO, News/Media Alliance** (Nieman Lab, October 17): \"The company's decision to withhold access to its audience unless businesses allow Meta to scrape content from their websites is an appalling, bad-faith policy, and a clear abuse of the company's market power\" [Nieman Lab](https://www.niemanlab.org/2026/10/legal-experts-warn-metas-new-terms-still-grant-broad-scraping-permissions-despite-language-changes/)\n- **Tal Akabas, product manager, Google Ads** (*Ads Decoded* Ep. 7, October 15): \"These controls are just additional guardrails to help you feel more comfortable with how your budget is being spent across campaigns\" [Audio](https://sphinx.acast.com/p/open/s/696fd5e36544003fe9fb3a25/e/6ad1bff05f788808a78a3327/media.mp3) \u00b7 [Transcript](https://exa.ai/library/podcast/q26ncc29sml/episode/0l7t4pkwj9r)\n- **Hannah Bozian, VP of agentic partnerships and strategy, American Express** (TechCrunch, October 13): \"Our approach differs from the implementations of others in that it pulls intent earlier into the transaction flow. And this is important because it helps mitigate some risk before the risk occurs\" [TechCrunch](https://techcrunch.com/2026/10/13/amex-introduces-a-framework-to-prevent-ai-agents-from-making-unauthorized-purchases/)\n\n---\n\n## This Week in Marketing AI\n\n### Meta's October 30 terms let it crawl business users' websites; a Friday rewrite cut \"train\" from the US text\n\nMeta notified business users in early October that new Commercial Terms take effect on Friday, October 30, and on Thursday, October 15, Nieman Lab reported what the crawling clause says. Business users authorize Meta to \"use automated software (such as web scrapers, bots, robots, spiders, crawlers, and user agents) and create test credentials\" to crawl the domains and pages \"associated with your products or services,\" and the next sentence read, \"Meta may use any content from such domains, web pages, or URLs to provide, develop, improve, research, train, and maintain the integrity of\" Meta's products. There's no opt-out; the notice says, \"If you do not agree to the updated terms, please stop all access or use of our Products for business or commercial purposes.\" Cornell's James Grimmelmann told Nieman Lab the test credentials could technically let Meta \"sign up as a fake user\" to get past registration walls, and Meta declined to say whether they would be used to get past paywalls.\n\nJason Kint of Digital Content Next started a five-post X thread on Thursday evening, US time, and wrote on Bluesky, \"So every biz. Read that again.\" On Friday, Meta's vice president of communications, Andy Stone, replied on X: \"This is false. There's no change to how Meta uses web crawlers.\" The UK's News Media Association called the terms a \"shameless landgrab attempt\" the same day. That afternoon Meta removed \"train\" from the US-English text and limited the uses to \"advertising and business products.\" On Saturday it said \"it wasn't clear in the initial consolidation of terms that robots.txt preferences are respected.\" The crawl grant, the test credentials and the \"associated with\" scope stayed, and the clause still doesn't mention robots.txt. Matt Topic of Loevy & Loevy told Nieman Lab, \"I think 'develop' is broad enough to include 'train.'\" The UK-English previews still said \"train\" on Saturday (elsop) and the French ones on Sunday morning (MACCUS); Meta hasn't said which language edition governs whom.\n\nCrawl-for-training wasn't new for advertisers. Nieman Lab describes the current terms as allowing crawling only under the Ad Creative Generative AI Terms, but SEJ's Matt Southern points out that the Self-Serve Ad Terms, dated August 22, 2025, already let Meta crawl an advertiser's domains after an ad order, for uses including \"research and training.\" From October 30 the grant attaches to any business use, including a business that only manages a Facebook Page and never buys ads, and it reaches any site \"associated with\" the business's products. SEJ reads Meta's crawler documentation as listing Meta-ExternalAgent for training and indexing, Meta-WebIndexer for Meta AI search, and two fetchers, Meta-ExternalFetcher and FacebookExternalHit, that may bypass robots.txt. No regulator has acted; the European Publishers Council said it would petition the European Commission and EU telecoms regulators.\n\n*Editor's note, added at publication on October 20: SEJ still found \"train\" in the UK-English preview of the Self-Serve Ad Terms on Monday, October 19; on Tuesday, Relevant Audience was served the revised wording, with no \"train,\" on the UK-English previews of both the Commercial Terms and the Self-Serve Ad Terms. The crawl grant and the test credentials remain. [Relevant Audience](https://www.relevantaudience.com/meta/meta-commercial-terms-removes-train-keeps-crawling-clause/) \u00b7 [SEJ, October 19](https://www.searchenginejournal.com/meta-removes-training-crawl-clause-commercial-terms/593584/)*\n\n**Source:** [Nieman Lab, October 15](https://www.niemanlab.org/2026/10/metas-new-commercial-terms-will-allow-the-scraping-of-news-sites-legal-experts-say/) \u00b7 [Nieman Lab on the rewrite, October 17](https://www.niemanlab.org/2026/10/legal-experts-warn-metas-new-terms-still-grant-broad-scraping-permissions-despite-language-changes/) \u00b7 [Search Engine Journal on what's new](https://www.searchenginejournal.com/metas-new-terms-expand-crawling-rights-beyond-advertisers/593217/) \u00b7 [The Verge, with Stone's post](https://www.theverge.com/tech/1012846/meta-business-terms-scrape-news-publishers) \u00b7 [PPC Land, with Kint's thread](https://ppc.land/metas-new-terms-let-it-crawl-business-websites-to-train-ai-from-oct-30/) \u00b7 [Kint on Bluesky](https://bsky.app/profile/kint.bsky.social/post/3mxxfvj62sk2c) \u00b7 [elsop on the UK text](https://www.elsop.com/meta-commercial-terms-train-removed/) \u00b7 [MACCUS on the French text](https://maccus.fr/en/meta-drops-ai-training-clause/) \u00b7 October 15\u201318, 2026\n\n### Google's Universal Cart went live in the US; Meta adds in-app product browsing to existing ads on October 28\n\nOn Thursday, October 15, Google said, \"Today, Universal Cart is rolling out in the U.S. across Google Search and in the Gemini app.\" The cart holds products from multiple retailers and sends price-drop and back-in-stock alerts. Shoppers can check out with Google Pay inside the cart at many stores or transfer the items to the merchant's own cart. Google names \"Nike, Sephora, Target, Ulta Beauty, Walmart, Wayfair, and many Shopify merchants,\" and says merchants \"will remain the seller of record.\" YouTube and Gmail, which Google's I/O post in May said would come later, aren't part of the launch, per SEJ.\n\nSEJ's Matt Southern, reading the merchant guide, notes, \"This first release is one-way and covers cart creation and transfer only.\" The UCP Analytics dashboard tracks Buy-button clicks through purchases and cancellations, and the Merchant API (in alpha) adds cart-transfer metrics, but \"None of these pages list a metric for products saved to a cart.\" For Shopify stores, where direct checkout in AI Mode is on by default and Google Analytics and custom pixels don't fire (covered here September 28), SEJ \"could not determine if in-cart purchases are handled with the same checkout process as purchases completed through Direct Checkout.\"\n\nMeta's notice to advertisers, circulating from about October 14, reads, \"Starting October 28, 2026, we'll add product browsing to your existing ads.\" When people tap an ad, they \"may see an experience on Facebook or Instagram with product info and personalized suggestions\" before reaching the advertiser's site. Meta cites \"3% more conversions\" from its own experiment, run August 6\u201321 across about 117,700 advertisers. The notice says, \"Don't want this? Opt out before October 28, 2026 below,\" and a per-ad toggle in Advantage+ Creative and Destination settings works after that date. Relevant Audience found no Meta help-center, changelog or newsroom page on the change, and the notice doesn't say whether new ads will default on. MediaPost's Laurie Sullivan notes that the feature puts an extra click between the ad and the advertiser's website.\n\n**Source:** [Google's post](https://blog.google/products-and-platforms/products/shopping/universal-cart-launch/) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/google-universal-cart-store-handoff/593145/) \u00b7 [Google's UCP analytics guide](https://developers.google.com/merchant/ucp/guides/tools/merchant-center/analytics) \u00b7 [Relevant Audience, with Meta's notice](https://www.relevantaudience.com/meta/meta-product-browsing-existing-ads-october-28/) \u00b7 [MediaPost](https://www.mediapost.com/publications/article/418790/meta-wants-to-take-performance-through-purchase.html) \u00b7 October 14\u201316, 2026\n\n### Google's ad tests in AI Mode reached drug brands and Personal Intelligence users\n\nAdweek's Trishla Ostwal reported on Monday, October 12, that Google is testing prescription-drug ads in AI Mode and AI Overviews in the US, as standard text and Shopping ads in \"Sponsored\" sections. Google told Adweek, \"We're testing standard text and Shopping ads in AI Mode and AI Overviews, which we recently expanded to include certain pharmaceutical products.\" Adthena, a search-ad intelligence vendor, says it captured an Eli Lilly help-seeking ad for an oral GLP-1 on October 11, on the query \"glp-1 medication,\" after finding no prescription brands among 50,000 August placements, and notes that Google Ads doesn't report AI Mode placements separately. Search Engine Roundtable found no recent change to Google's healthcare policy and didn't see the ads itself.\n\nOn Friday, Search Engine Land reported that Google is testing ads in AI Mode for people who have Personal Intelligence turned on. In March, Google had told SEL's Anu Adegbola, \"There are currently no ads for people who choose to connect their apps with AI Mode. That isn't changing right now.\" The help page now says, \"Ads will not be based directly on your Gmail inbox or your Google Photos library,\" but the \"summaries, excerpts and inferences\" Search may reference from connected apps \"may be used to show you ads, so they are even more helpful for you.\" Sensitive categories are excluded.\n\nOn Thursday, Google's Hema Budaraju wrote that Google has \"made continued and substantial increases to the presence of inline links in our AI experiences\" and will show them \"higher up in responses more frequently,\" without giving a size for the increase. Google is also testing a block for \"official places,\" shown \"in a dedicated section at the top of a response.\" Search Engine Roundtable's headline said Google \"Won't Show Click Data,\" and Google told it, \"we'll introduce additional metrics over time.\" Search Console's generative AI performance report, open to all sites since August 31, shows impressions only.\n\n**Source:** [Adweek](https://www.adweek.com/media/google-opens-ai-mode-to-prescription-drug-ads/) \u00b7 [Search Engine Roundtable on the drug ads](https://www.seroundtable.com/google-ads-drugs-ai-mode-ai-overviews-42277.html) \u00b7 [Adthena](https://www.adthena.com/resources/blog/ai-mode-prescription-drug-ads/) \u00b7 [Search Engine Land](https://searchengineland.com/google-begins-testing-ads-in-ai-mode-for-users-with-personal-intelligence-enabled-496990) \u00b7 [Google Search Help](https://support.google.com/websearch/answer/16859283?co=GENIE.Platform%3DiOS&hl=en) \u00b7 [Google on inline links](https://blog.google/products-and-platforms/products/search/updates-ai-mode-overviews-explore-web/) \u00b7 [Search Engine Roundtable on click data](https://www.seroundtable.com/google-updates-links-in-ai-mode-and-ai-overviews-again-42308.html) \u00b7 [Search Console Help](https://support.google.com/webmasters/answer/16984139?hl=en) \u00b7 October 12\u201316, 2026\n\n### Google Ads added channel priorities and caps; Display Network logic in Search campaigns ends in February 2027\n\nOn Wednesday, October 14, Google announced, \"Say goodbye to all-or-nothing channel targeting.\" Advertisers mark each channel High or Low priority, and \"campaigns will fully fund high-priority channels (within their target when using Target CPA or Target ROAS) before allocating the remaining budget to lower-priority channels.\" Low-priority channels can take a daily percentage cap, applied \"On a best-effort basis.\" Performance Max and Demand Gen treat Search, YouTube, Maps, Gmail and Discover as one setting, \"Google channels.\" The help page says the controls arrive \"progressively\" from October 15, that budget allocation isn't supported in Demand Gen, that the settings can't be applied from a manager account, and that \"Support for the Google Ads API and Google Ads Editor is coming soon.\" Ginny Marvin, Google's ads product liaison, posted the same day on LinkedIn, \"Supported via Google Ads API at launch. Editor support coming soon.\" The two haven't been reconciled publicly.\n\nStarting in February 2027, per the help page, Search campaigns with Display Expansion \"will automatically migrate to channel prioritization and budget allocation,\" \"the current spend allocation setup will go away,\" and advertisers \"may see a shift in channel spending between Google Search, Search partners, and the Google Display Network.\" The Display Network will also stop serving on Search campaigns that bid on Target Impression Share. Google's post tells advertisers who use the Display Network to set it to \"Low priority\" with a 50% budget cap by February 2027 \"to maintain your existing configuration.\" On *Ads Decoded* Ep. 7, product manager Tal Akabas said \"None of your defaults will be changed with this launch,\" described today's setup as \"a backend mechanism that is effectively doing channel prioritization in the backend,\" and said \"the automated backend logic will be going away\". He put the switchover in the \"February, March timeframe next year\" and added, \"We're trying to get these controls out ahead of the holidays so you have them.\"\n\n**Source:** [Google's post](https://blog.google/products/ads-commerce/channel-prioritization-budget-allocation/) \u00b7 [Google Ads Help](https://support.google.com/google-ads/answer/18385152?hl=en) \u00b7 [Marvin's LinkedIn post](https://www.linkedin.com/posts/ginnymarvin_googleads-ppc-activity-7516161009955442688-Jb_6) \u00b7 [*Ads Decoded* Ep. 7 audio](https://sphinx.acast.com/p/open/s/696fd5e36544003fe9fb3a25/e/6ad1bff05f788808a78a3327/media.mp3) \u00b7 [Episode transcript](https://exa.ai/library/podcast/q26ncc29sml/episode/0l7t4pkwj9r) \u00b7 October 14\u201315, 2026\n\n### DataDome says Muse shops without identifying itself; Amex wants intent recorded before agents buy\n\nDataDome, which sells bot and agent management, published its Q3 AI Traffic Report on Thursday, October 15, from traffic on its own network. AI-agent requests grew 41.5% quarter on quarter, to nearly 25 billion from 17.7 billion, and Meta generated 12.4 billion of them (49.7%). Agentic-browser requests rose 4.7 times in September, to 58.2 million, and Meta's Muse, fully available only from September 22, accounted for 33% of the month's volume in nine days. \"Muse does not identify itself as an AI agent,\" the report says. In a traffic sample whose size it doesn't give, 99.3% of Muse's requests came from cloud and CDN infrastructure, and 8.9% touched forms, login, payment, account-creation or cart endpoints. \"Policies that trust residential or ISP-based traffic won't catch agents like this,\" said Jerome Segura, DataDome's VP of threat research. Amazon raised the same identification complaint when it blocked Muse on September 20.\n\nAmerican Express published an Intent Intelligence Framework on Tuesday, October 13, for recording a customer's purchase intent before an agent transacts. A Create Intent API captures the instructions and limits (merchant, maximum budget, product preferences), the customer authenticates and signs off, and an Intent ID and Proof of Intent Token then obtain a tokenized credential the agent uses at checkout in place of the card number. Hannah Bozian, VP of agentic partnerships and strategy, gave TechCrunch the example of a customer who asks for white Nike sneakers in size 9 and an agent that tries to buy Adidas, a purchase Amex could stop. Digital Commerce 360 reports no live integrations yet.\n\nDeloitte's holiday survey, published Thursday, polled 4,000 US consumers August 26\u2013September 10. On a base of 3,700 of them, \"39% say gen AI is their primary tool for at least one holiday shopping task, but only 16% would trust it to complete a purchase with their permission,\" and by Deloitte's calculations, shoppers who use all three of search, social media and gen AI plan to spend $2,893, against $1,175 for those who use none.\n\n**Source:** [DataDome's release](https://www.businesswire.com/news/home/20261015226683/en/DataDome-Report-Agentic-Browser-Traffic-Surged-Nearly-5x-in-a-Month-as-Metas-Muse-Arrived-Unannounced-From-the-Cloud) \u00b7 [TechCrunch on Amex](https://techcrunch.com/2026/10/13/amex-introduces-a-framework-to-prevent-ai-agents-from-making-unauthorized-purchases/) \u00b7 [Amex's release](https://finance.yahoo.com/technology/ai/articles/american-express-publishes-intent-intelligence-133000443.html) \u00b7 [Digital Commerce 360](https://www.digitalcommerce360.com/2026/10/16/american-express-ai-framework/) \u00b7 [Deloitte's survey report](https://www.deloitte.com/content/dam/insights/articles/2026/amer189387_cic_holiday-retail-survey/pdf/DI_2026-Holiday-Retail-Survey.pdf) \u00b7 October 13\u201316, 2026\n\n### ChatGPT's fan-out searches favor brand sites, Ahrefs found, and its Reddit citations fell 88%\n\nOn Monday, October 12, Ahrefs, which sells SEO and AI-visibility tools, published a study of 66.6 million free, logged-out GPT-5.6 Luna responses from August and September and their 15 million fan-out queries. Of those fan-outs, 6.8% used the `site:` operator, and 75.9% of the most common `site:` searches pointed at brand sites, against 11.9% for retailers and 1.9% for Reddit and Facebook combined. \"Official\" appeared in 13.1% of English fan-outs in September, up from 10.1% in August, and \"price\" rose from 6.04% to 8.88%. In a separate test of 20,000 US prompts, 84.4% of factual questions cited at least one official source. Ahrefs' citation data shows that \"ChatGPT's Reddit citations dropped 88% in six months,\" from about 1 in 5 answers in March to 1 in 43 by late September, and it concludes that \"ChatGPT seems to be moving from sites that summarize information to the sources that produce it.\" The data predate GPT-6 reaching free users; on Wednesday, David Konitzny posted that \"GPT-6 is becoming more critical of claims made by listicles and comparison pages.\"\n\nSemrush, \"an Adobe company\" that owns Search Engine Land, released its first UK AI Visibility Index on Tuesday, covering January\u2013July with fixed monthly sets of 2.5 million UK and 25 million US prompts across ChatGPT, Gemini and Google AI Mode, plus Google AI Overviews results. Fewer than half of the top 100 mentioned brands also appear among the top 100 cited domains. Tesco and Asda stayed among the top 100 mentioned brands on all four platforms every month, \"Yet in July, Tesco ranked as ChatGPT's 25th most-cited UK domain, while Asda ranked 606th\" (on Gemini, 29th and 60th).\n\nAlso on Tuesday, Bing Webmaster Tools added Topics Portfolio (beta) to its AI Performance report. It groups the grounding queries where a site appears into topic clusters, and a Top Opportunity Queries list shows strong queries where other sites appear and yours doesn't, with citation volumes as ranges. Bing asks users to \"Treat the numbers as directional signals for planning, not as a precise ledger.\"\n\n**Source:** [Ahrefs](https://ahrefs.com/blog/query-fan-out-chatgpt/) \u00b7 [Konitzny's post](https://www.linkedin.com/posts/davidkonitzny_gpt-6-is-becoming-more-critical-of-claims-activity-7516052719749664768-f8NK) \u00b7 [Semrush's release](https://www.semrush.com/news/474244-semrush-releases-2026-ai-visibility-index-revealing-its-first-uk-benchmark/) \u00b7 [Bing Webmaster blog](https://blogs.bing.com/webmaster/2026/10/introducing-topics-portfolio-beta-in-ai-performance/) \u00b7 October 12\u201314, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via Search Engine Roundtable's daily recaps for [October 12](https://www.seroundtable.com/recap-10-12-2026-42274.html), [13](https://www.seroundtable.com/recap-10-13-2026-42284.html), [14](https://www.seroundtable.com/recap-10-14-2026-42300.html), [15](https://www.seroundtable.com/recap-10-15-2026-42309.html) and [16](https://www.seroundtable.com/recap-10-16-2026-42318.html) and its [weekly video recap](https://www.seroundtable.com/video-09-16-2026-42313.html), [Anicca's weekly roundup](https://anicca.co.uk/blog/2026-10-19-ai-in-marketing-management/), Agency AEO's [The Shift](https://agencyaeo.com/insights/the-shift-october-19-2026/), [woozeer's weekly update](https://woozeer.com/ai-news/ai-update-2026-10-19), and [Silverback's weekly roundup](https://silverbackmarketing.com/seo-geo-ai-visibility-weekly-roundup-oct12-16).*\n\n- **ChatGPT Ads account managers** (Wednesday): an email from Warren Smith at OpenAI, shared by Anthony Higman Thursday, adding Axios, CNN, the Financial Times and Forbes along with local outlets such as the Post and Courier and the Texas Tribune. \"Through this licensing program, we pay participating news publications for the delivery and use of enhanced content to develop new AI features,\" Google says; Reuters reports the terms weren't disclosed. It's a separate program from Search Console's AI contribution pilot. [Google](https://blog.google/products-and-platforms/products/news/news-ai-pilot-update-publishers/) \u00b7 [Reuters via StreetInsider](https://www.streetinsider.com/Reuters/CNN%2C+Axios+and+other+publishers+join+Googles+AI+news+program/27192469.html)\n- **Rank trackers, week two.** On Wednesday, SEJ's Roger Montti found in Nozzle's data that poisoned pages showed AI Overviews 34.9% of the time against 54.2% at baseline, and on Friday SE Ranking posted on X that the issue \"still affects roughly 2% of tracked results, and that share continues to shrink.\" Google hasn't commented. [Search Engine Journal](https://www.searchenginejournal.com/analysis-google-is-poisoning-search-results-for-rank-trackers/592873/) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/third-party-google-rank-tracking-broken-42272.html)\n- **Q3 numbers before the holidays.** Publicis grew 5% organically and Havas 2.4%, and Omnicom reports on October 22. JPMorgan's CFO said debit and credit spend \"grew 10% year-on-year,\" and Bank of America reported \"Combined credit / debit card spend of $266 billion, up 8%\". Deloitte's survey puts expected household holiday spending at $1,654, up 4%. [Publicis](https://publicisgroupe.com/en/news/press-releases/publicis-groupe-third-quarter-2026-revenue) \u00b7 [Havas](https://www.havas.com/press_release/havas-reports-solid-net-revenue-growth-of-7-2-in-q3-2026-driven-by-organic-growth-and-contribution-from-acquisitions/) \u00b7 [Omnicom](https://investor.omc.com/news/news-details/2026/Omnicom-Schedules-Third-Quarter-2026-Earnings-Release-and-Conference-Call/default.aspx) \u00b7 [JPMorgan's call transcript](https://www.jpmorganchase.com/content/dam/jpmc/jpmorgan-chase-and-co/investor-relations/documents/quarterly-earnings/2026/3rd-quarter/3q26-earnings-transcript.pdf) \u00b7 [Bank of America](https://investor.bankofamerica.com/regulatory-and-other-filings/select-sec-filings/content/0000070858-26-000481/bac09302026ex991.htm)\n- **GEO funding, as the companies report it.** London's Obsero raised a \u20ac1 million seed round led by SFC Capital \"alongside several of Obsero's own customers,\" and Miracly launched with a \u20ac1.8 million pre-seed round led by Beenext Ventures and Lotus for a platform that combines GEO, marketing analytics and automated execution. [EU-Startups](https://www.eu-startups.com/2026/10/londons-obsero-raises-e1-million-to-help-brands-improve-visibility-in-ai-powered-search/) \u00b7 [Tech.eu](https://tech.eu/2026/10/14/miracly-launches-with-eur18m-to-automate-ai-powered-marketing/)\n- **Smaller tests and docs.** Google Ads is testing a \"Search terms and ad combinations\" report, opened a Vehicle Top Ads beta, shipped API v26 and moved to API releases twice a month; the Google app is testing a search bar that reads \"Ask Google.\" Microsoft's documentation describes Performance Max drafts built from a \"business snapshot,\" with no launch date. [PPC News Feed on the Microsoft docs](https://ppcnewsfeed.com/ppc-news/2026-10/microsoft-builds-pmax-draft-from-business-snapshot/)\n\n---\n\n## Common Threads\n\n### Default settings came with dates this week\n\nMeta adds product browsing to existing ads on October 28 unless advertisers opt out, its terms bind any business still using its products on October 30, and Search campaigns with Display Expansion move to channel priorities in February 2027. On TikTok, an automated feature produced AI ads under the National Trust's name \"in error,\" by the Trust's account.\n\n### Attribution runs on tags the platforms control\n\nFor a week, ChatGPT's inline links dropped the `utm_source` tag the channel is measured by, and the visits landed in Direct. Google added inline links without click data, Universal Cart's dashboard counts Buy clicks and transfers but not saves, and DataDome says Muse doesn't identify itself to the sites it shops.\n\n### Access to content was set by contract and by license\n\nMeta wrote crawling into terms that every business accepts by using its products after October 30, and Google pays more than 400 publications for \"the delivery and use of enhanced content to develop new AI features.\" Meta also generated 49.7% of the AI-agent requests DataDome counted on its network in Q3.\n\n### ChatGPT reaches for first-hand pages\n\nAhrefs found brand sites behind 75.9% of ChatGPT's most common `site:` fan-outs and an official source in 84.4% of answers to factual questions, and Google is testing an \"official places\" block at the top of AI answers. Semrush ranks Tesco 25th and Asda 606th among ChatGPT's most-cited UK domains, though both are top-100 mentioned brands.\n\n---\n\n## Angles for the Week\n\n### Mark October 8\u201316 in every AI-referral report\n\nChatGPT's inline links lost their tag from October 8 until the fix on October 15\u201316, the visits landed in Direct, and Profound says the fix doesn't restore the missing source data. The post shows how to annotate the gap, report AI referrals as a floor, count the UTM over the referrer, and add a \"how did you hear about us\" field to signup. Window: October reporting and Q4 decks, now.\n\n### Read Meta's terms, and your robots.txt, before October 30\n\nAny business that keeps a Page or an ad account after October 30 accepts a clause that lets Meta crawl sites \"associated with\" its products, with test credentials. The explainer covers what the US and UK texts say, which Meta crawlers a robots.txt file can name (Meta-ExternalAgent, Meta-WebIndexer, and the two fetchers that may bypass it), and who in the business signs off. Window: before October 30.\n\n### Check three defaults before October 28\n\nTikTok's \"Auto-add newly generated assets during delivery,\" Meta's product browsing in existing ads (opt out before October 28 or use the per-ad toggle), and Google's channel priorities in Performance Max, Demand Gen and Search, with the Display Network setting decided before February. The audit post lists where each switch lives and who owns it on the account. Window: before October 28 and holiday code freezes.\n\n### ChatGPT searches brand sites by name; publish the page it's looking for\n\nAhrefs found brand sites behind 75.9% of ChatGPT's most common `site:` fan-outs, with \"official\" and \"price\" rising in its queries. The post covers putting prices, specs and policies on pages you own, checking Semrush's mention-versus-citation gap for your category, and rerunning the check once GPT-6 data arrives. Window: before holiday traffic peaks.\n\n### Universal Cart moves the cart into Google; count what you can\n\nUniversal Cart saves products from many retailers inside Google Search and Gemini, transfers carts one way, and reports Buy clicks, purchases and transfers but not saves. The post covers server-side reconciliation, whether Shopify's Direct Checkout (which doesn't fire GA4) handles in-cart purchases, and which Merchant API cart-transfer metrics to pull while that API is in alpha. Window: Black Friday prep, now.\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [Cedric Huesler \u2014 LinkedIn post, \"ChatGPT didn't stop sending visitors\"](https://www.linkedin.com/posts/cedrichuesler_chatgpt-didnt-stop-sending-visitors-it-activity-7515970265852588033-KwRS) \u2014 October 13, 2026 (Pacific) \u2014 Adobe telemetry, the missing tag and referrer, the \u221231k and +26k figures\n2. [Cedric Huesler \u2014 LinkedIn follow-up, \"Relieved. It was a bug.\"](https://www.linkedin.com/posts/cedrichuesler_relieved-it-was-a-bug-chatgpt-is-tagging-activity-7516558431894376448-7aEs)       simplifiedMd: "# Monday Signal \u2014 Week of October 19, 2026\n\n> **Meta's new Commercial Terms, effective October 30, let it crawl websites associated with any business that uses its products; after publishers objected, Meta cut \"train\" from the US-English text on Friday and kept the crawl grant.** Also: Google's Universal Cart went live in US Search and the Gemini app, Google's AI Mode ad tests reached drug brands and Personal Intelligence users, and the automated Display Network logic in Google Ads Search campaigns ends in February 2027. ChatGPT's \"traffic drop\" was a missing tag, the National Trust paused all its TikTok ads after AI-generated ones ran under its name, and nine LinkedIn creators posted the same Canva complaint.\n\n---\n\n## The Conversation\n\n### ChatGPT's traffic drop was a missing tag\n\nFrom Oct 8, inline links in ChatGPT answers lost `utm_source=chatgpt.com` and passed no referrer, so the visits landed in Direct. Cedric Huesler of Adobe (LinkedIn, Oct 13): \"ChatGPT didn't stop sending visitors. It stopped telling you it sent them\". Graphite's Ethan Smith put the GA4 drop at about 45%. Huesler says OpenAI confirmed \"a known bug\" to him (OpenAI hasn't said so publicly); tags returned Oct 15 by his telemetry and Oct 16 by Profound's, and Profound says the fix \"does not automatically recover source information that was missing from earlier visits.\" All three companies sell AI-visibility products. Mark Oct 8\u201316 and report AI referrals as a floor. [Huesler's post](https://www.linkedin.com/posts/cedrichuesler_chatgpt-didnt-stop-sending-visitors-it-activity-7515970265852588033-KwRS) \u00b7 [Profound](https://www.tryprofound.com/blog/chatgpt-missing-utm-tags)\n\n### The National Trust paused its TikTok ads after AI ads ran under its name\n\nAn AI-generated National Trust membership ad ran on TikTok Oct 10\u201311, and Alex Pollard posted it Oct 12 (\"I knew it was AI before I even saw the badge in the corner.\"). The Trust: \"This was an automated feature from TikTok Ads which produced AI generated adverts in error,\" and it paused all its TikTok ads. Practitioners pointed to the \"Auto-add newly generated assets during delivery\" setting; TikTok's help page calls its creative AI features \"optional,\" and the outlets that asked TikTok for comment carry no reply. Check auto-generated creative settings before Q4 flights. [Civil Society](https://www.civilsociety.co.uk/news/national-trust-pauses-tiktok-ads-after-ai-content-error.html) \u00b7 [TikTok's help page](https://ads.tiktok.com/resources/help/article/about-smart-plus-campaign)\n\n### Nine LinkedIn creators posted the same \"go back to Canva\" complaint\n\nNavin Watumull's Oct 13 collage of nine near-identical posts, all tagging Canva, ran under the caption \"Nothing brings LinkedIn creators together like having the exact same original thought\" and had 2,026 reactions when indexed; the earliest version found dates from Aug 8. Commenters split between \"100% an ad campaign\" and a copycat trend. BuzzInContent, which identifies Watumull as an Adobe marketing manager, \"could not independently verify whether this is a seeded campaign by Canva,\" and Canva hasn't responded. If money changed hands, each post would need a paid-partnership label. [Watumull's post](https://www.linkedin.com/posts/navinwatumull_nothing-brings-linkedin-creators-together-activity-7515789051933921280-jewi) \u00b7 [BuzzInContent](https://www.buzzincontent.com/influencer-marketing/organic-opinion-or-paid-promotion-nine-creators-spark-debate-with-similar-canva-vs-chatgpt-posts-12678979)\n\n---\n\n## Voices\n\n- **Theo Bamber, News Media Association (statement, Oct 16):** \"This shameless landgrab attempt from Meta to scrape anything and everything from news publishers and business websites to train their AI products is the worst kind of arrogant tech platform bullying\" [Via Nieman Lab](https://www.niemanlab.org/2026/10/legal-experts-warn-metas-new-terms-still-grant-broad-scraping-permissions-despite-language-changes/)\n- **Andy Stone, Meta (X, Oct 16):** the update is meant to \"pull accurate information about products for sale on third-party websites when making on-platform ad and content recommendations, not about scraping news sites.\" [Via The Verge](https://www.theverge.com/tech/1012846/meta-business-terms-scrape-news-publishers)\n- **Charlotte Anstee, Ocean (LinkedIn, quoted Oct 13):** \"if you are a values-led brand like this, it's never worth cutting corners.\" [Via Civil Society](https://www.civilsociety.co.uk/news/national-trust-pauses-tiktok-ads-after-ai-content-error.html)\n- **Cedric Huesler, Adobe (LinkedIn, Oct 15):** \"Keep counting the UTM, not the referrer.\" [The post](https://www.linkedin.com/posts/cedrichuesler_relieved-it-was-a-bug-chatgpt-is-tagging-activity-7516558431894376448-7aEs)\n\n---\n\n## This Week in Marketing AI\n\n### Meta's October 30 terms let it crawl business users' sites; the US text lost \"train\" on Friday\n\nOn Oct 15, Nieman Lab reported that Meta's new terms let it crawl sites \"associated with your products or services,\" with test credentials, and that the only alternative is to \"stop all access or use of our Products for business or commercial purposes.\" On Friday, after publishers objected, Meta removed \"train\" from the US-English text and kept the crawl grant and its scope. SEJ notes that advertisers already allowed crawling for \"research and training\" under the ad terms; from Oct 30 any business use triggers the grant, even a Facebook Page alone. *Editor's note (Oct 20): Relevant Audience found \"train\" gone from the UK-English previews on Oct 20, a day after SEJ still saw it there.* [Nieman Lab](https://www.niemanlab.org/2026/10/metas-new-commercial-terms-will-allow-the-scraping-of-news-sites-legal-experts-say/) \u00b7 [SEJ](https://www.searchenginejournal.com/metas-new-terms-expand-crawling-rights-beyond-advertisers/593217/) \u00b7 [Relevant Audience](https://www.relevantaudience.com/meta/meta-commercial-terms-removes-train-keeps-crawling-clause/)\n\n### Google's Universal Cart went live; Meta adds product browsing to existing ads Oct 28\n\nUniversal Cart rolled out Oct 15 in US Search and the Gemini app, with Google Pay checkout at many stores or a one-way transfer to the merchant, which will \"remain the seller of record\"; SEJ found that \"None of these pages list a metric for products saved to a cart.\" Meta told advertisers, \"Starting October 28, 2026, we'll add product browsing to your existing ads,\" citing \"3% more conversions\" in its own test; opt out before Oct 28, or per ad after. [Google](https://blog.google/products-and-platforms/products/shopping/universal-cart-launch/) \u00b7 [SEJ](https://www.searchenginejournal.com/google-universal-cart-store-handoff/593145/) \u00b7 [Relevant Audience](https://www.relevantaudience.com/meta/meta-product-browsing-existing-ads-october-28/)\n\n### Google's AI Mode ad tests reached drug brands and Personal Intelligence users\n\nGoogle told Adweek on Oct 12 that its ad test in AI Mode and AI Overviews was \"recently expanded to include certain pharmaceutical products.\" On Oct 16, SEL reported ads for Personal Intelligence users; in March Google had said there were no ads for people who connect their apps, and \"That isn't changing right now.\" Google is also moving inline links \"higher up in responses more frequently\" and told SER, \"we'll introduce additional metrics over time.\" [Adweek](https://www.adweek.com/media/google-opens-ai-mode-to-prescription-drug-ads/) \u00b7 [SEL](https://searchengineland.com/google-begins-testing-ads-in-ai-mode-for-users-with-personal-intelligence-enabled-496990) \u00b7 [SER](https://www.seroundtable.com/google-updates-links-in-ai-mode-and-ai-overviews-again-42308.html)\n\n### Google Ads added channel priorities; Display on Search changes in February 2027\n\nOct 14: \"Say goodbye to all-or-nothing channel targeting.\" Advertisers mark channels High or Low priority and can cap the Low ones. From February 2027, Search campaigns with Display Expansion \"will automatically migrate,\" and Google says to set the Display Network to \"Low priority\" with a 50% cap \"to maintain your existing configuration.\" The help page says API and Editor support is \"coming soon\"; Ginny Marvin posted, \"Supported via Google Ads API at launch.\" [Google](https://blog.google/products/ads-commerce/channel-prioritization-budget-allocation/) \u00b7 [Google Ads Help](https://support.google.com/google-ads/answer/18385152?hl=en) \u00b7 [Marvin's post](https://www.linkedin.com/posts/ginnymarvin_googleads-ppc-activity-7516161009955442688-Jb_6)\n\n### DataDome says Muse doesn't identify itself; Amex wants intent logged before agents buy\n\nDataDome, a bot-management vendor, said Oct 15 that AI-agent requests on its network rose 41.5% from Q2 to nearly 25 billion in Q3, 49.7% of them from Meta, and that \"Muse does not identify itself as an AI agent.\" Amex's framework (Oct 13) records a shopper's limits before an agent buys; Digital Commerce 360 reports no live integrations yet. Deloitte: \"39% say gen AI is their primary tool for at least one holiday shopping task, but only 16% would trust it to complete a purchase with their permission.\" [DataDome](https://www.businesswire.com/news/home/20261015226683/en/DataDome-Report-Agentic-Browser-Traffic-Surged-Nearly-5x-in-a-Month-as-Metas-Muse-Arrived-Unannounced-From-the-Cloud) \u00b7 [TechCrunch](https://techcrunch.com/2026/10/13/amex-introduces-a-framework-to-prevent-ai-agents-from-making-unauthorized-purchases/) \u00b7 [Deloitte](https://www.deloitte.com/content/dam/insights/articles/2026/amer189387_cic_holiday-retail-survey/pdf/DI_2026-Holiday-Retail-Survey.pdf)\n\n### ChatGPT's fan-outs favor brand sites, Ahrefs found; its Reddit citations fell 88%\n\nAhrefs, an SEO and AI-visibility tool vendor, found brand sites behind 75.9% of the most common `site:` fan-outs in GPT-5.6 Luna answers (August\u2013September, before GPT-6 reached free users), and \"ChatGPT's Reddit citations dropped 88% in six months.\" Semrush (\"an Adobe company\" that owns SEL) ranked Tesco 25th and Asda 606th among ChatGPT's most-cited UK domains in July, though both were top-100 mentioned brands. Bing's Topics Portfolio (beta) lists queries where other sites appear and yours doesn't. [Ahrefs](https://ahrefs.com/blog/query-fan-out-chatgpt/) \u00b7 [Semrush](https://www.semrush.com/news/474244-semrush-releases-2026-ai-visibility-index-revealing-its-first-uk-benchmark/) \u00b7 [Bing](https://blogs.bing.com/webmaster/2026/10/introducing-topics-portfolio-beta-in-ai-performance/)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's daily recaps](https://www.seroundtable.com/recap-10-16-2026-42318.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/2026-10-19-ai-in-marketing-management/).*\n\n- **ChatGPT Ads account managers** offer advertisers biweekly check-ins; OpenAI's FAQ says the product \"is currently in beta\". [SER](https://www.seroundtable.com/openai-chatgpt-ads-account-manager-42278.html)\n- **Gemini 4 Argon** went globally available Oct 13, including in the Gemini app and AI Mode for AI Pro and Ultra subscribers. [SEL](https://searchengineland.com/gemini-4-argon-rolling-out-in-google-ai-mode-gemini-495592)\n- **Demand Gen Drop:** advertisers who build data strength with Tag Gateway see \"over 20% conversion uplift,\" by Google's internal analysis. [Google](https://blog.google/products/ads-commerce/demand-gen-drop-october-2026/)\n- **LinkedIn In-Stream Ads** put pre-roll on creator and publisher content, in a test with select US creators and advertisers. [LinkedIn News](https://news.linkedin.com/2026/new-ways-to-build-meaningful-connections)\n- **Amazon's Bee Frontier ($74.99) and Bee Eclipse ($99.99)** can turn conversations into opt-in shopping suggestions with Bee Pro, per GeekWire. [About Amazon](https://www.aboutamazon.com/news/devices/amazon-personal-ai-bee-frontier-bee-eclipse) \u00b7 [GeekWire](https://www.geekwire.com/2026/amazons-new-ai-devices-can-listen-to-conversations-and-suggest-things-to-buy-if-you-opt-in/)\n- **Google's News AI pilot** passed 400 publications, including CNN, the FT, Axios and Forbes; Google pays for the content, and Reuters says the terms weren't disclosed. [Google](https://blog.google/products-and-platforms/products/news/news-ai-pilot-update-publishers/)\n- **Q3 results:** Publicis +5% organic, Havas +2.4%; JPMorgan card spend +10%, Bank of America +8%; Omnicom reports Oct 22. [Publicis](https://publicisgroupe.com/en/news/press-releases/publicis-groupe-third-quarter-2026-revenue)\n- **GEO funding** (company-stated): Obsero \u20ac1M seed, Miracly \u20ac1.8M pre-seed. [EU-Startups](https://www.eu-startups.com/2026/10/londons-obsero-raises-e1-million-to-help-brands-improve-visibility-in-ai-powered-search/) \u00b7 [Tech.eu](https://tech.eu/2026/10/14/miracly-launches-with-eur18m-to-automate-ai-powered-marketing/)\n\n---\n\n## Common Threads\n\n### Default settings came with dates this week\nMeta's product browsing starts Oct 28 unless you opt out, its terms bind business users Oct 30, and Display on Search migrates in February 2027.\n\n### Attribution runs on tags the platforms control\nChatGPT's missing UTM, Google's inline links without click data, a cart dashboard that doesn't count saves, and Muse, which DataDome says doesn't identify itself.\n\n### Access to content was set by contract and by license\nMeta's crawl clause covers every business user from Oct 30, Google pays 400+ publications for \"enhanced content,\" and Meta generated 49.7% of the AI-agent requests DataDome counted.\n\n### ChatGPT reaches for first-hand pages\nBrand sites behind 75.9% of top `site:` fan-outs, an \"official places\" test atop Google's AI answers, and Tesco 25th, Asda 606th among ChatGPT's most-cited UK domains.\n\n---\n\n## Angles for the Week\n\n- **Mark October 8\u201316 in every AI-referral report.** Annotate the gap, report AI referrals as a floor, and count the UTM over the referrer. Window: October reporting.\n- **Read Meta's terms, and your robots.txt, before October 30.** What the clause covers and which Meta crawlers robots.txt can name. Window: before Oct 30.\n- **Check three defaults before October 28.** TikTok's auto-add assets, Meta's product browsing, Google's channel priorities. Window: before Oct 28.\n- **ChatGPT searches brand sites by name; publish the page it's looking for.** Prices, specs and policies on pages you own. Window: before holiday traffic peaks.\n- **Universal Cart moves the cart into Google; count what you can.** Reconcile server-side; the dashboard doesn't count saves. Window: Black Friday prep.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
