    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of July 10, 2026\n\n> **The clearest AI adoption story this week came from Uber, where the company is pairing AI-proficient engineers with departmental experts in two-week \u201cAgentic Pods\u201d to observe, rebuild, validate, and ship entire workflows.** Uber CTO Praveen Neppalli Naga reported that 99 percent of its engineers use AI tools, more than 70 percent of pull requests are attributed to local or cloud agents, and 16 pods have already worked across 16 business functions. In media, **Runway launched Runway Dev**, a single enterprise platform for its own image and video models alongside third-party models. **Meta released Muse Image and previewed Muse Video** with native audio and clear caveats about remaining synchronization and motion gaps. **OpenAI moved GPT-5.6 from limited preview to general availability** and introduced ChatGPT Work for long-running tasks across applications and files. And **LucidLink connected Frame.io Camera-to-Cloud footage with the rest of an organization\u2019s production storage** without requiring media migration or duplication.\n\n---\n\n## This Week in AI\n\n### Uber\u2019s Agentic Pods Move AI Adoption From Individual Tasks to Departmental Workflows\n\nUber CTO **Praveen Neppalli Naga** published one of the most concrete large-organization AI adoption reports so far.\n\nThe headline figures are substantial. According to Naga:\n\n- **99 percent of Uber engineers use AI tools.**\n- **More than 70 percent of pull requests are attributed to local or cloud agents.**\n- Uber engineers have created **more than 2,500 agent skills** across the software development lifecycle.\n\nThose figures are company-reported and have not been independently audited, but the more useful part of the story is the operating model Uber developed after engineering adoption became widespread.\n\nUber wanted to move agentic AI into finance, legal, operations, marketing, customer support, HR, procurement, and other business functions. Its answer was a program called **Agentic Pods**.\n\nThe company selected approximately 30 AI-proficient engineers with deep knowledge of Uber\u2019s systems and paired each one with a domain expert from a business function. Every pod received two weeks:\n\n- **Days 1\u20132:** Shadow the expert, observe each step, document the workflow, and ask questions.\n- **Day 3:** Prioritize opportunities based on scale, repetition, business impact, and data availability.\n- **Days 4\u20135:** Build a working agent alongside the person doing the job.\n- **Days 6\u20139:** Validate it with additional people performing the same work.\n- **Day 10:** Ship.\n\nNaga said Uber ran 16 pods across 16 business functions in two months. He reported several examples:\n\n- Capital allocation analysis across 150 cities fell from **15 hours to 30 minutes**.\n- Financial pacing reports fell from **two days to 10 minutes**.\n- Marketing website quality assurance fell from **two weeks to 50 minutes**.\n- A support operation with **9,000 manually created workflows** moved to self-service automation.\n\nThe larger finding was not simply faster task completion. Naga said the biggest gains came from redesigning the workflow around AI: removing handoffs, reducing unnecessary approvals, replacing older tools, and connecting work across systems and teams.\n\nThat distinction is relevant to any department evaluating AI. A task can often be automated from a written instruction. A workflow is harder. It includes exceptions, judgment, file locations, approval patterns, unwritten conventions, and the practical knowledge held by the people doing the work. Uber\u2019s model places the technical builder beside the domain expert long enough to discover those details.\n\nFor AV departments, the parallel is visible in production workflows that cross intake, scheduling, asset preparation, recording, editing, review, captioning, metadata, publishing, archiving, and support. The Uber story does not establish that every workflow should become agentic. It shows one way a large organization is finding and testing opportunities from inside the work rather than from process diagrams alone.\n\n**Source:** [Praveen Neppalli Naga \u2014 Uber Agentic Pods](https://x.com/praveenTweets/status/2074605343439810922) \u00b7 [Business Insider \u2014 Uber\u2019s CTO bets on Agentic Pods](https://www.businessinsider.com/uber-cto-bets-on-agentic-pods-make-ai-more-efficient-2026-7) \u00b7 July 7, 2026\n\n### Runway Dev Turns Media Models Into an Enterprise Platform\n\nRunway launched **Runway Dev** on July 8, describing it as a media platform for developers and enterprise teams.\n\nThe central idea is a single API that provides first-party access to Runway models alongside third-party media models. At launch, the catalog includes:\n\n- **Runway Gen-4.5**\n- **Runway Aleph 2.0**\n- **Runway Act-Two**\n- **ByteDance Seedance**\n- **OpenAI GPT Image 2**\n- **ElevenLabs models**\n\nRunway says developers can change models by editing one line of code and track spending across models in one billing dashboard. The company is also introducing reusable **Recipes** for multi-step media workflows and says an intelligent routing layer is planned.\n\nThe enterprise controls are as important as the model list. Runway says the platform includes:\n\n- Contractual commitments not to train on customer data\n- Support for zero-data retention\n- Per-model cost visibility and team spending controls\n- SOC 2 Type II compliance\n- IP indemnification\n- Built-in content moderation\n- A 99.9 percent uptime commitment\n\nThese are vendor claims, but they show what generative-media infrastructure is now competing on. Image and video quality remain central, yet professional adoption also depends on data handling, retention, rights, reliability, cost visibility, and the ability to change models without rebuilding the whole application.\n\nRunway Dev also reflects a broader consolidation pattern. The platform is no longer presenting one model as the answer to every media task. It is presenting a controlled layer where different models can be selected for generation, editing, character performance, audio, or image work.\n\n**Source:** [Runway \u2014 Introducing Runway Dev](https://runwayml.com/news/introducing-runway-dev) \u00b7 July 8, 2026\n\n### Meta Launches Muse Image and Previews a Native-Audio Video Model\n\nMeta Superintelligence Labs released **Muse Image** and previewed **Muse Video** on July 7. They are the lab\u2019s first media-generation models.\n\nMuse Image is available now. Meta says it can:\n\n- Follow detailed instructions\n- Edit images precisely\n- Compose from multiple references\n- Use tools such as web search and code execution\n- Review and refine its own output before returning a result\n\nThat last group of capabilities makes Muse Image different from a simple prompt-to-image system. Meta is framing it as an agentic media model that can gather context, use tools when precision matters, and spend additional inference work refining a result.\n\nMeta also introduced **Content Seal**, an invisible provenance signal designed to remain detectable after an image is cropped, compressed, resized, or captured in a screenshot. A detector is in preview, and Meta says it plans to extend the system to video.\n\nMuse Video is not generally available yet. Meta describes it as a native-audio video model with competitive prompt adherence, visual fidelity, and temporal consistency. The company also identified two areas that still need work:\n\n- Audio-video synchronization\n- Physically accurate fast motion\n\nThat disclosure is useful. Native audio is becoming a standard launch claim across leading video systems, but generating sound and image together does not guarantee that dialogue, movement, ambience, and physical events remain correctly synchronized.\n\nFor now, Muse Video is a preview rather than a production release. The more immediate story is Meta\u2019s move toward media models that combine generation, editing, reference handling, tool use, and provenance.\n\n**Source:** [Meta \u2014 Introducing Muse Image and Muse Video](https://ai.meta.com/blog/introducing-muse-image-muse-video-msl/) \u00b7 July 7, 2026\n\n### GPT-5.6 Moves From Limited Preview to General Availability\n\nOpenAI made the **GPT-5.6** model family generally available on July 9, following the limited preview covered in the June 26 edition.\n\nThe three tiers remain:\n\n- **Sol** \u2014 the flagship model\n- **Terra** \u2014 the balanced model\n- **Luna** \u2014 the lower-cost model\n\nThe important change is access. GPT-5.6 is now rolling out through **ChatGPT, Codex, and the OpenAI API** rather than remaining restricted to a small preview group.\n\nOpenAI also expanded the product story around the models:\n\n- **Ultra mode** coordinates multiple agents across parallel workstreams.\n- **Program Calling** lets GPT-5.6 write and run programs that coordinate tools and intermediate results.\n- A multi-agent capability is entering beta in the API.\n- GPT-5.6 adds stronger computer-use and design evaluations alongside its coding and knowledge-work results.\n\nOpenAI also introduced **ChatGPT Work**, an agent designed to act across connected applications and files, break a larger goal into smaller steps, and remain with a project for hours. The company says it can gather information and produce finished materials such as documents, spreadsheets, slides, and web applications.\n\nThis release makes the late-June preview story more practical. The question is no longer only what GPT-5.6 can do in selected evaluations. It is how the model performs when broadly available inside everyday tools and longer-running workflows.\n\nAs with any agent working across organizational systems, the operational questions extend beyond benchmark scores: which applications it can access, what permissions it receives, how actions are reviewed, and what records remain after the task is complete.\n\n**Source:** [OpenAI \u2014 GPT-5.6 general availability](https://openai.com/index/gpt-5-6/) \u00b7 [OpenAI \u2014 ChatGPT Work](https://openai.com/index/chatgpt-for-your-most-ambitious-work/) \u00b7 July 9, 2026\n\n### LucidLink Connect Brings Frame.io Footage and Production Storage Into One Filespace\n\nLucidLink announced a new **Connect for Frame.io** workflow on July 7.\n\nFrame.io handles Camera-to-Cloud footage, dailies, and review, but supporting production assets often live elsewhere: object storage, shared drives, archive systems, audio libraries, graphics folders, or departmental cloud storage.\n\nLucidLink Connect presents Frame.io footage and those supporting assets inside one real-time filespace without moving, migrating, or duplicating the underlying files. The original storage paths and permissions remain in place.\n\nLucidLink says that once footage reaches Frame.io through Camera-to-Cloud, it can appear alongside external assets and become available for editing in:\n\n- Adobe Premiere\n- DaVinci Resolve\n- Avid Media Composer\n\nThe system streams the portions of a file needed for playback, scrubbing, or editing rather than downloading the complete media object first. The Frame.io workflow is currently available for enterprise accounts.\n\nThis is not an AI model announcement, but it matters to the AI production conversation. Agents and media models can only work effectively when they can locate and access the right assets. The data layer beneath the model\u2014storage, permissions, paths, versions, and transfer time\u2014continues to shape what automation is practical.\n\n**Source:** [LucidLink \u2014 Connect for Frame.io](https://www.lucidlink.com/blog/lucidlink-connect-frame-io) \u00b7 July 7, 2026\n\n### Quick Hits\n\n- **OpenAI launched GPT-Live** \u2014 The new ChatGPT Voice model uses a full-duplex architecture, allowing it to listen and speak at the same time, respond to interruptions, and handle faster conversational turn-taking. GPT-Live-1 is rolling out to Go, Plus, and Pro users, while a smaller version is becoming the Free default. API access is planned. At launch, the model does not support voice together with video or screen sharing.\n- **Runway open-sourced AVTensor** \u2014 The Rust media decoder returns audio and video tensors that share the same time origin, addressing subtle timestamp and synchronization problems in model-training data. Runway reports that direct object-storage streaming reduced a 100-batch decoding benchmark from 176 seconds to 122 seconds and improved model flops utilization by 1.8 percentage points in a production audio-visual training run.\n\n---\n\n## Voices This Week\n\n### Praveen Neppalli Naga on the Unit of Automation\n\nUber\u2019s CTO summarized the central lesson from the Agentic Pods:\n\n> \u201cThe workflow becomes the unit of automation \u2014 not the individual task.\u201d\n\nThat distinction explains why the pods begin with observation rather than a list of automation requests. The object being redesigned is the complete flow of work, including handoffs and exceptions.\n\n### Runway on Multi-Model Media Infrastructure\n\nRunway described the model-selection layer in simple terms:\n\n> \u201cSwap between them by changing one line of code.\u201d\n\nThe claim captures where media infrastructure is heading: individual models can change while the surrounding application, governance, and billing layer stays in place.\n\n---\n\n## Common Threads\n\n### The Workflow Is Replacing the Task as the Unit of AI Adoption\n\nUber\u2019s Agentic Pods are the clearest example, but the same pattern appears elsewhere. ChatGPT Work stays with a project across applications. Runway Dev connects multiple models inside reusable media workflows. LucidLink connects assets that previously lived in separate storage systems.\n\nThe model is becoming one component inside a longer chain of work.\n\n### Model Choice Is Moving Behind a Platform Layer\n\nRunway Dev combines first- and third-party media models. GPT-5.6 offers different capability and cost tiers. Meta connects its reasoning and media systems. The emerging platform model assumes that no single generator will remain best for every task.\n\nThis shifts attention toward routing, permissions, cost tracking, retention, and repeatability.\n\n### Data Access Is Becoming as Important as Model Intelligence\n\nUber\u2019s agents need access to the systems where departmental work happens. ChatGPT Work operates across connected applications and files. LucidLink unifies media access without moving the source files. AVTensor focuses on aligned audio and video at the training-data layer.\n\nAcross all four examples, the model cannot complete the workflow unless the data is available in a usable, correctly permissioned form.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Embedded Technical Builders\n\nUber\u2019s model temporarily embeds an AI-proficient engineer inside a department rather than asking the department to describe its needs from a distance. The approach treats observation and domain learning as part of the engineering work.\n\n### Two-Week Workflow Discovery\n\nThe Agentic Pod schedule is unusually specific: two days of observation, one day of prioritization, two days of building, four days of broader validation, and one day to ship. Whether that pace generalizes is uncertain, but the structure is more concrete than a broad mandate to \u201cfind AI opportunities.\u201d\n\n### Media Provenance That Survives Transformation\n\nMeta says Content Seal remains detectable after cropping, compression, resizing, or screenshots. If reliable, provenance that survives ordinary media handling would be more useful than metadata that disappears during export.\n\n### Aligned Audio and Video at the Data Layer\n\nRunway built AVTensor after an existing decoder silently misaligned audio and video in training data. It is a reminder that synchronization problems can begin before a model is trained, not only in the generated output.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 7: Give It Examples Before You Ask for Output\n\nLast week, the Back to Basics series covered **Use Checklists as Guardrails**: define how the result will be judged before asking AI to create or revise it.\n\nThis week\u2019s habit is: **show examples before asking for a new output**.\n\nAI often learns the intended structure faster from two representative examples than from a long paragraph describing the format.\n\nUse this pattern:\n\n```text\nHere are two examples of the output format I want.\n\nExample 1:\n[Paste a strong example]\n\nExample 2:\n[Paste another strong example]\n\nCreate a new version using the same:\n- Structure\n- Level of detail\n- Tone\n- Labeling pattern\n- Approximate length\n\nDo not copy the subject matter or wording from the examples.\nUse them only as format references.\n```\n\nFor AV work, examples can establish:\n\n- How edit notes should be formatted\n- How timecodes and speaker names should appear\n- The structure of equipment summaries\n- The level of detail in production documentation\n- The tone of client-facing updates\n- The layout of titles, descriptions, or show notes\n- The expected form of a QA report\n\nThe examples should be representative and safe to share. Remove confidential names, links, credentials, or project details before placing internal material into an AI system.\n\nThe small habit: when a format matters, provide two examples and clearly tell the model what to imitate\u2014and what not to copy.\n\nNext week, Back to Basics Week 8: **Separate Drafting From Review** \u2014 why asking for creation and criticism in two passes often produces a stronger result.\n\n---\n\n## Sources\n\n1. [Praveen Neppalli Naga \u2014 Uber Agentic Pods](https://x.com/praveenTweets/status/2074605343439810922) \u2014 July 7, 2026 \u2014 company-reported AI adoption, pod structure, and workflow results\n2. [Business Insider \u2014 Uber\u2019s CTO bets on Agentic Pods](https://www.businessinsider.com/uber-cto-bets-on-agentic-pods-make-ai-more-efficient-2026-7) \u2014 July 2026 \u2014 independent reporting and role attribution\n3. [Runway \u2014 Introducing Runway Dev](https://runwayml.com/news/introducing-runway-dev) \u2014 July 8, 2026 \u2014 model catalog, API layer, enterprise controls, and planned routing\n4. [Meta \u2014 Introducing Muse Image and Muse Video](https://ai.meta.com/blog/introducing-muse-image-muse-video-msl/) \u2014 July 7, 2026 \u2014 media models, native-audio video preview, Content Seal, and stated limitations\n5. [OpenAI \u2014 GPT-5.6 general availability](https://openai.com/index/gpt-5-6/) \u2014 July 9, 2026 \u2014 Sol, Terra, Luna, multi-agent capabilities, and product availability\n6. [OpenAI \u2014 ChatGPT Work](https://openai.com/index/chatgpt-for-your-most-ambitious-work/) \u2014 July 9, 2026 \u2014 long-running agent work across applications and files\n7. [LucidLink \u2014 Connect for Frame.io](https://www.lucidlink.com/blog/lucidlink-connect-frame-io) \u2014 July 7, 2026 \u2014 unified access to Camera-to-Cloud footage and production storage\n8. [OpenAI \u2014 Introducing GPT-Live](https://openai.com/index/introducing-gpt-live/) \u2014 July 8, 2026 \u2014 full-duplex ChatGPT Voice models and current limitations\n9. [Runway \u2014 AVTensor](https://runwayml.com/news/avtensor-a-high-performance-rust-media-decoder-for-training-pipelines) \u2014 July 10, 2026 \u2014 open-source synchronized audio-video decoder and training benchmarks\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of July 10, 2026\n\n> **Uber provided this week\u2019s clearest example of AI adoption moving from individual tasks into departmental workflows.** Its \u201cAgentic Pods\u201d pair AI-proficient engineers with business experts for two weeks of observation, building, validation, and deployment. In media, **Runway Dev** brought first- and third-party image, video, and audio models into one enterprise platform. **Meta launched Muse Image and previewed Muse Video** with native audio. **GPT-5.6 became generally available**, accompanied by ChatGPT Work for long-running tasks. And **LucidLink connected Frame.io footage with external production storage** without moving or duplicating files.\n\n---\n\n## The Big Story\n\n### Uber\u2019s Agentic Pods Focus on Complete Workflows\n\nUber CTO **Praveen Neppalli Naga** shared company-reported figures showing how deeply AI has entered its engineering organization:\n\n- 99 percent of engineers use AI tools\n- More than 70 percent of pull requests are attributed to local or cloud agents\n- Engineers have created more than 2,500 agent skills\n\nThe figures have not been independently audited. The more useful part of the story is how Uber is taking AI into finance, legal, operations, marketing, support, HR, procurement, and other departments.\n\nUber selected approximately 30 AI-proficient engineers and paired each one with a departmental expert. Each **Agentic Pod** received two weeks:\n\n- Days 1\u20132: Observe and document the work\n- Day 3: Prioritize opportunities\n- Days 4\u20135: Build an agent with the expert\n- Days 6\u20139: Validate it with more users\n- Day 10: Ship\n\nNaga said Uber ran 16 pods across 16 business functions in two months. Reported results included:\n\n- Capital allocation analysis: 15 hours to 30 minutes\n- Financial pacing reports: two days to 10 minutes\n- Marketing website QA: two weeks to 50 minutes\n- Support workflow creation: 9,000 manual workflows moved to self-service automation\n\nThe main lesson was not simply faster tasks. Uber found larger gains by redesigning whole workflows, including handoffs, approvals, tools, and cross-team steps.\n\nFor AV departments, that pattern is relevant to work spanning intake, scheduling, recording, editing, review, captions, metadata, publishing, archiving, and support. Uber\u2019s approach begins by observing the people doing the work rather than trying to automate from documentation alone.\n\n**Source:** [Praveen Neppalli Naga](https://x.com/praveenTweets/status/2074605343439810922) \u00b7 [Business Insider](https://www.businessinsider.com/uber-cto-bets-on-agentic-pods-make-ai-more-efficient-2026-7) \u00b7 July 7, 2026\n\n---\n\n## Other Stories\n\n### Runway Dev Puts Multiple Media Models Behind One API\n\nRunway launched **Runway Dev**, an enterprise media platform that combines its own models with third-party options.\n\nThe initial catalog includes:\n\n- Runway Gen-4.5\n- Runway Aleph 2.0\n- Runway Act-Two\n- ByteDance Seedance\n- OpenAI GPT Image 2\n- ElevenLabs models\n\nRunway says developers can change models with one line of code and monitor spending through one dashboard.\n\nThe platform also includes vendor-stated enterprise controls such as no-training commitments, zero-data-retention support, SOC 2 Type II compliance, IP indemnification, moderation, cost controls, and a 99.9 percent uptime commitment.\n\nThe larger pattern: professional media systems are starting to assume that different models will handle different parts of the workflow.\n\n**Source:** [Runway](https://runwayml.com/news/introducing-runway-dev) \u00b7 July 8, 2026\n\n### Meta Launches Muse Image and Previews Muse Video\n\nMeta released **Muse Image**, an image generation and editing model that can compose from multiple references, use tools, and refine its own output.\n\nMeta also introduced **Content Seal**, an invisible provenance signal designed to survive cropping, compression, resizing, and screenshots.\n\n**Muse Video** remains a preview. Meta says it generates native audio with video, while acknowledging that audio-video synchronization and physically accurate fast motion still need improvement.\n\nThe immediate story is not a finished new video platform. It is Meta combining media generation, editing, references, tool use, and provenance in one model family.\n\n**Source:** [Meta](https://ai.meta.com/blog/introducing-muse-image-muse-video-msl/) \u00b7 July 7, 2026\n\n### GPT-5.6 Is Now Generally Available\n\nOpenAI moved **GPT-5.6 Sol, Terra, and Luna** from limited preview into general availability across ChatGPT, Codex, and the API.\n\nThe release includes:\n\n- Ultra mode with parallel subagents\n- Program Calling for coordinating tools\n- A multi-agent API capability entering beta\n- Stronger computer-use and design performance\n\nOpenAI also launched **ChatGPT Work**, an agent that can remain with a project for hours, gather information across connected applications and files, and create finished documents, spreadsheets, slides, or web applications.\n\nThe operational questions remain permissions, connected systems, review controls, and data handling\u2014not only benchmark results.\n\n**Source:** [OpenAI GPT-5.6](https://openai.com/index/gpt-5-6/) \u00b7 [ChatGPT Work](https://openai.com/index/chatgpt-for-your-most-ambitious-work/) \u00b7 July 9, 2026\n\n### LucidLink Connect Unifies Frame.io and Production Storage\n\nLucidLink introduced a workflow that places Frame.io Camera-to-Cloud footage beside assets held in other cloud and storage systems.\n\nIt does not move or duplicate the files. Editors access them through one filespace and can work in Premiere, Resolve, or Avid.\n\nThe system streams only the portions of media needed for playback and editing. It is currently available to enterprise accounts.\n\nThis matters to AI workflows because agents and media models need reliable access to the right assets, paths, permissions, and versions.\n\n**Source:** [LucidLink](https://www.lucidlink.com/blog/lucidlink-connect-frame-io) \u00b7 July 7, 2026\n\n---\n\n## Quick Hits\n\n- **GPT-Live** brings full-duplex voice to ChatGPT, allowing the system to listen and speak at the same time. API access is planned. Voice with video or screen sharing is not supported at launch.\n- **Runway AVTensor** is an open-source media decoder designed to keep audio and video aligned from the same time origin in model-training pipelines.\n\n---\n\n## Common Threads\n\n### The Workflow Is Becoming the Unit of AI Adoption\n\nUber\u2019s pods redesign full departmental workflows. ChatGPT Work operates across applications. Runway Dev connects multiple models. LucidLink connects media stored across systems.\n\nThe model is becoming one part of a longer chain of work.\n\n### Model Choice Is Moving Behind a Platform\n\nRunway Dev provides multiple media models. GPT-5.6 has capability and cost tiers. Meta connects reasoning and media generation.\n\nThis places more importance on routing, permissions, cost tracking, retention, and reliability.\n\n### Data Access Matters as Much as Model Capability\n\nAgents cannot complete work without access to the correct files and systems. Media models cannot produce reliable results from misaligned audio and video. The data layer remains part of the production system.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 7: Give It Examples Before You Ask for Output\n\nWhen a format matters, give AI two representative examples before requesting a new output.\n\nUse this pattern:\n\n```text\nHere are two examples of the output format I want.\n\nExample 1:\n[Paste a strong example]\n\nExample 2:\n[Paste another strong example]\n\nCreate a new version using the same:\n- Structure\n- Level of detail\n- Tone\n- Labeling pattern\n- Approximate length\n\nDo not copy the subject matter or wording.\nUse the examples only as format references.\n```\n\nFor AV work, examples can establish the format for edit notes, timecodes, equipment summaries, captions, production documentation, client updates, show notes, and QA reports.\n\nRemove confidential names, links, credentials, and project details before sharing examples with an AI system.\n\nThe small habit: provide two examples and clearly identify what the model should imitate\u2014and what it should not copy.\n\nNext week: **Separate Drafting From Review**.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
