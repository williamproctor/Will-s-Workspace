      slug: "2026-09-07",
      editionTitle: "Week of September 7, 2026",
      editionMd: "# Monday Signal \u2014 Week of September 7, 2026\n\n> **Two ad auctions had their integrity adjudicated in one week, with opposite momentum: on Monday the FTC and 22 states accused Amazon of rigging seven years of ad auctions with an invented bidder that extracted $20 billion or more, and on Wednesday a federal judge let Google keep its ad-tech stack with behavioral remedies only.** In between, Google's AI Max migration went live as a month-long window rather than a switch, Gemini 3.8 Flash shipped into AI Mode and stopped citing sources for two days, and Search Console's AI reports finally reached every site on earth without a click column. On the feed, Xero paid an influencer to tell small businesses to replace their accountants with Claude, and Xero's own sales channel revolted.\n\n---\n\n## The Conversation\n\n### Xero paid an influencer to tell small businesses to fire their accountants\n\nPersonal-branding strategist Amelia Sordell posted a Xero-sponsored Instagram story (tagged #xeropartner, discount link attached) saying she'd spent more than \u00a3120,000 on accountants since 2020 and now connects Xero to Claude to produce the management accounts she used to pay \u00a3800 a month for. Xero sells through accountants and bookkeepers; they're the channel that recommends it to the 4.9 million small businesses on the platform. LinkedIn did the rest between September 3 and 5. Xero pulled the post, and UK managing director Kate Hayward apologized for an ad that \"does not reflect our values\u2026 and it should never have run.\"\n\nThe practitioner reads were sharper than the trade coverage. Tom McNally: \"This is the innovator's dilemma playing out in public\u2026 they can see that the money is in the service, not the software. But they can't move into services without turning on the people who built them.\" Rumana Jeffreys on the mechanism: \"The \u00a3800 comparison reframes the accountant's fee as the cost of producing a spreadsheet, rather than the cost of judgement, interpretation and advice.\" Lucien Livsey's summary headline did numbers on its own: \"Xero just ran an ad telling small businesses to fire their accountants. It didn't land well.\"\n\n**Comment window:** open and squarely in GrowthX's lane: B2B software, influencer programs, AI positioning. The unclaimed angle is the brief. The creator said the quiet part out loud because nobody in the approval chain owned the channel relationship, which makes influencer briefs the place where channel strategy leaks.\n\n**Source:** [McNally's post](https://www.linkedin.com/posts/tomdmcnally_xero-paid-an-influencer-to-tell-small-businesses-activity-7501263484764995585-1c9K) \u00b7 [Jeffreys's post](https://www.linkedin.com/posts/rumana-jeffreys_xero-has-upset-a-lot-of-accountants-this-activity-7501671417730543616-NO9x) \u00b7 [Livsey's post](https://www.linkedin.com/posts/lucien-livsey-31971a121_xero-just-ran-an-ad-telling-small-businesses-activity-7501583099533651968-sGV0) \u00b7 [SmartCompany's report](https://www.smartcompany.com.au/marketing/xero-instagram-sponsored-influencer-post-ai-accountants-apology/) \u00b7 September 3\u20135, 2026\n\n### Suno pulled a Mary J. Blige ad after saying she never authorized it\n\nAn 85-second Suno spot circulated over the weekend: Blige in a studio while a producer builds a track called \"Pretty Flowers\" with the company's generative tools, Blige suggesting strings and a beat and reacting warmly to the result. Shorter cuts spread fast and fans read it as the Queen of Hip-Hop Soul endorsing AI music. Then Suno told Variety: \"We entered into a business deal with someone who presented themselves as Ms. Blige's official representative. As soon as we learned this was not the case, and that Ms. Blige was uncomfortable, we terminated the advertising campaign.\" Blige clearly sat for the session; the campaign built from it apparently had no valid sign-off. Suno hasn't named the intermediary or explained how the deal reached distribution, and it faces separate copyright litigation from rights holders.\n\n**Comment window:** open this week. The transferable lesson is chain of custody for talent rights in AI-company campaigns, the one category where \"who actually signed\" is the entire story.\n\n**Source:** [Consequence, carrying Suno's statement to Variety](https://consequence.net/2026/09/suno-pulls-mary-j-blige-ad-says-she-never-authorized-campaign/) \u00b7 September 5\u20136, 2026\n\n### OpenAI's launch film angered the community whose tool it borrowed\n\nOpenAI's ad for its new Astra model stages a demo in the style of MIT's 1979 \"Put That There\" project and shows a fashion designer working alone with a screen, with Blender, the free, community-built 3D tool, doing the work on it. Blender's users objected to seeing software that exists to teach people the craft used to sell the idea that the craft is optional; the artist behind the current Blender splash screen said she was disgusted to find her work in the ad, and one widely shared post put it less politely: \"Stay tf away from human-made art.\" Creative Bloq's read on the spot's worldview: the future of creative work as one person in a room talking to a screen.\n\nThat makes four AI-lab marketing misfires we've tracked since August (Meta's optimism ad, Anthropic's doom reel, OpenAI's Summer Club, now Astra), plus Samsung's SSD spot and Suno's unauthorized campaign in a single fortnight. The failure is the same each time: the audience with the most to lose was the audience the campaign reached first.\n\n**Comment window:** narrowing on the ad, durable on the pattern.\n\n**Source:** [Creative Bloq](https://www.creativebloq.com/ai/even-just-the-advert-for-chatgpt-6-astra-is-creating-controversy) \u00b7 September 3\u20136, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and statements where the week's arguments actually happened.\n\n- **Tom McNally, founder, Pie** (LinkedIn, September 3, on Xero): \"Xero paid an influencer to tell small businesses they don't need an accountant. Accountants are furious. I get it, but nobody should be surprised. This is the innovator's dilemma playing out in public.\" [The post](https://www.linkedin.com/posts/tomdmcnally_xero-paid-an-influencer-to-tell-small-businesses-activity-7501263484764995585-1c9K)\n- **Rumana Jeffreys** (LinkedIn, September 4): \"Don't create value for one customer group by diminishing the perceived value of another \u2014 especially when they've spent years advocating for your brand.\" [The post](https://www.linkedin.com/posts/rumana-jeffreys_xero-has-upset-a-lot-of-accountants-this-activity-7501671417730543616-NO9x)\n- **Kate Hayward, UK managing director, Xero** (statement, September 4): the ad \"does not reflect our values\u2026 and it should never have run.\" [Via SmartCompany](https://www.smartcompany.com.au/marketing/xero-instagram-sponsored-influencer-post-ai-accountants-apology/)\n- **FTC complaint quoting a 2024 Amazon internal discussion** (filed August 31): Amazon's \"clever non-transparent way to charge first price\" was \"an incredibly effective way to drive revenue.\" [FTC release](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme)\n- **Lee-Anne Mulholland, VP of regulatory affairs, Google** (statement, September 2): \"We're very pleased the court rejected the DOJ's proposal to break apart tools that help small businesses reach new customers and grow.\" [Bloomberg Law](https://news.bloomberglaw.com/antitrust/google-avoids-ad-exchange-sale-as-judge-orders-tech-integration)\n- **Glenn Gabe, G-Squared Interactive** (X, September 3, on Gemini 3.8 Flash in AI Mode): \"Whoa, Gagan is right. See below between default model and 3.8 Flash. What is going on here?\" [Via Search Engine Roundtable](https://www.seroundtable.com/google-ai-mode-gemini-38-no-links-42011.html)\n- **Robby Stein, VP of product, Google Search** (X reply to Barry Schwartz, September 3): \"Hey \u2014 thanks for flagging. This isn't working as intended, and we'll roll out a fix soon.\" [Via Search Engine Land](https://searchengineland.com/google-to-fix-citation-bug-with-gemini-3-8-flash-in-ai-mode-486892)\n- **Suno** (statement to Variety, September 6): \"We entered into a business deal with someone who presented themselves as Ms. Blige's official representative. As soon as we learned this was not the case, and that Ms. Blige was uncomfortable, we terminated the advertising campaign.\" [Via Consequence](https://consequence.net/2026/09/suno-pulls-mary-j-blige-ad-says-she-never-authorized-campaign/)\n\n---\n\n## This Week in Marketing AI\n\n### The FTC says Amazon rigged its ad auction with an invented bidder for seven years\n\nThe complaint, filed Monday in the Western District of Washington with a bipartisan group of 22 states, alleges that since 2019 Amazon \"secretly and systematically overcharged its approximately 1.2 million advertising customers by manipulating the 'auctions' that it uses to set the price of ads.\" The mechanism is a hidden \"soft reserve price\" implemented through what an internal document called an \"invented auction participant\": a manufactured bid advertisers had to beat. The FTC says the effect turned a marketed second-price auction into a first-price one, with Sponsored Products advertisers charged their full winning bid close to 80% of the time, and surcharges rising on Prime Day and holiday peaks. Alleged extraction: $20 billion or more. Internal notes from a 2024 discussion between the head of Amazon Ads and the company's chief digital economist called the \"clever non-transparent way to charge first price\" an \"incredibly effective way to drive revenue.\"\n\nAmazon called the suit \"misguided\" in a blog post, said it \"fundamentally misunderstands how advertisers operate,\" and noted average CPC was flat from 2019 to 2024 while sales per click rose. That defense is about outcomes; the complaint is about disclosure. Amazon's auctions page has mentioned reserve pricing since an April update, which the FTC says still fails to disclose \"the nature, scope, and extent\" of the system. For anyone bidding on a $68 billion ad platform, the practical question is immediate: your bid strategy assumed a second-price auction, and the government says you were in a first-price one.\n\n**Source:** [FTC release](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme) \u00b7 [The complaint (PDF)](https://www.ftc.gov/system/files/ftc%5Fgov/pdf/AmazonAds-Complaint.pdf) \u00b7 [Reuters](https://www.reuters.com/legal/litigation/ftc-file-lawsuit-alleging-amazon-deceived-advertisers-wsj-reports-2026-08-31/) \u00b7 [TechCrunch](https://techcrunch.com/2026/08/31/ftc-accuses-amazon-of-running-a-secret-ad-surcharge-scheme-in-new-lawsuit/) \u00b7 August 31, 2026\n\n### Google keeps AdX and DFP; the remedies are behavioral and mostly sealed\n\nTwo days after the Amazon filing, Judge Leonie Brinkema issued a two-page order in the Justice Department's ad-tech case: the structural remedies (divesting AdX, open-sourcing DFP's final auction logic, a contingent divestiture of the rest of DFP) are rejected, and \"most of the parties' proposed behavioral remedies, as modified by this Court,\" are accepted. The memorandum opinion explaining which ones is sealed for fourteen days while the parties propose redactions; a joint proposed Final Judgment is due within thirty. Google's Lee-Anne Mulholland was \"very pleased.\" It's the second time in a year Google has avoided a breakup after being found a monopolist, following the Chrome outcome in the search case.\n\nWhat's on the table matters for buyers even before the opinion unseals. The behavioral proposals included real-time bid data for rival publisher ad servers, an end to Unified Pricing Rules, no first-look or last-look advantages, and non-discrimination toward third-party exchanges and servers. The DOJ's Matthew Huppert argued Google would \"test boundaries every step of the way\" under behavioral terms; Google's Karen Dunn argued there was \"no evidence there would be a buyer\" for AdX. Publishers including The Atlantic, USA Today, Vox Media, and Penske have damages suits pending on the April 2025 liability finding, so the money question moves to those courtrooms.\n\n**Source:** [The order (CourtListener PDF)](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1857.0_1.pdf) \u00b7 [Bloomberg Law](https://news.bloomberglaw.com/antitrust/google-avoids-ad-exchange-sale-as-judge-orders-tech-integration) \u00b7 [Adweek](https://www.adweek.com/media/google-wont-be-forced-to-break-up-adtech-biz-even-after-monopoly-ruling/) \u00b7 [The Current](https://www.thecurrent.com/ad-tech/google-avoids-ad-tech-breakup-monopoly-case) \u00b7 September 2, 2026\n\n### The AI Max migration is live, and it's a window, not a switch\n\nSeptember 1 arrived and Google began converting Search campaigns that still used campaign-level broad match or standalone Automatically Created Assets to AI Max, in place, progressively through September 30. Campaign IDs survive because AI Max is a setting, not a campaign type. The broad-match cohort gets search-term matching switched on; the ACA cohort also gets text customization, which means Google rewriting headlines and descriptions from your site content unless you turn it off after the fact. Brand inclusions and exclusions carry over. There's no opting out of the conversion; there is changing the settings afterward. Google Ads API v25.1 exposes per-campaign timestamps (`campaign.aca_migration_date_time` and `campaign.broad_match_migration_date_time`; join them with OR, not AND), and `campaign.ai_max_setting.enable_ai_max` turns \"which of ours got upgraded\" into a query.\n\nThe independent evidence points both ways, which is why the reporting discipline matters. Smarter Ecommerce measured a median 13% increase in conversion value with a median ROAS difference of zero across more than 250 retail campaigns; Lunio measured invalid traffic diverging (AI Max campaigns rising to 5.28% while standard search ended at 3.07%); Alphabet's filings show paid clicks growing 13% in each of the last two quarters while CPC growth slowed to 3%. Improvado's reporting note is the one to pin: don't sum the classic search-term report with the new AI Max search-term view, and check expanded final URLs, because the landing page that served may not be the one you configured.\n\n**Source:** [Improvado on the reporting layer](https://improvado.io/blog/google-ads-ai-max-september-2026-upgrade) \u00b7 [Incisive Growth: \"September 1 was not a soft deadline\"](https://incisivegrowth.com/blogs/google-ai-max-migration-is-live-what-actually-changed/) \u00b7 [Choice OMG's verified dossier](https://choice.marketing/research/google-ai-max-auto-upgrade/) \u00b7 [Digital Applied on the API fields](https://www.digitalapplied.com/blog/google-ads-api-v251-ai-max-migration-date-fields) \u00b7 September 1\u20136, 2026\n\n### Gemini 3.8 Flash landed in AI Mode and forgot to cite anyone\n\nGoogle put Gemini 3.8 Flash into AI Mode for Pro and Ultra subscribers on September 2, two weeks after 3.7 Flash, with Robby Stein announcing it on X. By the next morning Gagan Ghotra had posted a run of top-of-funnel queries in which the new model returned answers with no links and no citations at all, and Glenn Gabe replicated the difference side by side against the default model. Barry Schwartz reported it on Search Engine Roundtable; Stein replied within hours: \"This isn't working as intended, and we'll roll out a fix soon.\" Links were reappearing by September 4.\n\nA two-day bug that only hit paying subscribers sounds minor, and the lesson isn't. Whatever visibility a brand has inside AI answers is downstream of model defaults it doesn't control, and a routine model swap switched citations off without anyone at Google noticing until practitioners posted screenshots. Google's fix arrived because two SEOs tagged the right VP on X. Build the visibility plan on that assumption.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/google-ai-mode-gemini-38-no-links-42011.html) \u00b7 [Search Engine Land, with Stein's reply](https://searchengineland.com/google-to-fix-citation-bug-with-gemini-3-8-flash-in-ai-mode-486892) \u00b7 [Scalevise's timeline](https://scalevise.com/resources/google-gemini-3-8-flash-ai-mode-citation-bug-fix/) \u00b7 September 2\u20134, 2026\n\n### Search Console's AI reports and opt-out reached every site, still without clicks\n\nGoogle updated three help documents with the same line: \"As of August 31, 2026, we've rolled out this control to all websites worldwide.\" Barry Schwartz's headline captured the history: \"For real this time.\" The generative AI performance reports (impressions in AI Overviews, AI Mode, and Discover's AI features by page, country, date, and device) began with a handful of UK sites in June under a CMA conduct requirement, spread through July and August, and are now global, subject to a minimum-impressions threshold that keeps small sites from seeing one. The Search generative AI control went global the same day: a toggle that removes a site from AI features as a link or as grounding, which Google says is not a ranking signal for core search. Opt out and you get no AI traffic or impressions; stay in and you can count impressions but not clicks, queries, or positions.\n\nThe timing is the story for measurement teams. The reports reached everyone on August 31; the AI Max migration started converting campaigns on September 1; the Gemini 3.8 citation bug ran September 2 to 4. Every AI-visibility question a client can ask this month now has a dashboard that answers half of it.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/google-search-console-generative-ai-tools-live-41984.html) \u00b7 [Search Engine Land](https://searchengineland.com/google-search-console-ai-performance-reports-and-search-generative-ai-control-rolling-out-globally-486269) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/google-search-console-ai-reports-rolled-out-worldwide/587836/) \u00b7 [Google's help page](https://support.google.com/webmasters/answer/16984139?hl=en) \u00b7 August 31\u2013September 1, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's Friday recap](https://www.seroundtable.com/video-09-04-2026-42015.html).*\n\n- **AI Overviews keep expanding by default**, the behavior Chris Long flagged on August 27 (see last week's edition), now described by Search Engine Roundtable as making Overviews \"more like AI Mode.\"\n- **Content is disappearing from the Google News tab** for some publishers, cause unknown; **Google Discover** also went down for a period this week. Two more reasons to annotate traffic dips before blaming the content.\n- **Google posted details of its European search dataset licensing program**, the data-sharing remedy from the search case arriving as a product. Publishers and rivals in the EEA now have a document to read.\n- **Merchant Center expanded its AI performance insights**, and **Google Ads is surfacing a re-review status** for disapproved ads, plus new documentation on phone-call and offline conversions. [Search Engine Roundtable, September 3](https://www.seroundtable.com/recap-09-03-2026-42013.html)\n- **Marketing O'Clock spotted an \"Alpha\" setting** appearing inside some Google Ads accounts, unexplained so far. [EP 448](https://marketingoclock.com/episodes/well-goto-a-world-with-google-searchs-goto-tracking-parameters/)\n- **John Mueller: no penalty for old outbound links** that later start pointing at shady content, plus a refresher on when the disavow tool is warranted (rarely).\n- **Google is testing a delayed \"continue\" button** to verify searchers are human, and **Google Trends added category filters**.\n- **The August spam update hit French SEOs hard**, per Search Engine Watch's Gagan Ghotra. [Search Engine Watch](https://searchenginewatch.com/google-drops-show-more-button-pushes-users-into-ai-mode/)\n- **LinkedIn's \"seems like AI slop\" flag is rolling out more widely to comments**, extending the distribution penalty from posts to replies.\n- **Bing is testing results without site names in snippets**, and **Microsoft is forcing Copilot users to log in**. **AdSense changed how it measures impressions.**\n\n---\n\n## Common Threads\n\n### The auction is the product, and the product is under review\n\nAmazon's alleged invented bidder, Google's court-modified behavioral remedies, and Google's own auto-migration to AI Max all ask buyers to trust auction mechanics they can't inspect. In the same week, regulators said one of those auctions was rigged and a judge declined to break up another that was already ruled a monopoly.\n\n### Marketing to the people your product displaces\n\nXero to accountants, Samsung to filmmakers, OpenAI to Blender artists, Suno to musicians. Four campaigns in two weeks reached the audience with the most to lose before anyone else, and each company apologized or pulled the work. The brief never asked who would see it first.\n\n### Citations are a feature flag now\n\nA model swap made AI Mode stop linking for two days, and the fix arrived because two SEOs tagged a VP on X. Visibility inside AI answers rests on defaults nobody outside the platform controls, which is the strongest argument this month for owning first-party demand.\n\n### Measurement arrives after the migration\n\nSearch Console's AI reports went global the day before AI Max started converting campaigns, and they still don't count clicks. The migration question and the click question stay open at the same time, on the same dashboards.\n\n---\n\n## Angles for the Week\n\n### An invented bidder: what a first-price auction does to your Amazon strategy\n\nThe complaint's core allegation is that Sponsored Products advertisers paid their full bid about 80% of the time. Whether or not it holds up, the practical post is what changes in bid strategy when you assume first-price mechanics, and how to read Amazon's reserve-pricing disclosure. Window: open now; reopens with every filing.\n\n### Google kept the stack. Here's what behavioral remedies could change for buyers\n\nReal-time bid data for rival ad servers, no first look, no Unified Pricing Rules: each proposed remedy has a buyer-side consequence, and the opinion unseals around September 16. A plain-English preview now, updated when the text lands, owns the topic twice. Window: two weeks, then again at the Final Judgment.\n\n### The brief was the problem\n\nXero's influencer didn't invent the \"replace your accountant\" message; she was briefed to sell savings to business owners by a company whose revenue arrives through accountants. The post to write is the channel-aware influencer brief: who sees this first, what they lose, what the approval chain is for. Window: open; GrowthX-native.\n\n### Your citations are someone else's default\n\nTwo days without links in AI Mode, fixed by a tweet. The argument for first-party demand (email, community, direct) writes itself when the alternative depends on a model flag. Window: open, durable.\n\n### It's a window, not a switch\n\nThrough September 30, campaigns are converting on Google's schedule, not yours. The checklist post: query the migration timestamps, check `enable_ai_max` daily, separate AI Max search terms from classic ones in reporting, and verify expanded final URLs against the landing pages legal approved. Window: through September 30.\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [FTC \u2014 FTC, States Sue Amazon Over Secret Ad Surcharge Scheme](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme) \u2014 August 31, 2026 \u2014 the allegations, the 22 states, the internal quote\n2. [FTC \u2014 the complaint (PDF)](https://www.ftc.gov/system/files/ftc%5Fgov/pdf/AmazonAds-Complaint.pdf) \u2014 August 31, 2026 \u2014 1.2 million customers, soft reserve mechanism, Sponsored Products detail\n3. [US v. Google \u2014 remedies order (CourtListener PDF)](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1857.0_1.pdf) \u2014 September 2, 2026 \u2014 structural remedies rejected, behavioral accepted, 30-day Final Judgment\n4. [Tom McNally \u2014 LinkedIn post on Xero](https://www.linkedin.com/posts/tomdmcnally_xero-paid-an-influencer-to-tell-small-businesses-activity-7501263484764995585-1c9K) \u2014 September 3, 2026 \u2014 verbatim in Voices\n5. [Rumana Jeffreys \u2014 LinkedIn post on Xero](https://www.linkedin.com/posts/rumana-jeffreys_xero-has-upset-a-lot-of-accountants-this-activity-7501671417730543616-NO9x) \u2014 September 4, 2026 \u2014 the \u00a3800 reframing\n6. [Lucien Livsey \u2014 LinkedIn post on Xero](https://www.linkedin.com/posts/lucien-livsey-31971a121_xero-just-ran-an-ad-telling-small-businesses-activity-7501583099533651968-sGV0) \u2014 September 4, 2026 \u2014 Hayward's apology, practitioner replies\n7. [Google \u2014 Generative AI performance report help page](https://support.google.com/webmasters/answer/16984139?hl=en) \u2014 accessed September 2026 \u2014 report dimensions and limits\n8. [Marketing O'Clock \u2014 EP 448](https://marketingoclock.com/episodes/well-goto-a-world-with-google-searchs-goto-tracking-parameters/) \u2014 August 31, 2026 \u2014 the \"Alpha\" setting note\n\n**Original reporting**\n\n9. [Reuters \u2014 Amazon sued by FTC, 22 US states over ad sales practices](https://www.reuters.com/legal/litigation/ftc-file-lawsuit-alleging-amazon-deceived-advertisers-wsj-reports-2026-08-31/) \u2014 August 31, 2026 \u2014 Amazon's response\n10. [TechCrunch \u2014 FTC accuses Amazon of running a 'secret ad surcharge scheme'](https://techcrunch.com/2026/08/31/ftc-accuses-amazon-of-running-a-secret-ad-surcharge-scheme-in-new-lawsuit/) \u2014 August 31, 2026 \u2014 the ~80% figure, shill-bid framing\n11. [Ars Technica \u2014 FTC alleges Amazon illegally made $20 billion](https://arstechnica.com/tech-policy/2026/09/ftc-alleges-amazon-illegally-made-20-billion-by-rigging-billions-of-ad-auctions/) \u2014 September 1, 2026 \u2014 disclosure-page detail\n12. [Bloomberg Law \u2014 Google avoids breakup as judge orders ad tech unit changes](https://news.bloomberglaw.com/antitrust/google-avoids-ad-exchange-sale-as-judge-orders-tech-integration) \u2014 September 2, 2026 \u2014 Mulholland quote, sealing\n13. [Adweek \u2014 Google won't be forced to break up adtech biz](https://www.adweek.com/media/google-wont-be-forced-to-break-up-adtech-biz-even-after-monopoly-ruling/) \u2014 September 2, 2026 \u2014 behavioral proposals, publisher suits\n14. [The Current \u2014 Google avoids ad tech breakup](https://www.thecurrent.com/ad-tech/google-avoids-ad-tech-breakup-monopoly-case) \u2014 September 2, 2026 \u2014 Huppert and Dunn arguments\n15. [SmartCompany \u2014 Xero apologises for influencer's sponcon](https://www.smartcompany.com.au/marketing/xero-instagram-sponsored-influencer-post-ai-accountants-apology/) \u2014 September 4, 2026 \u2014 Sordell's post, Hayward statement, accountant reaction\n16. [OnTargetIsh \u2014 Xero apologises after sponsored post](https://ontargetish.com/news/xero-apologises-after-sponsored-post-told-smbs-to-replace-accountants-with-ai) \u2014 September 5, 2026 \u2014 channel-conflict framing, company scale\n17. [Consequence \u2014 Suno pulls Mary J. Blige ad](https://consequence.net/2026/09/suno-pulls-mary-j-blige-ad-says-she-never-authorized-campaign/) \u2014 September 2026 \u2014 the ad, Suno's statement to Variety\n18. [Creative Bloq \u2014 OpenAI's controversial Astra advert](https://www.creativebloq.com/ai/even-just-the-advert-for-chatgpt-6-astra-is-creating-controversy) \u2014 September 6, 2026 \u2014 Blender community reaction\n19. [Search Engine Roundtable \u2014 Gemini 3.8 Flash not link friendly](https://www.seroundtable.com/google-ai-mode-gemini-38-no-links-42011.html) \u2014 September 3, 2026 \u2014 Ghotra and Gabe screenshots\n20. [Search Engine Land \u2014 Google to fix citation bug](https://searchengineland.com/google-to-fix-citation-bug-with-gemini-3-8-flash-in-ai-mode-486892) \u2014 September 3, 2026 \u2014 Stein's reply\n21. [Scalevise \u2014 the citation bug timeline](https://scalevise.com/resources/google-gemini-3-8-flash-ai-mode-citation-bug-fix/) \u2014 September 2026 \u2014 September 2\u20134 sequence\n22. [Search Engine Roundtable \u2014 GSC AI report and control live globally](https://www.seroundtable.com/google-search-console-generative-ai-tools-live-41984.html) \u2014 September 1, 2026 \u2014 the August 31 note\n23. [Search Engine Land \u2014 GSC AI performance reports rolling out globally](https://searchengineland.com/google-search-console-ai-performance-reports-and-search-generative-ai-control-rolling-out-globally-486269) \u2014 September 2026 \u2014 opt-out mechanics\n24. [Search Engine Journal \u2014 Search Console AI reports rolled out worldwide](https://www.searchenginejournal.com/google-search-console-ai-reports-rolled-out-worldwide/587836/) \u2014 September 2026 \u2014 CMA origin, threshold note\n25. [Improvado \u2014 what the September upgrade changes for reporting](https://improvado.io/blog/google-ads-ai-max-september-2026-upgrade) \u2014 September 2, 2026 \u2014 reporting fields and pitfalls\n26. [Incisive Growth \u2014 the migration is live](https://incisivegrowth.com/blogs/google-ai-max-migration-is-live-what-actually-changed/) \u2014 September 2026 \u2014 in-place conversion, carry-over detail\n27. [Choice OMG \u2014 AI Max by default, verified dossier](https://choice.marketing/research/google-ai-max-auto-upgrade/) \u2014 August 2026 \u2014 smec, Lunio, Alphabet figures       simplifiedMd: "# Monday Signal \u2014 Week of September 7, 2026\n\n> **Two ad auctions, one week, opposite momentum: Monday the FTC and 22 states accused Amazon of rigging its ad auction with an invented bidder for seven years ($20B+); Wednesday a judge let Google keep its ad-tech stack with behavioral remedies only.** Also: the AI Max migration went live as a month-long window, Gemini 3.8 Flash stopped citing sources in AI Mode for two days, Search Console's AI reports went global without clicks, and Xero's influencer told small businesses to replace their accountants with Claude.\n\n---\n\n## The Conversation\n\n### Xero's influencer told SMBs to fire their accountants\n\nA Xero-sponsored Instagram story: \u00a3120K spent on accountants since 2020, now Xero plus Claude does the \u00a3800-a-month management accounts. Accountants are Xero's sales channel; LinkedIn revolted (Sept 3\u20135); Xero pulled it and UK MD Kate Hayward said it \"should never have run.\" Rumana Jeffreys: the comparison \"reframes the accountant's fee as the cost of producing a spreadsheet, rather than the cost of judgement.\" The unclaimed angle: the brief leaked the channel strategy. [McNally](https://www.linkedin.com/posts/tomdmcnally_xero-paid-an-influencer-to-tell-small-businesses-activity-7501263484764995585-1c9K) \u00b7 [Jeffreys](https://www.linkedin.com/posts/rumana-jeffreys_xero-has-upset-a-lot-of-accountants-this-activity-7501671417730543616-NO9x) \u00b7 [SmartCompany](https://www.smartcompany.com.au/marketing/xero-instagram-sponsored-influencer-post-ai-accountants-apology/)\n\n### Suno pulled its Mary J. Blige ad\n\nAn 85-second studio spot spread over the weekend as an endorsement; Suno then told Variety it had dealt with \"someone who presented themselves as Ms. Blige's official representative\" and killed the campaign when she objected. Talent-rights chain of custody is the whole story in AI-company campaigns. [Consequence](https://consequence.net/2026/09/suno-pulls-mary-j-blige-ad-says-she-never-authorized-campaign/)\n\n### OpenAI's Astra film vs the Blender community\n\nThe launch ad shows a designer alone with a screen, Blender doing the work; Blender's community objected to its free, teach-yourself tool being used to sell the idea that the craft is optional. Fourth AI-lab marketing misfire since August, plus Samsung and Suno in a fortnight: the audience with the most to lose saw it first. [Creative Bloq](https://www.creativebloq.com/ai/even-just-the-advert-for-chatgpt-6-astra-is-creating-controversy)\n\n---\n\n## Voices\n\n- **Tom McNally (LinkedIn, Sept 3):** \"This is the innovator's dilemma playing out in public\u2026 the money is in the service, not the software.\" [Post](https://www.linkedin.com/posts/tomdmcnally_xero-paid-an-influencer-to-tell-small-businesses-activity-7501263484764995585-1c9K)\n- **FTC complaint, quoting Amazon's 2024 internal discussion:** a \"clever non-transparent way to charge first price\" was \"an incredibly effective way to drive revenue.\" [FTC](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme)\n- **Lee-Anne Mulholland, Google (Sept 2):** \"very pleased the court rejected the DOJ's proposal to break apart tools that help small businesses.\" [Bloomberg Law](https://news.bloomberglaw.com/antitrust/google-avoids-ad-exchange-sale-as-judge-orders-tech-integration)\n- **Robby Stein, Google Search (X, Sept 3, on the 3.8 Flash citation bug):** \"This isn't working as intended, and we'll roll out a fix soon.\" [Via SEL](https://searchengineland.com/google-to-fix-citation-bug-with-gemini-3-8-flash-in-ai-mode-486892)\n\n---\n\n## This Week in Marketing AI\n\n### FTC: Amazon rigged its ad auction with an invented bidder\n\nFiled Aug 31 (W.D. Wash.) with 22 states: since 2019 a hidden \"soft reserve price\" via an \"invented auction participant\" turned a marketed second-price auction into first-price; Sponsored Products advertisers paid their full bid ~80% of the time; surcharges rose on Prime Day; $20B+ extracted from ~1.2M customers. Amazon: \"misguided,\" CPC flat 2019\u20132024. Your bid strategy assumed second-price. [FTC](https://www.ftc.gov/news-events/news/press-releases/2026/08/ftc-states-sue-amazon-over-secret-ad-surcharge-scheme) \u00b7 [Reuters](https://www.reuters.com/legal/litigation/ftc-file-lawsuit-alleging-amazon-deceived-advertisers-wsj-reports-2026-08-31/)\n\n### Google keeps AdX and DFP\n\nJudge Brinkema (Sept 2) rejected divestiture and open-sourcing DFP's auction logic, accepted \"most\" behavioral remedies \"as modified\"; opinion sealed 14 days, joint Final Judgment due in 30. On the table: real-time bid data for rival ad servers, no Unified Pricing Rules, no first/last look. Second breakup avoided in a year; publisher damages suits continue. [The order](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1857.0_1.pdf) \u00b7 [Adweek](https://www.adweek.com/media/google-wont-be-forced-to-break-up-adtech-biz-even-after-monopoly-ruling/)\n\n### AI Max migration: a window, not a switch\n\nFrom Sept 1 through Sept 30, campaign-level broad match and ACA campaigns convert in place; ACA cohort also gets text customization (Google rewriting your copy) unless switched off after. API v25.1 exposes per-campaign timestamps (join with OR) and `enable_ai_max`. Evidence both ways: smec median +13% conversion value at 0% ROAS delta (250+ campaigns); Lunio's IVT divergence; Alphabet clicks +13%, CPC +3%. Don't sum classic and AI Max search-term reports; verify expanded final URLs. [Improvado](https://improvado.io/blog/google-ads-ai-max-september-2026-upgrade) \u00b7 [Choice OMG dossier](https://choice.marketing/research/google-ai-max-auto-upgrade/)\n\n### Gemini 3.8 Flash forgot to cite\n\nIn AI Mode Sept 2 (Pro/Ultra); by Sept 3 Gagan Ghotra and Glenn Gabe showed top-of-funnel answers with zero links; Stein: \"not working as intended,\" fixed by Sept 4. Your AI visibility is downstream of model defaults you don't control, and the fix came from a tweet. [SER](https://www.seroundtable.com/google-ai-mode-gemini-38-no-links-42011.html) \u00b7 [SEL](https://searchengineland.com/google-to-fix-citation-bug-with-gemini-3-8-flash-in-ai-mode-486892)\n\n### Search Console AI reports and opt-out went global (no clicks)\n\n\"As of August 31, 2026, we've rolled out this control to all websites worldwide.\" Impressions in AIOs, AI Mode, Discover AI by page/country/date/device; no clicks, queries, or positions; minimum-impressions threshold. Opt-out toggle removes a site from AI features as link or grounding, not a ranking signal. Arrived the day before AI Max started converting campaigns. [SER](https://www.seroundtable.com/google-search-console-generative-ai-tools-live-41984.html) \u00b7 [SEL](https://searchengineland.com/google-search-console-ai-performance-reports-and-search-generative-ai-control-rolling-out-globally-486269)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's Friday recap](https://www.seroundtable.com/video-09-04-2026-42015.html).*\n\n- **AI Overviews keep expanding by default**, \"more like AI Mode.\"\n- **Google News tab content disappearing** for some publishers; **Discover outage** this week. Annotate before blaming content.\n- **European search dataset licensing program** details posted by Google.\n- **Merchant Center AI insights expanded; Ads re-review status; phone/offline conversion docs.** [SER Sept 3](https://www.seroundtable.com/recap-09-03-2026-42013.html)\n- **An unexplained \"Alpha\" setting** in some Google Ads accounts. [Marketing O'Clock EP 448](https://marketingoclock.com/episodes/well-goto-a-world-with-google-searchs-goto-tracking-parameters/)\n- **Mueller:** no penalty for old links that later go bad; disavow rarely warranted.\n- **Human-verification \"continue\" button test; Trends category filters.**\n- **August spam update hit French SEOs.** [Search Engine Watch](https://searchenginewatch.com/google-drops-show-more-button-pushes-users-into-ai-mode/)\n- **LinkedIn slop flag expanding to comments.**\n- **Bing testing no site names in snippets; Copilot forcing login; AdSense impression measurement changed.**\n\n---\n\n## Common Threads\n\n### The auction is the product, and it's under review\nAmazon's invented bidder, Google's modified remedies, Google's AI Max auto-migration: trust the mechanics you can't inspect, in the week regulators said one was rigged and one stayed a monopoly.\n\n### Marketing to the people your product displaces\nXero, Samsung, OpenAI, Suno: four campaigns, one failure. The audience with the most to lose saw it first.\n\n### Citations are a feature flag\nTwo days without links, fixed by a tweet. The case for first-party demand.\n\n### Measurement arrives after the migration\nGSC AI reports global Aug 31, still no clicks; AI Max converting from Sept 1. Both questions open on the same dashboard.\n\n---\n\n## Angles for the Week\n\n- **An invented bidder.** What first-price mechanics do to your Amazon bid strategy. Window: now; reopens with each filing.\n- **Google kept the stack.** Buyer-side consequences of each behavioral remedy; preview now, update ~Sept 16. Window: two weeks.\n- **The brief was the problem.** Channel-aware influencer briefs, Xero as the case study. Window: open; GrowthX-native.\n- **Your citations are someone else's default.** First-party demand versus a model flag. Window: durable.\n- **A window, not a switch.** The September AI Max checklist: timestamps, `enable_ai_max`, separate search-term reports, expanded URLs. Window: through Sept 30.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
