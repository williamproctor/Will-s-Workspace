    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of June 26, 2026\n\n> **AI video control moved from better prompts toward better reference systems this week.** The most interesting reporting was not about a single new generator. It was about creators using **Blender camera animations, depth passes, edge passes, pose passes, grey-box scenes, and 3D blocking** as reference inputs for AI video, so the model follows an intentional move rather than inventing one. **ByteDance previewed Seedance 2.5** with vendor-stated claims of native 30-second clips, up to 50 multimodal reference inputs, region-level editing, and 3D preview controls, though independent 2.5 benchmarks will have to wait until public access. **OpenAI announced GPT-5.6 Sol, Terra, and Luna** in limited preview, with the benchmark story centered on long-horizon agent work, Terminal-Bench 2.1, and new `max` and `ultra` reasoning modes. And **Sonilo brought licensed video-to-music generation to fal.ai**, another sign that audio models are becoming more timeline-aware and video-conditioned.\n\n---\n\n## This Week in AI\n\n### Blender Camera References Turn AI Video Into a Controlled Shot\n\nThe most useful AI video trend this week is not a single product release. It is a production pattern: build the camera move in a 3D tool first, then use that motion as the control layer for generation.\n\nThe workflow shows up in a few different forms:\n\n- A Blender camera path or animation is rendered as a low-detail reference video.\n- Blender depth, normal, outline, or pose passes are exported frame by frame.\n- A grey-box scene provides the camera move, perspective, occlusion, and basic blocking.\n- ComfyUI or a similar pipeline feeds those passes into a video model as control guidance.\n- The model generates the final look while the 3D reference preserves the intended motion and layout.\n\nRunComfy's **Blender to ComfyUI AI Renderer 2.0** is a clear example. It reads structure from depth, outline, or pose passes and uses that to drive Wan VACE video generation. The key phrase in the documentation is that the final footage stays aligned with the \"original animation intent.\" In practical terms, Blender supplies the camera and scene geometry; the video model supplies the finished visual treatment.\n\nOther technical projects point in the same direction. ComfyUI Blender temporal nodes load Blender EXR depth and normal passes as ControlNet conditioning, treating Blender's Z-depth as ground-truth scene data rather than estimating depth from an already-generated video. LooseControlVideo, a June research release, uses spatial blocking with oriented 3D boxes to direct object placement and motion through a VACE-style conditioning path. VerseCrafter-style systems also frame the problem as 4D control: camera trajectory, object motion, and scene structure coordinated over time.\n\nThe AV relevance is straightforward. Text prompts are weak at exact camera language. \"Slow dolly in\" can mean many things. A camera path in Blender is specific: frame count, focal length, easing, distance, parallax, and subject position are all defined. The AI model no longer has to infer the camera move from language alone.\n\nThis is not yet a push-button production pipeline. It still requires 3D setup, pass export, model-specific control workflows, and careful review. But the direction is important: previs is becoming an input to generation. The rough 3D scene is no longer only a planning artifact; it can become the control track the AI follows.\n\n**Source:** [RunComfy \u2014 Blender to ComfyUI AI Renderer 2.0](https://www.runcomfy.com/comfyui-workflows/blender-to-comfyui-ai-renderer-2-0-workflow-cinematic-video-output) \u00b7 [ComfyUI Blender temporal nodes](https://github.com/12georgiadis/comfyui-blender-temporal) \u00b7 [LooseControlVideo \u2014 Directorial Video Control using Spatial Blocking](https://arxiv.org/html/2606.19495v1) \u00b7 [VerseCrafter overview](http://blog.brightcoding.dev/2026/05/17/versecrafter-revolutionary-4d-video-control-for-developers) \u00b7 June 2026\n\n### Seedance 2.5 Preview: Longer Clips, More References, More Control\n\nByteDance previewed **Seedance 2.5** on June 23 at its Volcano Engine FORCE conference in Beijing. The headline claim is a single native 30-second video clip, generated directly rather than stitched together from shorter clips.\n\nThe other major claim is reference capacity. Coverage from The Next Web and several follow-up explainers reported support for up to **50 multimodal reference inputs**, including images, audio clips, 3D white-box models, and style references. That is a very different control surface from a single prompt or a few still images.\n\nThe preview also described:\n\n- Native 4K output and 10-bit color depth.\n- Around 20 percent better prompt adherence, according to ByteDance.\n- Audio co-processed with visual signals rather than added separately.\n- Region-level editing that changes part of a frame while preserving the rest.\n- Low-detail 3D preview controls before committing to a full render.\n\nThe important caveat: Seedance 2.5 is not broadly available yet. It is in enterprise beta, with a public launch targeted for early July 2026. There are no independent 2.5 benchmark results yet. The shipping Seedance 2.0 model has performed strongly on independent video leaderboards, but 2.5 still needs public testing before its claims can be treated as measured results.\n\nStill, the direction is notable. Seedance 2.5 appears to be aimed less at quick prompt clips and more at controlled production inputs: references, 3D blocking, longer duration, local edits, synchronized audio, and fewer disconnected generation steps.\n\nThat connects directly to the Blender trend. The question for AI video is shifting from \"Can it generate a convincing shot?\" to \"Can it follow the shot we planned?\" Seedance 2.5's preview suggests ByteDance is making that the center of the product.\n\n**Source:** [The Next Web \u2014 ByteDance unveils Seedance 2.5](https://thenextweb.com/news/bytedance-seedance-2-5-ai-video-4k-30-seconds) \u00b7 [The Decoder \u2014 Seedance 2.5 breaks the 30-second barrier](https://the-decoder.com/bytedances-seedance-2-5-breaks-the-30-second-barrier-for-ai-video-generation/) \u00b7 [Tosea \u2014 Seedance 2.5 guide](https://tosea.ai/blog/seedance-2-5-bytedance-ai-video-model-guide) \u00b7 [WaveSpeed \u2014 Seedance 2.5 API watch](https://wavespeed.ai/blog/ai-api-pricing/seedance-2-5-api-watch/) \u00b7 June 23-26, 2026\n\n### GPT-5.6: The Benchmark Story Is Long-Horizon Agent Work\n\nOpenAI announced the **GPT-5.6** series on June 26 in limited preview: **Sol** as the flagship model, **Terra** as the balanced model, and **Luna** as the fast, lower-cost model.\n\nThe rollout is restricted at first to selected trusted partners through the API and Codex, with broader availability planned in the coming weeks. OpenAI says the limited release is part of a phased safety and coordination process around higher-capability models.\n\nThe pricing structure is also clearer than the access timeline:\n\n- GPT-5.6 Sol: **$5 input / $30 output per 1M tokens**\n- GPT-5.6 Terra: **$2.50 input / $15 output per 1M tokens**\n- GPT-5.6 Luna: **$1 input / $6 output per 1M tokens**\n\nThe benchmark story is not ordinary chat quality. It is agentic work: command-line workflows, long-running coding tasks, cybersecurity evaluations, and scientific analysis.\n\nOpenAI says GPT-5.6 Sol sets a new state of the art on **Terminal-Bench 2.1**, a benchmark focused on command-line tasks that require planning, iteration, and tool coordination. VentureBeat reported the specific OpenAI-provided figures: Sol reached **91.91%** in `ultra` mode and **88.76%** in `max` mode, compared with GPT-5.5 at **83.4%** and Claude Mythos 5 at **88%**. VentureBeat also reported that Sol cleared **50.9%** in code mode on Agent's Last Exam, the first model in that reporting to cross the halfway mark.\n\nThe new model family also introduces two inference modes worth noting:\n\n- `max` gives Sol more time to reason deeply.\n- `ultra` uses subagents to divide up complex work.\n\nFor AV teams, GPT-5.6 matters mostly in the tooling layer around production: scripts, internal apps, file organization, automations, QA passes, publishing workflows, and agents that need to operate across project context. It is not an AV generator. It is another sign that frontier-model competition is moving toward systems that can plan, use tools, and finish multi-step work with fewer human restarts.\n\n**Source:** [OpenAI \u2014 Previewing GPT-5.6 Sol](https://openai.com/index/previewing-gpt-5-6-sol/) \u00b7 [VentureBeat \u2014 GPT-5.6 Sol, Terra, and Luna](https://venturebeat.com/technology/openai-unveils-gpt-5-6-sol-terra-and-luna-models-but-only-accessible-to-limited-preview-partners-for-now-per-us-gov) \u00b7 June 26, 2026\n\n### Sonilo Brings Video-to-Music Generation to fal.ai\n\nSonilo announced on June 22 that its licensed **video-to-music** model is now available on **fal.ai**.\n\nThe model analyzes a video and generates an original soundtrack matched to the clip's duration, pacing, and emotional arc. The generated music is delivered as a separate audio track, so editors can adjust it independently from dialogue, voiceover, or existing sound effects. Through fal.ai, Sonilo says the model can score videos up to **600 seconds** long, and API access is available for developers building media tools.\n\nThe useful detail is that the model is video-conditioned. Instead of asking for \"calm background music\" in the abstract, the video itself becomes the timing reference. That makes this category different from general prompt-to-music systems. It is closer to automated scoring: the picture drives the structure.\n\nThis fits the week's broader pattern. Video models are taking 3D camera references and control passes. Music models are taking the actual video timeline as input. The control surface is moving away from text alone and toward the media objects production teams already use.\n\n**Source:** [Morningstar / PR Newswire \u2014 Sonilo launches on fal.ai](https://www.morningstar.com/news/pr-newswire/20260622cn86889/sonilo-launches-licensed-ai-music-generator-for-video-on-falai) \u00b7 [Sonilo](https://sonilo.com/) \u00b7 June 22, 2026\n\n### Quick Hits\n\n- **Runway Aleph 2.0 is now in Figma Weave** \u2014 Runway announced on June 22 that Aleph 2.0 is available inside Figma Weave. The workflow lets users extract a frame, edit that frame, connect it back to an Aleph node with a timestamp, and carry that edit through the video while preserving the rest of the shot. The notable pattern is node-based video revision inside a creative canvas.\n- **Seed Audio 1.0 surfaced alongside ByteDance's model stack** \u2014 ByteDance's FORCE announcements also included Seed Audio 1.0, described as a unified audio model for speech, music, and ambient sound. It is a supporting story, but it reinforces the same trend as Seedance 2.5: audio and video are being developed as connected generation layers.\n- **GPT-5.6 adds named cache breakpoints** \u2014 OpenAI says GPT-5.6 introduces a more predictable prompt-caching system with cache breakpoints and a 30-minute minimum cache life. For long-running agent workflows, predictable context reuse may matter almost as much as raw model quality.\n\n---\n\n## Voices This Week\n\n### OpenAI on the GPT-5.6 Naming Shift\n\nOpenAI framed the new Sol, Terra, and Luna names as durable capability tiers rather than temporary size labels:\n\n> \"In this new naming system introduced with GPT-5.6, the number identifies a model's generation, while Sol, Terra, and Luna identify durable capability tiers that can advance on their own cadence.\"\n\nThat is a useful change to watch. The frontier labs are trying to make model choice less about one flagship name and more about matching workload, cost, speed, and depth.\n\n### RunComfy on Blender as a Control Layer\n\nRunComfy's description of the Blender-to-ComfyUI workflow captures the larger camera-control trend:\n\n> \"Blender to ComfyUI AI Renderer 2.0 turns Blender outputs into cinematic, prompt-guided AI video while preserving motion and scene layout.\"\n\nThat is the point of the whole workflow. The 3D tool is not only for planning the shot; it becomes the structure the video model follows.\n\n---\n\n## Common Threads\n\n### Text Prompts Are Becoming the Least Precise Control\n\nThe strongest video workflows this week all use something more specific than text: Blender camera paths, depth passes, 3D blockouts, reference images, audio clips, regional masks, and timeline-conditioned music. Text is still part of the system, but it is no longer the only instruction.\n\n### Reference Capacity Is Becoming a Competitive Feature\n\nSeedance 2.5's preview claim of up to 50 multimodal references is important because it shows where model competition is going. A production team rarely has one piece of context. It has a shot list, style frames, reference images, audio timing, prior cuts, brand constraints, and sometimes a 3D scene. Models that can accept more of that context can be directed more precisely.\n\n### Agent Benchmarks Are Moving Toward Real Work\n\nGPT-5.6's most interesting benchmark claims are not single-answer tests. Terminal-Bench and Agent's Last Exam measure tool use, planning, iteration, and task completion. That is closer to the way AI is being used around AV production: not as a one-shot answer, but as a helper moving through folders, scripts, metadata, reviews, and publishing steps.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Grey-Box First, Generate Second\n\nThe old AI video workflow started with a prompt. The emerging workflow starts with a rough scene: boxes, camera path, depth, pose, timing, and maybe a first frame. That rough scene does not need to look finished. It needs to be spatially correct. The finished image can come later.\n\n### Region-Level Video Editing\n\nSeedance 2.5 and Aleph 2.0 both point toward a future where editing a generated video is less about regenerating the whole clip and more about changing a specific region, subject, frame, or object while preserving the rest. That is much closer to how editors think about revision.\n\n### Video-Conditioned Audio\n\nSonilo's fal.ai launch is a reminder that audio generation is moving toward picture-aware systems. Instead of generating a generic track and cutting it down, the model can read the video timing first and compose around it.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 5: Ask for a Delta\n\nLast week, the Back to Basics series covered **Tell It What Not to Change**: give the model preservation rules before asking it to revise something.\n\nThis week builds on that idea: **ask for a delta**.\n\nA delta is a short list of what changed. It is useful because AI outputs can look polished even when they quietly changed something important. If you ask for a delta, the model has to report its own edits back to you.\n\nUse it after any revision task:\n\n```text\nRevise this production note for clarity.\n\nPreserve exactly:\n- Speaker names\n- Timecodes\n- Technical terms\n- Approved wording\n\nAfter the revised version, include a delta:\n- What changed\n- What stayed the same\n- Anything that still needs human review\n```\n\nFor AV work, this is useful with scripts, captions, show notes, edit notes, equipment summaries, SharePoint copy, and documentation. It gives the reviewer a map of the changes instead of forcing them to compare every line from scratch.\n\nThe small habit: whenever you ask AI to revise, add one sentence at the end:\n\n```text\nAfter the revision, list the exact changes you made.\n```\n\nThat one line often makes the output easier to trust because it separates the revised text from the review trail.\n\nNext week, Back to Basics Week 6: **Use Checklists as Guardrails** \u2014 why a checklist can be better than a long paragraph of instructions.\n\n---\n\n## Sources\n\n1. [RunComfy \u2014 Blender to ComfyUI AI Renderer 2.0](https://www.runcomfy.com/comfyui-workflows/blender-to-comfyui-ai-renderer-2-0-workflow-cinematic-video-output) \u2014 June 2026 \u2014 Blender depth/outline/pose passes driving Wan VACE video generation\n2. [ComfyUI Blender temporal nodes](https://github.com/12georgiadis/comfyui-blender-temporal) \u2014 June 2026 \u2014 Blender EXR depth and normal passes as ControlNet conditioning\n3. [LooseControlVideo \u2014 Directorial Video Control using Spatial Blocking](https://arxiv.org/html/2606.19495v1) \u2014 June 2026 \u2014 spatial blocking and VACE-style video control\n4. [VerseCrafter overview](http://blog.brightcoding.dev/2026/05/17/versecrafter-revolutionary-4d-video-control-for-developers) \u2014 May/June 2026 \u2014 Blender trajectory editing and 4D video control\n5. [The Next Web \u2014 ByteDance unveils Seedance 2.5](https://thenextweb.com/news/bytedance-seedance-2-5-ai-video-4k-30-seconds) \u2014 June 2026 \u2014 Seedance 2.5 preview details\n6. [The Decoder \u2014 Seedance 2.5 breaks the 30-second barrier](https://the-decoder.com/bytedances-seedance-2-5-breaks-the-30-second-barrier-for-ai-video-generation/) \u2014 June 23, 2026 \u2014 30-second preview and related ByteDance model announcements\n7. [Tosea \u2014 Seedance 2.5 guide](https://tosea.ai/blog/seedance-2-5-bytedance-ai-video-model-guide) \u2014 June 2026 \u2014 release status, claimed capabilities, benchmark caveats\n8. [WaveSpeed \u2014 Seedance 2.5 API watch](https://wavespeed.ai/blog/ai-api-pricing/seedance-2-5-api-watch/) \u2014 June 2026 \u2014 API availability and pricing caveats\n9. [OpenAI \u2014 Previewing GPT-5.6 Sol](https://openai.com/index/previewing-gpt-5-6-sol/) \u2014 June 26, 2026 \u2014 GPT-5.6 series, access, pricing, capabilities\n10. [VentureBeat \u2014 GPT-5.6 Sol, Terra, and Luna](https://venturebeat.com/technology/openai-unveils-gpt-5-6-sol-terra-and-luna-models-but-only-accessible-to-limited-preview-partners-for-now-per-us-gov) \u2014 June 26, 2026 \u2014 benchmark details and model-tier analysis\n11. [Morningstar / PR Newswire \u2014 Sonilo launches on fal.ai](https://www.morningstar.com/news/pr-newswire/20260622cn86889/sonilo-launches-licensed-ai-music-generator-for-video-on-falai) \u2014 June 22, 2026 \u2014 video-to-music model and API launch\n12. [Sonilo](https://sonilo.com/) \u2014 2026 \u2014 video-to-music product details\n13. [Runway \u2014 Aleph 2.0 is now in Figma Weave](https://runwayml.com/news/aleph-2-in-figma-weave) \u2014 June 22, 2026 \u2014 Aleph node workflow inside Figma Weave\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of June 26, 2026\n\n> **This week, AI video control moved beyond prompts.** Creators are using Blender camera paths, depth passes, edge passes, pose passes, grey-box scenes, and 3D blocking to guide AI video models with precise camera movement. ByteDance previewed **Seedance 2.5** with claims of native 30-second clips, up to 50 reference inputs, regional editing, and 3D preview controls, though independent benchmarks are not available yet. OpenAI announced **GPT-5.6 Sol, Terra, and Luna** in limited preview, with the strongest benchmark story around long-horizon agent work. Sonilo also brought licensed video-to-music generation to fal.ai, showing audio tools becoming more timeline-aware.\n\n---\n\n## The Big Story\n\n### Blender Is Becoming a Camera-Control Layer for AI Video\n\nThe most interesting AI video trend this week is a workflow pattern: create the camera move in Blender first, then use that 3D reference to guide the AI video model.\n\nInstead of asking a model for a \"slow dolly in\" and hoping it understands the shot, creators can build the move in Blender and export a control reference:\n\n- A camera path\n- A grey-box scene\n- A depth pass\n- An outline pass\n- A pose pass\n- A low-detail reference animation\n\nRunComfy's **Blender to ComfyUI AI Renderer 2.0** is one example. It uses depth, outline, or pose passes to drive Wan VACE video generation so the final video follows the original layout and motion.\n\nOther projects point in the same direction. ComfyUI Blender temporal nodes use Blender EXR depth and normal passes as ControlNet conditioning. LooseControlVideo uses spatial blocking with 3D boxes to control object placement and movement.\n\nThe takeaway: the rough 3D scene is becoming more than a planning tool. It can become the control track for generation.\n\n**Source:** [RunComfy](https://www.runcomfy.com/comfyui-workflows/blender-to-comfyui-ai-renderer-2-0-workflow-cinematic-video-output) \u00b7 [ComfyUI Blender temporal nodes](https://github.com/12georgiadis/comfyui-blender-temporal) \u00b7 [LooseControlVideo](https://arxiv.org/html/2606.19495v1) \u00b7 June 2026\n\n---\n\n## Other Stories\n\n### Seedance 2.5 Preview Shows Where AI Video Is Heading\n\nByteDance previewed **Seedance 2.5** on June 23 at its Volcano Engine FORCE conference.\n\nThe headline claim is a single native 30-second clip, generated directly instead of stitched together from shorter clips. Reports also describe support for up to **50 multimodal reference inputs**, including images, audio clips, 3D white-box models, and style references.\n\nOther preview claims include:\n\n- Native 4K output and 10-bit color depth\n- Around 20 percent better prompt adherence\n- Audio generated in the same system as the video\n- Region-level editing\n- 3D preview controls before full rendering\n\nImportant caveat: Seedance 2.5 is not broadly available yet. It is in enterprise beta, with public launch targeted for early July. There are no independent Seedance 2.5 benchmark results yet.\n\nThe practical story is control. Seedance 2.5 appears designed around more references, longer clips, local edits, and more structured direction.\n\n**Source:** [The Next Web](https://thenextweb.com/news/bytedance-seedance-2-5-ai-video-4k-30-seconds) \u00b7 [The Decoder](https://the-decoder.com/bytedances-seedance-2-5-breaks-the-30-second-barrier-for-ai-video-generation/) \u00b7 [Tosea](https://tosea.ai/blog/seedance-2-5-bytedance-ai-video-model-guide) \u00b7 June 2026\n\n### GPT-5.6 Is About Long-Horizon Agent Work\n\nOpenAI announced the **GPT-5.6** series on June 26:\n\n- **Sol** \u2014 flagship model\n- **Terra** \u2014 balanced model\n- **Luna** \u2014 fast, lower-cost model\n\nAccess is limited at first to selected partners through the API and Codex, with broader availability planned in the coming weeks.\n\nThe benchmark story is agentic work, not ordinary chat. OpenAI says GPT-5.6 Sol sets a new state of the art on **Terminal-Bench 2.1**, which measures command-line tasks requiring planning, iteration, and tool coordination. VentureBeat reported OpenAI-provided figures of **91.91%** in `ultra` mode and **88.76%** in `max` mode.\n\nOpenAI also introduced:\n\n- `max` reasoning effort for deeper work\n- `ultra` mode, which uses subagents for complex tasks\n- More predictable prompt caching with named cache breakpoints\n\nFor AV teams, GPT-5.6 matters mostly around internal tools, publishing scripts, metadata cleanup, QA passes, and workflow agents.\n\n**Source:** [OpenAI](https://openai.com/index/previewing-gpt-5-6-sol/) \u00b7 [VentureBeat](https://venturebeat.com/technology/openai-unveils-gpt-5-6-sol-terra-and-luna-models-but-only-accessible-to-limited-preview-partners-for-now-per-us-gov) \u00b7 June 26, 2026\n\n### Sonilo Brings Video-to-Music to fal.ai\n\nSonilo announced that its licensed video-to-music model is now available on **fal.ai**.\n\nThe model analyzes a video and generates an original soundtrack matched to the clip's length, pacing, and emotional arc. It delivers the music as a separate audio track, so editors can adjust it without changing dialogue, voiceover, or sound effects.\n\nThrough fal.ai, Sonilo says it can score videos up to **600 seconds** long.\n\nThe important pattern: the video itself becomes the timing reference. Audio generation is becoming more connected to the actual edit, not just a separate prompt.\n\n**Source:** [Morningstar / PR Newswire](https://www.morningstar.com/news/pr-newswire/20260622cn86889/sonilo-launches-licensed-ai-music-generator-for-video-on-falai) \u00b7 [Sonilo](https://sonilo.com/) \u00b7 June 22, 2026\n\n---\n\n## Quick Hits\n\n- **Runway Aleph 2.0 is now in Figma Weave.** Users can extract a frame, edit it, connect it back to the Aleph node with a timestamp, and carry that edit through the video while preserving the rest of the shot.\n- **Seed Audio 1.0 surfaced in ByteDance's model stack.** It is described as a unified audio model for speech, music, and ambient sound.\n- **GPT-5.6 adds named prompt-cache controls.** OpenAI says GPT-5.6 supports cache breakpoints and a 30-minute minimum cache life, which matters for repeated long-context agent workflows.\n\n---\n\n## Common Threads\n\n### Text Prompts Are Not Precise Enough by Themselves\n\nThe strongest workflows this week use more than text: Blender camera paths, depth passes, 3D blockouts, reference images, audio timing, masks, and timelines.\n\n### References Are Becoming the Main Control Surface\n\nSeedance 2.5's preview claim of up to 50 reference inputs points to a broader shift. AI tools are becoming more useful when they can accept the materials production teams already have.\n\n### Agent Benchmarks Are Getting Closer to Real Work\n\nGPT-5.6's benchmark story focuses on tool use, planning, command-line workflows, and long-running tasks. That is closer to practical production support than a single-answer test.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 5: Ask for a Delta\n\nWhen AI revises something, ask it to tell you what changed.\n\nUse a prompt like this:\n\n```text\nRevise this production note for clarity.\n\nPreserve exactly:\n- Speaker names\n- Timecodes\n- Technical terms\n- Approved wording\n\nAfter the revised version, include a delta:\n- What changed\n- What stayed the same\n- Anything that still needs human review\n```\n\nFor AV work, this helps with scripts, captions, edit notes, show notes, equipment summaries, SharePoint copy, and documentation.\n\nThe simple version:\n\n```text\nAfter the revision, list the exact changes you made.\n```\n\nThat gives the reviewer a short change trail instead of forcing them to compare every line by hand.\n\nNext week: **Use Checklists as Guardrails**.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
