      slug: "2026-08-24",
      editionTitle: "Week of August 24, 2026",
      editionMd: "# Monday Signal \u2014 Week of August 24, 2026\n\n> **Three ad platforms narrowed manual price controls in the same seven days: Google's bidding recalibration went live Monday, Microsoft is retiring Max CPC for new campaigns October 1, and ChatGPT Ads made no-ceiling bidding its default while its own docs admit no cost guarantee.** The counterweight arrived the same week, in euros: Dutch regulators fined Uber \u20ac825 million for automated decisions with no human in the loop. Also this morning, ChatGPT ads switch on across 31 European markets stripped of personalization; Apple Maps ads went live Friday with 15% back for early movers; and Walmart put the first hard retailer numbers on agentic shopping. On the feed itself, a million LinkedIn members clicked \"seems like AI slop,\" and flagged posts lost 40% of their views.\n\n---\n\n## The Conversation\n\n### A million people clicked LinkedIn's slop button. Flagged posts lost 40% of their views.\n\nLinkedIn CPO Hari Srinivasan posted Thursday that the \"seems like AI slop\" button, live since July 30, has been clicked more than a million times, and that members now see 40% fewer views on content LinkedIn classifies as slop. His numbers came with a hedge (\"I hesitate to give numbers, as everyone has a different network and feed\") and a new consequence: posts that draw enough flags will surface a notice in the creator's Post Analytics reading \"Some members told us this post seems like AI.\" Behind the button, The Register notes, LinkedIn's classifiers were already catching hundreds of thousands of slop comments a day, and the platform removed its own AI \"enhance your post\" feature in July.\n\nThe comment section under Srinivasan's post carries the obvious objection: LinkedIn spent two years nudging members to write with AI and now hands readers a button to punish the results. Both things are true, which is what makes this a policy change rather than a feature.\n\n**Comment window:** open, and squarely in GrowthX's lane. The distribution penalty runs on a classifier's judgment of how writing sounds, so writing that doesn't sound generated is now a reach strategy with a measurable payoff, not a taste preference. Srinivasan said it himself: \"I know I'm increasingly conscious on how to not sound like AI.\"\n\n**Source:** [Srinivasan's post](https://www.linkedin.com/posts/hsrinivasan1_one-more-follow-up-on-ai-slop-first-activity-7495960472341409792-U4ZA) \u00b7 [The Register](https://www.theregister.com/ai-and-ml/2026/08/24/users-mash-linkedins-ai-slop-button-1m-times-in-3-weeks/5291802) \u00b7 [Engadget](https://www.engadget.com/2241857/linkedin-says-its-ai-slop-button-is-working/) \u00b7 August 20\u201324, 2026\n\n### BTS fans met the Gemini therapy ad with \"can't afford a real therapist?\"\n\nA Google Gemini promo in which BTS's V asks the assistant about relationship worries circulated widely this week, and the ARMY fandom pushed back on the premise rather than the celebrity. The reply that traveled: \"multimillionaire and he can't afford a real therapist?\" The discourse then excavated RM's 2022 lyric \"F**k the AI\" (paraphrased here; the line is explicit), which turned a routine celebrity placement into a referendum on the group's AI partnership. The campaign itself is large: Busan fan activations, Las Vegas out-of-home, now member-led product demos.\n\nTwo working lessons for anyone planning talent-led AI creative. The talent's own back catalog is now part of the brief; fans will find the anti-AI quote, and the contrast writes the headline. And positioning an assistant as emotional support is a third rail after a year of AI-companionship scrutiny; plant-care questions in the same ad drew no reaction at all.\n\n**Comment window:** narrowing on the ad itself, durable on the pattern. The audit-the-back-catalog point is unclaimed and practical.\n\n**Source:** [Coverage of the fan reaction](https://www.indiatimes.com/trending/bts-v-asks-ai-about-relationship-woes-in-gemini-ad-as-rms-fk-ai-lyric-resurfaces-fans-say-cant-afford-a-real-therapist/articleshow/133379003.html) \u00b7 week of August 17, 2026\n\n### Summer Club, week three: the backlash outlived the retreat\n\nOpenAI's creator retreat (covered in our August 10 edition) kept producing discourse long after the beekeeping ended. This week it crossed into mainstream and local press: the Hudson Valley's Times Union reported the organizer's identity had initially been described to locals as just \"a tech company,\" Business Insider noted some attendee posts had been deleted by Friday, and The Verge published the sharpest structural read: brand trips let companies rent creator trust while the creators absorb the backlash, the same mechanics as the 2023 Shein factory trip. Attendee Grace McCarrick, defending herself on LinkedIn, wrote that she \"genuinely had no idea that people were this anti-AI.\"\n\nThat sentence is the useful data point. A creator whose job is audience attunement misread the room on AI by a wide margin, which suggests plenty of brand teams are working from the same stale map of public sentiment.\n\n**Comment window:** the dunk phase is over. What's open is the sentiment-gap take: the distance between how AI-adjacent professionals feel about AI and how audiences do, with McCarrick's quote as the receipt.\n\n**Source:** [The Verge](https://www.theverge.com/tech/975173/openai-influencers-brand-trip-ai-backlash-marketing) \u00b7 [Times Union](https://www.timesunion.com/hudsonvalley/news/article/open-ai-wildflower-farms-tech-creator-retreat-22395319.php) \u00b7 [Business Insider](https://www.businessinsider.com/openai-creators-retreat-upstate-new-york-backlash-2026-8) \u00b7 August 17\u201321, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, calls, and statements where the week's arguments actually happened.\n\n- **Hari Srinivasan, chief product officer, LinkedIn** (LinkedIn, August 20): \"Over a million people have now clicked 'seems like AI slop,' since we launched it two weeks ago\u2026 overall members are now experiencing 40% less views on what we classify as AI slop from just a few weeks ago.\" And on his own writing: \"I know I'm increasingly conscious on how to not sound like AI.\" [The post](https://www.linkedin.com/posts/hsrinivasan1_one-more-follow-up-on-ai-slop-first-activity-7495960472341409792-U4ZA)\n- **John Furner, president and CEO, Walmart US** (Q2 FY27 earnings call, August 20): \"The number of customers using Sparky is up 70% from last year, and the customers and members who use Sparky for shopping spend 40% more per order than others who don't.\" [Call transcript](https://corporate.walmart.com/content/dam/corporate/documents/newsroom/2026/08/20/walmart-releases-q2-fy27-earnings/q2-fy27-earnings-call-transcript.pdf)\n- **Dave Dugan, VP of ads, OpenAI** (statement to Digiday on the European launch): \"There's no such thing as a one-size-fits-all European audience \u2014 and that's precisely what makes the region so dynamic\u2026 expectations around relevance, quality and trust are rightly high. We look forward to meeting that bar.\" [Digiday](https://digiday.com/marketing/openais-ads-business-hits-europe-at-the-six-month-mark/)\n- **Adam Spacke, advertising sales lead, Apple** (LinkedIn, August 21): \"Ads on Apple Maps launched TODAY!\" Businesses \"can now reach users across more than a billion of their relevant monthly searches on Maps - turning views into visits with flexible control in a privacy-first environment.\" [Via PPC Land](https://ppc.land/apple-maps-ads-go-live-with-15-back-capped-at-1-000-usd-a-month/)\n- **Robby Stein, VP of product, Google Search** (X, August 14): \"Next stop for Gemini 3.7 Flash? Google Search! We're bringing our most intelligent workhorse model to Search for even more helpful responses. Rolling out globally today in AI Mode for Google AI Pro & Ultra subscribers in English.\" [Via Search Engine Land](https://searchengineland.com/gemini-3-7-flash-rolling-out-in-google-search-485058)\n- **Monique Verdier, deputy chair, Dutch Data Protection Authority** (on the Uber fine, August 21): the deactivations happened \"without warning or human involvement,\" and such decisions \"have a significant impact on drivers' lives.\" [Via Reuters](https://www.reuters.com/world/dutch-regulator-fines-uber-966-million-automating-driver-suspensions-document-2026-08-21/)\n- **Grace McCarrick, creator** (LinkedIn, on the Summer Club backlash): \"genuinely had no idea that people were this anti-AI.\" [Via The Verge](https://www.theverge.com/tech/975173/openai-influencers-brand-trip-ai-backlash-marketing)\n\n---\n\n## This Week in Marketing AI\n\n### Three platforms narrowed manual price controls in the same week\n\nGoogle's bidding recalibration went live Monday, August 17: budget-capped campaigns on Target CPA or ROAS now optimize toward the stated target instead of the lower cost the budget cap used to produce, a one-way correction across five campaign types that raises spend for accounts that had been beating their targets. Friday, Microsoft confirmed that Max CPC manual bidding disappears for new non-portfolio campaigns on October 1 (existing campaigns keep it for now). And ChatGPT Ads made \"Maximize results\" the preselected strategy for eligible new ad groups, with a caveat sitting in OpenAI's own documentation: the strategy \"prioritizes result volume and does not guarantee delivery against a specific CPA, CPC, ROAS, or other cost-efficiency target at this time.\" The only ceiling is a per-ad-group switch to manual max bids; there's no account-level default.\n\nThe ChatGPT stack deserves the closest read because each piece loosens a constraint: daily budgets became seven-day averages in July with no opt-out, view-through conversions arrived August 18 in reporting but sit outside bidding and CPA math entirely, and Automatic Advanced Matching became the default August 17. Individually defensible; stacked, they describe an account where the spend limit is elastic, the bid has no ceiling by default, and part of the measured outcome can't be optimized against. All of it lands one week before the September 1 AI Max conversion.\n\n**Source:** [PPC Land on the Google rollout](https://ppc.land/google-today-forces-overperforming-cpas-up-across-5-campaign-types/) \u00b7 [PPC Land on Microsoft and OpenAI defaults](https://ppc.land/microsoft-retires-max-cpc-as-chatgpt-ads-defaults-to-automated-bidding/) \u00b7 [Search Engine Roundtable's week recap](https://www.seroundtable.com/video-08-21-2026-41915.html) \u00b7 August 17\u201321, 2026\n\n### ChatGPT ads reach 31 European markets today, stripped of personalization\n\nOpenAI announced August 18 that ads go live across the 27 EU states plus Iceland, Liechtenstein, Norway, and Switzerland on Monday, August 24 (this morning, if you're reading on time). Free and Go plans see ads; Plus, Pro, and Enterprise don't. The GDPR-shaped detail: personalized ads aren't available in the EEA or Switzerland at launch. Targeting runs on the current conversation, language, coarse location, and device; earlier chats, saved memories, and ad history stay out of it. Several European outlets framed the launch as consent-gated, but there's nothing to consent to yet; consent becomes relevant only when OpenAI adds personalization as a second step.\n\nThe timing marks six months since the February US pilot, after Canada, Australia, New Zealand, the UK, Mexico, Brazil, Japan, and South Korea. Booking runs through OpenAI's sales team and partner agencies; the self-serve Ads Manager still shows all 31 markets as \"coming soon,\" expected later this quarter. For European teams, the interesting test is whether conversation-context targeting alone performs, because that's the version of AI advertising the region's regulators are steering everyone toward.\n\n**Source:** [Digiday's report](https://digiday.com/marketing/openais-ads-business-hits-europe-at-the-six-month-mark/) \u00b7 [Notebookcheck on the no-personalization detail](https://www.notebookcheck.net/ChatGPT-ads-hit-Europe-on-Monday-but-not-the-personalized-kind.1375456.0.html) \u00b7 August 18\u201324, 2026\n\n### Apple Maps ads went live with 15% back for early movers\n\nApple switched on ad delivery inside Maps on Friday, August 21, a week after opening campaign creation to US and Canadian businesses. Two placements: Suggested Places, which surfaces ads before a query is typed (closer to discovery than search), and search results once intent narrows. Small businesses run automated campaigns through Apple Business; agencies get keywords, scheduling, location targeting, and an API through Apple Ads. The launch incentive is concrete: 15% of monthly spend back as a statement credit for up to a year, capped at $1,000 a month, for bookings made by credit card before October 11.\n\nApple's pitch numbers are Apple-reported: over a billion business searches on Maps a month, with one in two leading to an action like a call or directions. What's structurally notable is the targeting: location and time, no identity profiles, in what the sales team calls \"a privacy-first environment.\" Between this and Europe's contextual-only ChatGPT ads, identity-free auctions stopped being a compromise this week and became a product tier.\n\n**Source:** [PPC Land's go-live report](https://ppc.land/apple-maps-ads-go-live-with-15-back-capped-at-1-000-usd-a-month/) \u00b7 [9to5Mac on booking and the promo](https://9to5mac.com/2026/08/14/apple-maps-opens-ad-booking-for-businesses-promotional-offer-available/) \u00b7 [TechRepublic](https://www.techrepublic.com/article/news-apple-maps-ads-us-canada-businesses/) \u00b7 August 14\u201321, 2026\n\n### Walmart's ads grew 43%, and its AI shopper's users spend 40% more\n\nWalmart's Q2 FY27 report (August 20) gave retail media its strongest print of the season: global advertising up 38%, and Walmart Connect in the US up 43% excluding Vizio. The number with longer implications came from CEO John Furner on the call: customers using Sparky, Walmart's AI shopping agent, are up 70% year over year, and they spend 40% more per order than non-users (retailer-reported, and up from a 35% gap last quarter). The mechanism he described is cross-channel purchase history: Sparky builds baskets that skip what you already bought, online or in store. CFO John David Rainey listed \"leading in agentic experiences\" among the company's strategic priorities.\n\nThe ledger has both columns: the Vibe acquisition (self-serve CTV) now carries a quantified ~20-basis-point operating-income headwind after June guidance said no impact, and the stock fell about 9% premarket on the wider print even with raised full-year guidance. Still, this is the first time a retailer's CEO has attached hard order-value numbers to an in-house shopping agent, which moves agentic commerce from thesis to line item.\n\n**Source:** [Earnings call transcript](https://corporate.walmart.com/content/dam/corporate/documents/newsroom/2026/08/20/walmart-releases-q2-fy27-earnings/q2-fy27-earnings-call-transcript.pdf) \u00b7 [Walmart's release](https://corporate.walmart.com/news/2026/08/20/walmart-releases-q2-fy27-earnings) \u00b7 [PPC Land's analysis](https://ppc.land/walmart-ad-business-gains-38-as-walmart-connect-hits-43-in-q2/) \u00b7 August 20, 2026\n\n### Uber's \u20ac825 million fine prices automation without human review\n\nThe Dutch Data Protection Authority, working with France's CNIL, fined Uber \u20ac824,990,000 on Friday for fully automated driver deactivations between 2018 and 2022: fraud suspicions triggered temporary blocks and low customer ratings triggered temporary or permanent ones, with what the regulator called a complete absence of human intervention, plus inadequate disclosure to drivers that software was deciding. It's the second-largest GDPR fine ever, calculated at the 4%-of-global-turnover maximum under Article 22, the provision governing automated individual decisions. Uber is appealing: \"We strongly disagree with this decision and disproportionate fine.\"\n\nThe marketing translation is direct. Article 22 covers decisions that significantly affect people made without human review, and platform ecosystems run on exactly those: ad-account suspensions, policy enforcement, monetization cutoffs. This fine landed the same week three ad platforms narrowed manual controls, and that's the asymmetry to sit with: platforms are automating the decisions while regulators start pricing unaccountable automation. The complaint began with more than 170 French drivers and a human-rights association in 2020; six years later it's a billion-dollar precedent.\n\n**Source:** [The regulator's announcement](https://www.autoriteitpersoonsgegevens.nl/actueel/uber-krijgt-boete-van-bijna-825-miljoen-euro-voor-geautomatiseerd-blokkeren-van-chauffeurs) \u00b7 [CNIL's English summary](https://www.cnil.fr/en/automated-decisions-uber-fined-nearly-eur-825-million) \u00b7 [Reuters](https://www.reuters.com/world/dutch-regulator-fines-uber-966-million-automating-driver-suspensions-document-2026-08-21/) \u00b7 August 21, 2026\n\n### Two studies priced AI trust: a 31.5% label tax and a 6% delegation rate\n\nThe IAB published version 2 of its AI Transparency & Disclosure Framework on August 18, and the load-bearing number inside is from NYU Stern: telling consumers an ad was made with generative AI cut its click-through rate by 31.5%. The framework uses that cost to argue for materiality-based labeling rather than blanket disclosure: synthetic spokespeople, digital twins, and fabricated scenarios get labels; color correction and stylized imagery don't. Implementation is specified down to the glyph (the \u2728 character or \"AI-generated\" text at WCAG-AA contrast, C2PA metadata underneath) on a 24-month roadmap. It's voluntary, and it arrives after the law: EU AI Act Article 50 has applied since August 2, with California and New York running their own regimes.\n\nStackAdapt's \"AI Delegation Gap\" report (August 19, fielded by NewtonX among 500 marketing professionals) supplied the other half of the trust ledger: 91% of organizations use AI tools, 88% report performance gains, and 6% say they almost always act on in-platform AI recommendations. Comfort falls from 90% when AI recommends to 50% when it acts autonomously, even with proven performance; 42% ignore recommendations as generic; 17% report no clear accountability for bad AI decisions. Set those numbers against this week's default-automation moves and the shape of 2026 is visible: the platforms' confidence in delegation is running about eight times ahead of their customers'.\n\n**Source:** [IAB framework](https://www.iab.com/guidelines/ai-transparency-disclosure-standards-v2/) \u00b7 [Marketing Dive](https://www.marketingdive.com/news/iab-revisits-ai-disclosure-in-ads-as-legal-requirements-multiply/828182/) \u00b7 [StackAdapt report (PDF)](https://s3.amazonaws.com/media.mediapost.com/uploads/StackAdapt_AI-Delegation-Gap-Report_2026.pdf) \u00b7 [PPC Land on the survey](https://ppc.land/only-6-of-marketers-act-on-in-platform-ai-recommendations-stackadapt-finds/) \u00b7 August 18\u201319, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/bid-controls-shrink-as-ad-measurement-breaks-week-of-august-17/).*\n\n- **The August 2026 spam update finished** in under three days (August 18, 12:30pm ET to August 21, 4:50am ET). A normal, global spam update per Google; it doesn't target link spam or site-reputation abuse. [Search Engine Roundtable](https://www.seroundtable.com/google-august-2026-spam-update-done-41906.html)\n- **Gemini 3.7 Flash became selectable in AI Mode** (announced August 14 by Search VP Robby Stein on X, a day after the model launched). Global, English, Pro and Ultra subscribers only, via the \"+\" model picker. If your AI Mode citations look inconsistent, running the same query across Flash, Auto, and Pro is now a diagnostic. [Search Engine Land](https://searchengineland.com/gemini-3-7-flash-rolling-out-in-google-search-485058) \u00b7 [SEJ](https://www.searchenginejournal.com/google-brings-gemini-3-7-flash-to-ai-mode-in-search/585923/)\n- **Google shipped AI Max testing and planning tools** (August 20): multi-campaign A/B tests of budgets and ROI targets rolling out in September, experiments that respect brand and location controls, and one-click Performance Planner applies. Testing infrastructure arriving eleven days before the forced migration is its own message. [Google's announcement](https://blog.google/products/ads-commerce/ai-max-testing-planning-tools/)\n- **Microsoft Advertising rolled out AI Max globally** (~August 18): keyword-free matching, real-time text customization, and final-URL expansion with exclusions. [Search Engine Roundtable's recap](https://www.seroundtable.com/video-08-21-2026-41915.html)\n- **Similarweb launched AI Ads** (August 17), competitive ad intelligence for ChatGPT, Google AI Mode, and AI Overviews. The headline stat, 26% of ad-eligible ChatGPT replies carrying a sponsored ad, is the same US-desktop measurement we cited July 27; it now has a product behind it, because those surfaces still have no ad library. [PPC Land on the launch](https://ppc.land/similarweb-opens-ai-ad-data-as-26-of-chatgpt-replies-carry-sponsored-ads/)\n- **YouTube merged copyright and AI-likeness enforcement into one Claims dashboard** (August 19). Two doc lines that matter for brand teams: AI disclosures don't stop likeness claims, and privacy settings don't either, so private and unlisted pre-launch videos are claimable. Shorts of 1\u20133 minutes with an active claim get blocked outright.\n- **Search Console's measurement problems continued:** the impressions-logging bug annotated August 13 is still marked ongoing, and the crawl-stats report lost August 15\u201316 entirely. Annotate everything; September reads depend on this data being trustworthy. [Search Engine Roundtable](https://www.seroundtable.com/google-search-console-performance-reports-drop-41884.html)\n- **TikTok is paying $400 million to end its 2019 COPPA consent decree**, with $100 million contingent on a judge vacating the order (hearing September 21). Judicial supervision would otherwise have run to 2029.\n- **The agentic-ads standards fight got explicit:** IAB Tech Lab's Shailley Singh counted 13 functions where its AAMP spec overlaps the rival Ad Context Protocol, and said AAMP \"is not an 'impression-layer protocol.'\" Overlapping standards mean integration bets placed now carry rework risk.\n- **Two courtroom notes on automation:** a class action against Oura used the Meta Ad Library as timestamped evidence, counting 1,820 possible Dynamic Creative combinations to argue automated mixing amplified a uniform claim; and a judge kept xAI's Grok privacy suit in California because the terms of service were \"too faint to bind\" (grey text, white links, black background). Your ad archive and your contrast ratios are both discoverable now.\n\n---\n\n## Common Threads\n\n### Controls left, accountability arrived\n\nThe same week Google, Microsoft, and OpenAI narrowed manual price controls, a Dutch regulator set the price of unaccountable automation at \u20ac825 million, a US class action turned Dynamic Creative's 1,820 combinations into evidence, and a judge voided a terms-of-service clause over contrast ratios. Platforms are automating decisions faster than anyone can observe them, and the legal system's answer is to make the automation itself the liability.\n\n### The audience got buttons\n\nA million LinkedIn members clicked \"seems like AI slop.\" BTS fans turned a Gemini ad into a referendum. NYU's research says an AI label alone costs 31.5% of clicks. The reaction to AI content is no longer a sentiment in surveys; it has interfaces, and they feed classifiers and court filings.\n\n### Identity-free launched as a tier, not a fallback\n\nApple Maps ads target location and time with no identity profiles, sold as \"privacy-first.\" ChatGPT's European ads run on conversation context only, because GDPR made personalization the second step. Two major auctions launched identity-free in the same week and neither apologized for it, which is worth remembering the next time a vendor equates targeting depth with performance.\n\n### Shoppers delegate before marketers do\n\nWalmart's agent users spend 40% more per order while 6% of marketers act on their ad platform's AI recommendations. Consumers are handing decisions to agents faster than professionals are, possibly because Sparky explains itself with a basket you can inspect, and a bid recommendation doesn't.\n\n---\n\n## Angles for the Week\n\n### Your last week of manual ceilings\n\nSeptember 1 converts ACA and campaign-level broad match campaigns to AI Max; October 1 removes Max CPC for new Microsoft campaigns; ChatGPT ad groups now default to uncapped bidding. The practical post is a pin-it-down checklist for this week: record current targets and actuals, screenshot bid strategies, set exclusions, annotate GSC and GA4, and pick the one KPI you'll trust through the turbulence. Window: closes September 1; the checklist version wins if it ships in the next 48 hours.\n\n### Not sounding like AI is now a distribution strategy\n\nLinkedIn's classifier cuts 40% of views on what it flags, a million users are training it, and creators get notified when their writing reads as generated. The take with legs: the \"write like a human\" advice industry just acquired a P&L, and the LinkedIn CPO's own admission that he's \"increasingly conscious on how to not sound like AI\" is the pull quote. Fits GrowthX's editorial positioning exactly. Window: open now; the Register piece is dated today.\n\n### The 15% rebate on being early to Apple Maps\n\nLocal and multi-location brands have until October 11 to book Maps ads with 15% back for a year, capped at $1,000 a month, in an auction with almost no competition yet. The angle is the early-mover math: modest spend, credited back, in exchange for first-party learnings on a surface competitors will arrive at later. Pair it with the identity-free point for the privacy-conscious client. Window: promo expires October 11; sharpest in the next two weeks.\n\n### \u20ac825 million is the price of no human in the loop\n\nUber's fine reads as gig-economy news, but Article 22 covers any automated decision that significantly affects someone, and marketing platforms make those all day: account suspensions, policy takedowns, monetization cutoffs. The forward-looking take: agencies and platforms that can show a human review layer will start winning trust (and procurement checklists) that pure automation loses. Window: the fine is this week's hook; the principle holds through the appeal.\n\n### Europe just previewed the default future of AI ads\n\nChatGPT's 31-market launch runs contextual-only: conversation, language, location, device. If those ads perform, the case for identity-based targeting in AI surfaces weakens well beyond the EEA. The angle for a measurement-minded audience: watch the first European performance benchmarks like a hawk, because they'll set the reference point regulators and buyers use for years. Window: launch is today; the framing is freshest this week.\n\n---\n\n## Sources\n\n**Primary documents, posts, and calls**\n\n1. [Hari Srinivasan \u2014 LinkedIn post on the slop button milestone](https://www.linkedin.com/posts/hsrinivasan1_one-more-follow-up-on-ai-slop-first-activity-7495960472341409792-U4ZA) \u2014 August 20, 2026 \u2014 verbatim quotes, 1M clicks, 40% views figure, Post Analytics notice\n2. [Walmart \u2014 Q2 FY27 earnings call transcript (PDF)](https://corporate.walmart.com/content/dam/corporate/documents/newsroom/2026/08/20/walmart-releases-q2-fy27-earnings/q2-fy27-earnings-call-transcript.pdf) \u2014 August 20, 2026 \u2014 Furner's Sparky quotes, Rainey's priorities, ad segment detail\n3. [Walmart \u2014 Q2 FY27 earnings release](https://corporate.walmart.com/news/2026/08/20/walmart-releases-q2-fy27-earnings) \u2014 August 20, 2026 \u2014 Connect +43% ex-Vizio, segment figures\n4. [Autoriteit Persoonsgegevens \u2014 Uber fine announcement](https://www.autoriteitpersoonsgegevens.nl/actueel/uber-krijgt-boete-van-bijna-825-miljoen-euro-voor-geautomatiseerd-blokkeren-van-chauffeurs) \u2014 August 21, 2026 \u2014 the \u20ac824,990,000 decision, violations, prior fines\n5. [CNIL \u2014 English summary of the Uber decision](https://www.cnil.fr/en/automated-decisions-uber-fined-nearly-eur-825-million) \u2014 August 2026 \u2014 complaint origin (170+ drivers, 2020), Article 22 reasoning\n6. [Google \u2014 new AI Max testing and planning tools](https://blog.google/products/ads-commerce/ai-max-testing-planning-tools/) \u2014 August 20, 2026 \u2014 multi-campaign experiments, Performance Planner\n7. [IAB \u2014 AI Transparency & Disclosure Framework V2](https://www.iab.com/guidelines/ai-transparency-disclosure-standards-v2/) \u2014 August 18, 2026 \u2014 the framework itself; [full PDF](https://www.iab.com/wp-content/uploads/2026/08/IAB_AI_Trasparency_Disclosure_Framework_August_2026.pdf)\n8. [StackAdapt \u2014 The AI Delegation Gap (PDF)](https://s3.amazonaws.com/media.mediapost.com/uploads/StackAdapt_AI-Delegation-Gap-Report_2026.pdf) \u2014 August 19, 2026 \u2014 survey methodology and findings\n\n**Original reporting**\n\n9. [Digiday \u2014 OpenAI takes ChatGPT ads into Europe](https://digiday.com/marketing/openais-ads-business-hits-europe-at-the-six-month-mark/) \u2014 August 2026 \u2014 the 31-market launch, Dugan statement, six-month framing\n10. [Notebookcheck \u2014 the no-personalization detail](https://www.notebookcheck.net/ChatGPT-ads-hit-Europe-on-Monday-but-not-the-personalized-kind.1375456.0.html) \u2014 August 2026 \u2014 EEA contextual-only mechanics, market list\n11. [Reuters \u2014 Dutch regulator abel-fatigue framing, regulatory context\n29. [Coverage of the BTS V Gemini ad reaction](https://www.indiatimes.com/trending/bts-v-asks-ai-about-relationship-woes-in-gemini-ad-as-rms-fk-ai-lyric-resurfaces-fans-say-cant-afford-a-real-therapist/articleshow/133379003.html) \u2014 August 2026 \u2014 fan quotes, campaign scope\n\n**Roundups consulted**\n\n30. [PPC Land \u2014 weekly synthesis, week of August 17](https://ppc.land/bid-controls-shrink-as-ad-measurement-breaks-week-of-august-17/) \u2014 August 23, 2026 \u2014 discovery index; watch-section items as credited above (YouTube Claims, TikTok decree, AAMP/AdCP, Oura, Grok)\n31. [Search Engine Roundtable \u2014 Friday video recap](https://www.seroundtable.com/video-08-21-2026-41915.html) \u2014 August 21, 2026 \u2014 Microsoft AI Max global, ChatGPT Ads Europe note, smaller Google items\n32. [Marketing O'Clock \u2014 EP 446](https://marketingoclock.com/) \u2014 August 17, 2026 \u2014 practitioner framing of bidding day and the language-targeting removal\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# Monday Signal \u2014 Week of August 24, 2026\n\n> **Three ad platforms narrowed manual price controls in one week (Google's recalibration live, Microsoft retiring Max CPC October 1, ChatGPT Ads defaulting to no-ceiling bidding), and the same week Dutch regulators priced unaccountable automation at \u20ac825 million.** Also: ChatGPT ads reach 31 European markets this morning without personalization, Apple Maps ads went live with 15% back, Walmart's AI shopper users spend 40% more per order, and a million LinkedIn members clicked \"seems like AI slop.\"\n\n---\n\n## The Conversation\n\n### LinkedIn's slop button: 1M clicks, flagged posts \u221240% views\n\nCPO Hari Srinivasan posted Thursday: a million+ clicks since July 30, 40% fewer views on content LinkedIn classifies as slop, and a coming Post Analytics notice (\"Some members told us this post seems like AI\"). His own admission: \"I know I'm increasingly conscious on how to not sound like AI.\" Writing that doesn't sound generated is now a measurable reach strategy. [Srinivasan's post](https://www.linkedin.com/posts/hsrinivasan1_one-more-follow-up-on-ai-slop-first-activity-7495960472341409792-U4ZA)\n\n### BTS fans vs the Gemini therapy ad\n\nV asked Gemini about relationship worries; the fandom answered \"multimillionaire and he can't afford a real therapist?\" and resurfaced RM's 2022 anti-AI lyric. Lessons: the talent's back catalog is part of the brief now, and AI-as-emotional-support is a third rail. [Coverage](https://www.indiatimes.com/trending/bts-v-asks-ai-about-relationship-woes-in-gemini-ad-as-rms-fk-ai-lyric-resurfaces-fans-say-cant-afford-a-real-therapist/articleshow/133379003.html)\n\n### Summer Club, week three\n\nThe retreat backlash (our August 10 lead) crossed into mainstream and local press; some attendee posts got deleted, and The Verge named the mechanism: brands rent creator trust, creators absorb the backlash. Attendee Grace McCarrick on LinkedIn: she \"genuinely had no idea that people were this anti-AI.\" That sentiment gap is the reusable insight. [The Verge](https://www.theverge.com/tech/975173/openai-influencers-brand-trip-ai-backlash-marketing)\n\n---\n\n## Voices\n\n- **Hari Srinivasan, LinkedIn (August 20):** \"Over a million people have now clicked 'seems like AI slop'\u2026 members are now experiencing 40% less views on what we classify as AI slop.\" [Post](https://www.linkedin.com/posts/hsrinivasan1_one-more-follow-up-on-ai-slop-first-activity-7495960472341409792-U4ZA)\n- **John Furner, Walmart US CEO (Q2 call):** \"customers and members who use Sparky for shopping spend 40% more per order than others who don't.\" [Transcript](https://corporate.walmart.com/content/dam/corporate/documents/newsroom/2026/08/20/walmart-releases-q2-fy27-earnings/q2-fy27-earnings-call-transcript.pdf)\n- **Dave Dugan, OpenAI VP of ads (to Digiday):** \"Europe is home to some of the world's most creative and sophisticated advertising markets, where expectations around relevance, quality and trust are rightly high.\" [Digiday](https://digiday.com/marketing/openais-ads-business-hits-europe-at-the-six-month-mark/)\n- **Robby Stein, Google Search (X, August 14):** \"Next stop for Gemini 3.7 Flash? Google Search!\u2026 Rolling out globally today in AI Mode for Google AI Pro & Ultra subscribers in English.\" [Via SEL](https://searchengineland.com/gemini-3-7-flash-rolling-out-in-google-search-485058)\n\n---\n\n## This Week in Marketing AI\n\n### Manual price controls narrowed on three platforms\n\nGoogle's recalibration went live August 17 (budget-capped campaigns now spend toward stated targets; one-way correction). Microsoft retires Max CPC for new non-portfolio campaigns October 1. ChatGPT Ads preselected \"Maximize results,\" whose own docs say it \"does not guarantee delivery against a specific CPA, CPC, ROAS, or other cost-efficiency target at this time\"; budgets are already 7-day averages, and new view-through metrics sit outside bidding entirely. One week before the September 1 AI Max conversion. [PPC Land \u2014 Google](https://ppc.land/google-today-forces-overperforming-cpas-up-across-5-campaign-types/) \u00b7 [PPC Land \u2014 Microsoft/OpenAI](https://ppc.land/microsoft-retires-max-cpc-as-chatgpt-ads-defaults-to-automated-bidding/)\n\n### ChatGPT ads hit 31 European markets today\n\nAnnounced August 18, live August 24: EU27 plus Iceland, Liechtenstein, Norway, Switzerland. Free and Go plans only. No personalization in the EEA/Switzerland at launch; targeting is conversation, language, coarse location, device. Self-serve Ads Manager still \"coming soon\"; bookings via sales team and agencies. Six months from US pilot to 40 markets. If contextual-only performs, it resets the AI-ads targeting debate everywhere. [Digiday](https://digiday.com/marketing/openais-ads-business-hits-europe-at-the-six-month-mark/) \u00b7 [Notebookcheck](https://www.notebookcheck.net/ChatGPT-ads-hit-Europe-on-Monday-but-not-the-personalized-kind.1375456.0.html)\n\n### Apple Maps ads went live (with a rebate)\n\nDelivery on since Friday, US and Canada: Suggested Places (pre-query) and search results. 15% monthly statement credit for up to a year, capped at $1,000/month, book by October 11. Location and time targeting, no identity profiles. Apple-reported: 1B+ business searches a month, half leading to action. [PPC Land](https://ppc.land/apple-maps-ads-go-live-with-15-back-capped-at-1-000-usd-a-month/) \u00b7 [9to5Mac](https://9to5mac.com/2026/08/14/apple-maps-opens-ad-booking-for-businesses-promotional-offer-available/)\n\n### Walmart: Connect +43%, Sparky users spend +40%\n\nQ2 FY27 (August 20): global ads +38%, Walmart Connect +43% ex-Vizio. Furner: Sparky users up 70% YoY and spending 40% more per order (retailer-reported; 35% last quarter). Vibe acquisition now a ~20bps operating-income headwind; stock fell ~9% premarket despite raised guidance. First retailer CEO to put hard order-value numbers on an in-house shopping agent ug 21; normal and global. [SER](https://www.seroundtable.com/google-august-2026-spam-update-done-41906.html)\n- **Gemini 3.7 Flash in AI Mode** for Pro/Ultra subscribers (English, global); compare citations across Flash/Auto/Pro when results look inconsistent. [SEL](https://searchengineland.com/gemini-3-7-flash-rolling-out-in-google-search-485058)\n- **AI Max testing tools** (multi-campaign A/B, brand/location controls in experiments) rolling out September. [Google](https://blog.google/products/ads-commerce/ai-max-testing-planning-tools/)\n- **Microsoft AI Max went global:** keyword-free matching, real-time copy, URL expansion. [SER recap](https://www.seroundtable.com/video-08-21-2026-41915.html)\n- **Similarweb AI Ads launched:** competitive intel for ChatGPT/AI Mode/AIO; the 26% ads-in-replies stat we cited in July now has a product behind it. [PPC Land](https://ppc.land/similarweb-opens-ai-ad-data-as-26-of-chatgpt-replies-carry-sponsored-ads/)\n- **YouTube merged copyright and AI-likeness claims** into one dashboard; disclosures and privacy settings don't stop likeness claims, and unlisted pre-launch videos are claimable.\n- **Search Console still mismeasuring:** impressions bug ongoing since ~Aug 12; crawl stats lost Aug 15\u201316. [SER](https://www.seroundtable.com/google-search-console-performance-reports-drop-41884.html)\n- **TikTok pays $400M** to end its 2019 COPPA decree; vacatur hearing September 21.\n- **AAMP vs Ad Context Protocol:** 13 overlapping functions per IAB Tech Lab; agentic-ads standards are now a two-spec race.\n- **Courtroom pair:** Oura class action used the Meta Ad Library (1,820 Dynamic Creative combos) as evidence; xAI's Grok terms ruled \"too faint to bind\" over contrast. Ad archives and design choices are discoverable.\n\n---\n\n## Common Threads\n\n### Controls left, accountability arrived\n\nPlatforms removed price ceilings; a regulator priced unaccountable automation at \u20ac825M; a class action turned creative automation into evidence. Automation is being maximized on one side of the market and litigated on the other.\n\n### The audience got buttons\n\nA million slop flags, a fandom revolt, a 31.5% label tax. Anti-AI sentiment now has interfaces, and they feed classifiers and court filings.\n\n### Identity-free launched as a tier\n\nApple Maps (location + time, no profiles) and ChatGPT Europe (conversation context only) both went live identity-free in the same week, unapologetically.\n\n### Shoppers delegate before marketers do\n\nSparky users spend 40% more per order; 6% of marketers act on platform AI recommendations. The delegation gap is on the buy side, not the consumer side.\n\n---\n\n## Angles for the Week\n\n- **Your last week of manual ceilings.** Pin down targets, strategies, exclusions, and annotations before September 1. Window: 48 hours for the checklist post.\n- **Not sounding like AI is now a distribution strategy.** LinkedIn's classifier cuts 40% of views; the CPO polices his own prose. Window: open now.\n- **The 15% rebate on being early to Apple Maps.** Early-mover math for local brands before October 11. Window: two weeks, sharpest now.\n- **\u20ac825M is the price of no human in the loop.** Article 22 reaches ad-account automation too; human-review layers become a trust asset. Window: this week's hook, durable principle.\n- **Europe previewed AI ads' default future.** Contextual-only ChatGPT ads start today; the first benchmarks will anchor the targeting debate. Window: freshest this week.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
