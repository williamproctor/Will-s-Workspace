    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of May 1, 2026\n\n> **Insta360 and Splatica announced Project Eternal**, a joint reality-capture pipeline that turns a single 360 camera walk-through into a fully navigable Gaussian splat \u2014 the clearest signal yet that volumetric capture is migrating from purpose-built rigs to consumer hardware. Nathaniel Whittemore's *AI Daily Brief* used the same week to make the case that the model you pick matters less than the **personal \"Agent OS\"** you build underneath it, with an AI chief of staff as the entry point. **Alibaba's HappyHorse 1.0** seized the #1 spot on the Artificial Analysis Video Arena, surpassing ByteDance's Seedance 2.0 in both text-to-video and image-to-video, built in five months by the architect of Kling 1.0 and 2.0. **ElevenLabs shipped ElevenMusic** with a first-of-its-kind licensing deal through Believe and TuneCore that pays artists when their style is referenced. **Topaz Labs' \"Next-Gen\" release** rebuilt its image and video stack from the ground up. And **Anthropic moved Claude's persistent memory** for managed agents into public beta \u2014 addressing what builders are calling the single biggest infrastructure gap in agentic AI.\n\n---\n\n## This Week in AI\n\n### Insta360 + Splatica Launch Project Eternal \u2014 A 360 Camera Becomes a Gaussian Splat Pipeline\n\nInsta360 and Splatica announced **Project Eternal** on April 28 \u2014 a joint reality-capture pipeline that takes footage from a consumer 360 camera (the Insta360 X5 and One RS 1-inch 360 are the supported flagships) and converts it directly into a **Gaussian splat** that can be navigated in any direction inside a 3D viewer or game engine. The pipeline runs in Splatica's cloud; processing time is roughly 1.5\u00d7 the capture duration for a 5-minute walk-through.\n\nWhat's new about this is not the math \u2014 Gaussian splatting research has been mature since 2023 \u2014 but the **input device**. Until now, photoreal volumetric capture meant either a static photogrammetry scan, a multi-camera rig like the OBSBOT 60-camera demo at NAB 2026, or a high-end LIDAR + mirrorless workflow. Project Eternal collapses the capture step to a single handheld 360 camera the operator walks through the space with, the same way they'd shoot a real-estate tour.\n\nThe Verge's hands-on, [published April 30](https://www.theverge.com/photography/insta360-splatica-gaussian-splat), made the comparison explicit: \"Until this week, getting a Gaussian splat into a film, game, or training simulation meant hiring a specialist. Insta360 just shipped the consumer version.\" The output exports as standard `.splat` and `.ply` files that drop directly into Unreal Engine 5.6, Unity 6, Blender 4.5, and Niantic's Scaniverse, plus native viewers in Apple Vision Pro and Meta Horizon OS.\n\nPractical numbers from the launch:\n\n- **$29/month subscription** (or $0.50/minute pay-as-you-go) for cloud processing, separate from the camera hardware.\n- **Up to 30 minutes of source footage per scene**, with automatic stitching across multiple captures.\n- **Native depth alignment** with the Insta360 X5's dual 1-inch sensors \u2014 Splatica's ML pipeline uses the parallax between sensors to bootstrap geometry rather than relying purely on photogrammetric inference.\n- **Dynamic relighting support** in the export, meaning the captured scene can be relit in-engine without rebuild.\n\nThe pitch to AV teams is straightforward: locations that used to require a scout, a lighting plan, and a return shoot for re-shoots can now be captured once and walked through forever. Production designers, virtual-production stage operators, and anyone running a previs workflow have a new entry point that doesn't require a custom rig. Whether the splat output is good enough to drive a hero shot in a feature film is a separate question \u2014 the demo footage looked closer to \"convincing real-time game environment\" than \"indistinguishable from camera negative\" \u2014 but for previs, second-unit reference, training data, and immersive-media installations, the bar is already cleared.\n\n**Source:** [The Verge](https://www.theverge.com/photography/insta360-splatica-gaussian-splat) \u00b7 [Insta360 announcement](https://www.insta360.com/news/project-eternal) \u00b7 [Splatica platform docs](https://splatica.io/docs/eternal) \u00b7 April 28\u201330, 2026\n\n### The Agent OS Shift: Why the Model Matters Less Than What You Build Underneath It\n\nThe most useful framing of agentic AI this week didn't come from a product launch \u2014 it came from **Nathaniel Whittemore's AI Daily Brief on April 25**, where guest Nufar Gaspar walked through a **seven-layer \"Agent OS\"** designed to be platform- and model-agnostic. The training program is free at [aidbagentos.ai](https://aidbagentos.ai/), but the framing matters more than the program. The argument, in one sentence: every agentic tool is converging on the same set of capabilities, so the system you build underneath the tool is what compounds.\n\n**The convergence claim is concrete.** Cursor added agents. Claude Code added a memory system. OpenClaw reads files. Codex runs in the background. All of them now read the same human-readable text files defining identity, knowledge, capabilities, memory, and connections. Tool choice has stopped being an architectural decision and started being a swap. What carries value across the swap is the underlying system.\n\n**The seven layers, as Gaspar laid them out:**\n\n1. **Identity** \u2014 who you are, your communication style, values, and the rules the agent should never break. One file, enforced every interaction.\n2. **Context** \u2014 three to five focused single-page files: your team, your product, your customers, your current quarter, your stakeholders. Updated when things change, not maintained as one massive static document.\n3. **Skills** \u2014 reusable instruction sets for repeated workflows. Pattern: *\"When I say X, do Y using Z sources, and produce output in this format.\"*\n4. **Memory** \u2014 deliberate capture of major decisions, priority changes, and relationship context that automatic memory tools miss.\n5. **Connections** \u2014 read-only access to email, calendar, Slack, and other live systems via MCPs, CLI tools, or APIs. Write access only after weeks of trusted behavior.\n6. **Verification** \u2014 three to five quick checks for tone, facts, and accuracy on every output, plus periodic system audits to identify unused skills or stale context files.\n7. **Automations** \u2014 scheduled tasks that run without supervision. Start with draft outputs for review, not direct external communication.\n\n**The compounding-cost mechanic is the headline number.** Building the first agent \u2014 a chief of staff that reviews inbox, prepares meeting pre-reads, tracks commitments, flags blind spots, and drafts weekly updates \u2014 takes a weekend, because you're constructing the OS foundation along with the agent. Each subsequent specialist agent (research, board prep, content production, post-production triage) takes only an afternoon, because it inherits the layers. Gaspar's quote: *\"People who build that foundation now will have it compound from here on after, and everyone else will keep starting over with new tools.\"*\n\n**Why this matters for AV teams.** The frustration most AV professionals report with the current AI tool wave is that every new launch \u2014 Premiere's Firefly Assistant, Avid \u00d7 Gemini, DaVinci's IntelliSearch, Topaz Astra, Sora, Veo, Kling, ChatGPT, Claude, the next thing \u2014 comes with its own context window, prompt protocol, and memory model. Switch tools and the accumulated knowledge of how you work, your project history, your stakeholders, and your style preferences resets to zero. An Agent OS layer is the argument that this reset is a choice, not an inevitability \u2014 that the same underlying system can drive a chief-of-staff agent in Claude one quarter and a post-production-triage agent in Codex the next, with the same identity, skills, and memory carrying across.\n\nThe connection to the **Anthropic persistent-memory release later in this edition** is direct: persistent memory is the missing infrastructure layer for any of this to work without manual maintenance. The two stories are arguing the same thing from opposite sides of the stack.\n\n**Source:** [Apple Podcasts \u2014 *How To Build a Personal Agentic Operating System*](https://podcasts.apple.com/us/podcast/how-to-build-a-personal-agentic-operating-system/id1680633614?i=1000763587610) \u00b7 [aidbagentos.ai](https://aidbagentos.ai/) \u00b7 [Podbrain episode notes](https://podbrain.app/notes/the-ai-daily-brief-artificial-intelligence-news-and-analysis/how-to-build-a-personal-agentic-operating-system) \u00b7 April 25, 2026\n\n### Alibaba's HappyHorse 1.0 Takes the #1 Spot on the Artificial Analysis Video Arena\n\n**Alibaba shipped HappyHorse 1.0** on April 27 \u2014 a 15-billion-parameter video generation model that took the **#1 Elo ranking on the Artificial Analysis Video Arena** in both text-to-video and image-to-video categories, surpassing the long-standing leader, ByteDance's Dreamina Seedance 2.0, by roughly **115 Elo points** in text-to-video.\n\nThe headline numbers from the leaderboard:\n\n- **1,333 Elo in Text-to-Video** (without audio evaluation), the new top score.\n- **1,392 Elo in Image-to-Video** (without audio evaluation), also #1.\n- **1,238 Elo with audio evaluation included** \u2014 Seedance 2.0 retains a narrow lead on synchronized audio-video, but HappyHorse leads everything else.\n- **15-second multi-shot sequences** in a single generation, native **1080p** output, and aspect ratios across 16:9, 9:16, 1:1, 4:3, and 3:4 in one model.\n\n**The story behind the model.** HappyHorse was built by Alibaba's Taotian Future Life Lab in roughly five months. The team is led by **Zhang Di**, the architect of Kling 1.0 and 2.0, who left Kuaishou in fall 2025 and joined Alibaba in November. Going from team formation to a #1 leaderboard launch in five months is unusual even by current pace; the typical cycle from a team move to a flagship release is twelve to eighteen months.\n\n**The distribution strategy is what makes this an industry story rather than a benchmark story.** Alibaba is shipping HappyHorse through three channels at once:\n\n- **Free consumer access** via the Qwen App (over 300 million monthly actives), launched in gray-scale testing on April 27. Users tap a \"HappyHorse\" button on the Qwen home screen and get text-to-video, image-to-video, durations from 3 to 15 seconds, and multiple aspect ratios with a free monthly allowance.\n- **Enterprise API** through Alibaba Cloud Bailian, with introductory pricing of **0.9 yuan/sec at 720p** and **1.6 yuan/sec at 1080p** (roughly $0.12 and $0.22 USD respectively); discounted to 0.44/0.78 yuan with a Bailian membership.\n- **International API** through fal at **$0.14/sec at 720p** and **$0.28/sec at 1080p**, available globally from launch via four endpoints (text-to-video, image-to-video, reference-to-video, video-edit).\n- **Open-source base model** under a permissive license \u2014 developers can self-host the base, and Alibaba monetizes the commercial premium tier and managed cloud serving. This is the same playbook Alibaba ran on the Qwen LLMs, which is currently the most-downloaded open-weights model family on Hugging Face.\n\nFor context on pricing: Seedance 2.0 sits at roughly 1 yuan/sec, and Kling 3.0 ranges 0.6\u20131.2 yuan/sec. HappyHorse is competitive at list price and meaningfully cheaper at the membership tier.\n\n**Caveats worth flagging.** The Elo gap on text-to-video is substantial but the audio-sync gap is real \u2014 Seedance 2.0 still produces tighter lip-sync and Foley work. The model performs best with concise prompts; long, complex prompts have produced more variable output in early hands-on testing. Full commercial GA is scheduled for May 2026.\n\n**Source:** [Alibaba via Tencent News](https://news.qq.com/rain/a/20260427A07FE700) \u00b7 [DataNorth analysis](https://datanorth.ai/news/alibaba-launches-happyhorse-video-model) \u00b7 [fal launch announcement](https://www.prnewswire.com/news-releases/fal-launches-happyhorse-1-0--the-1-ranked-ai-video-model-as-official-api-partner-302755003.html) \u00b7 [Stork.AI deep-dive](https://www.stork.ai/blog/alibabas-new-ai-just-challenged-everything) \u00b7 April 27\u201328, 2026\n\n### ElevenLabs Ships ElevenMusic With a Style-Royalty Licensing Deal Through Believe and TuneCore\n\n**ElevenLabs launched ElevenMusic** on April 29 \u2014 its first dedicated music generation model \u2014 paired with a licensing arrangement through **Believe** and its DIY arm **TuneCore** that's structured differently from any prior AI-music release. The deal pays artists when the model references their style, not just when their sound recordings are used in training.\n\n**What ElevenMusic generates.** Up to four minutes of music per generation in a single pass, vocals included, in 30+ genres and 20+ languages. Stem separation is native \u2014 the same generation produces aligned drums, bass, melody, vocal, and atmosphere stems, exportable as 24-bit WAV. Tempo, key, time signature, and song structure (verse/chorus/bridge counts) are all controllable through structured prompts. The model also supports **prompt-driven style references** \u2014 describe a track by reference artist, era, mood, and instrumentation, and the model produces something stylistically adjacent without copying.\n\n**The licensing structure is the interesting part.** Through the Believe/TuneCore partnership, artists who have opted in get paid based on **style attribution**, not just sample-level matching. ElevenLabs runs every generation through a style-similarity scoring pipeline; if the output is determined to draw meaningfully from an opted-in artist's catalog, that artist receives a per-generation royalty out of a pool funded by ElevenMusic subscription revenue. The pool is structured as a percentage of subscription revenue, not a fixed-cost line item, so it scales with adoption.\n\nThis contrasts with prior approaches in the category. Suno and Udo have both faced lawsuits from major labels over training data; their public position has been that training is fair use and no per-track licensing is required. Stability AI and Meta's MusicGen open-sourced models without commercial licensing infrastructure. ElevenLabs is the first model provider to ship a frontier-quality music generator with a per-generation royalty pool that opted-in artists can directly benefit from.\n\n**Practical pricing.** ElevenMusic is included in the existing ElevenLabs Creator tier ($22/month, 100k characters of speech plus 100 minutes of music) and Pro tier ($99/month, 500k characters plus 600 minutes). Enterprise customers can negotiate per-minute pricing; commercial-use rights are included on Creator and above.\n\n**For AV producers, the practical implications.** Stock-music libraries (Artlist, Epidemic, Musicbed, Soundstripe) have been the dominant solution for non-trailer scoring; ElevenMusic is the first generative tool with a four-minute output, native stems, and licensing that survives a label-side audit. Whether quality matches Suno v5 or the upcoming Udo v3 is the open question \u2014 early hands-on reviews are praising the stem alignment and structural coherence and flagging that genre-specific timbres (especially in jazz, classical, and acoustic folk) are still less convincing than dedicated genre models.\n\n**Source:** [ElevenLabs announcement](https://elevenlabs.io/blog/elevenmusic) \u00b7 [Believe Music partnership press release](https://www.believemusic.com/press/elevenlabs-style-royalty-program) \u00b7 [Music Business Worldwide analysis](https://www.musicbusinessworldwide.com/elevenlabs-tunecore-style-royalty-2026) \u00b7 April 29, 2026\n\n### Topaz Labs Ships \"Next-Gen\" \u2014 A Full Rebuild of the Image and Video Stack\n\n**Topaz Labs released Topaz Next-Gen** on April 28 \u2014 a complete rebuild of the company's image and video AI lineup, replacing the long-standing Photo AI, Gigapixel, and Video AI products with a single unified application. The release closes the gap that had opened up against newer competitors (Magnific, Runway Refine, Krea, Recraft) by moving Topaz from a model-zoo approach (where users pick between Theia, Iris, Proteus, etc.) to a single foundation model that handles upscaling, denoising, deblurring, frame interpolation, and detail enhancement in one pipeline.\n\n**The headline numbers from Topaz's launch benchmarks:**\n\n- **Up to 16K upscaling** for stills (previous max: 6\u00d7 Gigapixel, capped around 8K from a 4K source).\n- **Up to 10\u00d7 video upscaling** with consistent temporal coherence \u2014 Topaz's prior Proteus model topped out at 4\u00d7 without artifacting.\n- **120fps frame interpolation** with new frame-aware optical flow that handles subject motion and parallax simultaneously.\n- **Real-time preview** on Apple Silicon (M3 Max and above) and NVIDIA RTX 50-series \u2014 previous versions required multi-pass renders for a full preview.\n- **Native Apple ProRes RAW input** plus standard codec support.\n\n**The architectural shift matters.** Topaz Next-Gen is built on a single diffusion-based foundation model trained on Topaz's full proprietary dataset (which includes the original training data for Theia and Proteus). Internally, the model handles task selection \u2014 upscaling, denoising, motion interpolation, color reconstruction \u2014 through learned task heads, rather than asking the user to pick between models. The interface preserves the per-task tabs (Upscale, Enhance, Slow Motion, etc.) but the underlying model is the same.\n\n**Pricing.** Topaz Next-Gen is a one-time **$299** license for personal use with one year of updates, or **$15/month** for ongoing updates. Existing Photo AI / Video AI / Gigapixel customers get an **upgrade path at 50% off** the new license. Studio/enterprise pricing is unchanged.\n\n**Worth flagging:** Topaz is also adding **Topaz Astra** \u2014 its dedicated video generation model \u2014 to **Adobe Firefly's roster** and to **Cliprise**, alongside Runway, Veo, Kling, and Sora. Astra is positioned more as a refine/enhance model for existing footage than a from-scratch text-to-video competitor, which is a coherent strategic position given Topaz's customer base.\n\n**Source:** [Topaz Labs announcement](https://www.topazlabs.com/blog/topaz-next-gen) \u00b7 [PetaPixel review](https://petapixel.com/2026/04/29/topaz-next-gen-review) \u00b7 [Reddit r/videoediting hands-on thread](https://reddit.com/r/videoediting/topaz-next-gen-megathread) \u00b7 April 28, 2026\n\n### Buzzy Launches \"AI Video Photoshop\" With $20M From Sequoia and Ribbit\n\n**Buzzy** \u2014 the AI video editing startup founded by ex-Runway and ex-Adobe engineers \u2014 exited stealth on April 30 with **$20M in Series A funding** led by Sequoia with participation from Ribbit Capital and Conviction. The product is positioned, explicitly, as **\"Photoshop for AI video\"** \u2014 direct manipulation editing on AI-generated clips at the pixel and timeline level, rather than re-prompting and re-generating.\n\n**What's actually new.** AI video tools to date have largely worked on a generate-then-replace loop: don't like a clip, change the prompt and roll the dice again. Buzzy's pitch is that this is the wrong abstraction \u2014 once a generation is \"almost right,\" the natural next step is direct edit, the same way Photoshop replaced the print-and-reshoot loop in still photography in the 1990s. Concrete capabilities:\n\n- **Object-level masking and replacement** on a generated clip, with consistent appearance across frames. Mask a character, change their shirt color, and the change carries through the full clip rather than being re-rolled.\n- **Local prompt edits** with brush tools \u2014 paint over a region, type what should be there, and the model edits only that region with frame-coherent output.\n- **Camera-path retargeting** \u2014 modify the camera motion of an existing generation without re-rendering the subject.\n- **Multi-clip continuity** \u2014 link two separate generations and the model enforces character, lighting, and prop consistency across the cut.\n\n**Provenance.** Buzzy's founding team is interesting. CEO **Anya Singh** was a senior product manager on Runway Gen-3 and Gen-4 before leaving in November 2025. CTO **Marcus Chen** led Adobe's Project SuperSonic team and was instrumental in the Firefly Video Editor. Their collective bet is that the next phase of AI video is editing tools, not better base models \u2014 and that the editing tools will look more like Photoshop than like Premiere.\n\n**Availability.** Closed beta is open to Pro tier subscribers ($79/month) immediately with a waitlist for the broader launch in summer 2026. Early users include Anyma's visual-effects team and indie filmmaker **Casey Neistat**, who has been previewing Buzzy-edited clips on his channel.\n\n**Worth tracking.** The Buzzy thesis \u2014 that direct manipulation is the missing layer of the AI video stack \u2014 is the same thesis Adobe is making with the Firefly Video Editor, that Runway is making with Refine in Gen-4.5, and that several teams inside ByteDance and Alibaba are reportedly working on. Whether Buzzy's product is meaningfully better than the integrated tools or just a sharper-positioned version of the same idea is the open question.\n\n**Source:** [Buzzy launch announcement](https://buzzy.ai/launch) \u00b7 [TechCrunch coverage](https://techcrunch.com/2026/04/30/buzzy-photoshop-ai-video-20m) \u00b7 [Sequoia investment thesis](https://sequoiacap.com/buzzy-ai-video-editing) \u00b7 April 30, 2026\n\n### Anthropic Moves Claude Persistent Memory for Managed Agents to Public Beta\n\n**Anthropic shipped persistent memory for Claude Managed Agents** to public beta on April 27 \u2014 addressing what builders across the agentic AI space have been calling the single biggest infrastructure gap. The release lets Claude-based agents remember decisions, context, and accumulated knowledge across sessions, projects, and model upgrades, rather than starting from a blank slate every time.\n\n**What \"persistent memory\" actually means in this implementation:**\n\n- **Long-term episodic memory** \u2014 agents store summaries of conversations, decisions, and outcomes in a managed memory store that Anthropic operates. The memory is queryable by the agent during inference and reviewable by the user.\n- **Cross-session continuity** \u2014 an agent that handled a project a month ago and is invoked again today inherits the full context without manual re-priming.\n- **Selective forgetting** \u2014 users can flag memories as stale, delete specific entries, or set retention policies (30 days, 90 days, indefinite).\n- **Cross-model portability** \u2014 the memory store is model-agnostic in Anthropic's stack, meaning a memory accumulated under Claude Opus 4.7 carries forward to a future Claude release without manual migration.\n\n**Why builders are paying attention.** The memory gap is the recurring complaint in NLW's Agent Madness submissions (covered above) \u2014 a meaningful number of those projects were \"elaborate workarounds for agents forgetting everything between sessions.\" Mize, one of the showcase projects, uses 50+ markdown brain files specifically because no managed memory layer existed at production quality. Anthropic's release is the first frontier-lab managed memory primitive that works out of the box rather than as a stitched-together third-party plugin.\n\n**The pricing structure.** Persistent memory is free for the first 10MB per agent per month and $0.50/GB-month thereafter. Memory queries during inference cost the same per-token rate as standard input tokens (memories are hydrated into context).\n\n**The thread back to the Agent OS feature.** Memory is the layer that makes the seven-layer Agent OS architecture viable without manual maintenance. With persistent memory in the model provider's stack, the \"memory\" layer of Gaspar's framework moves from custom markdown files and external storage to a managed primitive \u2014 and the compounding effect Gaspar described (the second agent inheriting the foundation in an afternoon rather than a weekend) becomes meaningfully easier to realize.\n\n**Source:** [Anthropic announcement](https://www.anthropic.com/news/persistent-memory-managed-agents) \u00b7 [The Verge coverage](https://www.theverge.com/2026/4/27/anthropic-claude-persistent-memory) \u00b7 [Latent Space deep-dive](https://www.latent.space/p/claude-persistent-memory-deep-dive) \u00b7 April 27, 2026\n\n### Quick Hits: The Other AV-AI Releases This Week\n\nA short tour through the announcements that didn't get a full section but are worth tracking:\n\n- **AutoCut April update** \u2014 the popular Premiere Pro / DaVinci Resolve / Final Cut plugin (silence cutting, multi-cam syncing, podcast editing) shipped its April release on April 29 with a new **Caption AI** module that generates speaker-attributed captions across mixed multi-language interviews and exports as `.srt`, `.vtt`, or burned-in. The pricing tier for Caption AI is $19/month above the base AutoCut subscription.\n- **Creo + Google Cloud \u2014 agentic content vetting and editing for influencer marketing.** Omnicom Media's influencer arm, Creo, announced a partnership with Google Cloud on April 28 that uses Gemini Enterprise and Veo to automatically flag brand-compliance issues in creator content (alcohol in frame, competitor logos, restricted wardrobe) and apply light-touch edits \u2014 blurring, object removal, color shifts \u2014 before returning the content to the creator for approval. Reported review-cycle compression: two-to-three days down to same-day. Available in the US with global expansion in Q3.\n- **Sora API GA countdown.** OpenAI confirmed on April 28 that the Sora API will hit general availability on **September 24, 2026**, alongside higher-quality 1080p output at the standard tier. The countdown is now five months.\n- **Google I/O 2026 confirmed for May 19\u201320.** The opening keynote slate has been announced; expectations include Veo 4, Imagen 5, Gemini 3.5, and updates to the Vertex AI agent stack.\n\n---\n\n## Voices This Week\n\n### Nathaniel Whittemore on Why the Tool Doesn't Matter Anymore\n\nIn the *AI Daily Brief* episode that sparked this edition's feature, **Nathaniel Whittemore** opened with a line worth quoting at length: *\"Every agentic tool is becoming every other tool \u2014 Cursor added agents, Claude Code added a memory system, OpenClaw reads files, Codex runs in the background, all converging on the same set of capabilities. Tool choice matters less than the underlying system that captures how you work, what you know, and what you need AI to do for you.\"* The framing is the cleanest articulation of why teams should be investing in the abstraction one level above any specific product, because the products are converging \u2014 not on each other, but on the same pattern.\n\n### Nufar Gaspar on the Compounding Cost Curve\n\n**Nufar Gaspar**, who built the seven-layer Agent OS framework Whittemore is teaching: *\"People who build that foundation now will have it compound from here on after, and everyone else will keep starting over with new tools.\"* The frame inverts the usual AI-tool conversation \u2014 instead of asking which tool to pick this quarter, the question becomes whether the work being done in any tool this quarter survives the next tool change. The answer for most teams, today, is no.\n\n### Zhang Di on Building HappyHorse in Five Months\n\n**Zhang Di**, the architect of Kling 1.0 and 2.0 who now leads HappyHorse at Alibaba, in a translated post on the model launch: *\"We had to be willing to throw away the assumptions we'd been using for two years. Visual quality was the floor, not the ceiling \u2014 the leaderboard was something we wanted to win on the way to something larger.\"* The implied goal is the integration into the broader Alibaba ecosystem (Qwen + Bailian + cloud), where a model is one feature in a workflow rather than a standalone destination.\n\n### Casey Neistat on Editing Generated Video\n\nIndie filmmaker **Casey Neistat**, an early Buzzy beta user, in a public preview post on April 30: *\"I'm not asking AI to make the shot anymore. I'm asking it to fix the parts of the shot that are 80% there. That's a different tool.\"* The framing matches Buzzy's positioning \u2014 direct manipulation as the natural next step once base-model quality is \"almost right\" enough that the next round of dice rolls is more expensive than a targeted edit.\n\n---\n\n## Common Threads\n\n### Memory Is the Missing Infrastructure Layer \u2014 and It's Finally Shipping\n\nTwo stories this week \u2014 Whittemore/Gaspar's Agent OS framework and Anthropic's persistent memory release \u2014 are arguing the same thing from opposite sides of the stack. From the user side: build a system that captures your context, identity, and accumulated decisions in human-readable files that any model can read. From the provider side: ship managed memory so users don't have to. Both arrive in the same week because both are responding to the same gap: the field has been generating workarounds (markdown brain files, custom retrieval systems, prompt-stuffing patterns) for the past two years specifically because the memory primitive didn't exist at production quality. With Anthropic shipping it as a managed service and Gaspar's framework giving the user-side blueprint, the workaround era is ending.\n\n### The Capture Layer of AV Production Is Migrating to Consumer Hardware\n\nThe Insta360 + Splatica announcement is a single data point in a broader pattern. Volumetric capture used to require a dedicated rig (the OBSBOT 60-camera demo at NAB 2026 last week) or a high-end LIDAR + mirrorless workflow. It now runs on a single 360 camera and a cloud subscription. Photogrammetry has been migrating in the same direction \u2014 Polycam and Luma's capture apps now produce splat-quality output from a phone. Color and exposure science has migrated from in-camera to log + post grading. The pattern across the past five years is consistent: capture sophistication moves from rig to device, and the post-side software gets the new complexity.\n\n### The Open-Weights Model Strategy Is Now Standard for Chinese Labs Releasing AV Models\n\nHappyHorse 1.0's open-source base model with a paid commercial premium is the same playbook Alibaba ran on Qwen, that DeepSeek runs on V4 (covered last week), and that Kuaishou ran on the Kling 1.x base. The pattern is consistent enough now that Western labs releasing closed models look like the exception rather than the norm. The practical consequence for AV teams: self-hosted video generation that runs on internal infrastructure is no longer a research question \u2014 it's a procurement question. The decision points are GPU availability, model maintenance overhead, and whether the commercial-tier features justify the managed-service cost.\n\n### Video Models Now Compete on Total Workflow, Not Just Model Quality\n\nHappyHorse is the #1 video model on the Arena leaderboard, but the launch story is about the Qwen App + Bailian + fal three-channel distribution and the open-source play. Topaz Next-Gen rolls upscale, denoise, and frame interpolation into one model. Buzzy is positioning around editing a generation, not generating better. Adobe's Firefly Video Editor includes Kling 3.0, Veo 3.1, Sora, and Topaz Astra in one product. The Common Thread from last week \u2014 that \"agentic AI\" is the default frame \u2014 extends here: the unit of competition is no longer the model, it's the workflow that wraps the model, and increasingly that workflow includes multiple models from multiple vendors in one timeline.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Style-Royalty Pools as a Licensing Pattern\n\nElevenLabs' Believe/TuneCore arrangement \u2014 paying opted-in artists when generated music draws on their style \u2014 is a new pattern that could easily migrate to image and video models. The technical primitive (style-similarity scoring against a catalog of reference works) already exists at every major model lab. The harder layer is the opt-in pool and the rights administration, which is what Believe and TuneCore bring. Whether this becomes the dominant licensing pattern or a one-off depends on whether the per-generation royalty math actually scales for artists at the catalog tail \u2014 too early to call, but worth tracking.\n\n### The \"AI Chief of Staff\" as the Entry Point, Not the End State\n\nGaspar's seven-layer framework deliberately uses an AI chief of staff as the running example because it's the most general-purpose agent profile \u2014 every knowledge worker has an inbox, a calendar, a stakeholder map, and a set of recurring drafts. Once that agent exists, the OS foundation it requires (identity, context, skills, memory, connections, verification, automations) becomes the substrate for every subsequent agent. The bet is that AV-specific agents \u2014 post-production triage, asset-management, social-cuts assembly, dialog-pass review \u2014 slot into the same OS and inherit the same identity and memory, rather than each being built from scratch.\n\n### Real-Time Volumetric Capture as a Production Asset\n\nThe Insta360 + Splatica pipeline is currently asynchronous (capture, upload, process, deliver). The interesting follow-on is real-time: a 360 camera that streams directly into a live splat being assembled at the edge, viewable in VR or on-set with sub-second latency. Splatica's roadmap mentions \"live capture pipelines\" as a 2027 target. If that ships, the practical implication for virtual production is significant \u2014 locations become assets that can be relit and re-shot inside the engine the same week they're scouted.\n\n### Direct Manipulation as the Next Phase of AI Video Tools\n\nBuzzy's \"Photoshop for AI video\" framing \u2014 and Adobe's parallel investments in the Firefly Video Editor's local-edit tools \u2014 suggest the field is entering its second phase. Phase one was: generate from text. Phase two is: generate something close, then edit directly. The same arc happened in still images (Stable Diffusion \u2192 ControlNet \u2192 inpainting \u2192 Photoshop integration), and there's no obvious reason the video equivalent shouldn't follow. Whether the dominant editing layer ends up inside the existing NLEs (Premiere, Resolve) or outside them in dedicated tools (Buzzy, Runway Refine) is the active open question.\n\n---\n\n## Tool of the Week\n\n### Splatica + Insta360 X5 Project Eternal Pipeline\n\n**What it does:** Converts footage from a consumer 360 camera (Insta360 X5, One RS 1-inch 360, or compatible models) into a fully navigable Gaussian splat that exports as `.splat` and `.ply` for direct use in Unreal Engine 5.6, Unity 6, Blender 4.5, Niantic Scaniverse, Apple Vision Pro, and Meta Horizon OS. Cloud processing runs at roughly 1.5\u00d7 capture duration; native depth alignment uses parallax between dual sensors rather than pure photogrammetric inference. Supports up to 30 minutes of source footage per scene with automatic stitching across multiple captures.\n\n**Who it's for:** Production designers, virtual-production stage operators, previs teams, location scouts, real-estate and architecture videographers, and anyone running an immersive-media or game-engine workflow who needs photoreal volumetric environments without a dedicated rig. Also useful for second-unit reference, training-data capture, and AR/VR experience designers who need real-world locations as navigable assets.\n\n**Pricing:** $29/month subscription for unlimited cloud processing, or $0.50/minute pay-as-you-go for occasional use. Camera hardware is separate \u2014 the supported Insta360 X5 retails for $549, and the One RS 1-inch 360 modular system runs $799 for the body and 360 mod combined.\n\n**Worth trying?** For anyone working with virtual production, previs, or immersive media, the pipeline closes a workflow gap that previously required a dedicated specialist. The output quality is currently \"convincing real-time game environment\" rather than \"indistinguishable from camera negative\" \u2014 strong enough for previs, reference, and immersive installations, not yet good enough for hero shots in feature work. The pay-as-you-go pricing makes it a low-friction first try without committing to the subscription.\n\n**Link:** [splatica.io/eternal](https://splatica.io/eternal)\n\n---\n\n## Sources\n\n1. [The Verge \u2014 Insta360 + Splatica Project Eternal](https://www.theverge.com/photography/insta360-splatica-gaussian-splat) \u2014 April 30, 2026 \u2014 Hands-on coverage and consumer Gaussian splat positioning\n2. [Insta360 \u2014 Project Eternal announcement](https://www.insta360.com/news/project-eternal) \u2014 April 28, 2026 \u2014 Official launch and supported hardware\n3. [Splatica \u2014 Project Eternal documentation](https://splatica.io/docs/eternal) \u2014 April 28, 2026 \u2014 Pipeline specs, export formats, pricing\n4. [Apple Podcasts \u2014 *How To Build a Personal Agentic Operating System*](https://podcasts.apple.com/us/podcast/how-to-build-a-personal-agentic-operating-system/id1680633614?i=1000763587610) \u2014 April 25, 2026 \u2014 Whittemore + Gaspar episode\n5. [aidbagentos.ai](https://aidbagentos.ai/) \u2014 April 2026 \u2014 Free Agent OS training program signup\n6. [Podbrain \u2014 Agent OS episode notes](https://podbrain.app/notes/the-ai-daily-brief-artificial-intelligence-news-and-analysis/how-to-build-a-personal-agentic-operating-system) \u2014 April 2026 \u2014 Seven-layer framework summary\n7. [Tencent News \u2014 Alibaba HappyHorse 1.0 launch](https://news.qq.com/rain/a/20260427A07FE700) \u2014 April 27, 2026 \u2014 Qwen App and Bailian distribution\n8. [DataNorth \u2014 HappyHorse 1.0 ranks #1](https://datanorth.ai/news/alibaba-launches-happyhorse-video-model) \u2014 April 28, 2026 \u2014 Arena leaderboard analysis\n9. [PR Newswire \u2014 fal launches HappyHorse 1.0 API](https://www.prnewswire.com/news-releases/fal-launches-happyhorse-1-0--the-1-ranked-ai-video-model-as-official-api-partner-302755003.html) \u2014 April 27, 2026 \u2014 International API pricing\n10. [Stork.AI \u2014 Alibaba HappyHorse deep-dive](https://www.stork.ai/blog/alibabas-new-ai-just-challenged-everything) \u2014 April 28, 2026 \u2014 Zhang Di provenance and competitive analysis\n11. [ElevenLabs \u2014 ElevenMusic announcement](https://elevenlabs.io/blog/elevenmusic) \u2014 April 29, 2026 \u2014 Music model release\n12. [Believe Music \u2014 Style royalty program](https://www.believemusic.com/press/elevenlabs-style-royalty-program) \u2014 April 29, 2026 \u2014 Licensing structure with TuneCore\n13. [Music Business Worldwide \u2014 ElevenMusic licensing analysis](https://www.musicbusinessworldwide.com/elevenlabs-tunecore-style-royalty-2026) \u2014 April 29, 2026 \u2014 Industry context and comparison to prior AI music releases\n14. [Topaz Labs \u2014 Topaz Next-Gen launch](https://www.topazlabs.com/blog/topaz-next-gen) \u2014 April 28, 2026 \u2014 Unified image and video model\n15. [PetaPixel \u2014 Topaz Next-Gen review](https://petapixel.com/2026/04/29/topaz-next-gen-review) \u2014 April 29, 2026 \u2014 Hands-on benchmarks\n16. [Reddit r/videoediting \u2014 Topaz Next-Gen megathread](https://reddit.com/r/videoediting/topaz-next-gen-megathread) \u2014 April 28\u201330, 2026 \u2014 Community hands-on reactions\n17. [Buzzy \u2014 launch announcement](https://buzzy.ai/launch) \u2014 April 30, 2026 \u2014 Stealth exit and product positioning\n18. [TechCrunch \u2014 Buzzy Series A coverage](https://techcrunch.com/2026/04/30/buzzy-photoshop-ai-video-20m) \u2014 April 30, 2026 \u2014 Funding details and team backgrounds\n19. [Sequoia Capital \u2014 Buzzy investment thesis](https://sequoiacap.com/buzzy-ai-video-editing) \u2014 April 30, 2026 \u2014 Direct-manipulation editing thesis\n20. [Anthropic \u2014 Persistent memory for Managed Agents](https://www.anthropic.com/news/persistent-memory-managed-agents) \u2014 April 27, 2026 \u2014 Public beta announcement\n21. [The Verge \u2014 Anthropic persistent memory coverage](https://www.theverge.com/2026/4/27/anthropic-claude-persistent-memory) \u2014 April 27, 2026 \u2014 Industry context\n22. [Latent Space \u2014 Claude persistent memory deep-dive](https://www.latent.space/p/claude-persistent-memory-deep-dive) \u2014 April 27, 2026 \u2014 Technical architecture analysis\n23. [AutoCut \u2014 April release notes](https://www.autocut.com/changelog/2026-04) \u2014 April 29, 2026 \u2014 Caption AI module\n24. [PR Newswire \u2014 Creo + Google Cloud agentic content vetting](https://www.prnewswire.com/news-releases/creo-debuts-ai-solution-for-real-time-creator-content-editing-reducing-costs-and-time-to-market-while-ensuring-brand-compliance-at-scale-302755923.html) \u2014 April 28, 2026 \u2014 Influencer marketing automation\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of May 1, 2026\n\n> Quick Summary: **Insta360 + Splatica's Project Eternal** turns a single 360 camera walk-through into a navigable Gaussian splat \u2014 volumetric capture migrating from purpose-built rigs to consumer hardware. The week's most useful framing came from Nathaniel Whittemore's argument that **the model matters less than the personal \"Agent OS\"** you build underneath it, with an AI chief of staff as the entry point. **Alibaba's HappyHorse 1.0** seized the #1 spot on the Artificial Analysis Video Arena, built in five months by the architect of Kling 1.0 and 2.0. **ElevenLabs shipped ElevenMusic** with a first-of-its-kind style-royalty deal through Believe and TuneCore. **Topaz Labs released Next-Gen**, a full rebuild of its image and video stack. And **Anthropic moved Claude's persistent memory** for managed agents to public beta \u2014 closing what builders call the biggest infrastructure gap in agentic AI.\n\n---\n\n## The Big Stories This Week\n\n### Insta360 + Splatica Launch Project Eternal \u2014 Consumer 360 Cameras Become Volumetric Capture Devices\n\nInsta360 and Splatica announced **Project Eternal** on April 28 \u2014 a joint pipeline that converts footage from a consumer 360 camera (Insta360 X5 or One RS 1-inch 360) into a **fully navigable Gaussian splat**. The capture step collapses to a single handheld camera the operator walks through the space with. Splatica's cloud processes the footage in roughly 1.5\u00d7 the capture duration, and the output exports as standard `.splat` and `.ply` files that drop directly into Unreal Engine 5.6, Unity 6, Blender 4.5, Niantic Scaniverse, Apple Vision Pro, and Meta Horizon OS.\n\nThe Verge's hands-on framed it bluntly: until this week, getting a Gaussian splat into a film, game, or training simulation meant hiring a specialist. Insta360 just shipped the consumer version. **Pricing**: $29/month subscription or $0.50/minute pay-as-you-go for the cloud processing, separate from the camera hardware (X5 retails $549). Up to 30 minutes of source footage per scene with automatic stitching across multiple captures, and native depth alignment using parallax between dual sensors rather than pure photogrammetric inference.\n\n**For AV teams**, the practical implication is that locations that used to require a scout, a lighting plan, and re-shoots can now be captured once and walked through forever. The output quality is currently \"convincing real-time game environment\" rather than \"indistinguishable from camera negative\" \u2014 strong enough for previs, second-unit reference, training data, and immersive installations, not yet good enough for hero shots in feature work.\n\n### The Agent OS Shift: Why the Model Matters Less Than What You Build Underneath It\n\nThe most useful framing of agentic AI this week came from **Nathaniel Whittemore's AI Daily Brief on April 25**, where guest **Nufar Gaspar** walked through a **seven-layer \"Agent OS\"** designed to be platform- and model-agnostic. The argument, in one sentence: every agentic tool \u2014 Cursor, Claude Code, OpenClaw, Codex \u2014 is converging on the same set of capabilities, so the system you build underneath the tool is what compounds.\n\n**The seven layers**, briefly:\n\n1. **Identity** \u2014 who you are, your communication style, values, the rules the agent should never break\n2. **Context** \u2014 three to five focused single-page files: team, product, customers, current quarter, stakeholders\n3. **Skills** \u2014 reusable instruction sets (\"when I say X, do Y using Z, output format\")\n4. **Memory** \u2014 deliberate capture of decisions, priority changes, and relationship context\n5. **Connections** \u2014 read-only access to email, calendar, Slack via MCPs/CLIs/APIs (write access only after weeks of trust)\n6. **Verification** \u2014 quick tone/fact/accuracy checks plus periodic system audits\n7. **Automations** \u2014 scheduled tasks; start with draft outputs for review, not direct external sends\n\n**The compounding mechanic is the headline.** Building the first agent \u2014 a chief of staff that reviews inbox, prepares meeting pre-reads, tracks commitments, drafts weekly updates \u2014 takes a weekend, because you're building the OS foundation along with the agent. Each subsequent specialist agent (research, post-production triage, content production) takes only an afternoon, because it inherits the layers. Gaspar's framing: people who build that foundation now have it compound; everyone else keeps starting over with new tools.\n\n**For AV teams**, the relevance is direct. Every new launch \u2014 Premiere's Firefly Assistant, Avid \u00d7 Gemini, DaVinci IntelliSearch, Topaz Astra, Sora, Veo, Kling, ChatGPT, Claude \u2014 comes with its own context window and memory model. Switch tools and accumulated context resets to zero. An Agent OS layer is the argument that the same underlying system can drive a chief-of-staff agent in Claude this quarter and a post-production-triage agent in Codex the next, with identity, skills, and memory carrying across.\n\n### Alibaba HappyHorse 1.0 Takes the #1 Spot on the Video Arena\n\n**Alibaba shipped HappyHorse 1.0** on April 27, a 15-billion-parameter video generation model that took the **#1 Elo ranking on the Artificial Analysis Video Arena** in both text-to-video and image-to-video categories \u2014 surpassing ByteDance's Seedance 2.0 by roughly **115 Elo points** in text-to-video.\n\nWhat makes this an industry story rather than a benchmark story:\n\n- **The team is led by Zhang Di**, the architect of Kling 1.0 and 2.0, who left Kuaishou in fall 2025 and joined Alibaba in November. Five months from team formation to a #1 leaderboard launch is unusual.\n- **Three-channel distribution**: Free consumer access via the Qwen App (300M+ MAU); enterprise API via Alibaba Cloud Bailian at 0.9 yuan/sec (720p) or 1.6 yuan/sec (1080p); international API via fal at $0.14/sec (720p) and $0.28/sec (1080p), available globally from launch.\n- **Open-source base model** with paid commercial premium tier \u2014 the same playbook Alibaba ran on Qwen and DeepSeek runs on V4.\n\n**The capabilities**: 15-second multi-shot sequences in a single generation, native 1080p output, aspect ratios across 16:9, 9:16, 1:1, 4:3, and 3:4 in one model. Caveats: Seedance 2.0 still leads on synchronized lip-sync and Foley audio work, and the model performs best with concise prompts rather than long, complex ones. Full commercial GA is scheduled for May 2026.\n\n### ElevenLabs Ships ElevenMusic With a Style-Royalty Licensing Deal\n\n**ElevenLabs launched ElevenMusic** on April 29 \u2014 its first dedicated music generation model \u2014 paired with a licensing arrangement through **Believe** and **TuneCore** that's structured differently from any prior AI-music release. The deal pays artists when the model references their style, not just when their sound recordings are used in training.\n\n**What ElevenMusic generates**: Up to four minutes of music per generation, vocals included, in 30+ genres and 20+ languages. Native stem separation produces aligned drums, bass, melody, vocals, and atmosphere as 24-bit WAV. Tempo, key, time signature, and song structure are controllable through structured prompts.\n\n**The licensing structure** is the interesting part. Through Believe/TuneCore, opted-in artists get paid based on style attribution \u2014 every generation is run through a similarity-scoring pipeline, and if the output draws meaningfully from an opted-in artist's catalog, that artist receives a per-generation royalty out of a pool funded by ElevenMusic subscription revenue. This contrasts with Suno and Udo's position that training is fair use and per-track licensing isn't required.\n\n**Pricing**: included in existing Creator ($22/mo) and Pro ($99/mo) tiers. The practical implication for AV producers: ElevenMusic is the first generative music tool with four-minute output, native stems, and licensing that survives a label-side audit. Quality is strong on stem alignment and structural coherence; genre-specific timbres in jazz, classical, and acoustic folk are still less convincing than dedicated genre models.\n\n### Topaz Labs Ships \"Next-Gen\" \u2014 A Full Rebuild of the Image and Video Stack\n\n**Topaz Labs released Topaz Next-Gen** on April 28 \u2014 a complete rebuild that replaces Photo AI, Gigapixel, and Video AI with a single unified application built on a new foundation model. The release closes the gap that had opened against newer competitors (Magnific, Runway Refine, Krea, Recraft).\n\nThe headline numbers:\n\n- **Up to 16K upscaling** for stills (previous max: 8K from a 4K source)\n- **Up to 10\u00d7 video upscaling** with consistent temporal coherence (Proteus topped out at 4\u00d7)\n- **120fps frame interpolation** with new frame-aware optical flow\n- **Real-time preview** on Apple Silicon M3 Max+ and NVIDIA RTX 50-series\n- **Native Apple ProRes RAW input**\n\n**Pricing**: $299 one-time license with one year of updates, or $15/month for ongoing updates. Existing Photo AI / Video AI / Gigapixel customers get 50% off the upgrade. Topaz is also adding **Topaz Astra** (its dedicated video generation model) to **Adobe Firefly's roster** alongside Runway, Veo, Kling, and Sora.\n\n### Buzzy Launches \"AI Video Photoshop\" With $20M From Sequoia and Ribbit\n\n**Buzzy** \u2014 founded by ex-Runway and ex-Adobe engineers \u2014 exited stealth on April 30 with **$20M Series A** led by Sequoia. The product is positioned as **\"Photoshop for AI video\"** \u2014 direct manipulation editing on AI-generated clips at the pixel and timeline level, rather than re-prompting and re-generating.\n\n**What's actually new**: AI video tools have largely worked on a generate-then-replace loop. Buzzy's pitch is that this is the wrong abstraction \u2014 once a generation is \"almost right,\" the natural next step is direct edit. Object-level masking with consistent appearance across frames, local prompt edits with brush tools (paint a region, type what should be there), camera-path retargeting on existing generations, and multi-clip continuity that enforces character/lighting/prop consistency across cuts.\n\n**Founding team is notable**. CEO Anya Singh was a senior PM on Runway Gen-3 and Gen-4. CTO Marcus Chen led Adobe's Project SuperSonic team and worked on the Firefly Video Editor. Their bet is that the next phase of AI video is editing tools, not better base models. Closed beta is open at $79/month with broader launch in summer 2026.\n\n### Anthropic Moves Claude Persistent Memory for Managed Agents to Public Beta\n\n**Anthropic shipped persistent memory for Claude Managed Agents** to public beta on April 27 \u2014 addressing what builders are calling the single biggest infrastructure gap in agentic AI. Agents now remember decisions, context, and accumulated knowledge across sessions, projects, and model upgrades, rather than starting from a blank slate every time.\n\n**What's in the release**:\n\n- **Long-term episodic memory** \u2014 agents store summaries of conversations and decisions in a managed memory store\n- **Cross-session continuity** \u2014 an agent invoked a month after a project inherits the full context without re-priming\n- **Selective forgetting** \u2014 flag stale memories, delete entries, set retention policies (30/90 days/indefinite)\n- **Cross-model portability** \u2014 memories accumulated under Claude Opus 4.7 carry forward to future Claude releases\n\n**Pricing**: free for the first 10MB per agent per month; $0.50/GB-month thereafter. Memory queries during inference cost the same per-token rate as standard input tokens.\n\n**The thread to the Agent OS feature is direct**. With managed memory in the model provider's stack, the \"memory\" layer of Gaspar's framework moves from custom markdown files and external storage to a managed primitive \u2014 and the compounding effect (the second agent inheriting the foundation in an afternoon rather than a weekend) becomes meaningfully easier to realize.\n\n### Quick Hits\n\n- **AutoCut April update** \u2014 the popular Premiere/Resolve/Final Cut plugin shipped a new **Caption AI** module ($19/mo above base) for speaker-attributed captions across mixed multi-language interviews\n- **Creo + Google Cloud** \u2014 Omnicom's influencer arm launched agentic content vetting using Gemini Enterprise and Veo, compressing review cycles from days to same-day\n- **Sora API GA confirmed for September 24, 2026** \u2014 five-month countdown\n- **Google I/O 2026 \u2014 May 19\u201320** \u2014 expectations include Veo 4, Imagen 5, Gemini 3.5\n\n---\n\n## Why This Week Matters\n\nA few patterns worth noting:\n\n- **Memory is the missing infrastructure layer \u2014 and it's finally shipping.** Whittemore/Gaspar's Agent OS framework and Anthropic's persistent memory release are arguing the same thing from opposite sides of the stack. From the user side: build a system that captures context, identity, and decisions in human-readable files. From the provider side: ship managed memory so users don't have to. Both arrive in the same week because both are responding to the same gap.\n\n- **The capture layer of AV production is migrating to consumer hardware.** Volumetric capture used to require a dedicated rig. It now runs on a single 360 camera and a cloud subscription. Photogrammetry has been migrating in the same direction (Polycam, Luma's capture apps). Color and exposure science migrated from in-camera to log + post grading years ago. The pattern is consistent: capture sophistication moves from rig to device, and the post-side software gets the new complexity.\n\n- **The open-weights model strategy is now standard for Chinese labs releasing AV models.** HappyHorse 1.0's open-source base with a paid commercial premium is the same playbook Alibaba ran on Qwen, that DeepSeek runs on V4, and that Kuaishou ran on the Kling 1.x base. The pattern is consistent enough that Western labs releasing closed models look like the exception rather than the norm.\n\n- **Video models compete on total workflow now, not just model quality.** HappyHorse is the #1 video model, but the launch story is the Qwen + Bailian + fal three-channel distribution and the open-source play. Topaz Next-Gen rolls upscale, denoise, and frame interpolation into one model. Buzzy is positioning around editing a generation, not generating better. Adobe's Firefly Video Editor includes Kling, Veo, Sora, and Topaz Astra in one product. The unit of competition is no longer the model \u2014 it's the workflow that wraps the model, and that workflow increasingly includes multiple models from multiple vendors on one timeline.\n\n- **Direct manipulation is the next phase of AI video tools.** Buzzy's \"Photoshop for AI video\" framing \u2014 and Adobe's parallel investments in the Firefly Video Editor's local-edit tools \u2014 suggest the field is entering its second phase. Phase one was generate from text. Phase two is generate something close, then edit directly. The same arc happened in still images (Stable Diffusion \u2192 ControlNet \u2192 inpainting \u2192 Photoshop integration), and there's no obvious reason video shouldn't follow.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
