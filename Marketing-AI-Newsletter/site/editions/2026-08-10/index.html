      editionMd: "# The Monday Signal \u2014 Week of August 10, 2026\n\n> **Google gave advertisers 26 days' notice that their Search campaigns are moving to AI Max, and fresh data shows why it matters: AI Max already rewrites about 29% of exact-match impressions, with no way to see which is which.** Meanwhile OpenAI's first influencer trip blew up in its face (the third AI-lab marketing misfire this quarter), ChatGPT Ads dropped its minimum to $25 and expanded to Latin America, Nielsen agreed to buy DoubleVerify for $2.15 billion, and agency holdcos found their AI business model: reselling compute at a markup.\n\n---\n\n## The Conversation\n\n### OpenAI threw an influencer retreat. The internet threw it back.\n\nOpenAI's first creator brand trip, a two-day \"Summer Club\" retreat at Wildflower Farms in the Hudson Valley (beekeeping, farm-to-table dinners, workshops on the new ChatGPT Work), detonated on contact with the feed. Across TikTok, X, Reddit, and LinkedIn, commenters called it \"dystopian\" and greenwashing, anchoring on AI's environmental footprint, the roughly $500 billion Ohio data-center deal in progress, and OpenAI's $200 million Defense Department contract. The line that traveled: \"The world is on fire. It's not a great time to brag about your $5,000-a-night suite.\" Attendees caught it worse than the company; one deleted her video, and another wrote on LinkedIn, \"I didn't for one second consider it would be controversial.\"\n\nThe trip wasn't improvised. OpenAI hired Instagram's global partnerships chief Charles Porch in February as its first VP of creative partnerships, and spokesperson Drew Pusateri defended the event as education-led. It's also the third AI-lab marketing misfire this quarter, after Meta's Bowie-scored optimism ad and Anthropic's doom reel. Marketing Brew's frame is the right one: the hardest AI sell isn't the product, it's the optics.\n\n**Comment window:** open all week. The crowded take is dunking on influencers. The open take is the pattern: lifestyle-brand playbooks fail when your brand carries infrastructure politics, and what AI-company marketing that works would actually look like.\n\n**Source:** [TechCrunch](https://techcrunch.com/2026/08/03/influencers-draw-backlash-for-attending-openais-first-luxury-trip/) \u00b7 [The Next Web](https://thenextweb.com/news/openai-summer-camp-influencer-retreat-greenwashing-backlash) \u00b7 [Quartz](https://qz.com/openai-influencer-brand-trip-backlash-ai-ethics-080426) \u00b7 [Marketing Brew](https://www.linkedin.com/posts/marketing-brew_turns-out-the-hardest-ai-sell-may-be-the-activity-7491539373973233664-8tnx) \u00b7 August 3\u20137, 2026\n\n### The AI Max email landed mid-August, and practitioner feeds lit up\n\nOn August 5, advertisers got an unsigned email from \"the Google Ads Team\" (no blog post): campaigns using Automatically Created Assets or campaign-level broad match convert to AI Max starting September 1. Twenty-six days' notice, in the middle of holiday-season prep, for a migration whose schedule Google had already pushed once \"citing fourth-quarter risk\" and quietly rewritten. Practitioner LinkedIn spent the week on the timing; Google visibly managed the discourse by putting ads liaison Ginny Marvin on a Q&A about the August 17 bidding update.\n\nMike Ryan of smec supplied the data that made the complaints concrete (see the lead story below). His summary of the revenue mechanics: \"Google is printing money because, all these years later, they're still finding ad inventory in classic search.\"\n\n**Comment window:** open through September 1. Practical posts win here: what to audit, what opting out costs, what the reporting can't show you.\n\n**Source:** [PPC Land on the migration email](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/) \u00b7 [PPC Land on the smec analysis](https://ppc.land/exact-match-loses-1-in-4-impressions-to-ai-max-smec-finds/) \u00b7 August 5, 2026\n\n### Bing feeds matter now, and a practitioner proved it the odd way\n\nBrodie Clark ran a Bing product-feed experiment and found his free listings only started showing after he enabled ads. The finding under the finding is why marketers suddenly care about Bing at all: its shopping feeds are grounding data for LLMs, ChatGPT included. A channel most teams ignored for a decade now feeds the answers their buyers read. Cheap insurance: set up the feed even if your Bing spend stays near zero.\n\n**Comment window:** soft but real; \"the least glamorous AEO move of 2026\" writes itself.\n\n**Source:** [Paid Media Collective Issue 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4, 2026\n\n---\n\n## This Week in Marketing AI\n\n### Exact match isn't exact anymore, and the migration just became mandatory\n\nTwo stories, one control problem. First the data: smec's Mike Ryan analyzed 383 million ecommerce Search impressions in accounts running AI Max and found more than 25% of exact-match keyword impressions were expanded by AI Max's search-term matching rather than matched literally. The expanded share rose from roughly zero in early 2025 to about 29% by July 2026, and the reporting surface can't separate expanded from literal traffic inside a single keyword row. Google reports a 15% average conversion lift for its AI campaigns; independent tests have repeatedly measured lower ROAS for AI Max traffic than for traditional match types. Both numbers can coexist because nobody outside Google can run the split.\n\nThen the mandate: the August 5 email makes AI Max automatic from September 1 for campaigns using ACA or campaign-level broad match. Opting out means turning those settings off before the deadline. Exact match was the last precise control in keyword advertising; it's eroding from the inside in accounts that volunteered, and the September migration extends the mechanics to accounts that didn't.\n\n**Source:** [PPC Land \u2014 smec analysis](https://ppc.land/exact-match-loses-1-in-4-impressions-to-ai-max-smec-finds/) \u00b7 [PPC Land \u2014 migration](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/) \u00b7 [Search Engine Land timeline](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006) \u00b7 August 5, 2026\n\n### ChatGPT Ads goes mass-market: $25 minimums, carousels, Brazil and Mexico\n\nOpenAI spent the week turning ChatGPT Ads into a channel anyone can test. The minimum dropped to $25 per campaign. Product feed carousels went live (multiple products in one large unit, dynamic URL parameters, a fuller release-notes package covering feed campaigns, conversion optimization, and the pixel). Official expansion reached Brazil and Mexico after months of testing, and a descriptive heading is being tested above ad units, similar to Google's AI Mode treatment.\n\nThe density data says the white space is already gone. A monitoring project that logged ChatGPT's ad payload counted 54,899 placements from 1,844 advertisers, with 73.6% of shopping questions returning an ad inside the answer; 2,882 UK advertisers ran ChatGPT Ads in July. Two operational notes: automatic advanced matching becomes the default on web pixels August 17 unless you review it, and the first academic study of the channel (\"The Beginning of ChatGPT Ads,\" AAAI/ACM AIES 2026) is out. Independent scrutiny has started.\n\n**Source:** [Paid Media Collective Issue 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4\u20136, 2026\n\n### Nielsen is buying DoubleVerify for $2.15 billion\n\nNielsen announced it will acquire DoubleVerify, taking the largest independent verification vendor off the public market and combining audience measurement with ad verification in one company. Two weeks ago the TAG/ANA study showed verification signals grading AI slop as premium inventory; now the vendor category that's supposed to fix that is consolidating into the company that sells the audience numbers. Neutrality and pricing questions get sharper, not softer, when the referee and the scorekeeper merge. If your contracts touch DV, the renewal conversation just changed.\n\n**Source:** [Paid Media Collective Issue 225, citing AdExchanger](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 5, 2026\n\n### Agency holdcos found their AI business model: margin on tokens\n\nTwo documents published three hours apart on August 3 (a Digiday briefing and an AdExchanger roundup, synthesized by PPC Land) describe the same move from opposite ends: holding companies are buying LLM compute wholesale, bundling token costs into principal-media commitments, and reselling consumption to clients at a markup presented as a discount against list price. Clients pay less than retail; nobody outside the agency can verify the margin. It's the principal-media playbook applied to compute, arriving just as agentic media buying stalls commercially.\n\nThe engineering critique landed the same weekend. Dutch agency owner Lars Postmus published a two-slide diagram arguing agentic buying inherited the wrong chain of command: a strategist briefs a planner who briefs five specialist buyers who transact across twelve platform endpoints, each a separate MCP call with its own context and auth. The org chart got automated; nobody redesigned it.\n\n**Source:** [PPC Land synthesis](https://ppc.land/agencies-turn-ai-tokens-into-a-margin-business-as-agentic-spend-stalls/) \u00b7 August 2\u20133, 2026\n\n### Amazon's Sponsored Products left Amazon\n\nAmazon extended Sponsored Products placements to premium third-party websites, apps, and select social platforms, including distribution through creators, using advertisers' existing campaign settings, bids, and budgets. The rollout covers the US, Canada, and other launch markets, and it's default-on: your retail media budget now buys open-web and social inventory unless you check placement reporting and say otherwise. Retail media wanted to be a full-funnel network; this is what that looks like operationally: the same auction following shoppers off the property.\n\n**Source:** [Paid Media Collective Issue 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4, 2026\n\n### A publisher put a number on the traffic shift: Google fell from two-thirds to 21%\n\nPeople Inc. told investors on its Q2 call that Google Search now accounts for 21% of its traffic, down from nearly two-thirds. The company is holding ad revenue flat by packaging offsite content instead of chasing the referral back. One publisher's number, but it's the cleanest before-and-after yet from a major operator, and it pairs with the platform math from our last two editions: AI answers keep the visit, publishers keep less of the audience, and distribution strategy moves accordingly.\n\n**Source:** [PPC Land, citing People Inc.'s Q2 call via AdExchanger](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/) \u00b7 August 5, 2026\n\n---\n\n## Platform & Tool Watch\n\n- **Microsoft Clarity split AI citations into branded vs non-branded** (August 3) with filters and labels in the Citations dashboard. Branded citations measure demand you already had; non-branded citations measure discovery. That split is the AEO reach metric teams have been approximating by hand. [Microsoft Clarity via PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n- **Meta rebuilt lead-quality optimization around Sequenced Events** (August 4): Qualified Leads replaces Conversion Leads; credit requires an initial Lead event plus a higher-value final event, in order, and the final event no longer needs CRM plumbing. Also in the same week's bundle: bid-weighted results ROAS, preferred-lead checkboxes on Instant Forms, and stablecoin payments for ads billing in select countries. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n- **Microsoft's Performance Max caught up on controls:** placement exclusions, age exclusions, and age/gender targeting (August 5), plus an Ad Preview Hub and bulk editing for disapproved assets. The control-concession pattern from Google's PMax, replayed a year later on Microsoft's. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n- **Ad Strength doesn't predict CPA:** an analysis of 3,900 Google ads across 65 accounts found no correlation. The grade reflects headline volume, keyword relevance, and pinning, not performance. Optimize for results, not the label. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4\n- **GA4 started inflating Direct revenue on August 2** across multiple unrelated properties; the pattern suggests an attribution bug. Annotate your reports and don't rebudget off Direct's jump until it's resolved. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 6\n- **Looker Studio added Conversational Analytics in preview** on the free tier: plain-language questions against connected data. Dashboards keep becoming chat. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 5\n- **Amazon housekeeping:** a unified Ad Groups tab (UK first), Subscribe & Save retention tiers (three, four, five-plus deliveries), and US invoicing/seller-balance payments. Mobile display parity for AI-rewritten titles arrived August 10. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n- **HubSpot capped Marketing Contacts** (from August 14): a settable maximum ends the silent tier auto-upgrades. Set the cap before your next sync. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n\n---\n\n## Common Threads\n\n### Control keeps moving from the account to the platform\n\nExact match quietly expands 29% of the time; the migration to AI Max stops being optional September 1; Ad Strength grades things that aren't performance. The levers marketers were told to hold are being replaced by settings they can audit but not fully see through.\n\n### The new channels are racing down-market faster than their measurement matures\n\nChatGPT Ads at $25 minimums with carousels and LatAm expansion, while its auction stays dark and the first independent study just published. Speed of access is outrunning quality of evidence; test budgets should assume both.\n\n### Marketing AI products is easy; marketing AI companies keeps failing\n\nMeta scored optimism to an extinction song, Anthropic led with doom, OpenAI booked a $2,000-a-night resort during a data-center backlash. Three labs, three quarters-of-a-billion-dollar brands, three self-inflicted stories in six weeks. The pattern says the problem is structural: these companies carry infrastructure politics that lifestyle playbooks can't launder.\n\n### The middle layer found its margin\n\nHoldcos resell tokens inside principal deals; Nielsen buys the verification vendor; Amazon carries its auction onto the open web. Wherever AI removes an old intermediary, a new one prices itself in.\n\n---\n\n## Angles for the Week\n\n*Raw material for posts and POVs, ordered by how long each window stays open.*\n\n### \"Three AI labs, three marketing misfires, one quarter.\"\n\nMeta's Bowie ad, Anthropic's doom reel, OpenAI's Summer Club. Each failed differently (tone, imagery, optics), and each failed for the same reason: AI companies carry environmental and labor politics that consumer-brand playbooks aren't built to hold. The constructive version (what would credible AI-company marketing look like) is nearly unclaimed territory, and it's exactly the kind of question a growth team can own.\n\nWindow: open while Summer Club discourse runs; the pattern framing is durable.\n\n### \"Exact match expands 29% of the time now. Audit before September 1.\"\n\nRyan's 383-million-impression analysis plus the forced migration gives you a rare combination: fresh data, a hard deadline, and a checklist post that genuinely helps (find campaigns with ACA or campaign-level broad match; decide on opting out; know that keyword-row reporting won't show you the split). Practical authority beats hot takes here.\n\nWindow: hard-edged; closes September 1.\n\n### \"ChatGPT ads now cost $25 to test, and 73.6% of shopping questions already carry one.\"\n\nThe barrier fell and the white space filled in the same week. For SMB-adjacent audiences this is the news; for sophisticated teams the point is the sequencing: access is scaling months ahead of measurement, so structure tests to learn (per-prompt-category, tight conversion events) rather than to scale.\n\nWindow: a week or two of freshness; the August 17 advanced-matching default gives it a second peg.\n\n### \"Ask your agency who pays for the tokens.\"\n\nPrincipal media found its AI twin: compute bought wholesale, resold at an unverifiable markup inside bundled deals. Procurement teams learned to audit media margins a decade ago; token margins are next. A short post listing the three questions to ask (what's the list price, what's our effective rate, who keeps the spread) will get saved and forwarded.\n\nWindow: durable; this is a quarter-long procurement conversation starting now.\n\n### \"Your AEO reach metric just shipped: non-branded citations.\"\n\nClarity now splits AI citations into branded and non-branded. Branded citations are demand you already own; non-branded citations are AI-era discovery. Pair it with the Bing-feeds-as-grounding-data finding and you have a concrete, tool-backed post about measuring and feeding AI visibility that most teams haven't seen yet.\n\nWindow: durable and quietly valuable; tooling posts compound.\n\n---\n\n## Sources\n\n1. [TechCrunch \u2014 Influencers draw backlash for attending OpenAI's first luxury trip](https://techcrunch.com/2026/08/03/influencers-draw-backlash-for-attending-openais-first-luxury-trip/) \u2014 August 3, 2026 \u2014 Summer Club details, OpenAI statement, attendee reactions\n2. [The Next Web \u2014 OpenAI flew influencers to a nature resort to fix its image](https://thenextweb.com/news/openai-summer-camp-influencer-retreat-greenwashing-backlash) \u2014 August 2026 \u2014 venue detail, backlash quotes, Porch hire context\n3. [Quartz \u2014 OpenAI's luxury influencer retreat draws backlash](https://qz.com/openai-influencer-brand-trip-backlash-ai-ethics-080426) \u2014 August 2026 \u2014 Ohio data-center and DoD contract context; deleted-video detail; Anthropic/Microsoft comparisons\n4. [Marketing Brew (LinkedIn) \u2014 the hardest AI sell may be the optics](https://www.linkedin.com/posts/marketing-brew_turns-out-the-hardest-ai-sell-may-be-the-activity-7491539373973233664-8tnx) \u2014 August 7, 2026 \u2014 marketing-industry framing of the backlash\n5. [PPC Land \u2014 Google Ads AI Max auto-upgrade lands September 1](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/) \u2014 August 2026 \u2014 the August 5 email, migration history, People Inc. traffic figure\n6. [PPC Land \u2014 Exact match loses 1 in 4 impressions to AI Max, smec finds](https://ppc.land/exact-match-loses-1-in-4-impressions-to-ai-max-smec-finds/) \u2014 August 2026 \u2014 Ryan's 383M-impression analysis, 29% expansion share, reporting limitations, Ryan quote\n7. [Search Engine Land \u2014 Google sets AI Max migration timeline](https://searchengineland.com/google-sets-ai-max-migration-timeline-for-search-campaigns-485006) \u2014 July\u2013August 2026 \u2014 the full migration calendar through 2027\n8. [PPC Land \u2014 Agencies turn AI tokens into a margin business as agentic spend stalls](https://ppc.land/agencies-turn-ai-tokens-into-a-margin-business-as-agentic-spend-stalls/) \u2014 August 3, 2026 \u2014 token-margin economics, Postmus chain-of-command diagram\n9. [Paid Media Collective \u2014 Issue 225, August 3\u20139](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u2014 August 2026 \u2014 ChatGPT Ads changes and density logging, Nielsen/DoubleVerify, Amazon SP expansion, Meta Sequenced Events, Microsoft PMax controls, Clarity citation split, GA4 bug, Ad Strength analysis, Bing feeds experiment\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# The Monday Signal \u2014 Week of August 10, 2026\n\n> **Google gave 26 days' notice that Search campaigns move to AI Max September 1, and new data shows AI Max already rewrites ~29% of exact-match impressions with no reporting split.** OpenAI's influencer retreat backfired (misfire number three for AI-lab marketing this quarter), ChatGPT Ads dropped to $25 minimums, and Nielsen agreed to buy DoubleVerify for $2.15B.\n\n---\n\n## The Conversation\n\n### OpenAI's \"Summer Club\" backfired\n\nTwo days of beekeeping and farm-to-table content from a ~$2,000-a-night Hudson Valley resort, timed to the ChatGPT Work launch. The feeds called it dystopian and greenwashing (the $500B Ohio data-center deal and $200M DoD contract did the anchoring); one attendee deleted her video. Third AI-lab marketing misfire this quarter after Meta's Bowie ad and Anthropic's doom reel. Comment window: open; the unclaimed take is what credible AI-company marketing would look like. [TechCrunch](https://techcrunch.com/2026/08/03/influencers-draw-backlash-for-attending-openais-first-luxury-trip/) \u00b7 [Marketing Brew](https://www.linkedin.com/posts/marketing-brew_turns-out-the-hardest-ai-sell-may-be-the-activity-7491539373973233664-8tnx)\n\n### The AI Max email\n\nAugust 5, unsigned, no blog post: ACA and campaign-level broad match campaigns convert September 1. Mid-August notice ahead of holiday prep, for a schedule Google already pushed once. Mike Ryan's line captured the mood: \"Google is printing money because, all these years later, they're still finding ad inventory in classic search.\" Window: practical audit posts win through September 1. [PPC Land](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/)\n\n### Bing feeds are LLM grounding data\n\nBrodie Clark's experiment: free Bing listings only appeared after ads were enabled, and the larger point is that Bing shopping feeds ground ChatGPT's answers. Set up the feed even at zero spend. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n\n---\n\n## This Week in Marketing AI\n\n### Exact match expands 29% of the time, and the migration is now mandatory\n\nsmec's Mike Ryan, across 383M ecommerce impressions: more than 25% of exact-match impressions were expanded by AI Max search-term matching, rising to ~29% by July; keyword-row reporting can't split expanded from literal. Google claims a 15% conversion lift (its own measurement); independent tests keep finding lower ROAS. September 1 extends AI Max to accounts that didn't volunteer. [smec analysis](https://ppc.land/exact-match-loses-1-in-4-impressions-to-ai-max-smec-finds/) \u00b7 [Migration](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/)\n\n### ChatGPT Ads goes mass-market\n\n$25 campaign minimums; product feed carousels live; official expansion to Brazil and Mexico; a descriptive heading test above ads. Density logging: 73.6% of shopping questions already return an ad (54,899 placements, 1,844 advertisers). August 17: automatic advanced matching becomes the pixel default unless reviewed. First academic study of the channel is out. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n\n### Nielsen buys DoubleVerify ($2.15B)\n\nThe largest independent verification vendor merges into the audience-measurement incumbent, two weeks after research showed verification signals grading AI slop as premium. Neutrality and pricing questions get sharper. [PMC 225, citing AdExchanger](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 5\n\n### Holdcos are reselling AI compute at a markup\n\nToken costs bundled into principal-media commitments, bought wholesale, resold as a \"discount against list,\" with margins unverifiable from outside. Meanwhile a Dutch agency owner's diagram made the rounds: agentic buying automated the old org chart (twelve platform endpoints, each its own MCP call) instead of redesigning it. [PPC Land](https://ppc.land/agencies-turn-ai-tokens-into-a-margin-business-as-agentic-spend-stalls/) \u00b7 August 2\u20133\n\n### Amazon Sponsored Products left Amazon\n\nPlacements extended to premium third-party sites, apps, and select social platforms (creators included), using existing bids and budgets, default-on in the US and Canada. Check placement reporting before your retail budget quietly buys the open web. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4\n\n### A publisher's before-and-after: Google fell to 21% of traffic\n\nPeople Inc. told investors Google Search is 21% of its traffic, down from nearly two-thirds; it's holding ad revenue flat by packaging offsite content. Cleanest major-publisher datapoint yet on the AI-answers traffic shift. [Via PPC Land](https://ppc.land/google-ads-ai-max-auto-upgrade-lands-september-1-will-ads-all-look-alike/) \u00b7 August 5\n\n---\n\n## Platform & Tool Watch\n\n- **Clarity split AI citations into branded vs non-branded:** the AEO reach metric, shipped. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 3\n- **Meta: Qualified Leads via Sequenced Events** (two events, in order, no CRM required), plus bid-weighted ROAS, preferred-lead checkboxes, and stablecoin ad payments. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4\n- **Microsoft PMax got controls:** placement/age exclusions, Ad Preview Hub, bulk asset appeals. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 5\u20136\n- **Ad Strength \u2260 performance:** no CPA correlation across 3,900 ads / 65 accounts. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 4\n- **GA4 bug inflating Direct revenue since August 2:** annotate before rebudgeting. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n- **Looker Studio: Conversational Analytics preview** on the free tier. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc) \u00b7 August 5\n- **HubSpot: settable Marketing Contacts cap** from August 14 ends silent tier upgrades. [PMC 225](https://www.linkedin.com/pulse/paid-media-news-week-32-yoann-ferrand-uitsc)\n\n---\n\n## Common Threads\n\n### Control keeps moving to the platform\nExact match expands silently; AI Max stops being optional; Ad Strength grades inputs, not outcomes.\n\n### Access is outrunning evidence\n$25 ChatGPT tests and LatAm expansion while the auction stays dark and the first independent study just published.\n\n### AI companies can't market AI\nThree labs, three misfires, six weeks. Infrastructure politics breaks lifestyle playbooks.\n\n### The middle layer found its margin\nTokens resold inside principal deals; the verification vendor sold to the measurement incumbent; Amazon's auction following shoppers off-property.\n\n---\n\n## Angles for the Week\n\n1. **\"Three AI labs, three marketing misfires, one quarter.\"** The pattern is structural; the constructive take (what would work) is unclaimed. Window: this week.\n2. **\"Exact match expands 29% of the time. Audit before September 1.\"** Data plus deadline plus checklist. Window: closes September 1.\n3. **\"$25 to test ChatGPT ads, and 73.6% of shopping questions already carry one.\"** Structure tests to learn, not scale. Peg: August 17 matching default.\n4. **\"Ask your agency who pays for the tokens.\"** Three procurement questions: list price, effective rate, who keeps the spread. Window: quarter-long.\n5. **\"Non-branded citations are your AEO reach metric.\"** Clarity's split plus Bing-feeds-as-grounding. Durable tooling post.\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
