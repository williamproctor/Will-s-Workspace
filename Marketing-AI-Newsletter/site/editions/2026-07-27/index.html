    const EDITION_MD = "# Signal & Scale \u2014 Week of July 27, 2026\n\n> **The AI ad wars went main-character this week.** Meta answered the \"doomers\" with an optimism spot scored \u2014 apparently unironically \u2014 to a David Bowie song about human extinction, while the wreckage of Anthropic's \"hard questions\" ad was still smoldering on X. Meanwhile X deleted 42,000 AI reply bots, and Alphabet told investors that ads inside AI search are now real revenue \u2014 even as new data shows buying a placement doesn't buy a citation. The through-line: authenticity and earned visibility are getting more valuable at exactly the moment automation gets cheaper.\n\n---\n\n## The Conversation\n\n### Meta Answers the AI Doomers With Butterflies \u2014 and a Song About Extinction\n\nMeta launched \"The Future Is for Everyone\" on July 23: a one-minute AI-optimism spot that opens on doomy black-and-white headlines and blooms into color. The voiceover: \"Call us optimists. Call us dreamers. Call us whatever the hell you want. But we're betting on people, and we like those odds.\" Zuckerberg posted it personally; Meta CMO Denise Moreno carried the LinkedIn version (\"we think AI will empower people to do more of what they love\").\n\nThe dunks wrote themselves. The soundtrack is David Bowie's \"Five Years\" \u2014 a song about Earth learning it has five years left \u2014 with the apocalyptic verses trimmed out (TechCrunch's headline: an AI optimism ad \"set to a song about human extinction\"). Engadget noted the pro-AI campaign is \"conspicuously light on AI\": no product actually does anything in it. And the timing is legible to everyone: Meta reports earnings Wednesday, July 29, with hundreds of billions in AI capex to justify.\n\nThe richer subplot is the contrast with Anthropic's \"There's Hope in Hard Questions\" (July 9, ~3.3M views on X), which took the opposite bet \u2014 cemeteries, burning houses, existential questions \u2014 and got mocked for it, most famously by Sam Altman: \"i thought this was satire.\" One detail worth stealing for client decks: the same Anthropic ad was praised by creative directors on LinkedIn and shredded on X and YouTube. Same creative, opposite receptions, different networks.\n\n**Comment window:** wide open through Meta's earnings Wednesday. The cheap take is dunking on the song choice; the differentiated take is what these two campaigns reveal about audience-message fit and how AI companies should market AI.\n\n**Source:** [TechCrunch](https://techcrunch.com/2026/07/23/meta-launched-a-new-ai-optimism-ad-set-to-a-song-about-human-extinction/) \u00b7 [Engadget](https://www.engadget.com/2222159/meta-pro-ai-ad-campaign-is-conspicuously-light-on-ai/) \u00b7 [Business Insider comparison](https://www.businessinsider.com/meta-anthropic-ai-ad-campaign-compared-2026-7) \u00b7 [Time on the Anthropic backlash](https://time.com/article/2026/07/16/anthropic-ai-marketing-advertisement/) \u00b7 [LinkedIn-vs-X reception analysis](https://bretkerr.substack.com/p/the-messenger-paradox-how-anthropics) \u00b7 July 23, 2026\n\n### X Deletes 42,000 AI Reply Bots \u2014 and LinkedIn Is Squeezing AI Comments Too\n\nOn July 24, X head of product Nikita Bier announced: \"We found 42,000 accounts automating replies using chatbots and have removed them from the platform. X's core value is providing an authentic pulse on humanity \u2014 and using AI to programmatically engage with users without a human in the loop runs counter to our mission.\" No warnings, no grace period. It's the sharpest strike yet in a crackdown that has removed more than 1.7 million bots since early 2026 \u2014 and unlike earlier spam sweeps, this one hit tools used by real startups and growth teams to automate engagement.\n\nLinkedIn is reportedly moving the same direction: its 2026 algorithm changes suppress generic AI comments out of \"Most Relevant\" and restrict repeat offenders (secondary reporting via Startup Fortune \u2014 treat as reported, not confirmed).\n\nThe read for growth teams: AI-automated engagement is being reclassified from tactic to violation on the two platforms that matter most for B2B thought leadership. Draft-with-human-review workflows survive; autonomous engagement products just lost their addressable market.\n\n**Comment window:** open now \u2014 every founder who bought an \"AI engagement\" tool is quietly re-reading the contract. A grounded post on what still works (human-in-the-loop) will land all week.\n\n**Source:** [Bier's post, captured](https://digg.com/tech/1ygslyhm) \u00b7 [Startup Fortune analysis](https://startupfortune.com/x-removes-42000-ai-reply-bot-accounts-and-the-warning-to-growth-marketers-is-impossible-to-ignore/) \u00b7 July 24, 2026\n\n### Google's AI Told Customers a Bakery Was Closing. It Wasn't.\n\nAnna Mae's Bakery owner Amanda Herrfort found out from a customer's screenshot that Google's AI Overview was telling people her shop permanently closes July 31 \u2014 a date the AI invented. Google blamed thin web data. The story went viral because it's the perfect miniature of the AI-visibility problem: the machine now speaks for your brand whether or not you're publishing, and silence is what it hallucinates into.\n\n**Comment window:** evergreen but hot right now \u2014 pairs naturally with the week's data showing what actually feeds AI answers (see the Similarweb story below).\n\n**Source:** [PPC Land](https://ppc.land/google-ai-overview-forces-anna-maes-bakery-to-deny-fake-july-31-closing/) \u00b7 July 26, 2026\n\n---\n\n## This Week in Marketing AI\n\n### Alphabet Q2: Ads Inside AI Search Are Real Revenue \u2014 and Buying One Doesn't Buy a Citation\n\nAlphabet reported Q2 on July 22: Search advertising up 17% to $63.3 billion, while the open-web Network line fell 1% to $7.3 billion. The shift for marketers is where growth is coming from. AI Mode has passed 1 billion monthly users, and Google is monetizing it directly: contextual sitelinks, Direct Offers (Chewy, Gap, L'Or\u00e9al; IHG next), and Highlighted Answers \u2014 \"clearly marked sponsored links inside list responses,\" per chief business officer Philipp Schindler. Those formats debuted at Google Marketing Live in May and showed up on an earnings call as revenue drivers nine weeks later.\n\nAI Max is out of beta with 500,000+ advertisers; Google claims a 15% average lift in conversions or value at similar ROAS (Google-measured \u2014 independent tests last November found *higher* cost per conversion than standard match types; unresolved). Dynamic Search Ads retire in September with automatic upgrades into AI Max. Sundar Pichai repeated that Google sends \"billions of clicks to websites every week\" through AI features \u2014 hold that against Ahrefs' finding that AI Overviews correlate with a 58% CTR drop for top-ranked pages. Both can be true; denominators matter.\n\nThe kicker: SE Ranking found AI Mode showed a text ad on 29% of tested commercial keywords, but the advertiser's domain appeared among the answer's *cited sources* only 11% of the time. Paid placement, citations, and rankings are three separate surfaces. Buying one does not buy the others.\n\n**Source:** [PPC Land earnings analysis](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 [Search Engine Land](https://searchengineland.com/google-ai-max-billions-new-monetizable-searches-483347) \u00b7 [Alphabet Q2 call](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx) \u00b7 [SE Ranking via SEJ](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u00b7 July 22, 2026\n\n### August 2: AI-Content Labels Become Enforceable in the EU, With 3%-of-Turnover Fines\n\nThe European Commission published its Article 50 guidelines and finalized the Code of Practice on Transparency of AI-Generated Content on July 20; the EU AI Act's transparency obligations become applicable **August 2**, with fines up to \u20ac15 million or 3% of worldwide turnover. Google announced July 24 it's signing the Code \u2014 while its own documentation keeps liability with the advertiser.\n\nTwo details matter most. The artistic carve-out **does not cover advertising**: a synthetic spokesperson selling a product needs the full label. Assistive editing (retouching, color, cropping) stays exempt. And the EU is one layer of a stack: New York's synthetic-performer disclosure has been live since June 9 ($1,000\u2013$5,000 per violation), India's rules since February, and California's SB 942/AB 853 are synced to the same August 2 date. Google spent the month shipping the plumbing \u2014 an AI label setting across five ads products, attestation fields in the Google Ads and DV360 APIs \u2014 all of it recording declarations that no system validates and that remain the advertiser's legal problem.\n\n**Source:** [PPC Land on the three-regime stack](https://ppc.land/advertisers-face-5-000-new-york-fines-and-3-eu-penalties-over-ai-labels/) \u00b7 [PPC Land on Google signing](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/) \u00b7 July 20\u201324, 2026\n\n### ChatGPT Ads Ships Conversion Bidding on Top of a Dark Auction\n\nOpenAI rolled out the toolkit performance marketers were waiting for: conversion-optimized (oCPC) campaigns, geo exclusions, AppsFlyer/Adjust integrations, hashed-data advanced matching, a bulk API, and product cards with prices and ratings. Daily budgets move to seven-day rolling averages from July 27. The platform that started with $200,000 minimums now has none.\n\nDemand is arriving faster than reporting: Adthena tracks 7,378 advertisers in ChatGPT (placements up 97x in a quarter, small base), led by Booking.com. But the native Ads Manager shows advertisers only their own numbers \u2014 no impression share, no auction insights \u2014 and UK advertisers have watched costs swing 39\u2013278% with no visible cause. Advertisers also contest loose prompt categories rather than enumerable keywords. This auction is roughly where paid search was two decades ago, except the spend is arriving at modern scale before the reporting exists.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u00b7 [eMarketer](https://www.emarketer.com/content/chatgpt-ads-shift-clicks-conversions) \u00b7 [PPC Land weekly on Adthena](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 20\u201327, 2026\n\n### Similarweb: ChatGPT Falls to Half of Gen-AI Traffic; Citations and Clicks Point at Different Pages\n\nSimilarweb's 2026 Generative AI Landscape report, out this week: 9.5 billion monthly web visits to gen-AI platforms (+70% YoY). ChatGPT's share of standalone gen-AI web visits fell from above 80% in late 2024 to just above 50% by May; June panel snapshots put Gemini around 27% and Claude around 9%. For AI-visibility work, four findings stand out:\n\n- **ChatGPT's citation rate jumped from ~1.3% to 6.8% of answers** in a year (travel 22.6%, retail 13.5%). Reviews/UGC supply 28.9% of top citations, news 26.0%.\n- **Citations and referrals diverge:** 65% of cited URLs sit two-plus folders deep, while 58.8% of referral traffic lands on homepages.\n- **AI referral traffic converts at 7.1%** \u2014 second only to paid search (7.8%).\n- **Ads appeared in 26% of US desktop ChatGPT chats in June** (14% in May) at a 0.50% CTR \u2014 meaning roughly three-quarters of even the most ad-saturated assistant surface is still earned exposure.\n\nCaveats: panel estimates, and vendors disagree \u2014 Similarweb puts AI Overviews in 43% of US searches where Adthena's pulse says 18%, and their UK ChatGPT ad numbers are flatly incompatible. No standard measurement exists yet.\n\n**Source:** [PPC Land coverage](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u00b7 [Similarweb report](https://www.similarweb.com/corp/reports/2026-generative-ai-landscape/) \u00b7 [June share snapshot](https://fourweekmba.com/ai-chatgpt-gemini-claude-generative-ai-traffic-share-2026/) \u00b7 week of July 20, 2026\n\n### WARC: 88% More Creative, 45% Better \u2014 the Brief Is the Bottleneck\n\nWARC's \"The New Creative Advantage\" (with TikTok and LIONS Advisory; 400 marketers across four markets, covered July 22): 88% report higher creative volume since adopting AI; only 45% report significantly better quality. The study locates the 43-point gap in the brief: **67% feed generative models demographic data as the primary input, while 59% of the same population says demographic segmentation no longer works.** Only 17% consistently add community or audience insight. TikTok's Andy Yang, in the foreword: the gap is \"not a technology gap, it is an intelligence gap.\" (Disclosure: TikTok commissioned research that concludes marketers need the cultural signal TikTok sells; the data stands, the alignment belongs on the record.)\n\nThe mechanism worth internalizing: AI compresses production, which removes the human layers that used to compensate for thin briefs. The brief now travels almost directly to the finished asset \u2014 input quality matters more than ever at the exact moment most teams left it unchanged.\n\n**Source:** [PPC Land weekly analysis](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 covered July 22, 2026\n\n### Fractl: 81% of Buyers Still Call It SEO \u2014 and Buzzword Pitches Are the #1 Red Flag\n\nFractl surveyed 343 US marketing decision-makers responsible for AI visibility (released July 21): 81% still say \"SEO\" internally; 19% have adopted \"GEO,\" 10% \"AEO.\" When buyers search for help, \"AI search optimization\" (46%) and \"SEO\" (24%) dominate; \"GEO\" gets 12%, \"AEO\" 3%. Heavy buzzword use is the single biggest vendor red flag (36%), and case studies outrank acronym fluency roughly four to one. Budgets moved anyway: an average 24% of search/content spend now goes to AI visibility, with financial services leading at 39%. (Disclosure: Fractl sells adjacent services; US-only sample of 343.)\n\n**Source:** [Fractl study](https://www.frac.tl/ai-search-optimization-language/) \u00b7 [PPC Land coverage](https://ppc.land/marketers-still-call-it-seo-as-81-reject-geo-pitch-fractl-finds/) \u00b7 July 21, 2026\n\n---\n\n## Platform & Tool Watch\n\n- **Google shipped a domain-level opt-out of AI answers** \u2014 Search Console's \"Search generative AI control\" excludes a site from AI Overviews, AI Mode, and Discover AI within 1\u20132 days; not a ranking signal; does *not* stop model training. Page-level controls: March 2027. Publishers who blocked AI crawlers have measured persistent traffic losses \u2014 check the data before touching the toggle. [Google docs](https://support.google.com/webmasters/answer/16908024) \u00b7 [PPC Land](https://ppc.land/google-gives-site-owners-a-toggle-to-exit-ai-overviews-and-ai-mode/) \u00b7 ~July 20\n- **The EC fined Google \u20ac890M under the DMA** (July 23); how self-preferencing rules will apply to AI Overviews/AI Mode is still being negotiated \u2014 that deferred question will shape European AI visibility more than any feature launch. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 23\n- **Performance Max may finally get search-partner/GDN exclusions** \u2014 in testing, per Digiday; practitioners call it the biggest control concession since launch. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **Gemini 3.6 Flash launched July 21 with price cuts** (17% fewer output tokens; Flash-Lite at $0.30/M input) \u2014 agentic marketing tools that didn't pencil in June may pencil in August unchanged. [Google](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Meta: Seller app with AI listings** (July 24; \"about 30 seconds\" per listing \u2014 Meta's claim, no accuracy rate), a test opening Facebook straight into full-screen video with the Classic Feed demoted to a second tab, and free selfie-verification badges from July 27. **Meta reports Q2 earnings Wednesday, July 29.** [PPC Land](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u00b7 [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-to-Announce-Second-Quarter-2026-Results/default.aspx) \u00b7 July 24\u201329\n- **Amazon shipped ~10 AI features into Brand+/Performance+** from July 22 while removing single-deal streaming-TV buying \u2014 the same consolidation pattern Google is running with AI Max. [PPC Land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u00b7 July 22\u201326\n- **Time is building pages for readers who aren't human.** COO Mark Howard described serving two audiences \u2014 people, and the AI crawlers that now outnumber them (bots are >50% of web traffic per Cloudflare; crawl-to-referral ratios run 118:1 to ~50,000:1). Time routes AI crawlers to a stripped-down copy of its site and sells text ads humans never see. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **HubSpot opened Agent Hub in public beta** \u2014 low-code agents on CRM data; HubSpot itself flagged the failure mode of uncoordinated agents acting on the same customer. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n\n---\n\n## Common Threads\n\n### Authenticity Is Becoming Platform Policy, Not Just Taste\n\nX deleted 42,000 AI reply bots for lacking \"a human in the loop.\" LinkedIn reportedly suppresses generic AI comments. Meta ships selfie-verification badges. The platforms that sold reach are now defending the authenticity of engagement itself \u2014 which raises the value of genuinely human commentary exactly as the supply of fake commentary gets purged.\n\n### AI Search Is Now a Paid Channel \u2014 and Paid Doesn't Buy Cited\n\nGoogle booked AI Mode ad revenue, OpenAI shipped conversion bidding \u2014 yet advertisers' domains appear among AI-cited sources just 11% of the time on ad-carrying keywords, and roughly three-quarters of US desktop ChatGPT chats carry no ads at all. Paid presence, citations, and rankings are three separate surfaces sharing a screen. Budget them separately.\n\n### Production Outran Verification\n\nMarketers make 88% more creative and can verify quality on 45% of it. Agent launches ship precise time savings and no accuracy rates. Attestation APIs record declarations nobody validates. Across the stack, generation scaled faster than the evaluation layer around it \u2014 and vendors publish the variable that's easy to measure.\n\n### The Measurement Layer Is Unsettled \u2014 Anchor Accordingly\n\nSimilarweb says AI Overviews appear in 43% of US searches; Adthena says 18%. Their UK ChatGPT ad-penetration numbers are mutually exclusive. Any strategy narrative or client deck anchored on a single vendor's panel inherits that uncertainty and should say so.\n\n---\n\n## Angles for the Week\n\n*Raw material for posts and POVs \u2014 each grounded in this edition's reporting, prioritized by how long the conversation window stays open.*\n\n### 1. \"Meta and Anthropic just ran the same ad with opposite emotions. Both missed.\"\n\n- **Hook:** The most instructive marketing case study of the year is AI companies trying to market AI \u2014 and the reception data is public.\n- **Evidence:** Meta's July 23 optimism spot (Bowie extinction-song discourse, \"conspicuously light on AI,\" six days before earnings); Anthropic's doom-toned ad (3.3M X views, Altman's \"satire\" dunk) \u2014 praised on LinkedIn, shredded on X. Same creative, opposite reception by network.\n- **Why now:** Window is open through Meta's Wednesday earnings. Everyone's dunking on the song; the differentiated take is audience-message fit and the LinkedIn/X reception split \u2014 which is a client-ready insight about channel-native messaging.\n\n### 2. \"X just told you its algorithm's values: automated engagement is now a violation.\"\n\n- **Hook:** 42,000 accounts deleted for AI replies isn't a spam story \u2014 it's a distribution-strategy memo.\n- **Evidence:** Bier's July 24 post (\"without a human in the loop runs counter to our mission\"); 1.7M bots purged since early 2026; LinkedIn reportedly demoting generic AI comments.\n- **Why now:** Every team running AI engagement tools is deciding what to do this week. A concrete \"what survives: draft-with-review, what dies: autopilot\" post is immediately useful and positions the author on the right side of the purge.\n\n### 3. \"AI search became a paid channel this week. Citations are still earned.\"\n\n- **Hook:** Google will now happily sell you a spot inside the AI answer. It will not sell you a citation.\n- **Evidence:** Alphabet cited AI Mode formats as revenue (July 22); SE Ranking: advertisers' domains among cited sources just 11% of the time; Similarweb: ~74% of US desktop ChatGPT chats carry no ads; recommended brands get 2\u20134x the follow-on visits.\n- **Why now:** First earnings call where AI-answer ads were presented as working revenue. The paid-vs-earned frame for AI answers is wide open and nobody owns it yet.\n\n### 4. \"Would your ads survive August 2?\"\n\n- **Hook:** In six days, an unlabeled synthetic spokesperson in the EU can cost 3% of worldwide turnover.\n- **Evidence:** Article 50 applicable August 2; advertising explicitly excluded from the artistic carve-out; Google signed the Code July 24 and still points liability at the advertiser; New York live since June 9; California synced to the same date.\n- **Why now:** Hard deadline this week. A practical decision-tree post (\"which of your assets need a label?\") is genuinely useful and reads as the adult in the room.\n\n### 5. \"Your buyers still call it SEO.\"\n\n- **Hook:** The industry renamed the discipline three times before the customer renamed it once.\n- **Evidence:** Fractl (July 21): 81% say \"SEO\" internally; \"AEO\" gets 3% of help-seeking searches; buzzword-heavy pitches are the #1 vendor red flag (36%); case studies beat acronym fluency 4:1 \u2014 while 24% of search/content budgets already moved to AI visibility.\n- **Why now:** Fresh data, and a self-aware angle for a team that uses the AEO label daily. Naming the tension is what makes the post credible.\n\n---\n\n## Sources\n\n1. [TechCrunch \u2014 Meta launched a new AI optimism ad set to a song about human extinction](https://techcrunch.com/2026/07/23/meta-launched-a-new-ai-optimism-ad-set-to-a-song-about-human-extinction/) \u2014 July 23, 2026 \u2014 campaign detail, voiceover, Bowie soundtrack analysis, Zuckerberg post\n2. [Engadget \u2014 Meta's pro-AI ad campaign is conspicuously light on AI](https://www.engadget.com/2222159/meta-pro-ai-ad-campaign-is-conspicuously-light-on-ai/) \u2014 July 23, 2026 \u2014 campaign substance critique; Meta spokesperson framing; CMO Denise Moreno's LinkedIn post\n3. [TechRepublic \u2014 Zuckerberg wants to change how you think about AI](https://www.techrepublic.com/article/news-meta-ai-optimism-campaign-zuckerberg-2026/) \u2014 July 24, 2026 \u2014 campaign/earnings timing context\n4. [Business Insider \u2014 A side-by-side comparison of Meta and Anthropic's AI ads](https://www.businessinsider.com/meta-anthropic-ai-ad-campaign-compared-2026-7) \u2014 July 2026 \u2014 the two campaigns as a debate; Meta's timeline caveat\n5. [Time \u2014 The backlash to Anthropic's ad misses something bigger](https://time.com/article/2026/07/16/anthropic-ai-marketing-advertisement/) \u2014 July 16, 2026 \u2014 Anthropic ad c     const EDITION_SIMPLIFIED = "# Signal & Scale \u2014 Week of July 27, 2026\n\n> **The AI ad wars went main-character.** Meta answered the \"doomers\" with an optimism spot set to a Bowie song about extinction; Anthropic's doom-toned ad was still getting dunked on; X deleted 42,000 AI reply bots; and Alphabet booked ads inside AI search as real revenue \u2014 while new data showed buying a placement doesn't buy a citation.\n\n---\n\n## The Conversation\n\n### Meta vs Anthropic: the AI ad wars\n\nMeta launched \"The Future Is for Everyone\" July 23 \u2014 optimism, butterflies, \"call us whatever the hell you want\u2026 we're betting on people.\" The internet noticed the soundtrack is Bowie's \"Five Years\" (a song about extinction, verses trimmed) and that the ad shows almost no actual AI. Six days before Meta's earnings. It reads as the answer to Anthropic's \"hard questions\" ad (July 9, ~3.3M X views), which Sam Altman mocked as looking like satire. Sharpest detail: the same Anthropic ad was **praised on LinkedIn and shredded on X** \u2014 same creative, opposite receptions by network. **Comment window: open through Wednesday's Meta earnings.** [TechCrunch](https://techcrunch.com/2026/07/23/meta-launched-a-new-ai-optimism-ad-set-to-a-song-about-human-extinction/) \u00b7 [Reception split](https://bretkerr.substack.com/p/the-messenger-paradox-how-anthropics)\n\n### X deletes 42,000 AI reply bots\n\nNikita Bier, July 24: AI engaging users \"without a human in the loop runs counter to our mission.\" Part of a 1.7M-bot purge since early 2026 \u2014 this wave hit tools real growth teams use. LinkedIn is reportedly suppressing generic AI comments too. Automated engagement is being reclassified from tactic to violation. **Comment window: open now** \u2014 a grounded \"what survives (draft-with-review) vs what dies (autopilot)\" post lands all week. [Bier's post](https://digg.com/tech/1ygslyhm) \u00b7 [Analysis](https://startupfortune.com/x-removes-42000-ai-reply-bot-ac sts swung 39\u2013278% unexplained. Modern-scale spend, two-decades-ago reporting. [SER](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u00b7 [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n### Similarweb: the assistant market split three ways\n\nGen-AI platforms: 9.5B monthly visits (+70% YoY). ChatGPT fell from >80% share to ~50%; June snapshots: Gemini ~27%, Claude ~9%. Citations up to 6.8% of ChatGPT answers; cited pages are deep pages while referral traffic lands on homepages; AI referrals convert at 7.1% (second only to paid search). Ads in 26% of US desktop chats \u2014 ~74% of exposure is still earned. Caveat: Similarweb and Adthena publish incompatible numbers; no standard exists. [PPC Land](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/)\n\n### WARC: the brief is the bottleneck\n\n88% more creative volume with AI; only 45% better quality. 67% brief models with demographics; 59% of the same marketers say demographics don't work; 17% add community insight. TikTok's Andy Yang: \"not a technology gap, it is an intelligence gap.\" (TikTok co-commissioned.) [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n### Fractl: buyers still say \"SEO\"\n\n81% call AI-search work \"SEO\" internally; \"AEO\" gets 3% of help-seeking searches. Buzzword pitches = #1 vendor red flag (36%); case studies beat acronyms 4:1. Budgets moved anyway: 24% of search/content spend now goes to AI visibility. [Fractl](https://www.frac.tl/ai-search-optimization-language/) \u00b7 July 21\n\n---\n\n## Platform & Tool Watch\n\n- **Google: domain-level opt-out of AI Overviews/AI Mode** in Search Console (1\u20132 days; not a ranking signal; doesn't stop training; page-level March 2027). [Docs](https://support.google.com/webmasters/answer/16908024) \u00b7 ~July 20\n- **EC fined Google \u20ac890M under
