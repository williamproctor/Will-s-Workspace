    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of July 17, 2026\n\n> **AI media is moving from impressive output toward correctable production objects.** Foundry\u2019s SmartRoto returns editable splines instead of a flat mask. Decart\u2019s Lucy 2.5 keeps a generated video stream open to live direction. MultiRef-Compass measures whether references stay attached to the correct people, objects, actions, and sounds. Synthesia Dubbing 2.0 lets editors revise and regenerate individual segments, while BandLab\u2019s acquisition of Aiode brings a licensed, musician-participatory system for producing editable stems. Beyond media tools, Kimi K3 and the late-breaking Qwen3.8-Max-Preview show how quickly the general-model frontier is widening\u2014and why launch-day scale claims are not the same as proven production quality.\n\n---\n\n## This Week in AI\n\n### SmartRoto Returns the Part Compositors Need to Correct\n\nFoundry released **SmartRoto** on July 17 as a plugin for Nuke. An artist creates keyframes in the existing Roto node, and SmartRoto propagates the shape through the shot while preserving an editable spline.\n\nThat output format is the important part. A flat AI mask can look convincing and still be awkward to repair. A spline can be adjusted point by point, combined with artist-created keyframes, and carried into the next familiar stage of compositing.\n\nSmartRoto costs **$499 per year at its introductory price** and **$599 per year at the regular price**. It requires a separate Nuke-family license. Foundry also offers an unrestricted 90-day trial.\n\nInference runs locally, and Foundry says the model was trained on licensed data, with no customer footage transmitted for processing. The plugin requires Nuke 16.1 or later; Foundry recommends more than 8GB of VRAM and lower-resolution work on less capable GPUs.\n\nThe speed claim needs context. Foundry advertises **up to four times faster** roto work. In independent reporting from fxguide, Foundry\u2019s testing lead said **roughly two times faster was the more consistent result**, with four times representing the high end. Those figures describe vendor testing and reporting, not a broad independent benchmark across production shots.\n\nSmartRoto is a useful example of this week\u2019s larger shift. The AI output is not positioned as the end of the job. It is a correctable production object inside the tool artists already use.\n\n**Source:** [Foundry \u2014 SmartRoto](https://www.foundry.com/products/nuke-family/smartroto) \u00b7 [fxguide \u2014 independent SmartRoto reporting](https://www.fxguide.com/fxfeatured/foundrys-smartroto-ai-assisted-roto-that-aims-to-work-the-way-you-do/) \u00b7 July 17, 2026\n\n### Lucy 2.5 Treats a Live Video Stream as an Editable Surface\n\nDecart launched **Lucy 2.5** on July 16 for real-time editing of streaming video. Text and reference images can direct subject replacement, object addition or removal, environment changes, and edits that persist as the stream continues.\n\nThe model uses WebRTC and supports landscape and portrait output. Decart\u2019s release page says **1080p at 30 frames per second**, while the current API documentation lists **1280\u00d7720**. That discrepancy matters for production planning, and no independent latency, consistency, or quality benchmark was available during the research window.\n\nLucy 2.5 represents a different interaction model from prompt, render, and export. The moving image remains responsive while it plays, bringing generative editing closer to live camera processing, virtual sets, and interactive production.\n\n**Source:** [Decart \u2014 Lucy 2.5 release](https://decart.ai/publications/lucy-2-5-raising-the-bar-for-live-ai) \u00b7 [Decart \u2014 Lucy 2.5 API documentation](https://docs.platform.decart.ai/models/realtime/lucy-2.5) \u00b7 July 16, 2026\n\n### MultiRef-Compass Tests Whether References Stay Correctly Bound\n\nThe **MultiRef-Compass** paper, posted July 15, evaluates eight audio-video systems across **350 curated multi-reference samples**. Its four dimensions are basic quality, reference consistency, audio-visual consistency, and instruction following.\n\nThe authors reported Gemini Omni leading their visual-quality and lip-sync measures, while Kling narrowly led entity fidelity. Those comparisons are not complete head-to-head results: safety filters reduced Seedance to **282 samples** and Gemini Omni to **245**, several automatic metrics use Gemini 3.1 Pro as a judge, and the work has not yet been independently replicated.\n\nThe benchmark is valuable because it identifies production failures that a general preference score can miss: one identity splitting into two, roles being exchanged, attributes moving to the wrong subject, or a sound being assigned to the wrong source.\n\nFor reference-driven production, a polished frame is only part of correctness. The right face, object, action, voice, and sound must remain bound together throughout the result.\n\n**Source:** [MultiRef-Compass paper](https://arxiv.org/abs/2607.14189) \u00b7 [MultiRef-Compass code](https://github.com/zxhhh0201/MultiRef-Compass) \u00b7 July 15, 2026\n\n### Synthesia Dubbing 2.0 Makes Localization More Correctable\n\nSynthesia released **Dubbing 2.0** on July 15 with revised lip sync, voice, translation, glossary support, and timing preservation across more than 130 languages.\n\nEditors can review the transcript and translation, then regenerate an individual segment instead of rerendering the complete video. The service is live for all customers, while Enterprise plans unlock the complete editing workflow and unlimited dubbing.\n\nSynthesia describes the result as a publishable first pass. That is a vendor claim: the company did not provide a blind comparison, numerical error rate, or independent evaluation. The more verifiable workflow change is the ability to isolate a failed segment, correct it, and continue.\n\n**Source:** [Synthesia \u2014 Dubbing 2.0](https://www.synthesia.io/post/introducing-dubbing-2-0) \u00b7 July 15, 2026\n\n### BandLab Acquires Aiode and Its Licensed Music Workflow\n\nBandLab Technologies announced its acquisition of **Aiode** on July 15. Aiode\u2019s standalone web and desktop beta will continue.\n\nAiode creates audio-to-audio musician and style models. It supports section-level direction, alternate takes, and export of separate **48kHz/24-bit stereo WAV stems** rather than only a completed mix.\n\nThe company says all training recordings are licensed and traceable, participating musicians help build their individual models, and those musicians receive revenue share. Those are company statements; revenue-share percentages and acquisition terms were not disclosed, and several digital-audio-workstation capabilities remain planned rather than available.\n\nThe combination of licensed source material, performer participation, section-level revision, and separate stems places rights and editability inside the music workflow rather than treating them as follow-up questions.\n\n**Source:** [BandLab Technologies \u2014 Aiode acquisition](https://bandlabtechnologies.com/news/bandlab-technologies-announces-acquisition-ai-powered-digital-music-studio-aiode/) \u00b7 [Aiode \u2014 product details](https://aiode.com/product/) \u00b7 July 15, 2026\n\n---\n\n## Frontier Watch\n\n### Kimi K3 Arrives as a Large Video-Aware Understanding and Agent Model\n\nMoonshot AI launched **Kimi K3** on July 16 with **2.8 trillion total parameters**, with **16 of 896 experts active** for each token. It accepts native image and video input and supports a **one-million-token context window**.\n\nKimi K3 is hosted now through Kimi products and the API. Full weights are **scheduled for July 27**; they were not downloadable during this edition\u2019s research window. API pricing is **$0.30 per million cached input tokens, $3 per million fresh input tokens, and $15 per million output tokens**. Moonshot recommends deployment on supernode configurations with **64 or more accelerators**, so a future open-weight release would not make this an ordinary-workstation model.\n\nFor AV work, Kimi K3 is an understanding and agent model, **not a native video generator**. Moonshot demonstrated the model examining video, selecting source clips, generating motion-graphics code, making motion-matched cuts, synchronizing edits to beats, processing audio, and revising an edit through tools. That video-editing example is vendor-reported and does not establish ordinary-project reliability or finished-output quality.\n\nThe model\u2019s size describes scale, not quality. Moonshot\u2019s own evaluation notes show that hardware, harnesses, reasoning effort, and fallback behavior can materially affect comparisons. Early independent results place Kimi K3 near the frontier and strong on some coding tasks, but launch-day rankings remain unsettled.\n\n**Source:** [Moonshot AI \u2014 Kimi K3](https://www.kimi.com/blog/kimi-k3) \u00b7 [Kimi API documentation](https://platform.kimi.ai/docs/guide/kimi-k3-quickstart) \u00b7 [VentureBeat \u2014 launch reporting](https://venturebeat.com/technology/chinas-moonshot-ai-releases-kimi-k3-the-largest-open-source-model-ever-rivaling-top-u-s-systems) \u00b7 July 16, 2026\n\n### Qwen3.8-Max-Preview Adds a Late-Breaking Frontier Claim\n\nAlibaba officially announced **Qwen3.8-Max-Preview** on **July 19**, two days outside this edition\u2019s July 11\u201317 research window. It is included here as a late-breaking development because it followed Kimi K3 within days.\n\nAlibaba reports **2.4 trillion parameters** and multimodal capability. Preview access is available through **Token Plan, Qoder, and QoderWork**. The company has promised open weights but has not published a release date.\n\nAlibaba says Qwen3.8 is \u201csecond only to Fable 5.\u201d That is a vendor claim without an independent benchmark package available at announcement. As with Kimi K3, parameter count indicates scale, not demonstrated production quality. The timing shows a widening frontier; it does not settle which model is best.\n\n**Source:** [South China Morning Post \u2014 Qwen3.8 announcement reporting](https://www.scmp.com/tech/article/3361119/alibaba-says-newest-qwen-ai-model-second-only-anthropics-claude-fable-5) \u00b7 July 19, 2026 \u00b7 late-breaking\n\n---\n\n## Quick Hits\n\n- **Griptape Enterprise** places text, image, video, audio, and 3D models behind node-based workflows with permissions, versioning, provenance metadata, and on-premises or private-cloud deployment. Foundry assigns customers responsibility for verifying the training-data and licensing terms of each connected model. [Foundry](https://www.foundry.com/products/griptape) \u00b7 [Independent coverage](https://www.awn.com/news/foundry-launches-griptape-enterprise-secure-ai-accelerated-vfx-workflows) \u00b7 July 17\n- **Google Vids added Gemini Omni editing and account-linked personal avatars.** This is a partial repeat of earlier Omni coverage; the new part is the integration in Vids. Availability is rolling out to eligible paid plans with account, region, language, age, and administrator requirements, and generated clips receive SynthID. [Google Workspace](https://workspace.google.com/blog/product-announcements/introducing-gemini-omni-flash-in-google-vids) \u00b7 [Independent coverage](https://www.theverge.com/ai-artificial-intelligence/966644/google-vids-will-now-let-you-generate-ai-videos-of-yourself) \u00b7 July 16\u201317\n- **NotebookLM became Gemini Notebook.** Google is positioning the product as a broader source-to-media workspace for audio, video, and interactive material. The announcement is primarily a rebrand and product-positioning change, not a new media-model benchmark. [Google](https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/) \u00b7 July 16\n- **VideoChat3** is a 4-billion-parameter model for long and streaming video understanding with 16-times spatiotemporal compression. Its reported benchmark scores are author-run, training code was not available during the scan, and long-video testing used H200-class hardware. [Paper](https://arxiv.org/abs/2607.14935) \u00b7 [Code](https://github.com/MCG-NJU/VideoChat3) \u00b7 July 16\n- **LALAL.AI Lynx** is now the default dialogue-isolation model in the company\u2019s Voice Cleaner and Voice & Noise products across browser, mobile, desktop cloud mode, and API. Processing is cloud-based, and no independent quality comparison was available. [LALAL.AI](https://www.lalal.ai/blog/lynx-voice-isolation-neural-network/) \u00b7 [Independent coverage](https://www.prosoundweb.com/lalal-ai-launches-new-lynx-neural-network-for-speech-denoising/) \u00b7 July 14\n- **GPT-Red** is OpenAI\u2019s automated system for finding prompt-injection weaknesses before agent deployment. OpenAI\u2019s reported improvement is an internal measurement, but the release highlights a practical risk for agents connected to footage, transcripts, storage, publishing systems, and credentials. [OpenAI](https://openai.com/index/unlocking-self-improvement-gpt-red/) \u00b7 July 15\n\n---\n\n## Voices This Week\n\n### Connie He and M\u00e1rcia Mayer on Rough Animation as Direction\n\nConnie He and M\u00e1rcia Mayer described a production in which storyboards, concept art, character designs, and rough animation remained the source of truth. Text alone did not carry timing, posing, finger movement, camera reveals, or framing precisely enough, so animators blocked motion in familiar tools and used localized refinement to revise small regions without rebuilding complete shots.\n\nTheir account keeps artist-defined material, dailies, and repeated shot review at the center of the process. The generative model changes how the material is rendered, while the production\u2019s intent remains encoded in visual direction that artists can inspect.\n\n**Source:** [Connie He and M\u00e1rcia Mayer \u2014 July production discussion](https://themakingof.substack.com/p/filmmaker-connie-he-google-deepminds) \u00b7 [Google DeepMind \u2014 production account](https://blog.google/innovation-and-ai/models-and-research/google-deepmind/dear-upstairs-neighbors/) \u00b7 July 15, 2026 discussion; January 2026 production account\n\n### Nathaniel Whittemore on the Agent Harness\n\nNathaniel Whittemore argued that attention is shifting from the isolated model toward the harness around it: tools, permissions, memory, workflow rules, evaluation, and recovery. In this view, the model performs an inner loop of work while people set goals, review failures, and improve the system around it.\n\nFor media operations, that frame connects directly to intake, logging, transcription, captioning, quality assurance, publishing, and archives. The observation is commentary rather than a measured forecast, but it matches this week\u2019s releases that place models behind repeatable graphs, access controls, and revision steps.\n\n**Source:** [Nathaniel Whittemore \u2014 July 15 discussion](https://aidailybrief.ai/e/2026-07-15) \u00b7 July 15, 2026\n\n### Terrence O\u2019Brien on Rights Controls at Export\n\nTerrence O\u2019Brien reported that upload safeguards in an AI music service did not necessarily resolve the rights status of the final output. His testing found that small changes to an input could weaken matching controls, and a paid commercial plan did not automatically remove underlying rights or distribution risk.\n\nProduct behavior can change, and the legal questions remain unsettled. The durable production point is narrower: permission at input and permission at export are separate checks, especially when music may enter distribution and automated identification systems.\n\n**Source:** [Terrence O\u2019Brien \u2014 July 14 discussion](https://www.theverge.com/podcast/965581/suno-ai-music-vergecast) \u00b7 [Supporting investigation](https://www.theverge.com/ai-artificial-intelligence/906896/sunos-copyright-ai-music-covers) \u00b7 July 14, 2026\n\n---\n\n## Common Threads\n\n### Editable Deliverables Are Becoming the Product\n\nSmartRoto returns splines, Dubbing 2.0 isolates correctable segments, and Aiode exports separate stems and alternate takes. In each case, usefulness depends less on a convincing first preview and more on whether the result can enter the next production step without losing control.\n\n### Control Is Becoming Continuous and Multimodal\n\nLucy 2.5 accepts text and reference images while a stream continues. Connie He and M\u00e1rcia Mayer described rough animation carrying timing and performance more precisely than prose. Prompts remain useful, but references, motion, masks, timelines, and live direction are becoming part of the control surface.\n\n### Rights and Provenance Are Moving Inside the Workflow\n\nAiode places licensing, performer participation, and revenue sharing at the model level. Griptape records provenance and restricts model access. Google Vids adds SynthID to generated clips. Terrence O\u2019Brien\u2019s reporting shows why input checks alone do not settle final-output rights.\n\n### Evaluation Is Becoming Production-Specific\n\nMultiRef-Compass checks identity binding, sound-source assignment, and reference consistency. Those are different questions from whether viewers prefer one clip over another. \u201cBest model\u201d increasingly depends on the exact workflow and failure mode being measured.\n\n### The Harness Remains Part of Media Quality\n\nPermissions, versioning, model routing, storage, networking, evaluation, and recovery surround the model. Griptape and VideoChat3 approach this from different directions, but both show that reliable media systems depend on infrastructure as well as model capability.\n\n### The General-Model Frontier Is Widening\n\nKimi K3 and Qwen3.8-Max-Preview arrived within days of one another with trillion-parameter scale and multimodal claims. Hosted access, promised weights, hardware requirements, evaluation settings, and independent testing all differ. The pace is clear; a stable ranking is not.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Rough Animation as a Control Language\n\nBlocked motion can communicate timing, gesture, framing, camera movement, and performance more precisely than an expanding written prompt. Existing animation and previsualization skills therefore remain relevant as inputs to generative systems.\n\n### The Live Stream as an Editable Canvas\n\nLucy 2.5 keeps a scene responsive during playback rather than fixing it after a render. Vidu S1 researchers separately report continuous video responding to spoken direction, though their performance results are author-reported and the system remains an early preprint. Together, the work points toward live feeds, virtual sets, and interactive events as ongoing generation surfaces.\n\n**Source:** [Decart \u2014 Lucy 2.5](https://decart.ai/publications/lucy-2-5-raising-the-bar-for-live-ai) \u00b7 [Vidu S1 paper](https://huggingface.co/papers/2607.03118) \u00b7 [Vidu S1 code](https://github.com/shengshu-ai/Vidu-S1)\n\n### Multi-Reference Binding as Quality Assurance\n\nReference-heavy work needs checks beyond visual appeal and lip synchronization. MultiRef-Compass frames identity, attribute, action, and sound binding as separate review targets, turning a common generation failure into a clearer quality-assurance discipline.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 8: Separate Drafting From Review\n\nUse one pass to create and a second pass to critique. Drafting rewards momentum and coverage; review rewards skepticism and precision. Asking for both at once can produce a polished-looking answer that has not been checked systematically.\n\nFor an AV task:\n\n1. **Draft first.** Ask for the edit notes, transcript summary, metadata, equipment brief, caption file, or production document without requesting critique in the same instruction.\n2. **Start a review pass.** Provide the draft again and ask the AI to identify factual errors, missing material, formatting problems, preservation-rule failures, and unsupported certainty.\n3. **Use a fixed checklist.** Include names, dates, timecodes, source links, technical specifications, required sections, audience fit, and items that must remain unchanged.\n4. **Request findings before revision.** Have the system list each issue and its evidence before producing a corrected version.\n5. **Keep both passes.** The draft, findings, and revision create a clearer audit trail than a single polished response.\n\nA reusable review instruction:\n\n```text\nReview this draft. Do not rewrite it yet.\n\nCheck:\n- Facts against the supplied sources\n- Missing required information\n- Names, dates, numbers, and timecodes\n- Formatting and section requirements\n- Material that must remain unchanged\n- Claims stated with more certainty than the evidence supports\n\nList each issue, explain why it matters, and cite the relevant source.\nWait for approval before revising.\n```\n\nThis separation is especially useful when an AI-produced result will become a production record, client-facing document, caption file, edit decision, or published asset.\n\nNext week, Back to Basics Week 9: **Turn recurring review criteria into a reusable checklist.**\n\n---\n\n## Sources\n\n1. [Foundry \u2014 SmartRoto](https://www.foundry.com/products/nuke-family/smartroto) \u2014 July 17, 2026 \u2014 features, pricing, licensing, hardware, local inference, training-data statement, and vendor speed claim\n2. [fxguide \u2014 SmartRoto reporting](https://www.fxguide.com/fxfeatured/foundrys-smartroto-ai-assisted-roto-that-aims-to-work-the-way-you-do/) \u2014 July 17, 2026 \u2014 independent workflow reporting and qualification of the speed claim\n3. [Decart \u2014 Lucy 2.5 release](https://decart.ai/publications/lucy-2-5-raising-the-bar-for-live-ai) \u2014 July 16, 2026 \u2014 live editing capabilities and vendor-reported 1080p/30 FPS claim\n4. [Decart \u2014 Lucy 2.5 API documentation](https://docs.platform.decart.ai/models/realtime/lucy-2.5) \u2014 accessed July 19, 2026 \u2014 current 1280\u00d7720 API specification\n5. [MultiRef-Compass paper](https://arxiv.org/abs/2607.14189) \u2014 July 15, 2026 \u2014 benchmark design, reported results, sample reductions, and limitations\n6. [MultiRef-Compass code](https://github.com/zxhhh0201/MultiRef-Compass) \u2014 July 15, 2026 \u2014 accompanying implementation\n7. [Synthesia \u2014 Dubbing 2.0](https://www.synthesia.io/post/introducing-dubbing-2-0) \u2014 July 15, 2026 \u2014 workflow, availability, language count, and vendor quality claim\n8. [BandLab Technologies \u2014 Aiode acquisition](https://bandlabtechnologies.com/news/bandlab-technologies-announces-acquisition-ai-powered-digital-music-studio-aiode/) \u2014 July 15, 2026 \u2014 acquisition and continuing beta\n9. [Aiode \u2014 product details](https://aiode.com/product/) \u2014 accessed July 19, 2026 \u2014 licensed-data statement, musician participation, direction controls, and stem formats\n10. [Moonshot AI \u2014 Kimi K3](https://www.kimi.com/blog/kimi-k3) \u2014 July 16, 2026 \u2014 architecture, multimodal inputs, context, availability schedule, and vendor demonstrations\n11. [Kimi API documentation](https://platform.kimi.ai/docs/guide/kimi-k3-quickstart) \u2014 accessed July 19, 2026 \u2014 hosted access and API pricing\n12. [VentureBeat \u2014 Kimi K3 launch reporting](https://venturebeat.com/technology/chinas-moonshot-ai-releases-kimi-k3-the-largest-open-source-model-ever-rivaling-top-u-s-systems) \u2014 July 16, 2026 \u2014 independent launch context and early evaluation nuance\n13. [South China Morning Post \u2014 Qwen3.8 announcement reporting](https://www.scmp.com/tech/article/3361119/alibaba-says-newest-qwen-ai-model-second-only-anthropics-claude-fable-5) \u2014 July 19, 2026 \u2014 late-breaking status, reported scale, preview channels, promised weights, and Alibaba\u2019s ranking claim\n14. [Foundry \u2014 Griptape](https://www.foundry.com/products/griptape) \u2014 July 17, 2026 \u2014 orchestration, permissions, provenance, deployment, and licensing caveat\n15. [Animation World Network \u2014 Griptape reporting](https://www.awn.com/news/foundry-launches-griptape-enterprise-secure-ai-accelerated-vfx-workflows) \u2014 July 17, 2026 \u2014 independent launch coverage\n16. [Google Workspace \u2014 Gemini Omni in Vids](https://workspace.google.com/blog/product-announcements/introducing-gemini-omni-flash-in-google-vids) \u2014 July 16, 2026 \u2014 editing, avatars, availability, controls, and SynthID\n17. [The Verge \u2014 Google Vids reporting](https://www.theverge.com/ai-artificial-intelligence/966644/google-vids-will-now-let-you-generate-ai-videos-of-yourself) \u2014 July 17, 2026 \u2014 independent rollout context\n18. [Google \u2014 Gemini Notebook](https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/) \u2014 July 16, 2026 \u2014 rebrand and source-to-media positioning\n19. [VideoChat3 paper](https://arxiv.org/abs/2607.14935) \u2014 July 16, 2026 \u2014 architecture, compression, author-reported evaluations, and hardware\n20. [VideoChat3 code](https://github.com/MCG-NJU/VideoChat3) \u2014 July 16, 2026 \u2014 available implementation and release status\n21. [LALAL.AI \u2014 Lynx](https://www.lalal.ai/blog/lynx-voice-isolation-neural-network/) \u2014 July 14, 2026 \u2014 product capabilities, availability, and stated limitations\n22. [ProSoundWeb \u2014 Lynx reporting](https://www.prosoundweb.com/lalal-ai-launches-new-lynx-neural-network-for-speech-denoising/) \u2014 July 14, 2026 \u2014 independent launch coverage\n23. [OpenAI \u2014 GPT-Red](https://openai.com/index/unlocking-self-improvement-gpt-red/) \u2014 July 15, 2026 \u2014 agent-security system and internal evaluation\n24. [Connie He and M\u00e1rcia Mayer \u2014 July production discussion](https://themakingof.substack.com/p/filmmaker-connie-he-google-deepminds) \u2014 July 15, 2026 \u2014 current discussion of artist-led production methods\n25. [Google DeepMind \u2014 production account](https://blog.google/innovation-and-ai/models-and-research/google-deepmind/dear-upstairs-neighbors/) \u2014 January 2026 \u2014 storyboards, rough animation, localized refinement, and production review\n26. [Nathaniel Whittemore \u2014 agent-harness discussion](https://aidailybrief.ai/e/2026-07-15) \u2014 July 15, 2026 \u2014 commentary on tools, permissions, memory, evaluation, and recovery\n27. [Terrence O\u2019Brien \u2014 rights-controls discussion](https://www.theverge.com/podcast/965581/suno-ai-music-vergecast) \u2014 July 14, 2026 \u2014 reported observations about input safeguards and output rights\n28. [The Verge \u2014 supporting AI music investigation](https://www.theverge.com/ai-artificial-intelligence/906896/sunos-copyright-ai-music-covers) \u2014 July 2026 \u2014 supporting tests and rights context\n29. [Vidu S1 paper](https://huggingface.co/papers/2607.03118) \u2014 July 11, 2026 \u2014 author-reported continuous video control\n30. [Vidu S1 code](https://github.com/shengshu-ai/Vidu-S1) \u2014 July 11, 2026 \u2014 accompanying implementation\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of July 17, 2026\n\n> **AI media tools are moving from impressive output toward correctable production objects.** SmartRoto returns editable splines. Lucy 2.5 keeps a live video stream open to direction. MultiRef-Compass tests whether people, objects, actions, and sounds remain correctly connected. Dubbing 2.0 allows segment-level correction, and Aiode produces editable stems from licensed recordings. Kimi K3 and the late-breaking Qwen3.8-Max-Preview add a broader reminder: the general-model frontier is widening faster than launch-day rankings can settle.\n\n---\n\n## The Big Story\n\n### SmartRoto Produces Editable Splines, Not a Flat Mask\n\nFoundry released **SmartRoto** for Nuke on July 17. An artist creates roto keyframes, and the plugin propagates the shape through the shot while preserving an editable spline.\n\nThat is the practical difference from a flat AI mask. A compositor can adjust points, preserve artist-created keyframes, and continue working inside the existing Roto node.\n\nSmartRoto costs:\n\n- **$499 per year** at the introductory price\n- **$599 per year** at the regular price\n- A separate **Nuke-family license** is also required\n\nInference runs locally. Foundry says the training data is licensed and customer footage is not transmitted for processing. The plugin requires Nuke 16.1 or later, and Foundry recommends more than 8GB of VRAM.\n\nFoundry advertises roto work that is **up to four times faster**. fxguide\u2019s independent reporting adds an important qualification: Foundry\u2019s testing lead said **roughly two times faster was the more consistent result**, while four times was the high end. These remain vendor test figures rather than a broad production benchmark.\n\nThe larger point is the deliverable. SmartRoto uses AI to create something an artist can inspect and correct inside a familiar professional workflow.\n\n**Source:** [Foundry](https://www.foundry.com/products/nuke-family/smartroto) \u00b7 [fxguide](https://www.fxguide.com/fxfeatured/foundrys-smartroto-ai-assisted-roto-that-aims-to-work-the-way-you-do/) \u00b7 July 17, 2026\n\n---\n\n## Other Stories\n\n### Lucy 2.5 Edits Video While It Streams\n\nDecart\u2019s **Lucy 2.5** accepts text and reference images while a video stream continues. It can replace a subject, add or remove objects, change an environment, and keep edits active over time.\n\nDecart\u2019s release page says **1080p at 30 FPS**, but the current API documentation lists **1280\u00d7720**. No independent latency, consistency, or quality benchmark was available during the research window.\n\nThe interaction is the main story: the image remains responsive during playback instead of becoming fixed after a render.\n\n**Source:** [Decart release](https://decart.ai/publications/lucy-2-5-raising-the-bar-for-live-ai) \u00b7 [API documentation](https://docs.platform.decart.ai/models/realtime/lucy-2.5) \u00b7 July 16, 2026\n\n### MultiRef-Compass Measures Reference Correctness\n\nThe **MultiRef-Compass** benchmark evaluates eight audio-video systems across **350 curated samples**. Its four dimensions are basic quality, reference consistency, audio-visual consistency, and instruction following.\n\nThe authors reported Gemini Omni leading visual quality and lip sync, while Kling narrowly led entity fidelity. The comparison has important limits: safety filters reduced the available samples for two systems, some metrics use another model as a judge, and there has been no independent replication.\n\nThe useful idea is to review whether the correct face, object, action, voice, and sound remain attached to one another\u2014not only whether the clip looks polished.\n\n**Source:** [Paper](https://arxiv.org/abs/2607.14189) \u00b7 [Code](https://github.com/zxhhh0201/MultiRef-Compass) \u00b7 July 15, 2026\n\n### Dubbing 2.0 Allows Segment-Level Correction\n\n**Synthesia Dubbing 2.0** adds revised lip sync, voice, translation, glossary support, and timing preservation across more than 130 languages.\n\nEditors can review the transcript and translation, then regenerate a failed segment without rerendering the full video. The service is live for all customers, while Enterprise plans unlock the complete editing workflow and unlimited dubbing.\n\nSynthesia\u2019s description of a publishable first pass is a vendor claim. No blind comparison, numerical error rate, or independent evaluation was supplied.\n\n**Source:** [Synthesia](https://www.synthesia.io/post/introducing-dubbing-2-0) \u00b7 July 15, 2026\n\n### BandLab Acquires Aiode\n\nBandLab Technologies acquired **Aiode**, whose standalone web and desktop beta will continue.\n\nAiode supports section-level direction, alternate takes, and separate **48kHz/24-bit stereo WAV stems**. The company says its training recordings are licensed and traceable, participating musicians help create individual models, and those musicians receive revenue share.\n\nThose are company statements. Revenue-share percentages and acquisition terms were not disclosed, and several digital-audio-workstation features remain planned.\n\n**Source:** [BandLab Technologies](https://bandlabtechnologies.com/news/bandlab-technologies-announces-acquisition-ai-powered-digital-music-studio-aiode/) \u00b7 [Aiode](https://aiode.com/product/) \u00b7 July 15, 2026\n\n---\n\n## Frontier Watch\n\n### Kimi K3\n\nMoonshot AI launched **Kimi K3** on July 16 with:\n\n- **2.8 trillion total parameters**\n- **16 of 896 experts active** for each token\n- Native image and video input\n- A **one-million-token context window**\n\nKimi K3 is hosted now through Kimi products and the API. Full weights are **scheduled for July 27** and were not downloadable during this edition\u2019s research window.\n\nAPI pricing is **$0.30 per million cached input tokens, $3 per million fresh input tokens, and $15 per million output tokens**.\n\nKimi K3 is an understanding and agent model, **not a native video generator**. Moonshot showed it examining footage, selecting clips, creating motion-graphics code, making cuts, synchronizing edits to beats, processing audio, and revising through tools. That demonstration is vendor-reported.\n\nThe parameter count shows scale, not proof of quality. Evaluation results change with hardware, harnesses, reasoning effort, and fallback behavior, so launch-day rankings remain unsettled.\n\n**Source:** [Moonshot AI](https://www.kimi.com/blog/kimi-k3) \u00b7 [API documentation](https://platform.kimi.ai/docs/guide/kimi-k3-quickstart) \u00b7 [Independent launch reporting](https://venturebeat.com/technology/chinas-moonshot-ai-releases-kimi-k3-the-largest-open-source-model-ever-rivaling-top-u-s-systems) \u00b7 July 16, 2026\n\n### Qwen3.8-Max-Preview\n\nAlibaba officially announced **Qwen3.8-Max-Preview** on **July 19**, two days outside the newsletter\u2019s research window.\n\nAlibaba reports **2.4 trillion parameters** and multimodal capability. Preview access is available through Token Plan, Qoder, and QoderWork. Open weights are promised, but no release date has been published.\n\nAlibaba says the model is \u201csecond only to Fable 5.\u201d That vendor claim did not have independent validation at announcement. As with Kimi K3, scale and a launch-day ranking do not establish production quality.\n\n**Source:** [South China Morning Post](https://www.scmp.com/tech/article/3361119/alibaba-says-newest-qwen-ai-model-second-only-anthropics-claude-fable-5) \u00b7 July 19, 2026 \u00b7 late-breaking\n\n---\n\n## Quick Hits\n\n- **Griptape Enterprise** adds permissions, versioning, provenance records, and private deployment around multi-model media workflows. Foundry assigns customers responsibility for verifying the rights terms of connected models. [Source](https://www.foundry.com/products/griptape) \u00b7 July 17\n- **Google Vids** added Gemini Omni editing and personal avatars for eligible paid accounts. This is a partial repeat of earlier Omni coverage; the Vids integration is new. Generated clips receive SynthID. [Source](https://workspace.google.com/blog/product-announcements/introducing-gemini-omni-flash-in-google-vids) \u00b7 July 16\n- **Gemini Notebook** is the new name for NotebookLM. Google is positioning it as a broader source-to-audio, video, and interactive workspace; this is primarily a rebrand. [Source](https://blog.google/innovation-and-ai/products/gemini-notebook/notebooklm-gemini-notebook/) \u00b7 July 16\n- **VideoChat3** is a 4-billion-parameter long-video understanding model with 16-times spatiotemporal compression. Its benchmark results are author-reported. [Source](https://arxiv.org/abs/2607.14935) \u00b7 July 16\n- **LALAL.AI Lynx** isolates dialogue from surrounding sound. It uses cloud processing, and no independent quality comparison was available. [Source](https://www.lalal.ai/blog/lynx-voice-isolation-neural-network/) \u00b7 July 14\n- **GPT-Red** searches for prompt-injection weaknesses in connected agents. OpenAI\u2019s performance claim is internally measured. [Source](https://openai.com/index/unlocking-self-improvement-gpt-red/) \u00b7 July 15\n\n---\n\n## Voices This Week\n\n- **Connie He and M\u00e1rcia Mayer** described rough animation, storyboards, and artist-defined source material carrying timing and framing more precisely than text alone. Localized refinement and repeated shot review remained part of the process. [Discussion](https://themakingof.substack.com/p/filmmaker-connie-he-google-deepminds) \u00b7 [Production account](https://blog.google/innovation-and-ai/models-and-research/google-deepmind/dear-upstairs-neighbors/)\n- **Nathaniel Whittemore** emphasized the agent harness around a model: tools, permissions, memory, evaluation, workflow rules, and recovery. The idea is commentary, not a measured forecast. [Discussion](https://aidailybrief.ai/e/2026-07-15)\n- **Terrence O\u2019Brien** reported that input safeguards and a paid commercial plan did not necessarily resolve final-output rights and distribution risk. Product behavior can change, and the legal questions remain unsettled. [Discussion](https://www.theverge.com/podcast/965581/suno-ai-music-vergecast) \u00b7 [Supporting investigation](https://www.theverge.com/ai-artificial-intelligence/906896/sunos-copyright-ai-music-covers)\n\n---\n\n## Common Threads\n\n### Editable Deliverables\n\nSmartRoto returns splines, Dubbing 2.0 isolates correctable segments, and Aiode exports separate stems. The useful output is an artifact that fits the next production step.\n\n### Continuous, Multimodal Control\n\nLucy 2.5 combines a live stream with text and image references. Rough animation can carry timing, pose, framing, and performance. The prompt box is becoming one part of a larger control surface.\n\n### Rights and Provenance Inside the Workflow\n\nAiode links models to licensed recordings and participating musicians. Griptape records provenance and controls model access. Google Vids adds SynthID. Rights review is moving closer to model selection, generation, and export.\n\n### Production-Specific Evaluation\n\nMultiRef-Compass tests identity binding and sound-source assignment. A general preference ranking cannot answer every production question.\n\n### Harness and Infrastructure\n\nPermissions, storage, networking, versioning, evaluation, and recovery affect whether a model can perform reliably inside a real workflow.\n\n### A Widening Frontier\n\nKimi K3 and Qwen3.8-Max-Preview arrived within days with trillion-parameter scale and multimodal claims. Their access, weights, hardware needs, and evaluation conditions differ, so the pace is clearer than the ranking.\n\n---\n\n## Novel Ideas Worth Watching\n\n- **Rough animation as a control language:** blocked motion can carry timing, gesture, camera movement, and performance more precisely than a longer written prompt.\n- **The live stream as an editable canvas:** Lucy 2.5 keeps generated video responsive while it plays.\n- **Multi-reference binding as quality assurance:** identity, attribute, action, voice, and sound can be checked as separate review targets.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 8: Separate Drafting From Review\n\nUse one pass to create and a second pass to critique.\n\n1. Ask for the first draft without requesting criticism in the same instruction.\n2. Begin a separate review pass.\n3. Check facts, omissions, names, dates, numbers, timecodes, formatting, preservation rules, and unsupported certainty.\n4. Ask for a list of findings before requesting a rewrite.\n5. Keep the draft, findings, and revision as an audit trail.\n\nUse this review instruction:\n\n```text\nReview this draft. Do not rewrite it yet.\n\nCheck the facts against the supplied sources.\nIdentify missing information and formatting problems.\nVerify names, dates, numbers, and timecodes.\nFlag anything stated with more certainty than the evidence supports.\n\nList each issue and cite the relevant source.\nWait for approval before revising.\n```\n\nThe separate pass is especially useful for edit notes, transcript summaries, captions, metadata, production documents, and client-facing material.\n\nNext week, Back to Basics Week 9: **Turn recurring review criteria into a reusable checklist.**\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
