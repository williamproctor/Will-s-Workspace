      slug: "2026-09-28",
      editionTitle: "Week of September 28, 2026",
      editionMd: "# Monday Signal \u2014 Week of September 28, 2026\n\n> **Amazon locked Meta's Muse agent out of its store on Sunday night; by Tuesday, Shopify, PayPal, and Expedia had signed on to let it shop and check out, and on Wednesday Amazon opened Seller Central to Anthropic's Claude, for sellers and one approved action at a time.** Google switched on AI Mode checkout by default for eligible Shopify stores, and Shopify's own help page says Google Analytics won't see those orders. Comscore found ChatGPT's share of AI prompts fell from 70% to 50% in six months, YouTube announced brand-deal tools for Studio, and the UK proposed putting AI assistants on Google's choice screens. On the feed, a YouTuber found Kalshi running his video as an ad with his face swapped for a white man's, two weeks after Kalshi's head of growth posted that the brand had gone \"all-in on unmistakably human creativity.\"\n\n---\n\n## The Conversation\n\n### Kalshi's AI ad copied a YouTuber's video and swapped his face for a white man's\n\nOn Wednesday, September 23, Elliot Choy posted two stills side by side on X. One came from his September 2025 video about moving into a New York apartment. The other was a Kalshi ad that closely copied it, down to the computer and the books in the background, with a white man where Choy had been: \"i guess kalshi saw this and thought they should steal my video, turn me into a white dude, and run it as an ad.\" He found it because YouTube served it to him, per Futurism, and NPR's Bobby Allyn confirmed the same day that the ad was real. Kalshi told Business Insider the ad was about four months old and made by an agency that supplied the video, said it no longer uses AI-generated content depicting people, and declined to name the agency; a rep told Allyn that Kalshi is \"reviewing our relationship with\" it. Choy wasn't the first. Toronto creator Pushpek Sidhu posted in June that a Kalshi ad had replicated his World Cup video, script and gestures included, with a white man in his place. \"They could easily pay me a little bit,\" he told BI.\n\nTwo weeks earlier, on September 9, Kalshi's head of growth, Keaton Inglis, posted on LinkedIn that Kalshi had been \"the first brand to run a 100% AI-generated ad on broadcast\" and had since \"pivoted in the opposite direction: all-in on unmistakably human creativity.\" By Kalshi's account, the ad Choy found was made months before that post, and it was still being served two weeks after it.\n\n**Comment window:** open. The angle to post: \"the agency made it\" left the blame with Kalshi, because Kalshi is the name in Choy's post. If a vendor can generate a person, the contract has to say whose footage and whose face it may use, and licensing is the cheap option; Mick Feldman of the influencer agency The Now told BI that licensing an existing creator video typically costs about a quarter of making a new one.\n\n**Source:** [Business Insider](https://www.businessinsider.com/kalshi-in-hot-water-over-race-swapping-ai-ads-2026-9) \u00b7 [The Verge, with Allyn's confirmation](https://www.theverge.com/ai-artificial-intelligence/1000309/youtuber-elliot-choy-says-an-ai-kalshi-ad-stole-one-of-his-videos-and-changed-his-race) \u00b7 [Futurism](https://futurism.com/artificial-intelligence/kalshi-admits-random-guy-video-ai-race-swap-ad) \u00b7 [Inglis's LinkedIn post](https://www.linkedin.com/posts/keatoninglis_why-kalshi-dropped-generative-ai-in-favor-activity-7503564502940925952-BmHz) \u00b7 September 9\u201324, 2026\n\n### Google switched on AI Mode checkout for Shopify stores, and Google Analytics won't see the orders\n\nThe email started landing on Tuesday, September 22: \"Your Shopify store was matched to your Merchant Center, enabling native checkout on Google AI Mode and Gemini.\" The next lines settled who had opted in: \"Eligible products are automatically included. There's nothing for you to set up.\" Menachem Ani, founder of JXT, posted his on X, and when Smarter Ecommerce's Mike Ryan asked whether anything had to be switched on, Ani answered, \"No action on our end.\" Nic McDonough posted the checkout live that morning. Google has run checkout on its Universal Commerce Protocol for a limited set of merchants since February and widened it on Friday, September 18; per Search Engine Land, the Shopify version covers US merchants selling to US customers with a valid Merchant Center account. For Shopify stores the switch sits under Sales channels > Agentic; turning it off keeps products discoverable in AI Mode and Gemini and sends buyers to the store's own checkout.\n\nOn reporting, Shopify's help page says, \"Google Analytics and custom pixels won't fire in Google AI Mode and Gemini's direct checkout.\" Only two server-to-server events come through, checkout started and checkout completed. Orders land in the Shopify admin with channel attribution, so the revenue shows up in Shopify and never reaches GA4 or the store's client-side pixels. The program behind it, Shopify's agentic storefronts, is \"active by default for eligible stores\" across ChatGPT, Microsoft Copilot, and Meta surfaces such as Muse as well.\n\n**Comment window:** open through holiday code freezes. Default-on is how the AI checkout race is being run, so the useful post is an audit: which AI channels have direct checkout switched on for each store, and where those orders show up in reporting.\n\n**Source:** [Search Engine Roundtable, with the email](https://www.seroundtable.com/google-native-checkout-emails-42140.html) \u00b7 [Search Engine Land, with the Ryan\u2013Ani exchange](https://searchengineland.com/google-opens-native-ai-checkout-to-eligible-shopify-merchants-490407) \u00b7 [Shopify's help page on AI Mode and Gemini](https://help.shopify.com/en/manual/online-sales-channels/agentic-storefronts/google) \u00b7 [Shopify on agentic storefronts](https://help.shopify.com/en/manual/online-sales-channels/agentic-storefronts) \u00b7 [Search Engine Watch](https://searchenginewatch.com/google-native-checkout-now-available-to-more-users/) \u00b7 September 18\u201323, 2026\n\n### AI Overviews started showing more links, and some of them open AI Mode\n\nOn Monday, September 21, Malte Landwehr of Peec AI, an AI search analytics company, posted a chart on X: \"Google massively increased the number of external links within AI Overview answers.\" In Peec's sample, the share of AI Overviews with an external link inside the answer text sat near zero from August 25, stepped up on September 11, and reached 26.2% on September 20. Earlier the same day, Gagan Ghotra posted an 18-second recording of a different link: bold, underlined text inside an AI Overview that opened a query in AI Mode, with no website at the other end. \"Another day \u2013 Another Tactic! from Google to push users from usual search results to AI Mode,\" he wrote. Barry Schwartz shared Peec's chart with a caveat (\"This doesn't 'feel' right to me\") and a disclosure of his small investment in the company.\n\nSearch Engine Journal's Matt Southern checked both posts against Google's documentation. Search Console counts a click on an external link in an AI Overview as a click, but \"if a link is a query refinement link, clicks and impressions are not counted for that link,\" and Google's help pages don't say which bucket Ghotra's AI Mode links fall into. Peec's chart counts links in answers and doesn't publish its sample size, markets, or devices. Landwehr's guess, in the replies, is that \"over time more and more links will become links redirecting users to AI Mode.\"\n\n**Comment window:** open while the chart circulates. The practical post: a link count is inventory, so check where the links go before reporting a win. An AI Mode link keeps the searcher inside Google and may never register in Search Console.\n\n**Source:** [Search Engine Journal, with both posts](https://www.searchenginejournal.com/google-ai-overviews-have-more-links-but-not-all-reach-the-web/590762/) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-ai-overviews-more-external-links-42135.html) \u00b7 September 21\u201325, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and stages where the week's arguments actually happened.\n\n- **Tobi L\u00fctke, CEO, Shopify** (X, September 21): \"We are excited to announce we are partnering deeply with Muse to enable agentic checkout with Shop Pay on all Shopify stores, offering people an easy and delightful way to shop and check out with Muse.\" [Via PYMNTS](https://www.pymnts.com/commerce/ecommerce/2026/shopify-brings-shop-pay-checkout-solution-to-metas-muse-ai-agent/)\n- **Amazon spokesperson** (statement, September 20): \"We think it's fairly straightforward that third-party applications that offer to make purchases on behalf of customers from other businesses should operate openly and respect service provider decisions about whether or not to participate.\" [GeekWire](https://www.geekwire.com/2026/amazon-blocks-metas-muse-ai-assistant-in-new-standoff-over-agentic-shopping/)\n- **Mary Beth Westmoreland, VP of Worldwide Selling Partner Experience, Amazon** (interview, September 23): \"Our vision was that they would never have to log into Seller Central. We would just bring it to them where they work.\" [GeekWire](https://www.geekwire.com/2026/amazon-opens-its-seller-tools-to-outside-ai-agents-starting-with-anthropics-claude/)\n- **Hans Overeem, head of payments, ING** (joint bank release, September 22): \"As AI agents enter the payments ecosystem, customers must remain in control, understand what the agent is doing, and have confidence that their data and payments are secure.\" [The release](https://newsroom.bankofamerica.com/content/newsroom/press-releases/2026/09/global-banks-collaborate-on-principles-for-trusted-agentic-comme.html)\n- **Elliot Choy, YouTuber** (X, September 23): \"i guess kalshi saw this and thought they should steal my video, turn me into a white dude, and run it as an ad\" [Via Business Insider](https://www.businessinsider.com/kalshi-in-hot-water-over-race-swapping-ai-ads-2026-9)\n- **Keaton Inglis, head of growth, Kalshi** (LinkedIn, September 9): \"We were the first brand to run a 100% AI-generated ad on broadcast. Then, while every other brand spent the next quarter figuring out how to make AI ads, we pivoted in the opposite direction: all-in on unmistakably human creativity.\" [The post](https://www.linkedin.com/posts/keatoninglis_why-kalshi-dropped-generative-ai-in-favor-activity-7503564502940925952-BmHz)\n- **A brand-side marketer** (Digiday's AI Marketing Strategies town hall, September 24): \"It's like there's a growing acceptance of 'good enough \u2014 go.' I've seen lots of creative executions from our agencies, and our logo isn't right.\" [Digiday](https://digiday.com/marketing/marketers-bemoan-the-culture-of-good-enough-go-as-standards-fall-amid-the-ai-bubble/)\n- **Gagan Ghotra** (X, September 21): \"in AI Overviews answers Google is now testing showing anchor links which instead of taking to a webpage takes to AI Mode.\" [Via Search Engine Journal](https://www.searchenginejournal.com/google-ai-overviews-have-more-links-but-not-all-reach-the-web/590762/)\n- **Sarah Cardell, CEO, Competition and Markets Authority** (September 23): \"We've listened carefully to feedback and are responding quickly to the rise of AI assistants, which people are increasingly using as their search service, but aren't included on Google's choice screens.\" [GOV.UK](https://www.gov.uk/government/news/cma-strengthens-proposals-allowing-people-choice-over-their-search-service)\n- **Isabel Perry, global EVP of strategy, DEPT** (Digiday's AI Marketing Strategies, September 24): \"We are drowning in measurement\u2026 instead of just measuring numbers, we need to measure gaps.\" [Digiday](https://digiday.com/marketing/marketers-bemoan-the-culture-of-good-enough-go-as-standards-fall-amid-the-ai-bubble/)\n\n---\n\n## This Week in Marketing AI\n\n### Amazon locked Muse out; Shopify, PayPal, and Expedia plugged it in\n\nMeta launched Muse on September 8 as a personal agent with its own browser, and it caught on fast. It overtook ChatGPT as the top free iPhone app in the US on Friday, September 18, and Sensor Tower counted more than 2.5 million downloads by Monday, per CNBC (in their own first 13 days, ChatGPT had 3.1 million and Claude 400,000). Meta's shares rose more than 11% that Monday. On Sunday night, September 20, Amazon started showing Muse users a popup: \"Continued access by an unauthorized AI agent violates Amazon's Conditions of Use, to which our customers have agreed.\" Amazon's complaints, per GeekWire and Adweek, are that Meta never told it Muse would shop there, the agent doesn't identify itself, it appears to capture and store customer credentials, and it skips the personalization Amazon's pages are built on. Amazon asked Meta to \"remove Amazon from the experience\"; Meta says Muse \"has no visibility into people's passwords or payment methods.\"\n\nThe popup cites Amazon's Conditions of Use and makes no hacking claim. Amazon lost its preliminary injunction against Perplexity's Comet browser at the Ninth Circuit on August 4, in a ruling that the user, not the AI company, is the one accessing Amazon's computers, and GeekWire notes the ruling left claims built on contracts and terms of service open. Amazon's rule, as it put it in both of GeekWire's stories this week, is that agents should identify themselves and let the site decide whether to take part; its own Buy for Me agent works that way and lets brands opt out.\n\nShopify's Tobi L\u00fctke announced on Monday that Muse can check out with Shop Pay \"on all Shopify stores,\" and PayPal and Expedia signed on Tuesday. The same Tuesday, six banks (ASB, Bank of America, Capital One, Commonwealth Bank of Australia, ING, and NatWest) published shared principles for agent payments covering transparency, safety, privacy and data, choice, and interoperability, with implementation details promised in a second paper. On Wednesday, at its Accelerate conference, Amazon launched a plugin that lets sellers run their Amazon business from Anthropic's Claude or Amazon's Quick assistant, with the seller choosing which data it reaches and approving each action before it happens.\n\nFor brands, reach through shopping agents now depends on where they sell. Shopify says its agentic storefronts, which cover Meta surfaces such as Muse, are active by default for eligible stores, while Muse can't buy on Amazon at all. Forbes' Maureen Kerr pointed out on Saturday that Meta keeps similar control over rival AI assistants on WhatsApp, so neither company in this fight is arguing for open access in general.\n\n*Editor's note, added at publication on September 30: NBC News reported on September 29 that in its tests Muse couldn't get through at several of the country's biggest retailers, and its headline names Walmart, which Meta had announced as a partner. [NBC News](https://www.nbcnews.com/tech/tech-news/ai-agent-muse-shop-e-commerce-amazon-wal-mart-wayfair-buy-rcna599069)*\n\n**Source:** [GeekWire on the block](https://www.geekwire.com/2026/amazon-blocks-metas-muse-ai-assistant-in-new-standoff-over-agentic-shopping/) \u00b7 [Adweek](https://www.adweek.com/commerce/amazon-locks-out-metas-muse-in-agentic-shopping-standoff/) \u00b7 [Axios](https://www.axios.com/2026/09/21/amazon-meta-muse-ai-agentic-shopping) \u00b7 [CNBC on the downloads](https://www.cnbc.com/2026/09/21/meta-muse-personal-ai-agent-downloads.html) \u00b7 [CBS News on PayPal and Expedia](https://www.cbsnews.com/news/meta-ai-agent-muse-shopping/) \u00b7 [The banks' joint release](https://newsroom.bankofamerica.com/content/newsroom/press-releases/2026/09/global-banks-collaborate-on-principles-for-trusted-agentic-comme.html) \u00b7 [GeekWire on Accelerate](https://www.geekwire.com/2026/amazon-opens-its-seller-tools-to-outside-ai-agents-starting-with-anthropics-claude/) \u00b7 [Forbes](https://www.forbes.com/sites/maureenkerr/2026/09/27/metas-muse-ai-agent-tests-who-controls-digital-distribution/) \u00b7 September 20\u201327, 2026\n\n### ChatGPT's share of AI prompts fell from 70% to 50% in six months\n\nComscore's Q2 AI Intelligence Report, out Tuesday, September 22, measured prompt volume across its panel. ChatGPT's share fell from 70% in January to 50% in June; Gemini's rose from 17% to 30%, and Claude's from 2% to 11%. ChatGPT is still growing (168 million desktop conversations in June, and 99 million multiplatform visitors against 59 million a year earlier), so this is a bigger market split more ways. Reach kept climbing too: 35% of desktop users and 29% of mobile users visited an AI assistant in June, up from 25% and 12% in January 2025. On the search side, the share of Google desktop searches showing an AI Overview rose from 25.8% in July 2025 to 39.4% in June, and Bing's Copilot Search went from 11.8% to 17.3%. Paid placements are arriving inside answers: sponsored ads appeared in 6% of hotel-related AI prompts with source links in March and 24% by May.\n\n\"Brands and publishers can no longer assume that a single AI experience defines the market,\" said Smriti Sharma, Comscore's chief analytics and technology officer. For AEO programs, a visibility tracker weighted toward ChatGPT is now watching about half the prompts in Comscore's panel, while Gemini's share nearly doubled in six months.\n\n**Source:** [Comscore's release](https://www.comscore.com/Insights/Press-Releases/2026/9/Comscores-Q2-2026-AI-Intelligence-Report) \u00b7 [Digiday](https://digiday.com/media/comscore-data-shows-how-ai-discovery-is-splintering-beyond-chatgpt/) \u00b7 September 22, 2026\n\n### YouTube is putting brand deals inside Studio and likeness alerts on phones\n\nAt Made on YouTube on Wednesday, September 23, Neal Mohan pitched Studio as the place creators will land brand deals: \"YouTube Creator Partnerships helps creators get noticed by brands, while Ask Studio will soon make it easy to craft tailored responses to briefs, build proactive pitch materials, and land deals faster.\" The affiliate program expands to 35 countries by year-end, with Amazon supported internationally and product tags that localize offers to where the viewer is. Creators have run more than 40 million title and thumbnail A/B tests since 2024, per YouTube's Aparna Pappu; Studio now offers dynamic thumbnails that serve the best of three options by audience segment, and testing up to three cuts of the video itself, to see which hook holds attention, is coming soon. Viewers will be able to build home feeds from prompts (\"Witty podcasts for my daily 30-minute commute\"), and Ask YouTube is expanding into a product recommendation guide.\n\nLikeness detection is coming to the mobile app, and speaking-voice detection joins facial matching later this year. Pappu also cited YouTube's first GenAI trends report: \"72% of U.S. video posters ages 14-44 have already used AI to help them create or edit in the past year.\" Once Ask Studio's brief tools ship, a creator's reply to a brand brief may be drafted with a model's help, which makes the brief itself model input. Prompt-built feeds and a shopping guide inside Ask YouTube also pull discovery on YouTube closer to search, where titles, descriptions, and product tags do more of the work.\n\n**Source:** [Mohan's post](https://blog.youtube/news-and-events/innovation-youtube-era-made-on-viewers-creators/) \u00b7 [Pappu's post on Studio](https://blog.youtube/news-and-events/made-on-youtube-new-tools-power-creation-journey/) \u00b7 September 23, 2026\n\n### Google promised a report that shows what AI Max chose; Microsoft's is already in its API\n\nGoogle said on Wednesday, September 23, that it's building a single AI Max report showing \"what search terms triggered your ads, which creative assets the user saw, and exactly where they landed on your website,\" with details and availability \"later this year.\" The same post opened the AI Brief closed beta, where advertisers steer AI Max in their own words, to Dutch, French, German, Italian, Japanese, Portuguese, and Spanish. Parts of that view exist today: the Google Ads API's AI Max combination view pairs the query with the headline and landing page, and the search terms report has a \"Search terms and landing pages from AI Max\" option. The new report would put the whole journey in one place, and it's coming while Google moves campaigns that use Dynamic Search Ads, automatically created assets, or campaign-level broad match onto AI Max automatically, which its help page says starts this month.\n\nMicrosoft's version is live for anyone on its API. The Search Term Landing Page report ties a query to the headline that served and the final URL that got the click, and Performance Max campaigns can exclude Computers, Smartphones, or Tablets at the campaign level (at least one category has to stay eligible). Trade coverage arrived on September 24 and 25, but Microsoft's release notes list both under August, so this is catch-up coverage of shipped features. PPC leads will spend the quarter explaining what the automation did with the budget, and both platforms now offer the same kind of evidence, a view that runs from query to landing page.\n\n**Source:** [Google's post](https://blog.google/products/ads-commerce/ai-max-language-reporting-features/) \u00b7 [Search Engine Land](https://searchengineland.com/google-expands-ai-brief-and-adds-deeper-ai-max-reporting-490522) \u00b7 [Google Ads Help on AI Max reporting](https://support.google.com/google-ads/answer/16470459) \u00b7 [Microsoft's report documentation](https://learn.microsoft.com/en-us/advertising/reporting-service/searchtermlandingpagereportrequest?view=bingads-13) \u00b7 [TechWyse on the August release](https://www.techwyse.com/news/platform-updates/microsoft-ads-api-search-reporting-pmax-device-exclusions) \u00b7 September 23\u201325, 2026\n\n### The UK wants AI assistants on Google's choice screens\n\nThe Competition and Markets Authority published strengthened proposals on Wednesday, September 23. Google would have to offer Android and Chrome users a choice of search service when they first set up the phone or open Chrome, then prompt them every year to pick a default. AI assistants that meet technical and security criteria could appear on those screens, and any provider on them would have to \"fairly attribute publisher content when used.\" The CMA cited \"the growing use of new services like ChatGPT and Perplexity,\" and chief executive Sarah Cardell said AI assistants are services \"people are increasingly using as their search service, but aren't included on Google's choice screens.\" Comments close October 9, with a final decision expected by year-end. The proposal builds on the publisher opt-out from Google's AI features that the CMA imposed on June 3.\n\nFor UK campaigns, a yearly default prompt means search share can shift every year, and an assistant that wins the default on an Android phone brings its own ad products and citation rules with it.\n\n**Source:** [The CMA's announcement](https://www.gov.uk/government/news/cma-strengthens-proposals-allowing-people-choice-over-their-search-service) \u00b7 [Engadget](https://www.engadget.com/2266226/uk-competition-watchdog-wants-to-give-android-and-chrome-users-more-search-engine-choices/) \u00b7 September 23, 2026\n\n### Temu pulled its partnership ads from likely fake creators within days of Fortune's story\n\nFortune reported on Friday, September 25, that Temu largely stopped funding a network of likely fake creator accounts on Meta after Fortune's August 31 story. Online Risk Labs, a Czech nonprofit, had estimated that Temu spent up to $962 million over 16 months on partnership ads (creator posts a brand pays to boost) in the UK and EU, and judged about 73 of the 100 accounts carrying the most Temu ads to be probably fake, citing repeated handle changes and bases in Russia and China despite European targeting. By September 4, 90 of those accounts showed no Temu ads, and Temu's weekly partnership ads fell from 115,114 to 64,008. Total weekly Temu ads fell only from about 167,000 to 147,000 over the same stretch, per Shopifreaks' reading of Fortune's figures, so ads outside the partnership format rose. Neither Temu nor Meta commented.\n\nMeta has said partnership ads are on course for a $10 billion annual run rate. The format sells a creator's identity as the trust signal, and ORL's judgment rests on account signals like name changes and location, which any brand can check before boosting creator content at scale.\n\n**Source:** [Fortune, September 25](https://fortune.com/2026/09/25/temu-axed-its-1-billion-network-of-fake-accounts-on-meta/) \u00b7 [Fortune's original story](https://fortune.com/2026/08/31/temu-962-million-meta-partnership-ads-fake-creators/) \u00b7 [Online Risk Labs' report](https://socialmediatransparency.org/research/online-risk-labs-how-temu-industrialized-metas-partnership-ads-in-europe) \u00b7 [Shopifreaks](https://www.shopifreaks.com/temu-pulls-most-of-its-meta-partnership-ads-from-likely-fake-creator-accounts-after-researchers-flagged-the-network-in-august/) \u00b7 August 31\u2013September 27, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via Search Engine Roundtable's [daily recap](https://www.seroundtable.com/recap-09-25-2026-42166.html) and [weekly video recap](https://www.seroundtable.com/video-09-25-2026-42164.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/2026-09-28-ai-in-marketing-management/).*\n\n- **ChatGPT Ads reached more than 60 countries.** On Wednesday, OpenAI opened Indonesia, Malaysia, the Philippines, Singapore, Thailand, Vietnam, and Taiwan, with self-serve Ads Manager from day one and dentsu, Havas Media, Omnicom Media, Publicis Groupe, and WPP as agency partners. The ChatGPT Ads app for Shopify was scheduled to open to international merchants the same day. [MARKETECH APAC](https://marketech-apac.com/openai-brings-chatgpt-ads-to-sea-taiwan-opening-self-serve-access-to-smaller-businesses/) \u00b7 [dentsu](https://www.dentsu.com/sg/en/our-news/dentsu-named-launch-partner-for-openai-ads-in-southeast-asia-and-taiwan) \u00b7 [BetaKit on the Shopify date](https://betakit.com/shopify-becomes-openais-first-e-commerce-partner-with-chatgpt-ads-integration/)\n- **Google's September Demand Gen Drop** (Thursday): image ads on YouTube Shorts and in Gmail now open the landing page in one tap, and retail networks and dealerships can run affiliate locations as promoted pins in Google Maps. Google says, from its own data, that advertisers adding Gmail to Demand Gen see their image creatives get 40% more conversions on average at the same ROI. [Google](https://blog.google/products/ads-commerce/demand-gen-drop-september-2026/)\n- **Google's September 2026 spam update** began Thursday, global and in all languages; Google says the rollout may take up to two weeks, and SER counts it as the fourth spam update of the year. [Search Engine Roundtable](https://www.seroundtable.com/google-september-2026-spam-update-42163.html)\n- **Search and Discover:** Search Console's performance report added a multimodal search-type filter, Discover is testing a \"Dive deeper\" feature, video structured data now documents a creator property, and Google's page experience docs added Chrome UX Report ad metrics (not a ranking factor).\n- **Google Ads and local:** Local Service Ads now show the Business Profile phone number even when advertisers pick the Google Ads tracking number, so some calls bypass Ads call tracking; tROAS is locked while promotion mode is on (the ROAS tolerance stays editable); a six-month US pilot will allow gun-accessory ads; AdSense cut its identity-verification threshold to $0. Bing is testing renaming its Copilot search tab \"AI Mode.\"\n- **Ireland fined Google \u20ac403 million** on Monday over location data in Web & App Activity, Location History, and Location Accuracy between 2018 and 2020, and gave it six months to comply. The regulator found users could have been unaware their location was being used to influence them with ads. Collection may take years: the Irish Times counts about \u20ac20 million paid of the \u20ac4.5 billion the regulator has levied. [EDPB](https://www.edpb.europa.eu/news/the-irish-data-protection-commission-fines-google-403-000-000-eur-following-inquiry_en) \u00b7 [The Guardian](https://www.theguardian.com/technology/2026/sep/21/google-is-fined-more-than-400m-by-irish-regulator-over-its-use-of-location-data) \u00b7 [Irish Times](https://www.irishtimes.com/business/2026/09/22/explainer-why-it-may-take-years-for-google-to-pay-its-latest-irish-fine/)\n- **A fifth of News UK's traffic wasn't human** over the past six months, CTO Tom Jackson told a Press Gazette conference; about a third of that is blocked as malicious: \"So 6% of our traffic we're currently blocking.\" [Press Gazette](https://pressgazette.co.uk/publishers/digital-journalism/fifth-of-news-uk-website-traffic-was-non-human-in-past-six-months/)\n- **The labs' standards body has a name.** Google, OpenAI, and Anthropic plan to call it the Standards Authority for Frontier AI, or SAFA, and aim to launch it by early 2027 without government oversight, per The Information. It follows last week's confirmation that the three were coordinating. [The Verge](https://www.theverge.com/ai-artificial-intelligence/1000047/openai-anthropic-and-google-are-reportedly-launching-their-own-ai-safety-organization) \u00b7 [Bloomberg Law](https://news.bloomberglaw.com/artificial-intelligence/google-openai-anthropic-progress-standards-plan-information)\n- **Meta's new glasses skip the camera.** Ray-Ban Meta Audio, shown at Connect, costs $349 and ships October 13. [TechCrunch](https://techcrunch.com/2026/09/23/meta-introduces-camera-free-ai-glasses/)\n\n---\n\n## Common Threads\n\n### The storefront picked its agents\n\nAmazon shut out a shopper's agent and invited a seller's agent in the same week, Shopify and PayPal opened their merchant networks to Muse, and six banks wrote down the terms they want agent payments to follow. Agent access is being decided through partnerships and popups, one platform at a time.\n\n### Default-on is the launch plan\n\nGoogle's native checkout for Shopify stores is \"automatically included,\" Shopify's agentic storefronts are \"active by default for eligible stores,\" and AI Max is absorbing Dynamic Search Ads and broad-match campaigns this month. Each one leaves the marketer's decision on the opt-out screen.\n\n### The creator is the new attack surface\n\nKalshi's agency copied a creator's video and changed his face, Temu's partnership budget went to accounts Online Risk Labs judged mostly fake, and YouTube moved likeness detection onto phones. Creator ads sell a person's credibility, and this week showed how easily that person can be copied, face-swapped, or invented.\n\n### Dashboards are missing the new traffic\n\nAI Mode checkout orders never fire GA4, an AI Overview link that opens AI Mode may count as nothing in Search Console, half of AI prompts now go somewhere other than ChatGPT, and a fifth of News UK's traffic wasn't human. Isabel Perry's line at Digiday's event describes the job: \"measure gaps.\"\n\n---\n\n## Angles for the Week\n\n### Open Sales channels > Agentic before the holiday code freeze\n\nGoogle's AI Mode, Microsoft Copilot, and Meta surfaces including Muse can all run direct checkout for Shopify stores, and Google's is on by default. The audit post covers which channels are live for each store, which products are eligible, and how AI-channel revenue gets reconciled through Shopify's reports and server-side conversion events, since GA4 and browser pixels miss those orders. Window: before holiday code freezes.\n\n### Put generated people in the contract\n\nKalshi's statement blamed an unnamed agency; Choy's post       simplifiedMd: "# Monday Signal \u2014 Week of September 28, 2026\n\n> **Amazon locked Meta's Muse agent out on Sunday night; by Tuesday, Shopify, PayPal, and Expedia had signed on, and on Wednesday Amazon opened Seller Central to Claude, for sellers and one approved action at a time.** Also: Google switched on AI Mode checkout by default for Shopify stores (GA4 won't see those orders), ChatGPT's share of AI prompts fell from 70% to 50% in six months, YouTube announced brand-deal tools for Studio, and the UK wants AI assistants on Google's choice screens. Kalshi ran a creator's video as an ad with his face swapped, two weeks after swearing by \"unmistakably human creativity.\"\n\n---\n\n## The Conversation\n\n### Kalshi's AI ad copied a YouTuber's video and swapped his face\n\nElliot Choy (X, Sept 23): \"i guess kalshi saw this and thought they should steal my video, turn me into a white dude, and run it as an ad.\" YouTube served it to him; NPR's Bobby Allyn confirmed it. Kalshi: about four months old, made by an unnamed agency, no more AI-generated people, \"reviewing our relationship with\" the agency. Creator Pushpek Sidhu reported the same thing in June. On Sept 9, Kalshi's growth chief had posted that the brand went \"all-in on unmistakably human creativity.\" The agency excuse left the blame with Kalshi; licensing a creator's video costs about a quarter of a new one (The Now, via BI). [Business Insider](https://www.businessinsider.com/kalshi-in-hot-water-over-race-swapping-ai-ads-2026-9) \u00b7 [The Verge](https://www.theverge.com/ai-artificial-intelligence/1000309/youtuber-elliot-choy-says-an-ai-kalshi-ad-stole-one-of-his-videos-and-changed-his-race)\n\n### Google turned on AI Mode checkout for Shopify stores; GA4 won't see the orders\n\nSept 22 emails: \"Eligible products are automatically included. There's nothing for you to set up.\" Menachem Ani to Mike Ryan on X: \"No action on our end.\" US merchants selling to US customers; opt out under Sales channels > Agentic. Shopify's help page: \"Google Analytics and custom pixels won't fire\" in that checkout; only server-to-server started/completed events do. Audit which AI channels have direct checkout on and reconcile revenue in Shopify. [SER](https://www.seroundtable.com/google-native-checkout-emails-42140.html) \u00b7 [Shopify help](https://help.shopify.com/en/manual/online-sales-channels/agentic-storefronts/google)\n\n### AI Overviews got more links; some open AI Mode\n\nSept 21: Peec AI's Malte Landwehr charted AI Overviews with an external link in the answer text jumping from near zero to 26.2% after Sept 11; Gagan Ghotra recorded underlined AIO text that opened AI Mode instead. Search Console counts nothing for query-refinement links. A link count is inventory, not traffic; check where links go. [SEJ](https://www.searchenginejournal.com/google-ai-overviews-have-more-links-but-not-all-reach-the-web/590762/) \u00b7 [SER](https://www.seroundtable.com/google-ai-overviews-more-external-links-42135.html)\n\n---\n\n## Voices\n\n- **Tobi L\u00fctke, Shopify (X, Sept 21):** \"partnering deeply with Muse to enable agentic checkout with Shop Pay on all Shopify stores.\" [PYMNTS](https://www.pymnts.com/commerce/ecommerce/2026/shopify-brings-shop-pay-checkout-solution-to-metas-muse-ai-agent/)\n- **Amazon (Sept 20):** third-party apps \"should operate openly and respect service provider decisions about whether or not to participate.\" [GeekWire](https://www.geekwire.com/2026/amazon-blocks-metas-muse-ai-assistant-in-new-standoff-over-agentic-shopping/)\n- **A brand-side marketer (Digiday town hall, Sept 24):** \"It's like there's a growing acceptance of 'good enough \u2014 go.'\" [Digiday](https://digiday.com/marketing/marketers-bemoan-the-culture-of-good-enough-go-as-standards-fall-amid-the-ai-bubble/)\n- **Sarah Cardell, CMA (Sept 23):** AI assistants are what \"people are increasingly using as their search service, but aren't included on Google's choice screens.\" [GOV.UK](https://www.gov.uk/government/news/cma-strengthens-proposals-allowing-people-choice-over-their-search-service)\n\n---\n\n## This Week in Marketing AI\n\n### Amazon locked Muse out; Shopify, PayPal, and Expedia plugged it in\n\nMuse (launched Sept 8) topped the US free iPhone chart Sept 18 with 2.5M+ downloads by Sept 21 (Sensor Tower via CNBC). Sunday night, Sept 20, Amazon's popup: \"Continued access by an unauthorized AI agent violates Amazon's Conditions of Use.\" Its complaints: no notice, no self-identification, stored credentials. Shopify (Mon), PayPal and Expedia (Tue) signed on; six banks published agent-payment principles (Tue). Wednesday, Amazon let sellers run their stores from Claude with per-action approval. Reach through agents now depends on where you sell. *Editor's note (Sept 30): NBC News's Sept 29 tests found Muse blocked at several big retailers; its headline names Walmart, a Meta-announced partner.* [GeekWire](https://www.geekwire.com/2026/amazon-blocks-metas-muse-ai-assistant-in-new-standoff-over-agentic-shopping/) \u00b7 [CNBC](https://www.cnbc.com/2026/09/21/meta-muse-personal-ai-agent-downloads.html) \u00b7 [GeekWire on Accelerate](https://www.geekwire.com/2026/amazon-opens-its-seller-tools-to-outside-ai-agents-starting-with-anthropics-claude/)\n\n### ChatGPT's share of AI prompts: 70% to 50% in six months\n\nComscore (Sept 22), January to June: ChatGPT 70% to 50%, Gemini 17% to 30%, Claude 2% to 11%. Google desktop searches with an AI Overview: 25.8% (July 2025) to 39.4%. Sponsored ads in hotel prompts with source links: 6% in March, 24% by May. AEO trackers weighted to ChatGPT now see about half the prompts. [Comscore](https://www.comscore.com/Insights/Press-Releases/2026/9/Comscores-Q2-2026-AI-Intelligence-Report) \u00b7 [Digiday](https://digiday.com/media/comscore-data-shows-how-ai-discovery-is-splintering-beyond-chatgpt/)\n\n### Made on YouTube: brand deals in Studio, likeness alerts on phones\n\nSept 23: Creator Partnerships plus Ask Studio drafting replies to brand briefs; affiliate program in 35 countries by year-end; video A/B tests of up to three cuts coming soon; prompt-built home feeds; Ask YouTube as a product guide; likeness detection on mobile, voice detection later this year. 72% of US video posters ages 14\u201344 have used AI to create or edit. [Mohan's post](https://blog.youtube/news-and-events/innovation-youtube-era-made-on-viewers-creators/) \u00b7 [Pappu's post](https://blog.youtube/news-and-events/made-on-youtube-new-tools-power-creation-journey/)\n\n### Google promised an AI Max report; Microsoft's is in its API\n\nGoogle (Sept 23): one report showing search term, creative assets, and landing page, \"later this year\"; AI Brief in seven more languages. Microsoft's Search Term Landing Page report and PMax device exclusions shipped in August (covered Sept 24\u201325). Both answer the Q4 question of what the automation did. [Google](https://blog.google/products/ads-commerce/ai-max-language-reporting-features/) \u00b7 [TechWyse](https://www.techwyse.com/news/platform-updates/microsoft-ads-api-search-reporting-pmax-device-exclusions)\n\n### The UK wants AI assistants on Google's choice screens\n\nCMA (Sept 23): a choice screen at first use on Android and Chrome, then a yearly prompt; qualifying AI assistants included; publisher attribution required. Comments close Oct 9. [GOV.UK](https://www.gov.uk/government/news/cma-strengthens-proposals-allowing-people-choice-over-their-search-service)\n\n### Temu pulled partnership ads from likely fake creators\n\nFortune (Sept 25): after its Aug 31 story (up to $962M on Meta partnership ads; about 73 of the top 100 creator accounts probably fake, per Online Risk Labs), 90 of those accounts showed no Temu ads by Sept 4, and weekly partnership ads fell from 115,114 to 64,008. Vet creator accounts before boosting. [Fortune](https://fortune.com/2026/09/25/temu-axed-its-1-billion-network-of-fake-accounts-on-meta/)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via Search Engine Roundtable's [daily recap](https://www.seroundtable.com/recap-09-25-2026-42166.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/2026-09-28-ai-in-marketing-management/).*\n\n- **ChatGPT Ads** reached 60+ countries (seven Asian markets, Sept 23); the Shopify app was set to open internationally the same day. [MARKETECH APAC](https://marketech-apac.com/openai-brings-chatgpt-ads-to-sea-taiwan-opening-self-serve-access-to-smaller-businesses/)\n- **Demand Gen Drop:** one-tap image ads on Shorts and Gmail; affiliate locations as Maps promoted pins. [Google](https://blog.google/products/ads-commerce/demand-gen-drop-september-2026/)\n- **September 2026 spam update** began Sept 24; rollout may take up to two weeks. [SER](https://www.seroundtable.com/google-september-2026-spam-update-42163.html)\n- **Search Console** multimodal filter; Discover \"Dive deeper\" test; LSAs showing the Business Profile number over the Ads tracking number; tROAS locked in promotion mode; Bing testing an \"AI Mode\" tab name.\n- **Ireland fined Google \u20ac403M** over location data (Sept 21). [EDPB](https://www.edpb.europa.eu/news/the-irish-data-protection-commission-fines-google-403-000-000-eur-following-inquiry_en)\n- **News UK:** a fifth of traffic non-human; 6% blocked. [Press Gazette](https://pressgazette.co.uk/publishers/digital-journalism/fifth-of-news-uk-website-traffic-was-non-human-in-past-six-months/)\n- **SAFA** is the labs' planned standards body (The Information). [The Verge](https://www.theverge.com/ai-artificial-intelligence/1000047/openai-anthropic-and-google-are-reportedly-launching-their-own-ai-safety-organization)\n- **Ray-Ban Meta Audio**, no camera, $349, ships Oct 13. [TechCrunch](https://techcrunch.com/2026/09/23/meta-introduces-camera-free-ai-glasses/)\n\n---\n\n## Common Threads\n\n### The storefront picked its agents\nAmazon blocked a shopper's agent and invited sellers' agents; Shopify, PayPal, and the banks set terms for Muse.\n\n### Default-on is the launch plan\nNative checkout \"automatically included,\" agentic storefronts on by default, AI Max absorbing DSA and broad match. The decision sits at the opt-out.\n\n### The creator is the new attack surface\nKalshi's face swap, Temu's likely fake creators, YouTube's likeness detection on phones.\n\n### Dashboards are missing the new traffic\nCheckout orders GA4 can't see, AI Mode links Search Console may not count, half of prompts outside ChatGPT, a fifth of News UK's traffic not human.\n\n---\n\n## Angles for the Week\n\n- **Open Sales channels > Agentic before the holiday code freeze.** Which AI channels have direct checkout on, and how revenue gets reconciled. Window: before code freezes.\n- **Put generated people in the contract.** Likeness license, disclosure, takedown path. Window: this week.\n- **ChatGPT is half the AI prompt market now. Check your tracking.** Cover Gemini and Claude. Window: Q4 planning.\n- **A link in an AI Overview isn't a click.** Explain Peec's chart and Search Console's counting. Window: while the chart circulates.\n- **Amazon has two doors now.** Pilot the Claude seller plugin; attribute Muse orders on Shopify. Window: through the holidays.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
