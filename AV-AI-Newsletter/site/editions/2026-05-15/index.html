    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of May 15, 2026\n\n> **OpenAI shipped three Realtime voice models on May 11** and the pricing rewrites what's possible for any AV team that handles voice: streaming transcription at **$0.017/min** ($1.02/hour), live translation across 70+ input languages at **$0.034/min** ($2.04/hour), and a GPT-5-class voice agent with parallel tool calling. **Anthropic locked down 300 megawatts of new compute** through an exclusive deal with SpaceX (220,000+ NVIDIA GPUs), doubled Claude Code rate limits across paid tiers, and shipped the Claude Platform on AWS as generally available. At **Cannes 2026**, the Mise En Sc\u00e8ne Company launched **Human Provenance in Film** \u2014 the first industry-led, open-license AI disclosure standard \u2014 while **Steven Soderbergh** premiered \"John Lennon: The Last Interview\" with roughly 10% AI-generated footage for sequences that couldn't have been filmed in real life. **Krea shipped Krea 2**, its first foundation image model built from scratch, optimized for style transfer and aesthetic control. **Flick raised $6M** to build cinematic-control tooling for AI-native filmmakers. And **Vertigo Films + Federation Studios spun out amersia** \u2014 an AI entertainment company productizing the \"Critterz\" technology stack as a tool called Woven.\n\n---\n\n## This Week in AI\n\n### OpenAI Ships Three Realtime Voice Models \u2014 and the Pricing Rewrites What's Possible for AV\n\nOpenAI released three new audio-class models to the Realtime API on May 11. None of them are a flagship LLM release. All three change what's economically viable inside an AV workflow.\n\n**GPT-Realtime-2** \u2014 the voice-agent model. GPT-5-class reasoning, **128K token context window**, parallel tool calling, and a unified audio + text interface. Pricing per million tokens:\n\n- **Text**: $4.00 input / $24.00 output / $0.40 cached input\n- **Audio**: $32.00 input / $64.00 output / $0.40 cached input\n- **Image**: $5.00 input / $0.50 cached input\n\n**GPT-Realtime-Translate** \u2014 streaming speech-to-speech translation across **70+ input languages into 13 output languages**, priced *by audio duration* rather than by token: **$0.034 per minute** ($0.00057/second), or roughly **$2.04 per hour**.\n\n**GPT-Realtime-Whisper** \u2014 streaming low-latency speech-to-text transcription, also priced by duration: **$0.017 per minute** ($0.00028/second), or roughly **$1.02 per hour**.\n\n**Why the pricing matters more than the models do.** AV teams have been doing transcription, translation, and voice work with AI for years now. The block has never been capability \u2014 Whisper has been good enough for most cases since 2023, and translation systems have shipped with comparable quality intermittently since 2024. The block has been *the unit economics*. Real-time transcription at $1/hour, real-time translation at $2/hour, and a voice agent that can call tools mid-conversation at audio-token rates that come to roughly $1\u2013$2 per minute of intensive use \u2014 that combination means a producer can leave transcription running over an eight-hour shoot day for **$8**, can dub a 25-minute scratch track to twelve languages for **less than a dollar per language**, and can prototype an on-set translator app for an international shoot for the price of two takeaway lunches per day.\n\n**For AV teams**, the immediate use cases are obvious \u2014 captioning, dubbing rough cuts for international clients, on-set translation for foreign-language interviews, voice notes that auto-summarize and route to the right slack channel. The less-obvious use case is the **voice agent as a workflow surface**: an editor can talk to an agent that has tool access to Premiere, Frame.io, and the project's metadata, in actual conversation, with sub-2-second response latency. The voice-agent prototype that's been six months from shippable is now an afternoon of API integration.\n\nThree SDKs (Python, Node, mobile) shipped alongside the model release. GPT-Realtime-2 supports parallel tool calls (the agent can fire multiple MCP calls in a single response), and the context window comfortably holds an entire post-production session.\n\n**Source:** [OpenAI API Pricing](https://openai.com/api/pricing/) \u00b7 [gpt-realtime-2 model page](https://developers.openai.com/api/docs/models/gpt-realtime-2) \u00b7 [gpt-realtime-translate model page](https://developers.openai.com/api/docs/models/gpt-realtime-translate) \u00b7 [gpt-realtime-whisper model page](https://developers.openai.com/api/docs/models/gpt-realtime-whisper) \u00b7 [Realtime API cost guide](https://developers.openai.com/api/docs/guides/realtime-costs) \u00b7 May 11, 2026\n\n### The Compute Capacity Wars: Anthropic Locks Down 220K GPUs via SpaceX, Doubles Claude Code Limits\n\nAnthropic announced an exclusive compute deal with SpaceX on May 6 that flipped a meaningful capacity switch for anyone whose workflow runs through Claude. The deal is interesting on two levels: the concrete user impact landed the same day the announcement did, and the structural framing is the first major model provider taking position in what's increasingly looking like a physical-infrastructure scramble.\n\n**The deal**: Anthropic gets exclusive use of all compute output from SpaceX's **Colossus 1** data center in Memphis \u2014 **over 300 megawatts** of new capacity, **more than 220,000 NVIDIA GPUs** (H100, H200, and GB200 accelerators), all coming online within one month. SpaceX continues to own and operate the facility. Anthropic separately expressed interest in partnering with SpaceX to develop \"multiple gigawatts of orbital AI compute capacity\" \u2014 still exploratory, no timeline, but on the record.\n\n**The same-day impact for Claude users**, effective May 6:\n\n- **Claude Code five-hour rate limits doubled** for Pro, Max, Team, and seat-based Enterprise plans\n- **Peak-hours throttling removed** for Pro and Max accounts (no more degraded responses during US business hours)\n- **Claude Opus API rate limits substantially raised** for managed and direct API customers\n\nA separate announcement on May 11 made **Claude Platform on AWS generally available**: AWS customers can now access the full platform (Managed Agents, code execution, skills, web search, Files API) with native AWS authentication, billing, and IAM. The two announcements stack \u2014 Anthropic now has both meaningfully more direct compute and a distribution channel through every existing AWS enterprise account.\n\n**Why this matters for AV.** The first-order story is that anyone who uses Claude Code for production work, Claude Opus for research drafting, or Claude as the backend behind a custom agent now has a real-world capacity bump and one less peak-hour-throttling problem to plan around. The second-order story is harder to ignore: model providers are increasingly betting on **physical infrastructure deals** (Anthropic \u2194 SpaceX, OpenAI \u2194 Stargate, Google's own TPU vertical integration) rather than commodity cloud GPU rentals. The capacity question is becoming a structural fact about who can serve sustained inference at scale \u2014 and for AV teams whose workflows depend on a particular model being responsive on a deadline, the provider-to-power-grid line is now a relevant lens.\n\n**Source:** [Anthropic \u2014 Higher usage limits and SpaceX compute deal](https://www.anthropic.com/news/higher-limits-spacex) \u00b7 [Ars Technica coverage](https://arstechnica.com/ai/2026/05/anthropic-raises-claude-code-usage-limits-credits-new-deal-with-spacex/) \u00b7 [Claude Platform on AWS announcement](https://claude.com/blog/claude-platform-on-aws) \u00b7 May 6 + May 11, 2026\n\n### Cannes Pulse: An Open-License AI Disclosure Standard, and Soderbergh's First AI-Assisted Documentary\n\nTwo threads from Cannes 2026 deserve flagging together, because they're answering the same question \u2014 *how does AI sit inside a mainstream production* \u2014 from opposite ends of the stack.\n\n**Human Provenance in Film** launched May 13 at the March\u00e9 du Film. The Mise En Sc\u00e8ne Company released the standard as a **free, open-license disclosure framework** any producer, distributor, or platform can adopt. Three designations:\n\n- **No AI Used** \u2014 no generative AI in the production pipeline at all\n- **Assistive AI** \u2014 AI used for non-creative tasks (transcription, captioning, color correction assist, metadata, search)\n- **Generative AI** \u2014 generative AI used in creative output (image, audio, video, performance)\n\nThe framework is the first industry-led, voluntary disclosure standard to ship with a license that lets any platform adopt it without negotiation. It's an attempt to settle the \"what counts as AI?\" debate by separating the *kind* of AI use from the *fact* of AI use. The expectation in the room at Cannes is that some streamer or distributor will require disclosure to this standard within 18 months \u2014 possibly within the next negotiating cycle.\n\n**Steven Soderbergh premiered \"John Lennon: The Last Interview\"** at the festival with **approximately 10% AI-generated footage** of Lennon and Yoko Ono. Soderbergh's framing for the AI work: sequences \"that couldn't have been filmed in real life.\" The film uses AI to fill historical gaps where source material doesn't exist, rather than to extend or replace human performances. It's the first documentary from a top-tier American director to ship with a disclosed generative-AI segment of meaningful size.\n\n**The two together are the story.** Disclosure standard *and* marquee-director use case landing in the same week, at the same festival, two days apart. The industry that spent 2023\u20132025 litigating whether AI belongs in production is, at Cannes 2026, building the conventions that will govern *how* it does. Films at the March\u00e9 now arrive with a disclosure declaration in their press kits. The next 24 months are about how rigid those conventions become \u2014 voluntary now, contractual within two contract cycles, regulated eventually.\n\nThe Cannes signal is consistent with the March\u00e9's broader programming this year: the AI for Talent Summit doubled in length (May 15\u201316), the Village Innovation expanded to a record 1,000 square-meter space, and the Innovative Dreams and Creator Economy strands both prominently featured AI-native projects.\n\n**Source:** [Variety \u2014 New AI Disclosure Standard for Film](https://variety.com/2026/film/global/human-provenance-in-film-ai-disclosure-standard-cannes-1236747042/) \u00b7 [Variety \u2014 Cannes March\u00e9 du Film 2026 program](https://variety.com/2026/film/news/cannes-marche-du-film-immersive-creator-ai-2026-program-1236704795/) \u00b7 [March\u00e9 du Film \u2014 AI for Talent Summit](https://www.marchedufilm.com/news/ai-for-talent-summit/) \u00b7 [The Economic Times \u2014 Cannes AI sponsorship coverage](https://economictimes.indiatimes.com/tech/technology/cannes-festival-signs-up-meta-as-sponsor-amid-ai-fears/articleshow/131018276.cms) \u00b7 May 11\u201315, 2026\n\n### Krea 2 Ships a Style-First Foundation Image Model\n\nKrea released **Krea 2** on May 12 \u2014 its first foundation image model built from scratch, with an explicit design bet on **style transfer and aesthetic control** rather than open-ended generation. The release is small in headline capability but interesting in positioning, because Krea is the first foundation-model lab to explicitly carve out a category split: *generation* versus *direction*.\n\n**What's new**:\n\n- **Style transfer system** \u2014 pass in one or more reference images; the model decomposes their aesthetic features (palette, grain, depth, lighting, composition language) and reapplies them to generated outputs\n- **Moodboards** \u2014 multi-style mixing, where the influence of each reference can be slider-adjusted independently\n- **Style-strength control** \u2014 generate the same subject across a spectrum from \"loose interpretation of the reference\" to \"near-mimicry\"\n- **~15-second generation** time\n\n**The benchmark context.** In Contra Labs' style-fidelity testing, Krea 2 Large ranked **#2** behind only GPT Image 2, scoring 0.14 points below the leader. Stable Diffusion 3.5, FLUX Pro, and Midjourney v8.1 sit further down the table for style-specific work.\n\n**For AV teams**, the use case is direct: storyboarding to a director's reference deck, mood-board-driven previsualization, brand-style work where the client comes with three campaigns of existing visual language they want extended, and any workflow where the question isn't \"make me something cool\" but \"give me *this* in *that* style.\" Open-ended generation models will produce a striking image; Krea 2's bet is that producing *the specific image you already see in your head* is the more valuable problem to solve.\n\nThe Krea team has been transparent that the model is the foundation for an expanding product surface \u2014 style-locked video extensions and a more controllable inpainting pass are both on the roadmap.\n\n**Source:** [Krea \u2014 Introducing Krea 2](https://www.krea.ai/blog/krea-2-image-model) \u00b7 [Krea 2 product page](https://www.krea.ai/krea-2) \u00b7 [Contra Labs style-fidelity benchmarking](https://www.krea.ai/es/release-notes) \u00b7 May 12, 2026\n\n### Flick Raises $6M for AI-Native Filmmaking \u2014 With an Explicit \"Cinematic Control\" Pitch\n\n**Flick** announced a $6M seed round on May 11, led by True Ventures with participation from **GV (Google Ventures), Y Combinator, Lightspeed, Formosa Capital, Pioneer Fund, Olive Tree Capital, and N1**, plus angels. The company was founded by **Zoey Zhang** (award-winning filmmaker, multiple festival selections) and **Ray Wang** (founding engineer on Instagram Stories).\n\n**The positioning is the story.** Flick is explicitly *not* building one-click-generation tooling. The pitch deck argues that the gap in AI filmmaking right now isn't quality \u2014 it's *direction*. Most generative video tools produce striking 8-second clips but provide little affordance for the working filmmaker's actual job: making a series of decisions about framing, pacing, performance, and continuity, and iterating on each one until the cut works. Flick is building the iteration surface \u2014 shot-by-shot directional control, performance refinement on existing generations, and a continuity layer that enforces character/lighting/wardrobe consistency across cuts.\n\n**The Filmmaker Residency** is the other notable piece. Flick is funding **10+ short AI-native films by emerging filmmakers**, with showcase slots at **Cinequest Film Festival, MIT, and Omni AI Film Festival**. The residency frames the company as a creative-community play, not just a tool \u2014 and seeds the platform with a portfolio of high-craft work shipping over the next 12 months.\n\n**For AV teams**, the relevance is the positioning more than the product. Flick is the third high-profile bet in six weeks (alongside Buzzy's \"Photoshop for AI video\" play and amersia's Woven, below) on the thesis that **the next phase of AI video is direction and editing tooling, not better base models**. If the bet is right, the AV teams that move first on direction-focused workflows get a 12\u201318-month head start on whoever waits for the tools to mature.\n\n**Source:** [Pulse 2.0 \u2014 Flick funding](https://pulse2.com/flick-6-million-raised-for-ai-native-filmmaking-platform/) \u00b7 [ADVFN \u2014 Flick seed round](https://mx.advfn.com/bolsa-de-valores/noticias/98528579/flick-raises-6m-seed-round-to-redefine-how-ai-fil) \u00b7 May 11, 2026\n\n### amersia + Woven Launch Out of \"Critterz\" \u2014 The Stack That Made the Film Becomes a Product\n\nTwo weeks ago, AGC Studios boarded \"Critterz\" for worldwide sales at the Cannes March\u00e9 \u2014 the first $30M mainstream commercial AI-assisted animated feature. This week, **Vertigo Films and Federation Studios** announced **amersia**, a new AI entertainment company, and its first technology product: **Woven**.\n\n**The setup**: Critterz was made with a proprietary production stack \u2014 image generation, GPT-5 for structural work, custom pipeline tooling, and human-led creative direction throughout. Vertigo and Federation co-financed and produced the film. They've now spun the underlying technology into a standalone company.\n\n**Woven's positioning**: built around human-led creativity, designed to automate **repetitive production tasks** (asset generation passes, continuity checks, version control across iterations, technical handoffs) rather than replace artistic judgment. Director Nik Kleverov: \"Woven is built around human-led creativity.\" The product is positioned for animation studios, but the underlying primitives map directly to live-action production work that has the same repetitive-task characteristics.\n\n**Why this is a category move, not just a product launch.** The pattern over the next 12 months is going to be: marquee AI-assisted project ships \u2192 underlying tech gets spun out \u2192 spun-out product becomes the playbook for the next 4\u20136 projects. amersia is the first cleanly executed example of that pattern at scale. The question for AV teams is which of the major AI-assisted features in the next year (Bitcoin: Killing Satoshi, Answr, the Storyverse slate) follow the same play.\n\n**Source:** [Variety \u2014 Critterz First Look: New Tech Behind AI Animated Feature](https://variety.com/2026/film/news/critterz-first-look-new-tech-behind-ai-animated-feature-1236744442/) \u00b7 [Televisual \u2014 Vertigo, Federation Studios launch AI production system](https://www.televisual.com/news/vertigo-federation-studios-launch-ai-production-system/) \u00b7 May 14, 2026\n\n### Quick Hits\n\n- **Doug Liman's \"Bitcoin: Killing Satoshi\"** ($70M; Gal Gadot, Casey Affleck, Pete Davidson, Isla Fisher) is selling at the Cannes March\u00e9 via Patrick Wachsberger's company 193. The film used a custom soundstage shoot over 20 days with **AI-generated backgrounds and lighting** (performances captured normally), followed by 30 weeks of post-production with **55 AI artists**. Comparable traditional production would have run ~$300M.\n- **Stephen Kay's \"Answr\"** \u2014 Iceland-shot psychological thriller about human-AI relationships, starring Moises Arias and Rain Spencer (also Piper Perabo, Simon Rex, Jos\u00e9 Mar\u00eda Yazpik). Scored by **Tyler Bates** (Guardians of the Galaxy, John Wick). **Gersh** handling North American rights, **Radiant Films International** on foreign sales.\n- **Storyverse AI Studio debuts at Cannes** with a proprietary \"Director-level AI System\" that takes projects from script to screen in as few as five days. Founded by Emmy-nominated producer Jesse Z. Flagship slate: \"Solis Ark Academy\" (\"Harry Potter meets MBTI\").\n- **Baidu ERNIE 5.1** (May 8\u20139) \u2014 released with **roughly one-third the parameters** of ERNIE 5.0 and trained on **~6% of comparable models' pre-training cost**, ranked **#4 globally** (and #1 among Chinese models) on the Arena Search leaderboard. The training-cost figure is the headline that LLM-infrastructure watchers are unpacking.\n- **Anthropic Claude Platform on AWS** went GA May 11 \u2014 Managed Agents, code execution, skills, web search, and Files API now native on AWS with AWS authentication, billing, and IAM integration.\n\n---\n\n## Voices This Week\n\n### Steven Soderbergh on Using AI for the Lennon Documentary\n\nSoderbergh's framing for the AI-generated sequences in **\"John Lennon: The Last Interview\"** \u2014 that AI is being used for moments \"that couldn't have been filmed in real life\" \u2014 is the most carefully constructed defense of a generative-AI use case from a top-tier American director to date. The film treats AI not as a way to lower budget or shorten timelines, but as a way to access *historical material that doesn't exist*. That's a different argument from the one most AI-assisted films are making, and it's likely to be the framing that prestige documentary work adopts going forward: AI as the visual continuation of archival research, rather than as a production shortcut.\n\n### Nik Kleverov on Human-Led Creativity at amersia/Woven\n\nNik Kleverov, director of \"Critterz\" and now leading amersia's product direction, on the launch of Woven: \"Woven is built around human-led creativity.\" The framing is the same one Chad Nelson has been using for Critterz \u2014 AI in the pipeline, not in the authorship. amersia is the first company to put that framing into a product positioning rather than a press talking point. Whether the rest of the AI-tooling category follows (Flick already has; Buzzy's framing is adjacent) is the watch-item.\n\n---\n\n## Common Threads\n\n### The Pricing of Voice Just Collapsed\n\nA real-time speech-to-text endpoint at **$1.02/hour** and a real-time translation endpoint at **$2.04/hour** are not a technical breakthrough. They're a unit-economics breakthrough. The technical capability has been ambient for at least 18 months. What changed this week is that an AV team can leave transcription running across an entire shoot day for the cost of a coffee, and can prototype an on-set translator app at a per-day cost that's irrelevant to any production budget. When the price of a capability drops below the threshold where it has to be justified, the capability stops being an experiment and becomes the default. That transition happened to voice this week.\n\n### Cannes 2026 Is the First Festival Where AI Is Being Normalized Rather Than Litigated\n\nThe conversation at Cannes is no longer \"should AI be in films?\" The conversation is \"*how* do we disclose it, *how* do we credit it, *how* do we contract for it, *how* do we let buyers and audiences differentiate between projects that did and didn't use it?\" The Human Provenance disclosure standard, Soderbergh's documentary, the proliferation of AI-assisted features at the March\u00e9, the doubled AI for Talent Summit, the spun-out tooling companies \u2014 these are all answers to the *how* question, not the *should* one. The industry has moved on, faster than the 2023 strike rhetoric would have predicted.\n\n### The Compute Layer Is Consolidating\n\nAnthropic + SpaceX, OpenAI + Stargate, Google's vertical TPU strategy, Meta's in-house silicon \u2014 the major model providers are signing **physical-infrastructure deals**, not just chip orders. The capacity question is becoming a structural one about who controls the power grid and the data center footprint, not a commodity-market question about who buys the most GPUs. For AV teams whose workflows depend on a specific model's reliability at a particular moment, the provider-to-power-grid line is now a relevant operating concern, not an industry curiosity.\n\n### The \"Critterz Precedent\" Becomes a Stack\n\nThe Critterz spin-out into amersia and Woven is the first cleanly executed example of a pattern that's about to repeat across the AI-film ecosystem: a marquee project ships, the production tooling that made it ships, and the tooling becomes the playbook for the next 4\u20136 projects. Expect Bitcoin: Killing Satoshi, Answr, and the Storyverse slate to each spin out comparable tooling plays in the next two to four quarters. The company that started as a film becomes a studio becomes a software vendor.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Disclosure Standards as a Market Differentiator\n\nThe Human Provenance standard is voluntary today. The fast-forward is that within 18 months, a major streamer or distributor requires disclosure to a recognized standard as a condition of license. The producer pre-empting that requirement has a procurement advantage. The producer scrambling to figure out post-hoc what counts as \"assistive\" versus \"generative\" has a problem. The interesting downstream question is whether SAG-AFTRA's next negotiating cycle adopts the Human Provenance taxonomy directly or builds its own \u2014 adopting it makes the standard authoritative; building a competing one fragments the disclosure layer.\n\n### Voice-Realtime as the New \"Runs in the Background\"\n\nThe same arc that transcription went through between 2019 and 2023 \u2014 from \"a feature you have to launch\" to \"a thing that just happens to your audio\" \u2014 is about to happen to translation and voice-agent interaction in the next 18 months. The OpenAI Realtime pricing this week is the inflection point. The AV teams that pilot it in current workflows over the summer have the implementation knowledge by the time the rest of the industry catches up in Q4.\n\n### \"Cinematic Control\" Emerges as a Distinct Product Category\n\nFlick's \"cinematic control\" framing, Buzzy's \"Photoshop for AI video\" framing, Krea 2's style-transfer bet, and amersia's \"automate the repetitive parts\" positioning are all pointing at the same product category \u2014 distinct from base-model generation. The thesis: the next 12\u201318 months of AV-relevant AI investment will land in direction, iteration, and editing tools, not in better generators. The base-model leaderboard race is approaching diminishing-returns territory; the iteration-layer race is just starting.\n\n### A Spinout-First Production Pattern\n\namersia is the first example of a film studio launching a film *and a tooling company* as a single packaged business plan. The economics are interesting: the film pays for the tooling development, the tooling generates secondary revenue, and the spun-out company becomes the asset that backs the next round of fundraising. Expect 4\u20136 more of these in the next two quarters as the AI-feature directors and producers from this Cannes class look at the amersia structure and recognize the playbook.\n\n---\n\n## Tip of the Week\n\n### Build Your First Reusable AI Skill This Weekend\n\nLast week we made the case for writing a one-page personal context file \u2014 the foundation layer of the Agent OS framework. This week's tip is the natural next step: **turn one recurring task you do every week into a reusable \"skill.\"**\n\n**The problem it solves.** Even with a strong context file in place, every individual prompt still re-explains the task. *\"Summarize this call into action items, decisions made, and follow-up owners \u2014 keep it under 200 words, use bullet points, and flag anything that needs my approval.\"* You write that sentence every Friday. You'll write it 52 times this year. A skill is the same instruction, but written once and named \u2014 so next Friday you just say \"use my call-summary skill\" and the AI runs the exact same playbook.\n\n**What goes in a skill.** Three things, one page or less per skill:\n\n1. **When to use it** \u2014 the trigger condition. \"When I paste a meeting transcript and say 'summarize this,' run the call-summary skill.\"\n2. **The steps** \u2014 the actual instructions. The clearer the better. *\"Identify decisions made and who's responsible. Identify open questions and who needs to answer them. Identify any commitments I personally made. Use bullet points. Keep under 200 words. Flag anything that needs my approval with \ud83d\udea9 [Use the emoji literally \u2014 that's the visual signal you'll scan for.]\"*\n3. **The output format** \u2014 the literal template. *\"## Decisions / ## Open Questions / ## My Commitments / ## Flagged for Review\"* \u2014 so the output lands looking the same every time.\n\n**The starter list.** Five tasks every AV professional does weekly that should be your first five skills:\n\n- **Call summary** \u2014 meeting/client/vendor calls turned into structured action items\n- **Status update draft** \u2014 week-in-review format you send to your manager or stakeholders\n- **Email triage** \u2014 paste a thread, get a one-line summary and a draft reply\n- **Shot list scaffold** \u2014 script or scene description in, structured shot list out\n- **Asset metadata pass** \u2014 clip file or thumbnail in, suggested keywords/tags/description out\n\n**Where to drop them.** Same places as last week's context file \u2014 ChatGPT Custom Instructions, a Claude Project, an `AGENTS.md` for agentic tools, or a markdown file you paste from. Build one skill this weekend. Build the second next weekend. By the end of a quarter you have a dozen skills running, and you've stopped re-explaining the same task forever.\n\nThis is Step 2 of the Agent OS framework. Last week was **Identity + Context** (who you are, what your work is). This week is **Skills** (what you ask AI to do, captured as reusable instruction sets). Next week we'll cover **Memory** \u2014 how to make the AI remember what you've already worked through together.\n\n---\n\n## Sources\n\n1. [OpenAI \u2014 API Pricing](https://openai.com/api/pricing/) \u2014 May 11, 2026 \u2014 Realtime model pricing\n2. [OpenAI \u2014 gpt-realtime-2 Model](https://developers.openai.com/api/docs/models/gpt-realtime-2) \u2014 May 11, 2026 \u2014 Voice agent model specs\n3. [OpenAI \u2014 gpt-realtime-translate Model](https://developers.openai.com/api/docs/models/gpt-realtime-translate) \u2014 May 11, 2026 \u2014 Streaming translation specs\n4. [OpenAI \u2014 gpt-realtime-whisper Model](https://developers.openai.com/api/docs/models/gpt-realtime-whisper) \u2014 May 11, 2026 \u2014 Streaming STT specs\n5. [OpenAI \u2014 Realtime API cost guide](https://developers.openai.com/api/docs/guides/realtime-costs) \u2014 May 2026 \u2014 Duration-based pricing model\n6. [gHacks \u2014 OpenAI Realtime Voice Models](https://www.ghacks.net/2026/05/11/openai-releases-three-new-realtime-voice-models-for-the-api-with-gpt-5-class-reasoning/) \u2014 May 11, 2026 \u2014 Launch coverage\n7. [Anthropic \u2014 Higher usage limits and SpaceX compute deal](https://www.anthropic.com/news/higher-limits-spacex) \u2014 May 6, 2026 \u2014 Compute deal announcement\n8. [Ars Technica \u2014 Anthropic raises Claude Code limits](https://arstechnica.com/ai/2026/05/anthropic-raises-claude-code-usage-limits-credits-new-deal-with-spacex/) \u2014 May 7, 2026 \u2014 User-impact reporting\n9. [Anthropic \u2014 Claude Platform on AWS launch](https://claude.com/blog/claude-platform-on-aws) \u2014 May 11, 2026 \u2014 AWS GA announcement\n10. [Variety \u2014 Human Provenance in Film disclosure standard](https://variety.com/2026/film/global/human-provenance-in-film-ai-disclosure-standard-cannes-1236747042/) \u2014 May 13, 2026 \u2014 Disclosure framework launch\n11. [Variety \u2014 Cannes March\u00e9 du Film 2026 program](https://variety.com/2026/film/news/cannes-marche-du-film-immersive-creator-ai-2026-program-1236704795/) \u2014 April 2026 \u2014 March\u00e9 AI programming context\n12. [March\u00e9 du Film \u2014 AI for Talent Summit](https://www.marchedufilm.com/news/ai-for-talent-summit/) \u2014 April 2026 \u2014 Summit details and dates\n13. [The Economic Times \u2014 Cannes AI festival coverage](https://economictimes.indiatimes.com/tech/technology/cannes-festival-signs-up-meta-as-sponsor-amid-ai-fears/articleshow/131018276.cms) \u2014 May 11, 2026 \u2014 Soderbergh's Lennon doc context\n14. [Krea \u2014 Introducing Krea 2](https://www.krea.ai/blog/krea-2-image-model) \u2014 May 12, 2026 \u2014 Foundation model announcement\n15. [Krea 2 \u2014 Product page](https://www.krea.ai/krea-2) \u2014 May 12, 2026 \u2014 Capabilities and style transfer\n16. [Pulse 2.0 \u2014 Flick $6M raised](https://pulse2.com/flick-6-million-raised-for-ai-native-filmmaking-platform/) \u2014 May 11, 2026 \u2014 Seed round and team\n17. [ADVFN \u2014 Flick seed round and Filmmaker Residency](https://mx.advfn.com/bolsa-de-valores/noticias/98528579/flick-raises-6m-seed-round-to-redefine-how-ai-fil) \u2014 May 11, 2026 \u2014 Residency program detail\n18. [Variety \u2014 Critterz first look + Woven tech](https://variety.com/2026/film/news/critterz-first-look-new-tech-behind-ai-animated-feature-1236744442/) \u2014 May 14, 2026 \u2014 amersia / Woven launch\n19. [Televisual \u2014 Vertigo + Federation launch AI production system](https://www.televisual.com/news/vertigo-federation-studios-launch-ai-production-system/) \u2014 May 14, 2026 \u2014 amersia company details\n20. [TheWrap \u2014 Inside Bitcoin: Killing Satoshi](https://www.thewrap.com/creative-content/movies/ai-movie-bitcoin-killing-satoshi-gal-gadot-casey-affleck-doug-liman/) \u2014 May 2026 \u2014 Production specs and AI use\n21. [Deadline \u2014 Bitcoin casting and Cannes sales](https://deadline.com/2026/04/gal-gadot-isla-fisher-casey-affleck-pete-davidson-bitcoin-1236860330/) \u2014 April 2026 \u2014 Cast and 193 sales partner\n22. [Deadline \u2014 Answr at Cannes](https://deadline.com/2026/05/cannes-ai-stephen-kay-answr-1236890118/) \u2014 May 11, 2026 \u2014 Stephen Kay AI thriller, sales agents\n23. [Variety \u2014 Storyverse AI Studio launches at Cannes](https://variety.com/2026/tv/news/storyverse-ai-studio-cannes-launch-1236745956/) \u2014 May 13, 2026 \u2014 AI studio debut and Solis Ark slate\n24. [Baidu \u2014 ERNIE 5.1 release blog](https://ernie.baidu.com/blog/posts/ernie-5.1-0508-release/) \u2014 May 8, 2026 \u2014 Model specs and training-cost figure\n25. [BotBeat \u2014 Baidu launches ERNIE 5.1](https://botbeat.news/news/baidu-launches-ernie-5-1-advancing-its-generative-ai-capabilities-6218) \u2014 May 9, 2026 \u2014 Launch and benchmark coverage\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of May 15, 2026\n\n> Quick Summary: **OpenAI shipped three Realtime voice models on May 11** and the pricing rewrites what's possible for AV teams that handle voice: streaming transcription at **$1.02/hour**, live translation across 70+ input languages at **$2.04/hour**, and a GPT-5-class voice agent with parallel tool calling. **Anthropic locked down 300 megawatts of new compute** through an exclusive SpaceX deal (220,000+ NVIDIA GPUs), **doubled Claude Code rate limits** for paid tiers, and made the Claude Platform on AWS generally available. At **Cannes 2026**, the industry launched **Human Provenance in Film** \u2014 the first open-license AI disclosure standard \u2014 while **Steven Soderbergh** premiered \"John Lennon: The Last Interview\" with ~10% AI-generated footage. **Krea shipped Krea 2**, a style-first foundation image model. **Flick raised $6M** for AI-native filmmaking. **Vertigo Films + Federation Studios spun out amersia + Woven** \u2014 the production stack that made \"Critterz\" is now a standalone tooling company.\n\n---\n\n## The Big Stories This Week\n\n### OpenAI Ships Three Realtime Voice Models \u2014 and the Pricing Rewrites What's Possible for AV\n\nOpenAI released three audio-class models to the Realtime API on May 11. None are flagship LLM releases. All three change what's *economically viable* in an AV workflow.\n\n- **GPT-Realtime-2** \u2014 voice agent. GPT-5-class reasoning, 128K context, parallel tool calling. Audio: $32/M input, $64/M output. Text: $4/M input, $24/M output.\n- **GPT-Realtime-Translate** \u2014 streaming speech-to-speech translation across **70+ input languages \u2192 13 output languages**, priced by duration: **$0.034/min** ($2.04/hour).\n- **GPT-Realtime-Whisper** \u2014 streaming low-latency speech-to-text transcription, also by duration: **$0.017/min** ($1.02/hour).\n\n**Why the pricing matters more than the models do.** AV teams have been doing transcription, translation, and voice work with AI for years. The block has never been capability \u2014 it's been unit economics. Real-time transcription at $1/hour, real-time translation at $2/hour, and a voice agent that can call tools mid-conversation at audio-token rates around $1\u2013$2 per minute of intensive use mean a producer can leave transcription running over an eight-hour shoot day for **$8**, dub a 25-minute scratch track to twelve languages for **less than a dollar per language**, and prototype an on-set translator app for an international shoot for the price of two takeaway lunches per day.\n\nThe less-obvious use case is the **voice agent as a workflow surface**: an editor can talk to an agent with tool access to Premiere, Frame.io, and project metadata, in actual conversation, with sub-2-second response latency. The prototype that's been \"six months from shippable\" is now an afternoon of integration work.\n\n### The Compute Capacity Wars: Anthropic Locks Down 220K GPUs via SpaceX\n\nAnthropic announced an exclusive compute deal with SpaceX on May 6 that flipped a real capacity switch for anyone whose workflow runs through Claude.\n\n**The deal**: exclusive use of all compute from SpaceX's **Colossus 1** data center in Memphis \u2014 **300+ megawatts**, **220,000+ NVIDIA GPUs** (H100, H200, GB200), online within one month. SpaceX operates the facility; Anthropic gets exclusive output. Separately, both companies have expressed interest in developing \"multiple gigawatts of orbital AI compute capacity\" \u2014 still exploratory.\n\n**Same-day user impact** (effective May 6):\n\n- **Claude Code five-hour rate limits doubled** for Pro, Max, Team, and Enterprise seats\n- **Peak-hours throttling removed** for Pro and Max accounts\n- **Opus API rate limits substantially raised**\n\nA May 11 follow-up made **Claude Platform on AWS generally available** \u2014 Managed Agents, code execution, skills, web search, and Files API natively on AWS with AWS authentication and billing. The two announcements stack: Anthropic now has meaningfully more direct compute *and* a distribution channel through every existing AWS enterprise account.\n\n**The structural story.** Model providers are increasingly betting on **physical-infrastructure deals** (Anthropic \u2194 SpaceX, OpenAI \u2194 Stargate, Google's TPU verticalization) rather than commodity cloud GPU rentals. For AV teams whose workflows depend on a particular model being responsive on a deadline, the provider-to-power-grid line is now a relevant lens.\n\n### Cannes Pulse: An Open-License AI Disclosure Standard, and Soderbergh's AI-Assisted Lennon Doc\n\nTwo threads from Cannes 2026 worth flagging together \u2014 they're answering the same question (*how does AI sit inside a mainstream production?*) from opposite ends of the stack.\n\n**Human Provenance in Film** launched May 13 at the March\u00e9 du Film. The Mise En Sc\u00e8ne Company released the standard as a **free, open-license disclosure framework** any producer, distributor, or platform can adopt without negotiation. Three designations:\n\n- **No AI Used** \u2014 no generative AI in the production pipeline at all\n- **Assistive AI** \u2014 AI used for non-creative tasks (transcription, captioning, color correction assist, metadata, search)\n- **Generative AI** \u2014 generative AI used in creative output\n\nThe framework is the first industry-led, voluntary disclosure standard to ship with a license that lets any platform adopt it without negotiation. Expectation in the room at Cannes: a major streamer or distributor will require disclosure to this standard within 18 months.\n\n**Steven Soderbergh premiered \"John Lennon: The Last Interview\"** at the festival with **approximately 10% AI-generated footage** of Lennon and Yoko Ono. Soderbergh's framing: sequences \"that couldn't have been filmed in real life.\" The film uses AI to fill historical gaps where source material doesn't exist, rather than to extend or replace performances. It's the first documentary from a top-tier American director to ship with a disclosed generative-AI segment of meaningful size.\n\n**The two together are the story.** Disclosure standard *and* marquee-director use case landing the same week at the same festival. The industry that spent 2023\u20132025 litigating whether AI belongs in production is, at Cannes 2026, building the conventions that will govern *how* it does.\n\n### Krea 2 Ships a Style-First Foundation Image Model\n\nKrea released **Krea 2** on May 12 \u2014 its first foundation image model built from scratch, with an explicit design bet on **style transfer and aesthetic control** rather than open-ended generation.\n\n- **Style transfer system** \u2014 pass in reference images; the model decomposes aesthetic features and reapplies them\n- **Moodboards** \u2014 multi-style mixing with slider-adjustable influence per reference\n- **Style-strength control** \u2014 generate across a spectrum from \"loose interpretation\" to \"near-mimicry\"\n- **~15-second generation**\n- Ranked **#2** on Contra Labs' style-fidelity benchmark (0.14 pts behind GPT Image 2)\n\n**For AV teams**: storyboarding to a director's reference deck, mood-board-driven previs, brand-style work where the client comes with existing visual language. Open-ended generation models produce a striking image; Krea 2's bet is that producing *the specific image you already see in your head* is the more valuable problem.\n\n### Flick Raises $6M for AI-Native Filmmaking \u2014 With an Explicit \"Cinematic Control\" Pitch\n\n**Flick** announced a $6M seed round on May 11, led by True Ventures, with **GV, Y Combinator, Lightspeed, Formosa Capital, Pioneer Fund, Olive Tree Capital, and N1**. Founded by **Zoey Zhang** (filmmaker) and **Ray Wang** (founding engineer on Instagram Stories).\n\nThe pitch: the gap in AI filmmaking isn't quality, it's *direction*. Most generative video produces striking 8-second clips but provides little affordance for the working filmmaker's actual job \u2014 making decisions about framing, pacing, performance, and continuity, and iterating on each one until the cut works. Flick is building the iteration surface.\n\n**Filmmaker Residency**: **10+ short AI-native films** by emerging filmmakers, with showcase slots at **Cinequest, MIT, and Omni AI Film Festival**.\n\nFlick is the third high-profile bet in six weeks (alongside Buzzy's \"Photoshop for AI video\" and amersia's Woven) on the thesis that **the next phase of AI video is direction and editing tooling, not better base models.**\n\n### amersia + Woven Launch Out of \"Critterz\"\n\n**Vertigo Films and Federation Studios** announced **amersia**, a new AI entertainment company, on May 14, alongside its first technology product: **Woven**.\n\nCritterz was made with a proprietary production stack \u2014 image generation, GPT-5 for structural work, custom pipeline tooling, human-led creative direction. Vertigo and Federation have now spun the underlying technology into a standalone company. Woven is positioned to automate **repetitive production tasks** (asset passes, continuity checks, version control, technical handoffs) rather than replace artistic judgment. Director Nik Kleverov: \"Woven is built around human-led creativity.\"\n\n**The pattern**: marquee AI-assisted project ships \u2192 underlying tech gets spun out \u2192 spun-out product becomes the playbook for the next 4\u20136 projects. amersia is the first cleanly executed example at scale. Expect 4\u20136 more of these in the next two quarters.\n\n### Quick Hits\n\n- **Doug Liman's \"Bitcoin: Killing Satoshi\"** ($70M; Gal Gadot, Casey Affleck, Pete Davidson, Isla Fisher) selling at Cannes via Patrick Wachsberger's 193. AI-generated backgrounds/lighting; performances captured normally. 20-day soundstage + 30 weeks post with **55 AI artists**. Comparable traditional production: ~$300M.\n- **Stephen Kay's \"Answr\"** \u2014 Iceland-shot AI thriller about human-AI relationships. Moises Arias + Rain Spencer, scored by Tyler Bates. Gersh + Radiant selling at Cannes.\n- **Storyverse AI Studio** debuts at Cannes with a \"Director-level AI System\" that takes projects script-to-screen in as few as 5 days.\n- **Baidu ERNIE 5.1** (May 8\u20139) \u2014 roughly one-third the parameters of ERNIE 5.0 at ~6% of comparable training cost, ranked #4 globally (#1 among Chinese models) on Arena Search.\n- **Anthropic Claude Platform on AWS** GA May 11 \u2014 Managed Agents, code execution, skills, web search, Files API native on AWS.\n\n---\n\n## Tip of the Week\n\n### Build Your First Reusable AI Skill This Weekend\n\nLast week's tip was the personal context file \u2014 the foundation layer of the Agent OS framework. This week's tip is the natural next step: **turn one recurring task you do every week into a reusable \"skill.\"**\n\n**The problem it solves.** Even with a strong context file, every individual prompt still re-explains the task. *\"Summarize this call into action items, decisions, and follow-up owners \u2014 under 200 words, bullet points, flag anything that needs my approval.\"* You write that every Friday. A skill is the same instruction, but written once and named \u2014 so next Friday you just say \"use my call-summary skill.\"\n\n**What goes in a skill** (one page per skill, three sections):\n\n1. **When to use it** \u2014 the trigger condition\n2. **The steps** \u2014 the actual instructions, the clearer the better\n3. **The output format** \u2014 the literal template the output should match\n\n**Five starter skills every AV professional should write first**:\n\n- **Call summary** \u2014 meeting/client/vendor calls \u2192 structured action items\n- **Status update draft** \u2014 your weekly week-in-review format\n- **Email triage** \u2014 thread in, one-line summary + draft reply out\n- **Shot list scaffold** \u2014 script or scene description in, structured shot list out\n- **Asset metadata pass** \u2014 clip file or thumbnail in, suggested keywords/tags/description out\n\n**Where to drop them**: ChatGPT Custom Instructions, a Claude Project, an `AGENTS.md`, or just a markdown file you paste from. Build one this weekend. Build the second next weekend. By the end of a quarter you have a dozen skills running and you've stopped re-explaining the same task forever.\n\nThis is Step 2 of the Agent OS framework. Last week was **Identity + Context**. This week is **Skills**. Next week we'll cover **Memory**.\n\n---\n\n## Why This Week Matters\n\nA few patterns worth noting:\n\n- **The pricing of voice just collapsed.** $1.02/hour transcription and $2.04/hour translation aren't a technical breakthrough \u2014 they're a unit-economics breakthrough. The capability has been ambient for 18+ months. What changed this week is that an AV team can leave transcription running across a shoot day for the cost of a coffee. When the price of a capability drops below the justification threshold, the capability stops being an experiment and becomes the default. That transition happened to voice this week.\n\n- **Cannes 2026 is the first festival where AI is being normalized rather than litigated.** The conversation has moved from *should* AI be in films to *how* do we disclose it, credit it, contract for it, and let buyers and audiences differentiate. The Human Provenance standard, Soderbergh's documentary, the proliferation of AI-assisted features at the March\u00e9, the doubled AI for Talent Summit, the spun-out tooling companies \u2014 these are all answers to the *how* question, not the *should* one.\n\n- **The compute layer is consolidating.** Anthropic + SpaceX, OpenAI + Stargate, Google's vertical TPU strategy, Meta's in-house silicon \u2014 model providers are signing physical-infrastructure deals, not just chip orders. For AV teams whose workflows depend on a specific model's reliability at a particular moment, the provider-to-power-grid line is now a relevant operating concern.\n\n- **The \"Critterz precedent\" becomes a stack.** amersia is the first cleanly executed example of a pattern about to repeat: a marquee project ships, the production tooling that made it ships, the tooling becomes the playbook for the next 4\u20136 projects. Bitcoin: Killing Satoshi, Answr, and the Storyverse slate are the watch-items for what spinouts come next.\n\n- **\"Cinematic control\" emerges as a distinct product category.** Flick, Buzzy, Krea 2, and amersia/Woven are all pointing at the same product category \u2014 distinct from base-model generation. The base-model leaderboard race is approaching diminishing returns; the iteration-layer race is just starting. AV teams that move first on direction-focused workflows get a 12\u201318-month head start.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
