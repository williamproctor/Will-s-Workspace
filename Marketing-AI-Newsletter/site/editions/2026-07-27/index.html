      editionTitle: "Week of July 27, 2026",
      editionMd: "# The Monday Signal \u2014 Week of July 27, 2026\n\n> **The AI ad wars went main-character this week.** Meta answered the \"doomers\" with an optimism spot scored, apparently unironically, to a David Bowie song about human extinction, while the wreckage of Anthropic's \"hard questions\" ad was still smoldering on X. Same week: X deleted 42,000 AI reply bots, and Alphabet told investors that ads inside AI search are now real revenue, even as new data showed buying a placement doesn't buy a citation. The pattern underneath it all: authenticity and earned visibility keep getting more valuable at exactly the moment automation gets cheaper.\n\n---\n\n## The Conversation\n\n### Meta answers the AI doomers with butterflies and a Bowie song about extinction\n\nMeta launched \"The Future Is for Everyone\" on July 23: a one-minute AI-optimism spot that opens on doomy black-and-white headlines and blooms into color. The voiceover: \"Call us optimists. Call us dreamers. Call us whatever the hell you want. But we're betting on people, and we like those odds.\" Zuckerberg posted it personally. Meta CMO Denise Moreno carried the LinkedIn version (\"we think AI will empower people to do more of what they love\").\n\nThe dunks wrote themselves. The soundtrack is David Bowie's \"Five Years,\" a song about Earth learning it has five years left, with the apocalyptic verses trimmed out. TechCrunch ran it as an AI optimism ad \"set to a song about human extinction.\" Engadget noted the campaign is \"conspicuously light on AI,\" and it is: no product actually does anything in the spot. The timing is legible to everyone, too. Meta reports earnings Wednesday with hundreds of billions in AI capex to justify.\n\nThe richer subplot is the contrast with Anthropic's \"There's Hope in Hard Questions\" (July 9, roughly 3.3M views on X), which took the opposite bet. Cemeteries, burning houses, existential questions \u2014 and it got mocked for it, most famously by Sam Altman: \"i thought this was satire.\" One detail worth stealing for client decks: the same Anthropic ad was praised by creative directors on LinkedIn and shredded on X and YouTube. Same creative, opposite receptions, different networks.\n\n**Comment window:** wide open through Meta's earnings Wednesday. The cheap take is dunking on the song choice. The differentiated take is what these two campaigns reveal about audience-message fit and how AI companies should market AI at all.\n\n**Source:** [TechCrunch](https://techcrunch.com/2026/07/23/meta-launched-a-new-ai-optimism-ad-set-to-a-song-about-human-extinction/) \u00b7 [Engadget](https://www.engadget.com/2222159/meta-pro-ai-ad-campaign-is-conspicuously-light-on-ai/) \u00b7 [Business Insider comparison](https://www.businessinsider.com/meta-anthropic-ai-ad-campaign-compared-2026-7) \u00b7 [Time on the Anthropic backlash](https://time.com/article/2026/07/16/anthropic-ai-marketing-advertisement/) \u00b7 [LinkedIn-vs-X reception analysis](https://bretkerr.substack.com/p/the-messenger-paradox-how-anthropics) \u00b7 July 23, 2026\n\n### X deletes 42,000 AI reply bots, and LinkedIn is quietly doing the same to AI comments\n\nOn July 24, X head of product Nikita Bier announced: \"We found 42,000 accounts automating replies using chatbots and have removed them from the platform. X's core value is providing an authentic pulse on humanity \u2014 and using AI to programmatically engage with users without a human in the loop runs counter to our mission.\" No warnings, no grace period. It's the sharpest strike yet in a crackdown that has removed more than 1.7 million bots since early 2026, and unlike earlier spam sweeps, this one hit tools that real startups and growth teams use to automate engagement.\n\nLinkedIn is reportedly moving the same direction: its 2026 algorithm changes suppress generic AI comments out of \"Most Relevant\" and restrict repeat offenders (secondary reporting via Startup Fortune, so treat as reported rather than confirmed).\n\nThe read for growth teams: AI-automated engagement is being reclassified from tactic to violation on the two platforms that matter most for B2B thought leadership. Draft-with-human-review workflows survive. Autonomous engagement products just lost their addressable market.\n\n**Comment window:** open now. Every founder who bought an \"AI engagement\" tool is quietly re-reading the contract, and a grounded post on what still works will land all week.\n\n**Source:** [Bier's post, captured](https://digg.com/tech/1ygslyhm) \u00b7 [Startup Fortune analysis](https://startupfortune.com/x-removes-42000-ai-reply-bot-accounts-and-the-warning-to-growth-marketers-is-impossible-to-ignore/) \u00b7 July 24, 2026\n\n### Google's AI told customers a bakery was closing. It wasn't.\n\nAnna Mae's Bakery owner Amanda Herrfort found out from a customer's screenshot that Google's AI Overview was telling people her shop permanently closes July 31. The AI invented the date. Google blamed thin web data. The story went viral because it's the perfect miniature of the AI-visibility problem: the machine now speaks for your brand whether or not you're publishing, and silence is exactly what it hallucinates into.\n\n**Comment window:** evergreen but hot right now. Pairs naturally with this week's data on what actually feeds AI answers (see the Similarweb story below).\n\n**Source:** [PPC Land](https://ppc.land/google-ai-overview-forces-anna-maes-bakery-to-deny-fake-july-31-closing/) \u00b7 July 26, 2026\n\n---\n\n## This Week in Marketing AI\n\n### Alphabet Q2: ads inside AI search are real revenue now, and buying one doesn't buy a citation\n\nAlphabet reported Q2 on July 22. Search advertising grew 17% to $63.3 billion while the open-web Network line fell 1% to $7.3 billion. The part that matters for marketers is where the growth is coming from. AI Mode has passed 1 billion monthly users, and Google is monetizing it directly: contextual sitelinks, Direct Offers (the Chewy, Gap, and L'Or\u00e9al pilot, with IHG next), and Highlighted Answers, which chief business officer Philipp Schindler described as \"clearly marked sponsored links inside list responses.\" Those formats debuted at Google Marketing Live in May and showed up on an earnings call as revenue drivers nine weeks later.\n\nAI Max is out of beta with more than 500,000 advertisers. Google claims a 15% average lift in conversions or value at similar ROAS. That's a Google-measured number, and independent tests published last November found the opposite on cost per conversion, a discrepancy nobody has resolved publicly. Dynamic Search Ads retire in September with automatic upgrades into AI Max, which makes the AI format the default rather than the option. Sundar Pichai repeated that Google sends \"billions of clicks to websites every week\" through AI features. Hold that against Ahrefs' finding that AI Overviews correlate with a 58% click-through drop for top-ranked pages. Both can be true. Denominators matter.\n\nThen the kicker: SE Ranking found AI Mode showed a text ad on 29% of tested commercial keywords, but the advertiser's domain appeared among the answer's cited sources only 11% of the time. Paid placement, citations, and rankings are behaving like three separate surfaces. Buying one does not buy the others.\n\n**Source:** [PPC Land earnings analysis](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 [Search Engine Land](https://searchengineland.com/google-ai-max-billions-new-monetizable-searches-483347) \u00b7 [Alphabet Q2 call](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx) \u00b7 [SE Ranking via SEJ](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u00b7 July 22, 2026\n\n### August 2: AI-content labels become enforceable in the EU, with fines up to 3% of turnover\n\nThe European Commission published its Article 50 guidelines and finalized the Code of Practice on Transparency of AI-Generated Content on July 20. The EU AI Act's transparency obligations become applicable **August 2**, with fines up to \u20ac15 million or 3% of worldwide turnover, whichever is higher. Google announced July 24 that it's signing the Code. Its own documentation still keeps liability with the advertiser.\n\nTwo details matter most for marketing teams. First, the artistic carve-out does not cover advertising: Commission guidance explicitly lists a synthetic spokesperson selling a product as content needing the full label. Assistive editing (retouching, color work, cropping) stays exempt. Second, the EU is one layer of a stack. New York's synthetic-performer disclosure has been live since June 9 at $1,000 to $5,000 per violation, India's rules since February, and California's SB 942/AB 853 are synced to the same August 2 date. Google spent the month shipping the plumbing: an AI label setting across five ads products, attestation fields in the Google Ads and DV360 APIs. All of it records declarations that no system validates and that remain the advertiser's legal problem.\n\n**Source:** [PPC Land on the three-regime stack](https://ppc.land/advertisers-face-5-000-new-york-fines-and-3-eu-penalties-over-ai-labels/) \u00b7 [PPC Land on Google signing](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/) \u00b7 July 20\u201324, 2026\n\n### ChatGPT Ads ships conversion bidding on top of an auction nobody can see into\n\nOpenAI rolled out the toolkit performance marketers were waiting for: conversion-optimized (oCPC) campaigns, geo exclusions, AppsFlyer and Adjust integrations, hashed-data advanced matching, a bulk API, and product cards showing prices and ratings. Daily budgets move to seven-day rolling averages from July 27. The platform that started with $200,000 minimums now has none.\n\nDemand is arriving faster than the reporting. Adthena tracks 7,378 advertisers in ChatGPT, up 97-fold in a quarter from an admittedly small base, led by Booking.com. But the native Ads Manager shows advertisers only their own numbers. No impression share, no auction insights. UK advertisers have watched costs swing 39% to 278% with no visible cause, and you're bidding on loose conversational prompt categories rather than keywords you can enumerate. This auction sits roughly where paid search sat two decades ago, except the spend is arriving at modern scale before the reporting exists.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u00b7 [eMarketer](https://www.emarketer.com/content/chatgpt-ads-shift-clicks-conversions) \u00b7 [PPC Land weekly on Adthena](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 20\u201327, 2026\n\n### Similarweb: ChatGPT falls to half of gen-AI traffic, and citations point at different pages than clicks\n\nSimilarweb's 2026 Generative AI Landscape report landed this week: 9.5 billion monthly web visits to gen-AI platforms, up 70% year over year. ChatGPT's share of standalone gen-AI web visits fell from above 80% in late 2024 to just above 50% by May. June snapshots of the same panel put Gemini around 27% and Claude around 9%. For anyone doing AI-visibility work, four findings stand out:\n\n- ChatGPT's citation rate jumped from roughly 1.3% to 6.8% of answers in a year, led by travel (22.6%) and retail (13.5%). Reviews and user-generated content supply 28.9% of top citations; news another 26.0%.\n- Citations and referrals diverge: 65% of cited URLs sit two or more folders deep in a site, while 58.8% of referral traffic lands on homepages.\n- AI referral traffic converts at 7.1%, second only to paid search at 7.8%.\n- Ads appeared in 26% of US desktop ChatGPT chats in June, up from 14% in May, at a 0.50% click-through rate. Which means roughly three-quarters of even the most ad-saturated assistant surface is still earned exposure.\n\nCaveats before anyone builds a deck on this: these are panel estimates, and the vendors disagree with each other. Similarweb puts AI Overviews in 43% of US searches where Adthena's pulse says 18%, and their UK ChatGPT ad numbers are flatly incompatible. There is no standard measurement yet.\n\n**Source:** [PPC Land coverage](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u00b7 [Similarweb report](https://www.similarweb.com/corp/reports/2026-generative-ai-landscape/) \u00b7 [June share snapshot](https://fourweekmba.com/ai-chatgpt-gemini-claude-generative-ai-traffic-share-2026/) \u00b7 week of July 20, 2026\n\n### WARC: 88% more creative, 45% better. The brief is the bottleneck.\n\nWARC's \"The New Creative Advantage\" (produced with TikTok and LIONS Advisory; 400 marketers across four markets; covered July 22) found 88% of marketers producing more creative volume since adopting AI. Only 45% report significantly better quality. The study locates that 43-point gap in the brief: 67% feed generative models demographic data as the primary input, while 59% of the same population says demographic segmentation no longer works. Just 17% consistently add community or audience insight. TikTok's Andy Yang, in the foreword, calls it \"not a technology gap, it is an intelligence gap.\" (Disclosure: TikTok commissioned research that concludes marketers need the cultural signal TikTok sells. The data stands; the alignment belongs on the record.)\n\nThe mechanism is the useful part. AI compresses production, which removes the human layers that used to compensate for thin briefs. The brief now travels almost directly to the finished asset, so input quality matters more than ever, at the exact moment most teams left it unchanged.\n\n**Source:** [PPC Land weekly analysis](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 covered July 22, 2026\n\n### Fractl: 81% of buyers still call it SEO, and buzzword pitches are the top red flag\n\nFractl surveyed 343 US marketing decision-makers responsible for AI visibility (released July 21). 81% still say \"SEO\" when discussing AI search strategy internally; 19% have adopted \"GEO,\" 10% \"AEO.\" When buyers search for help, \"AI search optimization\" (46%) and \"SEO\" (24%) dominate. \"GEO\" gets 12% of searches, \"AEO\" 3%. Heavy buzzword use is the single biggest vendor red flag at 36%, and case studies outrank acronym fluency roughly four to one. The budgets moved anyway: an average 24% of search and content spend now goes to AI visibility, with financial services leading at 39%. (Disclosure: Fractl sells adjacent services, and the sample is US-only at 343.)\n\n**Source:** [Fractl study](https://www.frac.tl/ai-search-optimization-language/) \u00b7 [PPC Land coverage](https://ppc.land/marketers-still-call-it-seo-as-81-reject-geo-pitch-fractl-finds/) \u00b7 July 21, 2026\n\n---\n\n## Platform & Tool Watch\n\n- **Google shipped a domain-level opt-out of AI answers.** Search Console's \"Search generative AI control\" excludes a site from AI Overviews, AI Mode, and Discover AI within a day or two. Not a ranking signal, and it does *not* stop model training. Page-level controls arrive March 2027. Publishers who blocked AI crawlers have measured persistent traffic losses, so check the data before touching the toggle. [Google docs](https://support.google.com/webmasters/answer/16908024) \u00b7 [PPC Land](https://ppc.land/google-gives-site-owners-a-toggle-to-exit-ai-overviews-and-ai-mode/) \u00b7 ~July 20\n- **The EC fined Google \u20ac890M under the DMA** on July 23. How self-preferencing rules will apply to AI Overviews and AI Mode is still being negotiated, and that deferred question will shape European AI visibility more than any feature launch. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 23\n- **Performance Max may finally get search-partner and GDN exclusions**, per Digiday. Practitioners call it the biggest control concession since the format launched. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **Gemini 3.6 Flash launched July 21 with price cuts.** 17% fewer output tokens; Flash-Lite at $0.30 per million input tokens. Agentic marketing tools that didn't pencil in June may pencil in August without changing anything. [Google](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Meta announced the Seller app** (July 24; AI writes a Marketplace listing in \"about 30 seconds,\" a Meta claim with no accuracy rate attached), plus a test that opens Facebook straight into full-screen video with the Classic Feed demoted to a second tab, plus free selfie-verification badges from July 27. **Meta reports Q2 earnings Wednesday, July 29** \u2014 the first read on ad performance since these changes started landing. [PPC Land](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u00b7 [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-to-Announce-Second-Quarter-2026-Results/default.aspx) \u00b7 July 24\u201329\n- **Amazon shipped about 10 AI features into Brand+ and Performance+** from July 22 while removing single-deal streaming-TV buying. Same consolidation pattern Google is running with AI Max: the AI path gains capability while the manual path narrows. [PPC Land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u00b7 July 22\u201326\n- **Time is building pages for readers who aren't human.** COO Mark Howard described serving two audiences: people, and the AI crawlers that now outnumber them (bots are over half of web traffic per Cloudflare, with crawl-to-referral ratios from 118:1 up to roughly 50,000:1). Time routes AI crawlers to a stripped-down copy of its site and sells text ads humans never see. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **HubSpot opened Agent Hub in public beta.** Low-code agents on CRM data. HubSpot itself flagged the failure mode: agents deployed in isolation, like a prospecting agent emailing an account while a service agent handles that same account's open complaint. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n\n---\n\n## Common Threads\n\n### Authenticity is becoming platform policy, not just taste\n\nX deleted 42,000 AI reply bots for lacking \"a human in the loop.\" LinkedIn reportedly suppresses generic AI comments. Meta ships selfie-verification badges. The platforms that sold reach are now defending the authenticity of engagement itself, which raises the value of genuinely human commentary at the same moment the supply of fake commentary gets purged.\n\n### AI search is now a paid channel, and paid doesn't buy cited\n\nGoogle booked AI Mode ad revenue and OpenAI shipped conversion bidding. Yet advertisers' domains appear among AI-cited sources just 11% of the time on ad-carrying keywords, and roughly three-quarters of US desktop ChatGPT chats carry no ads at all. Paid presence, citations, and rankings are three separate surfaces sharing a screen. Budget them separately.\n\n### Production outran verification\n\nMarketers make 88% more creative and can verify quality on 45% of it. Agent launches ship precise time savings and no accuracy rates. Attestation APIs record declarations nobody validates. Across the stack, generation scaled faster than the evaluation layer around it, and vendors publish the variable that's easy to measure.\n\n### The measurement layer is unsettled, so anchor accordingly\n\nSimilarweb says AI Overviews appear in 43% of US searches. Adthena says 18%. Their UK ChatGPT ad-penetration numbers are mutually exclusive. Any strategy narrative or client deck anchored on a single vendor's panel inherits that uncertainty and should say so out loud.\n\n---\n\n## Angles for the Week\n\n*Raw material for posts and POVs, grounded in this edition's reporting and ordered by how long each conversation window stays open.*\n\n### \"Meta and Anthropic just ran the same ad with opposite emotions. Both missed.\"\n\nThe most instructive marketing case study of the year is AI companies trying to market AI, and the reception data is sitting in public. Meta's July 23 optimism spot drew extinction-song dunks and a \"conspicuously light on AI\" review six days before earnings. Anthropic's doom-toned ad pulled 3.3M views and Altman's satire treatment on X, yet creative directors praised it on LinkedIn. Everyone is dunking on the song choice; the unclaimed take is audience-message fit and the LinkedIn/X reception split, which turns into a client-ready point about channel-native messaging.\n\nWindow: through Meta's earnings Wednesday.\n\n### \"X just published its algorithm's values: automated engagement is a violation now.\"\n\nForty-two thousand accounts deleted for AI replies reads like a spam story until you notice whose tools got hit. Bier's July 24 post drew the line at \"a human in the loop,\" 1.7 million bots have been purged since early 2026, and LinkedIn is reportedly demoting generic AI comments in parallel. Every team running AI engagement tools is deciding what to do about it this week. A concrete post on what survives (draft-with-review) and what dies (autopilot) is immediately useful and lands on the right side of the purge.\n\nWindow: this week, while the purge is fresh.\n\n### \"AI search became a paid channel this week. Citations are still earned.\"\n\nGoogle will now happily sell you a spot inside the AI answer. It will not sell you a citation. Alphabet cited AI Mode formats as revenue on July 22; SE Ranking found advertisers' domains among cited sources just 11% of the time; Similarweb shows about 74% of US desktop ChatGPT chats carrying no ads and recommended brands getting 2\u20134x the follow-on visits. This is the first week anyone can say \"AI search monetization is real\" with an earnings call behind it, and the paid-versus-earned frame for AI answers is still unclaimed.\n\nWindow: durable, but freshest before the earnings cycle moves on.\n\n### \"Would your ads survive August 2?\"\n\nIn six days, an unlabeled synthetic spokesperson in the EU can cost 3% of worldwide turnover. Article 50 becomes applicable August 2, advertising is explicitly excluded from the artistic carve-out, Google signed the Code on July 24 and still points liability at the advertiser, New York has been live since June 9, and California syncs to the same date. A practical decision-tree post (\"which of your assets need a label?\") is genuinely useful and reads as the adult in the room.\n\nWindow: hard deadline this week.\n\n### \"Your buyers still call it SEO.\"\n\nThe industry renamed the discipline three times before the customer renamed it once. Fractl's July 21 study: 81% say \"SEO\" internally, \"AEO\" gets 3% of help-seeking searches, buzzword-heavy pitches are the top vendor red flag at 36%, and case studies beat acronym fluency four to one, all while 24% of search and content budgets already moved to AI visibility. For a team that uses the AEO label daily, naming that tension out loud is what makes the post credible.\n\nWindow: a week or two, while the study circulates.\n\n---\n\n## Sources\n\n1. [TechCrunch \u2014 Meta launched a new AI optimism ad set to a song about human extinction](https://techcrunch.com/2026/07/23/meta-launched-a-new-ai-optimism-ad-set-to-a-song-about-human-extinction/) \u2014 July 23, 2026 \u2014 campaign detail, voiceover, Bowie soundtrack analysis, Zuckerberg post\n2. [Engadget \u2014 Meta's pro-AI ad campaign is conspicuously light on AI](https://www.engadget.com/2222159/meta-pro-ai-ad-campaign-is-conspicuously-light-on-ai/) \u2014 July 23, 2026 \u2014 campaign substance critique; Meta spokesperson framing; CMO Denise Moreno's LinkedIn post\n3. [TechRepublic \u2014 Zuckerberg wants to change how you think about AI](https://www.techrepublic.com/article/news-meta-ai-optimism-campaign-zuckerberg-2026/) \u2014 July 24, 2026 \u2014 campaign/earnings timing context\n4. [Business Insider \u2014 A side-by-side comparison of Meta and Anthropic's AI ads](https://www.businessinsider.com/meta-anthropic-ai-ad-campaign-compared-2026-7) \u2014 July 2026 \u2014 the two campaigns as a debate; Meta's timeline caveat\n5. [Time \u2014 The backlash to Anthropic's ad misses something bigger](https://time.com/article/2026/07/16/anthropic-ai-marketing-advertisement/) \u2014 July 16, 2026 \u2014 Anthropic ad content, Altman quote, criticism detail\n6. [IBTimes UK \u2014 Anthropic's ad sparks debate](https://www.ibtimes.co.uk/anthropic-controversial-ai-ad-sparks-debate-1808854) \u2014 July 2026 \u2014 3.3M X views figure; reception detail\n7. [Bret Kerr \u2014 The Messenger Paradox](https://bretkerr.substack.com/p/the-messenger-paradox-how-anthropics) \u2014 July 2026 \u2014 LinkedIn-vs-X reception split on the Anthropic campaign\n8. [Nikita Bier's post on the AI reply-bot removal (captured)](https://digg.com/tech/1ygslyhm) \u2014 July 24, 2026 \u2014 verbatim announcement text and timestamp\n9. [Startup Fortune \u2014 X removes 42,000 AI reply bot accounts](https://startupfortune.com/x-removes-42000-ai-reply-bot-accounts-and-the-warning-to-growth-marketers-is-impossible-to-ignore/) \u2014 July 25, 2026 \u2014 crackdown context, 1.7M figure, LinkedIn parallel (secondary sourcing)\n10. [PPC Land \u2014 Google AI overview forces Anna Mae's Bakery to deny fake July 31 closing](https://ppc.land/google-ai-overview-forces-anna-maes-bakery-to-deny-fake-july-31-closing/) \u2014 July 26, 2026 \u2014 AI Overview hallucination case\n11. [PPC Land \u2014 Google Search ads gain 17% to $63.3 billion while network drops 1%](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u2014 July 2026 \u2014 Q2 detail, AI Max, AI Mode formats, independent-test caveats\n12. [Search Engine Land \u2014 Google says AI Max unlocks billions of new monetizable searches](https://searchengineland.com/google-ai-max-billions-new-monetizable-searches-483347) \u2014 July 2026 \u2014 earnings-call ad-product detail\n13. [Alphabet \u2014 Q2 2026 Earnings Call](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx) \u2014 July 22, 2026 \u2014 primary source for executive remarks\n14. [Search Engine Journal \u2014 Google AI Mode ads rarely match the sources it cites](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u2014 July 2026 \u2014 SE Ranking: 29% ad frequency, 11% citation overlap\n15. [PPC Land \u2014 Advertisers face $5,000 New York fines and 3% EU penalties over AI labels](https://ppc.land/advertisers-face-5-000-new-york-fines-and-3-eu-penalties-over-ai-labels/) \u2014 July 2026 \u2014 the three-regime disclosure stack\n16. [PPC Land \u2014 Google signs EU AI code](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/) \u2014 July 24, 2026 \u2014 Code signing and deadline mechanics\n17. [Search Engine Roundtable \u2014 ChatGPT Ads updates](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u2014 July 2026 \u2014 feature rundown; July 27 budget change\n18. [eMarketer \u2014 ChatGPT ads shift from clicks to conversions](https://www.emarketer.com/content/chatgpt-ads-shift-clicks-conversions) \u2014 July 2026 \u2014 conversion-bidding context\n19. [PPC Land \u2014 Marketers brief AI with the demographic data they say no longer works](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u2014 July 27, 2026 \u2014 weekly synthesis: WARC study, Adthena/dentsu, PMax exclusions, EC fine, Time's machine audience, HubSpot Agent Hub\n20. [PPC Land \u2014 ChatGPT loses web share to Gemini and Claude as ad penetration hits 26%](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u2014 July 2026 \u2014 Similarweb landscape report detail and measurement conflicts\n21. [Similarweb \u2014 The 2026 Generative AI Landscape Report](https://www.similarweb.com/corp/reports/2026-generative-ai-landscape/) \u2014 July 2026 \u2014 primary report page\n22. [FourWeekMBA \u2014 Generative AI traffic share analysis](https://fourweekmba.com/ai-chatgpt-gemini-claude-generative-ai-traffic-share-2026/) \u2014 July 2026 \u2014 June share snapshot (Gemini ~27%, Claude ~9%)\n23. [Fractl \u2014 Stop pitching GEO](https://www.frac.tl/ai-search-optimization-language/) \u2014 July 21, 2026 \u2014 primary study\n24. [PPC Land \u2014 Marketers still call it SEO as 81% reject GEO pitch](https://ppc.land/marketers-still-call-it-seo-as-81-reject-geo-pitch-fractl-finds/) \u2014 July 2026 \u2014 study methodology detail\n25. [Google Search Console Help \u2014 Search generative AI control](https://support.google.com/webmasters/answer/16908024) \u2014 accessed July 27, 2026 \u2014 opt-out documentation\n26. [PPC Land \u2014 Google gives site owners a toggle to exit AI Overviews and AI Mode](https://ppc.land/google-gives-site-owners-a-toggle-to-exit-ai-overviews-and-ai-mode/) \u2014 July 2026 \u2014 CMA origin, rollout, page-level timeline\n27. [Google \u2014 Gemini 3.6 Flash and 3.5 Flash-Lite](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u2014 July 21, 2026 \u2014 model pricing changes\n28. [PPC Land \u2014 Meta demotes Facebook Feed as free selfie badge rolls out](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u2014 July 27, 2026 \u2014 Seller app, video-first test, verification badges\n29. [PPC Land \u2014 Amazon kills single-deal STV buying in Brand+ as 10 AI features land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u2014 July 26, 2026 \u2014 Amazon AI features\n30. [Meta \u2014 Q2 2026 earnings announcement](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-to-Announce-Second-Quarter-2026-Results/default.aspx) \u2014 July 14, 2026 \u2014 July 29 earnings date\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# The Monday Signal \u2014 Week of July 27, 2026\n\n> **The AI ad wars went main-character.** Meta answered the \"doomers\" with an optimism spot set to a Bowie song about extinction. Anthropic's doom-toned ad was still getting dunked on. X deleted 42,000 AI reply bots. And Alphabet booked ads inside AI search as real revenue, while new data showed buying a placement doesn't buy a citation.\n\n---\n\n## The Conversation\n\n### Meta vs Anthropic: the AI ad wars\n\nMeta launched \"The Future Is for Everyone\" July 23. Optimism, butterflies, \"call us whatever the hell you want\u2026 we're betting on people.\" The internet noticed the soundtrack is Bowie's \"Five Years\" (a song about extinction, verses trimmed) and that the ad shows almost no actual AI, six days before Meta's earnings. It reads as the answer to Anthropic's \"hard questions\" ad (July 9, roughly 3.3M X views), which Sam Altman mocked as looking like satire. Sharpest detail: the same Anthropic ad was praised on LinkedIn and shredded on X. Same creative, opposite receptions by network. Comment window: open through Wednesday's Meta earnings. [TechCrunch](https://techcrunch.com/2026/07/23/meta-launched-a-new-ai-optimism-ad-set-to-a-song-about-human-extinction/) \u00b7 [Reception split](https://bretkerr.substack.com/p/the-messenger-paradox-how-anthropics)\n\n### X deletes 42,000 AI reply bots\n\nNikita Bier, July 24: AI engaging users \"without a human in the loop runs counter to our mission.\" Part of a purge of 1.7 million bots since early 2026, and this wave hit tools real growth teams use. LinkedIn is reportedly suppressing generic AI comments too. Automated engagement is being reclassified from tactic to violation. Comment window: open now; a grounded \"what survives (draft-with-review) versus what dies (autopilot)\" post lands all week. [Bier's post](https://digg.com/tech/1ygslyhm) \u00b7 [Analysis](https://startupfortune.com/x-removes-42000-ai-reply-bot-accounts-and-the-warning-to-growth-marketers-is-impossible-to-ignore/)\n\n### Google's AI invented a bakery closure\n\nAn AI Overview told customers Anna Mae's Bakery closes July 31. It doesn't. Google blamed thin web data. A perfect miniature of the AI-visibility problem: the machine speaks for your brand whether or not you publish. [PPC Land](https://ppc.land/google-ai-overview-forces-anna-maes-bakery-to-deny-fake-july-31-closing/) \u00b7 July 26\n\n---\n\n## This Week in Marketing AI\n\n### Alphabet Q2: AI-search ads are revenue now, and paid doesn't buy cited\n\nSearch up 17% to $63.3B (July 22). AI Mode, past 1B users, carries ads: contextual sitelinks, Direct Offers, Highlighted Answers. AI Max is out of beta with 500K+ advertisers and a claimed 15% lift (Google-measured; independent tests disagreed on cost). SE Ranking: on keywords showing AI Mode ads, the advertiser's domain was among cited sources 11% of the time. Paid placement, citations, and rankings are three separate surfaces. [PPC Land](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 [SEJ](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/)\n\n### August 2: AI-content labels get fines up to 3% of turnover\n\nEU AI Act Article 50 binds August 2 (guidelines published July 20; Google signed the Code July 24). Advertising is excluded from the artistic carve-out, so synthetic spokespeople need the full label; assistive editing is exempt. New York has been live since June 9, and California syncs to August 2. Liability sits with the advertiser everywhere. [PPC Land](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/)\n\n### ChatGPT Ads: conversion bidding on a dark auction\n\nNew this week: an oCPC conversions objective, geo exclusions, AppsFlyer/Adjust, advanced matching, a bulk API, product cards. Adthena tracks 7,378 ChatGPT advertisers (up 97x from a small base), but the Ads Manager shows only your own numbers, and UK costs swung 39\u2013278% unexplained. Modern-scale spend, two-decades-ago reporting. [SER](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u00b7 [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n### Similarweb: the assistant market split three ways\n\nGen-AI platforms drew 9.5B monthly visits, up 70% in a year. ChatGPT fell from above 80% share to about half; June snapshots put Gemini around 27% and Claude around 9%. Citations rose to 6.8% of ChatGPT answers. Cited pages are deep pages while referral traffic lands on homepages. AI referrals convert at 7.1%, second only to paid search. Ads appear in 26% of US desktop chats, which leaves roughly 74% of exposure earned. Caveat: Similarweb and Adthena publish incompatible numbers; no standard exists. [PPC Land](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/)\n\n### WARC: the brief is the bottleneck\n\n88% of marketers report more creative volume with AI; only 45% report better quality. 67% brief models with demographics while 59% of the same marketers say demographics don't work, and just 17% add community insight. TikTok's Andy Yang: \"not a technology gap, it is an intelligence gap.\" (TikTok co-commissioned.) [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n### Fractl: buyers still say \"SEO\"\n\n81% call AI-search work \"SEO\" internally; \"AEO\" gets 3% of help-seeking searches. Buzzword pitches are the top vendor red flag at 36%, and case studies beat acronyms four to one. Budgets moved anyway: 24% of search/content spend now goes to AI visibility. [Fractl](https://www.frac.tl/ai-search-optimization-language/) \u00b7 July 21\n\n---\n\n## Platform & Tool Watch\n\n- **Google: domain-level opt-out of AI Overviews/AI Mode** in Search Console. Takes effect in 1\u20132 days, not a ranking signal, doesn't stop training. Page-level controls: March 2027. [Docs](https://support.google.com/webmasters/answer/16908024) \u00b7 ~July 20\n- **EC fined Google \u20ac890M under the DMA.** Self-preferencing rules for AI Overviews/AI Mode still being negotiated. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 23\n- **PMax search-partner/GDN exclusions in testing**, the biggest control concession since launch. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **Gemini 3.6 Flash price cuts.** Agent economics improve without product changes. [Google](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Meta: AI Seller app, video-first Facebook test, selfie badges July 27. Q2 earnings Wednesday, July 29.** [PPC Land](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u00b7 [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-to-Announce-Second-Quarter-2026-Results/default.aspx)\n- **Amazon: ~10 AI features in Brand+/Performance+; single-deal STV buying removed.** [PPC Land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u00b7 July 22\n- **Time serves a second audience: AI crawlers.** Bots are over half of web traffic; Time runs a stripped-down site copy for machines and text ads humans never see. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n- **HubSpot Agent Hub public beta.** Low-code agents on CRM data; HubSpot itself flagged the uncoordinated-agents risk. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n---\n\n## Common Threads\n\n### Authenticity is becoming platform policy\nX purges AI replies, LinkedIn demotes AI comments, Meta ships human-verification badges. Genuinely human commentary appreciates as fake commentary gets purged.\n\n### Paid doesn't buy cited\nAI search now sells placements; citations stay earned (11% overlap, and about 74% of chats are ad-free). Two budgets, two disciplines.\n\n### Production outran verification\n88% more creative, 45% better. Agents ship time savings with no accuracy rates, and attestation fields go unvalidated.\n\n### Measurement is unsettled\nSimilarweb vs Adthena: 43% vs 18% AI Overview frequency. Single-vendor panels are hypotheses, not ground truth. Say so in decks.\n\n---\n\n## Angles for the Week\n\n1. \"Meta and Anthropic ran the same ad with opposite emotions. Both missed.\" The Bowie discourse, Altman's satire dunk, and the LinkedIn-praise/X-shredding split add up to a client-ready insight about channel-native messaging. Window: through Wednesday's Meta earnings.\n2. \"Automated engagement is a violation now, not a tactic.\" 42,000 accounts gone and \"human in the loop\" is the new line. Post the survival guide: draft-with-review lives, autopilot dies. Window: this week.\n3. \"AI search became a paid channel. Citations are still earned.\" Google sells the placement, not the citation (11% overlap; 74% of chats ad-free). The paid-versus-earned frame is unclaimed. Window: durable, freshest now.\n4. \"Would your ads survive August 2?\" A synthetic spokesperson in the EU means a label or 3%-of-turnover exposure. The decision-tree post writes itself. Window: hard deadline this week.\n5. \"Your buyers still call it SEO.\" 81% say SEO, AEO gets 3% of searches, buzzword pitches are the top red flag. A self-aware take for a team that uses \"AEO\" daily. Window: a week or two.\n\n---\n\n*The Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
