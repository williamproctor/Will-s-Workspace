  <script>
    const EDITION_MD = "# The AV AI Dispatch \u2014 Week of March 12, 2026\n\n> A $15 million ad campaign recreated in 40 hours for under $20K, ByteDance's video model shelved by Disney's lawyers, and a new open-source voice model that lets you direct emotional delivery word by word.\n\n---\n\n## This Week in AI\n\n### Fish Audio S2: Open-Source TTS That Lets You Direct Every Word\n\nFish Audio quietly released the most interesting voice AI tool we've seen in months. [S2](https://fishaudio.ai) is an open-source text-to-speech model that supports word-level emotion control \u2014 meaning you can tag individual words or phrases with natural language instructions like `[excited]`, `[somber]`, or `[whispered]`, and the model adjusts its delivery at that exact moment.\n\nIt also does zero-shot voice cloning across 80 languages with sub-150ms latency. For our audio team, this is worth evaluating immediately. The word-level control changes TTS from \"pick a voice and hope it works\" to \"direct the performance like you would with a human narrator.\" And it's fully open source.\n\n**Source:** Fish Audio S2 announcement \u00b7 ~March 10, 2026\n\n### Luma Agents Turn a $15M Campaign into $20K\n\nLuma Labs launched [Agents](https://lumalabs.ai), powered by their multi-modal model Uni-1, which handles video, audio, image, and text generation end-to-end. The headline case study: a client converted a $15 million traditional advertising campaign into localized versions across markets in 40 hours for under $20,000.\n\nThat 750x cost reduction is eye-catching, even if the output quality isn't one-to-one with traditional production. What matters is the trajectory \u2014 this is the first credible example of AI creative agents operating across the full production pipeline, not just one modality. It's a direct competitor to ElevenLabs Flows (which we covered last week) and signals that the unified AI production platform is no longer speculative.\n\n**Source:** Luma Labs announcement \u00b7 ~March 11, 2026\n\n### ByteDance's Video Model Gets Cease-and-Desisted by Hollywood\n\nThe biggest cautionary tale of the week: ByteDance's AI video model Seedance 2.0 was hit with cease-and-desist letters from Disney, Warner Bros., Paramount, and Sony after users generated near-perfect reproductions of copyrighted characters and scenes. ByteDance shelved the model pending review.\n\nThis is the first major legal action against an AI video tool over character reproduction, and it's a wake-up call for any AV team using these tools. If your AI video output looks too much like someone else's IP, the legal risk is real. Expect every major video AI platform to accelerate content filtering in response.\n\n**Source:** Tech press coverage of Seedance 2.0 takedown \u00b7 ~March 11, 2026\n\n### Vidu Q3: The First AI Pipeline Built for Series Production\n\nAt SXSW, [Vidu](https://vidu.ai) debuted Q3 \u2014 the first AI video pipeline designed specifically for animated series production. The key breakthrough: character consistency across episodes, automated lip-sync, and asset reuse. These are the exact problems that have kept AI video out of serialized content.\n\nEvery other AI video tool focuses on one-off generation. Q3 is built for recurring content \u2014 training series, internal communications, branded episodic content. If your team produces anything serialized, this is the tool to watch.\n\n**Source:** Vidu Q3 SXSW debut \u00b7 ~March 10, 2026\n\n### NVIDIA GTC: Vera Rubin and 10x Cheaper Inference\n\nJensen Huang's GTC keynote announced the Vera Rubin GPU architecture (successor to Blackwell), the OpenClaw robotics platform, and most importantly for us: 10x cheaper inference on current Blackwell hardware compared to Hopper. Huang positioned inference cost reduction \u2014 not raw training performance \u2014 as NVIDIA's priority.\n\nTranslation for AV teams: every AI-powered tool you use is about to get cheaper to run. Cloud rendering, voice synthesis, real-time captioning, video generation \u2014 the cost floor is dropping fast.\n\n**Source:** [NVIDIA GTC 2026](https://www.nvidia.com/gtc/) keynote \u00b7 March 10, 2026\n\n---\n\n## Top 10 AI Podcasts This Week\n\n| # | Podcast | Episode | Takeaway |\n|---|---------|---------|----------|\n| 1 | Dwarkesh Podcast | Dylan Patel \u2014 3 Bottlenecks to Scaling AI | \"An H100 is worth more today than 3 years ago\" \u2014 GPU economics are counterintuitive |\n| 2 | Hard Fork | A.I. Goes to War + AI Brain Fry | Heavy AI users are experiencing a new form of cognitive fatigue |\n| 3 | Latent Space | Claude Cowork \u2014 AI Should Have Its Own Computer | VM-based AI agents that organize files, upload videos, automate browsers |\n| 4 | No Priors | Simon Last / Notion \u2014 Agentic Engineering | \"You can be 100 or 1,000X engineer if you use the tools right now\" |\n| 5 | AI Daily Brief | A Guy Used AI to Cure His Dog's Cancer | We're in \"AI's Second Moment\" \u2014 the agentic wave is bigger than the ChatGPT shock |\n| 6 | Last Week in AI | #237 \u2014 Nemotron 3 Super | NVIDIA's open-source 120B model: 1M-token context, 5x throughput, fully open |\n| 7 | Practical AI | Humility in Agentic Coding | A Rust contributor's journey from AI skeptic to AI-first builder |\n| 8 | TWIML AI | Agent Swarms & Knowledge Graphs | \"Code is a commodity\" \u2014 acceptance, not generation, is the real metric |\n| 9 | ML Street Talk | When AI Discovers the Next Transformer | Sakana's evolutionary approach: \"Nothing interesting happens when LLMs run autonomously\" |\n| 10 | Eye on AI | Pathway's Real-Time AI Systems | Most AI apps rely on stale data \u2014 real-time processing changes everything for live production |\n\n### Deep Dives\n\n**Dwarkesh Podcast: Dylan Patel on Why GPUs Are Worth More, Not Less**\n\nThis is the must-listen of the week. Dylan Patel from SemiAnalysis sat down with Dwarkesh Patel for a 2.5-hour deep dive on the three bottlenecks limiting AI compute scaling: lithography (ASML), memory (HBM), and power. The counterintuitive headline: *\"An H100 is worth more today than it was three years ago\"* \u2014 because newer, cheaper-to-run models like GPT-5.4 produce more value per GPU than older models ever could.\n\nFor AV teams, the practical takeaway is about vendor economics. Patel argued that Anthropic *\"screwed the pooch\"* compared to OpenAI on compute deals, which means Anthropic-powered tools may face capacity constraints that OpenAI-powered ones won't. If you're choosing between AI tool vendors, their compute infrastructure strategy matters. Also: $600 billion in combined Big Tech CapEx in 2026. The infrastructure build-out is real, and it will drive costs down for everyone downstream.\n\n**Source:** [Dwarkesh Podcast](https://www.dwarkesh.com/p/dylan-patel) \u00b7 March 13, 2026\n\n**Hard Fork: \"AI Brain Fry\" Is a Real Thing**\n\nKevin Roose and Casey Newton introduced a concept that should concern every team deploying AI tools at scale: \"AI Brain Fry.\" BCG's Julie Bedard described it as a genuine workplace condition \u2014 cognitive fatigue from overreliance on AI, where people stop thinking critically because the AI is handling so much of the cognitive load.\n\nThis isn't anti-AI sentiment. It's a human factors problem. If our team is using AI tools daily \u2014 and we should be \u2014 we need to design workflows that keep humans engaged and critical, not passive. The solution is better task design, not less AI. The episode also covered AI's role in the Iran conflict and Grammarly using Casey Newton's identity without consent \u2014 both worth the listen.\n\n**Source:** [Hard Fork \u2014 \"A.I. Goes to War\"](https://www.nytimes.com/column/hard-fork) \u00b7 March 13, 2026\n\n**Latent Space: Claude Cowork \u2014 The Agent That Organizes Your Computer**\n\nFelix Rieseberg from Anthropic walked through Claude Cowork \u2014 a VM-based agent that's the user-friendly superset of Claude Code. The key quote: *\"Don't even write a memo, just build.\"* Anthropic's internal culture has shifted to prototype-first, building all candidate products in parallel and picking winners.\n\nWhat matters for AV teams: Cowork can organize files, upload videos, automate browser workflows, and handle taxes (yes, really). The \"skills\" system \u2014 lightweight markdown instruction files \u2014 means you can teach the agent new capabilities without writing code. Imagine a skill file that says \"when a video lands in the review folder, generate a transcript and draft social clips.\" That's where this is heading.\n\n**Source:** [Latent Space](https://www.latent.space/p/felix-anthropic) \u00b7 March 17, 2026\n\n---\n\n## Common Threads\n\n### The AI Production Platform Race Is On\n\nThree major launches this week \u2014 Fish Audio S2, Luma Agents/Uni-1, and Hume AI TADA \u2014 join last week's ElevenLabs Flows in the race to become the unified AI production environment. We've gone from zero credible multi-modal production tools to four in two weeks. None of them are ready to replace traditional production pipelines today, but the direction is unmistakable: the industry is converging on end-to-end AI creative platforms that handle video, audio, voice, and text in a single workflow.\n\n**What this means for us:** Start experimenting with at least one of these platforms now. The learning curve matters more than the specific tool choice \u2014 the skills transfer. We recommend Fish Audio S2 for audio teams (open source, word-level control) and keeping an eye on Luma Agents for full-pipeline experimentation.\n\n### Copyright Is the New Frontier Risk for AI Video\n\nThe Seedance 2.0 takedown, combined with expanding EU/US deepfake regulations and the Grammarly identity incident, makes one thing clear: intellectual property is the biggest unresolved risk in AI content generation. Studios are willing to sue. Regulators are advancing mandatory labeling. And platforms are scrambling to add content filters after the fact.\n\n**What this means for us:** We need an internal policy on AI-generated content provenance before we need one, not after. Any content produced with AI video tools should be documented: which tool, which prompts, which reference materials. This isn't bureaucracy \u2014 it's insurance.\n\n### \"AI Brain Fry\" Should Shape Our Adoption Strategy\n\nHard Fork's segment on cognitive fatigue from AI overuse deserves attention beyond just awareness. If heavy AI users are experiencing reduced critical thinking and over-delegation, our tool rollout strategy needs to account for it. The answer isn't slowing adoption \u2014 it's designing workflows where humans remain engaged decision-makers, not just prompt writers. Pair AI tools with explicit review checkpoints. Rotate between AI-assisted and manual work. And watch for signs of over-reliance.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Vidu Q3 \u2014 AI Built for Recurring Content\n\nEvery AI video tool optimizes for one-off generation. Vidu Q3 is the first to tackle serialized production \u2014 character consistency, lip-sync continuity, and asset reuse across episodes. If your team produces training videos, internal communications, or branded series, this is the first AI tool designed for how you actually work.\n\n**Source:** Vidu Q3 SXSW debut \u00b7 ~March 10, 2026\n\n### Fish Audio S2's Word-Level Emotion Tags\n\nInstead of selecting a single voice style for an entire narration, S2 lets you tag individual words with emotions: `[excited]`, `[somber]`, `[whispered]`. You're directing a performance, not just generating audio. This level of granularity hasn't existed in any TTS model before \u2014 commercial or open-source.\n\n**Source:** Fish Audio S2 release \u00b7 ~March 10, 2026\n\n### Claude Cowork's \"Skills\" System\n\nAnthropic's new agent uses markdown-based instruction files called \"skills\" to learn new capabilities \u2014 no code required. Write a plain-language instruction set, and the agent figures out the execution. For AV teams, this means you could automate complex workflows (ingest \u2192 transcribe \u2192 timestamp \u2192 clip \u2192 post) by writing a text file, not building an integration.\n\n**Source:** Latent Space \u2014 Felix Rieseberg / Anthropic \u00b7 March 17, 2026\n\n---\n\n## Tool of the Week\n\n### Fish Audio S2\n\n**What it does:** Open-source text-to-speech with word-level emotion control. Tag individual words with natural language emotions like `[excited]` or `[whispered]`. Supports 80 languages, zero-shot voice cloning, and sub-150ms latency.\n\n**Who it's for:** Audio producers, narration teams, localization workflows. Anyone who needs more creative control over AI voice output than \"pick a preset and hope for the best.\"\n\n**Pricing:** Free and open source. No usage restrictions.\n\n**Worth trying?** Absolutely. This is the most significant open-source TTS release since Coqui. The word-level emotion control is genuinely new \u2014 no commercial TTS offers this. The latency is production-ready. The 80-language support makes it immediately useful for localization. The only caveat: as an open-source model, you'll need some technical setup to run it locally. Cloud-hosted options are available but may have usage limits.\n\n**Link:** [fishaudio.ai](https://fishaudio.ai)\n\n---\n\n## Sources\n\n1. Fish Audio S2 announcement \u2014 ~March 10, 2026 \u2014 Open-source TTS with word-level emotion control\n2. Luma Labs Agents / Uni-1 announcement \u2014 ~March 11, 2026 \u2014 End-to-end creative AI agents\n3. Seedance 2.0 copyright takedown coverage \u2014 ~March 11, 2026 \u2014 ByteDance model shelved after studio cease-and-desists\n4. Vidu Q3 SXSW debut \u2014 ~March 10, 2026 \u2014 AI pipeline for animated series production\n5. Grok multi-image video generation \u2014 ~March 10, 2026 \u2014 xAI API at $0.05/second\n6. Hume AI TADA release \u2014 ~March 9, 2026 \u2014 Hallucination-free TTS under MIT license\n7. [NVIDIA GTC 2026](https://www.nvidia.com/gtc/) \u2014 March 10, 2026 \u2014 Vera Rubin, OpenClaw, 10x cheaper inference\n8. MCP joins Linux Foundation \u2014 ~March 11, 2026 \u2014 Open governance + 30 CVEs in 60 days\n9. GPT-5.4 \"28-day frontier model sprint\" \u2014 ~March 5, 2026 \u2014 Native computer use, 1M context\n10. EU/US deepfake regulation expansion \u2014 ~March 10, 2026 \u2014 Broadcast labeling requirements advancing\n11. [Dwarkesh Podcast \u2014 Dylan Patel](https://www.dwarkesh.com/p/dylan-patel) \u2014 March 13, 2026 \u2014 GPU economics and 3 compute bottlenecks\n12. [Hard Fork \u2014 \"A.I. Goes to War\"](https://www.nytimes.com/column/hard-fork) \u2014 March 13, 2026 \u2014 AI in conflict, \"AI Brain Fry,\" Grammarly identity theft\n13. [Latent Space \u2014 Claude Cowork](https://www.latent.space/p/felix-anthropic) \u2014 March 17, 2026 \u2014 Felix Rieseberg on VM-based AI agents and skills system\n14. No Priors \u2014 Simon Last / Notion \u2014 March 12, 2026 \u2014 Autonomous agents and the 1,000X engineer\n15. AI Daily Brief \u2014 \"AI's Second Moment\" \u2014 March 16, 2026 \u2014 Agentic wave, ByteDance model shelving\n16. [Last Week in AI #237](https://lastweekin.ai/p/lwiai-podcast-237-nemotron-3-super) \u2014 March 16, 2026 \u2014 Nemotron 3 Super, Anthropic vs. Pentagon\n17. Practical AI Ep. 349 \u2014 \"Humility in Agentic Coding\" \u2014 March 17, 2026 \u2014 Skeptic-to-builder narrative\n18. [TWIML AI Ep. 763](https://twimlai.com/podcast/twimlai/agent-swarms-knowledge-graphs-autonomous-software-development) \u2014 March 10, 2026 \u2014 Agent swarms and knowledge graphs\n19. Machine Learning Street Talk \u2014 Robert Lange / Sakana AI \u2014 March 13, 2026 \u2014 Evolutionary AI architecture search\n20. Eye on AI #326 \u2014 Pathway's real-time AI systems \u2014 March 11, 2026 \u2014 Live data processing for AI\n21. AI video model benchmark comparisons \u2014 ~March 8, 2026 \u2014 Updated Kling/Sora/Veo/Gen-4.5/Seedance rankings\n\n---\n\n*The AV AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
    const HAS_AUDIO = true;
