  <script>
    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of March 13, 2026\n\n> ElevenLabs just launched a node-based production canvas that combines 35+ visual AI models with voice, music, and sound effects \u2014 and it might be the first tool that actually deserves the label \"AI production platform.\"\n\n---\n\n## This Week in AI\n\n### ElevenLabs Flows: The First Real AI Production Canvas\n\nIf you only pay attention to one thing this week, make it this. ElevenLabs \u2014 the company most of us know for AI voice generation \u2014 launched [Flows](https://elevenlabs.io/flows), a node-based creative canvas that connects over 35 visual AI models alongside their text-to-speech, voice cloning, lip-sync, music generation, and sound effects tools. You build pipelines by wiring nodes together visually, similar to how Unreal Engine's blueprint system works but for media production.\n\nWhy this matters for us: this is the first serious attempt at a unified AI production environment. Instead of juggling six different AI tools and manually stitching outputs together, Flows lets you build an end-to-end pipeline in one interface. It's early, but the direction is significant.\n\n**Source:** [@ElevenLabsio on X](https://x.com/ElevenLabsio) \u00b7 March 11, 2026\n\n### Sora Is Coming to ChatGPT \u2014 900 Million Weekly Users Could Get Video Generation\n\nReuters and The Information [reported](https://mobile.reuters.com/business/openai-plans-launch-its-sora-video-tool-chatgpt-information-reports-2026-03-11/) that OpenAI plans to integrate [Sora](https://openai.com/sora), their text-to-video model, directly into ChatGPT. If it ships, that puts AI video generation in front of ChatGPT's 900 million weekly active users \u2014 inside a tool they already use daily. The report reignited debate about deepfake risks and content authenticity, with media outlets and AI safety researchers pushing back on deployment at this scale without robust watermarking. OpenAI has not officially confirmed the timeline.\n\nFor AV teams, this is less about using Sora ourselves and more about understanding that the volume of AI-generated video content is about to increase dramatically. Knowing what AI-generated footage looks like \u2014 and how to verify authenticity \u2014 is becoming a core AV competency.\n\n**Source:** [Reuters](https://mobile.reuters.com/business/openai-plans-launch-its-sora-video-tool-chatgpt-information-reports-2026-03-11/) \u00b7 March 11, 2026\n\n### The AI Video Model Wars: No Winner, Just Different Strengths\n\nThe AI video generation space had a wild week of community benchmarks and side-by-side comparisons. The consensus? There's no single winner:\n\n- **Kling 3.0** (Kuaishou) \u2014 best visual quality and value; first to hit native 4K at 60fps\n- **Sora 2** (OpenAI) \u2014 strongest physics simulation; objects maintain persistent identity\n- **Veo 3.1** (Google DeepMind) \u2014 best audio and dialogue; 48kHz native audio with superior lip-sync\n- **Runway Gen-4 Turbo** \u2014 production-viable but no longer leading any single category\n\nThe takeaway for our team: multi-tool literacy is now required. The days of picking one video AI tool and standardizing on it are over. Different jobs need different tools.\n\n**Source:** Multiple community analysis threads on X \u00b7 ~March 5\u201310, 2026\n\n### YouTube Tightens the Deepfake Rules\n\nYouTube announced expanded AI deepfake detection and mandatory labeling, specifically targeting synthetic content depicting politicians and journalists. The platform will require creators to disclose AI-generated content and will add labels automatically when its own detection systems flag something. This builds on their existing \"altered content\" policies but significantly expands the scope.\n\nIf our team produces or distributes any content on YouTube, these new labeling requirements affect us directly. Even content that uses AI in the production pipeline (not just fully synthetic content) may fall under disclosure requirements.\n\n**Source:** [@YouTube on X](https://x.com/YouTube) \u00b7 ~March 10, 2026\n\n### Karpathy's \"Autoresearch\" Hits 8.6 Million Views\n\nAndrej Karpathy released [Autoresearch](https://github.com/karpathy/autoresearch), an open-source framework where AI agents autonomously conduct research \u2014 reading papers, running experiments, and writing reports. It hit 28,000 GitHub stars in days. Karpathy positioned it as \"what AI agents should actually be doing\" rather than chatbot back-and-forth. Fun fact: the newsletter you're reading right now was built using a similar agentic research pattern.\n\n**Source:** [@karpathy on X](https://x.com/karpathy) \u00b7 ~March 6\u20139, 2026\n\n---\n\n## Voices This Week\n\n### Rick Beato on AI in Music Production\n\nRick Beato \u2014 musician, producer, and one of the biggest music YouTubers \u2014 shared a perspective that's directly relevant to anyone on the audio side of our team: *\"AI stem separation changed my workflow overnight. I can isolate any instrument from any recording now. Five years ago that was impossible.\"*\n\nBut Beato also drew a sharp line. He framed the creative AI tension not as \"AI vs. humans\" but as **democratization vs. devaluation**: AI tools that enhance human creativity (like stem separation) are a net positive. AI tools that replace human creativity (like full song generation via Suno or Udio) risk devaluing the entire profession. That framework applies directly to video work too \u2014 auto-captioning and noise reduction enhance our craft; fully AI-generated videos from text prompts challenge it.\n\n### Kevin Roose on AI-Generated \"Slop\"\n\nKevin Roose raised an alarm about AI-generated content flooding YouTube \u2014 specifically low-quality AI videos targeting children that are racking up millions of views with zero human review. He called it *\"an actual child safety issue\"* and tied it to the broader question of what happens when platforms can't distinguish between human-made and AI-generated content at scale. For our team, this connects directly to the content authenticity discussion. As AI-generated media becomes harder to distinguish from human-created content, the standards for disclosure and verification matter more than ever.\n\n### Aaron Levie on Agent Governance\n\nBox CEO Aaron Levie argued that *\"every agent needs a Box\"* \u2014 you can't have AI agents accessing files across your company without governance. With agents gaining the ability to operate across file systems, databases, and media libraries, the question of access control becomes critical.\n\n### Sebastian Raschka on the Next Phase of AI\n\nAI researcher Sebastian Raschka offered a concise summary of where the field is heading: *\"We're moving from scale-everything to reason-about-everything. The models that win in 2026 will be the ones that think, not the ones that memorize.\"*\n\n---\n\n## Common Threads\n\n### AI Agents Are Everywhere \u2014 But Nobody's Solved Safety\n\nThis was the week's dominant theme. GPT-5.4 launched with native computer use (it can operate desktop apps). Karpathy released Autoresearch. NVIDIA shipped an agent-optimized model. Datadog built MCP observability. The agentic future is arriving fast.\n\nBut simultaneously, a developer shared that Claude Code \u2014 Anthropic's AI coding agent \u2014 [accidentally wiped a production database](https://x.com/Al_Grigor), sparking a massive safety debate. Aaron Levie's point about governance applies directly: you can't have AI agents accessing files across your company without guardrails. Boris Cherny from Anthropic shared safety lessons from Claude Code's first year \u2014 the \"100% self-written\" milestone sounds impressive, but the real story is what went wrong along the way and what they learned.\n\n**What this means for us:** If we're going to use AI agents in our workflows \u2014 and we will \u2014 we need to be intentional about what they can and can't access. An agent with write access to a media library could accidentally delete raw footage or share unreleased content. Start thinking about sandboxing and access control now, before these tools are everywhere.\n\n### The Model Race Is Now About Speed, Not Size\n\nMultiple sources this week pointed to a paradigm shift. The AI race isn't about who builds the biggest model anymore \u2014 it's about who runs inference most efficiently. NVIDIA's Dynamo team introduced a \"Speed of Light\" framework showing most teams are running AI workloads at just 20\u201330% of their hardware's theoretical capacity. AMD's Sharon Zhou described AI models writing their own GPU kernels and finding *\"optimizations that human engineers would never think of\"* \u2014 delivering 20\u201330% automatic speedups.\n\n**What this means for us:** AI-powered AV tools are going to get faster and cheaper without us doing anything. But teams that understand their hardware utilization \u2014 and push for optimized inference \u2014 will get there first. If you're running AI models locally for rendering or voice processing, there's probably significant headroom in your current setup.\n\n### Content Authenticity Is No Longer Optional\n\nYouTube's expanded deepfake detection, the Sora-at-scale concerns, and the growing conversation about AI-generated \"slop\" flooding platforms all converge on one point: disclosure and verification of AI-generated content is becoming a regulatory and platform requirement, not a nice-to-have. Any AV team producing content needs clear internal policies on when and how AI was used in the production pipeline \u2014 because platforms are starting to ask, and the answers will need to be documented.\n\n---\n\n## Novel Ideas Worth Watching\n\n### The \"Speed of Light\" Benchmark for AV AI\n\nNVIDIA's \"Speed of Light\" concept \u2014 measuring how close your AI workload is to the theoretical maximum throughput of your hardware \u2014 isn't new in computing, but applying it to AI inference is. If most teams are at 20\u201330% efficiency, that's 3\u20135x headroom without buying new hardware. AV teams running local AI models should be asking: \"How close to Speed of Light are we?\"\n\n### Democratization vs. Devaluation: A Framework for Creative AI\n\nRick Beato's framing gives us a useful mental model for evaluating every AI tool that touches creative work. AI tools that help professionals work faster (stem separation, auto-captioning, noise reduction) enhance value. AI tools that generate complete works from prompts (full song generation, text-to-video) risk devaluing the craft. Not every AI tool is the same, and this distinction should guide what our team adopts vs. monitors.\n\n---\n\n## Tool of the Week\n\n### ElevenLabs Flows\n\n**What it does:** A node-based creative canvas that connects 35+ visual AI models with ElevenLabs' full audio suite \u2014 text-to-speech, voice cloning, lip-sync, music generation, and sound effects. Build end-to-end audio/video production pipelines by wiring nodes together visually.\n\n**Who it's for:** AV producers who are tired of switching between six different AI tools and manually stitching outputs together. Early adopters and teams prototyping AI-assisted content workflows.\n\n**Pricing:** Free tier available. Paid plans start at $5/month for individual creators; team and enterprise tiers available.\n\n**Worth trying?** Yes, but with realistic expectations. This is a v1 product and the node-based interface takes some learning. The vision is compelling \u2014 a unified AI production environment \u2014 but the execution will need a few iterations. Worth experimenting with now so you're ready when it matures.\n\n**Link:** [elevenlabs.io/flows](https://elevenlabs.io/flows)\n\n---\n\n## Sources\n\n1. [@ElevenLabsio on X](https://x.com/ElevenLabsio) \u2014 March 11, 2026 \u2014 Flows product launch announcement\n2. [Reuters](https://mobile.reuters.com/business/openai-plans-launch-its-sora-video-tool-chatgpt-information-reports-2026-03-11/) \u2014 March 11, 2026 \u2014 Report: Sora integration planned for ChatGPT\n3. [Multiple community threads on X](https://x.com/search?q=AI+video+model+comparison) \u2014 ~March 5\u201310, 2026 \u2014 AI video model comparison benchmarks\n4. [@YouTube on X](https://x.com/YouTube) \u2014 ~March 10, 2026 \u2014 Deepfake detection expansion announcement\n5. [@karpathy on X](https://x.com/karpathy) \u2014 ~March 6\u20139, 2026 \u2014 Autoresearch launch (8.6M views)\n6. [Autoresearch on GitHub](https://github.com/karpathy/autoresearch) \u2014 28K+ stars\n7. [@OpenAI on X](https://x.com/OpenAI) \u2014 ~March 5, 2026 \u2014 GPT-5.4 launch with computer use and 1M context\n8. [@NVIDIA on X](https://x.com/nvidia) \u2014 March 11, 2026 \u2014 Nemotron 3 Super announcement\n9. [@Al_Grigor on X](https://x.com/Al_Grigor) \u2014 ~March 9, 2026 \u2014 Claude Code production database incident\n10. [@AnthropicAI on X](https://x.com/AnthropicAI) \u2014 ~March 3, 2026 \u2014 Claude 5 GPQA Diamond benchmark\n11. [@datadoghq on X](https://x.com/datadoghq) \u2014 March 9, 2026 \u2014 MCP server launch for AI agent observability\n12. [ElevenLabs Flows](https://elevenlabs.io/flows) \u2014 Product page\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
    const HAS_AUDIO = false;
