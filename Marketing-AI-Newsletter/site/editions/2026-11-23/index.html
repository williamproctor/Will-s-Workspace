    initEditionApp(document.getElementById("editionApp"), {
      slug: "2026-11-23",
      editionTitle: "Week of November 23, 2026",
      editionMd: "# Monday Signal \u2014 Week of November 23, 2026\n\n> **Meta's Muse reached Australia and Loblaw's banners in Canada in the last week before Black Friday; GeekWire reported on Tuesday, November 17, that Muse's shopping skill now says \"Do not search Amazon,\" and Andy Jassy said opening Amazon to outside agents takes \"a fair exchange of value\"; and on Thursday, Salesforce put $75.8 billion of a forecast $357 billion global Cyber Week \"influenced by AI and agents,\" projecting that \"Twenty percent of holiday shopping traffic will be nonhuman.\"** Microsoft launched ads in Bing's AI Overviews and rebuilt its bidding; Anthropic priced its IPO at $83 and closed its first day at $97.17, with no ad product in its prospectus as we read it; Google's homepage added a sidebar for recent AI searches, and Brodie Clark reported a site whose AI opt-out barely moved its clicks; Dentsu cut its organic growth guidance to \"c. (1)%\" as Bloomreach bought AthenaHQ; and Coca-Cola's US holiday ad switched from AI to live action. On the feed, Think with Google told CMOs, \"AI didn't make your brand invisible in Search. Your content did.\"; Malte Landwehr said \"Two domains that publicly spoke about the scaled rollout of AI content in the past lost Google rankings\" in the core update; and Metehan Ye\u015filyurt wrote, \"ChatGPT just turned Black Friday coupons into a widget.\"\n\n---\n\n## The Conversation\n\n### Think with Google said content, not AI, made brands invisible in Search, and site owners pointed at AI Overviews\n\nOn Thursday, November 19, Google's Think with Google account posted on X, \"AI didn't make your brand invisible in Search. Your content did.\" Search Engine Journal reports that the post pairs \"Stop the 'Top 10' listicle\" with \"start leading with first-hand expertise,\" and another of its three moves for CMOs begins \"Stop trusting proxy scores.\" In the linked October 14 article, Brendon Kraham, VP of Search & Commerce Global Ads Solutions, has a running store skip a generic \"Top 10 Things to Consider\" to \"create a deep-dive video analyzing exactly why a specific customer's running shoes collapsed,\" and tells marketers to plan on \"real business goals like leads or sales, not unproven proxy metrics.\" It's a marketing post recirculating an ads-side article, not a ranking change.\n\nLily Ray posted, \"Wow did Google really just tell CMOs to stop with the top 10 listicles?\" and Eli Schwartz rewrote the moves \"without being sanitized by the PR team,\" with the proxy-score line reading \"AEO VISIBILITY IS NOT REAL.\" (both via Search Engine Journal, which notes that \"Neither the article nor the guide mentions self-promotional 'best' lists\"). In replies collected by Search Engine Land, Daniel Foley Carter wrote that \"AI overviews have been a nightmare for SEOs and digital marketers / site owners who took the time to create content to attract target customers/visitors,\" and the recipe site Inspired Taste wrote, \"Google is lying with full Frankenstein recipes AIOs by using our brand name on mangled versions of our recipes.\" AEO Sherpa, whose author's agency sells AI-visibility work, cited Seeably's October study of 6,682 local businesses, in which lists and articles drew 52.7% of AI-answer citations.\n\n**Comment window:** open now; the post links an evergreen CMO guide, so it'll keep circulating through Cyber Week. Kraham's running-store example answers one customer's problem, the material that sits in support tickets, returns notes and sales calls, so it comes from the people who talk to customers and can be measured his way, by \"leads or sales.\"\n\n**Source:** [Kraham's article](https://business.google.com/us/think/search-and-video/brand-authority-generative-ai-search/) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/google-told-cmos-to-stop-top-10-listicles/598310/) \u00b7 [Search Engine Land](https://searchengineland.com/google-ai-search-advice-seo-backlash-502610) \u00b7 [AEO Sherpa](https://aeosherpa.com/news/google-says-stop-listicles-ai-cites-them-anyway) \u00b7 November 19\u201320, 2026\n\n### Malte Landwehr said two domains that publicized scaled AI content lost rankings as the core update hit from November 13\n\nOn Monday, November 16, Malte Landwehr, CPO and CMO of Peec AI, which sells AI-search visibility tracking, posted on X, \"Two domains that publicly spoke about the scaled rollout of AI content in the past lost Google rankings in the November 2026 Core Update.\" He didn't name the domains. Glenn Gabe posted that morning that the two were \"dropping pretty heavily so far and were scaling heavily via AI-generated content\" (via Search Engine Roundtable), and on Tuesday he dated the update from Search Console data on LinkedIn: \"I believe the update landed on Friday the 13th (Jason would be proud)... I'm seeing a lot of movement on 11/13 and beyond for sites impacted.\" SISTRIX agrees that \"Changes are visible in UK and US data from the 13th November\" and finds \"no particular sector that has been affected more than others.\"\n\nGoogle hasn't tied the update to AI content; SER quotes its launch line calling this \"a regular update designed to better surface relevant, satisfying content for searchers from all types of sites.\" On Thursday, Lily Ray wrote in an essay that \"content made for search engines at scale, with no human reviewing it, adding to it, or standing behind it, eventually becomes a liability,\" and on Friday Gabe expected the update to \"complete by early next week\" (via SER).\n\n**Comment window:** open through the rollout's end (about November 24) and into Cyber Week. Group your pages by publish quarter and compare each cohort's Search Console clicks from November 13 with the two weeks before. If the newest cohort fell while older pages held, review how those pages were produced and checked; if everything moved together, SISTRIX's \"no particular sector\" reading fits better. Decide nothing before Google posts completion.\n\n*Editor's note, added at publication on November 23: When we checked, the Search Status Dashboard still showed only the November 10 entry for the core update, with no completion posted. [Google Search Status Dashboard](https://status.search.google.com/incidents/WLxcJyC6jMWMfryxsKMc)*\n\n**Source:** [Landwehr on X](https://x.com/MalteLandwehr/status/2122235819385598039) \u00b7 [Landwehr's bio (Peec AI)](https://peec.ai/authors/malte-landwehr) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-november-2026-core-update-ranking-volatility-42543.html) \u00b7 [Gabe's post](https://www.linkedin.com/posts/glenngabe_good-morning-google-land-this-is-the-november-activity-7528454644071780352-fC_1) \u00b7 [SISTRIX](https://www.sistrix.com/blog/november-2026-core-update-radar-visibility-analysis/) \u00b7 [Ray's essay](https://lilyraynyc.substack.com/p/why-building-trust-through-real-people) \u00b7 November 16\u201320, 2026\n\n### ChatGPT answers started carrying Black Friday coupon codes with Copy buttons, and coupon sites may lose the click\n\nOn Thursday, November 19, Metehan Ye\u015filyurt posted on LinkedIn, \"ChatGPT just turned Black Friday coupons into a widget.\" His hosting-coupon prompts returned a card for each brand with an end date, the code with a Copy button and a \"Get deal\" button, sourced through \"a small 'Hostinger +5' pill at the top.\" He wrote, \"This is bad news for coupon and affiliate sites. Their model is the click... If the code is already on the card with a Copy button, why would anyone click?\" On his Substack he added, \"In the Black Friday prompts I track, these deal cards went from about 3% to 16% of ChatGPT answers that show products, in just four weeks.\"\n\nGlenn Gabe saw the cards only in ChatGPT's free version and posted that this \"basically cuts out the coupon code websites completely,\" while \"For retailers, it's providing codes directly from them, so that won't hurt them really.\" At SER, Barry Schwartz noted that \"Google has been doing this in their ads for a decade now,\" and Google's Black Friday post on Monday said Universal Cart \"shows you merchant promo codes and offers.\" Ye\u015filyurt isn't sure \"if this is a test or a rollout\" or where \"Get deal\" sends you, and we found no statement from OpenAI. Under his post, Kristof George noted that \"several affiliate networks can credit a sale to whoever owns the coupon code even with no click or cookie.\"\n\n**Comment window:** open through Cyber Monday (November 30), after which Ye\u015filyurt \"will check again.\" A shopper who copies a code from a card and types your URL shows up in GA4 as direct or organic, so count redemptions: give the code on your official promo page (his advice for brands) a name used nowhere else and compare it with your affiliate and email codes, and if you're an affiliate, ask your network whether a code redeemed with no click still pays.\n\n**Source:** [Ye\u015filyurt's post](https://www.linkedin.com/feed/update/urn:li:ugcPost:7529194932222185472/) \u00b7 [Ye\u015filyurt's Substack](https://metehanai.substack.com/p/chatgpt-is-giving-out-black-friday) \u00b7 [Gabe on Threads](https://www.threads.com/@glenngabe/post/Df7wazVm2jc/i-shared-this-morning-about-ai-os-triggering-for-coupon-code-queries-which-is/) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-chatgpt-coupon-codes-42581.html) \u00b7 [Google](https://blog.google/products-and-platforms/products/shopping/black-friday-cyber-monday-shopping-tips-2026/) \u00b7 November 16\u201320, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and stages where the week's arguments actually happened.\n\n- **Lily Ray, Algorythmic and Amsive** (her Substack, November 19): \"When it comes to organic search marketing, a loophole is not a strategy.\" [The essay](https://lilyraynyc.substack.com/p/why-building-trust-through-real-people)\n- **Metehan Ye\u015filyurt** (LinkedIn, November 19): \"This looks like the first Black Friday where the answer itself is the deal page.\" [The post](https://www.linkedin.com/feed/update/urn:li:ugcPost:7529194932222185472/)\n- **Areeba Malik** (LinkedIn, commenting on Ye\u015filyurt's November 19 post): \"If the answer itself is the storefront, then being the source matters more than being the destination.\" [The post](https://www.linkedin.com/feed/update/urn:li:ugcPost:7529194932222185472/)\n- **Brodie Clark** (LinkedIn, November 22): \"Google really needs to figure out how to make its AI features more valuable to websites.\" [The post](https://www.linkedin.com/posts/brodieclark_this-has-been-pretty-eye-opening-to-witness-activity-7530248034346262528-lA5R)\n- **Andy Jassy, CEO, Amazon** (on stage at a Semafor event, November 17, via Business Insider): \"Well, I don't think that we've said we're not going to open it up\" [Business Insider](https://www.businessinsider.com/amazon-ai-shopping-agents-muse-instinct-dots-2026-11)\n- **Molly Shaheen, Google** (Google's blog, November 16): \"Universal Cart can act as your central game plan for Black Friday and Cyber Monday.\" [Google](https://blog.google/products-and-platforms/products/shopping/black-friday-cyber-monday-shopping-tips-2026/)\n- **Dario Amodei, CEO, Anthropic** (via CNBC, November 19): \"Today puts the company in a stronger financial position, and in doing so, only strengthens our resolve to do the right thing\" [CNBC](https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html)\n- **Stacy Jackson, VP, Coca-Cola Trademark, Coca-Cola North America** (Coca-Cola's release, November 19): \"People look forward to seeing how we'll show up each year, whether it's through the traditions they know and love or something entirely unexpected\" [Coca-Cola](https://www.coca-colacompany.com/media-center/coca-cola-2026-holiday-campaign)\n\n---\n\n## This Week in Marketing AI\n\n### Muse's shopping skill now says \"Do not search Amazon,\" and Jassy wants \"a fair exchange of value\" from outside agents\n\nMeta's Muse launched in Australia on Tuesday, November 17, with connectors from partners such as Kogan, MECCA and ShopBack \"rolling out progressively.\" \"With the festive season coming up, the timing couldn't be better,\" said Will Easton, Meta's managing director for Australia and New Zealand. On Wednesday, Loblaw became Muse's first Canadian retail connector (\"Starting today, shoppers can plan meals, build their basket and check out with participating Loblaw banners, all in Muse\"); Meta says Muse \"checks with you before sensitive actions such as sending an email or making a purchase.\"\n\nGeekWire reported Tuesday that Muse's shopping skill now tells it to \"leave out Amazon unless the user asks for it\" and \"Do not search Amazon,\" a change Juozas Kaziuk\u0117nas spotted on Friday, November 13, and summed up as \"Amazon blocked Muse, so now Muse blocked Amazon\" (his account). At a Semafor event on Tuesday, Andy Jassy said that for outside agents, \"it has to be a good customer experience, which it hasn't been to date, and it has to be a fair exchange of value\" (via Business Insider); the same day, Amazon.com.au joined YouTube Shopping's new Australian affiliate program. Klarna introduced an assistant that \"handles shopping, returns, bookings, and everyday admin\" over WhatsApp and iMessage, \"Currently live with a small group of early users,\" and on Wednesday Google's Demand Gen ads added \"checkout links or Universal Commerce Protocol-enabled checkout.\"\n\nOn Thursday, Salesforce forecast that Cyber Week (November 24\u201330) \"will drive a record $357 billion in global online sales, and $75.8 billion of that figure will be influenced by AI and agents,\" and that \"Twenty percent of holiday shopping traffic will be nonhuman.\" On November 12 it said AI \"is projected to drive\" the same $75.8 billion; the new release makes the figure global but doesn't define \"influenced\" or say whether the nonhuman share counts bots and scrapers or only agents. Salesforce sells commerce software.\n\n**Source:** [Meta, Australia](https://about.fb.com/news/2026/11/muse-is-now-available-in-australia/) \u00b7 [Meta, Loblaw](https://about.fb.com/news/2026/11/meta-welcomes-loblaw-as-first-canadian-retail-partner-to-muse/) \u00b7 [GeekWire](https://www.geekwire.com/2026/do-not-search-amazon-metas-muse-now-shops-elsewhere-by-default/) \u00b7 [Business Insider](https://www.businessinsider.com/amazon-ai-shopping-agents-muse-instinct-dots-2026-11) \u00b7 [Google Australia](https://blog.google/intl/en-au/products/connect-communicate/youtube-shopping-affiliate-program-in-australia/) \u00b7 [Klarna](https://investors.klarna.com/News--Events/news/news-details/2026/From-returns-to-restaurant-bookings-Klarnas-AI-assistant-finds-the-best-product--price-buys-it-for-you-and-you-dont-pay-until-it-arrives-2026-AsJ__j3bx3/default.aspx) \u00b7 [Google's Demand Gen Drop](https://blog.google/products/ads-commerce/demand-gen-drop-november-2026/) \u00b7 [Salesforce, November 19](https://www.salesforce.com/news/stories/cyber-week-ai-sales-2026/) \u00b7 [Salesforce, November 12](https://www.salesforce.com/news/stories/ai-first-holiday/) \u00b7 November 13\u201319, 2026\n\n### Microsoft launched ads in Bing's AI Overviews with no separate setup and rebuilt its bidding models\n\nOn Thursday, November 19, Microsoft Advertising said \"Ads in AI Overviews are now available in all markets except China,\" and \"There's no separate campaign set-up required\" for eligible campaigns, which include \"Performance Max and AI Max.\" Last week we reported SER's sighting of unannounced ads at the top of Bing's AI Mode; this launch covers AI Overviews. Microsoft's case is that \"Search is changing from a list of links to a faster path to an answer\" and that \"Microsoft data shows a 21% increase in purchases after a Copilot interaction,\" a figure its footnote takes from \"global Edge users, December 21\u201331, 2024.\" The post says \"AI content transparency controls are now generally available,\" and Search Engine Land reported Friday that AI-generated ad images now carry \"Made with AI\" labels; PPC Newsfeed reads Microsoft's help page as applying watermarks only in the EU and New York State. Microsoft's new Discover feed \"shows 35% fewer ads per page.\"\n\nA day earlier, Microsoft announced \"its biggest upgrade to bidding models in a decade,\" explaining, \"We rebuilt that prediction model with new user signals and a better way of valuing each conversion.\" Bids now adjust \"nearly twice as quickly,\" and in August tests advertisers saw \"10% more conversion value per click at a similar ROAS.\" The 8% lift it reports for moving from tCPA to tROAS (August\u2013September) and the 18% for moving from eCPC to Max Conversions with a CPA target (June\u2013July) compare strategy switches, so they don't isolate the new model. Microsoft says, \"There's more to come in 2027.\"\n\n**Source:** [Microsoft Advertising, November 19](https://about.ads.microsoft.com/en/blog/post/november-2026/put-ai-to-work-engaging-customers-in-more-places-whats-new-in-microsoft-advertising-this-november) \u00b7 [Microsoft Advertising, November 18](https://about.ads.microsoft.com/en/blog/post/november-2026/building-the-next-generation-of-automated-bidding-at-microsoft-advertising) \u00b7 [Search Engine Land](https://searchengineland.com/microsoft-ads-adds-made-with-ai-labels-to-ai-generated-ad-images-502652) \u00b7 [PPC Newsfeed](https://ppcnewsfeed.com/ppc-news/2026-11/ai-watermark-guide-published-microsoft-ads/) \u00b7 November 18\u201320, 2026\n\n### Anthropic priced its IPO at $83, closed its first day at $97.17, and described no ad product in its prospectus\n\nAnthropic priced 980 million shares at $83 on Wednesday, November 18, above the $70\u2013$78 range it set for 825 million shares when its roadshow opened on November 10, and they began trading on Nasdaq as ANT on Thursday. Its pricing filing puts the offering at $81.34 billion before the underwriters' option on 147 million more shares, alongside a concurrent $26.0 billion private placement. The stock opened at $111.50 and closed at $97.17, up 17%, a \"fully diluted market cap of roughly $1.8 trillion\" by CNBC's measure, and \"More than 846 million shares changed hands.\"\n\nThe prospectus says, \"Enterprise customers embed Claude in business-critical workflows, driving stronger retention and higher monetization than consumer AI.\" Anthropic plans to \"invest in brand and marketing,\" and its 2025 marketing and advertising expense rose $170 million on \"higher media and public relations spend to support product launches.\" Its consumer plans are Claude Pro, Max and Ultra, and as we read the prospectus, it describes no advertising product, while OpenAI sells ads in ChatGPT. We covered the S-1 in our November 2 edition.\n\n**Source:** [Anthropic](https://www.anthropic.com/news/anthropic-prices-initial-public-offering) \u00b7 [Pricing filing (SEC)](https://www.sec.gov/Archives/edgar/data/2130357/000162828026074937/anthropicpbc-fwppricing.htm) \u00b7 [Prospectus (SEC)](https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm) \u00b7 [CNBC](https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html) \u00b7 November 18\u201319, 2026\n\n### Google's desktop homepage added a sidebar for recent AI searches, and a site's AI opt-out barely moved its clicks\n\nRobby Stein, Google's VP of product for Search, posted on Thursday, November 19, \"New on the Google desktop homepage globally: we're rolling out a collapsible sidebar to easily find & jump back into your recent AI searches,\" adding that \"in testing, this sidebar made a big difference for making progress & continuing to explore the web\" (as Search Engine Land quotes him; he gave no figures). Android Authority reported Friday that the homepage is dropping its \"Google Search\" button and adding buttons for Nano Banana, uploads and \"Brainstorm\"; we found no Google statement on the button. On Tuesday, SER reported that AI Overview citations are no longer faded, quoting Brodie Clark: \"This is the first time in a while that they have made an update that actually makes the citations more visible compared to the default display.\"\n\nOn Sunday, Clark posted on LinkedIn that a site had \"completely excluded itself from generative AI features (AI Overviews and AI Mode) using the new AI controls in GSC,\" and \"Hundreds of thousands of daily impressions are gone. The result on clicks? Barely even noticeable.\" He didn't name the site or publish figures, dates or a chart, per PPC Land, which says Search Console's control reached all sites on August 31 and also covers Discover's generative AI features. When Cyrus Shepard opted a site out in October (our November 2 edition), its regular organic clicks fell too.\n\n**Source:** [Search Engine Land](https://searchengineland.com/google-rolling-out-a-collapsible-sidebar-for-google-search-502587) \u00b7 [Android Authority](https://www.androidauthority.com/google-homepage-search-button-gone-ai-mode-3737641/) \u00b7 [SER on citations](https://www.seroundtable.com/google-ai-overviews-with-unfaded-citations-42563.html) \u00b7 [Clark's post](https://www.linkedin.com/posts/brodieclark_this-has-been-pretty-eye-opening-to-witness-activity-7530248034346262528-lA5R) \u00b7 [PPC Land](https://ppc.land/site-exits-google-ai-overviews-and-ai-mode-clicks-barely-move/) \u00b7 November 17\u201322, 2026\n\n### Dentsu cut its organic growth guidance to \"c. (1)%\" and Bloomreach bought the AEO platform AthenaHQ\n\nDentsu reported a 3.7% organic decline for the third quarter on Monday, November 16. APAC grew 10.3%, while the Americas fell 6.5%, EMEA 7.1% and Japan 2.4%, and organic growth over nine months was down 1.0%. Its results deck says, \"Organic growth guidance is changed from '0-1%' to 'c. (1)%.' Below table is unchanged from February,\" so the financial forecast table stands while the organic outlook moved down. The deck adds that \"Internet advertising delivered double-digit turnover growth for the 11th consecutive quarter,\" and on the call, management said the Americas' CXM business grew for \"the first time in four years\" and expects a \"broadly flat\" fourth quarter (per a third-party transcript).\n\nThe same day, Bloomreach acquired AthenaHQ, a Y Combinator-backed AEO platform founded by Andrew Yan and Alan Yao, for an undisclosed price. Bloomreach's release headline calls AthenaHQ an AEO leader and frames the deal as turning AI visibility into measurable revenue.\n\n**Source:** [Dentsu's results deck (PDF)](https://www.nikkei.com/markets/ir/irftp/data/tdnr/tdnetg3/20261116/g8gtrc/140120261116580808.pdf) \u00b7 [Call transcript (Stock Analysis)](https://stockanalysis.com/quote/tyo/4324/transcripts/733803-q3-2026/) \u00b7 [Bloomreach](https://www.bloomreach.com/en/news/2026/as-ai-reshapes-how-consumers-discover-brands-bloomreach-acquires-aeo-leader-athenahq-to-turn-ai-visibility-into-measurable-revenue/) \u00b7 November 16, 2026\n\n### Coca-Cola's US holiday ad switched from AI to live action, and the company says AI remains \"a tool\"\n\nCoca-Cola introduced \"Enjoy Joy,\" its US holiday campaign, on Thursday, November 19, in general-market and Hispanic versions, with a Holiday Caravan of \"six trucks making more than 270 stops in over 28 U.S. cities through December 20.\" The release doesn't mention AI. Marketing Dive reported first that the film is live action, made by Ogilvy within WPP Open X, after the brand's divisive AI-generated holiday ads. A Coca-Cola spokesperson told MediaPost, \"This does not signal a broader shift, as Coca-Cola continues to explore different creative approaches and emerging technologies to bring its storytelling to life,\" and \"Human storytellers remain at the center of the creative process, with AI serving as a tool to support and enhance creative expression where appropriate.\" Coca-Cola's UK Christmas ad, out since November 9, is AI-made. Our November 9 edition covered the Christmas-ad arguments over John Lewis and Dior.\n\n**Source:** [Coca-Cola](https://www.coca-colacompany.com/media-center/coca-cola-2026-holiday-campaign) \u00b7 [Marketing Dive](https://www.marketingdive.com/news/coca-cola-pivots-from-divisive-ai-generated-ads-for-holiday-campaign/875215/) \u00b7 [MediaPost](https://www.mediapost.com/publications/article/419592/coke-drops-enjoy-joy-with-key-ingredient-humans.html) \u00b7 November 19\u201320, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via Search Engine Roundtable's daily recaps for [November 16](https://www.seroundtable.com/recap-11-16-2026-42541.html), [17](https://www.seroundtable.com/recap-11-17-2026-42558.html), [18](https://www.seroundtable.com/recap-11-18-2026-42565.html), [19](https://www.seroundtable.com/recap-11-19-2026-42575.html) and [20](https://www.seroundtable.com/recap-11-20-2026-42583.html) and its [weekly video recap](https://www.seroundtable.com/video-11-20-2026-42577.html).*\n\n- **The Search Analytics API can now split branded queries.** Google added branded-query classification, the multimodal search type and filter lists on Monday, \"following ecosystem requests\"; branded data covers eligible properties from February 21, 2026. [Google Search Central](https://developers.google.com/search/blog/2026/11/search-analytics-api-update)\n- **AI Mode's hotel booking put Expedia's \"Continue on Google\" over a cheaper direct rate.** Lluc B. Penycate posted (via SER) that \"A pop-up pushing Expedia's 'Continue on Google' ($170) now covers the other provider: the hotel's own website. At $158.\" It's one user's sighting. [Search Engine Roundtable](https://www.seroundtable.com/google-hotel-continue-on-google-42568.html)\n- **ChatGPT Ads' legacy API fields now select Target CPA or Target CPC.** From Wednesday, November 18, legacy fields used to create a campaign \"will select Target CPA or Target CPC,\" the switch we flagged last week. *Editor's note, added at publication on November 23: OpenAI's help page, \"Updated: 6 hours ago\" when we read it, still said, \"We're adding dedicated Target CPA and Target CPC fields.\" [OpenAI Help](https://help.openai.com/en/articles/20001634-bidding-strategies-and-how-pricing-works-in-chatgpt-ads)*\n- **OpenAI rewrote its Business Hub terms after Digiday asked about them.** \"Hours after Digiday first contacted OpenAI on Nov. 18, the terms were revised,\" Digiday reported Friday; Section 5.2 now ties the release to claims arising from a business's Business Agent, per OpenAI, and mandatory arbitration and a class-action waiver remain, with 30 days to opt out. Digiday quotes Davis+Gilbert's Gary Kibel: \"This is certainly not an oversight because they put these terms out there.\" [Digiday](https://digiday.com/media/openai-rewrites-chatgpt-business-hub-terms-after-legal-language-raises-concerns/)\n- **Meta expects to engage publishers on its paused terms in early 2027.** Its Wednesday post says, \"In early 2027, we expect to further engage with news publishers, other stakeholders and regulators on updated terms that come out of this process before they are rolled out.\" [Meta](https://about.fb.com/news/2026/11/our-approach-to-updating-our-commercial-terms-of-service/)\n- **LinkedIn's Marketing API 202611 is live, with December 15 deadlines.** It adds a politicalIntent field and SHA256_PHONE matching in the Conversions API; from December 15, LinkedIn rejects EU-targeted campaigns that don't set politicalIntent, and the `surface` migration window closes. [Microsoft Learn](https://learn.microsoft.com/en-us/linkedin/marketing/integrations/recent-changes?view=li-lms-2026-11)\n- **Court dates moved.** November 18 orders moved FTC v. Amazon's joint status report and discovery plan to December 3, Google's second amended complaint against SerpApi is due December 10, and a November 19 scheduling order set Gannett v. Google's trial for October 25, 2027. [DocketBird (FTC v. Amazon)](https://www.docketbird.com/court-cases/Federal-Trade-Commission-et-al-v-Amazon-com-Inc/wawd-2:2026-cv-03097) \u00b7 [CourtListener (Google v. SerpApi)](https://www.courtlistener.com/docket/72059948/google-llc-v-serpapi-llc/) \u00b7 [DocketBird (Gannett v. Google)](https://www.docketbird.com/court-cases/Gannett-Co-Inc-v-Google-LLC-et-al/nysd-1:2023-cv-05177)\n- **OpenAI's shopping help page dropped \"nor influenced by any OpenAI partnerships.\"** AI Visibility Journal reported Thursday that captures from November 15 and 19 read \"Product results are not ads; how products and merchants are selected is described below,\" where a November 4 capture said results \"are not ads, nor influenced by any OpenAI partnerships.\" The removal alone doesn't show that partnerships influence results. [AI Visibility Journal](https://aivisibilityjournal.com/news/2026/11/openai-chatgpt-shopping-help-page-partnerships-line-removed/)\n\n---\n\n## Common Threads\n\n### The checkout moved into the answer\n\nMuse checks out Loblaw baskets inside the chat, Demand Gen ads can end in \"Universal Commerce Protocol-enabled checkout,\" and ChatGPT's deal cards carry the code and a \"Get deal\" button. Bing sells ads inside AI Overviews, AI Mode's hotel booking put Expedia's \"Continue on Google\" over the hotel's own site, and Salesforce projects that \"Twenty percent of holiday shopping traffic will be nonhuman.\"\n\n### Access turned into terms\n\nJassy set \"a fair exchange of value\" as a condition for opening Amazon to outside agents, and Muse now says \"Do not search Amazon.\" Meta expects talks on its paused terms in \"early 2027,\" OpenAI rewrote its Business Hub terms after Digiday's questions, and from December 15 LinkedIn rejects EU-targeted campaigns without a political-intent field.\n\n### The content arguments turned on human review\n\nLandwehr's two domains had spoken publicly about scaling AI content, and Ray drew her line at content \"with no human reviewing it, adding to it, or standing behind it.\" Think with Google asked CMOs for \"first-hand expertise,\" and Coca-Cola, whose US ad is live action, says human storytellers \"remain at the center of the creative process.\"\n\n### Impressions and outcomes came apart\n\nClark's site left AI Overviews and AI Mode and kept its clicks roughly level, and Kraham told marketers to plan on \"leads or sales, not unproven proxy metrics.\" A code copied from a ChatGPT card leaves no referral, Salesforce's $75.8 billion is \"influenced by\" AI and agents, and Microsoft's 21% purchase lift comes from Edge users in late December 2024.\n\n---\n\n## Angles for the Week\n\n### Ask ChatGPT, AI Mode and Bing for your own Black Friday codes\n\nAsk each for your brand's coupon code and Black Friday deal (in ChatGPT's free version, where Gabe saw the cards) and screenshot the codes, end dates and source pills. Then expire stale codes, post current ones with end dates on your official promo page, and give that page a code used nowhere else so its redemptions measure what the answers send; the cards may be a test. Window: now through Cyber Monday (November 30).\n\n### Run Google's running-store test on your tips and \"Top 10\" posts\n\nFor each generic tips or listicle post, write down the first-hand element only you can supply (a customer case, a test, your own data), rewrite or retire the posts with none, and source new pieces from support tickets, returns and sales calls. Measure survivors by \"leads or sales\"; Kraham's article is a marketing post, not a ranking change, and Seeably's study found lists still drawing AI citations. Window: now, with results read after the core update completes.\n\n### Check whether your Microsoft PMax and AI Max campaigns now serve in Bing's AI Overviews\n\nEligible campaigns, including \"Performance Max and AI Max,\" need \"no separate campaign set-up,\" so check the landing pages AI Max picks, which ad images carry \"Made with AI\" labels, and whether your rep can report by placement. Microsoft's bidding lifts come from its own strategy-switch comparisons, and its 21% purchase figure is from holiday 2024. Window: now through Cyber Monday (November 30).\n\n### Decide which shopping agents can buy from you, and on what terms\n\nList the agents that can reach your catalog (Muse's connectors, ChatGPT's shopping results, Google's Universal Cart and Demand Gen checkout links, Klarna's assistant), check how your bot rules treat them, and decide for each whether to block, allow or partner, which is Jassy's \"fair exchange of value\" question. Salesforce's 20% nonhuman share is a projection and Amazon's choice isn't everyone's, so the post frames the decision without advising either way. Window: before Black Friday (November 27).\n\n### Read the revised Business Hub terms before you claim, and calendar the arbitration opt-out\n\nOpenAI revised the terms on November 18 after Digiday's questions; they keep mandatory arbitration and a class-action waiver, with 30 days to opt out of arbitration. The post tells businesses to have counsel read the live version before claiming and to calendar the opt-out date, and says it isn't legal advice, since the terms have changed once already. Window: 30 days from accepting the terms.\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [Brendon Kraham \u2014 Building brand authority in the Gemini era of Search](https://business.google.com/us/think/search-and-video/brand-authority-generative-ai-search/) \u2014 October 14, 2026 \u2014 the running store, \"leads or sales\"\n2. [Malte Landwehr \u2014 X post](https://x.com/MalteLandwehr/status/2122235819385598039) \u2014 November 16, 2026 \u2014 the two domains\n3. [Peec AI \u2014 Malte Landwehr's author page](https://peec.ai/authors/malte-landwehr) \u2014 read November 23, 2026 \u2014 his role, Peec AI's business\n4. [Glenn Gabe \u2014 LinkedIn post](https://www.linkedin.com       simplifiedMd: "# Monday Signal \u2014 Week of November 23, 2026\n\n> **Meta's Muse reached Australia and Loblaw in the last week before Black Friday, GeekWire reported Nov 17 that its shopping skill now says \"Do not search Amazon,\" and Andy Jassy said opening Amazon to outside agents takes \"a fair exchange of value.\"** Microsoft put ads in Bing's AI Overviews, Anthropic's shares closed their first day at $97.17 after an $83 IPO, Dentsu cut its guidance, and Coca-Cola's US holiday ad went live action. On the feed, Think with Google told CMOs, \"AI didn't make your brand invisible in Search. Your content did.\"; Metehan Ye\u015filyurt wrote, \"ChatGPT just turned Black Friday coupons into a widget.\"\n\n---\n\n## The Conversation\n\n### Think with Google said content, not AI, made brands invisible in Search, and SEOs pushed back\n\nOn Nov 19 Think with Google paired \"Stop the 'Top 10' listicle\" with \"start leading with first-hand expertise\" in advice to CMOs, linking an ads-side article in which a running store could make a video on \"exactly why a specific customer's running shoes collapsed\"; it's a marketing post, not a ranking change. Eli Schwartz's version reads \"AEO VISIBILITY IS NOT REAL.\" (both via SEJ), and Daniel Foley Carter called AI Overviews \"a nightmare for SEOs and digital marketers\" (via SEL). [Search Engine Journal](https://www.searchenginejournal.com/google-told-cmos-to-stop-top-10-listicles/598310/) \u00b7 [Search Engine Land](https://searchengineland.com/google-ai-search-advice-seo-backlash-502610)\n\n### Malte Landwehr said two domains that publicized scaled AI content lost rankings in the core update\n\nLandwehr, of Peec AI, which sells AI-search visibility tracking, posted on Nov 16 that \"Two domains that publicly spoke about the scaled rollout of AI content in the past lost Google rankings\"; he didn't name them. Glenn Gabe and SISTRIX date the impact to Nov 13, SISTRIX sees \"no particular sector that has been affected more than others,\" and Google hasn't tied the update to AI content. Lily Ray wrote that content made \"for search engines at scale, with no human reviewing it\" eventually \"becomes a liability.\" *Editor's note (Nov 23): When we checked, the Search Status Dashboard still showed no completion for the update.* [Landwehr on X](https://x.com/MalteLandwehr/status/2122235819385598039) \u00b7 [SISTRIX](https://www.sistrix.com/blog/november-2026-core-update-radar-visibility-analysis/) \u00b7 [Ray's essay](https://lilyraynyc.substack.com/p/why-building-trust-through-real-people)\n\n### ChatGPT answers started carrying Black Friday coupon codes with Copy buttons\n\nOn Nov 19 Metehan Ye\u015filyurt posted, \"ChatGPT just turned Black Friday coupons into a widget\"; by his tracking the deal cards went \"from about 3% to 16% of ChatGPT answers that show products, in just four weeks.\" He isn't sure \"if this is a test or a rollout,\" and we found no OpenAI statement. [Ye\u015filyurt's post](https://www.linkedin.com/feed/update/urn:li:ugcPost:7529194932222185472/) \u00b7 [Ye\u015filyurt's Substack](https://metehanai.substack.com/p/chatgpt-is-giving-out-black-friday)\n\n---\n\n## Voices\n\n- **Lily Ray, Algorythmic and Amsive (her Substack, Nov 19):** \"When it comes to organic search marketing, a loophole is not a strategy.\" [The essay](https://lilyraynyc.substack.com/p/why-building-trust-through-real-people)\n- **Areeba Malik (LinkedIn comment, Nov 19):** \"If the answer itself is the storefront, then being the source matters more than being the destination.\" [The post](https://www.linkedin.com/feed/update/urn:li:ugcPost:7529194932222185472/)\n- **Andy Jassy, Amazon (Semafor event, Nov 17, via Business Insider):** \"Well, I don't think that we've said we're not going to open it up\" [Business Insider](https://www.businessinsider.com/amazon-ai-shopping-agents-muse-instinct-dots-2026-11)\n- **Brodie Clark (LinkedIn, Nov 22):** \"Google really needs to figure out how to make its AI features more valuable to websites.\" [The post](https://www.linkedin.com/posts/brodieclark_this-has-been-pretty-eye-opening-to-witness-activity-7530248034346262528-lA5R)\n\n---\n\n## This Week in Marketing AI\n\n### Muse's shopping skill now says \"Do not search Amazon,\" and Jassy wants \"a fair exchange of value\" from outside agents\n\nMuse launched in Australia on Nov 17 and added Loblaw, its first Canadian retailer, on Nov 18. Jassy said outside agents also need \"a good customer experience, which it hasn't been to date\" (via Business Insider), and Salesforce, which sells commerce software, projects that \"Twenty percent of holiday shopping traffic will be nonhuman\" without saying what counts. [GeekWire](https://www.geekwire.com/2026/do-not-search-amazon-metas-muse-now-shops-elsewhere-by-default/) \u00b7 [Business Insider](https://www.businessinsider.com/amazon-ai-shopping-agents-muse-instinct-dots-2026-11) \u00b7 [Salesforce](https://www.salesforce.com/news/stories/cyber-week-ai-sales-2026/)\n\n### Microsoft launched ads in Bing's AI Overviews and rebuilt its bidding models\n\nMicrosoft said Nov 19 that \"Ads in AI Overviews are now available in all markets except China,\" with \"no separate campaign set-up required\" for eligible campaigns, including Performance Max and AI Max. On Nov 18 it announced \"its biggest upgrade to bidding models in a decade\"; its reported lifts compare strategy switches, not the new model alone. [Microsoft Advertising, Nov 19](https://about.ads.microsoft.com/en/blog/post/november-2026/put-ai-to-work-engaging-customers-in-more-places-whats-new-in-microsoft-advertising-this-november) \u00b7 [Microsoft Advertising, Nov 18](https://about.ads.microsoft.com/en/blog/post/november-2026/building-the-next-generation-of-automated-bidding-at-microsoft-advertising)\n\n### Anthropic priced its IPO at $83, closed its first day at $97.17, and described no ad product\n\nAnthropic priced 980 million shares at $83 on Nov 18, above its $70\u2013$78 range, and closed its first Nasdaq day on Nov 19 at $97.17. Its prospectus plans to \"invest in brand and marketing\" and, as we read it, describes no advertising product. [Anthropic](https://www.anthropic.com/news/anthropic-prices-initial-public-offering) \u00b7 [Prospectus (SEC)](https://www.sec.gov/Archives/edgar/data/2130357/000162828026074944/anthropicpbc-424b4.htm) \u00b7 [CNBC](https://www.cnbc.com/2026/11/19/anthropic-ipo-ant-live-updates.html)\n\n### Google's homepage added a sidebar for recent AI searches, and a site's AI opt-out barely moved its clicks\n\nOn Nov 19 Robby Stein announced a desktop-homepage sidebar to \"jump back into your recent AI searches\" (via Search Engine Land). On Nov 22 Brodie Clark posted that a site that left AI Overviews and AI Mode saw an effect on clicks that was \"Barely even noticeable\"; he didn't name it or publish figures, per PPC Land. [Search Engine Land](https://searchengineland.com/google-rolling-out-a-collapsible-sidebar-for-google-search-502587) \u00b7 [Clark's post](https://www.linkedin.com/posts/brodieclark_this-has-been-pretty-eye-opening-to-witness-activity-7530248034346262528-lA5R) \u00b7 [PPC Land](https://ppc.land/site-exits-google-ai-overviews-and-ai-mode-clicks-barely-move/)\n\n### Dentsu cut its organic growth guidance to \"c. (1)%\" and Bloomreach bought AthenaHQ\n\nDentsu reported a 3.7% organic decline for the third quarter on Nov 16 and changed its organic growth guidance \"from '0-1%' to 'c. (1)%.'\" The same day Bloomreach bought AthenaHQ, a Y Combinator-backed AEO platform, for an undisclosed price. [Dentsu's results deck (PDF)](https://www.nikkei.com/markets/ir/irftp/data/tdnr/tdnetg3/20261116/g8gtrc/140120261116580808.pdf) \u00b7 [Bloomreach](https://www.bloomreach.com/en/news/2026/as-ai-reshapes-how-consumers-discover-brands-bloomreach-acquires-aeo-leader-athenahq-to-turn-ai-visibility-into-measurable-revenue/)\n\n### Coca-Cola's US holiday ad switched from AI to live action, and the company says AI remains \"a tool\"\n\nCoca-Cola's US \"Enjoy Joy\" campaign launched Nov 19 with a live-action film by Ogilvy, as Marketing Dive reported first, after the brand's divisive AI-generated holiday ads. A spokesperson told MediaPost, \"This does not signal a broader shift,\" and that human storytellers \"remain at the center of the creative process, with AI serving as a tool.\" [Marketing Dive](https://www.marketingdive.com/news/coca-cola-pivots-from-divisive-ai-generated-ads-for-holiday-campaign/875215/) \u00b7 [MediaPost](https://www.mediapost.com/publications/article/419592/coke-drops-enjoy-joy-with-key-ingredient-humans.html)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's daily recaps](https://www.seroundtable.com/recap-11-20-2026-42583.html) and its [weekly video recap](https://www.seroundtable.com/video-11-20-2026-42577.html).*\n\n- **The Search Analytics API can now split branded queries**, with branded data from Feb 21, 2026. [Google Search Central](https://developers.google.com/search/blog/2026/11/search-analytics-api-update)\n- **OpenAI revised its Business Hub terms \"Hours after Digiday first contacted OpenAI,\"** keeping mandatory arbitration with 30 days to opt out. [Digiday](https://digiday.com/media/openai-rewrites-chatgpt-business-hub-terms-after-legal-language-raises-concerns/)\n- **LinkedIn's Marketing API 202611 is live**, and from Dec 15 it rejects EU-targeted campaigns that don't set politicalIntent. [Microsoft Learn](https://learn.microsoft.com/en-us/linkedin/marketing/integrations/recent-changes?view=li-lms-2026-11)\n- **Meta expects to engage publishers on its paused terms \"In early 2027.\"** [Meta](https://about.fb.com/news/2026/11/our-approach-to-updating-our-commercial-terms-of-service/)\n\n---\n\n## Common Threads\n\n### The checkout moved into the answer\nMuse checks out Loblaw baskets in the chat, Bing sells ads inside AI Overviews, and ChatGPT's deal cards carry the code.\n\n### Access turned into terms\nJassy wants \"a fair exchange of value\" from outside agents, Muse now says \"Do not search Amazon,\" and OpenAI and Meta are reworking their business terms.\n\n### The content arguments turned on human review\nLandwehr's two domains had publicized scaled AI content, Ray drew her line at \"no human reviewing it,\" and Coca-Cola keeps human storytellers \"at the center.\"\n\n### Impressions and outcomes came apart\nClark's site left AI Overviews and AI Mode and kept its clicks roughly level, and a code copied from a ChatGPT card leaves no referral.\n\n---\n\n## Angles for the Week\n\n- **Ask ChatGPT, AI Mode and Bing for your own Black Friday codes.** Expire stale codes and give your promo page a code used nowhere else. Window: through Nov 30.\n- **Run Google's running-store test on your tips and \"Top 10\" posts.** Rewrite or retire posts with no first-hand element, and measure by \"leads or sales.\" Window: now.\n- **Check whether your Microsoft PMax and AI Max campaigns serve in Bing's AI Overviews.** Review the landing pages AI Max picks. Window: through Nov 30.\n- **Decide which shopping agents can buy from you.** For each agent that reaches your catalog, choose to block, allow or partner. Window: before Black Friday (Nov 27).\n- **Read the revised Business Hub terms before you claim.** Have counsel read them and calendar the 30-day arbitration opt-out. Window: 30 days from accepting.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
