    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of June 5, 2026\n\n> **Microsoft Build 2026 pushed the industry from Copilot to Autopilot.** Microsoft used its June 2-3 developer conference to frame the next phase of AI at work as always-on agents with identities, memory, governance, and access to the places work already happens: Teams, Outlook, OneDrive, SharePoint, Windows, GitHub, and Azure. **Microsoft Scout** is the first example \u2014 an experimental Autopilot agent for selected Frontier customers that can monitor priorities and take action across Microsoft 365 within organizational controls. **DaVinci Resolve 21 officially shipped** on June 3 with a new Photo page, IntelliSearch, CineFocus, expanded AI tools, Final Cut Pro 12 XML support, and a large set of workflow updates across edit, color, audio, VFX, and collaboration. **xAI released Grok Imagine 1.5 Preview** through the API as an initial image-to-video model: source image in, natural-language shot direction, up to 720p, with native audio support, currently image-to-video only on the API endpoint. And the broader AI video stack kept filling in: **PAI 2.0**, **VidMuse 2.0**, **OttoBox**, and **Adobe Firefly's partner-model ecosystem** all point toward the same pattern \u2014 video tools are turning into multi-step production workspaces rather than single-prompt generators.\n\n---\n\n## This Week in AI\n\n### Microsoft Build 2026: From Copilot to Autopilot\n\nMicrosoft Build 2026 ran June 2-3 in San Francisco, and the main story was not one new model or one new Copilot button. It was a category shift. Microsoft framed the progression as **Chat -> Cowork -> Code -> Autopilots**: from prompt-response assistants, to collaborative copilots, to coding agents, to always-on agents that can hold context, monitor work, and operate across the Microsoft ecosystem with governance.\n\nThe headline product in that shift is **Microsoft Scout**, the first agent in a new Autopilot category. Scout is designed to work across **Teams, Outlook, OneDrive, SharePoint, calendars, email, browser work, local device actions, and Microsoft 365 context**. The difference from the familiar Copilot pattern is persistence. A standard Copilot waits for a user to ask for help inside an app. Scout is positioned as an always-on work agent that stays connected to priorities, tracks open loops, and can take multi-step action on the user's behalf inside the guardrails set by the organization.\n\nAvailability is narrow and experimental. Scout is being offered to selected **Frontier** organizations and private preview customers, not broadly to every Microsoft 365 tenant. Setup requires Frontier enrollment, Intune policy configuration, opt-in attestation, and an individual GitHub Copilot license. Microsoft is also giving Scout its own governed identity through Entra, with audit trails and policy controls. That governance layer matters more than the demo: it shows how Microsoft expects autonomous workplace agents to be deployed in real organizations rather than treated as consumer chatbots with extra permissions.\n\nThe supporting stack at Build was broad:\n\n- **Work IQ APIs** \u2014 Microsoft is opening the context layer behind Microsoft 365. Work IQ describes who someone works with, what documents and meetings matter, what projects are active, and how work is organized. Opening APIs around that layer means third-party agents can be built against Microsoft 365 context rather than starting from a blank prompt window. General availability is expected June 16.\n- **Web IQ** \u2014 a model-agnostic, MCP-native grounding layer for web, news, image, and video access. Microsoft described it as part of the infrastructure already powering grounding in Microsoft Copilot and ChatGPT.\n- **Windows Agent Framework** \u2014 an open-source runtime for registering agents, managing memory, and enabling cross-agent communication on Windows.\n- **Microsoft Execution Containers** \u2014 a sandbox layer for running agents more safely on Windows, separating agent execution from the rest of the device.\n- **Aion 1.0 Instruct and Aion 1.0 Plan** \u2014 smaller on-device Windows models. Aion Instruct is aimed at summarization, rewrites, intents, and accessibility. Aion Plan is a 14B-parameter reasoning and tool-calling model with 32K context that ships in-box as part of Windows.\n- **Project Solara** \u2014 a platform for agent-first devices, including desk companion and wearable badge concepts. The notable point is not the hardware category itself; it is Microsoft's belief that agents will need dedicated ambient surfaces, not just chat windows inside existing applications.\n\nFor AV teams, the Microsoft 365 surface is the important part. AVS work already lives in Teams threads, Outlook approvals, SharePoint pages, OneDrive folders, calendars, meeting notes, and review documents. Build 2026 makes clear that Microsoft wants agents to operate inside that context directly. The practical consequence is that the next wave of AI workflow help inside organizations is likely to arrive through existing Microsoft 365 permissions and admin controls, not through a separate creative app or a standalone chatbot.\n\nThe story also connects back to last week's Back to Basics tip. Context is the lever. Microsoft is now productizing that idea at the enterprise layer: Work IQ is structured workplace context, Scout is an agent allowed to act on it, and Entra/Intune/audit trails are the governance wrapper that makes the whole thing deployable.\n\n**Source:** [The Neuron \u2014 Everything Microsoft announced at Microsoft Build 2026](https://www.theneuron.ai/explainer-articles/everything-microsoft-announced-at-microsoft-build-2026-explained/) \u00b7 [Microsoft Build 2026 top announcements recap](https://www.youtube.com/watch?v=X5IvkUxfqms) \u00b7 [Memeburn \u2014 Microsoft Scout is the new AI assistant that never clocks out](https://memeburn.com/microsoft-scout-is-the-new-ai-assistant-that-never-clocks-out/) \u00b7 [EdTech Innovation Hub \u2014 Microsoft rolls out Scout Autopilot agent](https://www.edtechinnovationhub.com/news/microsoft-rolls-out-scout-autopilot-agent-for-microsoft-365-workflows) \u00b7 June 2-4, 2026\n\n### DaVinci Resolve 21 Officially Ships\n\nDaVinci Resolve's developer officially released **DaVinci Resolve 21** on June 3 after its public beta cycle. It is one of the largest Resolve updates in recent years, not because of one flashy feature, but because the Resolve team is expanding the application from a video post tool into a broader media finishing environment that now includes still-image work, stronger search, AI-assisted focus tools, and deeper interoperability.\n\nThe new **Photo page** is the most visible structural change. Resolve now gives still-image workflows a dedicated page, bringing node-based adjustment and grading concepts into a photo-editing surface. That matters for teams that already use Resolve for color and finishing: still frames, thumbnails, campaign images, reference images, and project photography can now stay closer to the same color-managed environment instead of moving out to separate tools.\n\nThe AI updates are also practical rather than speculative:\n\n- **IntelliSearch** helps locate clips and project content more quickly using intelligent search.\n- **CineFocus** is an AI-assisted tool for adjusting focal emphasis after capture.\n- Studio users get the broader set of AI-assisted features the Resolve team has been expanding through the beta cycle, including refinements to image, focus, and finishing workflows.\n\nResolve 21 also adds meaningful interoperability and workflow updates. Multi-user projects now support dynamic project switching, and the release includes **Final Cut Pro 12 XML import and export** for improved movement between editing environments. The final version carries forward the beta-cycle refinements around photo handling, motion paths, camera-format support, collaboration, and stability.\n\nFor AV teams, this is the opposite of a speculative AI-video platform announcement. Resolve 21 is a production application shipping into the real edit/color/audio/VFX stack. The pattern is worth noting: the most important AI updates in professional tools are increasingly appearing as *workflow compression*, not as \"generate a whole video\" buttons. Search gets faster. Focus adjustments become easier. Still-image and video finishing live closer together. XML handoff improves. The AI disappears into the workbench.\n\nResolve 21 is available now as a free download. DaVinci Resolve Studio remains a $295 one-time purchase and includes the higher-end AI features, work beyond 4K, and full-resolution photo exports.\n\n**Source:** [PetaPixel \u2014 DaVinci Resolve 21 officially released](https://petapixel.com/2026/06/03/davinci-resolve-21-officially-released-with-new-photo-editing-ai-tools-and-much-more/) \u00b7 [CineD \u2014 DaVinci Resolve 21 Public Beta 4 context](https://www.cined.com/davinci-resolve-21-public-beta-4-released-canon-raw-highlight-fix-fusion-motion-path-keyframing-and-refined-ai-cinefocus/) \u00b7 June 3, 2026\n\n### Grok Imagine 1.5 Preview: xAI Adds an Image-to-Video API\n\nxAI released **Grok Imagine 1.5 Preview** through the xAI API on June 3 under the model name `grok-imagine-video-1.5-preview`. This should be treated as an initial preview rather than a settled production platform, but the feature set is worth tracking because it puts xAI into the same image-to-video conversation as Runway, Google, ByteDance, Kuaishou, and the rest of the video-model field.\n\nThe current API endpoint is **image-to-video**. Users provide a still image and a natural-language prompt describing the shot direction \u2014 camera movement, pacing, atmosphere, sound design \u2014 and the model animates the source image into video while attempting to preserve detail and lighting from the input frame. xAI's documentation lists output at up to **720p**, with pricing at **$0.080 per second** and a stated rate limit of **60 requests per minute**. Available regions include `us-east-1`, `us-west-2`, and `eu-west-1`.\n\nThe important clarification: the API endpoint is not a general text-to-video endpoint. Some app and web surfaces may expose text-to-video experiences, but `grok-imagine-video-1.5-preview` as documented for developers is image in, video out. That distinction matters for production planning. A team building a pipeline around the API should assume it needs a starting frame or reference image for each generation.\n\nThe model also supports native audio generation in the broader Grok Imagine 1.5 line, including synchronized sound design. Because the release is still early, the cautious framing is best: it is an image-to-video preview with native audio capabilities and a developer API, not yet a stable production standard.\n\nFor AV teams, Grok Imagine 1.5 fits into the same emerging category as last week's Aleph 2.0 story, but from a different direction. Aleph edits existing footage while preserving what should not change. Grok Imagine 1.5 animates a still frame into motion. Both reinforce the same trend: the input image or keyframe is becoming the control surface for video generation. Text still matters, but the frame is increasingly the anchor.\n\n**Source:** [xAI \u2014 Grok Imagine 1.5 Preview](https://x.ai/news/grok-imagine-1-5) \u00b7 [xAI Docs \u2014 Grok Imagine Video 1.5 Preview](https://docs.x.ai/developers/models/grok-imagine-video-1.5-preview) \u00b7 [Morphic \u2014 Grok Imagine Video 1.5 overview](https://morphic.com/resources/models/grok-imagine-video-1-5) \u00b7 June 3, 2026\n\n### The AI Video Platform Stack Keeps Filling In\n\nOutside Microsoft and Resolve, the week brought a cluster of smaller but useful video-platform updates. None of them needs to be the lead story on its own. Together, they show the shape of the market: AI video tools are moving from single-prompt generation toward production workspaces with timelines, memory, keyframes, local search, upscaling, voice, and agentic assistance.\n\n**PAI 2.0** from Utopai Studios is the clearest example of the integrated-platform direction. The company launched the second version of its AI video storytelling platform less than three months after its first version. PAI 2.0 adds rapid variant generation, **2x2 keyframes for each 15-second segment**, native cinematic **4K** generation, and two creation modes: **Easy Mode** for guided creation and **Pro Mode** for a Canvas workspace where users can organize, edit, and regenerate story details with finer control. The stated goal is to move beyond generating individual clips and toward longer videos that hold together more naturally.\n\n**VidMuse 2.0** adds similar production-workspace ideas from a different angle. The update introduces **Shot Refine by Quoting**, where a user can select a specific shot or image in the storyboard and ask the agent to revise only that item rather than regenerating the whole project. It also adds a built-in **Timeline Editor** for trimming, reordering, and audio adjustment, plus an **Asset Library with Memory** for persistent project references \u2014 images, video, audio, character references, and product references \u2014 across projects. The language is different from Runway or Google, but the pattern is the same: targeted revision, timeline control, and persistent context.\n\n**OttoBox** from OmAI, unveiled at BEYOND Expo, represents the local/on-device side of the same trend. It is described as an AI-native video creation assistant built around three components: **AI Drive** for local media ingestion, OCR, ASR, shot segmentation, and vector tagging; **AI Finder** for natural-language video search; and **AI Agent** for rough-cut generation, highlight extraction, scripts, and narration. The reported claim is rough-cut work moving from 8-10 hours to about 30 minutes, but the safe read is that OttoBox is an efficiency aid, not an editor replacement. The noteworthy part is local processing: sensitive footage can be indexed and searched without sending raw media to a cloud service.\n\n**Adobe Firefly's partner-model ecosystem** continues to fill in the production stack as well. Firefly now surfaces partner capabilities like **ElevenLabs Multilingual v2** for generated speech and **Topaz Astra** for video upscaling inside Adobe experiences. ElevenLabs appears in Firefly's Generate Speech model selector, and Topaz Astra is available through Firefly Boards for upscaling clips to 1080p or 4K with speed/quality and enhancement-mode controls. Adobe's direction is clear: Firefly is becoming a hub where Adobe's own models sit alongside partner models, all under a single creative workspace.\n\nThe common pattern across PAI, VidMuse, OttoBox, and Adobe is not \"AI makes video.\" That headline is old. The current pattern is **AI remembers assets, revises individual shots, hands work to a timeline, searches media semantically, and connects specialist models inside one workspace**. The single-prompt era is giving way to the production-workspace era.\n\n**Source:** [Variety \u2014 Utopai Studios launches PAI 2.0](https://variety.com/2026/biz/tech/ai-utopai-studios-pai-2-generative-video-platform-1236764434/) \u00b7 [VidMuse \u2014 VidMuse 2.0 release](https://vidmuse.ai/blog/vidmuse-2-0-release) \u00b7 [LavX News \u2014 OmAI unveils OttoBox](https://news.lavx.hu/article/omai-unveils-ottobox-ai-video-creation-assistant-at-beyond-expo-2026) \u00b7 [Adobe \u2014 Topaz Astra Video Upscaling in Firefly Boards](https://www.adobe.com/mena_en/products/firefly/partner-models/topaz.html) \u00b7 [Adobe \u2014 ElevenLabs voice generation in Adobe Firefly](https://www.adobe.com/products/firefly/partner-models/elevenlabs.html) \u00b7 June 1-4, 2026\n\n### Quick Hits\n\n- **Gemini 3.5 Pro is still pending** \u2014 Google committed at I/O to a June rollout, but as of this edition there is still no public model card, pricing row, API model string, or general availability announcement. Gemini 3.5 Flash remains the currently available member of the family.\n- **GitHub Copilot AI-credit billing began June 1** \u2014 the shift from request-style usage to AI credits is now active. The AV relevance is indirect but real: agentic work is increasingly priced as metered model usage, not as a simple seat license.\n- **Adobe Firefly AI Assistant remains the watch item** \u2014 Adobe previewed an agentic assistant for Firefly Video Editor that can orchestrate multi-step work across Creative Cloud apps from a conversational surface. The rollout is still staged, but the direction matches the broader shift from single tools to agentic creative workspaces.\n\n---\n\n## Voices This Week\n\n### Microsoft on the Autopilot Shift\n\nMicrosoft's Build framing centered on a progression from chat to cowork to code to Autopilots. The useful part of that frame is that it describes a change in *where* the AI lives. Chat lives in a window. Copilot lives beside an app. Coding agents live inside a repo. Autopilots live across a work environment with identity, memory, and governance. For organizations that already run on Microsoft 365, that is a more important shift than a benchmark chart.\n\n### Resolve's Quiet AI Pattern\n\nDaVinci Resolve 21 shows a different pattern from the frontier model labs. The Resolve team is not framing the application as an AI generator. It is putting AI into search, focus, still-image workflows, and finishing utilities. That pattern is likely to matter more for day-to-day AV work than the headline-grabbing demos. The tools that save the most time often do it by removing small repeated frictions, not by replacing the whole job.\n\n---\n\n## Common Threads\n\n### Agents Are Moving Into Governed Work Context\n\nThe Build story is really a governance story. Scout is interesting because it is always-on, but it is deployable because it has an Entra identity, admin controls, Intune setup, and audit trails. The same pattern is likely to define enterprise AI adoption more broadly: agents need context, but context only becomes usable in organizations when permissions, logging, and policy are built in.\n\n### Video Tools Are Becoming Workspaces, Not Prompt Boxes\n\nPAI 2.0, VidMuse 2.0, OttoBox, Adobe Firefly, Grok Imagine 1.5, and last week's Aleph 2.0 all point in the same direction. The next useful video tools are not just text-to-video boxes. They are workspaces with timelines, references, memory, keyframes, local search, upscaling, speech, audio, and shot-specific revision. The interesting question for each platform is no longer \"can it make a clip?\" It is \"can it help manage the whole revision loop?\"\n\n### The Frame Is Becoming the Control Surface\n\nGrok Imagine 1.5 animates a source image. Aleph 2.0 propagates a keyframe edit. VidMuse 2.0 lets users quote a shot and revise only that shot. PAI 2.0 uses keyframes per segment. The common pattern: video generation is becoming less purely text-driven and more frame-directed. Text describes intent, but the image or shot carries the visual contract.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Local Media Intelligence for Sensitive Footage\n\nOttoBox's local-ingestion approach is worth tracking even if the product is early. AV teams often handle footage that cannot casually move into consumer cloud tools: internal meetings, unreleased material, stakeholder interviews, or private events. A local system that can do transcription, OCR, shot segmentation, vector search, and rough-cut assistance without moving raw media off device would fit a real operational constraint.\n\n### Work IQ as Enterprise Prompt Context\n\nLast week's Back to Basics tip said context is the lever. Work IQ is Microsoft turning that principle into infrastructure. Instead of asking each user to paste the brief, the documents, the meeting notes, and the stakeholder history into the chat, Microsoft is building a layer that lets governed agents retrieve that context from Microsoft 365 directly. The open question is not whether that makes agents more useful. It will. The open question is how clearly organizations can inspect, constrain, and correct what the agent thinks it knows.\n\n### Timeline Control as the Test for AI Video Platforms\n\nEvery AI video platform can show a compelling generated clip. The more meaningful test is whether it supports revision without starting over. Timeline editors, shot-level quoting, keyframe controls, source-image anchoring, memory libraries, and XML/export paths are all signs that a platform is trying to survive real production feedback. The platforms that win working teams will be the ones that treat revision as the main workflow, not an afterthought.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 2: Specificity Over Flattery\n\nLast week, we started the **Back to Basics** series with a simple principle: **context is the lever, not the model**. This week is about the next most common prompting mistake: opening with flattery instead of instruction.\n\nMost weak prompts start like this:\n\n```text\nYou are an expert video producer. Help me make this script better.\n```\n\nThat sounds natural, but it gives the model almost nothing useful. \"Expert\" is vague. \"Better\" is vague. The output format is unspecified. The audience is missing. The constraints are missing. The model has to guess what success looks like.\n\nUse this instead:\n\n```text\nYour task is to revise this 90-second internal training script for clarity.\n\nAudience: non-technical staff.\nTone: calm, plainspoken, professional.\nConstraints: keep it under 220 words, keep all safety instructions intact,\nremove jargon, and preserve the three-step structure.\nOutput: return only the revised script, then a 3-bullet explanation of what changed.\n```\n\nThe principle is **specificity over flattery**. Modern models do not need to be complimented into competence. They need a clear task, audience, constraints, examples, and success criteria. \"You are an expert\" can sometimes help set a role, but it is never a substitute for saying what the work is, who it is for, what must not change, and what format you want back.\n\nFor AV work, the pattern is especially useful because so much of the work has real constraints:\n\n- A script has a runtime.\n- A caption set has a reading-speed limit.\n- A stakeholder email has a tone.\n- A training video has safety instructions that cannot be changed.\n- A project brief has a format the team already expects.\n- Review notes need to be organized by timecode, not rewritten as a generic summary.\n\nThe weekend exercise: take one prompt you actually use and rewrite it in five fields:\n\n1. **Task** \u2014 what the model should do.\n2. **Audience** \u2014 who the output is for.\n3. **Constraints** \u2014 what must be preserved, avoided, shortened, or emphasized.\n4. **Input** \u2014 the source material or context.\n5. **Output format** \u2014 exactly what you want back.\n\nThis works in Claude, ChatGPT, Gemini, Copilot, Grok, and the next model that ships. The model changes. The principle does not.\n\nNext week, Back to Basics Week 3: **Show, Don't Tell** \u2014 why 2-3 examples of good output often outperform a page of abstract instructions.\n\n---\n\n## Sources\n\n1. [The Neuron \u2014 Everything Microsoft announced at Microsoft Build 2026](https://www.theneuron.ai/explainer-articles/everything-microsoft-announced-at-microsoft-build-2026-explained/) \u2014 June 2, 2026 \u2014 Build announcement roundup\n2. [Microsoft Build 2026 top announcements recap](https://www.youtube.com/watch?v=X5IvkUxfqms) \u2014 June 2026 \u2014 Build keynote recap and Work IQ notes\n3. [Memeburn \u2014 Microsoft Scout is the new AI assistant that never clocks out](https://memeburn.com/microsoft-scout-is-the-new-ai-assistant-that-never-clocks-out/) \u2014 June 2026 \u2014 Scout overview and Autopilot framing\n4. [EdTech Innovation Hub \u2014 Microsoft rolls out Scout Autopilot agent](https://www.edtechinnovationhub.com/news/microsoft-rolls-out-scout-autopilot-agent-for-microsoft-365-workflows) \u2014 June 2026 \u2014 Scout availability and setup details\n5. [PetaPixel \u2014 DaVinci Resolve 21 officially released](https://petapixel.com/2026/06/03/davinci-resolve-21-officially-released-with-new-photo-editing-ai-tools-and-much-more/) \u2014 June 3, 2026 \u2014 Resolve 21 release details\n6. [CineD \u2014 DaVinci Resolve 21 Public Beta 4 context](https://www.cined.com/davinci-resolve-21-public-beta-4-released-canon-raw-highlight-fix-fusion-motion-path-keyframing-and-refined-ai-cinefocus/) \u2014 May 28, 2026 \u2014 Late beta context for Resolve 21 features\n7. [xAI \u2014 Grok Imagine 1.5 Preview](https://x.ai/news/grok-imagine-1-5) \u2014 June 3, 2026 \u2014 xAI model announcement\n8. [xAI Docs \u2014 Grok Imagine Video 1.5 Preview](https://docs.x.ai/developers/models/grok-imagine-video-1.5-preview) \u2014 June 2026 \u2014 API modality, pricing, rate limits, regions\n9. [Morphic \u2014 Grok Imagine Video 1.5 overview](https://morphic.com/resources/models/grok-imagine-video-1-5) \u2014 June 2026 \u2014 Model overview and native audio context\n10. [Variety \u2014 Utopai Studios launches PAI 2.0](https://variety.com/2026/biz/tech/ai-utopai-studios-pai-2-generative-video-platform-1236764434/) \u2014 June 2026 \u2014 PAI 2.0 features\n11. [VidMuse \u2014 VidMuse 2.0 release](https://vidmuse.ai/blog/vidmuse-2-0-release) \u2014 June 1, 2026 \u2014 Shot Refine, Timeline Editor, Asset Library with Memory\n12. [LavX News \u2014 OmAI unveils OttoBox](https://news.lavx.hu/article/omai-unveils-ottobox-ai-video-creation-assistant-at-beyond-expo-2026) \u2014 June 1, 2026 \u2014 OttoBox local video assistant overview\n13. [Adobe \u2014 Topaz Astra Video Upscaling in Firefly Boards](https://www.adobe.com/mena_en/products/firefly/partner-models/topaz.html) \u2014 2026 \u2014 Topaz Astra integration details\n14. [Adobe \u2014 ElevenLabs voice generation in Adobe Firefly](https://www.adobe.com/products/firefly/partner-models/elevenlabs.html) \u2014 2026 \u2014 ElevenLabs integration details\n15. [Google \u2014 Gemini 3.5: frontier intelligence with action](https://blog.google/intl/en-africa/products/explore-get-answers/gemini-3-5/) \u2014 May 19, 2026 \u2014 Gemini 3.5 Flash and Pro timing\n16. [Digital Applied \u2014 AI Model Releases May 2026 tracker](https://www.digitalapplied.com/blog/ai-model-releases-may-2026-complete-tracker) \u2014 May/June 2026 \u2014 Gemini 3.5 Pro and GitHub Copilot billing context\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of June 5, 2026\n\n> Quick Summary: **Microsoft Build 2026 moved the frame from Copilot to Autopilot.** Microsoft announced **Scout**, an experimental always-on agent for selected Frontier customers that can work across Teams, Outlook, OneDrive, SharePoint, Windows, and Microsoft 365 context with governance controls. **DaVinci Resolve 21 officially shipped** with a new Photo page, IntelliSearch, CineFocus, expanded AI tools, Final Cut Pro 12 XML support, and broad workflow updates. **xAI released Grok Imagine 1.5 Preview** as an initial image-to-video API: source image in, natural-language shot direction, up to 720p, native audio support, currently image-to-video only on the API. The broader AI video stack kept filling in with **PAI 2.0**, **VidMuse 2.0**, **OttoBox**, and **Adobe Firefly partner-model integrations** \u2014 all pointing toward AI video tools becoming production workspaces, not just prompt boxes.\n\n---\n\n## The Big Stories This Week\n\n### Microsoft Build 2026: From Copilot to Autopilot\n\nMicrosoft Build ran June 2-3, and the main story was a category shift: **Chat -> Cowork -> Code -> Autopilots**.\n\nThe headline product is **Microsoft Scout**, the first agent in Microsoft's new Autopilot category. Scout is designed to work across:\n\n- Teams\n- Outlook\n- OneDrive\n- SharePoint\n- calendars and email\n- browser work\n- local device actions\n- Microsoft 365 context\n\nThe difference from a normal Copilot is persistence. Copilot waits for a prompt inside an app. Scout is positioned as an always-on work agent that tracks priorities, monitors open loops, and takes multi-step action inside organizational guardrails.\n\nScout is not broadly available yet. It is an experimental Frontier / private-preview release with Entra identity, Intune policy, opt-in attestation, audit trails, and admin controls. That governance layer matters: Microsoft is showing how always-on agents might be deployed in real organizations rather than treated as consumer chatbots with extra permissions.\n\nSupporting Build announcements:\n\n- **Work IQ APIs** \u2014 opens the Microsoft 365 context layer to agents; GA expected June 16.\n- **Web IQ** \u2014 model-agnostic, MCP-native web grounding layer for agents.\n- **Windows Agent Framework** \u2014 open-source runtime for agent registration, memory, and cross-agent communication.\n- **Microsoft Execution Containers** \u2014 sandboxed runtime for running agents more safely on Windows.\n- **Aion 1.0 Instruct / Aion 1.0 Plan** \u2014 on-device Windows AI models, including a 14B reasoning/tool-calling model.\n- **Project Solara** \u2014 platform for agent-first desk and wearable device concepts.\n\nFor AVS, the Microsoft 365 surface is the point. Our work already lives in Teams, Outlook, SharePoint, OneDrive, calendars, and review documents. Microsoft is moving agents into that exact context.\n\n### DaVinci Resolve 21 Officially Ships\n\nDaVinci Resolve's developer officially released **DaVinci Resolve 21** on June 3 after the public beta cycle.\n\nMajor updates:\n\n- New **Photo page** for still-image work inside Resolve\n- **IntelliSearch** for faster clip and project search\n- **CineFocus** for AI-assisted focal emphasis after capture\n- Expanded AI-assisted tools across finishing workflows\n- Final Cut Pro 12 XML import/export\n- Dynamic project switching for multi-user projects\n- Broad updates across edit, color, audio, VFX, collaboration, formats, and stability\n\nThe practical point: Resolve 21 is not a speculative AI-video platform. It is a production application shipping AI into the real edit/color/audio/VFX stack.\n\nThe pattern is also important. The most useful AI in professional tools often appears as workflow compression: search gets faster, focus adjustments get easier, still-image and video finishing live closer together, and handoffs improve.\n\nResolve 21 is available as a free download. Resolve Studio remains a $295 one-time purchase.\n\n### Grok Imagine 1.5 Preview\n\nxAI released **Grok Imagine 1.5 Preview** through the API on June 3 under the model name `grok-imagine-video-1.5-preview`.\n\nKeep this one in the \"early preview\" category. The current API endpoint is **image-to-video**:\n\n- Input: a still image\n- Prompt: natural-language shot direction\n- Output: animated video up to 720p\n- Pricing: $0.080 per second\n- Rate limit: 60 requests per minute\n- Regions: `us-east-1`, `us-west-2`, `eu-west-1`\n\nImportant clarification: the API endpoint is not a general text-to-video endpoint. Some app and web surfaces may expose text-to-video experiences, but the documented developer endpoint is image in, video out.\n\nThe broader Grok Imagine 1.5 line also supports native audio generation. The cautious read: this is an initial image-to-video preview with native-audio capabilities, not yet a settled production standard.\n\nFor AVS, the pattern matters more than the brand. Like last week's Aleph 2.0 story, Grok Imagine reinforces that the source frame or keyframe is becoming the control surface for video generation. Text describes intent; the image anchors the visual result.\n\n### The AI Video Platform Stack Keeps Filling In\n\nSeveral smaller video-platform updates landed this week. None needs to be the lead by itself. Together, they show where AI video tools are going: away from single-prompt generation and toward production workspaces with timelines, memory, keyframes, local search, upscaling, voice, and agentic assistance.\n\n**PAI 2.0**:\n- Rapid variant generation\n- 2x2 keyframes for each 15-second segment\n- Native cinematic 4K generation\n- Easy Mode for guided creation\n- Pro Mode with a Canvas workspace for organizing, editing, and regenerating details\n\n**VidMuse 2.0**:\n- **Shot Refine by Quoting** \u2014 select a shot and ask the agent to revise only that shot\n- Built-in Timeline Editor\n- Asset Library with Memory for persistent images, video, audio, character references, and product references\n- Rebuilt Agent framework\n\n**OttoBox by OmAI**:\n- Local media ingestion with OCR, ASR, shot segmentation, and vector tagging\n- Natural-language video search\n- Rough-cut generation, highlight extraction, scripts, and narration\n- Local/on-device angle for sensitive footage\n\n**Adobe Firefly partner-model ecosystem**:\n- ElevenLabs Multilingual v2 for generated speech inside Firefly\n- Topaz Astra for video upscaling inside Firefly Boards\n- Firefly continuing to act as a hub where Adobe and partner models sit inside one creative workspace\n\nThe common thread: the useful question is no longer \"can it make a clip?\" It is \"can it help manage the whole revision loop?\"\n\n### Quick Hits\n\n- **Gemini 3.5 Pro is still pending** \u2014 Google committed to a June rollout, but there is still no public model card, pricing row, API model string, or general availability announcement.\n- **GitHub Copilot AI-credit billing began June 1** \u2014 agentic work is increasingly priced as metered model usage, not just a seat license.\n- **Adobe Firefly AI Assistant remains a watch item** \u2014 Adobe has previewed an agentic assistant for Firefly Video Editor that can orchestrate multi-step work across Creative Cloud apps.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 2: Specificity Over Flattery\n\nLast week, we started the **Back to Basics** series with a simple principle: **context is the lever, not the model**. This week is about the next common prompting mistake: opening with flattery instead of instruction.\n\nMost weak prompts start like this:\n\n```text\nYou are an expert video producer. Help me make this script better.\n```\n\nThat sounds natural, but it gives the model almost nothing useful. \"Expert\" is vague. \"Better\" is vague. The output format is unspecified. The audience is missing. The constraints are missing.\n\nUse this instead:\n\n```text\nYour task is to revise this 90-second internal training script for clarity.\n\nAudience: non-technical staff.\nTone: calm, plainspoken, professional.\nConstraints: keep it under 220 words, keep all safety instructions intact,\nremove jargon, and preserve the three-step structure.\nOutput: return only the revised script, then a 3-bullet explanation of what changed.\n```\n\nThe principle is **specificity over flattery**. Modern models do not need to be complimented into competence. They need a clear task, audience, constraints, examples, and success criteria.\n\nFor AV work, this matters because the work has real constraints:\n\n- A script has a runtime.\n- A caption set has a reading-speed limit.\n- A stakeholder email has a tone.\n- A training video has safety instructions that cannot be changed.\n- Review notes need to be organized by timecode.\n\nThe weekend exercise: rewrite one prompt you actually use in five fields:\n\n1. **Task** \u2014 what the model should do.\n2. **Audience** \u2014 who the output is for.\n3. **Constraints** \u2014 what must be preserved, avoided, shortened, or emphasized.\n4. **Input** \u2014 the source material or context.\n5. **Output format** \u2014 exactly what you want back.\n\nThis works in Claude, ChatGPT, Gemini, Copilot, Grok, and whatever ships next. The model changes. The principle does not.\n\nNext week: **Show, Don't Tell** \u2014 why 2-3 examples of good output often outperform a page of abstract instructions.\n\n---\n\n## Why This Week Matters\n\n- **Agents are moving into governed work context.** Scout is interesting because it is always-on, but it is deployable because it has Entra identity, admin controls, Intune setup, and audit trails. Context only becomes usable in organizations when permissions, logging, and policy are built in.\n\n- **Video tools are becoming workspaces, not prompt boxes.** PAI 2.0, VidMuse 2.0, OttoBox, Adobe Firefly, Grok Imagine 1.5, and last week's Aleph 2.0 all point in the same direction: timelines, references, memory, keyframes, local search, upscaling, speech, audio, and shot-specific revision.\n\n- **The frame is becoming the control surface.** Grok Imagine animates a source image. Aleph 2.0 propagates a keyframe edit. VidMuse revises quoted shots. PAI uses keyframes per segment. Text describes intent; the image or shot carries the visual contract.\n\n- **Local media intelligence matters for sensitive footage.** OttoBox's local-ingestion approach is early, but the idea is important: transcription, OCR, shot segmentation, vector search, and rough-cut assistance without moving raw media off device.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
