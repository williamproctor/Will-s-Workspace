    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of May 22, 2026\n\n> **Google I/O 2026 happened this week** and Google emptied the warehouse. **Gemini Omni Flash** \u2014 a new multimodal video model with conversational editing \u2014 shipped today to the Gemini app, **Google Flow**, and (free) to **YouTube Shorts Remix** and **YouTube Create**. **Gemini 3.5 Flash** ships as a frontier model claiming 4\u00d7 the speed and less than half the cost of comparable models, and Google demoed it building a functional operating system in 12 hours using 93 parallel agents for under $1,000 in API cost. **Google Flow becomes a creative copilot** with a project-spanning Flow Agent, vibe-coded custom Flow Tools, and Flow + Flow Music mobile apps. **Lyria 3 and Lyria 3 Pro** ship to developers \u2014 up to three-minute songs with vocals, timed lyrics, and multimodal image input. **Andrej Karpathy joined Anthropic** May 19 to build a team using Claude to accelerate Claude pre-training itself; Anthropic also shipped MCP tunnels, self-hosted Managed Agent sandboxes, and a Compliance API. **OpenAI's reasoning model disproved an 80-year-old Erd\u0151s conjecture** in discrete geometry \u2014 the first time AI has autonomously solved a prominent open math problem, verified by Fields Medalist Tim Gowers. And **Cannes 2026 closes tomorrow** with the festival press collectively writing the \"AI came out of the closet\" wrap.\n\n---\n\n## This Week in AI\n\n### Gemini Omni Flash \u2014 Google's New Multimodal Video Model Ships to Every Surface\n\nGoogle introduced **Gemini Omni** at the I/O 2026 keynote on May 19, the first model in a new \"Omni\" family that \u2014 in Google's framing \u2014 can \"create anything from any input.\" The first shipped model is **Gemini Omni Flash**, which targets video as its initial output modality. Image and audio outputs are on the roadmap; nothing in the Omni family has a developer API yet, though one is \"coming in the weeks following launch.\"\n\n**What's new versus Veo and Nano Banana.** Google positions Omni Flash as a step up from the existing Veo 3.1 + Nano Banana stack on three specific dimensions:\n\n- **Multimodal input in a single prompt** \u2014 combine text, images, video clips, and audio references in one request and the model reasons across all of them\n- **Conversational editing** \u2014 \"swap the background, swap the wardrobe, add a cinematic zoom, change the character's voice\" are now prompts, not multi-step workflows\n- **Real-world physics + scene continuity** \u2014 Google's stated focus area on the new model is movement, object interaction, and shot-to-shot continuity that earlier video models have struggled with\n\n**Character consistency** is the feature that lands hardest for AV teams. Google says Omni Flash preserves identity, lens look, and voice across scenes automatically, without requiring the user to specify it in each prompt. The same camera lens look is applied across every shot in a project; characters retain their identity across cuts; the model maintains a stylistic baseline across an entire session.\n\n**Availability and pricing**:\n\n- **Gemini app + Google Flow** \u2014 globally available today to Google AI Plus ($7.99/mo), Pro ($19.99/mo), and Ultra ($249.99/mo) subscribers\n- **YouTube Shorts Remix + YouTube Create app** \u2014 free to creators 18+, with watermarking, identifying metadata, a link back to the source video, and opt-out for original creators\n- **Maximum clip length** \u2014 10 seconds per clip. Product director Nicole Brichtova was explicit that this is a \"product decision, not a technical limitation\" \u2014 the cap will rise as Google calibrates safety policies for longer formats\n- **Enterprise/developer API** \u2014 Gemini API and Agent Platform API, \"coming in the weeks following launch,\" with SynthID watermarking and C2PA on all API outputs and reserved-throughput SLAs available\n- A **Gemini Omni Pro** variant is on the roadmap; no release date\n\n**The honest assessment.** Early creator coverage notes the raw video quality of Omni Flash still trails Seedance 2.0 and Kling for cinematic output. The bet Google is making isn't \"best-looking 10-second clip.\" It's \"best conversational editing surface on top of a frontier-level generative video model that sits inside the platform you already use to do post.\" For AV teams whose work needs YouTube Shorts assets or rapid client variations, the no-cost YouTube Shorts/Create access is the practical entry point this week. For higher-end pre-vis and concept work, Flow + Omni Flash is the surface to evaluate. For production-pipeline integration, the API arriving in the coming weeks is the inflection point to plan around.\n\n**Source:** [Google \u2014 Introducing Gemini Omni](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-omni/) \u00b7 [Google AI for Developers \u2014 Gemini Omni](https://blog.google/innovation-and-ai/products/gemini-app/next-evolution-gemini-app/) \u00b7 [Google Cloud \u2014 I/O 2026 Cloud announcements](https://cloud.google.com/blog/products/ai-machine-learning/innovations-from-google-io-26-on-google-cloud) \u00b7 [Firstpost \u2014 Omni Flash launch coverage](https://www.firstpost.com/tech/google-i-o-2026-gemini-omni-flash-arrives-with-more-accurate-ai-video-generation-than-veo-14012977.html) \u00b7 May 19, 2026\n\n### Gemini 3.5 Flash \u2014 Frontier-Class Model, 4\u00d7 the Speed, Less Than Half the Cost\n\nGemini 3.5 Flash is Google's headline I/O model launch \u2014 the first member of a \"Gemini 3.5\" family that Google has positioned as \"frontier intelligence with action,\" meaning frontier-class capability plus agentic execution as the primary use case. Gemini 3.5 Pro is coming next month; Google is using it internally now.\n\n**The pitch in numbers** (per Google's internal evaluations):\n\n- **4\u00d7 faster output tokens/second** versus comparable frontier models\n- **Less than half the cost** of comparable frontier models on equivalent workloads\n- **Beats Claude Sonnet 4.6, Claude Opus 4.7, and GPT-5.5** on:\n  - **MCP Atlas + Toolathlon** \u2014 agentic tool-use benchmarks\n  - **Finance agent v2** \u2014 multi-step financial analysis\n  - **MMMU Pro** \u2014 multimodal understanding\n  - **MRCR v2 (1M pointwise)** \u2014 long-context information processing\n\n**The marquee demo**: Antigravity, Google's agent-first development platform, used Gemini 3.5 Flash to build **a fully functional operating system in 12 hours**, running **93 agents in parallel**, with total API costs **under $1,000**. The number to anchor on isn't the OS \u2014 it's the orchestration. Ninety-three concurrent agents reasoning, planning, and executing tool calls against a shared codebase, finishing in twelve hours of wall-clock time, on a budget that any AV pro could expense for a single project.\n\n**Internal traction**: Google reports Gemini 3.5 Flash is currently driving **3 trillion-plus tokens per day** of internal usage across its AI developer tools, up from 500 billion tokens per day in March. Google's internal usage is the leading indicator most worth tracking: the company has the most aggressive deployment surface and the most honest cost discipline of any frontier-model provider.\n\n**Where it's available today**:\n\n- Gemini app and AI Mode in Search (default model globally)\n- Gemini API in Google AI Studio and Android Studio (for developers)\n- Antigravity, the agent-first dev platform (for agentic workloads)\n- Gemini Enterprise Agent Platform + Gemini Enterprise (for orgs)\n\n**For AV teams**, the immediate question is whether Gemini 3.5 Flash is now the best agentic model for production AV workflows. The honest answer is \"probably worth A/B testing against your current stack this week.\" Anthropic and OpenAI will both ship counter-positioning within the next four to six weeks; this isn't a settled state. But the cost-versus-capability point on Google's curve has moved enough that anyone whose AV agents currently run on Claude Sonnet 4.6 or GPT-5.5 should at minimum sanity-check what their token economics look like on Gemini 3.5 Flash.\n\n**Source:** [Google \u2014 Sundar Pichai I/O 2026 keynote](https://blog.google/innovation-and-ai/sundar-pichai-io-2026/) \u00b7 [Google \u2014 Gemini 3.5: frontier intelligence with action](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-5/) \u00b7 [Google Developers \u2014 All the news from the I/O Developer keynote](https://developers.googleblog.com/en/all-the-news-from-the-google-io-2026-developer-keynote/) \u00b7 [Gadgets360 \u2014 Gemini 3.5 series unveiled](https://www.gadgets360.com/ai/news/google-io-2026-gemini-omni-ai-videos-gemini-3-5-series-unveiled-details-11519424/amp) \u00b7 May 19, 2026\n\n### Google Flow Becomes a Creative Copilot\n\nFlow is the most AV-relevant product update in Google's I/O package, full stop. Google introduced Flow at I/O 2025 as a single-prompt video generation tool. The 2026 update is the platform release: Flow is now an end-to-end creative production environment with an agent, a programmable tools layer, and mobile clients on both iOS and Android.\n\n**Flow Agent** \u2014 multi-step planning and project-spanning execution. The agent handles brainstorming, storyboard development, scene generation, dialogue writing, character art, and multi-variation generation in a single conversational thread. The most useful affordance is **batch editing**: a change applied at the project level (a different lighting setup, a wardrobe shift, a tonal recolor) propagates across every shot in the project without re-prompting each one individually. Flow Agent is rolling out to all Flow users globally.\n\n**Flow Tools** \u2014 vibe-code your own utilities. Users can now build custom Flow tools \u2014 image editors, video resizers, custom shaders, hand-drawn animation passes, text-layering utilities \u2014 in natural language, no coding required. Built tools can be shared with other Flow users, who can remix them. All Flow users globally can use existing Flow Tools; Google AI subscribers can create and remix. This is the first major creative app to ship a user-built-tool-sharing surface analogous to what Cursor has for IDE rules, or what Apple's Shortcuts has for OS automations.\n\n**Flow Music** \u2014 section-by-section song editing, full-track covers, music video creation. The Gemini Omni integration in Flow Music means a user can generate a song with structural awareness (intros, verses, choruses, bridges via Lyria 3 Pro), then generate a synchronized music video for it via Omni Flash \u2014 all in one project.\n\n**Mobile**: Flow and Flow Music both shipped native iOS and Android apps this week. Web remains the primary platform for full feature access; mobile is positioned for on-the-go creation, capture-and-iterate flows, and the rough-cut work editors typically can't do in front of a workstation.\n\n**The numbers**: Flow has shipped to **140+ countries**, has generated **1.5 billion images and videos** since its 2025 launch, and Google reports **50 billion+ images created with Nano Banana** since Banana's summer 2025 release. VP for Google Labs Roman Yusuf framed the platform's repositioning: *\"Flow is evolving from this prompt-in, content-out tool to an agent that's a copilot at every step of the creative process.\"*\n\n**For AV teams**, Flow is now in a different category than it was at launch. The combination of Flow Agent (project-spanning), Flow Tools (custom utility creation), and Flow Music (audio + music video) plus Omni Flash inside the same surface puts Flow in the same conversation as Runway, Pika, and Adobe Firefly Video as production-pipeline candidates. The honest assessment: it's still maturing, and for high-end work the existing Resolve/Premiere/After Effects pipelines remain canonical. But for rapid prototyping, social-first content, pre-vis, mood-board work, and music-video work for branded content, Flow now reads as \"credible production tool\" rather than \"interesting consumer demo.\"\n\n**Source:** [Google \u2014 Flow updates at I/O 2026](https://blog.google/innovation-and-ai/products/gemini-app/next-evolution-gemini-app/) \u00b7 [Complete AI Training \u2014 Flow guides full video projects](https://completeaitraining.com/news/google-updates-flow-to-guide-video-projects-from-storyboard/) \u00b7 [CMOtech \u2014 Google adds AI agents and mobile apps to Flow](https://cmotech.in/story/google-adds-ai-agents-and-mobile-apps-to-creative-flow-tools) \u00b7 [Google \u2014 100 things we announced at I/O 2026](https://blog.google/innovation-and-ai/technology/ai/google-io-2026-all-our-announcements/) \u00b7 May 19, 2026\n\n### Lyria 3 + Lyria 3 Pro Ship for Developers\n\nGoogle's music-generation play landed with less fanfare than Omni or 3.5 Flash but is the more meaningful release for audio-side AV workflows. **Lyria 3 Clip** and **Lyria 3 Pro** are both available in public preview through the Gemini API and Vertex AI as of this week.\n\n**The two models**:\n\n- **Lyria 3 Clip** (`lyria-3-clip-preview`) \u2014 30-second high-quality clips, 44.1 kHz stereo, MP3 output. Optimized for speed and high-volume request workloads. Use cases: background loops, social-media stings, branded short-form audio\n- **Lyria 3 Pro** (`lyria-3-pro-preview`) \u2014 full songs up to **~3 minutes** with prompt-controllable duration, full structural awareness (intros, verses, choruses, bridges), MP3 or WAV output, 44.1 kHz stereo\n\n**Capabilities that distinguish Lyria 3 from the previous Lyria 2 series**:\n\n- **Vocals + timed lyrics** \u2014 generate vocals with timestamps, or pass in your own lyrics for the model to perform\n- **Multimodal input** \u2014 text prompt + up to 10 reference images that guide style, mood, and visual-to-audio coherence\n- **Eight languages** for vocal generation \u2014 English, German, Spanish, French, Hindi, Japanese, Korean, Portuguese\n- **SynthID watermarking + C2PA** on all outputs\n\n**Pricing on the Lyria 2 reference is $0.06 per 30 seconds of generated audio** \u2014 Lyria 3 specific per-token pricing isn't fully published yet, but the Lyria 2 anchor sets expectations for the Pro tier somewhere in the $0.10-0.20/minute range. Generations are capped at 10 regional online prediction requests per minute per base model in the preview period.\n\n**Workspace integration**: Google Workspace customers and Google AI subscribers can use Lyria 3 inside **Google Vids** to add a custom track that matches a brand's style \u2014 meaning the music generation surface is wired into the corporate-video creation flow that AV teams already use for internal client work.\n\n**For AV teams**, Lyria 3 sits next to **ElevenLabs Expressive Mode** (covered May 8) and the **OpenAI Realtime audio stack** (covered May 15) as the third credible foundation-model surface for audio-side workflows in active production. The three models target different problems \u2014 Lyria for music, ElevenLabs for character voice, OpenAI Realtime for live conversation \u2014 but the combined effect is that every audio surface an AV team touches now has a strong AI-native foundation option. Pair Lyria 3 Pro with Omni Flash inside Flow and the pre-vis-with-temp-score workflow is a single integrated session.\n\n**Source:** [Google Cloud \u2014 Lyria 3 on Vertex AI](https://cloud.google.com/blog/products/ai-machine-learning/lyria-3-and-lyria-3-pro-on-vertex-ai) \u00b7 [Google AI for Developers \u2014 Lyria 3 music generation](https://ai.google.dev/gemini-api/docs/music-generation) \u00b7 [Google \u2014 Lyria 3 for developers](https://blog.google/innovation-and-ai/technology/developers-tools/lyria-3-developers/) \u00b7 [Google Cloud \u2014 Lyria 3 documentation](https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/lyria/lyria-3) \u00b7 May 19, 2026\n\n### Karpathy Joins Anthropic, Plus Anthropic's Other Big Week\n\n**Andrej Karpathy joined Anthropic on May 19** \u2014 one of the most consequential individual hires in AI this year. The signaling, even more than the personnel.\n\n**The role**: Karpathy reports to pre-training team lead **Nick Joseph** and is building a brand-new team focused on **using Claude to accelerate Claude pre-training research itself**. Pre-training is the most compute-intensive and most expensive phase of building a frontier model. The bet Anthropic is making with this hire isn't \"more compute\" \u2014 it's \"use AI-assisted research to make the pre-training process itself more efficient and more effective.\" If the bet works, the structural economics of building frontier models shift in Anthropic's favor.\n\n**Why Karpathy specifically**: He co-founded OpenAI as one of the original 11 in 2015, led AI at Tesla (FSD, Autopilot), returned to OpenAI for a year, then ran Eureka Labs (his AI-education startup) before joining Anthropic this week. He's one of the few people in the industry who can credibly bridge LLM theory (his nanoGPT and the \"neural networks: zero to hero\" YouTube series), large-scale practical training (Tesla scale), and modern frontier model deployment.\n\n**The framing on X**: *\"I've joined Anthropic. I think the next few years at the frontier of LLMs will be especially formative. I am very excited to join the team here and get back to R&D.\"*\n\n**Anthropic also brought on Chris Rohlf** to the frontier red team \u2014 a 20-year cybersecurity veteran (Yahoo, Meta) \u2014 formalizing Anthropic's continued investment in the adversarial-testing layer that distinguishes its safety positioning.\n\n**The product-side context**: Anthropic shipped meaningfully more than just hires this week:\n\n- **May 18** \u2014 Web search tool returns richer SEC filing data, easier grounding for financial-research agents\n- **May 19** \u2014 **MCP tunnels in research preview** (connect Claude Managed Agents to MCP servers in your private network); **self-hosted sandboxes for Managed Agents** (run tool execution outside Anthropic infrastructure); live updates to MCP servers and tool configs during active sessions; large outputs (>100K tokens) automatically spill to a sandbox file with a truncated preview the model can read from\n- **May 21** \u2014 **Claude Compliance API integrations** with security and compliance tools for governance across the platform\n- Claude Code shipped four releases (v2.1.143 \u2192 v2.1.146) through the week with MCP pagination and reliability fixes\n\n**For AV teams**, the MCP tunnels release is the one to track. Production AV networks often have private infrastructure (Frame.io enterprise tiers, on-prem asset libraries, internal review platforms) that can't be exposed to Anthropic's cloud infrastructure for security reasons. MCP tunnels mean a Claude Managed Agent can now reach those private MCP servers without exposing them publicly. The self-hosted sandboxes release closes a parallel gap \u2014 tool execution stays inside the customer's network. Both are enterprise-grade releases that move Claude Managed Agents from \"interesting prototype\" to \"deployable inside a production AV environment with security review.\"\n\nThe broader story: Anthropic is making two parallel bets \u2014 research velocity (Karpathy) and enterprise deployment surface (MCP tunnels, sandboxes, Compliance API) \u2014 that together set up the company for the **late-2026 IPO that's reportedly the explicit target** at a ~$800B valuation. Whether the bets land is a 2027 question; this week was the setup.\n\n**Source:** [TechCrunch \u2014 Karpathy joins Anthropic](https://techcrunch.com/2026/05/19/openai-co-founder-andrej-karpathy-joins-anthropics-pre-training-team/) \u00b7 [CNBC \u2014 Anthropic hires Karpathy, former Tesla AI lead](https://www.cnbc.com/2026/05/19/anthropic-hires-openai-cofounder-andrej-karpathy-former-tesla-ai-lead.html) \u00b7 [Claude Platform \u2014 release notes May 18\u201321](https://platform.claude.com/docs/en/release-notes/overview) \u00b7 [The Next Web \u2014 Karpathy joins Anthropic pre-training](https://thenextweb.com/news/andrej-karpathy-joins-anthropic-openai-cofounder-pretraining) \u00b7 May 18\u201321, 2026\n\n### OpenAI's Reasoning Model Disproves an 80-Year-Old Math Conjecture\n\nOn May 20, OpenAI announced that an internal general-purpose reasoning model had disproved the **planar unit distance conjecture**, an 80-year-old open problem in discrete geometry first posed by Paul Erd\u0151s in 1946. The proof has been externally verified by **Fields Medalist Tim Gowers** and by mathematicians including Noga Alon, Melanie Wood, Thomas Bloom, Daniel Litt, Will Sawin, Arul Shankar, Jacob Tsimerman, and Victor Wang.\n\n**Why this matters even though it's not a video model**:\n\nFor 80 years, mathematicians believed the best constructions for the unit distance problem were essentially square-grid arrangements. OpenAI's model produced **a fundamentally new family of constructions** \u2014 yielding approximately n^(1+0.014) unit distances among n points (where the previous best was essentially linear in n with only logarithmic improvement). The exponent 0.014 looks small. It isn't. It's the first **polynomial improvement** on the problem in 80 years.\n\n**The construction draws on algebraic number theory** \u2014 specifically, infinite class field towers \u2014 to build the new configurations. This is a cross-field connection no human mathematician had previously made. OpenAI's framing on the model: *\"AI systems are now more capable of holding together long, difficult chains of reasoning and connecting ideas across fields in ways researchers may not have previously explored.\"*\n\nOpenAI calls this \"the first time AI has autonomously solved a prominent open problem central to a field of mathematics.\" The earlier false claim from a different research group earlier this spring (briefly viral, retracted within days) gave this announcement higher scrutiny than usual \u2014 Tim Gowers's validation is what makes the May 20 announcement credible.\n\n**Why this matters for AV teams indirectly**: The same capability \u2014 *\"hold together long, difficult chains of reasoning, connect ideas across fields\"* \u2014 is the underlying primitive for the agentic workflow tools AV teams are increasingly relying on. A model that can autonomously solve an 80-year-old open problem is the same model class that can autonomously hold together a 30-step production pipeline. The Erd\u0151s proof isn't a video model. It's a credibility marker for the entire reasoning-model category that the production-agent surface depends on. If reasoning models can disprove decades-old conjectures, the question of whether they can autonomously handle a multi-step asset-versioning workflow gets a different answer than it had three weeks ago.\n\nThe strategic context: OpenAI's reported IPO target is September 2026. A verified mathematical breakthrough sharpens the company's narrative that its reasoning models are approaching or exceeding human-expert capabilities in cognitively demanding fields.\n\n**Source:** [OpenAI \u2014 Model disproves discrete geometry conjecture](https://openai.com/index/model-disproves-discrete-geometry-conjecture/) \u00b7 [TechCrunch \u2014 OpenAI solves 80-year-old math problem](https://techcrunch.com/2026/05/20/openai-claims-it-solved-an-80-year-old-math-problem-for-real-this-time/) \u00b7 [Crypto Briefing \u2014 OpenAI solves Erd\u0151s unit distance problem](https://cryptobriefing.com/openai-solves-erdos-unit-distance-problem/) \u00b7 [Startup Fortune \u2014 Geometry breakthrough analysis](https://startupfortune.com/openais-geometry-breakthrough-may-be-its-strongest-case-yet-for-ai-as-co-discoverer/) \u00b7 May 20, 2026\n\n### Cannes 2026 Wrap: \"AI Came Out of the Closet\"\n\nCannes 2026 closes tomorrow (May 23). The festival press has converged on a single framing for the wrap: **AI \"came out of the closet\"** this year. The phrase comes from Variety's May 19 takeaways and has propagated through the Hollywood Reporter, Stephen Follows's March\u00e9 du Film analysis, and the secondary press cycle since.\n\n**The numbers**: 40,000 professionals at the festival, 16,000 registered at the March\u00e9 du Film from 140 countries. The March\u00e9 hosted **250 events** including conferences and panels, of which **45+ were AI-focused**. The \"AI on the Lot\" satellite conference (Todd Terrazas) has grown from 600 attendees in 2024 \u2192 1,200 in 2025 \u2192 an expected **2,000 in June 2026** at the Amazon lot in Culver City. The World AI Film Festival ran alongside the main festival, drawing **5,500 submissions from 80 countries** in its second year. Cannes formalized an \"AI for Talent Summit\" inside the March\u00e9 \u2014 invite-only, focused on how AI shifts the agent/talent business model.\n\n**The defining quote** came from Demi Moore at the jury press conference (May 12). Asked by Variety about AI in the industry and whether it should be more regulated: *\"AI is here. And so to fight it is to fight something that is a battle that we will lose. So to find ways in which we can work with it I think is a more valuable path to take.\"* When asked whether the industry is doing enough to protect itself: *\"I don't know the answer to that. My inclination would be to say probably not.\"* Moore added that AI *\"can never replace what true art comes from, which is not the physical \u2014 it comes from the soul.\"* The quote landed in part because of who said it (jury member, not random spokesperson) and in part because it was the first major Hollywood voice to say out loud what the rest of the room was already operating on: AI's role is settled; the open questions are procedural.\n\n**Stephen Follows**, in his March\u00e9 takeaways, framed the shift more precisely: *\"AI is regarded as an analyst, not an author.\"* Producers, distributors, and sales companies at the March\u00e9 openly discussed using AI for project analysis, audience simulation, focus-group testing, storyboarding, and marketing-copy generation. Discussion of AI as a creative author \u2014 generating performances, scripts, or final-cut sequences \u2014 remained contested, with **Steven Soderbergh's John Lennon documentary** (10% AI-generated footage, covered last week) as the most prominent test case.\n\n**Hollywood, notably, stayed home.** Christopher Nolan and Steven Spielberg both declined invitations. Studios cited budget constraints and \"fear of negative French critical reception damaging box office.\" The withdrawal created a gap, and independent AI-assisted productions filled it. Doug Liman's Bitcoin: Killing Satoshi (covered last week), Soderbergh's Lennon doc, Stephen Kay's Answr, the Storyverse slate, the Critterz follow-through, and the World AI Film Festival's 5,500 submissions all converged at the March\u00e9. The official competition continued its formal ban on AI-generated work \u2014 making the March\u00e9's openness the visible counterpoint.\n\n**The Gossip Goblin story is the leading indicator worth tracking.** Zack London's eight-person AI film outfit, run out of a Stockholm apartment with off-the-shelf AI tools, has hit **500 million-plus views** on satirical AI shorts. LA talent agents, producers, screenwriters, and A-list actors flew to Stockholm this spring to meet him. The pattern \u2014 kitchen-table AI studios producing audience-validated work without geographic, capital, or studio gatekeeping \u2014 is the structural shift Cannes 2026 acknowledged but didn't quite know how to absorb. Expect 10\u201320 more visible Gossip Goblin-equivalents by year-end as the cohort that watched this Cannes from the outside decides the timing is right.\n\n**The Meta partnership** with the festival (Meta House at the Majestic Hotel; Ray-Ban Meta smart glasses on a brigade of influencers; the Soderbergh documentary as a direct product of the partnership) drew a high-profile public backlash but didn't slow the underlying acceptance trend. The festival signed a multi-year deal with Meta. The deal will run regardless of the criticism it draws this week.\n\n**The wrap matters because the underlying questions are now settled.** Cannes 2024 and 2025 were \"should AI be in films?\" Cannes 2026 was \"what are the new disclosure norms, what are the new credit conventions, what are the new business models?\" The Human Provenance disclosure standard (covered last week) ships into this context as the procedural answer to the question Demi Moore left open. SAG-AFTRA's next negotiating cycle is the next watch-item. Some streamer will require disclosure to a recognized AI-use standard within 18 months; the watch is which streamer, when, and which standard.\n\n**Source:** [Variety \u2014 Cannes 2026 takeaways](https://variety.com/2026/film/news/cannes-2026-takeaways-hollywood-stayed-home-ai-club-kid-jordan-firstman-1236753294/) \u00b7 [Stephen Follows \u2014 Nine takeaways from the 2026 Cannes March\u00e9](https://stephenfollows.com/p/nine-takeaways-from-the-2026-cannes-marche-du-film) \u00b7 [Hollywood Reporter \u2014 Cannes market beyond film sales](https://www.hollywoodreporter.com/business/business-news/cannes-market-goes-beyond-film-with-ai-creator-economy-1236591832/) \u00b7 [Variety \u2014 Demi Moore on AI at Cannes](https://variety.com/2026/film/news/demi-moore-ai-hollywood-cannes-must-work-with-it-1236745587/) \u00b7 [Hollywood Reporter \u2014 Gossip Goblin](https://www.hollywoodreporter.com/movies/movie-news/gossip-goblin-zack-london-ai-films-watch-1236544634/) \u00b7 [AI Films Studio \u2014 Cannes 2026 wrap analysis](https://studio.aifilms.ai/blog/cannes-2026-ai-acceptance-hollywood-stayed-home) \u00b7 May 12\u201322, 2026\n\n### Quick Hits\n\n- **Google Pics** \u2014 new AI image creation and editing tool built on Nano Banana with **object-level segmentation, text editing + translation, and Workspace integration**. Trusted testers today; rolls out to Google AI Pro/Ultra subscribers and Workspace business preview this summer.\n- **Gemini Spark** \u2014 24/7 personal AI agent powered by Gemini 3.5 Flash, running on dedicated cloud VMs, with MCP support for third-party tools and explicit confirmation gates before high-stakes actions (sending emails, calendar events). Trusted testers this week; beta for US Google AI Ultra subscribers next week.\n- **Antigravity 2.0 + Managed Agents in the Gemini API** \u2014 single API call provisions a remote Linux sandbox + the Antigravity agent harness; pay-as-you-go pricing (100K\u20133M tokens per interaction typical); environment compute not billed during the preview period. **Antigravity SDK** lets developers self-host the harness with their own instructions, skills, and data.\n- **$100/month Google AI Ultra plan for developers** \u2014 5\u00d7 higher Gemini app + Antigravity limits than AI Pro, 20TB cloud storage, **YouTube Premium Lite included** ($8.99/mo value); also added free to Google AI Pro subscribers.\n- **WebMCP proposed as an open web standard** \u2014 browser-based AI agents call structured tools (JavaScript functions, HTML forms) for speed and reliability. Experimental WebMCP origin trial in **Chrome 149**; Gemini in Chrome support coming.\n- **TPU 8i** \u2014 Google's 8th-generation custom silicon, infrastructure under the I/O announcements. Continues Google's TPU vertical-integration play.\n- **HTML-in-Canvas API** \u2014 origin trial \u2014 embeds real DOM elements into a canvas with WebGL/WebGPU for app-like immersive 3D experiences that remain searchable, accessible, and interactive.\n\n---\n\n## Voices This Week\n\n### Demi Moore at Cannes: \"AI Is Here\"\n\nMoore's quote at the Cannes jury press conference is the defining Hollywood-voice quote on AI for 2026. *\"AI is here. Against-ness breeds against-ness. To fight it is to fight a battle that we will lose.\"* The reason it matters: Moore said it from the jury bench, not the press-tour PR cycle, and she said it without the protective framing most stars have used when discussing AI. The framing is exactly the framing Anthropic and Google have been pushing in their enterprise-marketing decks for two years. When that framing comes out of the mouth of a Hollywood A-list jury member at Cannes, the industry stopped pretending the debate was still open.\n\nThe unstated subtext is also worth noting: Moore's *\"are we doing enough to protect ourselves? Probably not\"* is the more important sentence. The fight that's settled is *whether* to use AI. The fight that's just starting is *how* to contract, credit, disclose, and govern AI use across talent agreements, studio deals, and streaming licenses. SAG-AFTRA's next negotiation is where Moore's \"probably not\" gets stress-tested.\n\n### Andrej Karpathy on Joining Anthropic\n\nKarpathy's announcement quote: *\"I think the next few years at the frontier of LLMs will be especially formative. I am very excited to join the team here and get back to R&D.\"* What's notable is the *\"get back to R&D\"* framing \u2014 Karpathy spent the last two years on AI-education (Eureka Labs), nanoGPT, and the \"neural networks: zero to hero\" YouTube series. The move to Anthropic isn't lateral; it's a return to frontier research after a period of public-facing pedagogy. For Anthropic, it's a credibility marker. For the broader industry, it's the strongest signal yet that the most senior practitioners believe the current LLM scaling trajectory is *still* the formative phase, not a plateau.\n\n### Sundar Pichai on Google's \"Agentic Gemini Era\"\n\nPichai's keynote framing: *\"As we look across the full stack of innovation, from the infrastructure behind TPU 8i to the frontier capabilities of Gemini 3.5 and Antigravity, it's clear we're firmly in our agentic Gemini era.\"* Google's entire I/O 2026 product slate \u2014 Spark, Flow Agent, Antigravity SDK, Managed Agents, WebMCP \u2014 is positioned around the agentic primitive. The competitive question is no longer \"what AI assistant should you use?\" but \"what agentic stack are you building on?\" That's the meta-positioning shift that this I/O codified.\n\n---\n\n## Common Threads\n\n### The Agentic Frame Is Now the Industry Frame\n\nThree years ago Google, OpenAI, Anthropic, and the secondary cohort talked about \"AI assistants.\" This I/O codified the industry's collective move to **agents** as the primary frame. Spark is an agent. Flow Agent is an agent. Antigravity 2.0 ships an agent SDK. WebMCP standardizes browser-agent tool calls. Anthropic's Karpathy hire is for AI-accelerated research agents. Even OpenAI's Erd\u0151s announcement is framed as an autonomous reasoning agent disproving a conjecture. The \"assistant\" framing has retired; the agent framing has won. For AV teams the practical implication is that workflows should be planned around multi-step, tool-calling, partially-autonomous agents \u2014 not single-prompt assistants \u2014 for the work that ships over the next 18 months.\n\n### The Audio + Video Generation Stack Just Collapsed Into One Surface\n\nThe May 22 release pattern is striking when you tile it together: Gemini Omni Flash (video gen) + Lyria 3 Pro (audio + music) + Flow Music (music videos) + Flow Agent (project orchestration) + Flow Tools (custom utility creation) are all available, in one platform, behind one subscription, today. ElevenLabs ships expressive voice; OpenAI ships realtime conversation; Krea ships style transfer; Adobe ships Firefly Video. The era of *\"one specialty tool per modality\"* is ending; the era of *\"one integrated production surface across modalities\"* has begun. The strategic implication for AV teams is to evaluate platforms holistically \u2014 not as a video tool versus a music tool versus a voice tool, but as integrated production surfaces.\n\n### The Compute-Versus-Research Bet Is Splitting Publicly\n\nAnthropic put Karpathy on Claude-accelerating-Claude-pre-training-research. Google's Gemini 3.5 Flash demo of building an OS in 12 hours with 93 parallel agents at <$1,000 is the same argument from the other direction \u2014 research velocity, not just compute capacity, is the lever. The compute-acquisition story (last week's Anthropic+SpaceX, OpenAI+Stargate, Google's TPU verticalization) hasn't gone away. But it's now running in parallel with a research-velocity story. Whoever wins the meta-research-acceleration race compounds faster on the long run. The Erd\u0151s proof is OpenAI's contribution to the same argument: \"our reasoning models are doing original research now.\"\n\n### Cannes 2026 Retired the AI Debate\n\nTwo weeks of Cannes coverage, three weeks counting last week's pulse, and the framing has fully converged: the festival closed the door on the *should* question. Soderbergh, Liman, the World AI Film Festival's 5,500 submissions, the \"AI on the Lot\" growth curve, Gossip Goblin's 500M-views-from-a-Stockholm-apartment, Demi Moore's quote, the March\u00e9's 45+ AI panels, the Human Provenance disclosure standard launch \u2014 these aren't an industry deciding whether to engage with AI. They're an industry that's engaged and now writing the procedural conventions. The remaining questions (credits, disclosure, contracts, talent rights, training-data licensing) are procedural, contested, and consequential \u2014 but they're not philosophical anymore.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Vibe-Code-Your-Own-Tool as a Creative Platform Feature\n\n**Flow Tools** is the first major creative app to let users build their own utilities through natural language and share them with other users. The implications go further than Google probably planned: the model of \"creator builds a small custom utility, shares it, gets remixed, propagates through the community\" is what Cursor has for IDE rules, what Apple Shortcuts has for OS automation, and what Notion templates has for documents. Adobe, Avid, Resolve, Premiere, and the rest of the AV-tooling cohort will all ship analogous surfaces within four to six quarters \u2014 the cost of *not* having a user-built-tool layer becomes too high as Flow demonstrates the value. AV teams that invest now in building and sharing custom Flow tools build community-leverage that compounds across the next 18 months.\n\n### Kitchen-Table AI Studios as the New Production Pattern\n\nGossip Goblin's 500M+ views, run out of a Stockholm apartment by an eight-person distributed team using off-the-shelf AI tools, is the production pattern of the next two years. The model is not new (smaller teams, lower budgets, off-the-shelf tools) \u2014 what's new is that the audience-validation surface (YouTube, Instagram, TikTok) closes the loop without studio gatekeeping or geographic centralization in LA/NY/London. Expect 10\u201320 visible kitchen-table AI studios by year-end. Watch which ones get acquired (a meaningful percentage will) and which ones graduate to studio production deals (a smaller percentage will).\n\n### AI as Co-Discoverer in Science\n\nOpenAI's Erd\u0151s result is the first credible case of AI autonomously contributing original mathematical knowledge. If reproducible across other open problems (the proof structure of the unit distance disproof leans heavily on cross-field connection \u2014 algebraic number theory applied to discrete geometry \u2014 which suggests the model class can do similar work in other domains), the implications for AV-adjacent research become near-term. Codec design, audio compression, color science, motion estimation, perceptual modeling \u2014 these are all open scientific problems where a \"reasoning model that can connect ideas across fields\" could meaningfully accelerate research. The interesting downstream question is which AV tool vendors integrate the same primitive into their R&D pipelines, and how quickly.\n\n### Conversational Video Editing as the Default UX\n\nGemini Omni Flash's conversational editing surface, Flow Agent's project-wide batch edits, Runway's Characters, Buzzy's \"Photoshop for AI video\" framing, and Adobe's continued expansion of natural-language editing in Premiere all point at the same UX convergence: **the next default editing UX is conversation**. The tool palette doesn't disappear, but the primary interaction model becomes \"ask the editor what you want changed.\" For AV teams the practical implication is that the conversational-editing muscle (writing precise editing prompts, knowing what to ask for, validating the model's interpretation) becomes a more valuable craft skill than mastering the next NLE's hotkey set.\n\n---\n\n## Tip of the Week\n\n### Build Your Memory Layer This Weekend \u2014 Start a Decisions Log\n\nTwo weeks ago we built a one-page personal context file (who you are, what your work is). Last week we built a reusable AI skill (one recurring task, captured as a reusable instruction set). This week's tip is the next layer: **start a decisions log.**\n\n**The problem it solves.** Even with a strong context file and a library of skills, the AI you work with still doesn't remember *what you've already decided*. You and the model worked through the right way to handle a tricky vendor handoff three weeks ago. You documented the choice nowhere. Now this week's prompt re-asks the same question, the model re-reasons from scratch, and you re-argue your way back to the same answer. Multiply that by every recurring decision you make and the lost time compounds.\n\n**What goes in a decisions log.** One row per decision. Five fields, that's it:\n\n1. **Date** \u2014 when you made the decision\n2. **Decision** \u2014 one sentence: what you decided\n3. **Context** \u2014 the situation that prompted it (two to three sentences)\n4. **Reasoning** \u2014 why you chose this option over the alternatives\n5. **Status** \u2014 *active* / *superseded* (link to the replacement) / *abandoned*\n\n**The five categories every AV professional should be logging from week one**:\n\n- **Tool choices** \u2014 \"we use Frame.io because the SSO integration with our Okta tenant is cleaner than DaVinci Resolve's\"\n- **Workflow norms** \u2014 \"we always cut at 24p for client review even when delivering 30p \u2014 the review feedback is more honest at 24p for some reason\"\n- **Client and stakeholder preferences** \u2014 \"Director X hates yellow color casts\" / \"Producer Y wants captions burned in by default for first cuts\" / \"Department head Z prefers Slack DMs over email for time-sensitive approvals\"\n- **Format and deliverable specs** \u2014 \"standard SDR master is BT.1886 + 16-235; standard HDR master is HDR10 P3-D65; archive master is ProRes 4444 12-bit\"\n- **Vendor relationships** \u2014 \"Vendor X delivers reliably but is slow; Vendor Y is faster but quality is inconsistent above 4K\"\n\n**Where to drop it.** Same places as the context file and the skills \u2014 a `DECISIONS.md` next to your `AGENTS.md`, a Claude Project file, a Notion database (if you want filtering), or a Google Doc paste-able into prompts. The format doesn't matter; the discipline of writing it down does. Reference it from prompts when continuing work: *\"check my decisions log for our standard SDR master format before suggesting changes.\"*\n\n**Why this builds compound leverage.** Skills (last week) tell AI *how* to do recurring work. Memory tells AI *what's already been decided*. Without memory, the model re-litigates settled questions every session. With memory, the model picks up where you and a previous-you left off \u2014 and future-you can audit your own past reasoning when a decision goes sideways. The compound effect over six months is that the AI you work with starts to *agree with you* about how your work is supposed to run, because it has the receipts.\n\nThis is Step 3 of the Agent OS framework. Week 1 (May 8) was **Identity + Context**. Week 2 (May 15) was **Skills**. Week 3 (this week) is **Memory**. Week 4 (next week, May 29) covers **Connections** \u2014 read-only access patterns for email, calendar, Slack, and your asset library, so your agent stack starts to *see* your actual work in addition to remembering what you've decided about it.\n\n---\n\n## Sources\n\n1. [Google \u2014 Sundar Pichai I/O 2026 opening keynote](https://blog.google/innovation-and-ai/sundar-pichai-io-2026/) \u2014 May 19, 2026 \u2014 Keynote remarks, Gemini 3.5 + Omni + Spark + Antigravity\n2. [Google \u2014 Gemini 3.5: frontier intelligence with action](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-5/) \u2014 May 19, 2026 \u2014 3.5 Flash launch and benchmarks\n3. [Google \u2014 Introducing Gemini Omni](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-omni/) \u2014 May 19, 2026 \u2014 Omni Flash launch and capabilities\n4. [Google \u2014 The next evolution of the Gemini app](https://blog.google/innovation-and-ai/products/gemini-app/next-evolution-gemini-app/) \u2014 May 19, 2026 \u2014 Gemini Spark + app updates\n5. [Google \u2014 100 things we announced at I/O 2026](https://blog.google/innovation-and-ai/technology/ai/google-io-2026-all-our-announcements/) \u2014 May 20, 2026 \u2014 Full I/O announcement roundup\n6. [Google Developers \u2014 All the news from the I/O 2026 Developer keynote](https://developers.googleblog.com/en/all-the-news-from-the-google-io-2026-developer-keynote/) \u2014 May 19, 2026 \u2014 Developer-side announcements\n7. [Google Cloud \u2014 Innovations from Google I/O 26](https://cloud.google.com/blog/products/ai-machine-learning/innovations-from-google-io-26-on-google-cloud) \u2014 May 19, 2026 \u2014 Cloud-side announcements\n8. [Google AI for Developers \u2014 Agents Overview](https://ai.google.dev/gemini-api/docs/agents) \u2014 May 2026 \u2014 Managed Agents API details\n9. [Google Cloud \u2014 Lyria 3 + Lyria 3 Pro on Vertex AI](https://cloud.google.com/blog/products/ai-machine-learning/lyria-3-and-lyria-3-pro-on-vertex-ai) \u2014 May 19, 2026 \u2014 Lyria 3 launch\n10. [Go     const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of May 22, 2026\n\n> Quick Summary: **Google I/O 2026 happened this week.** **Gemini Omni Flash** \u2014 a new multimodal video model with conversational editing \u2014 ships to the Gemini app, **Google Flow**, and free to **YouTube Shorts Remix** and **YouTube Create**. **Gemini 3.5 Flash** ships as a frontier model claiming **4\u00d7 the speed and < \u00bd the cost** of comparable models \u2014 Google demoed it building a functional OS in 12 hours with 93 parallel agents under $1,000 in API cost. **Google Flow becomes a creative copilot** with project-spanning Flow Agent, vibe-coded Flow Tools, and mobile apps. **Lyria 3 + Lyria 3 Pro** ship for developers \u2014 up to three-minute songs with vocals, lyrics, and multimodal input. **Andrej Karpathy joined Anthropic** to build a team using Claude to accelerate Claude pre-training itself; Anthropic also shipped MCP tunnels and self-hosted sandboxes. **OpenAI's reasoning model disproved an 80-year-old Erd\u0151s math conjecture** \u2014 Fields Medalist Tim Gowers verified. **Cannes 2026** closes tomorrow; the press has converged on the framing that AI \"came out of the closet\" this year, with Demi Moore's *\"AI is here, the fight against it is one we will lose\"* as the defining quote.\n\n---\n\n## The Big Stories This Week\n\n### Gemini Omni Flash \u2014 Google's New Multimodal Video Model Ships to Every Surface\n\nGoogle's I/O 2026 introduced **Gemini Omni** \u2014 the first model in a new family Google says can \"create anything from any input.\" The first available model is **Gemini Omni Flash**, targeting video first; image and audio outputs are on the roadmap.\n\n**What's new versus Veo and Nano Banana**:\n\n- **Multimodal input in one prompt** \u2014 combine text, images, video clips, audio references in a single request\n- **Conversational editing** \u2014 swap backgrounds, characters, wardrobes, voices, add cinematic zooms via chat\n- **Character consistency** \u2014 identity, voice, and lens look preserved across cuts automatically\n- **Real-world physics + scene continuity** \u2014 Google's stated focus area on the new model\n\n**Availability + pricing**:\n\n- **Gemini app + Google Flow** \u2014 global, Google AI Plus ($7.99/mo), Pro ($19.99/mo), Ultra ($249.99/mo)\n- **YouTube Shorts Remix + YouTube Create app** \u2014 free, 18+, with watermarking, source video links, and creator opt-outs\n- **10-second clip cap** \u2014 a product decision, not a technical limitation; cap will rise\n- **Developer/enterprise API** \u2014 Gemini API + Agent Platform API, \"coming weeks following launch,\" with SynthID + C2PA on all outputs\n\nThe honest assessment: raw video quality still trails Seedance 2.0 and Kling, but the conversational editing surface is best-in-class, and Flow + Omni Flash + Lyria 3 inside the same platform is a different proposition than any previous Google video release.\n\n### Gemini 3.5 Flash \u2014 Frontier-Class, 4\u00d7 Speed, < \u00bd Cost\n\nGoogle's headline I/O model launch. The first in a \"Gemini 3.5\" family positioned as \"frontier intelligence with action.\" Gemini 3.5 Pro coming next month.\n\n**Per Google's internal benchmarks**, 3.5 Flash beats **Claude Sonnet 4.6, Claude Opus 4.7, and GPT-5.5** on:\n\n- **MCP Atlas + Toolathlon** \u2014 agentic tool-use\n- **Finance agent v2** \u2014 multi-step analysis\n- **MMMU Pro** \u2014 multimodal understanding\n- **MRCR v2 (1M pointwise)** \u2014 long-context\n\n**Marquee demo**: Antigravity (Google's agent dev platform) used 3.5 Flash to build **a fully functional OS in 12 hours, with 93 agents in parallel, under $1,000 in API cost**.\n\n**Internal traction**: Gemini 3.5 Flash now driving **3 trillion-plus tokens/day** of internal Google usage, up from 500B/day in March.\n\n**For AV teams**, the question is whether 3.5 Flash is now the best agentic model for AV workflows. Worth A/B testing against your current stack this week. Anthropic and OpenAI will ship counter-positioning in the next 4\u20136 weeks.\n\n### Google Flow Becomes a Creative Copilot\n\nThe most AV-relevant I/O update. Flow shipped its V2 platform release with three additions:\n\n- **Flow Agent** \u2014 project-spanning planning + execution. Brainstorming, storyboarding, scene generation, dialogue, multi-variation generation, **batch editing across an entire project**. Rolling out to all Flow users globally.\n- **Flow Tools** \u2014 vibe-code your own utilities (image editors, video resizers, custom shaders, hand-drawn animation passes) in natural language; share them with other Flow users who can remix them. All users can use existing Tools; Google AI subscribers can create and remix.\n- **Flow Music** \u2014 section-by-section song editing, full-track covers, music video creation. Pairs Lyria 3 Pro (audio) with Omni Flash (video) inside one project.\n- **Mobile** \u2014 native iOS + Android apps shipped for Flow and Flow Music.\n\n**The numbers**: 140+ countries, 1.5B+ images/videos created since 2025 launch, 50B+ images created with Nano Banana since summer 2025.\n\nFor AV teams Flow now reads as \"credible production tool\" rather than \"interesting consumer demo\" \u2014 especially for rapid prototyping, social-first content, pre-vis, mood-board work, and music-video work for branded content.\n\n### Lyria 3 + Lyria 3 Pro Ship for Developers\n\nGoogle's music gen play, in public preview through the Gemini API + Vertex AI.\n\n- **Lyria 3 Clip** \u2014 30-second clips, 44.1 kHz stereo, MP3, optimized for speed and high-volume requests\n- **Lyria 3 Pro** \u2014 up to ~3-minute songs with full structural awareness (intros, verses, choruses, bridges), MP3 or WAV\n- **Vocals + timed lyrics**, or pass your own lyrics\n- **Multimodal input** \u2014 text prompt + up to 10 reference images\n- **8 languages** (English, German, Spanish, French, Hindi, Japanese, Korean, Portuguese)\n- **SynthID watermarking + C2PA**\n\n**Lyria 2 reference pricing**: $0.06 per 30 seconds. Lyria 3 specific pricing not yet published.\n\n**Workspace integration**: Lyria 3 is wired into **Google Vids** for custom branded soundtrack generation inside corporate-video workflows.\n\nLyria 3 + ElevenLabs Expressive (May 8) + OpenAI Realtime (May 15) = every audio surface an AV team touches now has a strong AI-native foundation option.\n\n### Karpathy Joins Anthropic, Plus Anthropic's Other Big Week\n\n**Andrej Karpathy joined Anthropic on May 19** \u2014 one of the most consequential individual AI hires of the year. He reports to pre-training lead Nick Joseph and is building a brand-new team focused on **using Claude to accelerate Claude pre-training research itself**. The bet: AI-assisted research velocity is how Anthropic stays competitive structurally, not just compute capacity.\n\nKarpathy was an original OpenAI co-founder (one of the original 11), led AI at Tesla, then ran Eureka Labs before joining this week.\n\nAnthropic also brought on **Chris Rohlf** (20-year cyber vet, Meta + Yahoo) to the frontier red team.\n\n**Product-side updates**:\n\n- **MCP tunnels in research preview** (May 19) \u2014 connect Managed Agents to MCP servers in private networks\n- **Self-hosted sandboxes for Managed Agents** (May 19) \u2014 run tool execution outside Anthropic infrastructure\n- **Compliance API integrations** (May 21) \u2014 security/compliance tools for platform governance\n- Claude Code v2.1.143 \u2192 v2.1.146 shipped through the week\n\n**For AV teams**, the MCP tunnels release is the one to track. Production AV networks often have private infrastructure (enterprise Frame.io, on-prem asset libraries, internal review platforms). MCP tunnels mean a Claude Managed Agent can now reach them without exposing them publicly.\n\nBroader context: Anthropic is reportedly valued at ~$800B with an IPO target as early as late 2026.\n\n### OpenAI's Reasoning Model Disproves an 80-Year-Old Math Conjecture\n\nOn May 20, OpenAI announced an internal general-purpose reasoning model disproved Erd\u0151s's 1946 **planar unit distance conjecture** \u2014 an 80-year-old open problem. The proof was verified by **Fields Medalist Tim Gowers** and mathematicians including Noga Alon, Melanie Wood, Thomas Bloom, and others.\n\nFor 80 years, mathematicians believed square-grid constructions were essentially optimal. OpenAI's model produced a fundamentally new family of constructions yielding **n^(1+0.014) unit distances** \u2014 the first polynomial improvement in 80 years. The construction draws on **algebraic number theory** (infinite class field towers) applied to discrete geometry \u2014 a cross-field connection no human mathematician had made.\n\nOpenAI's framing: **\"the first time AI has autonomously solved a prominent open problem central to a field of mathematics.\"**\n\n**Why this matters for AV teams indirectly**: the same capability \u2014 *\"hold together long, difficult chains of reasoning, connect ideas across fields\"* \u2014 is the primitive behind the agentic workflow tools production AV teams are increasingly relying on. A model that can autonomously disprove an 80-year-old conjecture is the same model class that can autonomously hold together a 30-step production pipeline.\n\n### Cannes 2026 Wrap: \"AI Came Out of the Closet\"\n\nCannes 2026 closes May 23. The press wrap has converged on a single framing: **AI \"came out of the closet\"** this year.\n\n**The numbers**: 40,000 professionals, 16,000 March\u00e9 registrants, 140 countries, 250 events at the March\u00e9 (45+ AI-focused), \"AI on the Lot\" growing 600 \u2192 1,200 \u2192 expected 2,000 in June, World AI Film Festival drawing 5,500 submissions from 80 countries.\n\n**The defining quote**: **Demi Moore** at the jury press conference (May 12): *\"AI is here. Against-ness breeds against-ness. To fight it is to fight a battle that we will lose. To find ways in which we can work with it is a more valuable path to take.\"* And the more important second half: *\"Are we doing enough to protect ourselves? I don't know. My inclination would be to say probably not.\"*\n\n**Stephen Follows** in his March\u00e9 wrap: *\"AI is regarded as an analyst, not an author.\"* Using AI for project analysis, audience simulation, storyboarding, and marketing copy is openly discussed. AI as creative author remains contested, with Soderbergh's Lennon doc the most prominent test case.\n\n**Hollywood stayed home** \u2014 Nolan and Spielberg declined invitations. The withdrawal created a gap that independent AI-assisted productions filled. The official competition continued its formal ban on AI-generated work; the March\u00e9's openness was the visible counterpoint.\n\n**The leading indicator**: **Gossip Goblin** (Zack London, Stockholm) \u2014 eight-person AI film outfit, off-the-shelf tools, **500M+ views** on satirical AI shorts. LA talent agents flying to Stockholm to meet him. Expect 10\u201320 more visible kitchen-table AI studios by year-end.\n\nThe framing has fully settled: the festival closed the door on the *should* question. The remaining questions are procedural \u2014 disclosure, credits, contracts, talent rights. SAG-AFTRA's next negotiating cycle is the watch-item.\n\n### Quick Hits\n\n- **Google Pics** \u2014 new AI image creation + editing tool (Nano Banana model), object-level segmentation, text editing + translation, Workspace integration. Trusted testers today; AI Pro/Ultra + Workspace business preview this summer.\n- **Gemini Spark** \u2014 24/7 personal AI agent powered by 3.5 Flash, cloud VMs, MCP support, confirmation gates before high-stakes actions. Trusted testers this week; beta for US AI Ultra next week.\n- **Antigravity 2.0 + Managed Agents in Gemini API** \u2014 single API call provisions a Linux sandbox + agent harness; pay-as-you-go (100K\u20133M tokens typical); Antigravity SDK for self-hosting.\n- **$100/month Google AI Ultra dev plan** \u2014 5\u00d7 higher limits than AI Pro, 20TB storage, YouTube Premium Lite included (also added free to AI Pro).\n- **WebMCP proposed as open web standard** \u2014 Chrome 149 origin trial; browser-based agents call structured tools via JS functions and HTML forms.\n\n---\n\n## Tip of the Week\n\n### Build Your Memory Layer This Weekend \u2014 Start a Decisions Log\n\nTwo weeks ago we built a one-page personal context file. Last week we built a reusable AI skill. This week's tip: **start a decisions log.**\n\n**The problem it solves.** Without memory, the AI you work with re-litigates settled questions every session. You and the model worked through the right way to handle a tricky vendor handoff three weeks ago \u2014 you documented the choice nowhere \u2014 this week's prompt re-asks the same question and you re-argue your way back to the same answer.\n\n**What goes in a decisions log** \u2014 one row per decision, five fields:\n\n1. **Date** \u2014 when you decided\n2. **Decision** \u2014 one sentence\n3. **Context** \u2014 the situation (2\u20133 sentences)\n4. **Reasoning** \u2014 why this option over alternatives\n5. **Status** \u2014 *active* / *superseded* / *abandoned*\n\n**Five categories every AV pro should be logging from week one**:\n\n- **Tool choices** \u2014 \"we use Frame.io because the SSO integration is cleaner\"\n- **Workflow norms** \u2014 \"we cut at 24p for client review because feedback is more honest\"\n- **Client and stakeholder preferences** \u2014 Director X hates yellow casts; Producer Y wants captions burned in\n- **Format and deliverable specs** \u2014 standard SDR master is BT.1886 + 16-235; HDR is HDR10 P3-D65\n- **Vendor relationships** \u2014 Vendor X is reliable but slow; Vendor Y is fast but inconsistent above 4K\n\n**Where to drop it**: a `DECISIONS.md` next to your `AGENTS.md`, a Claude Project file, a Notion database, or a Google Doc you can paste from. Reference it from prompts: *\"check my decisions log before suggesting changes.\"*\n\n**Why it compounds**: skills tell AI *how* to do recurring work. Memory tells AI *what's already been decided*. Six months in, the AI you work with starts agreeing with you about how your work is supposed to run \u2014 because it has the receipts.\n\nThis is Step 3 of the Agent OS framework. Week 1 = **Identity + Context**. Week 2 = **Skills**. Week 3 (this week) = **Memory**. Next week = **Connections**.\n\n---\n\n## Why This Week Matters\n\nA few patterns worth noting:\n\n- **The agentic frame is now the industry frame.** Three years ago the industry talked about AI assistants. This I/O codified the move to **agents** as the primary frame. Spark, Flow Agent, Antigravity, WebMCP, Anthropic's Karpathy hire (AI-accelerated research agents), OpenAI's Erd\u0151s announcement (autonomous reasoning agent disproving a conjecture). The \"assistant\" framing has retired; the agent framing has won.\n\n- **The audio + video generation stack just collapsed into one surface.** Gemini Omni Flash + Lyria 3 Pro + Flow Music + Flow Agent + Flow Tools = one platform, one subscription, multi-modal production. The era of *\"one specialty tool per modality\"* is ending; the era of *\"one integrated production surface across modalities\"* has begun. Strategic implication: evaluate platforms holistically, not as a video tool versus a music tool versus a voice tool.\n\n- **The compute-versus-research bet is splitting publicly.** Anthropic put Karpathy on Claude-accelerating-Claude-pre-training-research. Google's 3.5 Flash demo of building an OS in 12 hours with 93 parallel agents under $1,000 is the same argument from the other direction. The Erd\u0151s proof is OpenAI's contribution. Whoever wins the meta-research-acceleration race compounds faster on the long run.\n\n- **Cannes 2026 retired the AI debate.** The festival closed the door on the *should* question. Soderbergh, Liman, the World AI Film Festival's 5,500 submissions, Gossip Goblin's 500M views from a Stockholm apartment, Demi Moore's quote, the March\u00e9's 45+ AI panels, the Human Provenance disclosure standard. The remaining questions are procedural \u2014 credits, disclosure, contracts, talent rights, training-data licensing \u2014 and consequential, but not philosophical anymore.\n\n- **Vibe-code-your-own-tool surfaces are coming to creative software.** Flow Tools is the first major creative app to let users build custom utilities in natural language and share them with other users. Adobe, Avid, Resolve, Premiere will all ship analogous surfaces within 4\u20136 quarters. AV teams that invest now in building and sharing custom Flow tools build community-leverage that compounds across 18 months.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
