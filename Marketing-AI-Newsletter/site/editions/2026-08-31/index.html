      slug: "2026-08-31",
      editionTitle: "Week of August 31, 2026",
      editionMd: "# Monday Signal \u2014 Week of August 31, 2026\n\n> **AI agents got write access to live ad accounts this week: X shipped an MCP server with ten tools that create and activate campaigns, The Trade Desk opened its AI layer to Claude, and the IAB scheduled a framework for measuring ads served to agents.** Meanwhile humans lost levers: Meta's placement exclusions vanished from Ads Manager, and Google removed the Show more button from AI Overviews and started routing search clicks through encrypted redirects. Meta also agreed to pay up to $18 billion and cap teen use of Instagram and Facebook at two hours a day, which reprices an entire audience. And Samsung sold a drive for filmmakers with an ad no filmmaker made.\n\n---\n\n## The Conversation\n\n### Samsung sold a drive for filmmakers with an ad no filmmaker made\n\nSamsung's launch film for the Portable SSD P9, a drive pitched at professional video workflows and 12K recording, carried a disclosure for its entire runtime: \"This content is created using generative AI.\" So the product that's supposed to hold your footage was sold with footage nobody shot, to the one audience professionally trained to notice. Leaker Ben Geskin reposted it, r/videography took it apart, and Honor quote-posted behind-the-scenes photos from its own phone shoot on August 28 with \"none of these images or the upcoming videos are AI generated\" and a staged cough of \"SAMSUNG.\" It's Samsung's second AI-ad backlash of the year after February's Galaxy S26 low-light clip.\n\nTom Goodwin's LinkedIn post carried the marketing discourse: \"It's either an incredibly poor decision, or it's deliberately designed to get noticed by making people angry.\" The thread under it did the analysis. A former Samsung agency hand: \"once an audience senses the work isn't real, the doubt doesn't stay with the ad. It transfers to the brand\u2026 Efficiency is a line item. Trust is the balance sheet.\" Another commenter named the mechanism: advertising \"has always carried a cost signal,\" and an AI ad \"quietly says we were not willing to spend it.\"\n\n**Comment window:** open. The cost-signal argument is the unclaimed one: production spend was always part of the message, and AI production deletes it, most visibly to the audiences who make things for a living.\n\n**Source:** [Goodwin's post and thread](https://www.linkedin.com/posts/tomfgoodwin_that-samsung-made-an-entirely-ai-ad-is-astonishing-activity-7499387859070586880-ETJr) \u00b7 [CineD's analysis](https://www.cined.com/opinion-the-ai-ad-selling-storage-to-the-filmmakers-its-replacing-samsungs-portable-ssd-p9-campaign/) \u00b7 [Honor's response, via tech-ish](https://tech-ish.com/2026/08/28/honor-mocks-samsung-for-using-ai-in-its-ssd-ads/) \u00b7 August 27\u201329, 2026\n\n### \"Holy moly SEOs\": Google started expanding AI Overviews on its own\n\nChris Long posted the video on August 27: \"Holy moly SEOs: Google is now revealing the AI Mode prompt box BY DEFAULT for some queries. This is how Google continues to push AI Mode as the default search experience.\" Search Engine Roundtable replicated it the next day and Google confirmed: for some queries the AI Overview expands to its full answer with the \"Ask anything\" box open underneath, no Show more click required, organic results pushed well below the fold. Spokesperson Jennifer Kutz to The Verge: expansion happens \"for topics where our systems determine it's most useful for people,\" and it cancels if you've already started scrolling. Robby Stein added on X that Google is \"always testing and tuning these experiences.\"\n\nThe SEO reaction was less surprise than confirmation; the trigger is what stung. \"Where our systems determine it's most useful\" can't be audited or predicted from outside, so nobody can say which of their queries just lost the fold. The same week, Brainlabs data published by Digiday put a number on the drift: sessions across 54 clients fell 10.5% over the fourteen months bracketing AI Overviews' rollout, and 46 of the 54 lost traffic.\n\n**Comment window:** open and durable. The take with data attached pairs Long's video with the Brainlabs decline: the click loss now has a visible mechanism.\n\n**Source:** [Search Engine Land, with Long's post](https://searchengineland.com/google-is-dynamically-expanding-ai-overviews-for-some-queries-486200) \u00b7 [The Verge](https://www.theverge.com/tech/986364/google-search-ai-overviews-auto-expand) \u00b7 [Search Engine Watch, with Stein's reply](https://searchenginewatch.com/google-drops-show-more-button-pushes-users-into-ai-mode/) \u00b7 August 27\u201329, 2026\n\n### Meta's placement exclusions disappeared, and buyers found out first\n\nNo blog post, no release note. From August 25, advertisers reported the ad placements control gone from Ads Manager, replaced by value rules that can adjust bids from +1,000% down to a floor of \u221290%. That floor is the whole story: a placement can be made expensive to win but never impossible. Exclusion became suppression. Bram Van der Hallen of Edge.be surfaced the change on LinkedIn, and the practitioner threads filled in the history, because this was the last step in a sequence: detailed-targeting exclusions removed in January 2025, a default 5% of budget flowing to excluded placements from October 2025, campaign-level placement exclusions banned in the unified Advantage+ structure in February, and Explore Feed and Messenger Stories removed as selectable surfaces in API v26 this July.\n\nAdExchanger's Sarah Sluis published the companion story the same day: Meta's ad engineers are dispersing to OpenAI (roughly 10% of its staff list Meta experience), TikTok, Amazon, and Roku. Meta is retiring levers at the moment the people who understood why they existed are building the rival platforms.\n\n**Comment window:** open through Q4 builds. Practical posts win: what value rules can and can't do versus true exclusions, and how to document the \"preference, not prohibition\" principle for clients.\n\n**Source:** [PPC Land's weekly synthesis, carrying Van der Hallen's report and the AdExchanger story](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u00b7 August 25, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, threads, and statements where the week's arguments actually happened.\n\n- **Tom Goodwin, author and consultant** (LinkedIn, August 29, on Samsung's all-AI ad): \"It's either an incredibly poor decision, or it's deliberately designed to get noticed by making people angry.\" From his thread: \"Efficiency is a line item. Trust is the balance sheet.\" [The post](https://www.linkedin.com/posts/tomfgoodwin_that-samsung-made-an-entirely-ai-ad-is-astonishing-activity-7499387859070586880-ETJr)\n- **Chris Long, SEO consultant (@chris_nectiv)** (X, August 27): \"Holy moly SEOs: Google is now revealing the AI Mode prompt box BY DEFAULT for some queries. This is how Google continues to push AI Mode as the default search experience.\" [Via Search Engine Land](https://searchengineland.com/google-is-dynamically-expanding-ai-overviews-for-some-queries-486200)\n- **Jennifer Kutz, spokesperson, Google** (statement to The Verge, August 28): \"For some queries, AI Overviews may dynamically expand for topics where our systems determine it's most useful for people\u2026 If users have already begun scrolling to view content below the AI Overview, we cancel expansion so that the user doesn't lose their reading position.\" [The Verge](https://www.theverge.com/tech/986364/google-search-ai-overviews-auto-expand)\n- **Navah Hopkins, Microsoft Advertising** (LinkedIn comment on Marketing O'Clock's EP 447 post, August 24, clarifying the Max CPC change): \"Max CPC will remain for eCPC, Target Impression Share, Portfolio bidding. We understand not every brand can hit the conversion thresholds needed for conversion-based bidding to be effective.\" [The comment](https://www.linkedin.com/posts/marketing-o-clock_digitalmarketingnews-digitalmarketingpodcast-activity-7497639027114872832-ppHQ)\n- **Phil Weiser, Attorney General, Colorado** (statement on the Meta settlement, August 26): the relief goes \"well beyond what any court has ordered or is likely to order.\" [Reuters](https://www.reuters.com/business/meta-reaches-18-billion-settlements-over-childrens-social-media-addiction-2026-08-26/)\n- **Rob Bonta, Attorney General, California** (August 26): Meta \"has agreed to make massive transformations that will reduce the risk of harm from its platforms - and will do it within months.\" [MarketWatch](https://www.morningstar.com/news/marketwatch/20260826179/meta-dodges-big-tobacco-nightmare-with-18-billion-settlement-in-child-safety-lawsuit)\n- **Caroline Gigerich, VP of AI, IAB** (on the agentic-ads measurement framework due November 12): standard plumbing doesn't survive an agentic journey; UTM parameters and referral data fail to persist when an agent reads a page, forms a recommendation, and hands it back to a user. [Via PPC Land](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/)\n\n---\n\n## This Week in Marketing AI\n\n### AI agents got the ad account\n\nX launched X Ads MCP on August 24: a remote Model Context Protocol server inside its API gateway that exposes 23 advertising tools to any MCP-capable client, Grok and Claude Code included. Ten of the tools write to live accounts (create campaigns and line items, activate, pause, adjust budgets and creative), authenticated with the advertiser's own OAuth token. The structural safeguard is worth quoting because it's the only one: every campaign and line item is created paused, and nothing spends until a human explicitly activates it. No beta label, no rollout schedule; the endpoint and docs are live.\n\nThree days later The Trade Desk shipped Zuma, framed modestly as the Q3 update to Kokai (a claimed 32% average CPA cut across 62 campaigns compares the new optimization model with the old one, not against a control). The decision that matters sits in one line: The Trade Desk is opening its AI layer to external tools, including Claude, so agencies can run the platform from interfaces they already use. For a company whose identity rests on independence from walled gardens, conceding that the interface is no longer where the relationship is won is consistent, and it's a tell about where buying is heading.\n\nAnd the IAB confirmed on August 24 that it's building a framework to measure and attribute ads served to AI agents, targeting November 12. Agents can now spend the money; the standard for counting what they bought is eleven weeks out.\n\n**Source:** [PPC Land on X Ads MCP](https://ppc.land/x-ads-mcp-gives-grok-and-claude-code-23-tools-to-run-ad-campaigns/) \u00b7 [PPC Land's weekly synthesis on Zuma and the IAB framework](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u00b7 August 24\u201327, 2026\n\n### Meta will pay up to $18 billion and cap teen use at two hours a day\n\nEight days into a federal trial in Oakland, with Instagram's Adam Mosseri already on the stand and Mark Zuckerberg scheduled, Meta settled with 47 states, DC, and three territories on August 26. The money: at least $12.1 billion guaranteed over ten years, up to roughly $5 billion more contingent on competitors adopting matching limits, plus $459 million resolving Cambridge Analytica claims; headline totals run from $17 billion (AP) to $18 billion (Reuters). Texas took a separate deal worth more than $1 billion; Florida and New Mexico stayed out. Meta admits no wrongdoing and will book a $10 billion legal charge this quarter that wasn't in guidance. Four of the states had been seeking penalties up to $1.4 trillion.\n\nFor marketers the product terms outrank the dollars: a daily two-hour limit on Instagram and Facebook for users 13 to 17, nighttime blocks, and expanded parental supervision, on a timeline California's AG describes as \"within months.\" Capped teen time is capped teen inventory. Reach and frequency assumptions for Gen Z plans built on Meta will need rebuilding, and the contingency structure gives every other platform a financial reason to adopt the same clock.\n\n**Source:** [Reuters](https://www.reuters.com/business/meta-reaches-18-billion-settlements-over-childrens-social-media-addiction-2026-08-26/) \u00b7 [AP News](https://apnews.com/article/meta-trial-instagram-settlement-97d342f2a33d835eda2356c5e1af9e37) \u00b7 [CNN](https://www.cnn.com/2026/08/26/tech/meta-states-settle-trial-children) \u00b7 [MarketWatch on the $10B charge](https://www.morningstar.com/news/marketwatch/20260826179/meta-dodges-big-tobacco-nightmare-with-18-billion-settlement-in-child-safety-lawsuit) \u00b7 August 26, 2026\n\n### Google kept the transaction inside search and encrypted the way out\n\nThree moves in one week. On August 27, AI Mode gained the ability to complete hotel bookings inside the product, paid through Google Pay, in US English with a partner list running from Booking.com and Expedia through Hilton, Marriott, and Wyndham; flight price tracking with target-price alerts went live in 180-plus countries. On August 28, Google confirmed AI Overviews now dynamically expand to full answers for some queries (see The Conversation). And on August 26, Search Engine Roundtable confirmed that Google is routing search clicks through an encoded google.com/goto passthrough redirect instead of linking directly, a mechanism in testing since July that Nozzle's Derek Perkins observed at near-total coverage across residential IPs. Google declined to comment.\n\nThe redirect is anti-scraping engineering, and its collateral effect is measurement: an encoded link can't be decoded without following it, which pushes rank-tracking tools into hundreds of requests per results page. Put the three together and the shape is clear. More of the journey completes inside Google's surfaces, the surfaces expand to fill the screen, and the exits get harder for anyone outside Google to observe. Marketing O'Clock devoted its August 31 episode to the /goto change.\n\n**Source:** [Search Engine Roundtable's week recap](https://www.seroundtable.com/video-08-28-2026-41963.html) \u00b7 [Marketing O'Clock EP 448](https://marketingoclock.com/episodes/well-goto-a-world-with-google-searchs-goto-tracking-parameters/) \u00b7 [PPC Land's weekly synthesis on hotel booking and the redirect](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u00b7 August 26\u201328, 2026\n\n### AI search got audited from three directions, and the audits agree\n\nThe advertiser view came from Brainlabs via Digiday on August 25: 54 clients across 19 sectors, January 2025 to April 2026, aggregate sessions down 10.5% (140.1 million to 125.4 million), with 46 of 54 losing traffic. The business view is harsher. A peer-reviewed study (arXiv 2608.07069, Norly Research) mapped 4,776 food venues in two Bali districts and ran 2,208 queries across ChatGPT, Claude, Gemini, and Perplexity: at least 85.6% of venues were never recommended by any system in any run. Owning a website raised the odds of inclusion 1.92 times; review volume 1.64 times. Then the accuracy check: Empirank audited 182 businesses OpenAI systems had recommended and found 24 incorrect claims, roughly one in nine, with 479 more unconfirmed.\n\nThe commercial layer keeps growing on the same substrate. Adthena has retail taking 39% of ChatGPT advertising, with ads reaching 4.47% of US queries at one item per answer, which is the benchmark European buyers inherited when EEA ads launched on August 24 without personalization. Traffic down, most businesses invisible, one in nine recommendations wrong, and ad load rising: the distribution layer is being built faster than anyone is checking it.\n\n**Source:** [PPC Land's weekly synthesis, carrying the Digiday, arXiv, Empirank, and Adthena data](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u00b7 August 25, 2026\n\n### Nobody owns the audit: three lawsuits about content made at scale\n\nSony Music and nine labels sued Kroger and eighteen related entities on August 21, identifying at least 392 unauthorized uses of Sony recordings across the grocer's social accounts; the complaint notes fourteen prior Sony licenses to Kroger since 2017, a first notice in June 2025, and new allegedly infringing posts as recently as August 12. Statutory exposure tops out near $58.8 million. The defendant list is the story: dozens of banners and subsidiaries, each posting, none apparently responsible for clearance.\n\nTwo more filings made the same point from different angles. A Twitch creator filed a class action against Twitch and Amazon on August 20 alleging roughly two years of streams, clips, and chat logs were fed into Amazon's Nova Reel video model without consent, pointing to terms-of-service and privacy-notice amendments made on the same day this August as evidence the earlier license never covered training. And Liquid Death drew a suit over \"zero sugar\" cans that list allulose second by weight. The common thread: decentralized teams producing marketing at machine scale, with no function that owns whether it's licensed, labeled, or true. Cloudflare's Bot Preference Sync, which now writes robots.txt from a dashboard policy, is the infrastructure layer's version of the same fix arriving late.\n\n**Source:** [PPC Land's weekly synthesis, from the court filings](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u00b7 August 20\u201324, 2026\n\n### Microsoft turned on AI Max everywhere, and its ads liaison answered the Max CPC question\n\nMicrosoft Advertising's AI Max reached all accounts this week: keyword-free matching, real-time text customization, and final URL expansion with exclusions, arriving alongside the October 1 removal of Max CPC for new campaigns that we covered last week. Marketing O'Clock's August 24 episode led with it and raised two questions; Navah Hopkins of Microsoft answered both in the comments, which is where the useful detail lives. AI Max is a campaign-level setting, and ad-group-level settings (scheduling, location targeting, negatives, audiences) survive when it's on. And Max CPC isn't disappearing wholesale: it \"will remain for eCPC, Target Impression Share, Portfolio bidding,\" because \"not every brand can hit the conversion thresholds needed for conversion-based bidding to be effective.\"\n\nThat's a more nuanced position than Google's, which is why it belongs on the record. Microsoft is removing the manual ceiling where it overrides conversion goals and keeping it where accounts lack the conversion data to bid on. Bing also shipped an AI Max search-term landing page report with twelve default columns, and is testing renaming its Copilot Search answer box to \"AI Overview,\" adopting the competitor's vocabulary because comprehension beats differentiation.\n\n**Source:** [Marketing O'Clock EP 447](https://poddtoppen.se/podcast/1401725029/marketing-oclock-digital-marketing-news/microsofts-ai-max-is-going-all-around-the-globe) \u00b7 [Hopkins's clarifications](https://www.linkedin.com/posts/marketing-o-clock_digitalmarketingnews-digitalmarketingpodcast-activity-7497639027114872832-ppHQ) \u00b7 [PPC Land's weekly synthesis on the Bing items](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u00b7 August 24\u201328, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/).*\n\n- **Google's ads product wave** (August 25\u201327): Gemini Omni video creation in Asset Studio, Performance Max channel-prioritization controls in test, LSA direct booking expanded to 500-plus partners, a report showing which AI-generated product titles actually serve, and Demand Gen gaining messaging ads and AI video creation. [Search Engine Land's PPC index](https://searchengineland.com/library/ppc)\n- **Local Services Ads will bill for calls you don't answer** from October 1: unanswered calls during business hours become billable if the caller holds 20-plus seconds, and follow-up calls bill even when the first contact didn't qualify. Fix the phone tree before the invoice changes.\n- **Google won't enforce site reputation abuse in the EEA** from August 30 under a European Commission mandate; EEA searchers \"will not benefit from Google's spam prevention\" for labeled sites. Parasite SEO just got a regional exemption. [Search Engine Roundtable](https://www.seroundtable.com/recap-08-28-2026-41971.html)\n- **Google Search dropped fresh content for about eighty minutes** on August 28 (WSJ, NYT, and CNN pages missing from results), fixed by 7:35am ET. Annotate it. [Search Engine Roundtable](https://www.seroundtable.com/google-search-indexing-issues-41972.html)\n- **Cloudflare's Bot Preference Sync** rolled to all plans: it writes your robots.txt from the AI-bot policies set in the dashboard, prepending generated directives so existing rules survive.\n- **AI Mode added link carousels for developing topics**, and Robby Stein asked X what people want next from AI Mode. John Mueller's guidance for \"SEO for AI responses\": nothing special to do. [Search Engine Roundtable's recap](https://www.seroundtable.com/video-08-28-2026-41963.html)\n- **LinkedIn's slop button reached the business press:** Fortune carried the one-million-clicks milestone with Pangram's July data, which had LinkedIn as the most AI-saturated platform, with 40%-plus of long-form posts flagged as fully AI-generated. [Fortune](https://fortune.com/2026/08/25/1-million-people-clicked-linkedin-ai-slop/)\n- **Google Ads updates its alcohol advertising policy September 30**, and is testing a sign-in prompt inside AI Mode responses. [Search Engine Roundtable](https://www.seroundtable.com/recap-08-28-2026-41971.html)\n- **Grindr paid \u00a326 million** to settle a UK claim over alleged HIV-data sharing, and **Amazon opened B2B deals to 11 million business accounts** across ten markets.\n\n---\n\n## Common Threads\n\n### Hands off the wheel, by design\n\nEvery interface change this week reduced what a human chooses or can see. Agents got write access to ad accounts; Meta removed the last placement lever; Google removed the Show more button and the direct link. None of it was announced as a philosophy, and together it's one.\n\n### Trust is the balance sheet\n\nSamsung saved on production and paid in brand; Meta is booking $10 billion this quarter for design choices made years ago; Kroger's 392 unlicensed tracks came from teams optimizing for output. Efficiency decisions get billed to the mother brand, on a delay.\n\n### Distribution moved inside the answer\n\nHotel bookings complete in AI Mode, AI Overviews expand to full answers, and Brainlabs measured the sessions that stopped arriving. The page is becoming the raw material the answer was made from, and the exits are getting harder to observe.\n\n### The audit gap\n\nBali: 85.6% of businesses never recommended. Empirank: one in nine recommendations wrong. The IAB's measurement framework for agent-served ads is due November 12. Machines are distributing and buying; the counting comes later.\n\n---\n\n## Angles for the Week\n\n### Your ad account has an API for agents now. Where's the approval gate?\n\nX Ads MCP's paused-by-default rule is the one safeguard shipping with the capability, and it's the right model for a post: ten write tools, one human activation step, what a client-side approval gate should look like before agencies wire Claude into live budgets. Window: open and evergreen through Q4, sharpest while X's launch is fresh.\n\n### The cost signal\n\nAdvertising always carried a message about spend: real production says the brand was willing to pay for craft. An all-AI ad removes that signal, and the audience that notices first is the one that makes things for a living, which is exactly who Samsung was selling to. Window: this week, with Goodwin's thread as the receipt.\n\n### Show more is gone, and here's what it costs\n\nLong's video shows the mechanism; Brainlabs' 10.5% shows the outcome. A post that connects the two, with the \"our systems determine it's most useful\" trigger as the unauditable part, will travel among SEOs and CMOs alike. Window: open; durable as expansion spreads.\n\n### Exclusion became suppression\n\nMeta buyers heading into Q4 need a value-rules playbook: what a \u221290% floor can and can't do, how to document the five steps that got here, how to set client expectations that \"excluded\" now means \"discouraged.\" Window: before Q4 builds lock, so the next two weeks.\n\n### Two hours a day\n\nThe settlement's product terms will land within months. A plan-level take on what capped teen time does to reach and frequency on Meta, and why the contingency clause gives TikTok and Snap a financial reason to adopt the same clock, is ahead of where most media coverage stopped. Window: settlement week for the hook; durable through implementation.\n\n---\n\n## Sources\n\n**Primary posts, statements, and episodes**\n\n1. [Tom Goodwin \u2014 LinkedIn post and thread on Samsung's AI ad](https://www.linkedin.com/posts/tomfgoodwin_that-samsung-made-an-entirely-ai-ad-is-astonishing-activity-7499387859070586880-ETJr) \u2014 August 29, 2026 \u2014 verbatim quotes in Voices and The Conversation\n2. [Marketing O'Clock \u2014 EP 447 post with Navah Hopkins's clarifications](https://www.linkedin.com/posts/marketing-o-clock_digitalmarketingnews-digitalmarketingpodcast-activity-7497639027114872832-ppHQ) \u2014 August 24, 2026 \u2014 Microsoft's Max CPC and AI Max settings detail\n3. [Marketing O'Clock \u2014 EP 447, Microsoft's AI Max Is Going All Around the Globe](https://poddtoppen.se/podcast/1401725029/marketing-oclock-digital-marketing-news/microsofts-ai-max-is-going-all-around-the-globe) \u2014 August 24, 2026 \u2014 episode\n4. [Marketing O'Clock \u2014 EP 448, the /goto tracking parameters](https://marketingoclock.com/episodes/well-goto-a-world-with-google-searchs-goto-tracking-parameters/) \u2014 August 31, 2026 \u2014 episode\n\n**Original reporting**\n\n5. [Reuters \u2014 Meta agrees to pay $18 billion to settle US lawsuits](https://www.reuters.com/business/meta-reaches-18-billion-settlements-over-childrens-social-media-addiction-2026-08-26/) \u2014 August 26, 2026 \u2014 settlement terms, Weiser quote\n6. [AP News \u2014 Meta reaches $17 billion settlement with states](https://apnews.com/article/meta-trial-instagram-settlement-97d342f2a33d835eda2356c5e1af9e37) \u2014 August 26, 2026 \u2014 trial context, state figures\n7. [CNN \u2014 Meta settles landmark child harm case](https://www.cnn.com/2026/08/26/tech/meta-states-settle-trial-children) \u2014 August 26, 2026 \u2014 product changes, penalties sought\n8. [MarketWatch via Morningstar \u2014 Meta dodges 'Big Tobacco' nightmare](https://www.morningstar.com/news/marketwatch/20260826179/meta-dodges-big-tobacco-nightmare-with-18-billion-settlement-in-child-safety-lawsuit) \u2014 August 26, 2026 \u2014 $10B Q3 charge, Bonta quote, Lalka comparison\n9. [Search Engine Land \u2014 Google is dynamically expanding AI Overviews](https://searchengineland.com/google-is-dynamically-expanding-ai-overviews-for-some-queries-486200) \u2014 August 28, 2026 \u2014 Google's confirmation, Long's post\n10. [The Verge \u2014 Google further buries search results under AI mode](https://www.theverge.com/tech/986364/google-search-ai-overviews-auto-expand) \u2014 August 28, 2026 \u2014 Kutz statement\n11. [Search Engine Watch \u2014 Google drops Show more button](https://searchenginewatch.com/google-drops-show-more-button-pushes-users-into-ai-mode/) \u2014 August 29, 2026 \u2014 Stein's reply\n12. [Search Engine Roundtable \u2014 AI Overviews -ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/) \u2014 August 2026 \u2014 discovery index; carries Digiday's Brainlabs and AdExchanger talent stories, the arXiv Bali study, Empirank, Adthena, the IAB framework, Zuma, the placement-control change, LSA billing, hotel booking, court filings (Sony v. Kroger 2:26-cv-09358; Pandiscia v. Twitch 3:26-cv-08721; Williamson v. Supplying Demand 3:26-cv-08839), Cloudflare Bot Preference Sync, Grindr, Amazon B2B\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# Monday Signal \u2014 Week of August 31, 2026\n\n> **AI agents got write access to live ad accounts (X Ads MCP's ten write tools, The Trade Desk opening its AI layer to Claude) while humans lost levers (Meta's placement exclusions gone, Google's Show more button gone, search clicks routed through encrypted redirects).** Meta will pay up to $18B and cap teen use at two hours a day. Samsung sold a filmmakers' drive with an ad no filmmaker made.\n\n---\n\n## The Conversation\n\n### Samsung's all-AI ad for a filmmakers' drive\n\nThe Portable SSD P9 launch film ran a \"created using generative AI\" disclosure for its whole runtime, selling 12K storage with footage nobody shot, to editors. Honor mocked it; r/videography dismantled it. Tom Goodwin's thread carried the lesson: \"once an audience senses the work isn't real, the doubt doesn't stay with the ad. It transfers to the brand\u2026 Efficiency is a line item. Trust is the balance sheet.\" [Goodwin's post](https://www.linkedin.com/posts/tomfgoodwin_that-samsung-made-an-entirely-ai-ad-is-astonishing-activity-7499387859070586880-ETJr)\n\n### \"Holy moly SEOs\": AI Overviews expand on their own\n\nChris Long (Aug 27): Google is \"revealing the AI Mode prompt box BY DEFAULT for some queries.\" Google confirmed: full answers, open Ask-anything box, organic pushed down, triggered \"where our systems determine it's most useful.\" Pair with Brainlabs via Digiday: sessions down 10.5% across 54 clients, 46 of them losing traffic. [Search Engine Land](https://searchengineland.com/google-is-dynamically-expanding-ai-overviews-for-some-queries-486200) \u00b7 [The Verge](https://www.theverge.com/tech/986364/google-search-ai-overviews-auto-expand)\n\n### Meta's placement exclusions vanished\n\nFrom Aug 25, the placements control was gone from Ads Manager; value rules with a \u221290% floor replaced it. Exclusion became suppression, the last step in a sequence running since January 2025. Same day, AdExchanger documented Meta's ad engineers dispersing to OpenAI, TikTok, Amazon, and Roku. [PPC Land weekly](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/)\n\n---\n\n## Voices\n\n- **Tom Goodwin (LinkedIn, Aug 29):** Samsung's ad is \"either an incredibly poor decision, or it's deliberately designed to get noticed by making people angry.\" [Post](https://www.linkedin.com/posts/tomfgoodwin_that-samsung-made-an-entirely-ai-ad-is-astonishing-activity-7499387859070586880-ETJr)\n- **Jennifer Kutz, Google (to The Verge):** AI Overviews expand \"for topics where our systems determine it's most useful for people.\" [The Verge](https://www.theverge.com/tech/986364/google-search-ai-overviews-auto-expand)\n- **Navah Hopkins, Microsoft Advertising (LinkedIn, Aug 24):** \"Max CPC will remain for eCPC, Target Impression Share, Portfolio bidding.\" [Comment](https://www.linkedin.com/posts/marketing-o-clock_digitalmarketingnews-digitalmarketingpodcast-activity-7497639027114872832-ppHQ)\n- **Phil Weiser, Colorado AG (Aug 26):** the Meta relief goes \"well beyond what any court has ordered or is likely to order.\" [Reuters](https://www.reuters.com/business/meta-reaches-18-billion-settlements-over-childrens-social-media-addiction-2026-08-26/)\n\n---\n\n## This Week in Marketing AI\n\n### AI agents got the ad account\n\nX Ads MCP (Aug 24): 23 tools for any MCP client, ten of them writes; everything created paused, nothing spends until a human activates. The Trade Desk's Zuma (Aug 27) opens its AI layer to Claude; the 32% CPA claim compares new model to old, not to a control. IAB: a framework for measuring ads served to agents, due Nov 12. Agents can spend; counting comes later. [PPC Land on X Ads MCP](https://ppc.land/x-ads-mcp-gives-grok-and-claude-code-23-tools-to-run-ad-campaigns/)\n\n### Meta: up to $18B and a two-hour teen clock\n\nSettled Aug 26 with 47 states, DC, three territories, eight days into trial: $12.1B guaranteed, up to ~$5B contingent on rivals adopting matching limits, $10B charge this quarter, no admission. Product terms: two hours a day on Instagram and Facebook for ages 13\u201317, nighttime blocks, parental tools, \"within months.\" Capped teen time is capped teen inventory. [Reuters](https://www.reuters.com/business/meta-reaches-18-billion-settlements-over-childrens-social-media-addiction-2026-08-26/) \u00b7 [AP](https://apnews.com/article/meta-trial-instagram-settlement-97d342f2a33d835eda2356c5e1af9e37)\n\n### Google keeps the transaction and encrypts the exit\n\nAI Mode books hotels via Google Pay (Aug 27; Booking.com, Expedia, Hilton, Marriott, Wyndham). AI Overviews auto-expand (Aug 28). Search clicks route through encoded google.com/goto redirects (confirmed Aug 26; anti-scraping, but rank trackers now need hundreds of requests per SERP). More journey inside Google, fewer observable exits. [SER recap](https://www.seroundtable.com/video-08-28-2026-41963.html) \u00b7 [Marketing O'Clock EP 448](https://marketingoclock.com/episodes/well-goto-a-world-with-google-searchs-goto-tracking-parameters/)\n\n### AI search audited from three sides\n\nBrainlabs/Digiday: sessions \u221210.5% across 54 clients. Bali study (arXiv 2608.07069): 85.6% of 4,776 venues never recommended by ChatGPT, Claude, Gemini, or Perplexity; a website lifts odds 1.92x. Empirank: 1 in 9 OpenAI recommendations wrong. Adthena: ads on 4.47% of US ChatGPT queries, retail 39% of them. Distribution is being built faster than it's checked. [PPC Land weekly](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/)\n\n### Nobody owns the audit\n\nSony v. Kroger: 392 unlicensed uses across dozens of banners, exposure ~$58.8M. A Twitch creator's class action says Amazon trained Nova Reel on streams without consent, pointing to same-day ToS and privacy amendments. Liquid Death sued over \"zero sugar\" cans listing allulose. Decentralized teams, machine-scale output, no owner for legal. [PPC Land weekly](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/)\n\n### Microsoft AI Max everywhere, with a nuanced Max CPC answer\n\nAI Max reached all Microsoft Advertising accounts. Navah Hopkins clarified: campaign-level setting, ad-group settings survive, and Max CPC stays for eCPC, Target Impression Share, and portfolio bidding because \"not every brand can hit the conversion thresholds.\" Bing is testing \"AI Overview\" as the name for its Copilot Search box. [EP 447](https://poddtoppen.se/podcast/1401725029/marketing-oclock-digital-marketing-news/microsofts-ai-max-is-going-all-around-the-globe) \u00b7 [Hopkins](https://www.linkedin.com/posts/marketing-o-clock_digitalmarketingnews-digitalmarketingpodcast-activity-7497639027114872832-ppHQ)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [PPC Land's weekly roundup](https://ppc.land/the-week-ai-agents-got-the-ad-account-and-meta-got-a-two-hour-clock/).*\n\n- **Google Ads wave:** Gemini Omni video in Asset Studio, PMax channel-prioritization test, LSA direct booking to 500+ partners, AI product-titles report, Demand Gen messaging ads. [SEL PPC index](https://searchengineland.com/library/ppc)\n- **LSA bills unanswered calls from Oct 1** (20-second hold threshold; follow-ups billable).\n- **No site-reputation-abuse enforcement in the EEA** from Aug 30, per an EC mandate. [SER](https://www.seroundtable.com/recap-08-28-2026-41971.html)\n- **Google dropped fresh content for ~80 minutes** on Aug 28. [SER](https://www.seroundtable.com/google-search-indexing-issues-41972.html)\n- **Cloudflare Bot Preference Sync** writes robots.txt from dashboard AI-bot policies.\n- **AI Mode link carousels** for developing topics; Mueller on SEO for AI responses: nothing special to do. [SER recap](https://www.seroundtable.com/video-08-28-2026-41963.html)\n- **Fortune carried the slop-button milestone** with Pangram's data: 40%+ of LinkedIn long-form posts fully AI-generated. [Fortune](https://fortune.com/2026/08/25/1-million-people-clicked-linkedin-ai-slop/)\n- **Alcohol ads policy update Sept 30;** AI Mode sign-in prompt test. [SER](https://www.seroundtable.com/recap-08-28-2026-41971.html)\n- **Grindr paid \u00a326M** over alleged HIV-data sharing; **Amazon opened B2B deals** to 11M business accounts.\n\n---\n\n## Common Threads\n\n### Hands off the wheel, by design\nAgents got write access; Meta removed the placement lever; Google removed Show more and the direct link. Nobody announced the philosophy; together it's one.\n\n### Trust is the balance sheet\nSamsung saved on production and paid in brand; Meta books $10B for old design choices; Kroger's teams optimized output and skipped clearance.\n\n### Distribution moved inside the answer\nHotel bookings in AI Mode, auto-expanding AIOs, Brainlabs' missing sessions. The page is becoming raw material.\n\n### The audit gap\n85.6% of businesses never recommended; 1 in 9 recommendations wrong; the IAB's agent-ads framework is due Nov 12.\n\n---\n\n## Angles for the Week\n\n- **Your ad account has an API for agents. Where's the approval gate?** X's paused-by-default rule as the model for client-side controls. Window: open through Q4.\n- **The cost signal.** AI production deletes the \"we were willing to spend\" message; makers notice first. Window: this week.\n- **Show more is gone, and here's what it costs.** Long's video plus Brainlabs' \u221210.5%. Window: durable.\n- **Exclusion became suppression.** The Meta value-rules playbook before Q4 builds lock. Window: two weeks.\n- **Two hours a day.** What capped teen time does to Gen Z reach and frequency, and why rivals get paid to copy the clock. Window: settlement week; durable.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
