    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of June 19, 2026\n\n> **AI assistants moved deeper into the creative apps this week.** Adobe expanded **Firefly AI Assistant** into public beta across Premiere, Photoshop, Illustrator, InDesign, and Frame.io, while previewing an upgraded Firefly studio with Projects, Elements, storyboard-to-video, and Quick Cut. **Google Vids added longer Veo clips and parallel generation**, giving users a way to extend generated clips into more continuous sequences and test multiple prompts at once. **Palmier Pro launched as an open-source Mac video editor built around AI agents**, with an MCP server that lets Claude, Codex, or Cursor operate directly on a timeline. **Claude Fable 5 reaction remained strong around hard coding and long-horizon agent work**, while **Lightricks released the LTX Trainer** for LTX-2, making open audio-video models more customizable through LoRA, IC-LoRA, full fine-tuning, and audio-video training modes. And **Mistral's Voxtral TTS** entered the voice stack with a compact multilingual TTS model, low latency, API pricing at $0.016 per 1,000 characters, and open weights for non-commercial use.\n\n---\n\n## This Week in AI\n\n### Adobe Firefly AI Assistant Moves Into the Creative Apps\n\nAdobe's June 18 update is one of the clearest examples yet of AI assistants moving from standalone prompt surfaces into the applications where creative work already happens.\n\nAdobe announced that **AI Assistant, powered by its creative agent, is now in public beta across Premiere, Photoshop, Illustrator, InDesign, and Frame.io**. The assistant had already existed in Firefly, but this expansion changes the context. Instead of asking an AI tool to generate an isolated asset, users can now interact with an assistant inside the working app, next to the files, bins, layouts, and review surfaces that already hold production context.\n\nFor Premiere, Adobe and coverage around the launch describe tasks such as:\n\n- Sorting assets into bins.\n- Batch-renaming clips.\n- Identifying interview questions.\n- Adding markers.\n- Helping move raw footage toward a structured first cut.\n\nThat is not the same as a model generating an entire finished video. It is more practical and more important: AI is being pointed at the repetitive organizing and first-pass work that surrounds editing. In Frame.io, the relevance is also obvious. Review, comments, versions, approvals, and project context are already there. Adding an assistant to that environment signals Adobe's intent to make agentic help part of the review and production layer, not only the generation layer.\n\nAdobe also previewed an upgraded **Firefly creative AI studio** in private beta. The new studio is meant to connect generation and editing in one place, with **Projects** for storing context and assets, and **Elements** for reusing generated characters, objects, and locations across work. Adobe also described new skills including storyboard-to-video, product-video creation, and **Quick Cut**, which can assemble raw footage into a structured first cut that a person can refine.\n\nThe pattern is consistent with the past month of AI video news: the market is moving away from \"type a prompt, get a clip\" and toward persistent creative workspaces. Adobe's advantage is that its workspace is already where many production files live. The open question is how well the assistant handles real project complexity, but the direction is clear. AI assistance is becoming an operating layer inside creative software.\n\n**Source:** [Adobe \u2014 Firefly introduces new agentic capabilities](https://blog.adobe.com/en/publish/2026/06/18/adobe-firefly-introduces-new-agentic-capabilities-and-an-upgraded-creative-ai-studio-built-for-the-way-you-work) \u00b7 [Adobe Business Wire / Morningstar \u2014 creative agent expansion](https://www.morningstar.com/news/business-wire/20260618386522/adobe-unveils-major-expansion-of-creative-agent-across-firefly-and-creative-cloud-apps-including-photoshop-and-premiere) \u00b7 [TechCrunch \u2014 Adobe adds AI assistant to Premiere, Illustrator, and InDesign](https://techcrunch.com/2026/06/18/adobe-adds-its-ai-assistant-to-premiere-illustrator-and-indesign/) \u00b7 June 18, 2026\n\n### Google Vids Adds Longer Veo Clips and Parallel Generation\n\nGoogle updated **Google Vids** on June 17 with two Veo-related features: longer generated clips and parallel generation.\n\nThe first update lets users **extend existing Veo clips** into longer videos while preserving storytelling continuity and character consistency. The second lets users **start multiple video-generation requests at the same time**, which makes prompt and style comparison faster than waiting for one generation to finish before starting the next.\n\nGoogle says the rollout applies across a broad set of Google Vids users, including Workspace Business and Enterprise editions, Education Plus, nonprofits, personal Google accounts, Google AI Pro and Ultra users, and several add-on categories. The rollout began June 17 for both Rapid Release and Scheduled Release domains, with feature visibility expected within one to three days.\n\nThe AV relevance is not that Google Vids suddenly replaces an NLE. It does not. The point is that lightweight workplace video tools are absorbing more of the AI video workflow: generate a clip, extend it, compare variants, add music, record a screen, assemble a presentation-style video, and share it inside the same ecosystem.\n\nThat matters because not every AV-adjacent video is a full production. Some work is internal explanation, training support, project communication, or rough visualization. Google Vids is moving into that middle layer: more capable than a slide deck, less specialized than Premiere or Resolve.\n\n**Source:** [Google Workspace Updates \u2014 Create longer Veo videos and generate multiple at once in Google Vids](https://workspaceupdates.googleblog.com/2026/06/create-longer-veo-videos-and-generate-multiple-at-once-in-Google-Vids.html) \u00b7 June 17, 2026\n\n### Palmier Pro: A Video Editor Built for Agents\n\nPalmier Pro launched through Y Combinator as an **open-source, Mac-native video editor built for AI agents**. The pitch is direct: Claude, Codex, Cursor, or an in-app assistant can operate the project timeline through a local MCP server.\n\nPalmier's own README describes the app as a video editor where \"you and your agent can generate and edit videos together inside the timeline.\" When the app is open, it exposes an MCP server at:\n\n```text\nhttp://127.0.0.1:19789/mcp\n```\n\nAgents can connect to that local endpoint and interact with the project. The workflow is different from sending a prompt to a remote generator. The agent can see the timeline, understand tracks and clips, and make edits in the working project.\n\nThe core idea has two parts:\n\n- **AI video as a timeline primitive.** Generated images, video, audio, prompts, models, and references are tracked inside the project rather than handled as separate downloads.\n- **Timeline access through MCP.** External agents can trim, reorder, organize, generate, and edit with project context.\n\nPalmier Pro is currently macOS-only, requires macOS 26 on Apple Silicon, and the editor plus MCP server are open source under GPLv3. Generative processing is the closed component. That split is interesting: the app and agent interface are inspectable, while the generation backend remains a service.\n\nFor AV workflows, Palmier is important less because it is a mature replacement for existing editors and more because it shows a new interface pattern. Instead of AI sitting beside the editor, AI is given structured access to the editor. That is the same MCP pattern showing up across development tools, now applied to a timeline.\n\n**Source:** [Y Combinator \u2014 Palmier Pro launch](https://www.ycombinator.com/launches/QtT-palmier-pro-an-open-source-video-editor-your-agents-can-operate) \u00b7 [Palmier Pro GitHub README](https://github.com/palmier-io/palmier-pro/blob/main/README.md) \u00b7 [Digital Trends \u2014 Palmier Pro overview](https://www.digitaltrends.com/cool-tech/this-new-video-editor-lets-claude-work-directly-on-your-timeline/) \u00b7 June 17-22, 2026\n\n### LTX Trainer Makes Open Audio-Video Models More Customizable\n\nLightricks followed last week's LTX-2 open audio-video story with a more technical but important update: **LTX Trainer**, a unified training framework for LTX-2.\n\nThe trainer supports several modes from a shared framework:\n\n- Standard LoRA training.\n- Audio-video LoRA training.\n- IC-LoRA for video-to-video transformations.\n- Full model fine-tuning.\n\nLTX's announcement frames the trainer as one framework for every training mode, covering video, audio, and cross-modal conditioning. The GitHub documentation is more specific: the trainer package provides tools and scripts for LoRA training, full fine-tuning, and video-to-video transformations on custom datasets. Audio-video LoRA can be enabled by setting `with_audio: true` in the training strategy.\n\nThe practical meaning is that LTX-2 is not only open as a model. It is becoming open as a customization stack. That is the difference between an open model people can run and an open model people can adapt.\n\nThere are real constraints. The standard LTX-2 trainer documentation recommends Linux with CUDA and an Nvidia GPU with 80GB+ VRAM for standard configs, with lower-VRAM options available through memory optimizations. Full fine-tuning can require multiple high-end GPUs and distributed training. This is not casual desktop editing.\n\nStill, for the direction of the market, the update matters. Closed models compete on immediate quality and convenience. Open models compete on control, local operation, customization, and pipeline ownership. LTX Trainer pushes the open side further toward serious production and research workflows.\n\n**Source:** [LTX \u2014 Introducing the new LTX Trainer](https://ltx.io/newsroom/introducing-the-new-ltx-trainer-one-framework-every-training-mode) \u00b7 [Lightricks LTX-2 Trainer GitHub](https://github.com/Lightricks/LTX-2/tree/main/packages/ltx-trainer) \u00b7 [LTX-2 training modes documentation](https://huggingface.co/spaces/Lightricks/ltx-2/blob/main/packages/ltx-trainer/docs/training-modes.md) \u00b7 June 17, 2026\n\n### Mistral Voxtral TTS Adds Another Voice Model to the Stack\n\nMistral's **Voxtral TTS** is not brand new this week in the strictest sense \u2014 Mistral's official post dates to March \u2014 but it re-entered the news cycle this week through broader coverage of voice models and Mistral's audio stack. It is worth including because the details are directly relevant to the voice-agent and narration landscape.\n\nVoxtral TTS is a **4B-parameter multilingual text-to-speech model** supporting nine languages:\n\n- English\n- French\n- German\n- Spanish\n- Dutch\n- Portuguese\n- Italian\n- Hindi\n- Arabic\n\nMistral positions Voxtral TTS for low-latency voice-agent applications. The official post lists **70ms model latency** for a typical input with a 10-second voice sample and 500 characters, and an API price of **$0.016 per 1,000 characters** through `/v1/audio/speech`. The model natively generates up to two minutes of audio, with longer output handled through API interleaving.\n\nThe research paper and Hugging Face page add another important detail: Voxtral TTS can adapt to a voice from as little as **3 seconds of reference audio**. The open-weight Hugging Face release includes preset reference voices under a non-commercial license, while broader custom voice cloning remains tied to the API.\n\nFor AV teams, the model adds another option to the already crowded voice stack. ElevenLabs remains a major incumbent. OpenAI has the realtime voice layer. Mistral is positioning Voxtral as a compact, multilingual, low-latency TTS option with both API and open-weight paths.\n\nThe bigger pattern: voice generation is splitting the same way video generation is splitting. Some tools optimize for studio-quality narration, some for realtime agents, some for multilingual cloning, and some for local/open-weight experimentation.\n\n**Source:** [Mistral \u2014 Speaking of Voxtral](https://mistral.ai/news/voxtral-tts) \u00b7 [Hugging Face \u2014 Voxtral 4B TTS](https://huggingface.co/mistralai/Voxtral-4B-TTS-2603) \u00b7 [Voxtral TTS research paper](https://mistral.ai/static/research/voxtral-tts.pdf) \u00b7 March/June 2026\n\n### Quick Hits\n\n- **Premiere Pro 26.3 shipped** \u2014 Adobe's June Premiere update includes just-in-time upgrades for Productions, which can reduce large Production upgrade workflows from hours to minutes, plus object masking and fixes around captions, media relinking, and Production workflows.\n- **Claude Fable 5 reaction stayed focused on hard work** \u2014 developer and analyst commentary continues to treat Fable 5 less like a cheaper everyday model and more like a high-ceiling model for difficult coding, long-running agents, automation, and workflow tasks. The tradeoff remains the same: stronger capability for hard problems, with slower response time, higher cost, and stricter safeguards than daily-use models.\n- **IK Multimedia released ReSing Doubling** \u2014 the ReSing add-on generates realistic double-tracked vocals, three-voice stacks, and ensemble-style arrangements from a single vocal performance. The AV angle is local AI-assisted vocal production, with timing variation, pitch detuning, stereo width, levels, and panning controls.\n- **Gemini 3.5 Pro remains one to watch** \u2014 Google committed to a June release window, but as of this research pass broad public access still appears pending. The credible story is the waiting pattern, not a confirmed launch.\n\n---\n\n## Voices This Week\n\n### Adobe on the Human Role in Agentic Creative Work\n\nAdobe's June 18 announcement framed its creative agent as a tool that handles multi-step execution while the person keeps creative direction:\n\n> \"choosing what to hand off to the assistant, what to own and how best to apply their taste, expertise and judgment to shape every editable outcome.\"\n\nThat is a useful sentence because it avoids the common \"AI replaces the artist\" framing. Adobe is describing a division of labor: the assistant can organize, rename, assemble, and prepare; the human still owns taste, judgment, and the final editable outcome.\n\n### Palmier on Letting Agents Operate the Timeline\n\nPalmier's launch framed the product around a simple idea:\n\n> \"Palmier Pro is a video editor built for AI, where Claude and Codex can edit your timeline directly.\"\n\nThe significance is not the specific app alone. It is the interface model. The timeline becomes something an agent can read and manipulate through a structured protocol, rather than a black box that only a person can operate manually.\n\n### Zeev Farbman on Open Audio-Video Models\n\nLightricks co-founder and CEO Zeev Farbman framed **LTX-2** as an openness and control story:\n\n> \"LTX-2 is the first truly open audio-video model, released with open weights and training code, and designed to run locally on consumer GPUs.\"\n\nHe also said:\n\n> \"It delivers the kind of quality and performance teams usually associate with closed systems, without giving up control, transparency, or the ability to customize.\"\n\nThat is the same reason LTX Trainer matters this week. Open weights are useful, but training code and customization paths are what turn an open model into a production pipeline candidate.\n\n### Simon Willison on Fable 5's Early Feel\n\nDeveloper Simon Willison described Claude Fable 5 as \"slow, expensive\" while also saying it was capable enough that the challenge was finding tasks it could not handle.\n\nThat matches the broader reaction: Fable 5 is not being treated as a cheap everyday model. It is being treated as a high-ceiling model for hard, long-running work where the added cost and latency can make sense.\n\n---\n\n## Common Threads\n\n### The Assistant Is Moving Into the Working File\n\nAdobe's assistant in Premiere and Frame.io, Palmier's MCP-accessible timeline, and Mosaic-style agentic editing tools all point to the same shift. AI assistance is moving closer to the file where work actually happens. The model does not just answer a question; it sees the project, the bins, the clips, the comments, or the timeline.\n\n### First Cuts Are Becoming a Software Layer\n\nAdobe's Quick Cut, Google Vids' clip extension, Mosaic's agentic editing, and Palmier's timeline agent all touch the same middle layer of production: rough assembly, ordering, finding, trimming, marker placement, and first-pass structure. None of these replaces a finished edit. But the rough-cut layer is clearly becoming a target for automation.\n\n### Open Models Need Open Tooling\n\nLTX-2 was already notable because it paired audio and video generation with open weights. LTX Trainer makes the point sharper: open models matter more when teams can adapt them. Training tools, LoRA paths, and documented customization pipelines are part of the capability, not just extras around it.\n\n### Frontier Models Are Splitting by Workload\n\nClaude Fable 5 shows the split between daily models and hard-task models. Faster, cheaper models are still better for summaries, drafts, and routine transformations. More capable models earn their place when the task is long, complicated, and likely to compound errors if the first few steps go wrong.\n\n---\n\n## Novel Ideas Worth Watching\n\n### MCP for Media Timelines\n\nMCP has already become familiar in coding and agent workflows. Palmier Pro shows what happens when the same concept is applied to media editing. A timeline can expose actions and state to an agent: read tracks, inspect clips, trim, reorder, add generated assets, or place markers. If that pattern spreads, \"agent-compatible editor\" could become a real category.\n\n### Persistent Creative Context\n\nAdobe's Projects and Elements preview is another sign that creative AI systems are trying to remember project context across generations. A reusable character, object, location, brand style, or project context is more useful than a one-time generation. Continuity is becoming a product feature.\n\n### Audio Models as Infrastructure, Not Just Narrators\n\nVoxtral TTS, ReSing Doubling, ElevenLabs Avatars, and OpenAI Realtime all point to audio models becoming infrastructure layers. Voice is not only narration. It can be a realtime interface, a localization layer, a draft-performance layer, or a production effect.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 4: Tell It What Not to Change\n\nLast week, the Back to Basics series covered **show, don't tell**: examples often work better than abstract instructions.\n\nThis week is about the other half of reliable prompting: **tell the model what not to change**.\n\nMost people give AI the revision task but forget the preservation rules. That creates a common problem: the output looks cleaner, but something important changed. A timecode disappears. A name is altered. A safety instruction gets softened. A Scripture reference, if present in source material, is paraphrased when it needed to stay exact. A caption correction gets rewritten as a summary instead of staying tied to the original line.\n\nThe model is trying to be helpful. If the instruction is \"make this better,\" it may assume everything is negotiable.\n\nAdd a preservation block:\n\n```text\nYour task: revise this script for clarity and pacing.\n\nPreserve exactly:\n- All names and titles.\n- All timecodes.\n- Any safety instructions.\n- Any quoted language.\n- The three-section structure.\n- The target runtime of 90 seconds.\n\nYou may change:\n- Sentence length.\n- Transitions.\n- Repeated wording.\n- Jargon that can be simplified.\n\nReturn:\n1. Revised script.\n2. Brief list of what changed.\n```\n\nFor AV work, preservation rules are especially useful because the source material often contains constraints:\n\n- Timecodes\n- Speaker names\n- Caption wording\n- Runtime limits\n- Technical terms\n- File names\n- Review-note categories\n- Safety or compliance language\n- Stakeholder-approved wording\n\nThe weekend exercise: take one prompt you already use for revision and add two blocks: **Preserve exactly** and **You may change**. The model will usually become more careful because it knows which parts of the task are fixed and which parts are flexible.\n\nNext week, Back to Basics Week 5: **Ask for a Delta** \u2014 why a short list of changes can be as useful as the revised output itself.\n\n---\n\n## Sources\n\n1. [Adobe \u2014 Firefly introduces new agentic capabilities](https://blog.adobe.com/en/publish/2026/06/18/adobe-firefly-introduces-new-agentic-capabilities-and-an-upgraded-creative-ai-studio-built-for-the-way-you-work) \u2014 June 18, 2026 \u2014 Firefly AI Assistant, upgraded studio, Projects, Elements, Quick Cut\n2. [Adobe Business Wire / Morningstar \u2014 creative agent expansion](https://www.morningstar.com/news/business-wire/20260618386522/adobe-unveils-major-expansion-of-creative-agent-across-firefly-and-creative-cloud-apps-including-photoshop-and-premiere) \u2014 June 18, 2026 \u2014 Creative Cloud app public beta details\n3. [TechCrunch \u2014 Adobe adds AI assistant to Premiere, Illustrator, and InDesign](https://techcrunch.com/2026/06/18/adobe-adds-its-ai-assistant-to-premiere-illustrator-and-indesign/) \u2014 June 18, 2026 \u2014 Premiere examples and Firefly Elements/Projects context\n4. [Google Workspace Updates \u2014 Create longer Veo videos and generate multiple at once in Google Vids](https://workspaceupdates.googleblog.com/2026/06/create-longer-veo-videos-and-generate-multiple-at-once-in-Google-Vids.html) \u2014 June 17, 2026 \u2014 Google Vids Veo extension and parallel generation\n5. [Y Combinator \u2014 Palmier Pro launch](https://www.ycombinator.com/launches/QtT-palmier-pro-an-open-source-video-editor-your-agents-can-operate) \u2014 June 2026 \u2014 Palmier Pro launch and agent-editing framing\n6. [Palmier Pro GitHub README](https://github.com/palmier-io/palmier-pro/blob/main/README.md) \u2014 June 2026 \u2014 MCP server, platform support, open-source details\n7. [Digital Trends \u2014 Palmier Pro overview](https://www.digitaltrends.com/cool-tech/this-new-video-editor-lets-claude-work-directly-on-your-timeline/) \u2014 June 2026 \u2014 Timeline-agent explanation\n8. [LTX \u2014 Introducing the new LTX Trainer](https://ltx.io/newsroom/introducing-the-new-ltx-trainer-one-framework-every-training-mode) \u2014 June 17, 2026 \u2014 LTX Trainer announcement\n9. [Lightricks LTX-2 Trainer GitHub](https://github.com/Lightricks/LTX-2/tree/main/packages/ltx-trainer) \u2014 June 2026 \u2014 Trainer package documentation\n10. [LTX-2 training modes documentation](https://huggingface.co/spaces/Lightricks/ltx-2/blob/main/packages/ltx-trainer/docs/training-modes.md) \u2014 June 2026 \u2014 LoRA, audio-video LoRA, IC-LoRA, full fine-tuning details\n11. [Mistral \u2014 Speaking of Voxtral](https://mistral.ai/news/voxtral-tts) \u2014 March 23, 2026 \u2014 Voxtral TTS model, pricing, latency, languages\n12. [Hugging Face \u2014 Voxtral 4B TTS](https://huggingface.co/mistralai/Voxtral-4B-TTS-2603) \u2014 2026 \u2014 open-weight release and reference voice details\n13. [Voxtral TTS research paper](https://mistral.ai/static/research/voxtral-tts.pdf) \u2014 2026 \u2014 architecture and 3-second reference audio claims\n14. [Adobe Community \u2014 Premiere Pro 26.3](https://community.adobe.com/announcements-727/what-s-new-in-adobe-premiere-26-3-june-2026-1628369) \u2014 June 2026 \u2014 Production upgrades, object masking, caption/export fixes\n15. [Anthropic \u2014 Claude Fable 5 and Claude Mythos 5](https://www.anthropic.com/news/claude-fable-5-mythos-5) \u2014 June 9, 2026 \u2014 Fable 5 announcement, pricing, access\n16. [Simon Willison \u2014 Initial impressions of Claude Fable 5](https://simonwillison.net/2026/Jun/9/claude-fable-5/) \u2014 June 9, 2026 \u2014 early developer reaction\n17. [GamesBeat \u2014 Lightricks open-sources LTX-2](https://gamesbeat.com/lightricks-open-sources-ltx-2-ai-audio-and-video-generation-model/) \u2014 June 2026 \u2014 LTX-2 release and Zeev Farbman quotes\n18. [Sonic State \u2014 IK Multimedia ReSing Doubling](https://sonicstate.com/news/2026/06/19/instantly-create-double-tracked-vocals/) \u2014 June 19, 2026 \u2014 ReSing Doubling release\n19. [Rekkerd \u2014 IK Multimedia launches ReSing Doubling](https://rekkerd.org/ik-multimedia-launches-resing-doubling/) \u2014 June 2026 \u2014 pricing and workflow details\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of June 19, 2026\n\n> **This week, AI moved closer to the actual creative workspace.** Adobe is putting Firefly AI Assistant inside Premiere, Photoshop, Illustrator, InDesign, and Frame.io. Google Vids can now make longer Veo clips and generate multiple clips at once. Palmier Pro is a new open-source Mac video editor that lets AI agents operate the timeline through MCP. Claude Fable 5 reaction remains focused on hard coding and long-running agent work. LTX Trainer gives teams a way to customize the open LTX-2 audio-video model. Mistral's Voxtral TTS adds another multilingual voice model to the growing audio stack.\n\n---\n\n## The Big Story\n\n### Adobe Puts AI Assistant Inside Creative Cloud Apps\n\nAdobe announced that **Firefly AI Assistant** is now in public beta across major creative apps, including Premiere, Photoshop, Illustrator, InDesign, and Frame.io.\n\nFor AV work, Premiere and Frame.io are the most important pieces. Adobe describes assistant tasks like sorting assets into bins, batch-renaming clips, identifying interview questions, adding markers, and helping prepare raw footage for a first cut.\n\nThe important shift is context. The assistant is not just a separate prompt box. It is moving into the app where the production work already lives.\n\nAdobe also previewed an upgraded Firefly studio with **Projects**, **Elements**, storyboard-to-video, product-video tools, and **Quick Cut**, which can assemble raw footage into a structured first cut for a person to refine.\n\nThe takeaway: Adobe is trying to make AI part of the production layer, not just the generation layer.\n\n**Source:** [Adobe](https://blog.adobe.com/en/publish/2026/06/18/adobe-firefly-introduces-new-agentic-capabilities-and-an-upgraded-creative-ai-studio-built-for-the-way-you-work) \u00b7 [TechCrunch](https://techcrunch.com/2026/06/18/adobe-adds-its-ai-assistant-to-premiere-illustrator-and-indesign/) \u00b7 June 18, 2026\n\n---\n\n## Other Stories\n\n### Google Vids Adds Longer Veo Clips\n\nGoogle Vids now supports longer Veo clips and parallel generation.\n\nThat means users can extend an existing AI-generated clip and start multiple video generations at the same time. This is useful for comparing prompt options and building short internal videos more quickly.\n\nGoogle Vids is not replacing a professional editor. But it is becoming more useful for internal communication, training support, project updates, and rough video explainers.\n\n**Source:** [Google Workspace Updates](https://workspaceupdates.googleblog.com/2026/06/create-longer-veo-videos-and-generate-multiple-at-once-in-Google-Vids.html) \u00b7 June 17, 2026\n\n### Palmier Pro Lets Agents Edit a Timeline\n\nPalmier Pro is an open-source Mac video editor designed for AI agents.\n\nThe app exposes a local MCP server, which means tools like Claude, Codex, or Cursor can connect to the project and operate the timeline. An agent can work with clips, tracks, and project context instead of only responding to a prompt outside the editor.\n\nPalmier is still early, macOS-only, and not a replacement for mature editing software. But it shows an important idea: media tools can become agent-accessible.\n\n**Source:** [Y Combinator](https://www.ycombinator.com/launches/QtT-palmier-pro-an-open-source-video-editor-your-agents-can-operate) \u00b7 [Palmier Pro GitHub](https://github.com/palmier-io/palmier-pro/blob/main/README.md) \u00b7 June 2026\n\n### LTX Trainer Makes Open Video Models Easier to Customize\n\nLightricks released **LTX Trainer**, a training framework for LTX-2.\n\nIt supports LoRA training, audio-video LoRA, IC-LoRA for video-to-video work, and full fine-tuning. In plain terms, it gives technical teams more ways to adapt LTX-2 to specific needs.\n\nThe requirements are still serious. Many workflows need Linux, CUDA, and high-end Nvidia GPUs. But the direction matters: open video models are becoming more customizable, not just downloadable.\n\n**Source:** [LTX](https://ltx.io/newsroom/introducing-the-new-ltx-trainer-one-framework-every-training-mode) \u00b7 [GitHub](https://github.com/Lightricks/LTX-2/tree/main/packages/ltx-trainer) \u00b7 June 17, 2026\n\n### Mistral Voxtral TTS Adds Another Voice Option\n\nMistral's **Voxtral TTS** is a 4B-parameter text-to-speech model that supports nine languages.\n\nIt is designed for low-latency voice applications, with Mistral listing 70ms model latency for a typical request and API pricing at $0.016 per 1,000 characters. The open-weight version is available for non-commercial use.\n\nFor AV teams, this adds another option to the voice stack alongside ElevenLabs, OpenAI, and other audio tools. Voice AI is splitting into several categories: narration, realtime assistants, localization, cloning, and local experimentation.\n\n**Source:** [Mistral](https://mistral.ai/news/voxtral-tts) \u00b7 [Hugging Face](https://huggingface.co/mistralai/Voxtral-4B-TTS-2603) \u00b7 2026\n\n---\n\n## Quick Hits\n\n- **Premiere Pro 26.3 shipped** with just-in-time upgrades for Productions, object masking, and fixes around captions, relinking, and exports.\n- **Claude Fable 5 reaction remains strong** around hard coding, long-running agent work, and difficult automation. The tradeoff is that it is slower, more expensive, and more tightly guarded than everyday models.\n- **IK Multimedia released ReSing Doubling**, an add-on that creates doubled vocals and ensemble-style vocal layers from one performance.\n- **Gemini 3.5 Pro is still worth watching**, but broad public access still appears pending as of this research pass.\n\n---\n\n## Common Threads\n\n### AI Is Moving Into the File\n\nAdobe's assistant in Premiere and Frame.io, and Palmier's agent-accessible timeline, point in the same direction. AI tools are moving closer to the actual project files, clips, comments, and timelines.\n\n### First Cuts Are Becoming Automatable\n\nQuick Cut, Google Vids clip extension, and agentic timeline tools all focus on rough assembly and early structure. The final edit still needs human judgment, but the first-pass layer is becoming more automated.\n\n### Open Models Need Training Tools\n\nOpen video models are more useful when teams can adapt them. LTX Trainer matters because it gives technical users a clearer path to customize LTX-2 instead of only running it as-is.\n\n---\n\n## Voices This Week\n\n### Zeev Farbman on Open Audio-Video Models\n\nLightricks co-founder and CEO Zeev Farbman said:\n\n> \"LTX-2 is the first truly open audio-video model, released with open weights and training code, and designed to run locally on consumer GPUs.\"\n\nHe also said:\n\n> \"It delivers the kind of quality and performance teams usually associate with closed systems, without giving up control, transparency, or the ability to customize.\"\n\nThe important idea: open-weight audio-video models become more useful when teams also get training code and customization paths.\n\n### Simon Willison on Claude Fable 5\n\nDeveloper Simon Willison described Fable 5 as \"slow, expensive\" while also saying it was capable enough that the challenge was finding tasks it could not handle.\n\nThat matches the broader reaction: Fable 5 is not being treated as a cheap everyday model. It is being treated as a high-ceiling model for hard, long-running work.\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 4: Tell It What Not to Change\n\nWhen asking AI to revise something, most people explain what they want changed. They forget to explain what must stay the same.\n\nThat can create problems. A model may clean up the writing but change a timecode, paraphrase a quote, remove a safety note, or alter an approved phrase.\n\nAdd a preservation block to your prompt:\n\n```text\nYour task: revise this script for clarity and pacing.\n\nPreserve exactly:\n- All names and titles.\n- All timecodes.\n- Any safety instructions.\n- Any quoted language.\n- The three-section structure.\n- The target runtime of 90 seconds.\n\nYou may change:\n- Sentence length.\n- Transitions.\n- Repeated wording.\n- Jargon that can be simplified.\n\nReturn:\n1. Revised script.\n2. Brief list of what changed.\n```\n\nFor AV work, this is useful with timecodes, speaker names, captions, technical terms, runtime limits, file names, and stakeholder-approved wording.\n\nThe exercise: take one revision prompt you already use and add two blocks: **Preserve exactly** and **You may change**.\n\nNext week: **Ask for a Delta** \u2014 why a short list of changes can be as useful as the revised output itself.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
