    const EDITION_MD = "# The AV AI Dispatch \u2014 Week of April 10, 2026\n\n> Anthropic's Mythos model went live and immediately triggered an emergency meeting between the Treasury Secretary, the Fed Chair, and the CEOs of America's biggest banks. Seedance 2.0 hit #1 on every video benchmark. Netflix open-sourced a tool that removes objects from video while simulating what would physically happen without them. And Anthropic's revenue hit $30 billion.\n\n---\n\n## This Week in AI\n\n### Anthropic's Mythos Goes Live \u2014 And the U.S. Treasury Secretary and Federal Reserve Chair Called an Emergency Meeting\n\nThe Mythos model we covered two weeks ago as a leak is now real, controlled, and already shaking markets. Anthropic launched **Project Glasswing** on April 7, making a preview of Claude Mythos available to 12 core partner organizations \u2014 Amazon, Apple, Cisco, CrowdStrike, Google, JPMorgan Chase, Linux Foundation, Microsoft, Nvidia, and Palo Alto Networks \u2014 plus roughly 40 additional organizations. The purpose: defensive cybersecurity only.\n\nWhat prompted the restricted release: in internal testing, Mythos autonomously identified thousands of high-severity vulnerabilities across every major operating system and web browser, including flaws that are one to two decades old. It developed exploits entirely without human intervention. Anthropic briefed U.S. government officials on the model's offensive and defensive capabilities, and the company is subsidizing usage costs with up to $100 million in credits and $4 million in direct donations.\n\nThen, on April 9, Treasury Secretary Scott Bessent and Federal Reserve Chair Jerome Powell convened an emergency meeting at Treasury headquarters with the CEOs of Citigroup, Morgan Stanley, Bank of America, Wells Fargo, and Goldman Sachs. The topic: the systemic cyber risk that Mythos represents to financial infrastructure. Cybersecurity stocks dropped immediately \u2014 Cloudflare fell 8.6%, CrowdStrike fell 7.5%.\n\nAnthropic has stated that Mythos will not be released to the general public.\n\n**Source:** [TechCrunch](https://techcrunch.com/2026/04/07/anthropic-mythos-ai-model-preview-security/) \u00b7 [Bloomberg](https://news.bloomberglaw.com/tech-and-telecom-law/bessent-urgently-summons-bank-ceos-to-discuss-anthropics-new-ai) \u00b7 [CNN](https://www.cnn.com/2026/04/07/tech/anthropic-claude-mythos-preview-cybersecurity) \u00b7 April 7\u20139, 2026\n\n### Seedance 2.0 Takes #1 on Every Video Benchmark\n\nByteDance's Seedance 2.0 landed on Runway this week and immediately claimed the top position on the Artificial Analysis Video Arena for both text-to-video and image-to-video generation. The 720p variant scored 1,450 Elo \u2014 79 points above second-place Veo 3.1 1080p in text-to-video, and 29 points above Grok Imagine Video in image-to-video. That's a 191-point jump from Seedance v1.5 Pro, which was released less than four months ago.\n\nSeedance 2.0 is also now available on Higgsfield (with 60-second generation and consistency control across shots), Lovart, and Venice. Runway is offering 50% off for three months with code SEEDANCE50 through April 13. The model's 90% first-try success rate is roughly 4.5x the industry average.\n\nRunway CEO Crist\u00f3bal Valenzuela highlighted a thread of ads created entirely by solo creators using the tool: *\"Every single one of these ads was made by one person. Six months ago, that would have been impossible to say.\"*\n\n**Source:** [Arena.ai](https://arena.ai) \u00b7 [No Film School](https://nofilmschool.com/runway-seedance-2-0) \u00b7 April 8\u201310, 2026\n\n### Netflix Open-Sources VOID \u2014 AI Object Removal That Understands Physics\n\nNetflix released VOID (Video Object and Interaction Deletion), an open-source AI framework that goes well beyond simple object erasure. When you remove an object from a video, VOID simulates what would physically happen without it. Remove a person holding a guitar \u2014 the guitar falls. Remove someone jumping into a pool \u2014 the splash disappears. Remove a car from a collision \u2014 the remaining vehicle continues undisturbed.\n\nThe model uses a two-pass transformer architecture built on Alibaba's CogVideoX. In user studies with 25 participants, VOID was preferred 64.8% of the time, significantly ahead of Runway (18.4%) and other competitors. It requires a GPU with 40GB+ VRAM, so it's not running on laptops \u2014 but the code, model weights, training pipeline, and a Colab notebook are all freely available on Hugging Face under an open license.\n\nFor AV post-production, this is significant. Physics-aware object removal has been a VFX problem that traditionally requires manual rotoscoping and compositing. VOID doesn't replace a senior compositor, but it handles the cases that eat the most time: removing boom mics, crew reflections, unwanted signage, continuity errors.\n\n**Source:** [No Film School / Netflix](https://nofilmschool.com) \u00b7 [Hugging Face](https://hf.co/netflix/void-model) \u00b7 April 6, 2026\n\n### Anthropic Hits $30 Billion Run Rate \u2014 and Signs the Biggest Compute Deal in AI\n\nAnthropic disclosed that its annualized revenue has surpassed $30 billion, up from roughly $9 billion at the end of 2025. Enterprise customers spending over $1 million annually doubled from 500 to over 1,000 in less than two months. Simultaneously, the company signed a deal with Google and Broadcom for 3.5 gigawatts of next-generation TPU capacity, expected to come online in 2027. That's the largest compute deal in AI history. Broadcom CEO Hock Tan said the company would provide 1 gigawatt in 2026, surging to over 3 gigawatts in 2027.\n\nFor context: 3.5 gigawatts is roughly the electricity consumption of a city of 2.5 million people. Mizuho analysts estimated Broadcom could earn $21 billion in AI revenue from Anthropic in 2026 and $42 billion in 2027. The majority of the capacity will be sited in the United States, aligned with Anthropic's $50 billion domestic infrastructure commitment.\n\n**Source:** [Anthropic Blog](https://www.anthropic.com/news/google-broadcom-partnership-compute) \u00b7 [TechCrunch](https://techcrunch.com/2026/04/07/anthropic-compute-deal-google-broadcom-tpus/) \u00b7 April 6\u20137, 2026\n\n### Anthropic Launches Claude Managed Agents\n\nAnthropic shipped Claude Managed Agents in public beta on April 8 \u2014 a hosted service for deploying production AI agents without building the infrastructure yourself. Developers describe tasks in natural language or YAML, connect third-party tools, and define security rules. Anthropic handles sandboxing, orchestration, scaling, monitoring, error recovery, and millisecond-level billing.\n\nThe engineering blog post framed the challenge as solving \"programs as yet unthought of\" \u2014 designing infrastructure flexible enough to host agents that don't exist yet. Several enterprise customers had agents in production before the public beta launched. The service claims a 10x reduction in development time compared to building equivalent infrastructure from scratch.\n\n**Source:** [Anthropic Engineering Blog](https://www.anthropic.com/engineering) \u00b7 [Wired](https://www.wired.com) \u00b7 April 8, 2026\n\n### Wan 2.7 and GLM-5.1: China's AI Labs Ship Two Major Open Models\n\nAlibaba launched Wan2.7-Video, an integrated video model that handles generation, editing, and reference-based recreation in a single architecture. The model accepts text, images, video, and audio as input. Its standout feature: directorial-level control, including camera movements (Hitchcock zooms, 360-degree tracking), character dialogue editing that automatically syncs lip movements, and support for up to five simultaneous character references. Pricing: $0.10/second at 720p, $0.15/second at 1080p. OpenArt confirmed that Wan 2.7 held character consistency across five shots, three camera angles, and a voice swap without breaking.\n\nMeanwhile, Zhipu AI (Z.AI) released GLM-5.1, a 754-billion-parameter open-weight model under the MIT license. It hit #1 on SWE-Bench Pro (58.4, ahead of GPT-5.4 and Claude Opus 4.6) and broke into the top 3 on Arena.ai's Code Arena \u2014 the first open-source model to reach that tier. It sustains 8-hour autonomous execution sessions using only 40 billion active parameters per token.\n\n**Source:** [Alibaba Cloud Blog](https://www.alibabacloud.com/blog/) \u00b7 [MarkTechPost](https://www.marktechpost.com/2026/04/08/z-ai-introduces-glm-5-1/) \u00b7 April 3\u20138, 2026\n\n### Microsoft Copilot Goes Multi-Model: GPT + Claude Together\n\nMicrosoft introduced \"Critique,\" a framework inside Copilot that runs OpenAI's GPT and Anthropic's Claude simultaneously for research tasks. GPT handles deep exploration and drafting; Claude serves as a critical reviewer to validate claims and reduce hallucinations. A companion feature called \"Council\" shows users parallel responses from both models side by side. Microsoft reports a 13.88% improvement in research quality compared to single-model approaches.\n\nThis is the first major consumer product to run two competing frontier models in tandem as a feature, not a fallback. It's also a signal about where Microsoft sees the value: not in any single model, but in the orchestration layer that routes between them.\n\n**Source:** [Time](https://time.news/microsoft-copilot-now-combines-openai-and-anthropic-for-better-research/) \u00b7 April 2026\n\n---\n\n## Voices This Week\n\n### Crist\u00f3bal Valenzuela on Solo Creators and AI Video\n\nRunway's CEO shared a thread of AI-generated advertisements, each made by a single person: *\"Every single one of these ads was made by one person. That's insane. Six months ago, that would have been impossible to say. The level of craft, story, and quality is quite impressive. What great talent can do with the right tools is what excites me most.\"*\n\n### Akshay Pachaar on the \"Advisor Model\" Pattern\n\nOne of the most technically significant threads of the week described a converging idea: instead of running the most powerful (expensive) AI model on every task, use a cheaper model for routine work and only consult the expensive model when the cheap one gets stuck. Anthropic shipped this as an \"advisor tool\" in the Claude API \u2014 Sonnet handles execution, Opus gets called only for hard decisions. UC Berkeley published a paper showing the same pattern independently. The result: near-Opus intelligence at Sonnet prices, with Haiku's BrowseComp score more than doubling (19.7% \u2192 41.2%) when paired with an Opus advisor.\n\n---\n\n## Common Threads\n\n### Anthropic's Week\n\nThis was Anthropic's week by any measure: Mythos launched (restricted), Managed Agents shipped, a $30 billion revenue run rate was disclosed, the largest compute deal in AI was signed, and the U.S. government convened an emergency meeting partly because of their technology. No other AI company has simultaneously driven a national security response and an enterprise product launch in the same seven-day window. The 3.3x revenue growth in roughly four months ($9B \u2192 $30B) is unprecedented in enterprise software.\n\n### The Video Benchmark Leaderboard Just Reshuffled\n\nSeedance 2.0 at #1, Wan 2.7 demonstrating multi-shot consistency, Netflix's VOID handling physics-aware removal \u2014 the video AI landscape changed more this week than in the previous month. The pattern: quality is converging at the top (the gap between #1 and #5 is narrowing), but differentiation is moving to specialization. Seedance dominates general-purpose generation. Wan 2.7 owns directorial control. VOID solves post-production removal. Veo competes on price. No single tool covers everything, and the tools that try to cover everything are being outperformed by the ones that specialize.\n\n### Open-Source Models Are Reaching Frontier Performance\n\nGLM-5.1 hit #1 on SWE-Bench Pro and top 3 in Code Arena \u2014 the first open-source model to break into that tier. VOID is open-source and outperforms Runway on object removal. Wan 2.7 is available through multiple open platforms. The practical consequence: the gap between proprietary and open-source AI is closing measurably, which increases competition and drives down the cost of the equivalent capability.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Netflix VOID's Physics Simulation Approach\n\nMost AI video editing tools treat the frame as a flat image \u2014 paint over the removed area. VOID treats the frame as a physical scene \u2014 simulate what would happen if the object were never there. This is a fundamentally different approach to video editing, and it has implications beyond object removal: scene reconstruction, continuity correction, and eventually, full scene modification grounded in physical plausibility.\n\n### The Advisor Model Pattern\n\nThe idea that a cheap model should handle routine work and only consult an expensive model when stuck emerged independently at Anthropic and UC Berkeley in the same week. This is likely how most production AI systems will work in the near future: tiered intelligence, where the cost of reasoning scales with the difficulty of the task rather than being fixed.\n\n### Alibaba's \"SWE-CI\" Benchmark for Code Maintenance\n\nAlibaba tested 18 AI coding agents across 100 real codebases over 233 simulated days each. The finding: 75% of models break previously working code during maintenance. Only Claude Opus 4.5 and 4.6 stayed above a 50% zero-regression rate. This is the first benchmark to measure whether AI code holds up over time, not just whether it passes tests today. It's a sobering counterweight to the impressive one-shot benchmarks.\n\n---\n\n## Tool of the Week\n\n### Netflix VOID\n\n**What it does:** Open-source AI framework that removes objects from video while simulating what would physically happen in the scene without them. Built on a two-pass transformer architecture with \"quadmask conditioning\" that separates the object, overlap regions, interaction zones, and preserved background.\n\n**Who it's for:** Post-production teams dealing with object removal \u2014 boom mics, crew reflections, unwanted signage, continuity errors. Requires a GPU with 40GB+ VRAM (A100 recommended), so it's a workstation tool, not a laptop tool.\n\n**Pricing:** Free and open-source. Available on Hugging Face with full model weights, training pipeline, Colab notebook, and interactive demo.\n\n**Worth trying?** Yes, if your team has the hardware. In user studies, VOID was preferred 64.8% of the time over Runway (18.4%) and other competitors. The physics-aware approach is genuinely novel \u2014 it doesn't just fill in the gap, it recalculates the scene. The 40GB VRAM requirement limits who can run it, but a Colab notebook is available for testing without local hardware.\n\n**Link:** [github.com/Netflix/void-model](https://github.com/Netflix/void-model)\n\n---\n\n## Sources\n\n1. [TechCrunch](https://techcrunch.com/2026/04/07/anthropic-mythos-ai-model-preview-security/) \u2014 April 7, 2026 \u2014 Anthropic Mythos preview and Project Glasswing\n2. [Bloomberg](https://news.bloomberglaw.com/tech-and-telecom-law/bessent-urgently-summons-bank-ceos-to-discuss-anthropics-new-ai) \u2014 April 9, 2026 \u2014 Treasury/Fed emergency meeting on Mythos cyber risk\n3. [CNN](https://www.cnn.com/2026/04/07/tech/anthropic-claude-mythos-preview-cybersecurity) \u2014 April 7, 2026 \u2014 Mythos cyber capabilities and government briefings\n4. [Arena.ai](https://arena.ai) \u2014 April 8, 2026 \u2014 Seedance 2.0 #1 on Video Arena leaderboard\n5. [No Film School](https://nofilmschool.com/runway-seedance-2-0) \u2014 April 2026 \u2014 Seedance 2.0 launch on Runway\n6. [Hugging Face / Netflix](https://hf.co/netflix/void-model) \u2014 April 6, 2026 \u2014 VOID open-source release\n7. [Anthropic Blog](https://www.anthropic.com/news/google-broadcom-partnership-compute) \u2014 April 6, 2026 \u2014 $30B run rate, 3.5GW TPU deal\n8. sible to say. The level of craft, story, and quality is quite impressive. What great talent can do with the right tools is what excites me most.\"*\n\n### Akshay Pachaar on the \"Advisor Model\" Pattern\n\nOne of the most technically significant threads of the week described a converging idea: instead of running the most powerful (expensive) AI model on every task, use a cheaper model for routine work and only consult the expensive model when the cheap one gets stuck. Anthropic shipped this as an \"advisor tool\" in the Claude API \u2014 Sonnet handles execution, Opus gets called only for hard decisions. UC Berkeley published a paper showing the same pattern independently. The result: near-Opus intelligence at Sonnet prices, with Haiku's BrowseComp score more than doubling (19.7% \u2192 41.2%) when paired with an Opus advisor.\n\n### Aakash Gupta on Shopify's MCP Integration\n\nShopify gave every AI coding agent direct write access to the entire store backend \u2014 products, orders, inventory, SEO, images \u2014 via MCP. Gupta's observation: *\"One AI engine that creates, tests, and scales... One prompt. No Fiverr freelancer. No $200/month app subscription. No agency retainer.\"* The cost stack for a small Shopify store \u2014 $200\u2013500/month in apps, $2,000+ for an SEO audit \u2014 collapsed into a terminal command. 4.8 million active merchants now have access.\n\n---\n\n## Common Threads\n\n### Anthropic's Week\n\nThis was Anthropic's week by any measure: Mythos launched (restricted), Managed Agents shipped, a $30 billion revenue run rate was disclosed, the largest compute deal in AI was signed, and the U.S. government convened an emergency meeting partly because of their technology. No other AI company has simultaneously driven a national security response and an enterprise product launch in the same seven-day window. The 3.3x revenue growth in roughly four months ($9B \u2192 $30B) is unprecedented in enterprise software.\n\n### The Video Benchmark Leaderboa
