    initEditionApp(document.getElementById("editionApp"), {
      slug: "2026-09-14",
      editionTitle: "Week of September 14, 2026",
      editionMd: "# Monday Signal \u2014 Week of September 14, 2026\n\n> **Google shipped what it calls the largest quality reduction in its 29-year history to Europe on Tuesday, told Reuters so, and rolled it out anyway to satisfy the Digital Markets Act.** The same week the question box became an answer box (97% of People Also Ask results are now AI Overviews), Amazon's DSP started selling ChatGPT ads while OpenAI quietly barred rival image and voice tools from buying them, and Mike Ryan showed that Shopping ads' rising click-through rate is mostly a shrinking denominator. On the feed, an offshore sportsbook ran a sexualized AI deepfake of a college football fan who had gone viral 48 hours earlier, and the three most powerful people in AI agreed in public that the industry should slow down.\n\n---\n\n## The Conversation\n\n### A sportsbook deepfaked a fan two days after ESPN made her famous\n\nESPN's cameras lingered on Ole Miss alum Sara Smith during the Rebels' win over Louisville on Sunday, September 6. The clip went viral, her Instagram went private, and by Monday she was reading out the DMs on TikTok (\"Yes that was me\"). By Tuesday and Wednesday, BetUS, an offshore sportsbook headquartered in Costa Rica, had posted an AI-generated ad on X that falsely depicted her winking at the camera and pulling her top down to distract Louisville's defense. The reaction was immediate and unusually unanimous for X. One reply that traveled: \"A real company posting a sexualized deepfake of a fan based on footage from a TV broadcast. We can't let this be the future. Shun this behavior with all your might.\" Whiskey Riff refused to embed the ad; the post was still live when they wrote it up.\n\nThe regulatory detail is the marketing detail. BetUS holds no US state license, so there's no license to pull; the states that have gone after it (Maryland, Florida, Michigan) did so for taking unlicensed bets, not for creative. Legitimate sportsbooks would never survive this ad, which is exactly why the offshore ones can run it. One week after Suno's unauthorized Mary J. Blige campaign, the person in the ad didn't sign again, except this time she's a private citizen.\n\n**Comment window:** open. The unclaimed take: deepfake ads are now a brand-safety category, and the exposure is asymmetric. Everyone adjacent to the moment (the network, the school, the licensed books running clean creative) absorbs some of the disgust, while the actor who made it has nothing to lose.\n\n**Source:** [Whiskey Riff](https://www.whiskeyriff.com/2026/09/09/sportsbook-under-fire-for-ai-generated-ad-falsely-depicting-viral-ole-miss-fan-pulling-her-top-down/) \u00b7 [Daily Mail on the viral moment](https://www.dailymail.com/sport/college-football/article-16113049/ole-miss-fan-viral-dms.html) \u00b7 September 6\u20139, 2026\n\n### \"Google's Latest SCAM!\": promotional credits revoked after the money was spent\n\nPPC consultant David Melamed posted that two client accounts had Google Ads promotional credits marked \"Invalidated\" more than a month after spending the $3,200 required to earn them. No appeal path, no refund of the qualifying spend. One account lost its credit because Melamed's manager-account billing profile had set it up; the other, he doesn't know. His post didn't hold back (\"They push a really 'generous' credit to get advertisers to spend money... only to invalidate it after they spent thousands of dollars and waited more than a month\"), and his second point is the one that generalizes: advertisers holding a credit bid like spend is half price, which lifts auction prices for everyone competing on those impressions, credit or not. Google's ads liaison Ginny Marvin replied in public: \"Thank you for bringing this to our attention, David. I've passed this along to the team.\" Google's own help page confirms that changing billing setup after entering an offer invalidates it, which is the trap for any agency that opens client accounts from an MCC.\n\n**Comment window:** open. The practical post writes itself: treat promotional credits as provisional until they survive two billing cycles, put that in writing to the client before the spend happens, and screenshot the terms at acceptance.\n\n**Source:** [Search Engine Roundtable, with Melamed's full post](https://www.seroundtable.com/google-ads-credit-revoked-42049.html) \u00b7 [Search Engine Land](https://searchengineland.com/advertisers-report-google-ads-credits-being-revoked-after-spending-488330) \u00b7 [Google's help page on promotional offers](https://support.google.com/google-ads/answer/16915411?hl=en) \u00b7 September 10\u201311, 2026\n\n### The AI industry's leaders asked it to slow down. Read the room accordingly.\n\nOn Friday, Anthropic CEO Dario Amodei published a 3,800-word essay, \"We Must Pace the Frontier\": \"We must slow the pace at which we improve the capabilities of AI models. Progress will still seem fast, and we must make wise use of the time we gain.\" Anthropic committed unilaterally to giving third-party evaluators employee-level access; the rest of the plan needs industry coordination (with a US antitrust waiver) and then global coordination. Within hours, Elon Musk posted \"Dario is right,\" and Sam Altman wrote, \"I agree with Dario that we need to pace the frontier.\" Four days earlier a researcher had publicly quit Anthropic warning that the labs weren't acting responsibly, and the following week King Charles was due to host the AI chiefs for a safety summit.\n\nWhy this belongs in a marketing newsletter: the backlash we've tracked for six weeks (OpenAI's Summer Club, Samsung's SSD spot, Xero's influencer, Suno's ad, now BetUS) runs on public unease about AI. The heads of Anthropic, OpenAI, and xAI just said, in public, that the unease is warranted. \"AI-powered\" in consumer-facing copy is now a claim to handle with care, because the people who built the technology are on record asking for caution.\n\n**Comment window:** open this week. The framing is unclaimed in marketing circles: the industry validated the audience's caution, so adjust the AI messaging before the audience does it for you.\n\n**Source:** [Amodei's essay](https://darioamodei.com/post/we-must-pace-the-frontier) \u00b7 [TechCrunch](https://techcrunch.com/2026/09/12/anthropic-ceo-outlines-plan-to-pace-the-frontier/) \u00b7 [SiliconANGLE on the Altman and Musk responses](https://siliconangle.com/2026/09/13/sam-altman-and-elon-musk-back-dario-amodeis-call-to-slow-down-the-frontier-of-ai-development/) \u00b7 September 12\u201313, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, statements, and filings where the week's arguments actually happened.\n\n- **A Google official, unnamed** (to Reuters, September 8): \"The changes mark the largest reduction in quality of service at the world's most popular internet search engine in its 29-year search history.\" [Reuters](https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/)\n- **Nick Fox, SVP of knowledge and information, Google** (on the EU changes): they \"degrade the user experience for Europeans\" by \"boosting online intermediaries at the expense of local businesses.\" [Via The Next Web](https://thenextweb.com/news/google-eu-search-dma-remedy-degraded-quality-nick-fox)\n- **Mark Williams-Cook, founder, AlsoAsked** (LinkedIn, September 8): \"AlsoAsked took a sample of 19.2M English language [PAAs] made in 2026, and found a dramatic monthly increase in AI-generated answers. 97% of PAA answers in the first week of September are AIOs, up from 86% in August\u2026 It seems highly likely we are on track for 100% shortly.\" [Via Search Engine Roundtable](https://www.seroundtable.com/ppa-ai-overviews-google-42047.html)\n- **Mike Ryan, head of ecommerce, Smarter Ecommerce** (LinkedIn, on Shopping ads): \"Google checks the predicted CTR of a given query and serves AIOs preferentially for lower-probability queries in order to preserve revenue. Thus CTR climbs partly due to a shrinking denominator (fewer impressions) and partly due to selection/pruning (higher click propensity).\" [Via Search Engine Roundtable](https://www.seroundtable.com/google-shopping-ads-imp-ctr-42021.html)\n- **Doug Wyatt, senior director of Americas media, Adobe** (LinkedIn, on ChatGPT's ad policy): \"ChatGPT is narrowing both the paid and organic discovery pathways for tools in categories it now competes in directly. Image and voice/audio are closed off. Video's still open\u2026for now.\" [Via PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/openai-cuts-off-rivals-ads-chatgpt/)\n- **Ginny Marvin, ads liaison, Google** (LinkedIn, September 4, on exact and phrase match ads in AI Mode): \"Exact and phrase match keywords are eligible to serve text ads in AI Mode. Note however that this is limited to cases where there is explicit and direct user intent. AI Max and PMax for Search are designed to capture complex conversational intent and access our latest ad formats (like Highlighted Answers).\" [The thread](https://www.linkedin.com/posts/anthony-higman-a3656a46_breaking-google-is-now-serving-regular-activity-7501374557593845760-EjIf)\n- **Dario Amodei, CEO, Anthropic** (essay, September 12): \"We must slow the pace at which we improve the capabilities of AI models. Progress will still seem fast, and we must make wise use of the time we gain.\" [The essay](https://darioamodei.com/post/we-must-pace-the-frontier)\n- **Sam Altman, CEO, OpenAI** (X, September 12): \"I agree with Dario that we need to pace the frontier.\" [Via SiliconANGLE](https://siliconangle.com/2026/09/13/sam-altman-and-elon-musk-back-dario-amodeis-call-to-slow-down-the-frontier-of-ai-development/)\n\n---\n\n## This Week in Marketing AI\n\n### Google shipped its \"largest reduction in quality\" to Europe and said so out loud\n\nOn Tuesday, September 8, Google rolled out redesigned results across 30 European markets to comply with the Digital Markets Act, after a \u20ac460 million fine in July for favoring its own shopping, hotel, transport, and sports results and a 60-day deadline backed by penalties of up to 5% of worldwide daily turnover. Reuters had the story first, with the line that defined the week from an unnamed Google official: \"the largest reduction in quality of service at the world's most popular internet search engine in its 29-year search history.\" Nick Fox, Google's SVP for knowledge and information, said the changes \"degrade the user experience for Europeans\" by \"boosting online intermediaries at the expense of local businesses,\" and that users outside the EU won't be affected.\n\nThe layout is the remedy. Search Central documented two EEA-only units the same day: an aggregator unit that gives one approved comparison service a block at the top (the top-ranked provider expanded by default, the rest behind a dropdown), and a supplier unit for direct businesses that strips out date filters, live prices, and descriptive tags. The vacation-rentals unit is gone; the changes extend into AI Overviews and AI Mode. Google's supporting claims (earlier DMA changes cut free direct-booking traffic to European businesses by 30%; test users showed high dissatisfaction) rest on data only Google holds, and travel-tech groups counter that a worse experience was Google's own design choice. For anyone with European clients, this is the first look at what regulated AI search looks like: fewer features, more intermediaries, and a company grading its own remedy.\n\n**Source:** [Reuters](https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/) \u00b7 [Search Engine Land](https://searchengineland.com/google-says-dma-changes-in-eu-resulted-in-worse-degradation-of-search-quality-ever-487340) \u00b7 [Skift on the travel layout](https://skift.com/2026/09/10/google-update-europe-hotel-flight-search-results/) \u00b7 [The Next Web's analysis](https://thenextweb.com/news/google-eu-search-dma-remedy-degraded-quality-nick-fox) \u00b7 September 8\u201310, 2026\n\n### The question box became an answer box: 97% of People Also Ask results are AI Overviews\n\nFourteen months ago, about 12% of People Also Ask answers were AI-generated. In the first week of September it was 97%, per AlsoAsked founder Mark Williams-Cook's monthly series across 19.2 million English-language PAAs collected since January. The path wasn't smooth (22% in January, down to 11% in April, then 40%, 64%, 61%, 86%, 97%), and a second tracker, Allintitle's Also Ask Miner, reads it as a flat 100% since August. Williams-Cook declined that rounding when Barry Schwartz asked (\"almost at 100% but not there yet\") but added: \"It seems highly likely we are on track for 100% shortly.\" The classification is Google's own: since late 2024 some PAA answers have carried an AI-generated label instead of an extracted passage credited to one page.\n\nFor content programs built on question-shaped queries, this changes what winning looks like. PAA used to be a second listing on page one for a page that couldn't crack the top three; now the box answers the question itself and your page becomes a citation under it, if it appears at all. Question content still gets read, inside Google. If your reporting still treats a PAA appearance as a traffic source instead of a visibility surface, it will show a decline that your actual exposure doesn't match. Google spent the same week saying positions one through ten are \"hard to map\" for site owners and testing thinner citation panels in AI Overviews.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/ppa-ai-overviews-google-42047.html) \u00b7 [The monthly series, via SEO Handbook](https://seohandbook.co.uk/seo-news-updates/people-also-ask-ai-generated-97-percent/) \u00b7 [Search Engine Roundtable's week recap](https://www.seroundtable.com/video-09-11-2026-42061.html) \u00b7 September 8\u201311, 2026\n\n### Amazon's DSP now sells ChatGPT ads. OpenAI closed the door on rival image and voice tools the same week.\n\nFrom Wednesday, September 10, select US advertisers on Amazon DSP can extend campaigns into ChatGPT, with Delta Vacations first named. It's a managed service, bought on CPC or CPM, with product-feed ads that build creative from a catalog, and the split of control is the detail to hold onto: Amazon runs the buying and campaign layer, OpenAI decides where and whether the ads appear. Digiday's frame is the right one: it's the latest stop on an 18-month supply-chasing streak (Netflix, Roku, Spotify, SiriusXM, Disney, Hulu, ESPN), and it plugs OpenAI's inventory into an audience graph retail advertisers already work with. OpenAI told Adweek its ads business is on track to pass $1 billion over the next 12 months; Sensor Tower measured ads served per US user per hour up 163% between April and August; the reported internal target is $100 billion by 2030.\n\nThe other OpenAI story landed a day earlier and wasn't announced. Per The Information, OpenAI told advertising partners it will no longer approve campaigns for standalone image- or audio-generation products. Adobe, a February pilot participant that promoted Firefly, is affected; its media lead Doug Wyatt confirmed on LinkedIn that \"image and voice/audio are closed off. Video's still open\u2026for now.\" OpenAI shipped ChatGPT Images 2.5 the same week and launched its own voice product in July, and Adgully reports outbound referral links are being restricted for some image-editor queries. OpenAI's published policy simply reserves the right to refuse ads for any reason. Platforms blocking direct competitors is old behavior. The new part is a platform expanding into its advertisers' categories and setting the exclusions privately, which means anyone planning ChatGPT spend should check their product against a rulebook that can move without notice.\n\n**Source:** [Digiday](https://digiday.com/media-buying/amazon-brings-its-dsp-to-openais-chatgpt-ads-extending-its-supply-chasing-streak/) \u00b7 [Marketing Dive](https://www.marketingdive.com/news/amazon-pilots-ad-services-in-chatgpt-what-marketers-need-to-know/829945/) \u00b7 [Adweek](https://www.adweek.com/commerce/amazon-and-openai-team-up-to-target-chatgpts-us-users/) \u00b7 [Search Engine Land on the ad policy](https://searchengineland.com/openai-reportedly-blocks-rival-ai-tools-from-advertising-in-chatgpt-488019) \u00b7 [PYMNTS, with Wyatt's post](https://www.pymnts.com/news/artificial-intelligence/2026/openai-cuts-off-rivals-ads-chatgpt/) \u00b7 September 9\u201310, 2026\n\n### Your Shopping CTR went up. Mike Ryan checked the denominator.\n\nAcross 175 billion impressions from thousands of Shopping and Performance Max campaigns in hundreds of accounts, Smarter Ecommerce's Mike Ryan found median Shopping impressions fell from roughly 1.85 million to 1.4 million between mid-2025 and mid-2026 while median click-through rate rose from 1.20% to nearly 1.55%. Clicks were flat or slightly down. Optmyzr's separate ecommerce data showed CTR up 17% year over year, close to the 20% Ryan saw in his own benchmarks. Publishers have spent two years living the \"crocodile effect\" (impressions up, clicks down) since AI Overviews launched; Shopping ads are showing the mirror image, and Ryan's hypothesis is that Google serves AI Overviews preferentially on queries with lower predicted ad-click probability, preserving Shopping placements where clicks are likely. He calls it a bridging strategy toward \"both/and\" experiences as Google scales Shopping ads inside the AI answers themselves. Google's documentation confirms ads can appear above, below, or within an Overview; it doesn't confirm predicted-CTR routing, and Ryan presents it as a theory.\n\nThe reporting consequence doesn't wait for the theory to be proven. A CTR improvement in a Q4 board pack that is really an impression decline will be read as a win by everyone who sees it. Put impression volume, clicks, and total traffic next to CTR, and rebaseline every Shopping benchmark set in 2025. Search Engine Watch added a data point the same week: on a headphones query in AI Mode, every product in the answer was an ad, no organic listing among them. One test, but it earns a monitoring line.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/google-shopping-ads-imp-ctr-42021.html) \u00b7 [Search Engine Land](https://searchengineland.com/ai-overviews-may-be-affecting-shopping-ad-ctr-and-impressions-487265) \u00b7 [TechWyse, with European campaign data](https://www.techwyse.com/news/reports-data/rising-shopping-ad-ctr-is-masking-a-drop-in-visibility) \u00b7 September 7\u20138, 2026\n\n### Two datasets on what AI answers do to demand before you get a look in\n\nExploding Topics surveyed more than 2,300 US consumers about AI in their purchase journeys, and the headline finding is a negative one: 57.5% of AI users decided not to buy something based on what a chatbot told them. Almost two-thirds have at least partially replaced product-related Google searches with AI conversations, usage is rising over time, and more than four in ten say they actively dislike AI chatbot ads, which complicates the obvious response of buying your way back into the conversation. The unglamorous fix is the right one: the model talked the customer out of it using material it found somewhere (reviews, spec pages, comparison content, third-party write-ups), and most of that material is fixable by someone on your team this quarter.\n\nOn the paid side, SE Ranking published the numbers from its own ChatGPT Ads test instead of another explainer: three campaigns, eight ad groups, 48 ads across the US, Canada, Australia, and New Zealand in June, producing 97,131 impressions and 1,263 clicks, a 1.30% average CTR. Hold that next to the week's other ChatGPT Ads news: expansion into selected markets across Europe, India, the Middle East, and North Africa, plus a performance stack arriving fast (editable custom audiences, mixed identifiers, audiences above five million, Google Advertising ID support, and a Pixel and Conversions API that now accept phone numbers, names, regions, and postal codes). The infrastructure is running ahead of the incrementality evidence, which is normal for a new channel and a reason to keep the test budgets labeled as tests.\n\n**Source:** [Anicca's roundup, carrying the Exploding Topics and SE Ranking data](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/) \u00b7 [Search Engine Roundtable on the ChatGPT Ads updates](https://www.seroundtable.com/openai-chatgpt-ads-updates-42017.html) \u00b7 September 7\u201311, 2026\n\n### Blogging confidence hit a twelve-year low. AI adoption hit 92%.\n\nJust 14% of marketers say their blog delivers strong results, per Orbit Media's annual blogging survey: six points below the previous twelve-year low and roughly half the 26% reported in 2022. The explanation isn't the one you'd expect. AI adoption reached 92.4% and showed no relationship to results in either direction. What correlated with the decline was the abandonment of practices historically tied to success: influencer collaboration, original research, keyword research, paid promotion, formal human editing, and consistent use of analytics. Marketers who still did keyword research were more likely to report strong results.\n\nAI did what it promised on speed. The average post now takes 3 hours and 20 minutes, down from more than four hours in 2022, saving a typical marketer about 50 hours of writing a year while reported performance kept sliding. MarketingProfs' Ann Handley called the findings a wake-up call about being more discerning about which efforts get removed and which get kept. Read alongside this week's other numbers (a question box that answers itself, a chatbot that talks shoppers out of purchases, a LinkedIn feed that penalizes generated-sounding posts), the survey describes a trade the industry made a year ago: speed replaced the parts of the process that made the output good, and this is what the trade looks like on the far side.\n\n**Source:** [Orbit Media's survey, via Anicca's roundup](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/) \u00b7 September 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's Friday recap](https://www.seroundtable.com/video-09-11-2026-42061.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/).*\n\n- **Cloudflare's crawler deadline lands tomorrow, September 15.** Under the plan Cloudflare published in July, sites with AI-training blocks would also start blocking Googlebot, Bingbot, and Applebot, because the same crawlers serve search and training; the week's roundups told site owners to check their Security settings before the date. *Editor's note, added at publication on September 18: what shipped on the 15th was softer. Cloudflare introduced a \"Disallow AI Training\" setting and an \"Accountable\" designation for Google, Apple, and Microsoft, so those three keep crawling for search while training is refused; existing training blocks were migrated automatically, and only an explicit Block now stops them entirely. [Cloudflare's post](https://blog.cloudflare.com/accountable-mixed-use-ai-crawlers/) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/cloudflare-lets-sites-disallow-ai-training-without-blocking-googlebot/589559/)*\n- **Exact and phrase match ads reached AI Mode without AI Max.** Anthony Higman spotted regular Search campaigns serving in AI Mode on September 3; Ginny Marvin confirmed \"a small experiment\" on the 4th, limited to \"explicit and direct user intent,\" undefined. The discourse ran all week. For advertisers who resisted moving budget into automated products purely to reach AI Mode, a reason to hold that position a little longer. [Higman's post and Marvin's reply](https://www.linkedin.com/posts/anthony-higman-a3656a46_breaking-google-is-now-serving-regular-activity-7501374557593845760-EjIf) \u00b7 [Search Engine Roundtable](https://www.seroundtable.com/google-ads-serving-restrictive-match-types-ai-mode-42024.html)\n- **Google Ads shipped a cluster:** the AI dashboard is rolling out to some advertisers, a beta for budget and bidding targets on Search campaigns, local customer optimization and store sales in Data Manager, loyalty-program segmentation, a video campaign group beta, and Merchant Center's AI performance report now carries AI search intent, terms, and attribution. Meridian GeoX went global. [Search Engine Roundtable, September 11](https://www.seroundtable.com/recap-09-11-2026-42070.html)\n- **Search Console's page-indexing report lost a chunk of June data** on September 11, days after a temporary indexing-report bug; Marie Haynes reported the performance report misbehaving the same day. Third month running of Search Console data you can't fully trust. [Search Engine Roundtable](https://www.seroundtable.com/google-search-console-indexing-report-missing-data-42073.html)\n- **Target CPA is literal now.** Reva Minkoff's SMX Now point: a $10 target now seeks $10 and stops trying to beat it, which is how Google described the strategy in 2015. If an account was quietly outperforming, reset the target to the number you actually want.\n- **Google posted a document on regional Search differences**, John Mueller said Google can \"lose faith\" in a site over low-value programmatic SEO, and AI Mode's citations panel is appearing more consistently at the bottom in a longer title-description-image format. A three-element citation card does more for recognition than a compressed inline link.\n- **DeepMind's \"Autoregressive Ranking\" paper** (one model replacing the two-stage retrieval pipeline) drew attention; note it was submitted in January, announces no rollout, and in the shopping test the list score rose while top-result accuracy fell from 95% to 70%. Direction of travel, not a change to plan around.\n- **Apple said Siri handles 2.5 billion requests a day** at its September 9 event, a reminder that the largest assistant surface most marketers can't buy into is still growing.\n- **Instacart unveiled Clementine**, a consumer grocery assistant with agentic-commerce integrations; **TikTok Shop** was named by 34.7% of US shoppers as the marketplace most associated with fraud; **Le Monde** says AI Overviews haven't dented its audience. [Anicca's AI roundup](https://anicca.co.uk/blog/2026-09-14-ai-in-marketing-management/)\n\n---\n\n## Common Threads\n\n### The referee also plays\n\nGoogle graded its own EU remedy (\"the largest reduction in quality,\" by Google's measure, on Google's data). \"AI-generated\" in People Also Ask is Google's own label. AI Mode eligibility is \"explicit and direct intent,\" which Google hasn't defined. Promotional credits were invalidated with no appeal. Every judgment this week was rendered by the party with the incentive, and none of them can be checked from outside.\n\n### Your supplier is your competitor\n\nOpenAI sold ads to Adobe's category, then closed the category the week it shipped Images 2.5. Amazon became the buying layer for a channel whose placements it doesn't control. Google appears to route low-click queries into its own answers and keep the paid ones. The platform relationship now runs in both directions, and only one side sets the terms.\n\n### Denominators are lying\n\nShopping CTR rose because impressions fell. PAA \"visibility\" replaced clicks. Blog posts got faster to write while results slid to a twelve-year low. Every flattering number this week had a second number underneath it, and the second number told the story.\n\n### The person in the ad didn't sign\n\nA fan deepfaked off a broadcast, a singer whose \"representative\" wasn't, an influencer briefed to insult her client's channel, and now the industry's own leaders saying the pace is unsafe. Consent and caution are the brief. The audience is enforcing it faster than the platforms.\n\n---\n\n## Angles for the Week\n\n### Deepfake ads are a brand-safety category now\n\nBetUS won't be the last offshore operator to deepfake a viral private citizen, and the damage lands on everyone adjacent (the licensed competitors, the network, the school) while the actor has no license to lose. The post to write: what a brand's policy and response look like when a deepfake of a real person appears in your category's feed. Window: this week for the hook; the pattern is durable.\n\n### Your Shopping CTR went up. Check the denominator.\n\nRyan's 175 billion impressions make the case: CTR is climbing because impressions are falling, and Q4 board packs will read that as a win. A rebaseline post (impressions, clicks, total traffic next to CTR; 2025 benchmarks retired) will be forwarded inside client teams. Window: the next two weeks, before Q4 reporting templates lock.\n\n### PAA is a visibility surface, not a traffic source\n\nNinety-seven percent. The reporting change is concrete: stop counting People Also Ask as a click channel, start counting citation presence, and say so to clients before the traffic line drops. Window: open; sharpest while the 97% number is fresh.\n\n### The platform you advertise on competes with you\n\nOpenAI's private category ban is a preview of how AI platforms will treat advertisers in categories they enter. The useful post reads the ad policies (Google, Meta, Amazon, OpenAI) for the \"reserves the right\" clauses and lays out what a category exit would cost each client. Window: this week; durable through every new OpenAI product launch.\n\n### Europe is the test market for regulated AI search\n\nAggregator units, stripped supplier listings, and AI Overviews and AI Mode inside the remedy: what Google shipped to 30 markets on Tuesday is the first version of search shaped by a regulator rather than a product team, and Google itself says it's worse. For any client with European traffic, the measurement plan (segment EEA, watch direct versus intermediary clicks) is the post. Window: open through the Commission's compliance assessment.\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [Dario Amodei \u2014 We Must Pace the Frontier](https://darioamodei.com/post/we-must-pace-the-frontier) \u2014 September 12, 2026 \u2014 the essay, quoted verbatim in Voices\n2. [Anthony Higman \u2014 LinkedIn post, with Ginny Marvin's reply](https://www.linkedin.com/posts/anthony-higman-a3656a46_breaking-google-is-now-serving-regular-activity-7501374557593845760-EjIf) \u2014 September 3\u20134, 2026 \u2014 the AI Mode match-type experiment, Marvin's eligibility statement\n3. [Google Ads Help \u2014 how promotional offers work with different payment settings](https://support.google.com/google-ads/answer/16915411?hl=en) \u2014 accessed September 2026 \u2014 the billing-change invalidation rule\n4. [Cloudflare \u2014 Have it both ways: stay discoverable in search while disallowing AI training](https://blog.cloudflare.com/accountable-mixed-use-ai-crawlers/) \u2014 September 15, 2026 \u2014 the change that actually shipped (editor's note)\n\n**Original reporting**\n\n5. [Reuters \u2014 Google warns of lower quality as it revamps Europe search results](https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/) \u2014 September 8, 2026 \u2014 the exclusive; the 29-year quote\n6. [Search Engine Land \u2014 Google says DMA changes resulted in worst degradation of search quality ever](https://searchengineland.com/google-says-dma-changes-in-eu-resulted-in-worse-degradation-of-search-quality-ever-487340) \u2014 September 8, 2026\n7. [The Next Web \u2014 Google made search worse in Europe, and said so out loud](https://thenextweb.com/news/google-eu-search-dma-remedy-degraded-quality-nick-fox) \u2014 September 2026 \u2014 Fox quotes, the unverifiability point\n8. [Skift \u2014 Google's new hotel search in Europe](https://skift.com/2026/09/10/google-update-europe-hotel-flight-search-results/) \u2014 September 10, 2026 \u2014 aggregator/supplier units, 30 markets, AI Overviews and AI Mode scope\n9. [Search Engine Roundtable \u2014 almost all People Also Ask results are AI Overviews](https://www.seroundtable.com/ppa-ai-overviews-google-42047.html) \u2014 September 9, 2026 \u2014 Williams-Cook and Khosravi data and quotes\n10. [SEO Handbook \u2014 the AlsoAsked monthly series](https://seohandbook.co.uk/seo-news-updates/people-also-ask-ai-generated-97-percent/) \u2014 September 2026 \u2014 month-by-month table\n11. [Digiday \u2014 Amazon Ads brings advertisers to ChatGPT](https://digiday.com/media-buying/amazon-brings-its-dsp-to-openais-chatgpt-ads-extending-its-supply-chasing-streak/) \u2014 September 10, 2026 \u2014 the supply-chasing frame, revenue targets\n12. [Marketing Dive \u2014 Amazon pilots ad services in ChatGPT](https://www.marketingdive.com/news/amazon-pilots-ad-services-in-chatgpt-what-marketers-need-to-know/829945/) \u2014 September 10, 2026 \u2014 mechanics, Delta Vacations, control split\n13. [Adweek \u2014 Amazon and OpenAI team up to target ChatGPT's US users](https://www.adweek.com/commerce/amazon-and-openai-team-up-to-target-chatgpts-us-users/) \u2014 September 2026 \u2014 $1B trajectory, Sensor Tower 163%\n14. [Search Engine Land \u2014 OpenAI reportedly blocks rival AI tools from advertising in ChatGPT](https://searchengineland.com/openai-reportedly-blocks-rival-ai-tools-from-advertising-in-chatgpt-488019) \u2014 September 2026 \u2014 The Information's report, Adobe detail\n15. [PYMNTS \u2014 OpenAI cuts off rivals' ads on ChatGPT](https://www.pymnts.com/news/artificial-intelligence/2026/openai-cuts-off-rivals-ads-chatgpt/) \u2014 September 10, 2026 \u2014 Wyatt's LinkedIn quote, Images 2.5 timing\n16. [Search Engine Roundtable \u2014 Google Shopping ads have a reverse crocodile effect](https://www.seroundtable.com/google-shopping-ads-imp-ctr-42021.html) \u2014 September 7, 2026 \u2014 Ryan's data and hypothesis\n17. [Search Engine Land \u2014 AI Overviews may be affecting Shopping ad CTR and impressions](https://searchengineland.com/ai-overviews-may-be-affecting-shopping-ad-ctr-and-impressions-487265) \u2014 September 2026 \u2014 Optmyzr comparison, methodology\n18. [TechWyse \u2014 rising Shopping ad CTR is masking a drop in visibility](https://www.techwyse.com/news/reports-data/rising-shopping-ad-ctr-is-masking-a-drop-in-visibility) \u2014 September 8, 2026 \u2014 European campaign figures, Google documentation check\n19. [Search Engine Roundtable \u2014 Google Ads credits revoked after spending](https://www.seroundtable.com/google-ads-credit-revoked-42049.html) \u2014 September 10, 2026 \u2014 Melamed's post text, Marvin's reply\n20. [Search Engine Land \u2014 advertisers report Google Ads credits being revoked](https://searchengineland.com/advertisers-report-google-ads-credits-being-revoked-after-spending-488330) \u2014 September 11, 2026\n21. [Search Engine Roundtable \u2014 Google Ads tests restrictive match types in AI Mode](https://www.seroundtable.com/google-ads-serving-restrictive-match-types-ai-mode-42024.html) \u2014 September 4, 2026 \u2014 Marvin's confirmation\n22. [Search Engine Roundtable \u2014 OpenAI ChatGPT Ads updates](https://www.seroundtable.com/openai-chatgpt-ads-updates-42017.html) \u2014 September 2026 \u2014 market expansion and feature list\n23. [Search Engine Roundtable \u2014 Search Console indexing report missing June data](https://www.seroundtable.com/google-search-console-indexing-report-missing-data-42073.html) \u2014 September 11, 2026\n24. [Whiskey Riff \u2014 sportsbook under fire for AI-generated ad](https://www.whiskeyriff.com/2026/09/09/sportsbook-under-fire-for-ai-generated-ad-falsely-depicting-viral-ole-miss-fan-pulling-her-top-down/) \u2014 September 9, 2026 \u2014 the BetUS ad, X reaction, regulatory context\n25. [Daily Mail \u2014 the viral Ole Miss fan's DMs](https://www.dailymail.com/sport/college-football/article-16113049/ole-miss-fan-viral-dms.html) \u2014 September 8, 2026 \u2014 timeline of the viral moment\n26. [TechCrunch \u2014 Anthropic CEO outlines plan to 'pace the frontier'](https://techcrunch.com/2026/09/12/anthropic-ceo-outlines-plan-to-pace-the-frontier/) \u2014 September 12, 2026\n27. [SiliconANGLE \u2014 Altman and Musk back Amodei's call](https://siliconangle.com/2026/09/13/sam-altman-and-elon-musk-back-dario-amodeis-call-to-slow-down-the-frontier-of-ai-development/) \u2014 September 13, 2026 \u2014 the X responses\n28. [Search Engine Journal \u2014 Cloudflare lets sites disallow AI training without blocking Googlebot](https://www.searchenginejournal.com/cloudflare-lets-sites-disallow-ai-training-without-blocking-googlebot/589559/) \u2014 September 15, 2026 \u2014 editor's note context\n\n**Roundups consulted**\n\n29. [Search Engine Roundtable \u2014 Friday video recap, September 11](https://www.seroundtable.com/video-09-11-2026-42061.html) \u2014 September 11, 2026 \u2014 discovery index for watch items\n30. [Search Engine Roundtable \u2014 daily recap, September 11](https://www.seroundtable.com/recap-09-11-2026-42070.html) \u2014 September 11, 2026 \u2014 Google Ads cluster\n31. [Anicca \u2014 weekly search marketing update, September 11](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/) \u2014 September 11, 2026 \u2014 discovery index; carries Orbit Media, Exploding Topics, SE Ranking, Minkoff, SEW's AI Mode test, Le Monde\n32. [Anicca \u2014 AI in marketing and management, September 14](https://anicca.co.uk/blog/2026-09-14-ai-in-marketing-management/) \u2014 September 14, 2026 \u2014 Instacart, TikTok Shop, Gartner items\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
      simplifiedMd: "# Monday Signal \u2014 Week of September 14, 2026\n\n> **Google shipped what it calls the largest quality reduction in its 29-year history to Europe, told Reuters, and rolled it out anyway under the DMA.** Also: 97% of People Also Ask results are now AI Overviews, Amazon's DSP sells ChatGPT ads while OpenAI bars rival image and voice tools from buying them, Shopping ads' rising CTR is a shrinking denominator, an offshore sportsbook deepfaked a viral college football fan, and the heads of Anthropic, OpenAI, and xAI agreed the industry should slow down.\n\n---\n\n## The Conversation\n\n### A sportsbook deepfaked a fan two days after ESPN made her famous\n\nSara Smith went viral off a Sunday broadcast; by Tuesday offshore sportsbook BetUS had posted an AI ad on X falsely showing her pulling her top down to distract the defense. X turned on it unanimously: \"A real company posting a sexualized deepfake of a fan based on footage from a TV broadcast. We can't let this be the future.\" BetUS holds no US license, so there's none to lose; the disgust lands on everyone adjacent. Deepfake ads are a brand-safety category now. [Whiskey Riff](https://www.whiskeyriff.com/2026/09/09/sportsbook-under-fire-for-ai-generated-ad-falsely-depicting-viral-ole-miss-fan-pulling-her-top-down/)\n\n### Google revoked ad credits after the money was spent\n\nDavid Melamed: two client accounts had $3,200 promotional credits marked \"Invalidated\" more than a month after spending to earn them; no appeal, no refund; one because his MCC billing profile set the account up. Credit-holders also bid like spend is half price, raising CPCs for everyone. Ginny Marvin: \"I've passed this along to the team.\" Treat credits as provisional until they survive two billing cycles. [Search Engine Land](https://searchengineland.com/advertisers-report-google-ads-credits-being-revoked-after-spending-488330)\n\n### The AI industry's leaders asked it to slow down\n\nDario Amodei's essay (Sept 12): \"We must slow the pace at which we improve the capabilities of AI models.\" Musk: \"Dario is right.\" Altman: \"I agree with Dario that we need to pace the frontier.\" Six weeks of AI-marketing backlash ran on public unease; the industry's leaders just said it's warranted. Handle \"AI-powered\" with care in consumer copy. [The essay](https://darioamodei.com/post/we-must-pace-the-frontier)\n\n---\n\n## Voices\n\n- **Google official, unnamed (to Reuters, Sept 8):** \"the largest reduction in quality of service at the world's most popular internet search engine in its 29-year search history.\" [Reuters](https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/)\n- **Mark Williams-Cook, AlsoAsked (LinkedIn, Sept 8):** \"97% of PAA answers in the first week of September are AIOs, up from 86% in August\u2026 on track for 100% shortly.\" [Via SER](https://www.seroundtable.com/ppa-ai-overviews-google-42047.html)\n- **Mike Ryan, Smarter Ecommerce (LinkedIn):** \"Google checks the predicted CTR of a given query and serves AIOs preferentially for lower-probability queries in order to preserve revenue.\" [Via SER](https://www.seroundtable.com/google-shopping-ads-imp-ctr-42021.html)\n- **Doug Wyatt, Adobe (LinkedIn):** \"Image and voice/audio are closed off. Video's still open\u2026for now.\" [Via PYMNTS](https://www.pymnts.com/news/artificial-intelligence/2026/openai-cuts-off-rivals-ads-chatgpt/)\n- **Ginny Marvin, Google (LinkedIn, Sept 4):** exact and phrase match ads in AI Mode are \"limited to cases where there is explicit and direct user intent.\" [Thread](https://www.linkedin.com/posts/anthony-higman-a3656a46_breaking-google-is-now-serving-regular-activity-7501374557593845760-EjIf)\n\n---\n\n## This Week in Marketing AI\n\n### Google shipped its \"largest reduction in quality\" to Europe\n\nSept 8, 30 markets, DMA compliance after a \u20ac460M fine: an aggregator unit (one comparison service on top, expanded by default) and a stripped supplier unit for direct businesses (no dates, live prices, or tags); vacation rentals gone; extends into AI Overviews and AI Mode. Nick Fox: the changes \"degrade the user experience for Europeans.\" Google's supporting data (30% direct-booking loss, user dissatisfaction) is Google's alone. First look at regulator-shaped AI search. [Reuters](https://www.reuters.com/world/google-warns-lower-quality-it-revamps-europe-search-results-avoid-eu-fines-2026-09-08/) \u00b7 [Skift](https://skift.com/2026/09/10/google-update-europe-hotel-flight-search-results/)\n\n### People Also Ask is 97% AI Overviews\n\nAlsoAsked's 19.2M-PAA series: 12% fourteen months ago, 11% in April, 86% in August, 97% in the first week of September; Allintitle reads it as 100%. The question box answers itself and your page becomes a citation under it, if at all. Report PAA as a visibility surface, not a traffic source. [SER](https://www.seroundtable.com/ppa-ai-overviews-google-42047.html) \u00b7 [Monthly table](https://seohandbook.co.uk/seo-news-updates/people-also-ask-ai-generated-97-percent/)\n\n### Amazon's DSP sells ChatGPT ads; OpenAI shut out rival image and voice tools\n\nSept 10: select US advertisers (Delta Vacations first) buy ChatGPT inventory via Amazon DSP, managed service, CPC/CPM, product-feed ads; OpenAI controls placement. OpenAI says ads pass $1B in the next 12 months; Sensor Tower: ads per user-hour +163% Apr\u2192Aug. Sept 9 (The Information): OpenAI stopped approving ads for standalone image/audio-generation tools; Adobe's Firefly out, video \"still open\u2026for now\"; Images 2.5 shipped the same week. Check your category against a rulebook that moves privately. [Digiday](https://digiday.com/media-buying/amazon-brings-its-dsp-to-openais-chatgpt-ads-extending-its-supply-chasing-streak/) \u00b7 [SEL on the policy](https://searchengineland.com/openai-reportedly-blocks-rival-ai-tools-from-advertising-in-chatgpt-488019)\n\n### Your Shopping CTR went up. Check the denominator.\n\nRyan, 175B impressions: median impressions 1.85M\u21921.4M, median CTR 1.20%\u21921.55%, clicks flat; Optmyzr CTR +17% YoY. Hypothesis: Google routes low-click-probability queries to AI Overviews and keeps Shopping where clicks are likely (unproven; Google's docs don't confirm). A Q4 board pack will read the CTR as a win. Put impressions, clicks, and traffic next to it; rebaseline 2025 benchmarks. Search Engine Watch: a headphones query in AI Mode showed only ads in the product block. [SER](https://www.seroundtable.com/google-shopping-ads-imp-ctr-42021.html) \u00b7 [SEL](https://searchengineland.com/ai-overviews-may-be-affecting-shopping-ad-ctr-and-impressions-487265)\n\n### What AI answers do to demand: two datasets\n\nExploding Topics (2,300+ US consumers): 57.5% of AI users were talked out of a purchase by a chatbot; two-thirds replaced some product searches with AI; four in ten dislike chatbot ads. Fix the sources the model reads. SE Ranking's ChatGPT Ads test: 97,131 impressions, 1,263 clicks, 1.30% CTR. ChatGPT Ads expanded to Europe, India, MENA with a fuller performance stack. Infrastructure ahead of incrementality evidence. [Anicca roundup](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/) \u00b7 [SER on the updates](https://www.seroundtable.com/openai-chatgpt-ads-updates-42017.html)\n\n### Blogging confidence at a twelve-year low, AI adoption at 92%\n\nOrbit Media: 14% say their blog delivers strong results (26% in 2022); AI adoption 92.4% with no relationship to results; decline tracks abandoned practices (keyword research, original research, human editing, promotion). Posts take 3h20m instead of 4h+; ~50 hours saved a year while results slid. Speed replaced the parts that made the output good. [Via Anicca](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's Friday recap](https://www.seroundtable.com/video-09-11-2026-42061.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/weekly-update-search-marketing-11-09-2026/).*\n\n- **Cloudflare's crawler deadline is Sept 15;** the July plan would catch Googlebot in training blocks. *Editor's note (Sept 18): what shipped was softer: a \"Disallow AI Training\" setting keeps Google, Apple, and Microsoft crawling for search; only an explicit Block stops them.* [Cloudflare](https://blog.cloudflare.com/accountable-mixed-use-ai-crawlers/)\n- **Exact and phrase match ads in AI Mode** (Higman spotted Sept 3; Marvin confirmed a \"small experiment\" Sept 4, \"explicit and direct intent\" only). [Thread](https://www.linkedin.com/posts/anthony-higman-a3656a46_breaking-google-is-now-serving-regular-activity-7501374557593845760-EjIf)\n- **Google Ads cluster:** AI dashboard rollout, budget/bidding-target beta, Data Manager local optimization, loyalty segmentation, video campaign groups, Merchant Center AI intent/attribution; Meridian GeoX global. [SER Sept 11](https://www.seroundtable.com/recap-09-11-2026-42070.html)\n- **Search Console lost June indexing data** (Sept 11), third month of shaky reports. [SER](https://www.seroundtable.com/google-search-console-indexing-report-missing-data-42073.html)\n- **Target CPA is literal now** (Minkoff, SMX Now): reset targets to the number you want.\n- **Regional Search differences doc; Mueller on programmatic SEO; AI Mode citations panel moving to the bottom in a richer format.**\n- **DeepMind's Autoregressive Ranking paper:** direction of travel, no rollout; top-result accuracy fell in the shopping test.\n- **Siri handles 2.5B requests a day** (Apple, Sept 9).\n- **Instacart's Clementine; TikTok Shop named most for fraud (34.7%); Le Monde says AIOs haven't dented its audience.** [Anicca AI roundup](https://anicca.co.uk/blog/2026-09-14-ai-in-marketing-management/)\n\n---\n\n## Common Threads\n\n### The referee also plays\nGoogle grades its own EU remedy, labels its own PAA answers, defines \"explicit intent\" for AI Mode ads, and invalidates credits with no appeal. Every judgment this week came from the party with the incentive.\n\n### Your supplier is your competitor\nOpenAI sold ads to Adobe's category, then closed it the week Images 2.5 shipped. Amazon buys a channel it doesn't control. Google routes low-click queries to its own answers.\n\n### Denominators are lying\nShopping CTR up because impressions fell; PAA visibility replaced clicks; blogs faster while results slid. Read the second number.\n\n### The person in the ad didn't sign\nA deepfaked fan, an unauthorized singer, an influencer briefed against her client's channel, and the industry's leaders asking for caution. Consent is the brief.\n\n---\n\n## Angles for the Week\n\n- **Deepfake ads are a brand-safety category now.** Policy and response for when a real person is faked in your category's feed. Window: this week; durable.\n- **Your Shopping CTR went up. Check the denominator.** Rebaseline before Q4 templates lock. Window: two weeks.\n- **PAA is a visibility surface, not a traffic source.** Change the reporting before the traffic line drops. Window: open.\n- **The platform you advertise on competes with you.** Read every ad policy's \"reserves the right\" clause; cost out a category exit. Window: this week; durable.\n- **Europe is the test market for regulated AI search.** Segment EEA, watch direct vs intermediary clicks. Window: through the Commission's assessment.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
