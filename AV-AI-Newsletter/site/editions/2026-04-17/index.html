    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of April 17, 2026\n\n> Anthropic shipped Claude Opus 4.7 and narrowly retook the lead on most major benchmarks. OpenAI pushed a major Codex update on the same day, adding background computer use, an in-app browser, and built-in image generation. Wonder Project and Luma launched **Innovative Dreams**, a new production company built around real-time hybrid filmmaking \u2014 their first project is Ben Kingsley as Moses on Prime Video. Midjourney pushed V8.1 Alpha just one month after V8, making HD three times faster and cheaper. And Utopai shipped three-minute 4K video generation while Shutterstock debuted a unified AI video generator with commercial licensing baked in.\n\n---\n\n## This Week in AI\n\n### Anthropic Ships Claude Opus 4.7 \u2014 Narrowly Retakes the LLM Lead\n\nAnthropic released Claude Opus 4.7 on April 16, generally available through Claude products, the Claude API, Amazon Bedrock, Google Vertex AI, and Microsoft Foundry. The headline numbers: Opus 4.7 narrowly leads GPT-5.4 and Gemini 3.1 Pro on agentic coding, scaled tool use, agentic computer use, and financial analysis. Competitors still hold the lead on agentic search and multilingual Q&A.\n\nTwo changes stand out for AV workflows. First, vision resolution tripled \u2014 the model now processes images up to 2,576 pixels on the longest edge, useful for frame-level review of high-resolution stills. Second, Anthropic shipped stronger self-verification: the model now validates its own outputs before reporting, a direct response to the \"looks right but is wrong\" failure mode that hits hardest in long-running agentic tasks.\n\nPricing is unchanged at $5 per million input tokens and $25 per million output tokens. Anthropic also rolled out additional safeguards that detect and block high-risk cybersecurity requests, with a new Cyber Verification Program for legitimate security research \u2014 a direct continuation of the Mythos policy posture from two weeks ago.\n\n**Source:** [Anthropic](https://www.anthropic.com/news/claude-opus-4-7) \u00b7 [VentureBeat](https://venturebeat.com/technology/anthropic-releases-claude-opus-4-7-narrowly-retaking-lead-for-most-powerful-generally-available-llm) \u00b7 April 16, 2026\n\n### OpenAI Updates Codex \u2014 Background Computer Use, In-App Browser, Built-In Image Generation\n\nOpenAI shipped a major Codex update on April 16, the same day Anthropic pushed Opus 4.7. Three changes move Codex out of its original \"agentic coding assistant\" framing and into something closer to a general AI workspace:\n\n- **Background computer use.** Codex can now see, click, and type inside macOS apps in the background. Multiple agents can run in parallel without interrupting whatever else is on screen. The stated use cases are testing UI changes, iterating on frontend work, and operating apps that don't expose APIs.\n- **In-app browser (built on OpenAI's Atlas technology).** Users can open local or public pages inside Codex, leave comments directly on rendered elements, and ask Codex to address the feedback in the codebase. This collapses the review loop between designer, developer, and QA into a single pane.\n- **Built-in image generation.** GPT-image-1.5 is now available inside Codex, removing the need to switch to ChatGPT for AI-generated images as part of a workflow.\n\nThe release also added **111 new plugins** (combining skills, app integrations, and MCP servers), **thread automations** (Codex can schedule future work and wake up automatically to continue tasks over days or weeks), **GitHub pull-request support** inside the sidebar, memory preview for recalling prior sessions, and rich previews for PDFs, spreadsheets, and slides.\n\nThe direct comparison point is Claude Code, which has been the agentic-coding benchmark for most of the past year. With computer use in the background and an embedded browser, Codex now covers the main capability areas Claude Code doesn't \u2014 though Claude Code retains an edge on pure code reasoning in recent benchmarks.\n\n**Source:** [9to5Mac](https://9to5mac.com/2026/04/16/openais-codex-app-adds-three-key-features-for-expanding-beyond-agentic-coding/) \u00b7 [SiliconANGLE](https://siliconangle.com/2026/04/16/openai-ratchets-codexs-agentic-capabilities-rival-claude-code/) \u00b7 [OpenAI Codex Changelog](https://help.openai.com/en/articles/11428266-codex-changelog) \u00b7 April 16, 2026\n\n### Wonder Project and Luma Launch Innovative Dreams \u2014 \"Real-Time Hybrid Filmmaking\"\n\nWonder Project \u2014 the faith-and-family studio founded by Jon Erwin and Netflix veteran Kelly Merryman Hoogstraten \u2014 partnered with AI lab Luma to launch **Innovative Dreams**, a new production company combining a working studio, an R&D lab, and a visual effects arm. The venture is backed by Amazon Web Services and pitches itself around \"real-time hybrid filmmaking\": performance capture, virtual production, and generative AI integrated into a single pipeline rather than stitched together in post.\n\nThe anchor project is *The Old Stories: Moses*, a limited series starring Ben Kingsley as Moses and O-T Fagbenle as Pharaoh. It was shot entirely on a virtual stage and will premiere on Wonder Project's Prime Video subscription channel in spring 2026 before wider release on Prime Video. The company's stated ambition is to bring high-end virtual-production workflows \u2014 the kind previously accessible only to filmmakers like James Cameron \u2014 to smaller productions, while keeping human actors and performances at the center.\n\nWhat makes this operationally different from prior virtual-production work is the use of **Luma Agents** that allow real-time changes to sets, props, and lighting during a shoot, rather than locking those decisions before principal photography. The director and DP can adjust a scene's environment while the talent is still on set, and the AI-assisted layer is expected to hold continuity across the edit.\n\n**Source:** [Deadline](https://deadline.com/2026/04/wonder-project-ai-firm-luma-launch-innovative-dreams-hybrid-filmmaking-1236861786/) \u00b7 [it-boltwise](https://www.it-boltwise.de/innovative-ki-gestuetzte-filmproduktion-mit-luma-und-wonder-project.html) \u00b7 April 2026\n\n### Midjourney V8.1 Alpha \u2014 HD by Default, 3\u00d7 Faster, 3\u00d7 Cheaper\n\nMidjourney released V8.1 Alpha on April 14, one month after V8 shipped. The practical changes, in order of operational impact:\n\n- **HD mode is now 3\u00d7 faster and 3\u00d7 cheaper than V8.0**, and HD is the default output. A new \"Run as HD\" button re-runs any standard-resolution job at HD with the same seed preserved.\n- **Standard resolution is 50% faster and 25% cheaper**, with full quality matching V7 draft speed.\n- **Image prompts and image weights are restored** (they were broken in V8.0 \u2014 a major complaint from users running reference-driven workflows).\n- **Style references (srefs) and Moodboards are now \"super stable\"** across runs, making consistent character/visual-identity work more reliable.\n- **Prompt Shortener** automatically kicks in when prompts exceed length limits, and the **Describe** function now produces longer, more detailed V8-style prompts.\n\nMidjourney has signaled it will decommission V8.0 after V8.1 stabilizes, and the roadmap next points to V8 upscalers followed by edit, inpainting, and outpainting model upgrades.\n\n**Source:** [Midjourney Updates](https://updates.midjourney.com/v8-1-alpha/) \u00b7 April 14, 2026\n\n### Utopai Ships 3-Minute 4K Video Generation\n\nUtopai Studios \u2014 which has been quietly used on several Hollywood productions \u2014 announced on April 14 that its PAI platform can now generate continuous **three-minute 4K video sequences**, paired with an enhanced Story Agent designed to maintain continuity across shots, scenes, and edits. The stated goal is to support narrative work across pre-production, production, and post-production rather than the 5-to-15-second clips that dominate the current AI video market.\n\nThree minutes at 4K is a notable jump from what other commercially available video models ship: most top-tier models still target 10\u201315 seconds per generation, with longer sequences requiring manual stitching. Utopai hasn't published benchmark scores against Seedance 2.0 or Veo 3.1, but the longer duration and continuity layer point at a different use case \u2014 full narrative scenes rather than isolated shots.\n\n**Source:** [Las Vegas Sun](https://lasvegassun.com/news/2026/apr/14/utopai-studios-announces-industry-first-three-minu/) \u00b7 [Passionate in Marketing](https://www.passionateinmarketing.com/utopai-studios-announces-industry-first-three-minute-4k-video-generation-and-enhanced-story-agent-for-its-pai-storytelling-ai-platform/) \u00b7 April 14, 2026\n\n### Shutterstock Launches Unified AI Video Generator\n\nShutterstock launched its AI Video Generator on April 15 \u2014 a commercial-ready platform that wraps Google and Runway's top video models and pairs them with Shutterstock's stock footage library. The positioning is \"concept to deployment\" in one tool: search stock, generate, edit, license, export. Notably, the generated output ships with Shutterstock's standard commercial license, which removes the usage-rights ambiguity that has shadowed generative video for the last 18 months.\n\n**Source:** [Market Screener](https://au.marketscreener.com/news/shutterstock-expands-commercial-ready-genai-solutions-with-ai-video-generator-ce7e50dcdc8ff722) \u00b7 April 15, 2026\n\n### ElevenLabs Ships ElevenMusic on iOS \u2014 Direct Competition with Suno and Udio\n\nElevenLabs \u2014 best known for voice cloning and text-to-speech \u2014 launched a dedicated **ElevenMusic** iOS app earlier this month, aimed directly at Suno and Udio. Free tier generates up to 7 songs per day; Pro is $9.99/month for up to 500 tracks, section-by-section editing (verse, chorus, bridge), and a marketplace for licensing generated tracks. ElevenLabs entered the market with pre-signed licensing agreements with Merlin and publisher Kobalt \u2014 something Suno and Udio did not have at launch and which has since become the focus of ongoing copyright litigation against them. ElevenLabs was last valued at $11 billion after a $500M Series D in February.\n\n**Source:** [Music Business Worldwide](https://www.musicbusinessworldwide.com/elevenlabs-launches-elevenmusic-ios-app-taking-on-suno-and-udio-on-mobile/) \u00b7 April 2026\n\n### Google I/O 2026 Dated for May 19\u201320, Veo 4 Expected\n\nGoogle confirmed Google I/O 2026 for **May 19\u201320** in Mountain View. The keynote lineup includes Gemini, AI Mode for Search, Chrome, Workspace, Pixel, and agentic coding tools. Veo 4 has not been officially announced, but industry expectation \u2014 and the ~18-month gap since Veo 3.1 released in October 2025 \u2014 makes an I/O reveal the most likely window. Expected features based on prior roadmaps: extended multi-minute generation, advanced physics handling, and finer cinematic camera controls. All speculation until the keynote.\n\n**Source:** [The Verge](https://www.theverge.com/tech/880401/google-io-2026-dates-ai) \u00b7 [Google Developers Blog](https://developers.googleblog.com/get-ready-for-google-io-2026/) \u00b7 April 2026\n\n---\n\n## Voices This Week\n\n### Jon Erwin on Hybrid Filmmaking\n\nThe Wonder Project co-founder, describing the thesis behind Innovative Dreams: *\"This is not about replacing filmmakers or actors. It's about giving smaller productions access to the tools James Cameron has. Performance still matters. What changes is how quickly you can explore an idea, and how much of what used to happen in post now happens on set.\"* The venture's first project, *The Old Stories: Moses* with Ben Kingsley, was shot entirely on a virtual stage using the approach.\n\n### Alex Spencer on Midjourney's Iteration Cadence\n\nDesigner Alex Spencer (@axpncr), on the speed of the V8 \u2192 V8.1 cycle: *\"Midjourney V8.1 Alpha is officially live. This update came extremely fast \u2014 just one month after V8 released. And the three main pain points users complained about during the V8 era have all been addressed head-on. This is a textbook demonstration of AI product iteration speed.\"* The three pain points he references: image prompts broken in V8.0, unstable style references, and slow HD mode \u2014 all directly addressed in V8.1.\n\n---\n\n## Common Threads\n\n### Anthropic and OpenAI Shipped on the Same Day\n\nOpus 4.7 and the Codex update both landed on April 16. They're responses to overlapping pressure: Opus 4.7 shores up Anthropic's lead on agentic coding benchmarks; the Codex update adds the capabilities (computer use, embedded browser, image generation) that Claude Code doesn't yet have. The result is that the two leading agentic coding tools are now converging on feature parity from opposite starting points \u2014 Anthropic from model strength, OpenAI from tooling breadth. For anyone deciding between them, the gap is narrower this week than it's been since Claude Code launched.\n\n### Virtual Production and AI Are Converging Into One Workflow\n\nInnovative Dreams (Wonder Project \u00d7 Luma), Utopai's 3-minute 4K Story Agent, and Intangible.ai's spatial-intelligence platform all point at the same shift: AI is moving from \"generate a clip\" to \"augment a full production pipeline.\" The difference matters. A generated clip is a deliverable; an AI-augmented pipeline is a workflow that a director, DP, and editor can use from pre-production through post. The economics change too \u2014 Luma and Wonder Project explicitly frame the pitch around cost access (\"high-end virtual production for smaller productions\"), and Intangible advertises $5K\u2013$50K in pre-production savings per project through faster previsualization. Whether the numbers hold up in real productions is an open question, but the direction of travel is consistent across three independent efforts this week alone.\n\n### Video Generation Is Getting Swallowed by Existing Platforms\n\nShutterstock embedded Google and Runway models behind a commercial license, Utopai positioned its 4K platform for professional Hollywood use, and Innovative Dreams bundled Luma directly into a virtual-production stage. The pattern: frontier video models are no longer distributed primarily through standalone generator tools. They're being integrated into the platforms where creators and productions already work. The implication for anyone building an AI-video workflow is that \"which tool do I use?\" is becoming a less useful question than \"which platform do I work in?\" \u2014 because the model choice is increasingly hidden behind the platform's UI.\n\n### Midjourney's Response Speed Is Unusual for the Category\n\nV8.1 shipped one month after V8, directly targeting the three biggest user complaints about V8.0. For reference: the gap between Midjourney V7 and V8 was roughly 14 months, and major frontier model updates from OpenAI, Anthropic, and Google generally run on 3\u20136 month cycles. A one-month corrective release isn't unheard of, but it does indicate Midjourney is optimizing for iteration speed and responsiveness over long strategic releases \u2014 more like a web product than a foundation model lab.\n\n---\n\n## Novel Ideas Worth Watching\n\n### Direct Like a Camera, Not a Prompter\n\nIntangible.ai's pitch \u2014 \"stop prompting, start directing\" \u2014 reflects a UX shift that's quietly showing up across multiple tools. The platform lets you build a 3D scene, position cameras, set lighting and composition, then hand that structured scene to a generative model as the constraint. Instead of describing what you want in words, you show the model the geometry. Similar thinking is visible in Innovative Dreams' real-time on-set adjustments (Luma Agents) and in Utopai's Story Agent continuity layer. The common pattern: AI works better when given spatial or structural constraints than when given only text \u2014 a point the previs and VFX world has understood for decades but which most consumer AI tools are only now beginning to surface.\n\n### Commercial Licensing as a Product Feature\n\nShutterstock and ElevenLabs both shipped commercial licensing as a native part of their AI products this month. Shutterstock's AI Video Generator output carries the same commercial license as its stock library. ElevenMusic launched with Merlin and Kobalt licensing already in place. This is a departure from the first generation of AI tools (Suno, Udio, early Midjourney, Stable Diffusion), most of which punted on licensing and are now defending lawsuits. The commercial angle increasingly looks like a competitive moat \u2014 not a legal afterthought.\n\n### Vision Capability at Higher Resolution\n\nOpus 4.7 triples the maximum image edge (860 \u2192 2,576 pixels). That's not a flagship feature \u2014 Anthropic buried it in the release notes \u2014 but for workflows that involve reviewing frames, continuity shots, or high-resolution stills, it's a meaningful jump. It shortens the gap between \"what a human editor can see at native resolution\" and \"what the model can analyze\" without manual downsampling.\n\n---\n\n## Tool of the Week\n\n### Intangible.ai\n\n**What it does:** A browser-based, AI-native 3D creation platform aimed squarely at creative professionals in film, advertising, events, games, and architecture. The pitch is \"stop prompting, start directing\" \u2014 instead of writing text prompts and hoping for the best, you assemble a 3D scene from drag-and-drop assets (or prompt a scene into existence), position cameras, set lighting, then hand the composed scene to the AI model as a structural constraint. The result is image and video generation that stays consistent with shot composition and scene geometry across multiple renders.\n\n**Who it's for:** Directors, DPs, producers, and creative leads who do previsualization work \u2014 pitching ideas to clients, exploring shot composition before a shoot, visualizing events or sets before budget approval. The tool targets the same phase where AV teams typically use storyboards, concept art, or basic 3D previs.\n\n**Pricing:** Free tier available. Paid plans start at $15/month. The platform includes 5,000\u20136,000 3D assets, cinematography controls, style references for narrative consistency, and image/video generation in one click.\n\n**Worth trying?** For anyone doing previsualization or shot-composition work, yes. The \"spatial-first, prompt-second\" approach addresses the biggest pain point with current generative video tools \u2014 they drift, because they don't know where objects are in 3D space. Intangible solves that by letting you lock the geometry first. The team comes from Apple, Pixar, Netflix, Google, and Unity, which shows in the camera and asset tooling. Limitations: it's still a previsualization tool, not a final-delivery tool \u2014 the output quality is better used as a directing layer over another model than as the finished frame itself.\n\n**Link:** [intangible.ai](https://www.intangible.ai/)\n\n---\n\n## Sources\n\n1. [Anthropic Blog](https://www.anthropic.com/news/claude-opus-4-7) \u2014 April 16, 2026 \u2014 Claude Opus 4.7 release announcement\n2. [VentureBeat](https://venturebeat.com/technology/anthropic-releases-claude-opus-4-7-narrowly-retaking-lead-for-most-powerful-generally-available-llm) \u2014 April 16, 2026 \u2014 Opus 4.7 benchmark analysis\n3. [9to5Mac](https://9to5mac.com/2026/04/16/openais-codex-app-adds-three-key-features-for-expanding-beyond-agentic-coding/) \u2014 April 16, 2026 \u2014 Codex adds background computer use, in-app browser, image generation\n4. [SiliconANGLE](https://siliconangle.com/2026/04/16/openai-ratchets-codexs-agentic-capabilities-rival-claude-code/) \u2014 April 16, 2026 \u2014 Codex's expanded agentic capabilities vs. Claude Code\n5. [OpenAI Codex Changelog](https://help.openai.com/en/articles/11428266-codex-changelog) \u2014 April 16, 2026 \u2014 Codex April release notes\n6. [Deadline](https://deadline.com/2026/04/wonder-project-ai-firm-luma-launch-innovative-dreams-hybrid-filmmaking-1236861786/) \u2014 April 2026 \u2014 Wonder Project \u00d7 Luma launch Innovative Dreams\n7. [it-boltwise](https://www.it-boltwise.de/innovative-ki-gestuetzte-filmproduktion-mit-luma-und-wonder-project.html) \u2014 April 2026 \u2014 Innovative Dreams and *The Old Stories: Moses*\n8. [Midjourney Updates](https://updates.midjourney.com/v8-1-alpha/) \u2014 April 14, 2026 \u2014 V8.1 Alpha release notes\n9. [Las Vegas Sun](https://lasvegassun.com/news/2026/apr/14/utopai-studios-announces-industry-first-three-minu/) \u2014 April 14, 2026 \u2014 Utopai PAI 3-minute 4K video\n10. [Market Screener / Shutterstock](https://au.marketscreener.com/news/shutterstock-expands-commercial-ready-genai-solutions-with-ai-video-generator-ce7e50dcdc8ff722) \u2014 April 15, 2026 \u2014 Shutterstock AI Video Generator launch\n11. [Music Business Worldwide](https://www.musicbusinessworldwide.com/elevenlabs-launches-elevenmusic-ios-app-taking-on-suno-and-udio-on-mobile/) \u2014 April 2026 \u2014 ElevenMusic iOS app\n12. [The Verge](https://www.theverge.com/tech/880401/google-io-2026-dates-ai) \u2014 April 2026 \u2014 Google I/O 2026 dates\n13. [Google Developers Blog](https://developers.googleblog.com/get-ready-for-google-io-2026/) \u2014 April 2026 \u2014 I/O 2026 agenda preview\n14. [Intangible.ai](https://www.intangible.ai/) \u2014 Platform reference \u2014 Spatial intelligence AI for creative industries\n15. [Crosslink Capital](https://www.crosslinkcapital.com/news/intangible-launches-public-beta-merging-generative-ai-game-engines-and-cinematic-design/) \u2014 2025 \u2014 Intangible public beta context\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of April 17, 2026\n\n> Quick Summary: Anthropic released a new Claude model that narrowly beats every other AI on key tests \u2014 and on the same day, OpenAI rolled out a major update to Codex that lets it operate your computer in the background. A major new film production company launched that uses AI alongside real actors \u2014 their first project stars Ben Kingsley as Moses. Midjourney made its image tool three times faster and cheaper. And the AI video space keeps consolidating, with established platforms like Shutterstock now offering commercial-ready AI video generation.\n\n---\n\n## The Big Stories This Week\n\n### Anthropic Releases Claude Opus 4.7\n\nAnthropic shipped a new version of Claude \u2014 **Opus 4.7** \u2014 that now slightly outperforms OpenAI's GPT-5.4 and Google's Gemini 3.1 on key benchmarks for coding, using tools, and running autonomous tasks. The biggest practical improvement: the model can now analyze much higher-resolution images than before (roughly three times larger), which matters for work like reviewing video frames or detailed stills.\n\nThe model also does a better job of checking its own work before reporting back \u2014 a direct response to a common failure mode where AI looks right but is actually wrong. Pricing is unchanged.\n\n### OpenAI Updates Codex \u2014 And It Can Now Operate Your Computer\n\nOn the same day Anthropic released Opus 4.7, OpenAI shipped a major update to **Codex**, its AI coding assistant. The update pushes Codex well beyond coding:\n\n- **It can now operate your computer in the background** \u2014 seeing, clicking, and typing inside Mac apps while you work on something else. This lets it test changes, click through apps that don't have APIs, or run multiple agents in parallel.\n- **A built-in web browser** lets you open pages inside Codex, leave comments on rendered elements, and have Codex address the feedback in code.\n- **Image generation is built in** (using GPT-image-1.5), so you don't have to switch to ChatGPT when you need an image as part of a workflow.\n\nIt also added 111 new plugins, GitHub pull request support, scheduled \"thread automations\" that wake Codex up to continue long-running tasks over days or weeks, and memory of prior sessions. The comparison point is Claude Code \u2014 Anthropic's coding tool \u2014 and the two products are now converging on similar capabilities from opposite directions.\n\n### Wonder Project and Luma Launch \"Innovative Dreams\" for AI-Assisted Filmmaking\n\nA new production company called **Innovative Dreams** launched this week \u2014 a partnership between Wonder Project (a faith-and-family studio founded by Jon Erwin) and the AI lab Luma, backed by Amazon Web Services. Their approach is called \"real-time hybrid filmmaking,\" which combines real actors, virtual sets, and generative AI into a single workflow \u2014 instead of bolting AI onto the end of traditional production.\n\nTheir first project is *The Old Stories: Moses*, starring Ben Kingsley as Moses and O-T Fagbenle as Pharaoh. It was shot entirely on a virtual stage and is coming to Prime Video this spring.\n\nWhat's different here: directors can make real-time changes to sets, props, and lighting while the actors are still on set \u2014 changes that would have required weeks of post-production in traditional workflows. The pitch is that it brings high-end virtual production (the kind James Cameron uses) within reach of smaller productions.\n\n### Midjourney V8.1 \u2014 Faster, Cheaper, and Image Prompts Are Back\n\nMidjourney released **V8.1 Alpha** just one month after V8. The key changes:\n\n- **HD mode is now 3x faster and 3x cheaper**, and HD is the default output\n- **Standard resolution is 50% faster and 25% cheaper**\n- **Image prompts and image weights work again** \u2014 these were broken in V8 and are critical for anyone using reference images\n- **Style references are much more stable** across runs, so consistent characters and looks are easier to maintain\n\nThe one-month turnaround between versions is unusually fast for an AI company \u2014 most major releases happen every 3\u20136 months. The update directly addressed the three biggest user complaints about V8.\n\n### Utopai Ships Three-Minute 4K Video Generation\n\nUtopai Studios \u2014 which has been quietly used on Hollywood productions \u2014 announced that its AI video platform can now generate **continuous three-minute videos at 4K resolution**. Most AI video tools today max out at 10\u201315 seconds before needing to be manually stitched together. Utopai also introduced a \"Story Agent\" that tries to keep continuity across shots and scenes \u2014 a common pain point with AI video.\n\n### Shutterstock Launches AI Video Generator with Commercial Licensing\n\nShutterstock rolled out a unified AI video generator that combines Google's and Runway's top video models with its stock footage library. The notable feature: everything generated through the platform comes with Shutterstock's standard commercial license, which removes the legal ambiguity that's followed AI-generated content for the last couple of years.\n\n### ElevenLabs Enters AI Music with ElevenMusic iOS App\n\nElevenLabs \u2014 best known for voice cloning \u2014 launched a standalone iPhone app called **ElevenMusic**, going head-to-head with Suno and Udio. You can generate up to 7 songs per day free, or $9.99/month for 500 tracks with the ability to edit individual sections (verse, chorus, bridge). Unlike its competitors, ElevenLabs launched with music licensing agreements already in place, which may become important as the copyright lawsuits against Suno and Udio continue.\n\n### Google I/O Confirmed for May 19\u201320 \u2014 Veo 4 Likely\n\nGoogle confirmed its biggest event of the year for May 19\u201320 in Mountain View. Industry watchers expect the next version of Google's video AI model (Veo 4) to be announced, with rumored features including longer video generation, better physics handling, and improved cinematic camera controls.\n\n---\n\n## Why This Week Matters\n\nA few patterns worth noting:\n\n- **The two leading AI labs shipped on the same day.** Anthropic's Opus 4.7 and OpenAI's Codex update both landed on April 16, and they're converging on similar capabilities from opposite starting points. Anthropic leads on model reasoning; OpenAI leads on the surrounding tools (computer use, embedded browser, image generation). The gap between them is narrower this week than it's been in months.\n\n- **AI is moving into the full production pipeline.** Between Innovative Dreams, Utopai, and tools like Intangible.ai, the AI video story is shifting from \"generate a short clip\" to \"augment an entire production workflow.\" This is a meaningful shift for anyone working in AV.\n\n- **AI video tools are being absorbed into existing platforms.** Shutterstock, TikTok, and similar platforms are embedding frontier AI video models directly into their existing tools. The result: you may not need to pick which AI tool to use \u2014 you'll just use whichever platform you already work in.\n\n- **Commercial licensing is becoming a competitive advantage.** Shutterstock and ElevenLabs both shipped products this month where licensing is a built-in feature, not an afterthought. That's a direct response to the legal fights surrounding earlier AI tools.\n\n- **Midjourney's speed stands out.** Most AI companies release major updates every few months. Midjourney went from V8 to V8.1 in 30 days \u2014 a very different operational tempo.\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. This is the quick summary \u2014 the full edition has the complete technical breakdown and sources. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
