    const EDITION_MD = "# The AVS AI Dispatch \u2014 Week of July 24, 2026\n\n> **FLUX 3 is the week\u2019s largest media-model announcement and its largest evidence gap.** The newly announced system is presented as one backbone for image, video, audio, and action, but only Video and Action entered gated early access. Qwen expanded both voice and structured-image generation, Runway moved model selection behind a policy router, Sonilo tied sound-effects timing directly to picture, and ElevenMusic added reference-driven music controls. Across the releases, multimodal ambition, revision, routing, and rights controls are advancing faster than public specifications and independent evaluation.\n\n---\n\n## This Week in AI\n\n### FLUX 3 Proposes One Media Backbone, but Access and Evidence Remain Narrow\n\nFLUX 3 was announced on July 23 as a jointly trained backbone across image, video, and audio, with the same learned foundation extended toward action prediction. That is a broader claim than adding video to an image product: the stated goal is one system that can generate and revise still images, motion, sound, and sequences of actions.\n\nThe current release is much narrower than that goal:\n\n- **FLUX 3 Video** entered gated early access.\n- **FLUX 3 Action** entered gated early access for selected research and commercial partners.\n- **FLUX 3 Image** is promised in the following weeks.\n- **API access and private weights** are planned for later, without public dates.\n- **FLUX 3 Dev open weights** are planned for later in 2026; a license has not been published.\n\nVideo is the most developed part of the announcement. It can generate clips of up to **20 seconds** with native audio and accepts text, images, video, and keyframes as conditioning. The announced modes include text-to-video, image-to-video, video-to-video, keyframe transitions, and continuation of both video and audio.\n\nThe developer also claims multilingual dialogue, typography and animated design, multiple aspect ratios and styles, and chaining across multiple shots. Together, those features describe a system intended to carry picture, sound, layout, and shot-to-shot continuity rather than produce one isolated silent clip.\n\nThe comparison evidence is preliminary. The developer\u2019s tests used **early-checkpoint 10-second, 720p clips with audio**, not the full 20-second format. FLUX 3 was preferred over Luma Ray 3.2 in **93%** of comparisons, Runway Gen-4.5 in **77%**, Grok Imagine Video in **69%**, Kling v3 Pro in **60%**, Happy Horse v1 in **59%**, Happy Horse 1.1 in **57%**, and Seedance 2.0 and Gemini Omni Flash in **52%** each.\n\nThose percentages were published without a sample size, prompt set, rater details, confidence intervals, randomization procedure, inference settings, or separate picture and audio scores. Without those details, a **52% result may be a statistical tie**, and there is no published evidence that the tested checkpoint is identical to the gated system.\n\nImportant production details also remain unavailable. There is **no public pricing, license, parameter count, hardware profile, service-level agreement, maximum resolution, output-format specification, reference limit, or independent hands-on test**. Public API access and downloadable weights were not available during the research window.\n\nFLUX 3 therefore matters for the architecture it is trying to establish: one image, video, audio, and action backbone that can carry more of a production sequence. Its ambition currently exceeds its availability, published specifications, and independent evidence.\n\n**Source:** [FLUX 3 developer announcement](https://bfl.ai/blog/flux-3) \u00b7 [Independent launch reporting](https://venturebeat.com/technology/black-forest-labs-launches-flux-3-capable-of-generating-images-and-20-second-video-with-audio-but-in-limited-release-to-start) \u00b7 July 23, 2026\n\n### Qwen-Audio-3.0 Adds Directed Delivery and Multilingual Voice\n\n**Qwen-Audio-3.0-TTS** launched in Flash and Plus variants. Flash is positioned for lower latency, while Plus prioritizes output quality. The hosted service supports **16 languages**, natural-language direction for delivery, inline nonverbal tags, voice cloning from imperfect references, and outputs of up to **three minutes per pass**.\n\nThe independent evidence is stronger than for most launches this week, though still limited to one kind of evaluation. An Artificial Analysis leaderboard snapshot placed Plus at **1,234 Elo \u00b116 from 1,517 samples**, effectively tied with Simba 3.2 in that test. That result does not establish equal performance across every language, delivery style, or production setting.\n\nAccess is through the hosted Model Studio API; weights were not released. Full language coverage and 48kHz support were still rolling out, so the announced feature set was not uniformly available during the research window.\n\nFor AV work, the notable shift is from plain text-to-speech toward directed performance: language, pacing, delivery, and vocal identity are becoming controllable parts of one hosted voice stack.\n\n**Source:** [Qwen-Audio-3.0 announcement](https://www.alibabacloud.com/blog/qwen-audio-3-0-tts-more-multilingual-easier-to-direct_603379) \u00b7 July 21, 2026 \u00b7 [Independent voice leaderboard](https://artificialanalysis.ai/text-to-speech/leaderboard/provider-voice) \u00b7 accessed July 27, 2026\n\n### Runway Media Router Turns Model Choice Into a Reusable Policy\n\nRunway released **Media Router** on July 23 through Runway Dev. A configuration can route an image, video, or audio request according to one preference\u2014**cost, latency, or quality**\u2014instead of requiring a person or application to choose a model for every request.\n\nConfigurations can include model allowlists or denylists, credit ceilings, immutable configuration IDs, version history, realized costs, and dry runs. Runway says there is no routing surcharge; the selected model\u2019s rate applies, and one Runway credit equals **$0.01**.\n\nThe router\u2019s quality scores and selection methods are internal. The returned configuration and cost records help, but reproducibility and provenance still depend on logging which model was selected, which router version made the choice, and what policy was active.\n\nThe launch moves model choice behind infrastructure. A preview, review copy, or final render can now be associated with a standing routing policy rather than one manually selected model.\n\n**Source:** [Runway \u2014 Media Router](https://runwayml.com/news/company-news/introducing-runway-media-router) \u00b7 [Runway router documentation](https://docs.dev.runwayml.com/model-routers/configuration/) \u00b7 [Independent launch reporting](https://techcrunch.com/2026/07/23/runway-bets-on-ai-model-routing-as-generative-media-gets-crowded/) \u00b7 July 23, 2026\n\n### Sonilo Sound Effects 1.0 Uses Picture as Its Timing Guide\n\n**Sonilo Sound Effects 1.0** generates a synchronized sound-effects track from up to **three minutes of video**. The video supplies visible events and timing, while an optional text prompt can add direction. A separate text-to-sound mode generates audio from **one to 180 seconds**.\n\nThe service outputs AAC, MP3, WAV, or FLAC. Launch pricing is **$0.009 per second** for video-conditioned generation and **$0.0018 per second** for text-only generation. Initial access is through the fal API.\n\nThe naming is not fully aligned: the launch calls the model 1.0, while current endpoints use v1.1. More importantly, no independent synchronization benchmark or published test methodology was available. The verified product change is that picture itself can provide the event and timing structure for generated effects.\n\n**Source:** [Sonilo launch announcement](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html) \u00b7 [API documentation](https://fal.ai/models/sonilo/v1.1/video-to-sound-effects/llms.txt) \u00b7 July 21, 2026\n\n### Qwen-Image-3.0 Targets Dense Layouts and Small Text\n\n**Qwen-Image-3.0** is aimed at structured visual material as well as standalone images. The developer claims prompts of up to **4,500 tokens**, text rendering down to **10 pixels**, **12 languages**, dense multi-panel layouts, formulas, user-interface mockups, editing, and optional retrieval.\n\nThat combination is relevant to storyboards, production diagrams, title graphics, presentation pages, and reference layouts where relationships and readable labels matter as much as appearance.\n\nThe model is available in Qwen Chat, while API access remained limited or trial-based. No public weights, parameter count, license, model card, blind benchmark, latency profile, or stable API contract accompanied the launch. The examples are vendor demonstrations, and independent reporting did not supply a controlled quality test.\n\n**Source:** [Qwen-Image-3.0 announcement](https://www.alibabacloud.com/blog/qwen-image-3-0-rich-content-authentic-details-deep-knowledge_603385) \u00b7 [Independent launch reporting](https://decrypt.co/374084/alibaba-qwen-image-3-ai-useful-not-just-pretty) \u00b7 July 21\u201322, 2026\n\n### ElevenMusic Adds References, Reusable Vocals, and Finetunes\n\nElevenMusic added three related ways to carry sonic identity across generations. **References** accepts **10 seconds to five minutes** of audio and uses it to guide style, instrumentation, and feel. A text prompt can be combined with the reference or omitted.\n\n**Vocals** creates a reusable singing identity from recordings supplied by the uploader, or uses a voice from the service\u2019s library. **Finetunes** creates a private style model from a collection of tracks; current documentation allows up to **50 tracks**, with limits of 10 seconds to 10 minutes per track and 250 minutes of total audio.\n\nThese controls move music generation beyond a text-only description. A reference can guide one generation, while reusable vocals and finetunes can carry a recurring identity across a series of tracks.\n\nThe developer says uploaded audio is checked for recorded matches. That screening is a vendor safeguard, not proof that an uploader owns every right or has every performer\u2019s consent. Documentation also contains Music v1 and v2 transition details that require attention when comparing product behavior.\n\n**Source:** [ElevenMusic References announcement](https://elevenlabs.io/blog/introducing-references-sound-control-for-music-v2) \u00b7 [ElevenMusic Vocals announcement](https://elevenlabs.io/blog/introducing-vocals-a-consistent-voice-for-your-elevenmusic-songs) \u00b7 [Music Finetunes documentation](https://elevenlabs.io/docs/eleven-creative/products/music/finetunes.mdx) \u00b7 July 22\u201323, 2026\n\n---\n\n## Quick Hits\n\n- **Cosmos3-Super Image2Video 4Step** is a 64-billion-parameter open-weight image-to-video model using four denoising steps. An independent leaderboard snapshot placed it at approximately **1,271 Elo** at the top of the filtered open-weight image-to-video list without audio. The developer\u2019s up-to-25-times acceleration claim remains vendor-measured, and the published hardware profile centers on data-center or professional GPUs. [Model page](https://huggingface.co/nvidia/Cosmos3-Super-Image2Video-4Step) \u00b7 [Independent leaderboard](https://artificialanalysis.ai/video/leaderboard/image-to-video?audio-output=false&open-weights=true) \u00b7 July 20\n- **SANA-Video 2.0** describes 5-billion- and 14-billion-parameter video models using 75% linear attention. The authors report five seconds of 720p video in 13.06 seconds on one H100 and a 120-times speed comparison, but the measurements are author-run, use high-end hardware, and had no independent replication; the new weights were not available during the scan. [Paper](https://arxiv.org/abs/2607.21553) \u00b7 [Project page](https://nvlabs.github.io/Sana/Video2/) \u00b7 July 23\u201324\n- **ShotPlan** uses planning tokens for hard cuts, soft transitions, and local camera movement. The authors report hard-cut timing error below one frame. Code and weights are available under Apache-2.0, while the public data is research-only and the evaluation has not been independently replicated. [Paper](https://arxiv.org/abs/2607.17675) \u00b7 [Repository](https://github.com/Pensioner-11/ShotPlan) \u00b7 July 20\n- **Luma moved production inference to AMD and TensorWave infrastructure.** Luma says thousands of MI325X GPUs now serve Ray3.2, Uni-1, and Luma Agents. The migration is company-reported, with no independent throughput, cost, power, or quality audit. [Luma announcement](https://lumalabs.ai/news/luma-runs-production-inference-on-amd-and-tensorwave) \u00b7 July 22\n- **Gemini Flash variants broadened the agent lineup.** Gemini 3.6 Flash and 3.5 Flash-Lite target agent execution and high-throughput work, while a restricted security variant serves a different access tier. These are multimodal understanding and agent models relevant to logging, metadata, quality checks, and production-system operation\u2014not native media generators. [Google announcement](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Runway\u2019s AI Media Report collects large adoption claims from customers**, including 800\u20131,000 ads from a five-person team, 46,000 saved hours, approximately 8,000 property videos, and 210 products per day. The accounts are anonymized, self-selected, and unaudited, with no shared definitions, controls, failure rates, or full methodology. They are adoption signals, not independent performance evidence. [Runway report](https://runway.com/news/company-news/ai-media-report) \u00b7 July 20\n\n---\n\n## Voices This Week\n\n### Eiso Kant on Verification Around the Model\n\nEiso Kant described an agent-assisted experiment system in which agents write code, launch training jobs, evaluate results, and alter data or training pipelines. The company reports **10,000\u201320,000 model experiments per month** with fewer than 70 researchers and about 35 engineers; those counts are company-reported rather than independently audited.\n\nHis broader point was that persistence, verification, backtracking, and avoiding premature completion may matter more to practical gains than raw model scale alone. He also kept people responsible for originating ideas and debugging.\n\n**Source:** [Eiso Kant \u2014 July 23 discussion](https://www.latent.space/p/poolside) \u00b7 practitioner interview and transcript\n\n### Chris Benson on Machine-Facing Interfaces\n\nChris Benson observed that long-running agents change both economics and interface design. When systems interact through machine-facing connections rather than a person navigating every graphical screen, identity, permissions, resource controls, and recovery become part of the product.\n\nFor media operations, the observation applies to scheduling, asset movement, transcription, rendering, quality checks, and publishing. It is practitioner commentary, not a measured reliability study.\n\n**Source:** [Chris Benson \u2014 July 23 discussion](https://practicalai.show/365) \u00b7 practitioner commentary and episode notes\n\n### Brooks Jensen on Authorship Boundaries\n\nBrooks Jensen framed AI use in photography as a series of authorship choices rather than one universal threshold. The relationship among source material, automated enhancement, generation, editing, and human decisions affects what a creator can accurately claim about the final work.\n\nThe point is philosophical commentary, not legal advice, but it connects directly to provenance and disclosure in media production.\n\n**Source:** [Brooks Jensen \u2014 July 20 discussion](https://www.lenswork.com/indexhome.html) \u00b7 author commentary\n\n### Tony Doe on Accessibility and Permission\n\nTony Doe explained that open RSS feeds make audio and video easy to distribute, discover, and measure. The same accessibility also makes large-scale automated retrieval easier.\n\nPublic discoverability does not establish training permission, licensing, consent, or ownership. RSS infrastructure maps and distributes material; it does not settle the rights attached to that material.\n\n**Source:** [Tony Doe \u2014 July 22 discussion](https://rss.com/podcasts/into-the-podverse-innovation-challenges-opportunities/3012821/) \u00b7 practitioner commentary and episode notes\n\n---\n\n## Common Threads\n\n### Unified Multimodal Models Are Becoming Production Layers\n\nFLUX 3 presents one backbone across image, video, and audio with an action extension, while Qwen\u2019s coordinated image and audio releases cover adjacent production tasks. The emerging unit is larger than one asset generator: it is a learned layer that can carry context among picture, motion, sound, and system actions. Unified architecture, however, does not establish consistent quality across every mode.\n\n**Source basis:** [FLUX 3 announcement](https://bfl.ai/blog/flux-3) \u00b7 [Qwen-Audio-3.0](https://www.alibabacloud.com/blog/qwen-audio-3-0-tts-more-multilingual-easier-to-direct_603379) \u00b7 [Qwen-Image-3.0](https://www.alibabacloud.com/blog/qwen-image-3-0-rich-content-authentic-details-deep-knowledge_603385)\n\n### References and Revision Are Replacing One-Shot Prompting\n\nFLUX 3 accepts images, video, and keyframes and can continue existing video and audio. ElevenMusic can take a reference recording, reusable vocal identity, or private style model. Qwen-Image-3.0 focuses on dense structures and editing, while ShotPlan separates transitions and camera movement into defined controls. Production usefulness is increasingly tied to repeatability and targeted correction rather than one first result.\n\n**Source basis:** [FLUX 3](https://bfl.ai/blog/flux-3) \u00b7 [ElevenMusic References](https://elevenlabs.io/blog/introducing-references-sound-control-for-music-v2) \u00b7 [Qwen-Image-3.0](https://www.alibabacloud.com/blog/qwen-image-3-0-rich-content-authentic-details-deep-knowledge_603385) \u00b7 [ShotPlan](https://arxiv.org/abs/2607.17675)\n\n### Routing Is Moving Behind the Production Interface\n\nRunway Media Router selects models according to reusable cost, latency, or quality policies. Luma\u2019s AMD migration shows that hardware choice can also move behind the service. The visible production tool may stay the same while model and accelerator decisions change underneath it.\n\n**Source basis:** [Runway Media Router](https://runwayml.com/news/company-news/introducing-runway-media-router) \u00b7 [Luma infrastructure announcement](https://lumalabs.ai/news/luma-runs-production-inference-on-amd-and-tensorwave)\n\n### Audio Is Becoming Picture-Aware and More Controllable\n\nFLUX 3 generates video with native audio, Sonilo uses visible events as the timing structure for effects, Qwen-Audio adds delivery direction and multilingual speech, and ElevenMusic uses references and reusable identities. Audio generation is moving closer to picture timing, localization, recurring identity, and edit-oriented control.\n\n**Source basis:** [FLUX 3](https://bfl.ai/blog/flux-3) \u00b7 [Sonilo](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html) \u00b7 [Qwen-Audio-3.0](https://www.alibabacloud.com/blog/qwen-audio-3-0-tts-more-multilingual-easier-to-direct_603379) \u00b7 [ElevenMusic Vocals](https://elevenlabs.io/blog/introducing-vocals-a-consistent-voice-for-your-elevenmusic-songs)\n\n### Launch Velocity Is Outrunning Public Evidence\n\nFLUX 3 entered gated access without many production specifications or an independent test. Qwen-Image-3.0 arrived with extensive examples but no blind benchmark or model card. SANA-Video 2.0 and ShotPlan published author evaluations without external replication of their latest results. Faster release cycles make status and evidence quality part of the story, not a footnote.\n\n**Source basis:** [Independent FLUX 3 reporting](https://venturebeat.com/technology/black-forest-labs-launches-flux-3-capable-of-generating-images-and-20-second-video-with-audio-but-in-limited-release-to-start) \u00b7 [Qwen-Image-3.0 reporting](https://decrypt.co/374084/alibaba-qwen-image-3-ai-useful-not-just-pretty) \u00b7 [SANA-Video 2.0](https://arxiv.org/abs/2607.21553) \u00b7 [ShotPlan](https://arxiv.org/abs/2607.17675)\n\n### Rights and Provenance Remain Separate From Accessibility\n\nElevenMusic\u2019s upload screening can detect some recorded matches, but it cannot prove every right or consent. Tony Doe\u2019s RSS discussion makes the parallel point that public discoverability does not grant training permission. Routers add another provenance need because a final asset may not reveal which model handled it. Access, permission, ownership, and traceability remain separate questions.\n\n**Source basis:** [ElevenMusic References](https://elevenlabs.io/blog/introducing-references-sound-control-for-music-v2) \u00b7 [Tony Doe discussion](https://rss.com/podcasts/into-the-podverse-innovation-challenges-opportunities/3012821/) \u00b7 [Runway router documentation](https://docs.dev.runwayml.com/model-routers/configuration/)\n\n---\n\n## Novel Ideas Worth Watching\n\n### The Multimodal Backbone as a Production Layer\n\nThe most consequential FLUX 3 claim is not simply longer video. It is the possibility that stills, motion, sound, and actions share enough representation to remain connected across more of a production sequence. That could make the model layer resemble production infrastructure rather than a collection of separate generators, but the current release does not yet demonstrate the complete claim.\n\n**Source:** [FLUX 3 announcement](https://bfl.ai/blog/flux-3)\n\n### Video as the Timing Foundation for Sound\n\nSonilo starts with the edit itself. Visible movement and scene timing become the structure for generated effects, with text serving as additional direction. This reverses the usual text-first frame and treats picture as the timing document.\n\n**Source:** [Sonilo launch announcement](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html)\n\n### Model Routing as Editorial Policy\n\nA routing rule can encode different priorities for a low-cost preview, a fast review result, or a quality-focused final. In that sense, infrastructure begins to express editorial intent. The unresolved requirement is a durable record of which model was selected and why.\n\n**Source:** [Runway Media Router](https://runwayml.com/news/company-news/introducing-runway-media-router) \u00b7 [Configuration documentation](https://docs.dev.runwayml.com/model-routers/configuration/)\n\n### Verification Over Raw Scale\n\nEiso Kant\u2019s emphasis on persistence, checking, backtracking, and avoiding premature completion offers a useful frame for media agents. A smaller system that verifies timecodes, filenames, frame sizes, sources, and delivery state may be more dependable than a larger system that stops after a plausible first pass. This is a practitioner hypothesis, not a controlled media study.\n\n**Source:** [Eiso Kant \u2014 July 23 discussion](https://www.latent.space/p/poolside)\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 9: Turn Recurring Review Criteria Into a Reusable Checklist\n\nWeek 8 separated drafting from review. Week 9 makes the review pass repeatable by moving recurring criteria out of memory and into a checklist.\n\nFor an AV task:\n\n1. **Collect recurring checks.** Pull the items that recur across edit notes, captions, metadata, equipment briefs, graphics, and delivery records.\n2. **Write each item as a yes-or-no question.** \u201cAre all timecodes in the required format?\u201d is easier to verify than \u201cCheck formatting.\u201d\n3. **Require evidence.** Add a field for the source link, file location, timecode, or specification that supports each answer.\n4. **Separate fact types.** Mark whether evidence comes from a vendor, author, customer, or independent test.\n5. **Define stop conditions.** Missing source files, mismatched durations, uncertain rights, or absent approval remain open findings rather than assumed passes.\n6. **Save and version the checklist.** Reuse the same baseline, then add project-specific checks without removing the core review criteria.\n\nA reusable starting point:\n\n```text\nReview checklist\n\nFacts and sources\n- Names, dates, numbers, timecodes, and links verified?\n- Vendor, author, customer, and independent claims labeled correctly?\n- Unknowns and unavailable features stated clearly?\n\nPreservation\n- Required wording, timing, dimensions, channels, and file names unchanged?\n- Source assets and approved versions identified?\n\nStructure and delivery\n- Every required section and file present?\n- Format, destination, and deadline requirements met?\n\nAudience and approval\n- Language and examples fit the audience?\n- Rights, consent, and provenance questions recorded?\n- Human approval captured before release?\n```\n\nThe checklist does not replace judgment. It makes the repeated parts of judgment visible, reviewable, and easier to apply consistently.\n\nNext week, Back to Basics Week 10: **Test the checklist against a finished task.**\n\n---\n\n## Sources\n\n1. [FLUX 3 developer announcement](https://bfl.ai/blog/flux-3) \u2014 July 23, 2026 \u2014 architecture, announced capabilities, gated access, roadmap, preliminary vendor comparisons, and undisclosed specifications\n2. [Independent FLUX 3 launch reporting](https://venturebeat.com/technology/black-forest-labs-launches-flux-3-capable-of-generating-images-and-20-second-video-with-audio-but-in-limited-release-to-start) \u2014 July 23, 2026 \u2014 independent confirmation of launch status and omissions; not a hands-on output test\n3. [Qwen-Audio-3.0 announcement](https://www.alibabacloud.com/blog/qwen-audio-3-0-tts-more-multilingual-easier-to-direct_603379) \u2014 July 21, 2026 \u2014 variants, languages, direction controls, cloning, duration, rollout, and hosted availability\n4. [Artificial Analysis voice leaderboard](https://artificialanalysis.ai/text-to-speech/leaderboard/provider-voice) \u2014 accessed July 27, 2026 \u2014 independent Elo snapshot, uncertainty range, and sample count\n5. [Runway \u2014 Media Router](https://runwayml.com/news/company-news/introducing-runway-media-router) \u2014 July 23, 2026 \u2014 routing preferences, availability, pricing policy, and vendor framing\n6. [Runway router documentation](https://docs.dev.runwayml.com/model-routers/configuration/) \u2014 accessed July 27, 2026 \u2014 configuration controls, allowlists, denylists, ceilings, IDs, versioning, realized costs, and dry runs\n7. [TechCrunch \u2014 Media Router reporting](https://techcrunch.com/2026/07/23/runway-bets-on-ai-model-routing-as-generative-media-gets-crowded/) \u2014 July 23, 2026 \u2014 independent launch context and qualification of internal quality scoring\n8. [Sonilo launch announcement](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html) \u2014 July 21, 2026 \u2014 vendor capabilities, video duration, text mode, formats, pricing, and launch availability\n9. [Sonilo API documentation](https://fal.ai/models/sonilo/v1.1/video-to-sound-effects/llms.txt) \u2014 accessed July 27, 2026 \u2014 endpoint version, video-conditioned generation, prompt direction, and current API details\n10. [Qwen-Image-3.0 announcement](https://www.alibabacloud.com/blog/qwen-image-3-0-rich-content-authentic-details-deep-knowledge_603385) \u2014 July 22, 2026 \u2014 prompt length, small-text and language claims, layouts, editing, retrieval, and availability\n11. [Decrypt \u2014 Qwen-Image-3.0 reporting](https://decrypt.co/374084/alibaba-qwen-image-3-ai-useful-not-just-pretty) \u2014 July 22, 2026 \u2014 independent launch context and production-layout framing; not a blind benchmark\n12. [ElevenMusic References announcement](https://elevenlabs.io/blog/introducing-references-sound-control-for-music-v2) \u2014 July 23, 2026 \u2014 reference duration, style and instrumentation guidance, prompt pairing, availability, and vendor screening claim\n13. [ElevenMusic Vocals announcement](https://elevenlabs.io/blog/introducing-vocals-a-consistent-voice-for-your-elevenmusic-songs) \u2014 July 22, 2026 \u2014 reusable vocal identities, supplied recordings, service library, styles, and vendor screening claim\n14. [Music Finetunes documentation](https://elevenlabs.io/docs/eleven-creative/products/music/finetunes.mdx) \u2014 accessed July 27, 2026 \u2014 private style-model workflow, upload count, per-track duration, total-duration limit, and plan-credit access\n15. [Cosmos3-Super Image2Video 4Step model page](https://huggingface.co/nvidia/Cosmos3-Super-Image2Video-4Step) \u2014 July 20, 2026 \u2014 open-weight status, 64-billion-parameter scale, four-step design, output options, vendor acceleration claim, and hardware profile\n16. [Artificial Analysis image-to-video leaderboard](https://artificialanalysis.ai/video/leaderboard/image-to-video?audio-output=false&open-weights=true) \u2014 accessed July 27, 2026 \u2014 independent open-weight preference snapshot and filtered ranking\n17. [SANA-Video 2.0 paper](https://arxiv.org/abs/2607.21553) \u2014 July 23, 2026 \u2014 architecture, model sizes, attention mix, author-reported speed, hardware, and comparison\n18. [SANA-Video 2.0 project page](https://nvlabs.github.io/Sana/Video2/) \u2014 accessed July 27, 2026 \u2014 project status and release materials\n19. [ShotPlan paper](https://arxiv.org/abs/2607.17675) \u2014 July 20, 2026 \u2014 planning controls, training setup, and author-reported timing accuracy\n20. [ShotPlan repository](https://github.com/Pensioner-11/ShotPlan) \u2014 accessed July 27, 2026 \u2014 code, weights, license, public-data terms, and repository details\n21. [Luma infrastructure announcement](https://lumalabs.ai/news/luma-runs-production-inference-on-amd-and-tensorwave) \u2014 July 22, 2026 \u2014 company-reported AMD migration, GPU count, served products, and staffing claim\n22. [Google \u2014 Gemini Flash variants](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u2014 July 21, 2026 \u2014 model lineup, positioning, multimodal agent use, and differing access\n23. [Runway \u2014 AI Media Report](https://runway.com/news/company-news/ai-media-report) \u2014 July 20, 2026 \u2014 anonymized customer-reported adoption claims; vendor-published, self-selected, and unaudited\n24. [Eiso Kant \u2014 July 23 discussion](https://www.latent.space/p/poolside) \u2014 July 23, 2026 \u2014 practitioner account of experiment infrastructure, company-reported scale, verification behavior, and continuing human responsibility\n25. [Chris Benson \u2014 July 23 discussion](https://practicalai.show/365) \u2014 July 23, 2026 \u2014 practitioner commentary on long-running agent economics, machine-facing interfaces, identity, permissions, and resource controls\n26. [Brooks Jensen \u2014 July 20 discussion](https://www.lenswork.com/indexhome.html) \u2014 July 20, 2026 \u2014 author commentary on AI use, source material, automation, editing, and authorship boundaries\n27. [Tony Doe \u2014 July 22 discussion](https://rss.com/podcasts/into-the-podverse-innovation-challenges-opportunities/3012821/) \u2014 July 22, 2026 \u2014 practitioner commentary on RSS distribution, discoverability, measurement, retrieval, and unresolved rights\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";

    const EDITION_SIMPLIFIED = "# The AVS AI Dispatch \u2014 Week of July 24, 2026\n\n> **FLUX 3 proposes one backbone for image, video, audio, and action, but its ambition is ahead of its current access and evidence.** Video and Action are gated, Image and developer access are still coming, and basic production specifications remain unpublished. Qwen added directed voice and structured-image systems, Runway launched model routing, Sonilo tied effects to picture timing, and ElevenMusic expanded reference-driven control.\n\n---\n\n## The Big Story\n\n### FLUX 3: One Backbone, Narrow Current Access\n\nFLUX 3 was announced on July 23 as a jointly trained backbone across image, video, and audio, extended toward action prediction. The goal is one learned foundation that can generate and revise still images, motion, sound, and actions.\n\nOnly part of that plan is available:\n\n- **Video:** gated early access\n- **Action:** gated early access for selected research and commercial partners\n- **Image:** promised in the following weeks\n- **API access and private weights:** planned for later, with no public dates\n- **FLUX 3 Dev open weights:** planned for later in 2026, with no published license\n\nFLUX 3 Video can generate up to **20 seconds** with native audio. It accepts text, images, video, and keyframes and supports text-to-video, image-to-video, video-to-video, keyframe transitions, and continuation of both video and audio.\n\nThe developer also claims multilingual dialogue, typography, animated design, and chaining across multiple shots. The announced scope therefore extends beyond a single silent clip toward a sequence in which picture and sound remain connected.\n\nThe preliminary comparisons need careful qualification. They used **early-checkpoint 10-second, 720p clips with audio**. FLUX 3 was preferred over Luma Ray 3.2 in **93%** of comparisons, Runway Gen-4.5 in **77%**, Grok Imagine Video in **69%**, Kling v3 Pro in **60%**, Happy Horse v1 in **59%**, Happy Horse 1.1 in **57%**, and Seedance 2.0 and Gemini Omni Flash in **52%** each.\n\nNo sample size, prompt set, rater details, confidence intervals, randomization procedure, or separate picture and audio scores were published. A **52% result may be a tie**, and there is no published evidence that the tested checkpoint matches the gated system.\n\nThere is also **no public pricing, license, parameter count, hardware profile, service-level agreement, maximum resolution, output-format specification, reference limit, or independent hands-on test**.\n\nThe important story is the gap: FLUX 3 describes one image, video, audio, and action production layer, while current access, specifications, and evidence cover only a narrow part of that ambition.\n\n**Source:** [FLUX 3 developer announcement](https://bfl.ai/blog/flux-3) \u00b7 [Independent launch reporting](https://venturebeat.com/technology/black-forest-labs-launches-flux-3-capable-of-generating-images-and-20-second-video-with-audio-but-in-limited-release-to-start) \u00b7 July 23, 2026\n\n---\n\n## Other Stories\n\n### Qwen-Audio-3.0\n\nQwen-Audio-3.0-TTS launched in Flash and Plus variants. Flash targets lower latency; Plus prioritizes quality.\n\nThe hosted service supports:\n\n- **16 languages**\n- Natural-language delivery direction\n- Inline nonverbal tags\n- Voice cloning from imperfect references\n- Up to **three minutes per pass**\n\nAn independent leaderboard snapshot placed Plus at **1,234 Elo \u00b116 from 1,517 samples**, effectively tied with Simba 3.2 in that evaluation. The result does not cover every language or production setting.\n\nAccess is through the hosted Model Studio API; no weights were released. Full language coverage and 48kHz support were still rolling out.\n\n**Source:** [Qwen announcement](https://www.alibabacloud.com/blog/qwen-audio-3-0-tts-more-multilingual-easier-to-direct_603379) \u00b7 July 21 \u00b7 [Independent leaderboard](https://artificialanalysis.ai/text-to-speech/leaderboard/provider-voice) \u00b7 accessed July 27\n\n### Runway Media Router\n\nRunway Media Router selects an image, video, or audio model according to one preference: **cost, latency, or quality**.\n\nConfigurations can include model allowlists or denylists, credit ceilings, fixed configuration IDs, version history, realized costs, and dry runs. There is no routing surcharge; the selected model\u2019s rate applies.\n\nThe quality scores and selection method are internal. Reproducibility still depends on recording the selected model, router version, and active policy.\n\n**Source:** [Runway announcement](https://runwayml.com/news/company-news/introducing-runway-media-router) \u00b7 [Documentation](https://docs.dev.runwayml.com/model-routers/configuration/) \u00b7 [Independent reporting](https://techcrunch.com/2026/07/23/runway-bets-on-ai-model-routing-as-generative-media-gets-crowded/) \u00b7 July 23\n\n### Sonilo Sound Effects 1.0\n\nSonilo generates a synchronized sound-effects track from up to **three minutes of video**, using picture as the event and timing guide. An optional prompt adds direction. A separate text mode generates **one to 180 seconds** of sound.\n\nOutput formats are AAC, MP3, WAV, and FLAC. Pricing is **$0.009 per second** for video-conditioned generation and **$0.0018 per second** for text-only generation.\n\nThe launch calls the model 1.0 while current endpoints use v1.1. No independent synchronization benchmark or published methodology was available.\n\n**Source:** [Launch announcement](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html) \u00b7 [API documentation](https://fal.ai/models/sonilo/v1.1/video-to-sound-effects/llms.txt) \u00b7 July 21\n\n### Qwen-Image-3.0\n\nQwen-Image-3.0 targets structured material as well as standalone images. The developer claims:\n\n- Prompts up to **4,500 tokens**\n- Text down to **10 pixels**\n- **12 languages**\n- Dense multi-panel layouts, formulas, and user-interface mockups\n- Editing and optional retrieval\n\nThe model is available in Qwen Chat, while API access remained limited or trial-based. No public weights, parameter count, license, model card, blind benchmark, latency profile, or stable API contract accompanied the examples.\n\n**Source:** [Qwen announcement](https://www.alibabacloud.com/blog/qwen-image-3-0-rich-content-authentic-details-deep-knowledge_603385) \u00b7 [Independent launch reporting](https://decrypt.co/374084/alibaba-qwen-image-3-ai-useful-not-just-pretty) \u00b7 July 21\u201322\n\n### ElevenMusic References, Vocals, and Finetunes\n\n**References** uses **10 seconds to five minutes** of audio to guide style, instrumentation, and feel. **Vocals** creates a reusable singing identity from supplied recordings or uses a voice from the service\u2019s library.\n\n**Finetunes** creates a private style model. Current documentation allows up to **50 tracks**, each 10 seconds to 10 minutes long, with 250 minutes of total audio.\n\nThe developer says uploads are checked for recorded matches. That screening is a vendor safeguard, not proof of ownership or performer consent.\n\n**Source:** [References announcement](https://elevenlabs.io/blog/introducing-references-sound-control-for-music-v2) \u00b7 [Vocals announcement](https://elevenlabs.io/blog/introducing-vocals-a-consistent-voice-for-your-elevenmusic-songs) \u00b7 [Finetunes documentation](https://elevenlabs.io/docs/eleven-creative/products/music/finetunes.mdx) \u00b7 July 22\u201323\n\n---\n\n## Quick Hits\n\n- **Cosmos3-Super Image2Video 4Step** is a 64-billion-parameter open-weight model. An independent snapshot placed it around **1,271 Elo** at the top of the filtered open-weight image-to-video list without audio. Its acceleration claim is vendor-measured, and published testing centers on data-center or professional GPUs. [Model](https://huggingface.co/nvidia/Cosmos3-Super-Image2Video-4Step) \u00b7 [Leaderboard](https://artificialanalysis.ai/video/leaderboard/image-to-video?audio-output=false&open-weights=true) \u00b7 July 20\n- **SANA-Video 2.0** reports five seconds of 720p video in 13.06 seconds on one H100. The comparison is author-run, has no independent replication, and the new weights were not available during the scan. [Paper](https://arxiv.org/abs/2607.21553) \u00b7 [Project](https://nvlabs.github.io/Sana/Video2/) \u00b7 July 23\u201324\n- **ShotPlan** uses planning tokens for hard cuts, soft transitions, and local camera movement. The authors report hard-cut timing error below one frame; the evaluation has not been independently replicated. [Paper](https://arxiv.org/abs/2607.17675) \u00b7 [Repository](https://github.com/Pensioner-11/ShotPlan) \u00b7 July 20\n- **Luma moved production inference to AMD and TensorWave infrastructure.** The company says thousands of MI325X GPUs now serve its products. No independent throughput, cost, power, or quality audit was published. [Source](https://lumalabs.ai/news/luma-runs-production-inference-on-amd-and-tensorwave) \u00b7 July 22\n- **Gemini Flash variants** target agent execution, throughput, and security. Their AV relevance is in multimodal understanding, logging, metadata, quality checks, and production-system operation\u2014not native media generation. Access differs by variant. [Source](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Runway\u2019s AI Media Report** cites 800\u20131,000 ads from a five-person team, 46,000 saved hours, approximately 8,000 property videos, and 210 products per day. These are anonymized, self-selected, unaudited customer claims without shared definitions, controls, failure rates, or full methodology. [Source](https://runway.com/news/company-news/ai-media-report) \u00b7 July 20\n\n---\n\n## Voices This Week\n\n- **Eiso Kant** said persistence, verification, backtracking, and avoiding premature completion may matter more to practical system gains than model scale alone. He kept people responsible for ideas and debugging. This is practitioner interpretation, not a controlled media study. [July 23 discussion](https://www.latent.space/p/poolside)\n- **Chris Benson** observed that machine-facing agent connections make identity, permissions, resource controls, and recovery part of the product. The point applies to media systems that connect scheduling, assets, rendering, quality checks, and publishing without a person navigating every screen. [July 23 discussion](https://practicalai.show/365)\n- **Brooks Jensen** described AI authorship as a set of choices about source material, generation, enhancement, editing, and human decisions\u2014not one universal boundary. His comments are philosophical, not legal analysis. [July 20 discussion](https://www.lenswork.com/indexhome.html)\n- **Tony Doe** noted that open RSS feeds make media easy to distribute and discover, while also making automated retrieval easier. Public accessibility does not settle training permission, licensing, consent, or ownership. [July 22 discussion](https://rss.com/podcasts/into-the-podverse-innovation-challenges-opportunities/3012821/)\n\n---\n\n## Common Threads\n\n### One Model Is Absorbing More Modalities\n\nFLUX 3 joins picture, motion, sound, and action in one architectural claim. Qwen\u2019s coordinated audio and image launches cover adjacent parts of the same production sequence. One architecture does not guarantee equal quality in every mode.\n\n### References and Revision Are Replacing One-Shot Prompting\n\nFLUX 3 uses images, video, and keyframes. ElevenMusic uses reference recordings, reusable vocals, and finetunes. Qwen-Image-3.0 and ShotPlan add more defined structure and correction.\n\n### Routing Is Moving Behind Infrastructure\n\nRunway turns model selection into a cost, latency, or quality policy. Luma\u2019s migration shows that accelerator choice can also change underneath a stable service.\n\n### Audio Is Becoming Picture-Aware and Controllable\n\nFLUX 3 joins native audio to video, Sonilo derives timing from picture, Qwen-Audio directs speech delivery, and ElevenMusic carries reference-based identity.\n\n### Release Pace Is Outrunning Evidence\n\nFLUX 3, Qwen-Image-3.0, SANA-Video 2.0, and ShotPlan all arrived with meaningful claims and incomplete independent evaluation. Availability status and evidence type are becoming as important as the feature list.\n\n### Accessibility Does Not Settle Rights or Provenance\n\nUpload screening does not prove permission. Public feeds do not grant training rights. Router provenance still depends on recording which model handled an asset.\n\n**Source basis:** [FLUX 3](https://bfl.ai/blog/flux-3) \u00b7 [Runway Media Router](https://runwayml.com/news/company-news/introducing-runway-media-router) \u00b7 [Sonilo](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html) \u00b7 [ElevenMusic References](https://elevenlabs.io/blog/introducing-references-sound-control-for-music-v2) \u00b7 [Tony Doe discussion](https://rss.com/podcasts/into-the-podverse-innovation-challenges-opportunities/3012821/)\n\n---\n\n## Novel Ideas Worth Watching\n\n- **A multimodal backbone as a production layer:** FLUX 3\u2019s larger claim is that stills, motion, sound, and actions can share context across more of a production sequence. Current access does not yet demonstrate the complete claim. [Source](https://bfl.ai/blog/flux-3)\n- **Video as sound timing:** Sonilo treats visible events and edit timing as the foundation for generated effects, with text as added direction. [Source](https://www.prnewswire.com/news-releases/sonilo-and-fal-launch-sound-effects-1-0-for-realistic-sound-effects-from-video-and-text-302830490.html)\n- **Model routing as editorial policy:** different routing rules can represent the priorities of a preview, review copy, or final. A model-and-version record remains necessary. [Source](https://docs.dev.runwayml.com/model-routers/configuration/)\n- **Verification over raw scale:** Eiso Kant\u2019s emphasis on persistence, checking, and backtracking suggests that dependable completion behavior may matter more than a larger model that stops at a plausible first answer. This remains a practitioner hypothesis. [Source](https://www.latent.space/p/poolside)\n\n---\n\n## Tip of the Week\n\n### Back to Basics, Week 9: Turn Recurring Review Criteria Into a Reusable Checklist\n\nMove repeated review criteria out of memory and into one reusable checklist.\n\n1. Gather the checks that recur across captions, edit notes, metadata, graphics, equipment briefs, and delivery records.\n2. Write each check as a yes-or-no question.\n3. Add a field for evidence: source link, file location, timecode, or specification.\n4. Label vendor, author, customer, and independent evidence correctly.\n5. Record missing inputs, uncertain rights, and absent approvals as open findings.\n6. Save a baseline version and add project-specific checks without removing the core list.\n\nA compact checklist can cover:\n\n- Facts, names, dates, numbers, timecodes, and links\n- Required wording, dimensions, channels, file names, and sections\n- Unknowns, unavailable features, and evidence limits\n- Audience fit, rights, consent, provenance, and human approval\n\nThe result is a visible review record rather than a pass based on memory.\n\nNext week, Back to Basics Week 10: **Test the checklist against a finished task.**\n\n---\n\n*The AVS AI Dispatch is a weekly AI digest for the Audio/Video Services team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
