    const EDITION_MD = "# Signal & Scale \u2014 Week of July 27, 2026\n\n> **Ads inside AI search stopped being an experiment this week \u2014 Alphabet cited them to investors as revenue drivers.** Search grew 17% to $63.3 billion with AI Max out of beta at 500,000 advertisers, while independent data showed the advertisers buying AI Mode placements almost never appear among the answers' cited sources. Meanwhile, the EU's AI-content labeling deadline arrives August 2 with fines up to 3% of worldwide turnover, ChatGPT Ads shipped the toolkit of a real performance channel, Similarweb documented a fragmenting assistant market where ChatGPT's share fell to roughly half, and a WARC study located the AI creative problem in the brief, not the model.\n\n---\n\n## This Week in Marketing AI\n\n### Alphabet Q2: Ads Inside AI Search Are Now a Disclosed Revenue Line\n\nAlphabet reported second-quarter 2026 results on July 22: revenue of $119.8 billion, up 24%, with Google advertising up 14% to $81.6 billion. Search advertising grew 17% to $63.3 billion. The Google Network line \u2014 AdSense, AdMob, Ad Manager, the open-web share \u2014 fell 1% to $7.3 billion, its latest quarter of contraction while Search added $9.1 billion year over year.\n\nThe marketing-relevant shift is where that Search growth is coming from. AI Mode has passed one billion monthly active users since expanding globally in October 2025, and Google is now monetizing the conversational surface directly. Chief business officer Philipp Schindler walked investors through three formats: text ads with contextual sitelinks generated from the conversation, Direct Offers (the January pilot with Chewy, Gap, and L'Or\u00e9al, with IHG Hotels & Resorts coming next to surface deals during trip planning), and Highlighted Answers \u2014 \"our latest experience placing clearly marked sponsored links inside list responses.\" Those formats debuted at Google Marketing Live on May 20 and appeared on an earnings call as monetization drivers nine weeks later.\n\nAI Max, the campaign type that matches ads to conversational queries, is out of beta with more than 500,000 advertisers. Google says advertisers using AI Max or Performance Max see an average 15% more conversions or conversion value at similar ROAS \u2014 a company-reported figure worth holding loosely: independent tests published in November 2025 found AI Max produced a *higher* cost per conversion than broad, phrase, and exact match inside identical campaigns, and that discrepancy has not been publicly resolved. Dynamic Search Ads retire in September with automatic upgrades into AI Max, making the AI format default infrastructure rather than an opt-in.\n\nOne more data point belongs next to this story. An SE Ranking analysis covered by Search Engine Journal in July found AI Mode returned a text ad on 29% of tested commercial keywords \u2014 and for those keywords, the advertiser's domain appeared among the sources the AI answer actually cited only 11% of the time (the exact URL, 1.95%). The keyword set was preselected to trigger ads and SE Ranking sells AI-visibility tracking, so treat the percentages as directional. The direction, though, is clear: paid placement in AI search, organic citations, and classic rankings are behaving like three separate surfaces. Buying one does not buy the others.\n\n**Source:** [PPC Land earnings analysis](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 [Search Engine Land](https://searchengineland.com/google-ai-max-billions-new-monetizable-searches-483347) \u00b7 [Alphabet Q2 2026 call](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx) \u00b7 [SE Ranking via Search Engine Journal](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u00b7 July 22, 2026\n\n### August 2 Is a Hard Deadline: AI-Content Labeling Gets Real Fines\n\nOn July 20, the European Commission published its implementation guidelines for Article 50 of the EU AI Act (Communication C(2026) 5054 final) alongside a finalized Code of Practice on Transparency of AI-Generated Content. Article 50 \u2014 the transparency obligation covering synthetic media \u2014 becomes applicable on **August 2, 2026**, with fines up to \u20ac15 million or 3% of total worldwide annual turnover, whichever is higher. Google announced on July 24 that it is signing the Code.\n\nTwo details matter most for marketers. First, **the artistic carve-out does not cover advertising**: Commission guidance explicitly lists an AI-manipulated video using synthetic humans to sell a product as content that does not qualify as an artistic work. A synthetic spokesperson in an ad needs the full label. Second, assistive editing is exempt \u2014 retouching, color work, cropping, and edits that do not substantially alter the content's meaning stay outside the regime.\n\nThe EU deadline is one layer of a stack. New York's synthetic performer disclosure law has been in force since June 9 ($1,000 first violation, $5,000 after; audio ads exempt). India's intermediary rules have applied since February 20, using loss of platform safe-harbour rather than fines. California's SB 942/AB 853 were deliberately synced to the EU's August 2 date. A brand running one AI-assisted campaign across those markets now answers overlapping, non-identical disclosure tests in the same quarter.\n\nPlatform plumbing arrived in pieces all month: Google shipped an AI label setting across five ads products on July 9, added synthetic-content attestation structures to the Google Ads API on June 24 and to the Display & Video 360 API on July 23, and on July 22 revised its own ads policy so AI-disclosure labels would not violate the existing prohibition on text overlays in Search image assets. Every regime and every platform tool converges on the same allocation: the disclosure duty \u2014 and the liability \u2014 sits with the advertiser, not the platform. Google's own documentation states that using its label setting does not guarantee compliance with any regulation.\n\n**Source:** [PPC Land on the three-regime stack](https://ppc.land/advertisers-face-5-000-new-york-fines-and-3-eu-penalties-over-ai-labels/) \u00b7 [PPC Land on Google signing the Code](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/) \u00b7 July 20\u201324, 2026\n\n### ChatGPT Ads Grows Into a Performance Channel \u2014 With a Dark Auction Underneath\n\nOpenAI rolled out a batch of ChatGPT Ads capabilities over the week that reads like a checklist of what performance marketers were waiting for: conversion-optimized (oCPC) campaigns via a new Conversions objective, geographic exclusions, AppsFlyer and Adjust integrations for app measurement, Automatic Advanced Matching using hashed customer data, an asynchronous bulk Ads API, and product feed cards showing prices and star ratings. Daily budgets also change to seven-day rolling averages with automatic intraday pacing, effective July 27. The platform has come a long way from its February pilot and its original $200,000 minimum commitments; the self-serve Ads Manager has had no minimum spend since May.\n\nThe demand side is arriving faster than the reporting side. Adthena now tracks 7,378 advertisers running in ChatGPT, with tracked placements growing 97-fold in a single quarter \u2014 a small base, but the point is that a surface that carried effectively no advertising a year ago now supports a competitive-intelligence index. Booking.com leads all three tracked markets, and the US accounts for 60.1% of observed advertisers.\n\nWhat advertisers cannot see is the auction. ChatGPT's native Ads Manager reports only an advertiser's own CPC, impressions, and CTR \u2014 no impression share, no auction insights, no competitive view. UK advertisers have watched costs swing between 39% and 278% with no visible explanation; Adthena and dentsu launched a product this week to reconstruct that missing layer externally (three dentsu clients sit among the top nine UK ChatGPT advertisers, for disclosure). The unit of competition is also different: advertisers contest loose, conversational prompt categories rather than enumerable keywords. This auction sits roughly where paid search sat two decades ago \u2014 except spend is arriving at modern scale before the reporting exists.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u00b7 [eMarketer](https://www.emarketer.com/content/chatgpt-ads-shift-clicks-conversions) \u00b7 [PPC Land weekly on Adthena/dentsu](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 20\u201327, 2026\n\n### Similarweb: The Assistant Market Fragments, and Citations Don't Equal Traffic\n\nSimilarweb published its 2026 Generative AI Landscape report this week. Generative AI platforms drew 9.5 billion average monthly web visits over the trailing year, up 70%, with 655 million monthly unique visitors. The share story is the headline: ChatGPT held above 80% of tracked standalone gen-AI web visits through late 2024 and sits just above 50% as of May 2026, with Gemini, Claude, Perplexity, and DeepSeek absorbing the difference \u2014 June snapshots of the same panel put Gemini around 27% and Claude around 9%. Meanwhile 95% of ChatGPT's measured users also used Google properties \u2014 overlap, not exclusivity.\n\nFor anyone doing AI-visibility work, four findings stand out:\n\n- **AI Overviews appeared in 43% of US searches** by Similarweb's measure \u2014 but Adthena's June pulse recorded 18% for the US. Two commercial trackers disagree by more than 2x and neither has published a reconciliation. There is no industry-standard measurement of AI Overview frequency.\n- **ChatGPT's citation rate is climbing fast:** roughly 1.3% of answers carried web citations in June 2025; 6.8% by May 2026. Travel (22.6%) and retail (13.5%) lead. Reviews and user-generated content supply 28.9% of top US citations, news and publishers 26.0%.\n- **Citations and referrals point at different pages.** About 65% of cited URLs sit two or three folders deep in a site, while 58.8% of AI referral traffic lands on homepages \u2014 a split that widened after a May 7 ChatGPT search update. The pages that earn the citation are usually not the pages that receive the click.\n- **The traffic that does arrive converts.** ChatGPT referral traffic converted at 7.1% in Similarweb's clickstream panel \u2014 second only to paid search at 7.8%, ahead of organic, social, email, and display.\n\nAdvertising penetration reached 26% of US desktop ChatGPT chats in June (14% in May), with click-through at 0.50% and compressing as inventory scales. Which still means roughly three-quarters of even the most ad-saturated assistant surface carries no ads at all: most of what an assistant says about a brand remains earned \u2014 a function of what the model retrieves and cites, not what anyone bought. Similarweb's own disclaimer applies throughout: panel-based estimates, not audited measurements.\n\n**Source:** [PPC Land coverage](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u00b7 [Similarweb report](https://www.similarweb.com/corp/reports/2026-generative-ai-landscape/) \u00b7 [June share snapshot](https://fourweekmba.com/ai-chatgpt-gemini-claude-generative-ai-traffic-share-2026/) \u00b7 week of July 20, 2026\n\n### WARC: AI Tripled the Output, Not the Judgment \u2014 and the Constraint Is the Brief\n\nWARC's \"The New Creative Advantage,\" produced with TikTok and LIONS Advisory (published July 14, picked up by trade press July 22), surveyed 400 marketers across the US, UK, Australia, and Brazil who are directly involved in creative production decisions. Ninety percent said AI is now part of the creative toolkit. **88% report higher creative volume since adoption; 45% report a significant quality improvement.** Meanwhile 87% rate their own organization's use of AI as effective \u2014 a self-assessment worth discounting, since respondents are grading output they commissioned and approved.\n\nThe study's sharpest finding is where it locates the problem: the brief. **67% of marketers use demographic data as the primary input when briefing a generative model, while 59% agree demographic segmentation no longer works** \u2014 the same people, running an input they've concluded is broken, at machine speed. Only 17% consistently incorporate community or audience insight beyond demographics. The named obstacles read as symptoms of that input problem: over-reliance on generic visual styles (40%), unpredictable quality (36%), output lacking originality (32%). TikTok's Andy Yang framed it in the foreword: the gap in AI-assisted creativity is \"not a technology gap, it is an intelligence gap.\" (Disclosure: TikTok commissioned research whose conclusion \u2014 marketers need richer cultural signal \u2014 aligns with what TikTok sells. The finding stands on its data; the alignment belongs on the record.)\n\nThe mechanism is worth internalizing. Before generative tools, a thin demographic brief got diluted by the layers between brief and asset \u2014 strategists, creatives, argument. Compressed AI production removes those compensating layers, so the brief travels almost directly to the finished asset. The input quality now matters more than it ever did, at exactly the moment most teams left it unchanged.\n\n**Source:** [PPC Land weekly analysis](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 covered July 22, 2026\n\n### Fractl: Your Buyers Still Call It SEO\n\nFractl released a study on July 21 surveying 343 US marketing decision-makers responsible for AI visibility. **81% still say \"SEO\" when discussing AI search strategy internally.** 19% have adopted \"GEO,\" 15% \"LLM optimization,\" and 10% \"AEO.\" When hunting for an agency or tool, 46% would search \"AI search optimization\" and 24% would search \"SEO\" \u2014 70% combined \u2014 while \"GEO\" captures 12% of searches and \"AEO\" just 3%.\n\nThe buying-behavior findings cut harder than the vocabulary ones. **Heavy buzzword use without clear explanation is the single biggest vendor red flag at 36%**, ahead of missing case studies (21%) and vague performance claims (20%). Case studies outrank terminology fluency as a credibility signal by roughly four to one. Among C-suite buyers specifically, the top red flag is different: 33% cite \"repackaged SEO with AI branding\" \u2014 the question isn't whether a vendor knows the acronyms, it's whether the deck is last year's work with find-and-replace.\n\nAnd the budgets are moving regardless of what anyone calls the work: marketers now route an average of 24% of search or content budgets to AI visibility; 43% spend more than 20%; financial services leads at 39%. (Disclosure: Fractl sells content-marketing and AI-workflow services, so a study concluding buyers distrust jargon-heavy vendors flatters its own positioning. The sample is US-only and modest at 343.)\n\n**Source:** [Fractl study](https://www.frac.tl/ai-search-optimization-language/) \u00b7 [PPC Land coverage](https://ppc.land/marketers-still-call-it-seo-as-81-reject-geo-pitch-fractl-finds/) \u00b7 July 21, 2026\n\n---\n\n## Platform & Tool Watch\n\n- **Google shipped a domain-level opt-out of AI answers.** Search Console's new \"Search generative AI control\" lets site owners exclude their content from AI Overviews, AI Mode, and generative features in Discover \u2014 effective within 1\u20132 days, not a ranking signal, and it does *not* stop model training (that stays with Google-Extended). Born of a UK CMA order; page-level controls arrive March 3, 2027. Context worth weighing before anyone touches the toggle: publishers who blocked AI crawlers have measured persistent traffic declines, paid in lost visibility inside AI answers. [Google documentation](https://support.google.com/webmasters/answer/16908024) \u00b7 [PPC Land](https://ppc.land/google-gives-site-owners-a-toggle-to-exit-ai-overviews-and-ai-mode/) \u00b7 ~July 20\n- **The European Commission fined Google \u20ac890 million under the Digital Markets Act** on July 23; the decision records that Google has submitted proposals on applying self-preferencing principles to AI Overviews and AI Mode, with dialogue continuing and no timeline. How prominence rules reach generative search will shape European visibility more than any single feature change. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 23\n- **Google is testing a Performance Max opt-out of search partner and Display Network inventory**, per Digiday \u2014 practitioners called the control concession \"fairly significant\" given placement opacity was the format's biggest launch-era complaint. Running the other way: Google Ads ended appeals on policy decisions older than six months, and Local Services Ads fold into Google Ads with manual bidding disappearing. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **Gemini 3.6 Flash and 3.5 Flash-Lite launched July 21 with price cuts** \u2014 Flash uses 17% fewer output tokens and Flash-Lite runs $0.30 per million input tokens at 350 tokens/second. Agent workloads are priced per token and run in loops, so agentic marketing products that didn't clear a cost threshold in June may clear it in August unchanged. [Google announcement](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Meta announced the Seller app (July 24)** \u2014 AI writes the Marketplace listing, suggests a price, and tags the item \"in about 30 seconds\" (Meta's claim; no accuracy rate published) \u2014 and will test opening Facebook directly into full-screen video with the Classic Feed demoted to a second tab. Free selfie-verified badges (\"Facebook Verified,\" people only, no brand Pages) roll out July 27. Watch impression mix shift between 4:5 feed and 9:16 Reels formats if the video-first default sticks. And mark the calendar: **Meta reports Q2 earnings Wednesday, July 29** \u2014 the first read on ad performance since these changes started landing. [PPC Land](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u00b7 [Meta IR](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-to-Announce-Second-Quarter-2026-Results/default.aspx) \u00b7 July 24\u201329\n- **Amazon shipped ~10 AI features into Brand+ and Performance+ from July 22** while removing single-deal streaming-TV buying \u2014 AI campaign types gain capability while manual paths narrow, the same consolidation pattern Google is running with AI Max. [PPC Land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u00b7 July 22\u201326\n- **HubSpot opened Agent Hub in public beta** \u2014 a low-code canvas for assembling agents from prompts, knowledge sources, and CRM data. HubSpot itself named the risk to watch: agents deployed in isolation, like a prospecting agent emailing an account the same week a service agent handles that account's open complaint. Custom agents consume HubSpot Credits; pricing beyond that is unstated. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n\n---\n\n## Voices This Week\n\n### Philipp Schindler on AI Search Monetization\n\nGoogle's chief business officer told investors that advertisers adopting AI-powered campaigns \"see an average of 15% more conversions or value on Search at a similar ROAS,\" and described Highlighted Answers as \"clearly marked sponsored links inside list responses.\" Every number he cited is Google-measured; the independent tests that exist point the other way on cost per conversion. Both facts belong in any deck that quotes him.\n\n**Source:** [Alphabet Q2 2026 earnings call](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx) \u00b7 July 22, 2026\n\n### Sundar Pichai on AI Search Traffic\n\nAlphabet's CEO said Google is \"sending billions of clicks to websites every week through AI features in Search.\" Set that against Ahrefs' February finding that AI Overviews correlate with a 58% click-through reduction for top-ranking pages, and publisher case data pointing the same direction. Absolute click volume and per-page click-through can both be true \u2014 which is exactly why traffic claims need denominators before anyone repeats them.\n\n**Source:** [PPC Land earnings analysis](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 July 22, 2026\n\n### Andy Yang on the Intelligence Gap\n\nTikTok's global head of creative and brand ads wrote that the gap opening in AI-assisted creativity is \"not a technology gap, it is an intelligence gap\" \u2014 brands briefing powerful tools with static demographics and legacy assumptions. The commissioning caveat applies (TikTok sells cultural signal), but the frame matches the study's data: the model amplifies whatever the brief contains.\n\n**Source:** [WARC study via PPC Land](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 covered July 22, 2026\n\n### Mark Howard on the Machine Audience\n\nTime's chief operating officer described building for two audiences: humans when they arrive, and AI crawlers as a secondary audience \u2014 including text-based ad products human readers never see, and a stripped-down copy of Time's site served to bots. Cloudflare data puts bots above half of all web traffic, with crawl-to-referral ratios running from 118 crawls per human visit to nearly 50,000. A media product sold on machine citation rather than human impressions has no measurement standard yet; it is also a rational response to where the audience actually is.\n\n**Source:** [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20, 2026\n\n### Sam Clarke on Getting Control Back\n\nThe Crossmedia search lead called Google's test of search-partner and Display Network exclusions in Performance Max \"fairly significant,\" noting the perceived lack of control was among the format's biggest pain points at launch. The countercurrent matters: while platforms automate more of the buy, the features that actually grow advertiser spend keep being the ones that hand back visibility and control.\n\n**Source:** [Digiday reporting via PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20, 2026\n\n---\n\n## Common Threads\n\n### AI Search Is Now a Paid Channel \u2014 and Paid Doesn't Buy Cited\n\nGoogle put revenue numbers behind AI Mode ad formats, OpenAI shipped conversion bidding, and ChatGPT carries 7,378 tracked advertisers. Yet SE Ranking's data shows advertisers buying AI Mode placements appear among the answers' cited sources only 11% of the time, and Similarweb shows roughly three-quarters of US desktop ChatGPT chats still carry no ads. Paid presence, organic citations, and rankings are three separate surfaces that happen to share a screen. Teams that treat AI visibility and AI media as one budget line will mismeasure both.\n\n**Source basis:** [Alphabet Q2](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 [SE Ranking](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u00b7 [Similarweb](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/)\n\n### Production Scaled; Verification Didn't\n\nWARC's respondents produce 88% more creative and can verify quality on 45% of it. The week's agent launches shipped precise throughput numbers \u2014 30 seconds per listing, a first cut in one week instead of twelve \u2014 and no accuracy rates. Attestation API fields record AI declarations no system validates. Across the stack, the generative layer is producing more output than the surrounding organization can evaluate, and vendors publish the variable that's easy to measure.\n\n**Source basis:** [WARC via PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n### Compliance Is Becoming Pre-Flight Documentation\n\nThe labeling regimes, the attestation fields, the certification-gated ad verticals \u2014 each moves the substantive judgment to the party with knowledge (the advertiser) before the campaign runs, while platforms keep enforcement. Disclosure is a weaker instrument than quality control, but it's the one that ships. The practical consequence: asset provenance \u2014 knowing exactly how each creative was assembled \u2014 is quietly becoming a required field in the production workflow.\n\n**Source basis:** [PPC Land on the labeling stack](https://ppc.land/advertisers-face-5-000-new-york-fines-and-3-eu-penalties-over-ai-labels/)\n\n### The Measurement Layer Is Unsettled \u2014 Anchor Accordingly\n\nSimilarweb puts AI Overviews in 43% of US searches; Adthena says 18%. Similarweb shows UK ChatGPT ad penetration above 30% in June; Adthena recorded zero placements across 169,560 UK scrapes the same month. These are not rounding differences \u2014 they are incompatible descriptions of the same market from commercial vendors, unreconciled. Any strategy narrative (or client deck) anchored on a single vendor's panel inherits that uncertainty and should say so.\n\n**Source basis:** [Similarweb report coverage](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/)\n\n### Visibility Is Fragmenting Across Assistants\n\nChatGPT's web share fell from above 80% to roughly half in eighteen months while Gemini and Claude grew \u2014 and Semrush's index finds only 36 of 1,200+ tracked brands hold consistent visibility across all AI platforms. Different assistants draw on different source sets with no shared index underneath. Optimizing for one assistant is a bet on its share; building retrieval-worthy assets generally is the hedge.\n\n**Source basis:** [Similarweb](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u00b7 [Semrush AI Visibility Index via PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n---\n\n## Angles for the Week\n\n*Raw material for posts and POVs \u2014 each grounded in this edition's reporting. Starting points, not finished takes.*\n\n### 1. \"AI search just became a paid channel. Citations are still earned.\"\n\n- **Hook:** Google will now happily sell you a spot inside the AI answer. It will not sell you a citation.\n- **Evidence:** Alphabet cited AI Mode ad formats as revenue drivers (July 22); SE Ranking found advertisers' domains among AI-cited sources just 11% of the time on ad-carrying keywords; 74% of ChatGPT chats carry no ads at all.\n- **Why now:** First earnings call where AI-answer ads were presented to investors as working revenue \u2014 the \"will AI search be monetized?\" debate ended this week. The next debate is paid vs. earned inside the answer, and almost nobody is framing it that way yet.\n\n### 2. \"Your buyers still call it SEO.\"\n\n- **Hook:** The industry renamed the discipline three times before the customer renamed it once.\n- **Evidence:** Fractl (July 21): 81% of marketing decision-makers say \"SEO\" internally; \"AEO\" gets 3% of help-seeking searches; buzzword-heavy pitches are the #1 vendor red flag at 36%; case studies beat acronym fluency 4:1. Meanwhile budgets moved anyway \u2014 24% of search/content spend now goes to AI visibility.\n- **Why now:** Fresh data, and a self-aware angle for a team that uses the AEO label daily: meet buyers in their vocabulary, sell the outcome, save the taxonomy for the methodology section. Naming the tension is what makes the post credible.\n\n### 3. \"AI didn't lower your creative quality. Your brief did.\"\n\n- **Hook:** 88% more creative, 45% better creative \u2014 the 43-point gap is the brief, not the model.\n- **Evidence:** WARC: 67% brief generative AI with demographic data; 59% of the same population says demographic segmentation no longer works; only 17% consistently add community/audience insight. Compressed production removes the human layers that used to compensate for thin briefs.\n- **Why now:** The \"intelligence gap\" frame (Andy Yang) is circulating this week; it maps directly onto workflow-before-technology thinking, with survey numbers to carry it.\n\n### 4. \"Would your ads survive August 2?\"\n\n- **Hook:** In six days, an unlabeled synthetic spokesperson in the EU can cost 3% of worldwide turnover.\n- **Evidence:** Article 50 applicable August 2; advertising explicitly excluded from the artistic carve-out; Google signed the Code July 24 and still points liability at the advertiser; New York has been live since June 9; California syncs to the same date.\n- **Why now:** Hard date. A simple decision-tree post (\"which of your assets need a label?\") is genuinely useful and positions the author as the adult in the room.\n\n### 5. \"Three-quarters of your AI-assistant exposure can't be bought.\"\n\n- **Hook:** Ads now appear in 26% of US desktop ChatGPT chats. The other 74% is decided by what the model retrieves about you.\n- **Evidence:** Similarweb: 26% US desktop ad penetration in June; citation rate 6.8% and climbing; recommended brands get 2\u20134x the follow-on visits of unrecommended competitors; reviews/UGC and news supply the majority of citations.\n- **Why now:** The ad rollout is the news hook; the earned-visibility math is the substance. This is the cleanest quantitative case this week for AI-visibility work as a discipline.\n\n---\n\n## Tip of the Week\n\n### Run a Monthly Three-Assistant Brand Audit\n\nThe visibility market fragmented (ChatGPT ~52%, Gemini ~27%, Claude ~9% of gen-AI web visits), and only 36 of 1,200+ tracked brands show up consistently across platforms. You cannot manage what you've never looked at. Thirty minutes a month covers it:\n\n1. **Write five buying-intent prompts** a real prospect would ask in your category \u2014 not brand searches (\"best X for Y-stage B2B companies,\" \"how should a team like ours handle Z\").\n2. **Run all five in ChatGPT, Gemini, and Claude** (fresh sessions, no memory). Fifteen answers total.\n3. **Log three things per answer:** Is your brand mentioned? What is said about it (and is it accurate)? Which sources are cited?\n4. **Build the citation list.** The domains that keep appearing are the retrieval layer for your category \u2014 those are targets for content placement, digital PR, reviews, and data the models can cite.\n5. **Repeat monthly and diff.** Presence shifts month to month (source sets change, models update); the trend line is the insight. Fifteen minutes of prompting, fifteen of logging.\n\nWhy it works: citation sources are concentrated and discoverable (reviews/UGC 28.9% and news 26.0% of ChatGPT's top citations), assistant answers demonstrably steer visits (recommended brands drew 2\u20134x the follow-on traffic in Similarweb's brand-pair data), and a running log turns \"how do we show up in AI?\" from a vibe into a dataset you can act on \u2014 and show clients.\n\n---\n\n## Sources\n\n1. [PPC Land \u2014 Google Search ads gain 17% to $63.3 billion while network drops 1%](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u2014 July 2026 \u2014 Q2 2026 earnings detail: segment revenue, AI Max adoption, AI Mode formats, agentic commerce, independent-test caveats\n2. [Search Engine Land \u2014 Google says AI Max unlocks billions of new monetizable searches](https://searchengineland.com/google-ai-max-billions-new-monetizable-searches-483347) \u2014 July 2026 \u2014 earnings-call ad-product detail: AI Max out of beta, Highlighted Answers, Direct Offers\n3. [Alphabet \u2014 Q2 2026 Earnings Call](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx) \u2014 July 22, 2026 \u2014 primary source: executive remarks on AI Mode monetization, usage, and click claims\n4. [Search Engine Journal \u2014 Google AI Mode Ads Rarely Match The Sources It Cites](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u2014 July 2026 \u2014 SE Ranking analysis: ads on 29% of tested commercial keywords; 11% domain overlap with cited sources\n5. [PPC Land \u2014 Advertisers face $5,000 New York fines and 3% EU penalties over AI labels](https://ppc.land/advertisers-face-5-000-new-york-fines-and-3-eu-penalties-over-ai-labels/) \u2014 July 2026 \u2014 the three-regime disclosure stack: EU Article 50, New York, India; timelines and penalties\n6. [PPC Land \u2014 Google signs EU AI code as advertisers face 3% turnover fines August 2](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/) \u2014 July 24, 2026 \u2014 Google Code of Practice signing; deadline mechanics\n7. [Search Engine Roundtable \u2014 OpenAI ChatGPT Ads Daily Budget Changes, New Features, API & Ad Formats](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u2014 July 2026 \u2014 ChatGPT Ads feature rundown; July 27 budget change\n8. [eMarketer \u2014 ChatGPT ads shift from clicks to conversions](https://www.emarketer.com/content/chatgpt-ads-shift-clicks-conversions) \u2014 July 2026 \u2014 conversion-bidding context; OpenAI ad-revenue ambitions as reported\n9. [PPC Land \u2014 Marketers brief AI with the demographic data they say no longer works](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u2014 July 27, 2026 \u2014 weekly synthesis covering July 20\u201326: WARC study, Adthena/dentsu, agent launches, Time's machine audience, PMax exclusions, EC fine, Semrush and Fractl context\n10. [PPC Land \u2014 ChatGPT loses web share to Gemini and Claude as ad penetration hits 26%](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u2014 July 2026 \u2014 Similarweb 2026 Generative AI Landscape report detail and measurement conflicts\n11. [Similarweb \u2014 The 2026 Generative AI Landscape Report](https://www.similarweb.com/corp/reports/2026-generative-ai-landscape/) \u2014 July 2026 \u2014 primary report page: headline metrics\n12. [Fractl \u2014 Stop Pitching GEO: Here's the Language Marketing Decision-Makers Use](https://www.frac.tl/ai-search-optimization-language/) \u2014 July 21, 2026 \u2014 primary study: vocabulary, red flags, budget allocation\n13. [PPC Land \u2014 Marketers still call it SEO as 81% reject GEO pitch, Fractl finds](https://ppc.land/marketers-still-call-it-seo-as-81-reject-geo-pitch-fractl-finds/) \u2014 July 2026 \u2014 Fractl study coverage with methodology detail\n14. [Google Search Console Help \u2014 Search generative AI control](https://support.google.com/webmasters/answer/16908024) \u2014 accessed July 27, 2026 \u2014 primary documentation for the AI Overviews/AI Mode opt-out\n15. [PPC Land \u2014 Google gives site owners a toggle to exit AI Overviews and AI Mode](https://ppc.land/google-gives-site-owners-a-toggle-to-exit-ai-overviews-and-ai-mode/) \u2014 July 2026 \u2014 CMA origin, rollout status, page-level control timeline\n16. [Google \u2014 Gemini 3.6 Flash and 3.5 Flash-Lite announcement](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u2014 July 21, 2026 \u2014 model lineup and pricing changes\n17. [PPC Land \u2014 Meta demotes Facebook Feed as free selfie badge rolls out today](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u2014 July 27, 2026 \u2014 Seller app, video-first Facebook test, Facebook Verified\n18. [PPC Land \u2014 Amazon kills single-deal STV buying in Brand+ as 10 AI features land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u2014 July 26, 2026 \u2014 Amazon Brand+/Performance+ AI features from July 22\n19. [Meta \u2014 Q2 2026 earnings announcement](https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-to-Announce-Second-Quarter-2026-Results/default.aspx) \u2014 July 14, 2026 \u2014 earnings date for the week-ahead watch item\n20. [FourWeekMBA \u2014 Generative AI traffic share analysis of Similarweb panel data](https://fourweekmba.com/ai-chatgpt-gemini-claude-generative-ai-traffic-share-2026/) \u2014 July 2026 \u2014 June 2026 share snapshot: ChatGPT ~52\u201353%, Gemini ~27%, Claude ~9.2%\n\n---\n\n*Signal & Scale is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
    const EDITION_SIMPLIFIED = "# Signal & Scale \u2014 Week of July 27, 2026\n\n> **Ads inside AI search became a reported revenue line this week.** Alphabet's Search grew 17% to $63.3B with AI Max out of beta at 500,000 advertisers \u2014 while independent data shows buying an AI Mode ad almost never comes with being cited in the answer. The EU's AI-content labeling deadline hits August 2 with fines up to 3% of turnover, ChatGPT Ads shipped real performance tooling, the assistant market fragmented (ChatGPT down to ~half of gen-AI web visits), and WARC located the AI creative problem in the brief.\n\n---\n\n## The Big Story\n\n### Ads Inside AI Search Are Now Revenue, Not Roadmap\n\nAlphabet reported Q2 2026 on July 22: Search advertising up 17% to $63.3 billion; the open-web Network line down 1% to $7.3 billion.\n\nThe shift for marketers:\n\n- **AI Mode passed 1 billion monthly users** and now carries ads: contextual sitelinks, Direct Offers (Chewy, Gap, L'Or\u00e9al; IHG next), and Highlighted Answers \u2014 sponsored links inside AI list responses.\n- **AI Max is out of beta with 500,000+ advertisers.** Google claims a 15% average lift in conversions/value at similar ROAS \u2014 Google-measured; independent tests in November 2025 found *higher* cost per conversion than standard match types. Unresolved.\n- **Dynamic Search Ads retire in September** with automatic upgrades into AI Max. The AI format becomes the default, not the option.\n- **Paid \u2260 cited:** SE Ranking found AI Mode text ads on 29% of tested commercial keywords, but the advertiser's domain appeared among the answer's cited sources only 11% of the time.\n\nPaid placement, organic citations, and rankings are behaving as three separate surfaces. Budget them separately.\n\n**Source:** [PPC Land](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/) \u00b7 [SE Ranking via SEJ](https://www.searchenginejournal.com/google-ai-mode-shows-ads-on-1-in-3-commercial-keywords/582976/) \u00b7 July 22\n\n---\n\n## Other Stories\n\n### August 2: AI-Content Labels Get Fines\n\nThe European Commission finalized Article 50 guidelines and the transparency Code of Practice on July 20; obligations bind **August 2** with fines up to \u20ac15M or **3% of worldwide turnover**. Advertising is explicitly excluded from the artistic carve-out \u2014 a synthetic spokesperson needs the full label. Assistive editing (retouch, color, crop) is exempt. New York has been live since June 9; California syncs to August 2. Google signed the Code on July 24 \u2014 and its documentation still puts liability on the advertiser.\n\n**Source:** [PPC Land](https://ppc.land/google-signs-eu-ai-code-as-advertisers-face-3-turnover-fines-august-2/) \u00b7 July 20\u201324\n\n### ChatGPT Ads Becomes a Performance Channel\n\nNew this week: conversion-optimized (oCPC) campaigns, geo exclusions, AppsFlyer/Adjust integrations, advanced matching with hashed customer data, bulk API, product cards with prices and ratings. Daily budgets move to 7-day rolling averages July 27. Meanwhile Adthena tracks **7,378 advertisers** in ChatGPT (up 97x in a quarter, small base) \u2014 and the native Ads Manager shows advertisers only their own numbers. UK costs swung 39\u2013278% with no visible cause. Spend is arriving before the reporting exists.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/chatgpt-ads-budget-api-ad-formats-more-41756.html) \u00b7 [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 20\u201327\n\n### Similarweb: Fragmenting Assistants, Citations \u2260 Traffic\n\nFrom the 2026 Generative AI Landscape report: gen-AI platforms drew 9.5B monthly web visits (+70% YoY). **ChatGPT's share fell from >80% to just above 50%; June panel snapshots put Gemini around 27% and Claude around 9%.** ChatGPT's citation rate rose to 6.8% of answers; ads now appear in 26% of US desktop chats \u2014 meaning ~74% of even the most ad-saturated assistant surface is still earned exposure, not bought. Cited pages are deep pages (65% two-plus folders down) while referral traffic lands on homepages (58.8%). Caveats: panel estimates; Adthena's numbers for AI Overview frequency and UK ad penetration conflict with Similarweb's, unreconciled.\n\n**Source:** [PPC Land](https://ppc.land/chatgpt-loses-web-share-to-gemini-and-claude-as-ad-penetration-hits-26/) \u00b7 this week\n\n### WARC: The Brief Is the Bottleneck\n\n400 marketers surveyed: **88% report more creative volume with AI; only 45% report significantly better quality.** 67% brief generative AI primarily with demographic data \u2014 while 59% agree demographic segmentation no longer works. Only 17% consistently add community/audience insight. TikTok's Andy Yang: it's \"not a technology gap, it is an intelligence gap.\" (TikTok co-commissioned the study.)\n\n**Source:** [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 covered July 22\n\n### Fractl: Buyers Still Say \"SEO\"\n\n343 US marketing decision-makers: **81% call AI search work \"SEO\" internally; \"AEO\" gets 3% of help-seeking searches.** Buzzword-heavy pitches are the #1 vendor red flag (36%); case studies beat acronym fluency 4:1. Budgets moved anyway \u2014 an average 24% of search/content spend now goes to AI visibility.\n\n**Source:** [Fractl](https://www.frac.tl/ai-search-optimization-language/) \u00b7 July 21\n\n---\n\n## Platform & Tool Watch\n\n- **Google: domain-level opt-out of AI Overviews/AI Mode** in Search Console (1\u20132 day effect, not a ranking signal, doesn't stop training). Page-level controls: March 2027. [Docs](https://support.google.com/webmasters/answer/16908024) \u00b7 ~July 20\n- **EC fined Google \u20ac890M under the DMA**; how self-preferencing rules apply to AI Overviews/AI Mode is still being negotiated. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 July 23\n- **PMax may get search-partner/GDN exclusions** \u2014 biggest control concession since launch, per practitioners. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n- **Gemini 3.6 Flash price cuts** (17% fewer output tokens; Flash-Lite $0.30/M input) \u2014 agent economics improve without product changes. [Google](https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/) \u00b7 July 21\n- **Meta: Seller app with AI listings (30-second claim, no accuracy rate), video-first Facebook test, free selfie verification July 27. Q2 earnings land Wednesday, July 29.** [PPC Land](https://ppc.land/meta-demotes-facebook-feed-as-free-selfie-badge-rolls-out-today/) \u00b7 July 24\u201329\n- **Amazon: ~10 AI features in Brand+/Performance+; single-deal STV buying removed.** [PPC Land](https://ppc.land/amazon-kills-single-deal-stv-buying-in-brand-as-10-ai-features-land/) \u00b7 July 22\n- **HubSpot Agent Hub public beta** \u2014 low-code agents on CRM data; HubSpot itself flagged the uncoordinated-agents risk. [PPC Land weekly](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/) \u00b7 week of July 20\n\n---\n\n## Voices This Week\n\n- **Philipp Schindler (Google CBO):** AI-powered campaigns deliver \"15% more conversions or value\u2026 at a similar ROAS\" \u2014 vendor-measured; independent tests disagree on cost per conversion. [Source](https://abc.xyz/investor/events/event-details/2026/2026-Q2-Earnings-Call-2026-GgTAq7Is0z/default.aspx)\n- **Sundar Pichai (Alphabet CEO):** Google sends \"billions of clicks to websites every week\" via AI features \u2014 true in absolute terms even as per-page CTR data falls; demand denominators before repeating either claim. [Source](https://ppc.land/google-search-ads-gain-17-to-63-3-billion-while-network-drops-1/)\n- **Andy Yang (TikTok):** AI creativity's gap is \"not a technology gap, it is an intelligence gap.\" [Source](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n- **Mark Howard (Time COO):** publishers now serve two audiences \u2014 humans, and the AI crawlers that outnumber them. Time builds pages humans never see. [Source](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n- **Sam Clarke (Crossmedia):** PMax inventory exclusions are \"fairly significant\" \u2014 control features keep being what unlocks automated-format spend. [Source](https://ppc.land/marketers-brief-ai-with-the-demographic-data-they-say-no-longer-works/)\n\n---\n\n## Common Threads\n\n### Paid \u2260 Cited\nAI search now sells placements, but citations stay earned \u2014 11% overlap between AI Mode advertisers and cited sources; 74% of ChatGPT chats carry no ads.\n\n### Production Outran Verification\n88% more creative, 45% better; agents ship time-savings numbers with no accuracy rates; attestation fields no one validates.\n\n### Compliance Moves Pre-Flight\nLabeling laws and attestation APIs make asset provenance a required production field \u2014 the advertiser holds the liability everywhere.\n\n### Measurement Is Unsettled\nSimilarweb and Adthena describe the same markets in incompatible numbers (43% vs 18% AI Overview frequency). Single-vendor panels are hypotheses, not ground truth.\n\n### Visibility Fragments Across Assistants\nChatGPT ~52%, Gemini ~27%, Claude ~9% \u2014 and only 36 of 1,200+ brands show up consistently everywhere. Optimizing for one assistant is a share bet.\n\n---\n\n## Angles for the Week\n\n1. **\"AI search became a paid channel; citations are still earned.\"** Google sells the placement, not the citation (11% overlap). The paid-vs-earned frame for AI answers is wide open this week.\n2. **\"Your buyers still call it SEO.\"** 81% say SEO; AEO gets 3% of searches; buzzword pitches are the top red flag. Meet buyers in their language \u2014 and naming that tension is the credible move for a team that uses \"AEO\" daily.\n3. **\"AI didn't lower creative quality. The brief did.\"** 67% brief with demographics; 59% say demographics don't work. Workflow before technology, with survey numbers attached.\n4. **\"Would your ads survive August 2?\"** Synthetic spokesperson + EU = full label or 3%-of-turnover exposure. A practical decision-tree post writes itself.\n5. **\"Three-quarters of AI exposure can't be bought.\"** Ads in 26% of chats; the rest is retrieval. The cleanest quantitative case for AI-visibility work this week.\n\n---\n\n## Tip of the Week\n\n### Monthly Three-Assistant Brand Audit\n\n1. Write 5 buying-intent prompts a prospect would actually ask.\n2. Run them in ChatGPT, Gemini, and Claude (fresh sessions).\n3. Log: mentioned? said accurately? which sources cited?\n4. Turn recurring cited domains into your placement/PR target list.\n5. Repeat monthly; track the diff.\n\nThirty minutes a month converts \"how do we show up in AI?\" from a vibe into a dataset \u2014 and the citation sources are concentrated enough (reviews/UGC ~29%, news ~26%) to act on.\n\n---\n\n*Signal & Scale is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n";
