      slug: "2026-09-21",
      editionTitle: "Week of September 21, 2026",
      editionMd: "# Monday Signal \u2014 Week of September 21, 2026\n\n> **The court finally showed its work on Google's ad tech: the 106-page remedies opinion unsealed Tuesday orders AdX demand into Prebid on \"functionally equivalent\" terms, bars AdWords from bidding straight into DFP, and puts a monitor with source-code access inside Google for six years, while leaving DV360 alone.** The same week, Google started paying some publishers when their pages shape AI answers (being linked doesn't count), OpenAI began testing Sponsored Agents that let ChatGPT users chat with an advertiser's bot, Profound became the AEO category's $1.8 billion company, and the first outside data on August 17 showed budget-limited CPCs up 15.8%. On the feed, marketing LinkedIn argued all week about whether Novig's Sydney Sweeney ad worked; by one count, 4% of the conversation was about the app.\n\n---\n\n## The Conversation\n\n### Novig's Sydney Sweeney ad won the attention. Four percent of it went to Novig.\n\nThe spot launched September 9: an otherwise-nude Sydney Sweeney, covered by footballs and hockey pads, pitching Novig as the prediction market for \"just sports\" (no contracts on politics, wars, or death). The backlash crested over the weekend of the 12th, as female athletes posted footage of themselves competing; British sprinter Amy Hunt, live on the BBC after her 200 meters: \"Sydney Sweeney, this is what women in sport look like.\" Sweeney shed about 200,000 Instagram followers in two days and started winning them back within 48 hours. On Tuesday, CEO Jacob Fortinsky told a Front Office Sports audience \"we never intended to portray female sports,\" and said Sweeney, an equity holder, drove \"a lot of the visuals and the messaging\"; Front Office Sports counted more than 47 million Instagram views and 12 million on X. The number that matters for marketers came from Peak Metrics: conversation about Novig rose 911%, but about 68% of posts centered on Sweeney and 4% on the product. Marketing LinkedIn split on whether that's a win, and Jessica Haberland made the defense plainly: \"Some of the best campaigns are divisive.\"\n\n**Comment window:** open. The take that isn't everywhere yet: outrage is a media plan now, so price it like one. Reach was never in doubt; cost per brand-attributable mention is the number worth arguing about.\n\n*Editor's note, added at publication on September 25: USA TODAY's later tally found Novig's Instagram following grew from 37,000 before the ad to 93,000 by September 22, and Novig briefly passed Kalshi and Polymarket in US Google search interest on September 14. [USA TODAY](https://www.usatoday.com/story/sports/2026/09/23/sydney-sweeney-ad-novig-backlash-social-media/91878364007/)*\n\n**Source:** [Front Office Sports on Fortinsky's remarks](https://frontofficesports.com/article/novig-ceo-says-sydney-sweeney-drove-visuals-and-messaging-of-nude-ad/) \u00b7 [Business Insider, with Peak Metrics' data](https://www.businessinsider.com/sydney-sweeney-controversial-nude-ad-novig-sports-prediction-brand-experts-2026-9) \u00b7 [PeakMetrics' analysis](https://www.peakmetrics.com/insights/sydney-sweeneys-novig-ad-sparked-backlash.-what-did-the-broader-conversation-reveal) \u00b7 [The Athletic](https://www.nytimes.com/athletic/7593383/2026/09/14/sydney-sweeney-naked-advert-backlash/) \u00b7 [Variety](https://variety.com/2026/digital/news/sydney-sweeney-loses-instagram-followers-nude-ad-backlash-1236861401/) \u00b7 [Newsweek on the rebound](https://www.newsweek.com/sydney-sweeneys-follower-count-rebounds-after-drop-novig-ad-brand-backlash-12451231) \u00b7 [Haberland's post](https://www.linkedin.com/posts/jessicahaberland_shes-pissing-us-off-on-purpose-btw-don-activity-7505231621214654464-ppPq) \u00b7 September 9\u201315, 2026\n\n### Profound raised at $1.8 billion, and the AEO category had its unicorn week\n\nProfound, which helps brands track and improve how they appear in ChatGPT, Gemini, Perplexity, and Claude answers, raised a $180 million Series D on Tuesday at a $1.8 billion valuation, co-led by Sequoia and Kleiner Perkins, less than seven months after its $96 million Series C. The company-reported figures: more than 1,000 enterprise customers (its blog counts 2,500-plus brands), a third of the Fortune 100, and revenue up 3x in six months, per TechCrunch. The money goes to post-training models for marketing work and building a benchmark for real marketing tasks; a product called Aim gets a live demo September 30. CEO James Cadwallader's announcement drew more than 1,400 comments on LinkedIn, most of them congratulatory. One commenter, Matt Maher, wrote that nobody \"may have completely solved GEO (or AEO, or LLMO) just yet,\" but called Profound \"the closest thing to a complete navigational system for Fortune 1000 brands that I've seen.\" The skeptics' case, about valuation multiples on a young revenue base, has been running on LinkedIn since the last round; Joe Zaghloul's July post is the sharpest version.\n\n**Comment window:** open through the September 30 demo. The useful distinction for buyers: the category now sells two different things, measuring how a brand appears in AI answers and changing it, and the contract should say which one you're paying for.\n\n**Source:** [Profound's announcement](https://www.globenewswire.com/news-release/2026/09/15/3362180/0/en/profound-raises-180m-series-d-at-1-8b-valuation-to-build-the-ai-platform-for-marketing-teams.html) \u00b7 [TechCrunch](https://techcrunch.com/2026/09/15/aeo-startup-profound-hits-unicorn-valuation-raises-180m-series-d-7-months-after-last-round/) \u00b7 [Bloomberg](https://www.bloomberg.com/news/articles/2026-09-15/profound-hits-1-8-billion-value-to-boost-brands-in-ai-search) \u00b7 [Cadwallader's post and comments](https://www.linkedin.com/posts/jsca_profound-has-raised-a-180m-series-d-at-a-activity-7505662245876723713-HoUC) \u00b7 [Zaghloul's July post](https://www.linkedin.com/posts/jzaghloul_profound-is-worth-1-billion-it-does-68-activity-7486423699802304512-lwrT) \u00b7 September 15\u201316, 2026\n\n### The first outside data on August 17: budget-limited CPCs up 15.8%\n\nGoogle updated its help page to confirm the August 17 bidding change finished rolling out globally on August 27, and Smarter Ecommerce's Mike Ryan posted the first outside read on Monday, September 14: median CPCs for budget-limited Target ROAS campaigns rose 15.8% after the change, while campaigns that were never budget-limited got 13% cheaper. His explanation is the useful part. Google had been lowering bids on budget-capped campaigns to keep them under budget, which left most of them \"rank-limited by CPC\"; ending that suppression pushed their CPCs up and released \"a sizable pool of cheap clicks\" to campaigns without a budget cap. On the PPC Live podcast he added a finding practitioners will recognize: advertisers raised tROAS targets around the update even on campaigns that weren't budget-limited, a reflex the change didn't call for. Conversion and ROAS reads still need one to two conversion cycles, which puts the fuller picture in mid-October.\n\n**Comment window:** open until that read. The practical post: for budget-limited target campaigns, the lever moved from the target to the budget, because Google now holds performance at target when the budget changes.\n\n**Source:** [Search Engine Roundtable, with Ryan's chart](https://www.seroundtable.com/data-google-ads-aug17-bidding-update-42086.html) \u00b7 [Search Engine Roundtable on the completion date](https://www.seroundtable.com/google-august-17-bidding-update-finished-august-27-42090.html) \u00b7 [Search Engine Land on the PPC Live conversation](https://searchengineland.com/google-ads-ai-needs-guardrails-not-blind-trust-ft-mike-ryan-488756) \u00b7 [TechWyse](https://www.techwyse.com/news/platform-updates/google-smart-bidding-august-2026-update-cpc-bid-suppression) \u00b7 September 14\u201318, 2026\n\n---\n\n## Voices\n\nVerbatim, from the posts, filings, and stages where the week's arguments actually happened.\n\n- **Jacob Fortinsky, CEO, Novig** (Front Office Sports' Asset Class event, September 15): \"As a company we're hugely supportive of women's sports\u2026 We never intended to portray female sports. Sydney is an actress, the biggest movie star in the world. We're a prediction market focused on sports. That is the story she was communicating.\" [Front Office Sports](https://frontofficesports.com/article/novig-ceo-says-sydney-sweeney-drove-visuals-and-messaging-of-nude-ad/)\n- **Amy Hunt, sprinter** (live BBC interview, September 13): \"Sydney Sweeney, this is what women in sport look like\u2026 21.4. Muscles. Hard work, blood, sweat, tears.\" [Via The Athletic](https://www.nytimes.com/athletic/7593383/2026/09/14/sydney-sweeney-naked-advert-backlash/)\n- **Jessica Haberland** (LinkedIn, on the Novig ad): \"Some of the best campaigns are divisive - you choose your audience and you decide not to care what anyone outside of that audience thinks or feels about it.\" [The post](https://www.linkedin.com/posts/jessicahaberland_shes-pissing-us-off-on-purpose-btw-don-activity-7505231621214654464-ppPq)\n- **Mike Ryan, Smarter Ecommerce** (X, September 14): \"Two natural consequences of ending bid suppression are: 1) CPCs are rising for budgeted-limited campaigns, and 2) a sizable pool of cheap clicks have been liquidated and are now available to non-limited campaigns.\" [Via Search Engine Roundtable](https://www.seroundtable.com/data-google-ads-aug17-bidding-update-42086.html)\n- **Judge Leonie Brinkema, US District Court, Eastern District of Virginia** (remedies opinion, unsealed September 16): structural remedies are \"neither realistic nor needed,\" and the Prebid integrations must operate \"in a functionally equivalent manner and on materially identical terms as DFP currently interoperates with and solicits bids from AdX.\" [The opinion](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1858.0.pdf)\n- **Google** (AI contribution pilot help text): \"Web content may also confirm facts or be linked to within Google's [AI] after a response is generated, but those instances don't qualify for [AI] contribution.\" [Via Search Engine Roundtable](https://www.seroundtable.com/google-al-contribution-pilot-42076.html)\n- **OpenAI** (announcement, September 16): \"After seeing a relevant ad, a user can choose to start a clearly labeled conversation with a business-sponsored agent in ChatGPT.\" [OpenAI](https://openai.com/index/reimagining-advertising-with-ai/)\n- **Hugo Huijer, Productrise** (LinkedIn, on the EEA): \"Over the past two days, Google's 'popular products' carousels - the organic product blocks that appear for commercial queries - have almost entirely disappeared from search in the European Economic Area.\" [Via Search Engine Roundtable](https://www.seroundtable.com/google-drops-free-product-listings-eea-42113.html)\n\n---\n\n## This Week in Marketing AI\n\n### The ad-tech opinion is out: AdX into Prebid, AdWords out of DFP, a monitor for six years\n\nThe sealed opinion behind the September 2 order (our September 7 lead) came out Tuesday, unredacted because neither side asked for redactions, and it spells out what \"behavioral remedies\" means in practice. Structural relief was \"neither realistic nor needed,\" Judge Leonie Brinkema wrote: the government hadn't shown the causal link a breakup requires, and DFP's auction logic wasn't part of the violation, while open-sourcing it would have been impractical (one DFP function depends on a daily computation that runs ten hours across 4,000 machines). What Google gets instead is a compliance build. AdX and DFP must integrate with Prebid, the open-source header-bidding framework, \"in a functionally equivalent manner and on materially identical terms\" to how DFP works with AdX today, and AdX has to bid into rival publisher ad servers on the same terms. Google must document how DFP picks a winner, share real-time bid data with publishers, and stay away from the First Look and Last Look mechanics the liability ruling condemned.\n\nThe buy side is where advertisers should look. The remedies apply \"only as to AdWords, and not as to DV360\": AdWords can't bid straight into DFP (the court flagged Google Partner Bidding as the route that would have sidestepped everything else), can't favor Google's own tools, and can't use first-party data to advantage Google's own pipes. Brinkema adopted Google's proposed six-year term over the government's 15, with a monitor and technical committee holding access to employees, systems, and source code. The Final Judgment takes effect 60 days after it's entered, and the joint draft is due in early October.\n\n**Source:** [The opinion (PDF)](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1858.0.pdf) \u00b7 [AdExchanger's summary](https://www.adexchanger.com/platforms/the-court-just-unsealed-judge-brinkemas-remedies-decision-in-the-google-ad-tech-antitrust-case-heres-your-tldr/) \u00b7 [National Law Review](https://natlawreview.com/article/court-declines-order-adx-divestiture-google-ad-tech-case) \u00b7 [Business Insider in plain English](https://www.businessinsider.com/what-googles-adtech-behavioral-remedies-ruling-means-in-plain-english-2026-9) \u00b7 September 16, 2026\n\n### Google will pay some publishers for shaping AI answers. Being linked doesn't count.\n\nDigiday reported on Monday, September 14, that Google has been quietly scaling an invite-only \"AI contribution pilot\" in Search Console that pays websites when their content \"contributes significantly to the creation of AI-generated responses\" in the Gemini app, AI Overviews, and AI Mode. The eligibility line is the whole design. Payment covers the generation phase only: content that confirms a fact or gets linked after the answer exists doesn't qualify. Participants get an earnings widget with a monthly figure and some history, no explanation of how it's calculated, no upfront fee, and an opt-out at any time. Digiday's sources say dozens of publishers have been approached, well beyond news organizations. Google called it an early-stage learning pilot and pointed back to a June post about rewarding content that keeps generative answers fresh and accurate. Critics, in Digiday's summary, see it as \"less like a meaningful payout and more like a legal fig leaf.\"\n\nFor brands with owned content programs, the incentive is now explicit even if the program isn't open to them yet: Google is putting a price on content that shapes what the model says, separate from the click. A link in an AI answer and a contribution to it are different assets, and only one has a payout attached. The widget shows a monthly total, not which pages earned it or why.\n\n**Source:** [Digiday](https://digiday.com/media/google-rolls-out-pay-per-use-ai-licensing-program-to-publishers/) \u00b7 [Search Engine Roundtable, with the help text](https://www.seroundtable.com/google-al-contribution-pilot-42076.html) \u00b7 [MediaNama](https://www.medianama.com/2026/09/223-google-ai-pilot-publishers-responses/) \u00b7 September 14\u201317, 2026\n\n### Ads moved inside the answer: Sponsored Agents in ChatGPT, sponsored links in AI Mode\n\nOpenAI said Wednesday it's testing Sponsored Agents with select US advertisers: after seeing a relevant ad, \"a user can choose to start a clearly labeled conversation with a business-sponsored agent in ChatGPT,\" ask follow-up questions, and click through to the business when ready. OpenAI says that conversation is \"distinct from ChatGPT's independent answers and separate from the original conversation.\" The same post turned ChatGPT into its own ad-building tool (campaigns created from prompts in ChatGPT Work, an Ads Manager plugin that creates, updates, and analyzes campaigns in plain language, creative drafted from the landing page) and named two partners. HubSpot, its first CRM integration, lets businesses connect a ChatGPT Ads account, run ads, and follow up on leads without leaving HubSpot; Shopify's US merchants got a ChatGPT Ads app backed by Shopify Catalog, going international September 23. The Register's summary was less charitable: \"Slop ads served in slop responses.\"\n\nGoogle spent the same days testing its version. Sachin Patel spotted, and Search Engine Roundtable reported, sponsored results inside AI Mode rendered as ordinary anchor-text links in the answer, with a \"Sponsored\" label above, the paid cousin of the organic anchor-text links Google first tested in AI Mode in April 2025. Barry Schwartz's doubt is the practical one: people click links inside AI answers less, so an ad dressed as a citation may win the placement and lose the click. Both formats move the ad from beside the answer into it, which puts disclosure design on the media plan next to bidding.\n\n**Source:** [OpenAI's announcement](https://openai.com/index/reimagining-advertising-with-ai/) \u00b7 [Reuters](https://www.reuters.com/business/media-telecom/openai-tests-advertiser-sponsored-agents-expands-ai-tools-chatgpt-ads-2026-09-16/) \u00b7 [Search Engine Roundtable on Sponsored Agents](https://www.seroundtable.com/openai-chatgpt-sponsored-agents-42104.html) \u00b7 [Search Engine Roundtable on AI Mode text-link ads](https://www.seroundtable.com/google-ai-mode-text-link-ads-42082.html) \u00b7 [The Register](https://www.theregister.com/ai-and-ml/2026/09/16/openais-new-sponsored-agents-are-happy-to-chat-about-selling-you-things/5296946) \u00b7 September 15\u201316, 2026\n\n### Google's holiday playbook: share of voice in AI answers, and a way to take the checkout back\n\nAshish Gupta, who runs merchant shopping at Google, laid out the holiday agentic-commerce toolkit on Wednesday, September 16. AI performance insights in Merchant Center, which compares a retailer's share of voice with other brands across AI Mode and AI Overviews, is now generally available in the US, Canada, Australia, New Zealand, and India (English queries and organic AI traffic only, and still no click metric, per Search Engine Journal). Business Agent, the conversational layer that answers shopper questions, entered a US beta inside YouTube ads. And the Universal Commerce Protocol hub, which Google says already enables direct checkout for \"hundreds of thousands\" of brands, gained cart transfer: a shopper builds a cart on Google and finishes on the merchant's own site, where the merchant's upsells and account sign-ups still work. It's rolling out in the US now, with Australia and Canada early next year; analytics are \"coming soon.\"\n\nThe feed guidance was the most concrete line in the post: in testing with lululemon, conversational attributes the brand submitted were used in 50% of relevant AI Mode product recommendations. Tapestry (Coach, Kate Spade) already sells through UCP checkout in Search, AI Mode, and Gemini. For retail clients, the product feed now writes part of the answer, and cart transfer is a concession that merchants might want the checkout back.\n\n**Source:** [Google's post](https://blog.google/products-and-platforms/products/shopping/google-shopping-updates-holiday-shopping/) \u00b7 [Search Engine Land](https://searchengineland.com/google-expands-agentic-commerce-tools-ahead-of-the-holiday-shopping-rush-488930) \u00b7 [Search Engine Journal](https://www.searchenginejournal.com/google-ucp-update-lets-merchants-enable-cart-transfer-to-site/589713/) \u00b7 September 16, 2026\n\n### Europe's remedy reached the shopping aisle: free listings gone, carousels down 90\u2013100%\n\nThe DMA redesign Google shipped to the EEA on September 8 (our September 14 lead) kept spreading. By Friday, free product listings and the organic \"popular products\" carousels had largely disappeared from search across the EEA, replaced by a \"Comparison Sites\" aggregator unit that stacks price-comparison services with one expanded by default. Productrise's Hugo Huijer measured drops of roughly 90\u2013100% in Germany, France, Belgium, Sweden, and the Netherlands, and Adriaan Dekker named where the space went: \"The space is going to price comparison services (CSS) instead.\" Google's ads liaison Ginny Marvin confirmed the removal was a DMA requirement. The same day, Google added local business queries to the aggregator and supplier units: directories that win approval and send a local data feed compete for the aggregator slot, while the businesses themselves can appear in the companion supplier unit without sending anything extra, as long as Google can crawl their sites.\n\nFor European retail and local clients, this is a channel change more than a ranking change. Organic product visibility on Google in the EEA now runs through comparison services, which makes paid Shopping and CSS relationships the levers. Google has said the changes extend into AI Overviews and AI Mode there too.\n\n**Source:** [Search Engine Roundtable](https://www.seroundtable.com/google-drops-free-product-listings-eea-42113.html) \u00b7 [Productrise](https://productrise.app/blog/product-carousels-disappearing-from-google-europe-eea) \u00b7 [Search Engine Journal on local units](https://www.searchenginejournal.com/google-adds-local-businesses-to-eea-search-result-units/589955/) \u00b7 [Google's aggregator unit documentation](https://developers.google.com/search/docs/appearance/aggregator-unit) \u00b7 [Skift on the AI features](https://skift.com/2026/09/10/google-update-europe-hotel-flight-search-results/) \u00b7 September 16\u201318, 2026\n\n### Microsoft's rules for AI-generated ads: disclose it, keep the watermark, and the label won't save a deepfake\n\nSearch Engine Land reported on Monday, September 14, that Microsoft Advertising has published dedicated guidance for AI-generated and AI-manipulated creative, and it reads like a production checklist. When law or policy requires disclosure, it has to be clear and close to the content, ideally built into the image or video itself. Advertisers must preserve watermarks, metadata, and provenance data, and interfering with machine-readable provenance is itself grounds for rejection. Microsoft's own AI tools embed imperceptible watermarks, which may not satisfy consumer-facing disclosure on their own. And the label doesn't launder the creative: ads can still be rejected, restricted, or removed for prohibited deepfakes, impersonation, or using someone's likeness or voice without the required authorization.\n\nA week after an offshore sportsbook deepfaked a college football fan (last week's lead conversation), that last clause is the one brand teams should forward. The practical exposure sits in the export pipeline: any resize or re-encode step that strips metadata now creates policy risk on Microsoft's network, which moves provenance out of legal review and into production ops.\n\n**Source:** [Search Engine Land](https://searchengineland.com/microsoft-advertising-sets-rules-for-ai-generated-ads-488429) \u00b7 [TechWyse](https://www.techwyse.com/news/platform-updates/microsoft-ai-ad-guidance-disclosures-advertiser-responsibility) \u00b7 September 14, 2026\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's daily recaps](https://www.seroundtable.com/recap-09-18-2026-42117.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/2026-09-21-ai-in-marketing-management/).*\n\n- **TikTok's 2019 COPPA order survives, for now.** On Friday, Judge George H. Wu tentatively denied the government's motion to vacate the Musical.ly consent order, the condition attached to the last $100 million of TikTok's $400 million settlement: \"there is nothing inherent in the ownership change that renders the aims of the Consent Order accomplished or its enforcement no longer necessary.\" The hearing is this morning. [The tentative ruling (PDF)](https://storage.courtlistener.com/recap/gov.uscourts.cacd.738182/gov.uscourts.cacd.738182.19.0.pdf) \u00b7 [Bloomberg](https://www.bloomberg.com/news/articles/2026-09-19/california-court-blocks-part-of-tiktok-s-400-million-settlement) *Editor's note, added at publication on September 25: Judge Wu formally adopted the ruling on Monday, and the Justice Department can amend and refile. [MediaPost](https://www.mediapost.com/publications/article/418158/judge-rejects-ftc-tiktok-settlement-over-children.html)*\n- **Google got better at blocking scrapers and rank trackers** from around September 13, per Search Engine Roundtable, during ranking volatility that has been unusual since September 4 and spiked again this week with no confirmed update. Glenn Gabe checked the big three SEO tools against a site he knows dropped nearly 100% and fully recovered. After the /goto redirects, third-party rank data keeps getting harder to trust. [Search Engine Roundtable](https://www.seroundtable.com/google-blocking-scrapers-and-tracking-tools-42118.html)\n- **Search:** Search Live now runs on Gemini 3.8 Live, Google is testing an AI Mode button inside the results-page search bar, local knowledge panels are turning into AI Overviews, and Search profiles got a redesign. John Mueller said Search Console's position reporting for AI surfaces will \"evolve over time.\"\n- **Google Ads added a spend benchmark report** comparing you with competitors, a product price optimization beta, commerce audience sharing, and a Performance Max setting that can send clicks to a Google-hosted Business Profile page with built-in conversion measurement instead of your site. Use that last one only where your own measurement is weak; every hosted page is data you don't hold.\n- **Measurement plumbing:** the Chrome UX Report added four ad metrics, Google Analytics got dashboards, and Google is testing product listings that link straight to merchant sites. Merchants must now label adult products in their feeds.\n- **Bing tested a left-rail shopping filter** and joined Google in asking some searchers to prove they're human before showing results.\n- **Dreamforce's agent reality check:** Adweek reported AT&T using agents to speed phone upgrades while keeping cancellations with people, and Crocs keeping humans in the loop while it cleans up its data. Narrow scope plus human review is what agents in production look like.\n- **The AI labs are building their own referee.** An OpenAI spokesperson confirmed to CNBC that it's coordinating with Anthropic and Google on a FINRA-style standards body, and its chief global affairs officer, Chris Lehane, told a Washington briefing (per Bloomberg), \"It's better to try to work together to prioritize safety.\" King Charles's summit at Dumfries House on Thursday produced no binding commitments. [CNBC](https://www.cnbc.com/2026/09/15/open-ai-google-anthropic-safety.html) \u00b7 [The Royal Household's account](https://www.everydayexceptional.royal.uk/news-and-activity/2026-09-17/the-king-convenes-tech-leaders-for-ai-summit-in-scotland)\n- **Cloudflare's September 15 crawler change shipped** as described in last week's editor's note: Google, Apple, and Microsoft keep crawling for search under \"Disallow AI Training,\" and only an explicit Block stops them.\n\n---\n\n## Common Threads\n\n### The answer became the ad slot\n\nSponsored Agents talk inside ChatGPT, sponsored links sit inside AI Mode's answers, and Business Agent answers questions inside YouTube ads. Every surface that used to separate the answer from the ad blurred this week, and none of them came with a published click-through benchmark.\n\n### Money is moving toward whoever shapes the answer\n\nGoogle is paying for generation-phase contribution, investors valued an AI-visibility platform at $1.8 billion, and Europe's remedy handed product shelf space to comparison services. All three price lists are private.\n\n### Supervision instead of surgery\n\nBrinkema chose a six-year monitor over divestiture, Judge Wu kept TikTok's 2019 order in force, and Google is running its European remedy under the Commission's watch. Courts and regulators keep choosing to sit inside the companies instead of taking them apart.\n\n### Exposure gets measured; effect waits\n\nNovig's conversation jumped 911% with 4% of it about the app. Ryan says a full read on August 17 needs one to two conversion cycles. The AI contribution widget shows earnings without a method, and AI performance insights still has no click column. Everyone had an exposure number this week, and the effect numbers are all still pending.\n\n---\n\n## Angles for the Week\n\n### Outrage is a media plan now. Price it like one.\n\nNovig spent \"the bulk of our marketing dollars\" going into football season on a spot that drew 47 million Instagram views and a conversation where 4% of posts were about the product. The post to write costs controversy like any other buy: cost per brand-attributable mention, the share of conversation that names the product, and what the next spot has to do to convert borrowed attention. Window: this week, while the numbers are fresh.\n\n### The AEO category got priced. Know which half you're buying.\n\nProfound's round turns AI visibility into a board-level budget line. The useful post for buyers separates the two things the category sells (measuring how you appear in answers, and changing it) and asks every vendor which one the invoice covers. Window: open through Profound's September 30 demo.\n\n### Budget is the lever now, not the target\n\nRyan's data says budget-limited target campaigns lost their discount and campaigns without a budget cap picked up the cheap clicks. The checklist post: find which campaigns are budget-limited, stop raising tROAS by reflex, and model what extra budget buys at target before Q4 spend commits. Window: before Q4 budgets lock; the fuller read lands mid-October.\n\n### Your content has two prices now: the click and the contribution\n\nGoogle's pilot pays for content that shapes an AI answer and pays nothing for being linked in one. For owned-media programs that's a spec: factual density, primary data, clear attribution, and pages a model can ground on. Window: open; the pilot is invite-only, the incentive isn't.\n\n### Prebid is about to get AdX demand\n\nFor publisher-side clients, the remedies change the header-bidding math: AdX bids flowing into Prebid on functionally equivalent terms, real-time bid data, and documentation of how DFP picks a winner. The prep post covers what to test once the Final Judgment lands and which yield assumptions change. Window: from the Final Judgment through its 60-day effective date.\n\n---\n\n## Sources\n\n**Primary documents, posts, and statements**\n\n1. [US v. Google \u2014 remedies memorandum opinion (CourtListener PDF)](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1858.0.pdf) \u2014 filed September 2, unsealed September 16, 2026 \u2014 the remedies, quoted verbatim; six-year term; DV360 carve-out; 60-day effective date\n2. [OpenAI \u2014 Reimagining advertising with AI](https://openai.com/index/reimagining-advertising-with-ai/) \u2014 September 16, 2026 \u2014 Sponsored Agents, ChatGPT Work ad creation, HubSpot and Shopify integrations\n3. [Google \u2014 holiday agentic-commerce updates](https://blog.google/products-and-platforms/products/shopping/google-shopping-updates-holiday-shopping/) \u2014 September 16, 2026 \u2014 AI performance insights GA, Business Agent in YouTube ads, UCP cart transfer, lululemon result\n4. [Profound \u2014 Series D announcement](https://www.globenewswire.com/news-release/2026/09/15/3362180/0/en/profound-raises-180m-series-d-at-1-8b-valuation-to-build-the-ai-platform-for-marketing-teams.html) \u2014 September 15, 2026 \u2014 round terms, investors, customer counts\n5. [Profound \u2014 company blog on the round](https://www.tryprofound.com/blog/series-d) \u2014 September 16, 2026 \u2014 brand count, Aim demo date\n6. [James Cadwallader \u2014 Linked       simplifiedMd: "# Monday Signal \u2014 Week of September 21, 2026\n\n> **The ad-tech remedies opinion came out Tuesday: AdX demand into Prebid on \"functionally equivalent\" terms, AdWords barred from bidding straight into DFP, a six-year monitor with source-code access, and DV360 left alone.** Also: Google started paying some publishers when their pages shape AI answers (links don't count), OpenAI began testing Sponsored Agents in ChatGPT, Profound raised at $1.8 billion, and the first data on August 17 showed budget-limited CPCs up 15.8%. Novig's Sydney Sweeney ad won the attention; 4% of the conversation was about Novig.\n\n---\n\n## The Conversation\n\n### Novig's Sweeney ad won the attention. Four percent of it went to Novig.\n\nLaunched September 9; the backlash crested September 12\u201314 as female athletes posted \"this is what sport looks like\" footage (Amy Hunt on the BBC: \"Sydney Sweeney, this is what women in sport look like\"). CEO Jacob Fortinsky (Sept 15): \"We never intended to portray female sports.\" Peak Metrics: Novig conversation +911%, but ~68% of posts were about Sweeney and 4% about the product. Price outrage like a media buy: cost per brand-attributable mention. *Editor's note (Sept 25): USA TODAY later counted Novig's Instagram at 93,000 followers by Sept 22, up from 37,000.* [Front Office Sports](https://frontofficesports.com/article/novig-ceo-says-sydney-sweeney-drove-visuals-and-messaging-of-nude-ad/) \u00b7 [PeakMetrics](https://www.peakmetrics.com/insights/sydney-sweeneys-novig-ad-sparked-backlash.-what-did-the-broader-conversation-reveal)\n\n### Profound: $1.8 billion, and the AEO category's unicorn week\n\n$180M Series D (Sept 15), co-led by Sequoia and Kleiner Perkins, under seven months after a $96M Series C; 1,000+ enterprise customers and revenue up 3x in six months (company-reported). CEO James Cadwallader's post drew 1,400+ comments, mostly congratulations; skeptics point at valuation multiples. The category sells two things, measuring AI visibility and changing it; know which one you're buying. Aim demo Sept 30. [TechCrunch](https://techcrunch.com/2026/09/15/aeo-startup-profound-hits-unicorn-valuation-raises-180m-series-d-7-months-after-last-round/) \u00b7 [The post](https://www.linkedin.com/posts/jsca_profound-has-raised-a-180m-series-d-at-a-activity-7505662245876723713-HoUC)\n\n### First data on August 17: budget-limited CPCs +15.8%\n\nGoogle confirmed the rollout finished August 27. Mike Ryan (Sept 14): budget-limited tROAS CPCs +15.8%, never-limited campaigns \u221213%, as ending bid suppression released \"a sizable pool of cheap clicks.\" Advertisers also raised tROAS reflexively on campaigns that weren't budget-limited. The lever is now budget, not target; full read mid-October. [SER](https://www.seroundtable.com/data-google-ads-aug17-bidding-update-42086.html) \u00b7 [TechWyse](https://www.techwyse.com/news/platform-updates/google-smart-bidding-august-2026-update-cpc-bid-suppression)\n\n---\n\n## Voices\n\n- **Jacob Fortinsky, Novig (Sept 15):** \"We never intended to portray female sports. Sydney is an actress, the biggest movie star in the world. We're a prediction market focused on sports.\" [FOS](https://frontofficesports.com/article/novig-ceo-says-sydney-sweeney-drove-visuals-and-messaging-of-nude-ad/)\n- **Mike Ryan, Smarter Ecommerce (X, Sept 14):** \"a sizable pool of cheap clicks have been liquidated and are now available to non-limited campaigns.\" [Via SER](https://www.seroundtable.com/data-google-ads-aug17-bidding-update-42086.html)\n- **Judge Leonie Brinkema (opinion, unsealed Sept 16):** structural remedies are \"neither realistic nor needed.\" [The opinion](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1858.0.pdf)\n- **OpenAI (Sept 16):** users can \"start a clearly labeled conversation with a business-sponsored agent in ChatGPT.\" [OpenAI](https://openai.com/index/reimagining-advertising-with-ai/)\n\n---\n\n## This Week in Marketing AI\n\n### The ad-tech opinion: AdX into Prebid, AdWords out of DFP, six years of monitoring\n\n106 pages, unsealed Tuesday. No breakup (\"neither realistic nor needed\"). AdX and DFP must integrate with Prebid on \"functionally equivalent\" terms; AdX bids into rival ad servers on DFP's terms; DFP's winner selection gets documented; real-time bid data goes to publishers; no First/Last Look. Buy side: remedies apply to AdWords, \"not as to DV360\"; AdWords can't bid directly into DFP. Six-year term (the government wanted 15); monitor with source-code access; effective 60 days after the Final Judgment, draft due early October. [The opinion](https://storage.courtlistener.com/recap/gov.uscourts.vaed.533508/gov.uscourts.vaed.533508.1858.0.pdf) \u00b7 [AdExchanger](https://www.adexchanger.com/platforms/the-court-just-unsealed-judge-brinkemas-remedies-decision-in-the-google-ad-tech-antitrust-case-heres-your-tldr/)\n\n### Google pays some publishers for shaping AI answers; links don't count\n\nInvite-only \"AI contribution pilot\" in Search Console (Digiday, Sept 14): pays when content \"contributes significantly\" to answers in Gemini, AI Overviews, and AI Mode, during generation only. Monthly earnings widget, no method disclosed, opt out anytime; dozens of publishers approached. Critics, per Digiday: \"less like a meaningful payout and more like a legal fig leaf.\" For owned content: factual density and groundable pages now have a price. [Digiday](https://digiday.com/media/google-rolls-out-pay-per-use-ai-licensing-program-to-publishers/) \u00b7 [SER](https://www.seroundtable.com/google-al-contribution-pilot-42076.html)\n\n### Ads moved inside the answer\n\nOpenAI (Sept 16): Sponsored Agents let users chat with a business's agent after an ad, \"distinct from ChatGPT's independent answers\"; ads built from prompts in ChatGPT Work; HubSpot (first CRM partner) and Shopify (first ecommerce partner) integrations. Google tested sponsored anchor-text links inside AI Mode answers. Ads dressed as citations may win placement and lose the click; disclosure design is now on the media plan. [OpenAI](https://openai.com/index/reimagining-advertising-with-ai/) \u00b7 [SER on AI Mode](https://www.seroundtable.com/google-ai-mode-text-link-ads-42082.html)\n\n### Google's holiday playbook\n\nSept 16: AI performance insights (share of voice across AI Mode and AIOs, no click metric) GA in the US, Canada, Australia, New Zealand, India; Business Agent beta inside YouTube ads; UCP cart transfer lets shoppers finish on the merchant's own site (US now; AU/CA next year). lululemon's conversational attributes appeared in 50% of relevant AI Mode recommendations. The feed writes part of the answer. [Google](https://blog.google/products-and-platforms/products/shopping/google-shopping-updates-holiday-shopping/) \u00b7 [SEJ](https://www.searchenginejournal.com/google-ucp-update-lets-merchants-enable-cart-transfer-to-site/589713/)\n\n### Europe's remedy reached the shopping aisle\n\nBy Sept 18, free product listings and \"popular products\" carousels were gone across the EEA, down ~90\u2013100% (Productrise), replaced by \"Comparison Sites\" units; Ginny Marvin confirmed a DMA requirement. Local business queries joined the aggregator/supplier units. For EU clients: a channel change, with CSS and paid Shopping as the levers. [SER](https://www.seroundtable.com/google-drops-free-product-listings-eea-42113.html) \u00b7 [SEJ on local](https://www.searchenginejournal.com/google-adds-local-businesses-to-eea-search-result-units/589955/)\n\n### Microsoft's AI-ad rules\n\nDisclose when required, close to the content and ideally inside the asset; keep watermarks, metadata, and provenance intact (interfering is grounds for rejection); a label doesn't save a deepfake or unauthorized likeness. Audit export steps that strip metadata. [SEL](https://searchengineland.com/microsoft-advertising-sets-rules-for-ai-generated-ads-488429)\n\n---\n\n## Platform & Tool Watch\n\n*Unless linked otherwise, small items in this section were surfaced via [Search Engine Roundtable's daily recaps](https://www.seroundtable.com/recap-09-18-2026-42117.html) and [Anicca's weekly roundup](https://anicca.co.uk/blog/2026-09-21-ai-in-marketing-management/).*\n\n- **TikTok's 2019 COPPA order survives:** Judge George H. Wu tentatively denied vacatur Friday (the condition for the last $100M of the $400M settlement); hearing this morning. *Editor's note (Sept 25): adopted Monday; the DOJ can refile.* [Tentative ruling](https://storage.courtlistener.com/recap/gov.uscourts.cacd.738182/gov.uscourts.cacd.738182.19.0.pdf)\n- **Google is blocking scrapers and rank trackers better** since ~Sept 13, amid unusual ranking volatility. [SER](https://www.seroundtable.com/google-blocking-scrapers-and-tracking-tools-42118.html)\n- **Search:** Search Live on Gemini 3.8 Live; AI Mode button in the results-page search bar (test); local knowledge panels becoming AI Overviews; Search profiles redesigned.\n- **Google Ads:** spend benchmark report, product price optimization beta, commerce audience sharing, PMax option to land clicks on a Google-hosted Business Profile page.\n- **Measurement:** CrUX adds four ad metrics; Google Analytics dashboards; test of product listings linking straight to merchant sites.\n- **Bing** tested a shopping filter and human verification.\n- **Dreamforce:** AT&T and Crocs keep humans in the loop on agents (Adweek).\n- **AI labs' own referee:** OpenAI confirmed FINRA-style standards talks with Anthropic and Google; Dumfries House produced no binding commitments. [CNBC](https://www.cnbc.com/2026/09/15/open-ai-google-anthropic-safety.html)\n- **Cloudflare's Sept 15 change shipped** as noted last week.\n\n---\n\n## Common Threads\n\n### The answer became the ad slot\nSponsored Agents, sponsored links inside AI Mode answers, Business Agent inside YouTube ads. None came with a click-through benchmark.\n\n### Money is moving toward whoever shapes the answer\nGoogle pays for contribution, Profound valued at $1.8B, Europe's shelf space handed to comparison services. The price lists are private.\n\n### Supervision instead of surgery\nA six-year monitor over divestiture, TikTok's decree kept in force, a European remedy under watch.\n\n### Exposure gets measured; effect waits\nNovig's 911% spike with 4% about the app; a full August 17 read in mid-October; earnings with no method; AI insights with no clicks.\n\n---\n\n## Angles for the Week\n\n- **Outrage is a media plan now. Price it like one.** Cost per brand-attributable mention, not reach. Window: this week.\n- **The AEO category got priced. Know which half you're buying.** Measuring vs changing AI visibility. Window: through Sept 30.\n- **Budget is the lever now, not the target.** Find budget-limited campaigns; stop raising tROAS by reflex. Window: before Q4 budgets lock.\n- **Your content has two prices: the click and the contribution.** Groundable, fact-dense pages. Window: open.\n- **Prebid is about to get AdX demand.** Publisher prep for the Final Judgment. Window: Final Judgment plus 60 days.\n\n---\n\n*Monday Signal is a weekly AI and tech briefing for marketers, produced for the GrowthX team. Curated with AI assistance. Questions or suggestions? Reply to this message.*\n",
